  // ── Helpers ──
  const getCellProds=(cell)=>cellStock[cell]||[];
  const getCellTotal=(cell)=>getCellProds(cell).reduce((s,p)=>s+(parseFloat(p.totalQty)||0),0);
  const selCellProds=selectedCell?getCellProds(selectedCell):[];
  const selRackData=selectedRack?racks.find(r=>r.id===selectedRack):null;
  // Compact rack height on canvas — fixed 52px regardless of level count
  // Level detail is shown only in the right panel, not on the canvas itself
  const RACK_CANVAS_H = 52;

  if(!loaded)return <div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading warehouse layout…</div>;

  return <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
    {/* ── Stock Search — find where a product is stored ── */}
    <div style={{position:"relative"}}>
      <span style={{position:"absolute",left:"12px",top:"50%",transform:"translateY(-50%)",color:"#334155",fontSize:"15px",pointerEvents:"none"}}>🔍</span>
      <input style={{...inp,paddingLeft:"38px",paddingRight:stockSearch?"36px":"12px",fontSize:"13px"}}
        value={stockSearch} onChange={e=>setStockSearch(e.target.value)}
        placeholder="Search product to find rack & level…"/>
      {stockSearch&&<button onClick={()=>setStockSearch("")} style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#475569",fontSize:"18px",cursor:"pointer",lineHeight:1}}>×</button>}
    </div>

    {/* Search results — show all cells containing the searched product */}
    {stockSearch.trim().length>=2&&(()=>{
      const q=normalize(stockSearch);
      // Flatten all cell stock, filter by product name match, resolve rack names
      const results=[];
      Object.entries(cellStock).forEach(([cell,prods])=>{
        const [rackId,lv]=cell.split(".");
        const rack=racks.find(r=>r.id===rackId);
        prods.forEach(p=>{
          if(normalize(p.productName||"").includes(q)){
            results.push({...p, cell, rackName:rack?.name||rackId, level:lv});
          }
        });
      });
      results.sort((a,b)=>a.rackName.localeCompare(b.rackName)||parseInt(b.level)-parseInt(a.level));
      return <div style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"12px",overflow:"hidden"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",borderBottom:"1px solid #1e293b"}}>
          <span style={{fontSize:"12px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.07em"}}>
            {results.length>0?`${results.length} location${results.length!==1?"s":""} found`:"No stock found for this product"}
          </span>
          <span style={{fontSize:"11px",color:"#334155"}}>Click a row to jump to that level</span>
        </div>
        {results.length===0
          ?<div style={{padding:"16px",textAlign:"center",color:"#334155",fontSize:"12px",fontStyle:"italic"}}>
            "{stockSearch}" is not currently in stock on any rack
          </div>
          :<table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{background:"#0b1220"}}>
                {["Product","Rack","Level","Quantity"].map(h=><th key={h} style={{padding:"8px 14px",fontSize:"11px",fontWeight:"700",color:"#475569",textAlign:"left",textTransform:"uppercase",letterSpacing:"0.06em"}}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {results.map((r,i)=><tr key={r.id} onClick={()=>{setSelectedCell(r.cell);setExpandedRack(null);setSelectedRack(racks.find(x=>x.id===r.cell.split(".")[0])?.id||null);setStockSearch("");}}
                style={{borderTop:"1px solid #0f172a",cursor:"pointer",background:i%2===0?"#080d18":"transparent"}}
                onMouseEnter={e=>e.currentTarget.style.background="#0f1d35"}
                onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"#080d18":"transparent"}>
                <td style={{padding:"10px 14px",fontSize:"13px",color:"#e2e8f0",fontWeight:"500"}}>{r.productName}</td>
                <td style={{padding:"10px 14px",fontSize:"13px",color:"#93c5fd",fontWeight:"600"}}>{r.rackName}</td>
                <td style={{padding:"10px 14px"}}><span style={{background:"#1e3a5f",border:"1px solid #2563eb40",borderRadius:"6px",padding:"3px 10px",fontSize:"12px",color:"#93c5fd",fontWeight:"700"}}>L{r.level}</span></td>
                <td style={{padding:"10px 14px",fontSize:"14px",color:"#4ade80",fontWeight:"700"}}>{parseFloat(r.totalQty).toFixed(2)} <span style={{fontSize:"11px",color:"#166534"}}>{r.unit}</span></td>
              </tr>)}
            </tbody>
          </table>}
      </div>;
    })()}

    {/* ── Floor plan — full width ── */}
    <div ref={containerRef}>
      {/* Catalogue panel toggle */}
      <div style={{display:"flex",gap:"8px",marginBottom:"12px",borderBottom:"1px solid #1e293b",paddingBottom:"12px",flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:"12px",color:"#475569"}}>{fgProducts.length} products in catalogue</span>
        <Btn label={showCatalogue?"▲ Hide Catalogue":"📋 Product Catalogue"} onClick={()=>setShowCatalogue(v=>!v)} color="#3b82f6" outline small/>
        {canManage&&<>
          <Btn label="⬆ Import from Excel" onClick={()=>document.getElementById("fg-import-input").click()} color="#a855f7" outline small/>
          <input id="fg-import-input" type="file" accept=".xlsx" style={{display:"none"}} onChange={async e=>{if(e.target.files[0]){await loadXLSX();await importProducts(e.target.files[0]);e.target.value="";}}}/>
          <Btn label="📥 Download Add-Template" onClick={exportAddTemplate} color="#0ea5e9" outline small/>
          {fgProducts.length>0&&<Btn label="⬇ Export Catalogue" onClick={exportCatalogue} color="#64748b" outline small/>}
        </>}
      </div>

      {/* Catalogue panel */}
      {showCatalogue&&<div style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"12px",padding:"14px",marginBottom:"14px"}}>
        <div style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"10px",flexWrap:"wrap"}}>
          <input style={{...inp,flex:1,minWidth:"180px"}} value={catSearch} onChange={e=>setCatSearch(e.target.value)} placeholder="Search products…"/>
          {canManage&&<AddProductInline onAdd={async(p)=>{await C("fg_products").add({...p,importedAt:today()});showToast("Product added ✓");}} packConfig={packConfig.length>0?packConfig:null}/>}
          {importStatus&&<div style={{fontSize:"11px",color:"#4ade80"}}>Last import: {importStatus.added} added{importStatus.duplicate>0?`, ${importStatus.duplicate} duplicates`:""}{ importStatus.skipped>0?`, ${importStatus.skipped} skipped`:""}</div>}
        </div>
        {fgProducts.length===0?<div style={{textAlign:"center",padding:"20px",color:"#334155"}}>No products yet — import from Excel to populate</div>
        :<div style={{maxHeight:"260px",overflowY:"auto"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:"6px"}}>
            {fgProducts.filter(p=>!catSearch||normalize(p.name).includes(normalize(catSearch))||normalize(p.category||"").includes(normalize(catSearch))).slice(0,80).map(p=><div key={p.id} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"7px 10px"}}>
              <div style={{fontSize:"12px",color:"#e2e8f0",fontWeight:"500",marginBottom:"2px"}}>{p.name}</div>
              <div style={{fontSize:"10.5px",color:"#475569"}}>{p.category} · {p.tinsPerCarton} tins/carton · {p.size}{p.unit}</div>
            </div>)}
          </div>
        </div>}
      </div>}

      {/* Toolbar */}
      <div style={{display:"flex",gap:"8px",alignItems:"flex-start",marginBottom:"12px",flexWrap:"wrap"}}>
        {canManage&&mode==="view"&&<button onClick={()=>setMode("addRack")} style={{background:"#0f2d1a",border:"1px solid #166534",borderRadius:"8px",padding:"7px 14px",color:"#4ade80",fontWeight:"700",fontSize:"12.5px",cursor:"pointer"}}>+ Add Rack</button>}
        {mode==="addRack"&&<div style={{display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap",background:"#0a1a2e",border:"1px solid #1e3a5f",borderRadius:"10px",padding:"8px 12px"}}>
          <input style={{...inp,width:"130px",padding:"5px 8px",fontSize:"12px"}} value={newRack.name} onChange={e=>setNewRack({...newRack,name:e.target.value})} placeholder="Rack name"/>
          <select style={{...sl,padding:"5px 6px",fontSize:"12px",width:"90px"}} value={newRack.levels} onChange={e=>setNewRack({...newRack,levels:e.target.value})}>
            {[2,3,4,5,6,7,8].map(n=><option key={n} value={n}>{n} levels</option>)}
          </select>
          {/* Colour swatches — just for visual distinction, no product labelling */}
          <div style={{display:"flex",gap:"4px",alignItems:"center"}}>
            {["#c9956a","#0ea5e9","#eab308","#22c55e","#f97316","#a78bfa","#f43f5e","#64748b"].map(col=>
              <div key={col} onClick={()=>setNewRack({...newRack,color:col,label:""})}
                style={{width:"18px",height:"18px",borderRadius:"50%",background:col,cursor:"pointer",
                  border:newRack.color===col?"3px solid #fff":"2px solid transparent",flexShrink:0}}/>
            )}
          </div>
          <span style={{fontSize:"12px",color:"#22d3ee",fontWeight:"700"}}>→ drag on canvas to draw</span>
          <button onClick={()=>setMode("view")} style={{background:"none",border:"1px solid #334155",borderRadius:"5px",color:"#64748b",fontSize:"11px",padding:"4px 8px",cursor:"pointer"}}>Cancel</button>
        </div>}
        {selectedRack&&canManage&&mode==="view"&&<>
          <button onClick={()=>copyRack(selectedRack)} style={{background:"#0f1d35",border:"1px solid #1e3a5f",borderRadius:"7px",padding:"6px 12px",color:"#93c5fd",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>📋 Copy</button>
          <button onClick={()=>{const r=racks.find(x=>x.id===selectedRack);if(r){setRenamingRack(selectedRack);setRenameVal(r.name);}}} style={{background:"#0f1d35",border:"1px solid #1e3a5f",borderRadius:"7px",padding:"6px 12px",color:"#fcd34d",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>✏️ Rename</button>
          <button onClick={()=>setEditingRackColour(editingRackColour===selectedRack?null:selectedRack)} style={{background:"#0f1d35",border:"1px solid #1e3a5f",borderRadius:"7px",padding:"6px 12px",color:"#a78bfa",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>🎨 Colour</button>
          <button onClick={()=>deleteRack(selectedRack)} style={{background:"#2e0a0a",border:"1px solid #7f1d1d",borderRadius:"7px",padding:"6px 12px",color:"#f87171",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>🗑 Remove</button>
          <button onClick={()=>{setSelectedRack(null);setSelectedCell(null);setExpandedRack(null);}} style={{background:"none",border:"1px solid #334155",borderRadius:"7px",padding:"6px 12px",color:"#475569",fontSize:"12px",cursor:"pointer"}}>✕</button>
        </>}
        {copiedRack&&canManage&&mode==="view"&&<button onClick={pasteRack} style={{background:"#0f2d1a",border:"1px solid #166534",borderRadius:"8px",padding:"7px 14px",color:"#4ade80",fontWeight:"700",fontSize:"12.5px",cursor:"pointer"}}>📌 Paste "{copiedRack.name}"</button>}
        {/* Inline rename input */}
        {renamingRack&&<div style={{display:"flex",gap:"6px",alignItems:"center",background:"#0a1a2e",border:"1px solid #fcd34d60",borderRadius:"10px",padding:"6px 10px"}}>
          <input style={{...inp,width:"160px",padding:"5px 8px",fontSize:"13px",fontWeight:"700",borderColor:"#fcd34d60"}} value={renameVal} onChange={e=>setRenameVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")commitRename();if(e.key==="Escape"){setRenamingRack(null);}}} autoFocus/>
          <button onClick={commitRename} style={{background:"#0f2d1a",border:"1px solid #166534",borderRadius:"5px",padding:"5px 10px",color:"#4ade80",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>✓</button>
          <button onClick={()=>setRenamingRack(null)} style={{background:"none",border:"1px solid #334155",borderRadius:"5px",padding:"5px 8px",color:"#475569",fontSize:"11px",cursor:"pointer"}}>✕</button>
        </div>}
        {/* Inline colour picker */}
        {editingRackColour&&<div style={{display:"flex",gap:"6px",alignItems:"center",background:"#1a0a2e",border:"1px solid #a78bfa60",borderRadius:"10px",padding:"6px 12px",flexWrap:"wrap"}}>
          <span style={{fontSize:"11.5px",color:"#a78bfa",fontWeight:"700"}}>🎨 Colour:</span>
          {["#c9956a","#0ea5e9","#eab308","#22c55e","#f97316","#a78bfa","#f43f5e","#64748b","#06b6d4","#ec4899","#fcd34d","#94a3b8"].map(col=>{
            const isActive=racks.find(r=>r.id===editingRackColour)?.color===col;
            return <div key={col} onClick={async()=>{const updated=racks.map(r=>r.id===editingRackColour?{...r,color:col}:r);await saveRacks(updated);}}
              style={{width:"22px",height:"22px",borderRadius:"50%",background:col,cursor:"pointer",border:isActive?"3px solid #fff":"2px solid transparent",flexShrink:0}}/>;
          })}
          <button onClick={()=>setEditingRackColour(null)} style={{background:"none",border:"none",color:"#475569",fontSize:"14px",cursor:"pointer",marginLeft:"4px"}}>✕</button>
        </div>}
        {isAdmin&&mode==="view"&&<button onClick={()=>{setMode("editPillars");setSelectedPillar(null);setSelectedStruct(null);}} style={{background:"#1a0a1a",border:"1px solid #7c3aed",borderRadius:"8px",padding:"7px 14px",color:"#c4b5fd",fontWeight:"700",fontSize:"12.5px",cursor:"pointer"}}>🗺 Edit Layout</button>}
        {mode==="editPillars"&&<div style={{display:"flex",gap:"8px",alignItems:"center",background:"#1a0a1a",border:"1px solid #7c3aed",borderRadius:"10px",padding:"8px 12px",flexWrap:"wrap"}}>
          <span style={{fontSize:"12px",color:"#c4b5fd",fontWeight:"700"}}>🗺 Layout Edit — drag racks to move · corner handle to resize · click canvas for pillar · drag walls</span>
          {selectedPillar&&<button onClick={async()=>{await savePillars(pillars.filter(p=>p.id!==selectedPillar));setSelectedPillar(null);showToast("Pillar removed","error");}} style={{background:"#2e0a0a",border:"1px solid #7f1d1d",borderRadius:"5px",padding:"4px 10px",color:"#f87171",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>🗑 Delete pillar</button>}
          {selectedStruct&&<button onClick={async()=>{await saveStructure(DEFAULT_STRUCTURE);showToast("Layout reset to defaults");setSelectedStruct(null);}} style={{background:"#2e1a00",border:"1px solid #92400e",borderRadius:"5px",padding:"4px 10px",color:"#fcd34d",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>↺ Reset all to default</button>}
          <button onClick={async()=>{setMode("view");setSelectedPillar(null);setSelectedStruct(null);await saveStructure(structure);await savePillars(pillars);showToast("Layout saved ✓");}} style={{background:"#0f2d1a",border:"1px solid #166534",borderRadius:"5px",padding:"4px 10px",color:"#4ade80",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>✓ Done & Save</button>
        </div>}
      </div>

      {/* Canvas */}
      {/* Zoom controls */}
      <div style={{display:"flex",gap:"6px",alignItems:"center",marginBottom:"8px",flexWrap:"wrap"}}>
        <span style={{fontSize:"11px",color:"#475569",fontWeight:"600"}}>Zoom:</span>
        <button onClick={()=>setUserZoom(z=>Math.min(MAX_ZOOM,parseFloat((z+0.2).toFixed(1))))} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:"5px",color:"#94a3b8",width:"28px",height:"28px",fontSize:"16px",cursor:"pointer",lineHeight:1}}>+</button>
        <span style={{fontSize:"12px",color:"#475569",minWidth:"36px",textAlign:"center"}}>{Math.round(userZoom*100)}%</span>
        <button onClick={()=>setUserZoom(z=>Math.max(MIN_ZOOM,parseFloat((z-0.2).toFixed(1))))} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:"5px",color:"#94a3b8",width:"28px",height:"28px",fontSize:"16px",cursor:"pointer",lineHeight:1}}>−</button>
        <button onClick={()=>setUserZoom(1.0)} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:"6px",color:"#64748b",fontSize:"11px",padding:"4px 8px",cursor:"pointer"}}>Reset</button>
        <span style={{fontSize:"10px",color:"#334155"}}>· Pinch to zoom · Scroll/drag to pan</span>
      </div>

      {/* Scrollable canvas wrapper — native scroll = free pan on mobile/tablet */}
      <div style={{overflowX:"auto",overflowY:"auto",WebkitOverflowScrolling:"touch",
        borderRadius:"10px",border:"2px solid #1e3a5f",maxHeight:"70vh",cursor:"default"}}
        onWheel={e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();const delta=e.deltaY>0?-0.1:0.1;setUserZoom(z=>Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,parseFloat((z+delta).toFixed(1)))));}}}
        onTouchStart={e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;e.currentTarget._pinchDist=Math.sqrt(dx*dx+dy*dy);e.currentTarget._pinchZoom=userZoom;}}}
        onTouchMove={e=>{if(e.touches.length===2&&e.currentTarget._pinchDist){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;const dist=Math.sqrt(dx*dx+dy*dy);const ratio=dist/e.currentTarget._pinchDist;const newZ=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,e.currentTarget._pinchZoom*ratio));setUserZoom(parseFloat(newZ.toFixed(2)));}}} >

      <div ref={canvasRef} onClick={onFloorClick}
        onPointerDown={onCanvasPointerDown}
        onPointerMove={onCanvasPointerMove}
        onPointerUp={onCanvasPointerUp}
        style={{position:"relative",width:`${FLOOR_W*scale}px`,height:`${FLOOR_H*scale}px`,
          background:"#080d18",flexShrink:0,
          cursor:mode==="addRack"?"crosshair":"default",
          backgroundImage:"radial-gradient(circle,#1e293b 1px,transparent 1px)",
          backgroundSize:`${GRID*scale}px ${GRID*scale}px`}}>

        {/* ── Structural elements — drag+resize in editPillars mode, static otherwise ── */}
        {structure.map(el=>{
          const isEditMode=mode==="editPillars";
          const isSel=selectedStruct===el.id;
          const HANDLE=Math.max(8,10*scale);
          return <div key={el.id}
            style={{position:"absolute",left:el.x*scale,top:el.y*scale,
              width:el.w*scale,height:el.h*scale,
              background:el.fill,border:`${isSel?"2px solid #fcd34d":"1px solid #334155"}`,
              borderRadius:"4px",display:"flex",alignItems:"center",justifyContent:"center",
              pointerEvents:isEditMode?"auto":"none",
              cursor:isEditMode?"move":"default",zIndex:isEditMode?4:1,overflow:"visible"}}
            onClick={e=>{if(!isEditMode)return;e.stopPropagation();setSelectedStruct(isSel?null:el.id);setSelectedPillar(null);}}
            onPointerDown={e=>{
              if(!isEditMode||!isAdmin)return;
              e.stopPropagation();
              e.currentTarget.setPointerCapture(e.pointerId);
              setStructDrag({id:el.id,origX:el.x,origY:el.y,origW:el.w,origH:el.h,startPX:e.clientX,startPY:e.clientY,resizing:null});
            }}
            onPointerMove={e=>{
              if(!structDrag||structDrag.id!==el.id)return;
              const dx=(e.clientX-structDrag.startPX)/scale;
              const dy=(e.clientY-structDrag.startPY)/scale;
              if(structDrag.resizing==="se"){
                const nw=Math.max(40,snapToGrid(structDrag.origW+dx));
                const nh=Math.max(30,snapToGrid(structDrag.origH+dy));
                setStructure(prev=>prev.map(s=>s.id===el.id?{...s,w:nw,h:nh}:s));
              }else{
                const nx=Math.max(0,Math.min(FLOOR_W-el.w,snapToGrid(structDrag.origX+dx)));
                const ny=Math.max(0,Math.min(FLOOR_H-el.h,snapToGrid(structDrag.origY+dy)));
                setStructure(prev=>prev.map(s=>s.id===el.id?{...s,x:nx,y:ny}:s));
              }
            }}
            onPointerUp={async e=>{
              if(!structDrag||structDrag.id!==el.id)return;
              setStructDrag(null);
              await saveStructure(structure);
            }}>
            <span style={{fontSize:`${Math.max(9,12*scale)}px`,fontWeight:"700",color:el.textColor,textAlign:"center",pointerEvents:"none"}}>{el.label}</span>
            {/* Resize handle — bottom-right corner, only when selected in edit mode */}
            {isEditMode&&isSel&&<div
              onPointerDown={e=>{e.stopPropagation();e.currentTarget.parentElement.setPointerCapture(e.pointerId);setStructDrag({id:el.id,origX:el.x,origY:el.y,origW:el.w,origH:el.h,startPX:e.clientX,startPY:e.clientY,resizing:"se"});}}
              style={{position:"absolute",right:`-${HANDLE/2}px`,bottom:`-${HANDLE/2}px`,
                width:`${HANDLE}px`,height:`${HANDLE}px`,
                background:"#fcd34d",borderRadius:"50%",cursor:"se-resize",zIndex:10}}>
            </div>}
          </div>;
        })}

        {/* ── Drawing preview ── */}
        {drawing&&(()=>{
          const w=Math.abs(drawing.curX-drawing.startX);
          const h=Math.abs(drawing.curY-drawing.startY);
          const x=Math.min(drawing.startX,drawing.curX);
          const y=Math.min(drawing.startY,drawing.curY);
          return <div style={{position:"absolute",left:x*scale,top:y*scale,width:w*scale,height:h*scale,
            border:`2px dashed ${newRack.color}`,background:newRack.color+"22",
            borderRadius:"5px",pointerEvents:"none",display:"flex",alignItems:"center",justifyContent:"center"}}>
            {w>30&&h>16&&<span style={{fontSize:"11px",color:newRack.color,fontWeight:"700"}}>{newRack.name||"New Rack"}</span>}
          </div>;
        })()}

        {/* ── Draggable + Resizable racks ── */}
        {racks.map(rack=>{
          const isSelRack=selectedRack===rack.id||expandedRack===rack.id;
          const rh=(rack.h||RACK_CANVAS_H)*scale;
          const rw=rack.w*scale;
          const levelsWithStock=Array.from({length:rack.levels},(_,i)=>i+1).filter(lv=>getCellTotal(`${rack.id}.${lv}`)>0).length;
          const hasAnyStock=levelsWithStock>0;
          const HANDLE=Math.max(8,10*scale); // resize handle size in px
          return <div key={rack.id}
            onPointerDown={e=>onRackPointerDown(e,rack)}
            onPointerMove={e=>onRackPointerMove(e,rack)}
            onPointerUp={e=>onRackPointerUp(e,rack)}
            onClick={e=>{e.stopPropagation();if(!dragging){setExpandedRack(rack.id);setSelectedCell(null);setSelectedRack(rack.id);}}}
            style={{position:"absolute",left:rack.x*scale,top:rack.y*scale,
              width:rw,height:rh,
              border:`${isSelRack?"3px solid #3b82f6":"2px solid "+rack.color+"80"}`,
              borderRadius:"6px",overflow:"visible",
              background:hasAnyStock?"#052e16":"#0b1220",
              boxShadow:isSelRack?`0 0 14px ${rack.color}50`:`0 0 4px ${rack.color}20`,
              cursor:canManage?"grab":"pointer",
              userSelect:"none",touchAction:"none"}}>
            {/* Content */}
            <div style={{position:"absolute",inset:0,overflow:"hidden",borderRadius:"4px",
              display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:`${1*scale}px`}}>
              <div style={{position:"absolute",top:0,left:0,right:0,height:`${5*scale}px`,background:rack.color,borderRadius:"4px 4px 0 0"}}/>
              <div style={{fontSize:`${Math.max(8,10*scale)}px`,fontWeight:"700",color:"#f1f5f9",
                textAlign:"center",lineHeight:1.1,padding:`${7*scale}px ${4*scale}px 0`,
                whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",width:"100%"}}>
                {rack.name}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:`${3*scale}px`}}>
                <span style={{fontSize:`${Math.max(7,9*scale)}px`,color:rack.color,fontWeight:"700",background:rack.color+"22",
                  padding:`${1*scale}px ${3*scale}px`,borderRadius:"4px"}}>L{rack.levels}</span>
                {hasAnyStock&&<span style={{fontSize:`${Math.max(7,8*scale)}px`,color:"#4ade80",fontWeight:"700"}}>
                  {levelsWithStock}/{rack.levels}
                </span>}
              </div>
            </div>
            {/* Resize handles — only shown when selected */}
            {isSelRack&&canManage&&<>
              {/* Right-edge handle */}
              <div onPointerDown={e=>{e.stopPropagation();onRackPointerDown(e,rack,"e");}}
                style={{position:"absolute",right:`-${HANDLE/2}px`,top:`${rh/2-HANDLE}px`,
                  width:`${HANDLE}px`,height:`${HANDLE*2}px`,
                  background:"#3b82f6",borderRadius:"3px",cursor:"ew-resize",zIndex:10,
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                <div style={{width:"2px",height:"60%",background:"#fff",borderRadius:"1px",margin:"0 1px"}}/>
                <div style={{width:"2px",height:"60%",background:"#fff",borderRadius:"1px",margin:"0 1px"}}/>
              </div>
              {/* Bottom-right corner handle */}
              <div onPointerDown={e=>{e.stopPropagation();onRackPointerDown(e,rack,"se");}}
                style={{position:"absolute",right:`-${HANDLE/2}px`,bottom:`-${HANDLE/2}px`,
                  width:`${HANDLE}px`,height:`${HANDLE}px`,
                  background:"#3b82f6",borderRadius:"50%",cursor:"se-resize",zIndex:10}}>
              </div>
            </>}
          </div>;
        })}

        {/* ── Pillars — non-interactive outside editPillars mode ── */}
        {pillars.map(p=>{
          const isEditMode=mode==="editPillars";
          const isSel=selectedPillar===p.id;
          return <div key={p.id}
            style={{position:"absolute",left:p.x*scale,top:p.y*scale,
              width:p.w*scale,height:p.h*scale,
              background:isSel?"#6d28d9":"#4b5563",
              border:`2px solid ${isSel?"#c4b5fd":"#6b7280"}`,
              borderRadius:"3px",
              boxShadow:isEditMode?"0 0 6px #7c3aed50":"none",
              pointerEvents:isEditMode?"auto":"none", // KEY: invisible to clicks outside edit mode
              cursor:isEditMode?"move":"default",
              zIndex:isEditMode?5:1,
            }}
            onClick={e=>{if(!isEditMode)return;e.stopPropagation();setSelectedPillar(isSel?null:p.id);}}
            onPointerDown={e=>{
              if(!isEditMode||!isAdmin)return;
              e.stopPropagation();
              e.currentTarget.setPointerCapture(e.pointerId);
              setPillarDrag({pillarId:p.id,origX:p.x,origY:p.y,startPX:e.clientX,startPY:e.clientY});
            }}
            onPointerMove={e=>{
              if(!pillarDrag||pillarDrag.pillarId!==p.id)return;
              const dx=(e.clientX-pillarDrag.startPX)/scale;
              const dy=(e.clientY-pillarDrag.startPY)/scale;
              const nx=Math.max(0,Math.min(FLOOR_W-p.w,snapToGrid(pillarDrag.origX+dx)));
              const ny=Math.max(0,Math.min(FLOOR_H-p.h,snapToGrid(pillarDrag.origY+dy)));
              setPillars(prev=>prev.map(pp=>pp.id===p.id?{...pp,x:nx,y:ny}:pp));
            }}
            onPointerUp={async e=>{
              if(!pillarDrag||pillarDrag.pillarId!==p.id)return;
              setPillarDrag(null);
              await savePillars(pillars);
            }}
          />;
        })}
        {/* Count hint */}
        <div style={{position:"absolute",bottom:"6px",right:"8px",fontSize:"10px",color:"#1e293b"}}>
          {racks.length} rack{racks.length!==1?"s":""}{pillars.length>0?` · ${pillars.length} pillars`:""}
        </div>
      </div>
      </div>{/* end scroll wrapper */}
      <div style={{display:"flex",gap:"12px",flexWrap:"wrap",marginTop:"8px"}}>
        {[["Coloured top stripe","Product category colour"],["L4 badge","Number of levels"],["2/4 (green)","Levels with stock"],].map(([k,v])=><div key={k} style={{fontSize:"10px",color:"#334155"}}><span style={{color:"#475569",fontWeight:"600"}}>{k}</span>: {v}</div>)}
        {canManage&&<span style={{fontSize:"10px",color:"#334155"}}>· Click rack to see levels · Use 🗺 Edit Layout to move/resize racks</span>}
        {isAdmin&&<span style={{fontSize:"10px",color:"#6d28d9"}}>· 🗺 Edit Layout to reposition walls/pillars</span>}
      </div>
    </div>

    {/* ── DETAIL PANEL — below canvas, full width ── */}
    {(selectedCell||expandedRack||selRackData)&&<div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"12px",padding:"14px"}}>
      {expandedRack&&!selectedCell&&(()=>{
        const rack=racks.find(r=>r.id===expandedRack);
        if(!rack)return null;
        return <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
            <div style={{fontSize:"15px",fontWeight:"700",color:"#f1f5f9"}}>{rack.name} <span style={{fontSize:"12px",fontWeight:"400",color:"#475569"}}>— tap a level to view or update stock</span></div>
            <button onClick={()=>{setExpandedRack(null);setSelectedRack(null);}} style={{background:"none",border:"none",color:"#334155",fontSize:"18px",cursor:"pointer",lineHeight:1}}>×</button>
          </div>
          {/* Horizontal row of level cards — works well on tablet */}
          <div style={{display:"grid",gridTemplateColumns:`repeat(${rack.levels},1fr)`,gap:"8px"}}>
            {Array.from({length:rack.levels},(_,i)=>rack.levels-i).map(lv=>{
              const cellKey=`${rack.id}.${lv}`;
              const prods=getCellProds(cellKey);
              const total=getCellTotal(cellKey);
              return <div key={lv} onClick={()=>{setSelectedCell(cellKey);setExpandedRack(null);}}
                style={{background:total>0?"#052e16":"#080d18",border:`1px solid ${total>0?"#166534":"#1e293b"}`,
                borderRadius:"10px",padding:"10px 12px",cursor:"pointer",transition:"background 0.1s",minWidth:0}}
                onMouseEnter={e=>e.currentTarget.style.background=total>0?"#064d20":"#0b1220"}
                onMouseLeave={e=>e.currentTarget.style.background=total>0?"#052e16":"#080d18"}>
                <div style={{fontSize:"13px",fontWeight:"700",color:total>0?"#4ade80":"#475569",marginBottom:"4px"}}>Level {lv}</div>
                {total>0
                  ?<>{prods.slice(0,2).map(p=>{
                    const hasCartons=p.cartons!=null;
                    return <div key={p.id} style={{marginTop:"3px"}}>
                      <div style={{fontSize:"10px",color:"#64748b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.productName}</div>
                      {hasCartons
                        ?<div style={{fontSize:"12px",fontWeight:"700",color:"#4ade80"}}>{parseInt(p.cartons)||0}C{(parseInt(p.looseTins)||0)>0?` + ${parseInt(p.looseTins)}T`:""}</div>
                        :<div style={{fontSize:"12px",fontWeight:"700",color:"#4ade80"}}>{parseFloat(p.totalQty).toFixed(1)} {p.unit}</div>}
                    </div>;
                  })}
                  {prods.length>2&&<div style={{fontSize:"10px",color:"#475569"}}>+{prods.length-2} more</div>}
                  </>
                  :<div style={{fontSize:"11px",color:"#334155",fontStyle:"italic"}}>empty</div>}
              </div>;
            })}
          </div>
          {canManage&&<div style={{marginTop:"10px",fontSize:"11px",color:"#475569",textAlign:"center"}}>Tap any level card above to add or consume stock</div>}
        </>;
      })()}
      {selectedCell&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px"}}>
          <div>
            <div style={{fontSize:"11px",color:"#475569",fontWeight:"600",textTransform:"uppercase",letterSpacing:"0.08em"}}>Location</div>
            <div style={{fontSize:"18px",fontWeight:"700",color:"#f1f5f9",marginTop:"2px"}}>
              {selRackData?.name||"—"} · Level {selectedCell.split(".")[1]}
            </div>
            <button onClick={()=>{setSelectedCell(null);setExpandedRack(selRackData?.id);}} style={{background:"none",border:"none",color:"#3b82f6",fontSize:"11px",cursor:"pointer",padding:0,marginTop:"2px"}}>← Back to all levels</button>
          </div>
          {canManage&&<div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
            <button onClick={()=>openTxn(selectedCell,"add")} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",color:"#4ade80",fontSize:"13px",fontWeight:"700",padding:"8px 16px",cursor:"pointer"}}>+ Add Stock</button>
            {selCellProds.length>0&&<button onClick={()=>openTxn(selectedCell,"consume")} style={{background:"#2e0a0a",border:"1px solid #7f1d1d",borderRadius:"7px",color:"#f87171",fontSize:"13px",fontWeight:"700",padding:"8px 16px",cursor:"pointer"}}>− Consume</button>}
            {selCellProds.length>0&&<button onClick={()=>{setTransferModal({cell:selectedCell,product:selCellProds[0]});setTransferForm({cartons:"",looseTins:"",destRackId:"",destLevel:"1"});}} style={{background:"#0a1a2e",border:"1px solid #2563eb",borderRadius:"7px",color:"#93c5fd",fontSize:"13px",fontWeight:"700",padding:"8px 16px",cursor:"pointer"}}>↔ Transfer</button>}
          </div>}
        </div>
        {selCellProds.length===0
          ?<div style={{textAlign:"center",padding:"16px 0",color:"#334155",fontSize:"12.5px",fontStyle:"italic"}}>Empty — nothing stored here yet</div>
          :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:"8px"}}>
            {selCellProds.map(p=>{
              const isEditing=editStockEntry?.id===p.id;
              const canEdit=canEditStock(p);
              const modAge=p.lastModifiedAt||p._createdAt;
              const modAgeMs=modAge?.toMillis?modAge.toMillis():modAge?.seconds?modAge.seconds*1000:null;
              const hoursAgo=modAgeMs?Math.floor((Date.now()-modAgeMs)/3600000):null;
              return <div key={p.id} style={{background:"#080d18",border:`1px solid ${isEditing?"#fcd34d60":"#1e293b"}`,borderRadius:"8px",padding:"10px 12px"}}>
                {isEditing?<>
                  <div style={{fontSize:"10px",color:"#fcd34d",fontWeight:"700",marginBottom:"6px",textTransform:"uppercase",letterSpacing:"0.07em"}}>✏️ Edit Entry</div>
                  <input style={{...inp,fontSize:"12px",padding:"5px 8px",marginBottom:"6px",width:"100%"}} value={editStockForm.productName} onChange={e=>setEditStockForm({...editStockForm,productName:e.target.value})} placeholder="Product name"/>
                  <div style={{display:"flex",gap:"6px",marginBottom:"8px"}}>
                    <input style={{...inp,fontSize:"12px",padding:"5px 8px",flex:1}} type="number" min="0" step="0.001" value={editStockForm.totalQty} onChange={e=>setEditStockForm({...editStockForm,totalQty:e.target.value})} placeholder="Qty"/>
                    <input style={{...inp,fontSize:"12px",padding:"5px 8px",width:"50px"}} value={editStockForm.unit} onChange={e=>setEditStockForm({...editStockForm,unit:e.target.value})} placeholder="L"/>
                  </div>
                  <div style={{fontSize:"10px",color:"#475569",marginBottom:"6px"}}>{isAdmin?"Admin: set any qty directly. Set 0 to delete entry. No transaction logged.":"Set qty to 0 to remove entry"}</div>
                  <div style={{display:"flex",gap:"6px"}}>
                    <button onClick={saveStockEdit} disabled={editStockSaving} style={{flex:1,background:"#0f2d1a",border:"1px solid #166534",borderRadius:"5px",color:"#4ade80",fontSize:"11px",fontWeight:"700",padding:"5px",cursor:"pointer"}}>{editStockSaving?"…":"✓ Save"}</button>
                    <button onClick={()=>setEditStockEntry(null)} style={{flex:1,background:"none",border:"1px solid #334155",borderRadius:"5px",color:"#475569",fontSize:"11px",padding:"5px",cursor:"pointer"}}>✕ Cancel</button>
                  </div>
                </>:<>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"4px"}}>
                    <div style={{fontSize:"12px",fontWeight:"600",color:"#e2e8f0",flex:1,marginRight:"6px"}}>{p.productName}</div>
                    {canManage&&selCellProds.length>1&&<button onClick={()=>{setTransferModal({cell:selectedCell,product:p});setTransferForm({cartons:"",looseTins:"",destRackId:"",destLevel:"1"});}}
                      style={{background:"none",border:"1px solid #1e3a5f",borderRadius:"4px",color:"#93c5fd",fontSize:"10px",padding:"2px 6px",cursor:"pointer",flexShrink:0}}>↔</button>}
                    {canEdit&&<button onClick={()=>{setEditStockEntry(p);setEditStockForm({productName:p.productName,totalQty:String(p.totalQty),unit:p.unit||"L"});}}
                      style={{background:"none",border:"1px solid #334155",borderRadius:"4px",color:"#64748b",fontSize:"10px",padding:"2px 6px",cursor:"pointer",flexShrink:0}}>✏️</button>}
                  </div>
                  <div style={{fontSize:"18px",fontWeight:"700",color:"#4ade80"}}>
                    {p.cartons!=null
                      ?<>{parseInt(p.cartons)||0}<span style={{fontSize:"11px",color:"#166534",marginLeft:"3px"}}>cartons</span>{(parseInt(p.looseTins)||0)>0&&<> + {parseInt(p.looseTins)}<span style={{fontSize:"11px",color:"#166534",marginLeft:"3px"}}>loose tins</span></>}</>
                      :<>{parseFloat(p.totalQty).toFixed(2)}<span style={{fontSize:"11px",color:"#166534",marginLeft:"3px"}}>{p.unit}</span></>}
                  </div>
                  {p.cartons!=null&&p.tinsPerCarton&&p.sizePerTin&&<div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>= {((parseInt(p.cartons||0)*p.tinsPerCarton+(parseInt(p.looseTins)||0))*p.sizePerTin).toFixed(2)} {p.unit} total</div>}
                  {!isAdmin&&canEdit&&hoursAgo!==null&&<div style={{fontSize:"9px",color:"#334155",marginTop:"2px"}}>Editable for {23-hoursAgo}h more</div>}
                </>}
              </div>;
            })}
          </div>}
      </>}
      {!selectedCell&&!expandedRack&&selRackData&&<div style={{textAlign:"center",color:"#334155",fontSize:"12px"}}>Tap the rack again to see level detail</div>}
    </div>}

    {/* ── TRANSFER MODAL ── */}
    {transferModal&&(()=>{
      const {cell,product}=transferModal;
      const srcRackId=cell.split(".")[0];
      const srcLevel=cell.split(".")[1];
      const srcRack=racks.find(r=>r.id===srcRackId);
      const destRack=racks.find(r=>r.id===transferForm.destRackId);
      const tpc=product.tinsPerCarton||0;
      const sizePerTin=product.sizePerTin||0;
      const moveC=parseInt(transferForm.cartons)||0;
      const moveL=parseInt(transferForm.looseTins)||0;
      const srcC=parseInt(product.cartons)||0;
      const srcL=parseInt(product.looseTins)||0;
      const remainC=srcC-moveC;
      const remainL=srcL-moveL;
      const validMove=moveC+moveL>0&&remainC>=0&&remainL>=0;
      return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"14px",padding:"22px",width:"min(460px,96vw)",maxHeight:"90vh",overflowY:"auto"}}>
          <div style={{fontSize:"15px",fontWeight:"700",color:"#93c5fd",marginBottom:"4px"}}>↔ Transfer Stock</div>
          <div style={{fontSize:"12px",color:"#64748b",marginBottom:"14px"}}>{product.productName}</div>
          {/* Source → Destination visual */}
          <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"14px",flexWrap:"wrap"}}>
            <div style={{background:"#080d18",border:"1px solid #1e293b",borderRadius:"8px",padding:"8px 12px",flex:1,textAlign:"center"}}>
              <div style={{fontSize:"10px",color:"#475569",marginBottom:"2px"}}>FROM</div>
              <div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9"}}>{srcRack?.name||srcRackId} · L{srcLevel}</div>
              <div style={{fontSize:"12px",color:"#4ade80"}}>{srcC}C + {srcL}T</div>
            </div>
            <div style={{fontSize:"20px",color:"#3b82f6"}}>→</div>
            <div style={{background:"#080d18",border:`1px solid ${transferForm.destRackId?"#2563eb":"#1e293b"}`,borderRadius:"8px",padding:"8px 12px",flex:1,textAlign:"center"}}>
              <div style={{fontSize:"10px",color:"#475569",marginBottom:"2px"}}>TO</div>
              <div style={{fontSize:"13px",fontWeight:"700",color:transferForm.destRackId?"#93c5fd":"#334155"}}>{destRack?`${destRack.name} · L${transferForm.destLevel}`:"Select below →"}</div>
            </div>
          </div>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"8px"}}>How much to move?</div>
          <Grid2>
            <Field label={`Cartons (max ${srcC})`}>
              <input style={inp} type="number" min="0" max={srcC} step="1" value={transferForm.cartons} onChange={e=>setTransferForm({...transferForm,cartons:e.target.value})} placeholder="0"/>
            </Field>
            <Field label={`Loose Tins (max ${srcL})`}>
              <input style={inp} type="number" min="0" max={srcL} step="1" value={transferForm.looseTins} onChange={e=>setTransferForm({...transferForm,looseTins:e.target.value})} placeholder="0"/>
            </Field>
          </Grid2>
          {validMove&&<div style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"7px",padding:"8px 12px",marginBottom:"12px",fontSize:"12px"}}>
            <div style={{color:"#f87171"}}>Source remaining: {remainC} cartons + {remainL} loose tins</div>
            <div style={{color:"#4ade80"}}>Destination gets: +{moveC} cartons + {moveL} loose tins</div>
          </div>}
          <Field label="Destination Rack">
            <select style={sl} value={transferForm.destRackId} onChange={e=>setTransferForm({...transferForm,destRackId:e.target.value,destLevel:"1"})}>
              <option value="">— Select rack —</option>
              {racks.filter(r=>r.id!==srcRackId).map(r=><option key={r.id} value={r.id}>{r.name} ({r.levels} levels)</option>)}
            </select>
          </Field>
          {destRack&&<Field label="Destination Level">
            <select style={sl} value={transferForm.destLevel} onChange={e=>setTransferForm({...transferForm,destLevel:e.target.value})}>
              {Array.from({length:destRack.levels},(_,i)=>destRack.levels-i).map(l=><option key={l} value={l}>Level {l}{getCellTotal(`${destRack.id}.${l}`)>0?" (has stock)":""}</option>)}
            </select>
          </Field>}
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"12px"}}>
            <Btn label="Cancel" onClick={()=>setTransferModal(null)} outline color="#475569" small/>
            <Btn label={saving?"Saving…":"↔ Confirm Transfer"} onClick={saveTransfer} disabled={saving||!validMove||!transferForm.destRackId} color="#3b82f6" small/>
          </div>
        </div>
      </div>;
    })()}

    {/* ── TRANSACTION MODAL ── */}
    {txnModal&&(()=>{
      const cellProds=getCellProds(txnModal.cell);
      const selProd=txn.productName?fgProducts.find(p=>normalize(p.name)===normalize(txn.productName)):null;
      const display=selProd?calcDisplay(selProd,txn.cartons,txn.looseTins):null;
      const rackName=(()=>{const [rid,lv]=txnModal.cell.split(".");const r=racks.find(x=>x.id===rid);return `${r?.name||rid} · Level ${lv}`;})();
      return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"14px",padding:"22px",width:"min(460px,96vw)",maxHeight:"90vh",overflowY:"auto"}}>
          <div style={{fontSize:"15px",fontWeight:"700",color:txnModal.mode==="add"?"#4ade80":"#f87171",marginBottom:"2px"}}>
            {txnModal.mode==="add"?"+ Add Stock to":"− Consume from"} <span style={{color:"#93c5fd"}}>{rackName}</span>
          </div>
          {txnModal.mode==="consume"&&cellProds.length>0&&<div style={{background:"#080d18",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 12px",marginBottom:"12px",marginTop:"10px"}}>
            <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",marginBottom:"6px"}}>Current stock here</div>
            {cellProds.map(p=><div key={p.id} style={{display:"flex",justifyContent:"space-between",fontSize:"12.5px",padding:"3px 0"}}>
              <span style={{color:"#e2e8f0"}}>{p.productName}</span>
              <span style={{color:"#4ade80",fontWeight:"700"}}>{parseFloat(p.totalQty).toFixed(2)} {p.unit}</span>
            </div>)}
          </div>}
          <Field label="Product *">
            <input style={inp} value={txn.productName} onChange={e=>setTxn({...txn,productName:e.target.value})} placeholder="Type to search catalogue or enter manually…"/>
            {/* Product quick-select from current cell (consume) or catalogue search */}
            {txn.productName.length>=2&&fgProducts.filter(p=>normalize(p.name).includes(normalize(txn.productName))).slice(0,6).length>0&&<div style={{border:"1px solid #1e293b",borderRadius:"6px",background:"#080d18",marginTop:"4px"}}>
              {fgProducts.filter(p=>normalize(p.name).includes(normalize(txn.productName))).slice(0,6).map(p=><div key={p.id} onClick={()=>setTxn({...txn,productName:p.name})} style={{padding:"6px 10px",cursor:"pointer",borderBottom:"1px solid #0f172a",fontSize:"12.5px",color:"#e2e8f0"}}
                onMouseEnter={e=>e.currentTarget.style.background="#0f1d35"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <span>{p.name}</span>
                {p.tinsPerCarton&&<span style={{float:"right",fontSize:"10.5px",color:"#475569"}}>{p.tinsPerCarton} tins/carton · {p.size}{p.unit}</span>}
              </div>)}
            </div>}
            {txnModal.mode==="consume"&&cellProds.length>0&&<div style={{display:"flex",gap:"4px",flexWrap:"wrap",marginTop:"5px"}}>
              {cellProds.map(p=><button key={p.id} onClick={()=>setTxn({...txn,productName:p.productName})} style={{background:txn.productName===p.productName?"#1e3a5f":"#0b1220",border:`1px solid ${txn.productName===p.productName?"#3b82f6":"#1e293b"}`,borderRadius:"5px",color:txn.productName===p.productName?"#93c5fd":"#475569",fontSize:"10.5px",padding:"2px 8px",cursor:"pointer"}}>{p.productName}</button>)}
            </div>}
          </Field>
          {/* Carton config info */}
          {selProd&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"7px 12px",marginBottom:"10px",fontSize:"12px"}}>
            <span style={{color:"#4ade80"}}>📦 {selProd.tinsPerCarton} tins/carton · {selProd.size}{selProd.unit} per tin</span>
          </div>}
          {txn.productName&&!selProd&&<div style={{background:"#1a0a00",border:"1px solid #92400e",borderRadius:"7px",padding:"7px 12px",marginBottom:"10px",fontSize:"12px",color:"#f59e0b"}}>
            ⚠ Not in product catalogue — litre calculation will be approximate
          </div>}

          {txnModal.mode==="add"&&<>
            <Grid2>
              <Field label="Cartons">
                <input style={inp} type="number" min="0" step="1" value={txn.cartons} onChange={e=>setTxn({...txn,cartons:e.target.value})} placeholder="0"/>
              </Field>
              <Field label="Loose Tins">
                <input style={inp} type="number" min="0" step="1" value={txn.looseTins} onChange={e=>setTxn({...txn,looseTins:e.target.value})} placeholder="0"/>
              </Field>
            </Grid2>
            {display&&(parseInt(txn.cartons)||0)+(parseInt(txn.looseTins)||0)>0&&<div style={{background:"#0a1a2e",border:"1px solid #1e3a5f",borderRadius:"8px",padding:"10px 14px",marginBottom:"12px",textAlign:"center"}}>
              <div style={{fontSize:"13px",color:"#64748b"}}>{parseInt(txn.cartons)||0} cartons × {display.tpc} + {parseInt(txn.looseTins)||0} loose tins = <strong style={{color:"#f1f5f9"}}>{display.totalTins}</strong> tins</div>
              <div style={{fontSize:"20px",fontWeight:"700",color:"#22c55e",marginTop:"4px"}}>= {display.totalQty.toFixed(2)} {display.unit}</div>
            </div>}
          </>}

          {txnModal.mode==="consume"&&(()=>{
            const consumeTins=parseInt(txn.consumeTins)||0;
            // Preview the open-carton result
            const curProd=getCellProds(txnModal.cell).find(p=>normalize(p.productName)===normalize(txn.productName));
            const curCartons=parseInt(curProd?.cartons)||0;
            const curLoose=parseInt(curProd?.looseTins)||0;
            const tpc=selProd?.tinsPerCarton||parseInt(curProd?.tinsPerCarton)||0;
            const availTins=tpc?(curCartons*tpc+curLoose):0;
            let previewCartons=curCartons,previewLoose=curLoose;
            let previewValid=false;
            if(consumeTins>0&&tpc&&consumeTins<=availTins){
              const fromLoose=Math.min(consumeTins,curLoose);
              const stillNeeded=consumeTins-fromLoose;
              previewLoose=curLoose-fromLoose;
              if(stillNeeded>0){const ctb=Math.ceil(stillNeeded/tpc);previewCartons=curCartons-ctb;previewLoose+=ctb*tpc-stillNeeded;}
              previewValid=true;
            }
            return <>
              <Field label="Tins to consume *">
                <input style={inp} type="number" min="1" step="1" value={txn.consumeTins} onChange={e=>setTxn({...txn,consumeTins:e.target.value})} placeholder={`max ${availTins} tins`}/>
              </Field>
              {tpc>0&&<div style={{fontSize:"11px",color:"#475569",marginBottom:"8px"}}>Available: {curCartons} cartons + {curLoose} loose tins = {availTins} tins</div>}
              {previewValid&&<div style={{background:"#0a1a2e",border:"1px solid #1e3a5f",borderRadius:"8px",padding:"10px 14px",marginBottom:"12px"}}>
                <div style={{fontSize:"11px",color:"#64748b",marginBottom:"4px"}}>After consuming {consumeTins} tins:</div>
                <div style={{fontSize:"15px",fontWeight:"700",color:"#4ade80"}}>{previewCartons} cartons + {previewLoose} loose tins</div>
                {selProd?.size&&<div style={{fontSize:"11px",color:"#166534",marginTop:"2px"}}>= {((previewCartons*tpc+previewLoose)*selProd.size).toFixed(2)} {selProd.unit} remaining</div>}
              </div>}
              {consumeTins>availTins&&availTins>0&&<div style={{fontSize:"11.5px",color:"#f87171",marginBottom:"8px"}}>⚠ Only {availTins} tins available</div>}
            </>;
          })()}

          <Grid2>
            <Field label="Date"><input type="date" style={inp} value={txn.date} onChange={e=>setTxn({...txn,date:e.target.value})}/></Field>
            <Field label="Notes"><input style={inp} value={txn.notes} onChange={e=>setTxn({...txn,notes:e.target.value})} placeholder="Optional…"/></Field>
          </Grid2>
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
            <Btn label="Cancel" onClick={()=>setTxnModal(null)} outline color="#475569" small/>
            <Btn label={saving?"Saving…":(txnModal.mode==="add"?"+ Add Stock":"− Consume")} onClick={saveTxn} disabled={saving} color={txnModal.mode==="add"?"#22c55e":"#ef4444"} small/>
          </div>
        </div>
      </div>;
    })()}
  </div>;
}


function RawMaterialStockTab({role,user,showToast,sysUnits,sysRmCats,onAddRmCat,onAddUnit}){
  const isAdmin=role==="admin";
  const canStore=role==="admin"||role==="store";
  const UNITS=sysUnits||BATCH_UNITS;
  const CATS=sysRmCats||RM_CATEGORIES;

  // State
  const [materials,setMaterials]=useState([]);
  const [transactions,setTransactions]=useState([]);
  const [loading,setLoading]=useState(true);
  const [subTab,setSubTab]=useState("stock");
  const [groupByCat,setGroupByCat]=useState(false);
  const [search,setSearch]=useState("");
  const [filterCat,setFilterCat]=useState("All");
  const [saving,setSaving]=useState(false);

  // Add material form (admin)
  const blankMat={name:"",category:CATS[0]||"",unit:"kg",openingStock:"",reorderLevel:"",supplier:"",notes:""};
  const [matForm,setMatForm]=useState({...blankMat});
  const [showAddMat,setShowAddMat]=useState(false);
  const [editMat,setEditMat]=useState(null);

  // Consumption form (store)
  const [consumeRows,setConsumeRows]=useState([{materialId:"",qty:"",notes:""}]);
  const [consumeDate,setConsumeDate]=useState(today());

  // Stock addition form (admin)
  const [addStockRows,setAddStockRows]=useState([{materialId:"",qty:"",supplier:"",invoiceNo:"",notes:""}]);
  const [addStockDate,setAddStockDate]=useState(today());

  // Load data
  useEffect(()=>{
    const unsub1=C("rm_stock_materials").orderBy("name").onSnapshot(
      s=>{setMaterials(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},
      ()=>setLoading(false)
    );
    const unsub2=C("rm_stock_transactions").orderBy("date","desc").onSnapshot(
      s=>setTransactions(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{}
    );
    return()=>{unsub1();unsub2();};
  },[]);

  // Save new material
  const saveMaterial=async(isEdit=false)=>{
    if(!matForm.name.trim())return showToast("Material name required","error");
    setSaving(true);
    try{
      if(isEdit&&editMat){
        await C("rm_stock_materials").doc(editMat.id).update({...matForm,updatedBy:user.email,updatedAt:ts()});
        showToast("Material updated ✓");setEditMat(null);
      }else{
        const openingQty=parseFloat(matForm.openingStock)||0;
        const docRef=await C("rm_stock_materials").add({...matForm,currentStock:openingQty,addedBy:user.email,_createdAt:ts()});
        if(openingQty>0){
          await C("rm_stock_transactions").add({materialId:docRef.id,materialName:matForm.name,type:"opening",qty:openingQty,date:today(),addedBy:user.email,notes:"Opening stock",stockAfter:openingQty,_createdAt:ts()});
        }
        showToast("Material added ✓");setShowAddMat(false);
      }
      setMatForm({...blankMat});
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // Save daily consumption
  const saveConsumption=async()=>{
    const valid=consumeRows.filter(r=>r.materialId&&parseFloat(r.qty)>0);
    if(!valid.length)return showToast("Add at least one material with quantity","error");
    setSaving(true);
    try{
      await Promise.all(valid.map(async r=>{
        const mat=materials.find(m=>m.id===r.materialId);
        if(!mat)return;
        const qty=parseFloat(r.qty);
        const newStock=Math.max(0,(parseFloat(mat.currentStock)||0)-qty);
        await C("rm_stock_materials").doc(r.materialId).update({currentStock:newStock,updatedAt:ts()});
        await C("rm_stock_transactions").add({materialId:r.materialId,materialName:mat.name,unit:mat.unit,type:"consumption",qty,date:consumeDate,addedBy:user.email,notes:r.notes||"Daily consumption",stockAfter:newStock,_createdAt:ts()});
      }));
      showToast(`Consumption recorded for ${valid.length} material${valid.length!==1?"s":""} ✓`);
      setConsumeRows([{materialId:"",qty:"",notes:""}]);setConsumeDate(today());
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // Admin: add stock received
  const saveStockAddition=async()=>{
    const valid=addStockRows.filter(r=>r.materialId&&parseFloat(r.qty)>0);
    if(!valid.length)return showToast("Add at least one material with quantity","error");
    setSaving(true);
    try{
      await Promise.all(valid.map(async r=>{
        const mat=materials.find(m=>m.id===r.materialId);
        if(!mat)return;
        const qty=parseFloat(r.qty);
        const newStock=(parseFloat(mat.currentStock)||0)+qty;
        await C("rm_stock_materials").doc(r.materialId).update({currentStock:newStock,updatedAt:ts()});
        await C("rm_stock_transactions").add({materialId:r.materialId,materialName:mat.name,unit:mat.unit,type:"addition",qty,date:addStockDate,supplier:r.supplier||"",invoiceNo:r.invoiceNo||"",addedBy:user.email,notes:r.notes||"Stock received",stockAfter:newStock,_createdAt:ts()});
      }));
      showToast(`Stock added for ${valid.length} material${valid.length!==1?"s":""} ✓`);
      setAddStockRows([{materialId:"",qty:"",supplier:"",invoiceNo:"",notes:""}]);setAddStockDate(today());
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // Admin: physical stock correction
  const saveAdjustment=async(matId,correctedQty,reason)=>{
    const mat=materials.find(m=>m.id===matId);
    if(!mat)return;
    const qty=parseFloat(correctedQty);
    if(isNaN(qty)||qty<0)return showToast("Enter valid quantity","error");
    const diff=qty-(parseFloat(mat.currentStock)||0);
    await C("rm_stock_materials").doc(matId).update({currentStock:qty,updatedAt:ts()});
    await C("rm_stock_transactions").add({materialId:matId,materialName:mat.name,unit:mat.unit,type:"adjustment",qty:Math.abs(diff),adjustedTo:qty,date:today(),addedBy:user.email,notes:reason||"Physical stock correction",stockAfter:qty,_createdAt:ts()});
    showToast("Stock corrected ✓");
  };

  const delMaterial=async(id)=>{if(!confirm("Delete this material and all its transactions?"))return;
    const txn=transactions.filter(t=>t.materialId===id);
    await Promise.all(txn.map(t=>C("rm_stock_transactions").doc(t.id).delete()));
    await C("rm_stock_materials").doc(id).delete();showToast("Deleted","error");};

  // Stock status
  const stockStatus=(mat)=>{
    const curr=parseFloat(mat.currentStock)||0;
    const reorder=parseFloat(mat.reorderLevel)||0;
    if(curr<=0)return{color:"#ef4444",label:"Out of Stock",bg:"#450a0a"};
    if(reorder>0&&curr<=reorder)return{color:"#f59e0b",label:"Low Stock",bg:"#422006"};
    if(reorder>0&&curr<=reorder*1.5)return{color:"#eab308",label:"Near Reorder",bg:"#422006"};
    return{color:"#22c55e",label:"In Stock",bg:"#052e16"};
  };

  const fm=materials.filter(m=>{
    const q=normalize(search);
    const cs=filterCat==="All"||m.category===filterCat;
    const ms=!q||normalize(m.name||"").includes(q)||normalize(m.supplier||"").includes(q);
    return cs&&ms;
  });

  const lowCount=materials.filter(m=>{const s=stockStatus(m);return s.label==="Low Stock"||s.label==="Out of Stock";}).length;

  const txnType={consumption:{color:"#ef4444",icon:"📉"},addition:{color:"#22c55e",icon:"📈"},adjustment:{color:"#f59e0b",icon:"⚖️"},opening:{color:"#3b82f6",icon:"🔓"}};

  return <div>
    <SectionHead title="🏪 Raw Material Stock"/>

    {/* Summary bar */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px",marginBottom:"14px"}}>
      {[["📦 Total Materials",materials.length,"#3b82f6"],["⚠️ Low / Out",lowCount,"#ef4444"],["✅ In Stock",materials.length-lowCount,"#22c55e"]].map(([l,v,c])=>(
        <div key={l} style={{background:"#0b1220",border:`1px solid ${c}30`,borderRadius:"10px",padding:"12px 16px",textAlign:"center"}}>
          <div style={{fontSize:"22px",fontWeight:"700",color:c}}>{v}</div>
          <div style={{fontSize:"11px",color:"#64748b",marginTop:"2px"}}>{l}</div>
        </div>
      ))}
    </div>

    {/* Sub-tabs */}
    <div style={{display:"flex",gap:"4px",marginBottom:"14px",flexWrap:"wrap"}}>
      {[["stock","📊 Stock Levels"],["consume","📉 Record Consumption"],[isAdmin?"addstock":"","📈 Add Received Stock"],[isAdmin?"addmat":"","➕ Add Material"],[isAdmin?"importexport":"","📤 Export / Import"],["history","🕐 History"]].filter(([k])=>k).map(([key,label])=>(
        <button key={key} onClick={()=>setSubTab(key)} style={{background:subTab===key?"#1e293b":"transparent",border:`1px solid ${subTab===key?"#38bdf8":"#1e293b"}`,color:subTab===key?"#38bdf8":"#475569",borderRadius:"8px",padding:"6px 12px",cursor:"pointer",fontSize:"12.5px",fontWeight:"600"}}>{label}</button>
      ))}
    </div>

    {/* ── STOCK LEVELS ── */}
    {subTab==="stock"&&<>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"12px"}}>
        <input placeholder="Search material…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"7px 10px",fontSize:"12.5px"}}/>
        <select value={filterCat} onChange={e=>{setFilterCat(e.target.value);if(e.target.value!=="All")setGroupByCat(false);}} style={{...sl,width:"140px",padding:"7px 6px",fontSize:"12px"}}>
          <option value="All">All Categories</option>
          {CATS.map(c=><option key={c}>{c}</option>)}
        </select>
        {/* Group by category toggle — only when showing All */}
        {filterCat==="All"&&<button onClick={()=>setGroupByCat(g=>!g)}
          style={{background:groupByCat?"#1e3a5f":"transparent",border:`1px solid ${groupByCat?"#38bdf8":"#1e293b"}`,color:groupByCat?"#38bdf8":"#475569",borderRadius:"8px",padding:"6px 12px",cursor:"pointer",fontSize:"12px",fontWeight:"600",whiteSpace:"nowrap"}}>
          {groupByCat?"📂 Grouped by Category":"📋 Flat List"}
        </button>}
        <span style={{fontSize:"11px",color:"#334155"}}>{fm.length} material{fm.length!==1?"s":""}</span>
        {isAdmin&&<div style={{marginLeft:"auto",display:"flex",gap:"6px"}}>
          <Btn label="📉 Consume" onClick={()=>setSubTab("consume")} color="#ef4444" small/>
          <Btn label="📈 Add Stock" onClick={()=>setSubTab("addstock")} color="#22c55e" small/>
          <Btn label="➕ Material" onClick={()=>setSubTab("addmat")} color="#38bdf8" small/>
        </div>}
      </div>
      {loading&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading…</div>}
      {!loading&&fm.length===0&&<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px"}}>🏪</div><div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>{isAdmin?"No materials yet. Click ➕ Add Material.":"No materials found."}</div></div>}

      {/* ── Flat list ── */}
      {fm.length>0&&!groupByCat&&<div style={{border:"1px solid #1e293b",borderRadius:"10px",overflow:"hidden"}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 100px 80px 80px",background:"#0b1220",padding:"8px 14px",gap:"8px"}}>
          {["Material","Category","Supplier","Current Stock","Reorder Level","Status"].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
        </div>
        {fm.map((m,i)=><StockRow key={m.id} m={m} i={i} isAdmin={isAdmin} saveAdjustment={saveAdjustment} delMaterial={delMaterial}/>)}
      </div>}

      {fm.length>0&&groupByCat&&<StockGroupedView fm={fm} isAdmin={isAdmin} saveAdjustment={saveAdjustment}/>}
    </>}

    {/* ── RECORD CONSUMPTION ── */}
    {subTab==="consume"&&<div>
      <InfoBox color="#ef4444">Select a category to see all its materials. Enter quantities consumed — only filled rows will be saved.</InfoBox>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"14px"}}>
        <Field label="Date"><input type="date" style={inp} value={consumeDate} onChange={e=>setConsumeDate(e.target.value)}/></Field>
        <Field label="Filter by Category">
          <select style={sl} value={filterCat} onChange={e=>{setFilterCat(e.target.value);}}>
            <option value="All">All Categories</option>
            {CATS.map(c=><option key={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="Common Notes (optional)"><input style={inp} value={consumeRows[0]?.notes||""} onChange={e=>setConsumeRows(consumeRows.map(r=>({...r,notes:e.target.value})))} placeholder="e.g. Batch 0042, daily use"/></Field>
      </div>

      {/* Category-grouped consumption grid */}
      {(filterCat==="All"?CATS:[filterCat]).map(cat=>{
        const catMats=materials.filter(m=>(m.category||"Uncategorised")===cat);
        if(!catMats.length) return null;
        return <div key={cat} style={{border:"1px solid #1e293b",borderRadius:"10px",overflow:"hidden",marginBottom:"10px"}}>
          <div style={{background:"#0f1d35",padding:"8px 14px",display:"flex",alignItems:"center",gap:"10px",borderBottom:"1px solid #1e3a5f"}}>
            <span style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd"}}>{cat}</span>
            <span style={{fontSize:"11px",color:"#475569"}}>{catMats.length} material{catMats.length!==1?"s":""}</span>
            <button onClick={()=>{
              const ids=catMats.map(m=>m.id);
              setConsumeRows(prev=>{
                const newRows=[...prev];
                ids.forEach(id=>{if(!newRows.find(r=>r.materialId===id))newRows.push({materialId:id,qty:"",notes:prev[0]?.notes||""});});
                return newRows;
              });
            }} style={{background:"#0f1d35",border:"1px solid #2563eb40",borderRadius:"5px",padding:"2px 8px",color:"#93c5fd",cursor:"pointer",fontSize:"11px",marginLeft:"auto"}}>+ Add All</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"2fr 120px 100px",background:"#0b1220",padding:"5px 12px",gap:"8px"}}>
            {["Material (Current Stock)","Qty Used",""].map((h,i)=><div key={i} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
          </div>
          {catMats.map(m=>{
            const row=consumeRows.find(r=>r.materialId===m.id);
            const stock=parseFloat(m.currentStock||0);
            const qty=parseFloat(row?.qty||0);
            const isLow=stock<=0||(parseFloat(m.reorderLevel||0)>0&&stock<=parseFloat(m.reorderLevel||0));
            const willExceed=qty>stock;
            return <div key={m.id} style={{display:"grid",gridTemplateColumns:"2fr 120px 100px",padding:"7px 12px",gap:"8px",borderTop:"1px solid #1e293b",alignItems:"center",background:row?.qty?qty>0?"#060d0d":"#080d18":"#080d18"}}>
              <div>
                <div style={{fontSize:"12px",color:"#e2e8f0",fontWeight:row?.qty?"600":"400"}}>{m.name}</div>
                <div style={{fontSize:"10.5px",color:isLow?"#ef4444":"#475569"}}>
                  Stock: {stock.toFixed(2)} {m.unit} {isLow&&"⚠️ Low"}
                </div>
              </div>
              <div style={{display:"flex",gap:"4px",alignItems:"center"}}>
                <input style={{...sml,textAlign:"center",borderColor:willExceed?"#ef4444":row?.qty?"#22c55e30":"#1e293b",background:willExceed?"#2d0a0a":"#0b1220"}}
                  type="number" min="0" step="0.01"
                  value={row?.qty||""}
                  onChange={e=>{
                    const val=e.target.value;
                    setConsumeRows(prev=>{
                      const exists=prev.find(r=>r.materialId===m.id);
                      if(exists) return prev.map(r=>r.materialId===m.id?{...r,qty:val}:r);
                      return [...prev,{materialId:m.id,qty:val,notes:prev[0]?.notes||""}];
                    });
                  }}
                  placeholder="0"/>
                <span style={{fontSize:"10px",color:"#475569",whiteSpace:"nowrap"}}>{m.unit}</span>
              </div>
              {willExceed
                ?<div style={{fontSize:"10px",color:"#ef4444"}}>⚠️ Exceeds stock</div>
                :row?.qty&&qty>0
                  ?<div style={{fontSize:"10px",color:"#22c55e"}}>→ {(stock-qty).toFixed(2)} {m.unit} left</div>
                  :<div/>}
            </div>;
          })}
        </div>;
      })}

      <div style={{display:"flex",gap:"8px",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",marginTop:"4px"}}>
        <div style={{fontSize:"12px",color:"#475569"}}>
          {consumeRows.filter(r=>r.materialId&&parseFloat(r.qty)>0).length} material{consumeRows.filter(r=>r.materialId&&parseFloat(r.qty)>0).length!==1?"s":""} to record
        </div>
        <div style={{display:"flex",gap:"8px"}}>
          <Btn label="Clear All" onClick={()=>setConsumeRows([{materialId:"",qty:"",notes:""}])} outline color="#475569" small/>
          <Btn label={saving?"Saving…":"📉 Save Consumption"} onClick={saveConsumption} disabled={saving} color="#ef4444"/>
        </div>
      </div>
    </div>}

    {/* ── ADD RECEIVED STOCK ── */}
    {subTab==="addstock"&&isAdmin&&<div>
      <InfoBox color="#22c55e">Record stock received from supplier. Stock will be added to current balance.</InfoBox>
      <Grid2 style={{marginBottom:"12px"}}>
        <Field label="Date Received"><input type="date" style={inp} value={addStockDate} onChange={e=>setAddStockDate(e.target.value)}/></Field>
      </Grid2>
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"8px"}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 100px 1.5fr 1fr 1fr 28px",background:"#0b1220",padding:"7px 12px",gap:"8px"}}>
          {["Material","Qty Received","Supplier","Invoice No","Notes",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
        </div>
        {addStockRows.map((row,i)=>{
          const mat=materials.find(m=>m.id===row.materialId);
          return <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 100px 1.5fr 1fr 1fr 28px",padding:"7px 12px",gap:"8px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
            <select style={sl} value={row.materialId} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,materialId:e.target.value}:r))}>
              <option value="">— Select Material —</option>
              {materials.map(m=><option key={m.id} value={m.id}>{m.name} ({m.unit})</option>)}
            </select>
            <div style={{display:"flex",gap:"4px",alignItems:"center"}}>
              <input style={{...sml,textAlign:"center"}} type="number" min="0" step="0.01" value={row.qty} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,qty:e.target.value}:r))} placeholder="0"/>
              {mat&&<span style={{fontSize:"10px",color:"#475569"}}>{mat.unit}</span>}
            </div>
            <input style={sml} value={row.supplier} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,supplier:e.target.value}:r))} placeholder="Supplier name"/>
            <input style={sml} value={row.invoiceNo} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,invoiceNo:e.target.value}:r))} placeholder="Invoice #"/>
            <input style={sml} value={row.notes} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,notes:e.target.value}:r))} placeholder="Notes"/>
            <button onClick={()=>setAddStockRows(addStockRows.filter((_,idx)=>idx!==i))} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
          </div>;
        })}
      </div>
      <div style={{display:"flex",gap:"8px",justifyContent:"space-between",flexWrap:"wrap"}}>
        <button onClick={()=>setAddStockRows([...addStockRows,{materialId:"",qty:"",supplier:"",invoiceNo:"",notes:""}])} style={{background:"none",border:"1px dashed #1e293b",borderRadius:"6px",padding:"5px 12px",color:"#475569",cursor:"pointer",fontSize:"12px"}}>+ Add Row</button>
        <Btn label={saving?"Saving…":"📈 Save Stock Addition"} onClick={saveStockAddition} disabled={saving} color="#22c55e"/>
      </div>
    </div>}

    {/* ── ADD MATERIAL ── */}
    {subTab==="addmat"&&isAdmin&&<div>
      {!showAddMat&&!editMat&&<div style={{display:"flex",justifyContent:"flex-end",marginBottom:"10px"}}><Btn label="➕ Add New Material" onClick={()=>setShowAddMat(true)} color="#38bdf8"/></div>}
      {(showAddMat||editMat)&&<div style={{background:"#080d18",border:"1px solid #38bdf830",borderRadius:"12px",padding:"18px",marginBottom:"16px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#38bdf8",marginBottom:"14px"}}>{editMat?"✏️ Edit Material":"➕ New Raw Material"}</div>
        <Grid3>
          <Field label="Material Name *"><input style={inp} value={matForm.name} onChange={e=>setMatForm({...matForm,name:e.target.value})} placeholder="e.g. TiO2 White"/></Field>
          <div>
            <div style={{fontSize:"10.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px",display:"flex",alignItems:"center",gap:"8px"}}>Category {onAddRmCat&&<QuickAdd label="Category" onAdd={v=>{if(onAddRmCat)onAddRmCat(v);}} color="#f97316"/>}</div>
            <select style={sl} value={matForm.category} onChange={e=>setMatForm({...matForm,category:e.target.value})}>
              {CATS.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <div style={{fontSize:"10.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px",display:"flex",alignItems:"center",gap:"8px"}}>Unit {onAddUnit&&<QuickAdd label="Unit" onAdd={onAddUnit} color="#38bdf8"/>}</div>
            <select style={sl} value={matForm.unit} onChange={e=>setMatForm({...matForm,unit:e.target.value})}>
              {UNITS.map(u=><option key={u}>{u}</option>)}
            </select>
          </div>
        </Grid3>
        <Grid3>
          <Field label={editMat?"Current Stock (direct edit)":"Opening Stock"}><input style={inp} type="number" value={matForm.openingStock} onChange={e=>setMatForm({...matForm,openingStock:e.target.value})} placeholder="0"/></Field>
          <Field label="Reorder Level (alert when below)"><input style={inp} type="number" value={matForm.reorderLevel} onChange={e=>setMatForm({...matForm,reorderLevel:e.target.value})} placeholder="e.g. 50"/></Field>
          <Field label="Supplier Name"><input style={inp} value={matForm.supplier} onChange={e=>setMatForm({...matForm,supplier:e.target.value})} placeholder="Supplier company"/></Field>
        </Grid3>
        <Field label="Notes"><input style={inp} value={matForm.notes} onChange={e=>setMatForm({...matForm,notes:e.target.value})} placeholder="Any notes about this material"/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
          <Btn label="Cancel" onClick={()=>{setShowAddMat(false);setEditMat(null);setMatForm({...blankMat});}} outline color="#475569" small/>
          <Btn label={saving?"Saving…":editMat?"💾 Update":"✓ Add Material"} onClick={()=>saveMaterial(!!editMat)} disabled={saving} color="#38bdf8" small/>
        </div>
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {materials.map(m=><div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0f172a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 14px"}}>
          <div>
            <span style={{fontSize:"13px",fontWeight:"600",color:"#e2e8f0"}}>{m.name}</span>
            <span style={{fontSize:"11px",color:"#475569",marginLeft:"10px"}}>{m.category} · {m.unit}</span>
            {m.supplier&&<span style={{fontSize:"11px",color:"#475569",marginLeft:"6px"}}>· {m.supplier}</span>}
          </div>
          <div style={{display:"flex",gap:"6px"}}>
            <button onClick={()=>{setEditMat(m);setMatForm({name:m.name,category:m.category,unit:m.unit,openingStock:m.currentStock,reorderLevel:m.reorderLevel||"",supplier:m.supplier||"",notes:m.notes||""});setShowAddMat(false);}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"5px",color:"#93c5fd",cursor:"pointer",fontSize:"12px",padding:"3px 8px"}}>✏️</button>
            <button onClick={()=>delMaterial(m.id)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px"}}>🗑</button>
          </div>
        </div>)}
      </div>
    </div>}

    {/* ── HISTORY ── */}
    {subTab==="history"&&<div>
      <div style={{fontSize:"12px",color:"#475569",marginBottom:"12px"}}>Showing last {Math.min(transactions.length,100)} transactions</div>
      {transactions.length===0&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>No transactions yet.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:"4px"}}>
        {transactions.slice(0,100).map(t=>{
          const tt=txnType[t.type]||{color:"#94a3b8",icon:"📋"};
          const sign=t.type==="consumption"?"−":t.type==="addition"||t.type==="opening"?"+":"⚖";
          return <div key={t.id} style={{display:"flex",gap:"10px",alignItems:"center",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"8px 14px"}}>
            <span style={{fontSize:"16px",flexShrink:0}}>{tt.icon}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",gap:"8px",alignItems:"baseline",flexWrap:"wrap"}}>
                <span style={{fontSize:"13px",fontWeight:"600",color:"#e2e8f0"}}>{t.materialName}</span>
                <span style={{fontSize:"12px",fontWeight:"700",color:tt.color}}>{sign}{t.qty} {t.unit||""}</span>
                {t.type==="adjustment"&&<span style={{fontSize:"11px",color:"#f59e0b"}}>→ {t.adjustedTo} {t.unit||""}</span>}
                <span style={{fontSize:"11px",color:"#334155",marginLeft:"auto"}}>Stock after: {parseFloat(t.stockAfter||0).toFixed(2)} {t.unit||""}</span>
              </div>
              <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>
                {t.date} · {t.addedBy} · {t.notes||""}
                {t.supplier&&<span> · {t.supplier}</span>}
                {t.invoiceNo&&<span> · #{t.invoiceNo}</span>}
              </div>
            </div>
            <span style={{fontSize:"10px",fontWeight:"700",background:tt.color+"20",color:tt.color,padding:"2px 7px",borderRadius:"99px",flexShrink:0,textTransform:"capitalize"}}>{t.type}</span>
          </div>;
        })}
      </div>
    </div>}

    {/* ── EXPORT / IMPORT ── */}
    {subTab==="importexport"&&isAdmin&&<RMExportImport materials={materials} CATS={CATS} UNITS={UNITS} user={user} showToast={showToast} onImport={async(rows)=>{
      // rows: [{name,category,unit,openingStock,reorderLevel,supplier,notes}]

      // ── Step 1: Auto-create any new categories and units from the CSV ──
      const newCats=[...new Set(rows.map(r=>(r.category||"").trim()).filter(Boolean))]
        .filter(cat=>cat&&!CATS.includes(cat));
      const newUnits=[...new Set(rows.map(r=>(r.unit||"").trim()).filter(Boolean))]
        .filter(u=>u&&!UNITS.includes(u));

      for(const cat of newCats){
        if(onAddRmCat) await onAddRmCat(cat);
      }
      for(const unit of newUnits){
        if(onAddUnit) await onAddUnit(unit);
      }

      // ── Step 2: Import materials ──
      let added=0, skipped=0;
      for(const row of rows){
        if(!row.name||!row.name.trim()){skipped++;continue;}
        const existing=materials.find(m=>normalize(m.name)===normalize(row.name));
        if(existing){
          await C("rm_stock_materials").doc(existing.id).update({
            category:row.category||existing.category,unit:row.unit||existing.unit,
            reorderLevel:row.reorderLevel||existing.reorderLevel,supplier:row.supplier||existing.supplier,
            notes:row.notes||existing.notes,updatedAt:ts()
          });
          added++;
        }else{
          const qty=parseFloat(row.openingStock)||0;
          const docRef=await C("rm_stock_materials").add({...row,currentStock:qty,addedBy:user.email,_createdAt:ts()});
          if(qty>0)await C("rm_stock_transactions").add({materialId:docRef.id,materialName:row.name,type:"opening",qty,date:today(),addedBy:user.email,notes:"Imported opening stock",stockAfter:qty,_createdAt:ts()});
          added++;
        }
      }
      const catMsg=newCats.length?` · ${newCats.length} new categor${newCats.length===1?"y":"ies"} added`:"";
      const unitMsg=newUnits.length?` · ${newUnits.length} new unit${newUnits.length===1?"":"s"} added`:"";
      showToast(`Imported: ${added} materials${skipped?`, ${skipped} skipped`:""}${catMsg}${unitMsg} ✓`);
    }}/>}
  </div>;
}
