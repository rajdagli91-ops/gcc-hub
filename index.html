                      // Support both old format (title/message/assignedTo) and new format (msg/for)
                      const heading=n.title||n.msg||(n.type==="reminder"?"⚠ Reminder":n.type==="complaint_assigned"?"📋 Complaint Assigned":n.type==="complaint_new"?"⚠ New Complaint":n.type==="field_visit_done"?"✅ Field Visit Done":n.type==="sample_dispatch"?"📦 Sample to Dispatch":n.type==="sample_dispatched"?"📦 Sample Dispatched":n.type==="enquiry_assigned"?"📞 Enquiry Assigned":n.type==="enquiry_new"?"📞 New Enquiry":n.type==="enquiry_update"?"📞 Enquiry Updated":n.type==="task_assigned"?"📋 Task Assigned":n.type==="rd_assigned"?"🧪 R&D Assigned":n.type==="rd_new"?"🧪 R&D Project":n.type==="complaint_new"?"🔴 New Complaint":"Notification");
                      const sub=n.message||(n.title&&n.msg?n.msg:null)||(n.customer?`Customer: ${n.customer}`:"");
                      const icon=n.type==="reminder"?"⏰":n.type==="complaint_assigned"?"🔴":n.type==="complaint_new"?"🔴":n.type==="field_visit_done"?"✅":n.type==="sample_dispatch"?"📦":n.type==="sample_dispatched"?"📦":n.type==="enquiry_assigned"?"📞":n.type==="enquiry_new"?"📞":n.type==="enquiry_update"?"📞":n.type==="task_assigned"?"📋":n.type==="task_reassigned"?"📋":n.type==="rd_assigned"?"🧪":n.type==="rd_new"?"🧪":"🔔";
                      const when=n.createdAt?new Date(n.createdAt).toLocaleDateString("en-IN",{day:"2-digit",month:"short"}):n._createdAt?.toDate?.()?.toLocaleDateString("en-IN",{day:"2-digit",month:"short"})||n.date||"";
                      return <div key={n.id} style={{padding:"10px 14px",borderBottom:"1px solid #1e293b",display:"flex",gap:"8px",alignItems:"flex-start"}}>
                        <span style={{fontSize:"16px",flexShrink:0}}>{icon}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:"12px",fontWeight:"600",color:"#e2e8f0",lineHeight:1.4}}>{heading}</div>
                          {sub&&<div style={{fontSize:"11px",color:"#64748b",marginTop:"2px",lineHeight:1.4}}>{sub}</div>}
                          {when&&<div style={{fontSize:"10px",color:"#334155",marginTop:"3px"}}>{when}</div>}
                        </div>
                        <button onClick={()=>C("notifications").doc(n.id).update({read:true})} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"13px",flexShrink:0}}>×</button>
                      </div>;
                    })}
                  </div>}
                </div>
                {/* 📖 Guide button */}
                <button onClick={()=>window.open("gcc_hub_guide.html","_blank")} title="Open User Guide" style={{background:"none",border:"1px solid #1e3a5f",borderRadius:"7px",padding:"4px 10px",color:"#93c5fd",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>📖 Guide</button>
                <button onClick={()=>setShowChangePw(true)} style={{background:"none",border:"1px solid #1e3a5f",borderRadius:"7px",padding:"4px 10px",color:"#93c5fd",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>🔑 Change PW</button>
                <button onClick={()=>auth.signOut()} style={{background:"none",border:"1px solid #1e293b",borderRadius:"7px",padding:"4px 12px",color:"#475569",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>Sign Out</button>
              </div>
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:"4px",overflowX:"auto"}}>
          {tabs.map(t=><button key={t.key} onClick={()=>trySetTab(t.key)} style={{background:tab===t.key?"#1e293b":"transparent",border:"none",borderBottom:tab===t.key?"2px solid #3b82f6":"2px solid transparent",color:tab===t.key?"#f1f5f9":"#64748b",padding:"9px 18px",cursor:"pointer",fontSize:"13px",fontWeight:"600",borderRadius:"8px 8px 0 0",transition:"all 0.15s",whiteSpace:"nowrap"}}>{t.label}</button>)}
        </div>
      </div>
    </div>

    {/* Content */}
    <div style={{maxWidth:"1000px",margin:"0 auto",padding:"24px 28px 0"}}>

      {/* DASHBOARD */}
      {tab==="dashboard"&&<DashboardTab role={role} roles={roles} hp={hp} user={user} onNavigate={setTab}/>}

      {/* BATCHES */}
      {tab==="batches"&&<>
        {/* Sub-tabs */}
        <div style={{display:"flex",gap:"4px",marginBottom:"18px",borderBottom:"1px solid #1e293b"}}>
          {[["batches","📦 Batch List"],["oldstock","🗃 Old/Rejected Material"]].map(([key,label])=>(
            <button key={key} onClick={()=>setBatchSubTab(key)} style={{background:batchSubTab===key?"#1e293b":"transparent",border:"none",borderBottom:batchSubTab===key?"2px solid #3b82f6":"2px solid transparent",color:batchSubTab===key?"#f1f5f9":"#64748b",padding:"8px 16px",cursor:"pointer",fontSize:"13px",fontWeight:"600",borderRadius:"8px 8px 0 0",transition:"all 0.15s"}}>{label}</button>
          ))}
        </div>

        {batchSubTab==="batches"&&<>
          {/* Filter row */}
          <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center",marginBottom:"8px"}}>
            <input placeholder="Search batch, product…" value={batchSearch} onChange={e=>setBatchSearch(e.target.value)} style={{...inp,maxWidth:"170px",padding:"7px 10px",fontSize:"12.5px"}}/>
            {/* FY selector */}
            <select value={batchFYFilter} onChange={e=>setBatchFYFilter(e.target.value)} style={{...sl,width:"90px",padding:"7px 6px",fontSize:"12px"}}>
              {[["All","All FY"],...Array.from({length:4},(_,k)=>{const fy=getFY()-k;return[String(fy),"FY "+getFYLabel(fy)+" "+(fy<getFY()?"(Completed)":"(Current)")];})].map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
            {/* Month selector — just month names, no year */}
            <select value={batchMonthFilter} onChange={e=>setBatchMonthFilter(e.target.value)} style={{...sl,width:"110px",padding:"7px 6px",fontSize:"12px"}}>
              <option value="All">All Months</option>
              {[["04","April"],["05","May"],["06","June"],["07","July"],["08","August"],["09","September"],["10","October"],["11","November"],["12","December"],["01","January"],["02","February"],["03","March"]].map(([v,n])=><option key={v} value={v}>{n}</option>)}
            </select>
            {/* Category selector */}
            <select value={batchCatFilter} onChange={e=>setBatchCatFilter(e.target.value)} style={{...sl,width:"120px",padding:"7px 6px",fontSize:"12px"}}>
              <option value="All">All Categories</option>
              {[...new Set(batches.map(b=>b.category).filter(Boolean))].sort().map(c=><option key={c}>{c}</option>)}
            </select>
            {canIssuer&&<Btn label="+ Issue New Batch" onClick={()=>setShowIssueBatch(true)} color="#3b82f6" small/>}
          </div>
          {/* Status chips */}
          <div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"10px",alignItems:"center"}}>
            {["All",...BATCH_STATUS].map(s=><button key={s} onClick={()=>setBatchFilter(s)} style={{background:batchFilter===s?"#1e3a5f":"transparent",border:`1px solid ${batchFilter===s?"#3b82f6":"#1e293b"}`,color:batchFilter===s?"#93c5fd":"#475569",borderRadius:"99px",padding:"4px 10px",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>{s}</button>)}
            <span style={{marginLeft:"auto",fontSize:"11px",color:"#334155"}}>{fb.length} batch{fb.length!==1?"es":""}</span>
          </div>
          {/* Compact table header */}
          {fb.length>0&&<div style={{display:"grid",gridTemplateColumns:"100px 1fr 1fr auto 24px",gap:"8px",padding:"4px 14px",marginBottom:"2px"}}>
            {["Batch #","Product","Size · Date","Status",""].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
          </div>}
          {fb.length===0?<div style={{textAlign:"center",padding:"40px 0"}}><div style={{fontSize:"30px",marginBottom:"8px"}}>📦</div><div style={{fontSize:"13px",color:"#475569"}}>No batches match filters.{canIssuer?" Click + Issue New Batch.":""}</div></div>
            :fb.map(b=><BatchCard key={b.id} b={b} onClick={()=>setActiveBatch(b)} getBatchFY={getBatchFY}
              onReprint={async(batch)=>{
                try{
                  const bomSnap=await C("bom_products").where("productName","==",batch.productName).limit(1).get();
                  if(!bomSnap.empty){
                    const bomData=bomSnap.docs[0].data();
                    let oldStocksForPrint=[];
                    try{
                      const osSnap=await C("old_stock").where("status","==","Available").get();
                      const allOs=osSnap.docs.map(d=>({id:d.id,...d.data()}));
                      oldStocksForPrint=allOs.filter(s=>s.productName&&bomData.productName&&
                        s.productName.trim().toLowerCase()===bomData.productName.trim().toLowerCase());
                    }catch(_){}
                    printProductionSheet(bomData,batch.batchSize,batch.batchNo,"","","",sysPackSizes,batch.dateIssued,bomData.extraAdditions||{},sysQcParams,oldStocksForPrint);
                  }else{
                    showToast("No BOM found for "+batch.productName+". Create a BOM in the 📋 BOM tab first.","error");
                  }
                }catch(e){showToast("Error: "+e.message,"error");}
              }}
              onDelete={async(id)=>{if(!confirm("Delete batch?"))return;await C("batches").doc(id).delete();showToast("Deleted","error");}} role={role}/>)}
        </>}

        {batchSubTab==="oldstock"&&<OldStockSection role={role} user={user} showToast={showToast} products={sysProducts} catUnits={sysCatUnits}/>}
      </>}

      {tab==="complaints"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"10px"}}>

            {["All",...COMPLAINT_STATUS].map(s=><button key={s} onClick={()=>setComplaintFilter(s)} style={{background:complaintFilter===s?"#1e3a5f":"transparent",border:`1px solid ${complaintFilter===s?"#3b82f6":"#1e293b"}`,color:complaintFilter===s?"#93c5fd":"#475569",borderRadius:"99px",padding:"5px 12px",fontSize:"11.5px",fontWeight:"600",transition:"all 0.15s",cursor:"pointer"}}>{s}</button>)}

        </div>
        {fc.length===0?<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px",marginBottom:"10px"}}>✅</div><div style={{fontSize:"13px",color:"#475569"}}>No complaints found.{role==="sales"?" Click + Add Complaint.":""}</div></div>:fc.map(c=><ComplaintCard key={c.id} c={c} onClick={()=>setActiveComplaint(c)} onDelete={async(id)=>{if(!confirm("Delete?"))return;await C("complaints").doc(id).delete();showToast("Deleted","error");}} role={role}/>)}

              <input placeholder="Search projects…" value={projSearch} onChange={e=>setProjSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"8px 12px",fontSize:"13px"}}/>
              {["All",...PROJECT_STATUS].map(s=><button key={s} onClick={()=>setProjFilter(s)} style={{background:projFilter===s?"#1e3a5f":"transparent",border:`1px solid ${projFilter===s?"#3b82f6":"#1e293b"}`,color:projFilter===s?"#93c5fd":"#475569",borderRadius:"99px",padding:"5px 12px",fontSize:"11.5px",fontWeight:"600",cursor:"pointer"}}>{s}</button>)}

            onEdit={p=>setEditProject({...p})}
            onToggleHide={async(proj)=>{await C("rd_projects").doc(proj.id).update({hiddenFromQC:!proj.hiddenFromQC});showToast(proj.hiddenFromQC?"Project visible to QC ✓":"Project hidden from QC ✓");}}
            isAdmin={isAdminRD}/>)}
        </>}
        {rdSubTab==="rmtests"&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"10px"}}>
            <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",flex:1}}>
              <input placeholder="Search material, vendor…" value={rmSearch} onChange={e=>setRmSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"8px 12px",fontSize:"13px"}}/>
              {["All",...TEST_RESULTS].map(r=><button key={r} onClick={()=>setRmFilter(r)} style={{background:rmFilter===r?"#1e3a5f":"transparent",border:`1px solid ${rmFilter===r?"#3b82f6":"#1e293b"}`,color:rmFilter===r?"#93c5fd":"#475569",borderRadius:"99px",padding:"5px 12px",fontSize:"11.5px",fontWeight:"600",cursor:"pointer"}}>{r}</button>)}
            </div>
            <Btn label="+ Add Test Entry" onClick={()=>setShowAddRM(true)} color="#3b82f6"/>
          </div>
          {frm.length===0?<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px",marginBottom:"10px"}}>🧫</div><div style={{fontSize:"13px",color:"#475569"}}>No entries.</div></div>:frm.map(r=><RMCard key={r.id} r={r} onClick={()=>setViewRM(r)} onDelete={async(id)=>{if(!confirm("Delete?"))return;await C("rm_tests").doc(id).delete();showToast("Deleted","error");}} onEdit={r=>setEditRM({...r})} isAdmin={isAdmin} allProfiles={allProfiles}/>)}
        </>}
        {rdSubTab==="sampletests"&&<SampleTestsTab role={role} user={user} showToast={showToast} sysQcParams={sysQcParams}
          onCreateProject={(prefill)=>{setProjForm({...EP,...prefill});setShowAddProject(true);setRdSubTab("projects");}}
        />}
        {rdSubTab==="stainer"&&<StainerCalc/>}
        {rdSubTab==="resin"&&<ResinSolventCalc/>}
        {rdSubTab==="shade"&&<ShadeCorrectionCalc showToast={showToast} user={user} isAdmin={isAdmin} canApprove={hp("shade_approve")} canSubmit={hp("shade_submit")}/>}
      </>}
      {tab==="bom"&&<BOMTab role={role} roles={roles} user={user} showToast={showToast} sysProducts={sysProducts} sysPackSizes={sysPackSizes} sysQcParams={sysQcParams}/>}
      {tab==="tasks"&&<TasksTab user={user} roles={roles} showToast={showToast} allRoles={allRoles} allProfiles={allProfiles}/>}
      {tab==="orders"&&<ErrorBoundary><OrdersTab role={role} roles={roles} user={user} showToast={showToast} isAdmin={isAdmin} hp={hp}/></ErrorBoundary>}
      {tab==="stock"&&<StockTab role={role} roles={roles} user={user} showToast={showToast} sysUnits={sysUnits} sysRmCats={sysRmCats} onAddRmCat={addGlobalRmCat} onAddUnit={addGlobalUnit} hp={hp}/>}
      {tab==="testimonials"&&<TestimonialsTab role={role} user={user} showToast={showToast}/>}
      {tab==="enquiries"&&<EnquiriesTab role={role} roles={roles} user={user} showToast={showToast} allProfiles={allProfiles} allRoles={allRoles} isAdmin={isAdmin} hp={hp}/>}
      {tab==="users"&&<UsersTab currentUser={user}/>}

      {/* SETTINGS */}
      {tab==="settings"&&<SettingsTab roles={roles}
        showToast={showToast}
        initialProducts={sysProducts}
        initialQcParams={sysQcParams}
        initialPackSizes={sysPackSizes}
        initialCatUnits={sysCatUnits}
        initialUnits={sysUnits}
        initialPaintTypes={sysPaintTypes}
        initialRmCats={sysRmCats}
        onDirtyChange={setSettingsDirty}
        onSaved={({products,qcParams,packSizes,catUnits,units,paintTypes,rmCategories})=>{
          setSysProducts(products);setSysQcParams(qcParams);setSysPackSizes(packSizes);
          setSysCatUnits(catUnits);if(units)setSysUnits(units);
          if(paintTypes)setSysPaintTypes(paintTypes);if(rmCategories)setSysRmCats(rmCategories);
          setSettingsDirty(false);
          if(pendingMainTab){setTab(pendingMainTab);setPendingMainTab(null);}
        }}
      />}
      {/* Main-tab switch blocked by unsaved settings */}
      {pendingMainTab&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:4000,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"#0f1729",border:"1px solid #f59e0b",borderRadius:"14px",padding:"28px 32px",maxWidth:"380px",width:"90%",boxShadow:"0 20px 60px rgba(0,0,0,0.6)"}}>
          <div style={{fontSize:"20px",marginBottom:"8px"}}>⚠️</div>
          <div style={{fontSize:"15px",fontWeight:"700",color:"#f1f5f9",marginBottom:"8px"}}>Unsaved Settings</div>
          <div style={{fontSize:"13px",color:"#94a3b8",marginBottom:"20px",lineHeight:1.5}}>
            You have unsaved changes in Settings.<br/>Save before leaving or discard changes?
          </div>
          <div style={{display:"flex",gap:"10px",flexDirection:"column"}}>
            <Btn label="Go back to Settings to Save" onClick={()=>setPendingMainTab(null)} color="#22c55e"/>
            <Btn label="Discard Changes & Leave" onClick={()=>{setSettingsDirty(false);setTab(pendingMainTab);setPendingMainTab(null);}} outline color="#ef4444"/>
            <Btn label="Cancel" onClick={()=>setPendingMainTab(null)} outline color="#475569"/>
          </div>
        </div>
      </div>}
    </div>

    {/* ══ MODALS ══ */}

    {/* Batch Workspace */}
    <Modal wide open={!!activeBatch} onClose={()=>setActiveBatch(null)} title="Batch Details">
      {activeBatch&&<BatchWorkspace batch={activeBatch} role={role} showToast={showToast} qcParams={sysQcParams} packSizes={sysPackSizes}/>}
    </Modal>

    {/* Issue Batch */}
    {/* Change Password Modal */}
    {showChangePw&&<Modal title="🔑 Change My Password" onClose={()=>{setShowChangePw(false);setCpForm({cur:"",nw:"",nw2:""});setCpError("");}}>
      <div style={{padding:"4px 0"}}>
        <InfoBox color="#3b82f6">Enter your current password to verify identity, then set a new one.</InfoBox>
        <Field label="Current Password">
          <input type="password" style={inp} value={cpForm.cur} onChange={e=>setCpForm({...cpForm,cur:e.target.value})} placeholder="Your current password" autoComplete="current-password"/>
        </Field>
        <Field label="New Password (min 6 chars)">
          <input type="password" style={inp} value={cpForm.nw} onChange={e=>{setCpForm({...cpForm,nw:e.target.value});setCpError("");}} placeholder="New password" autoComplete="new-password"/>
        </Field>
        <Field label="Confirm New Password">
          <input type="password" style={{...inp,borderColor:cpForm.nw2&&cpForm.nw2!==cpForm.nw?"#ef4444":cpForm.nw2?"#22c55e":"#1e293b"}} value={cpForm.nw2} onChange={e=>{setCpForm({...cpForm,nw2:e.target.value});setCpError("");}} placeholder="Repeat new password" autoComplete="new-password"/>
        </Field>
        {cpError&&<div style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"7px",padding:"9px 12px",color:"#fca5a5",fontSize:"12.5px",marginBottom:"10px"}}>❌ {cpError}</div>}
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
          <Btn label="Cancel" onClick={()=>{setShowChangePw(false);setCpForm({cur:"",nw:"",nw2:""});setCpError("");}} outline color="#475569"/>
          <Btn label={cpSaving?"Changing…":"Change Password"} onClick={doChangePw} disabled={cpSaving||!cpForm.cur||!cpForm.nw||!cpForm.nw2} color="#3b82f6"/>
        </div>
      </div>
    </Modal>}

    <Modal open={showIssueBatch} onClose={()=>setShowIssueBatch(false)} title="Issue New Batch">
      {(()=>{
        const availOldStock=oldStocks.filter(s=>(s.status==="Available")&&s.productName===batchForm.productName);
        return <>
          <CategoryProductSelect
            category={batchForm.category||""} setCategory={cat=>setBatchForm({...batchForm,category:cat,productName:""})}
            productName={batchForm.productName} setProductName={pn=>setBatchForm({...batchForm,productName:pn})}
            products={sysProducts}
            catUnits={sysCatUnits}
            onUnitChange={unit=>setBatchForm(f=>({...f,unit}))}/>
          {availOldStock.length>0&&<div style={{background:"#422006",border:"1px solid #f59e0b",borderRadius:"8px",padding:"10px 14px",marginBottom:"14px",display:"flex",alignItems:"center",gap:"8px"}}>
            <span style={{fontSize:"16px"}}>⚠️</span>
            <div>
              <div style={{fontSize:"12px",fontWeight:"700",color:"#f59e0b"}}>Old/Rejected Material Available for this Product!</div>
              <div style={{fontSize:"12px",color:"#d97706"}}>{availOldStock.map(s=>`${s.qty} ${s.unit} (Ref: ${s.batchRef||"—"})`).join(" · ")} — consider using this before new production.</div>
            </div>
          </div>}
          <Grid2>
            <Field label="Shade / Colour"><input style={inp} value={batchForm.shade} onChange={e=>setBatchForm({...batchForm,shade:e.target.value})} placeholder="e.g. Off White, Base"/></Field>
            <Field label={isAdmin?"Date Issued (Admin — editable)":"🔒 Date Issued (auto-set, admin only)"}>{isAdmin
              ?<input type="date" style={inp} value={batchForm.dateIssued} onChange={e=>setBatchForm({...batchForm,dateIssued:e.target.value})}/>
              :<div style={{...inp,color:"#22c55e",fontWeight:"600",cursor:"default",display:"flex",alignItems:"center",gap:"6px"}}><span>📅</span>{batchForm.dateIssued}<span style={{fontSize:"10px",color:"#334155",marginLeft:"auto"}}>🔒 locked</span></div>
            }</Field>
          </Grid2>
          <Grid2>
            <Field label="Batch Size *"><input style={inp} value={batchForm.batchSize} onChange={e=>setBatchForm({...batchForm,batchSize:e.target.value})} placeholder="1000"/></Field>
            <Field label="Unit">
              <div style={{...inp,background:"#060b16",cursor:"default",display:"flex",alignItems:"center",gap:"8px",color:batchForm.unit?"#22c55e":"#475569",fontWeight:"600"}}>
                {batchForm.unit||"— select category first —"}
                {batchForm.unit&&<span style={{fontSize:"10px",color:"#475569",fontWeight:"400"}}>(auto from category)</span>}
              </div>
            </Field>
          </Grid2>
          <Field label="Issued By"><input style={inp} value={batchForm.issuedBy} onChange={e=>setBatchForm({...batchForm,issuedBy:e.target.value})} placeholder={user.email}/></Field>
          <Field label="Old/Rejected Material Used (if any)"><input style={inp} value={batchForm.oldStockUsed} onChange={e=>setBatchForm({...batchForm,oldStockUsed:e.target.value})} placeholder="e.g. 200kg from GCC-2501-005"/></Field>
          <Field label="Issue Notes"><textarea style={{...ta,minHeight:"56px"}} value={batchForm.issueNotes} onChange={e=>setBatchForm({...batchForm,issueNotes:e.target.value})}/></Field>
          <InfoBox color="#3b82f6">Batch number is a 4-digit sequential number (e.g. 0001, 0002…) — resets to 0001 each April 1st (new financial year). FY {getFYLabel(getFY())} current.</InfoBox>
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
            <Btn label="Cancel" onClick={()=>setShowIssueBatch(false)} outline color="#475569"/>
            <Btn label={saving?"Issuing…":"Issue Batch"} onClick={saveBatch} disabled={saving} color="#3b82f6"/>
          </div>
        </>;
      })()}
    </Modal>

    {/* Add Complaint */}
    <Modal open={showAddComplaint} onClose={()=>setShowAddComplaint(false)} title="Add New Complaint">
      {/* Source: did complaint come via salesman or HO? */}
      <div style={{marginBottom:"14px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>Where was this complaint received?</div>
        <div style={{display:"flex",gap:"8px"}}>
          {[["salesman","👤 Received by Salesman"],["ho","🏢 Received at HO"]].map(([v,l])=><button key={v} onClick={()=>setComplaintForm({...complaintForm,source:v})} style={{flex:1,padding:"9px",background:complaintForm.source===v?"#1e3a5f":"#080d18",border:`1px solid ${complaintForm.source===v?"#3b82f6":"#1e293b"}`,borderRadius:"8px",color:complaintForm.source===v?"#93c5fd":"#475569",fontWeight:"700",fontSize:"12.5px",cursor:"pointer"}}>{l}</button>)}
        </div>
      </div>
      {/* HO: assign to salesman */}
      {complaintForm.source==="ho"&&<div style={{background:"#0a1a2e",border:"1px solid #1e3a5f",borderRadius:"8px",padding:"10px 12px",marginBottom:"12px"}}>
        <Field label="Assign to Salesman (they will be notified to visit customer)">
          <select style={sl} value={complaintForm.assignedSalesman} onChange={e=>setComplaintForm({...complaintForm,assignedSalesman:e.target.value})}>
            <option value="">— Assign later —</option>
            {Object.keys(allRoles).filter(e=>(allRoles[e]||[]).includes("sales")).map(e=><option key={e} value={e}>{allProfiles[e]?.displayName||e.split("@")[0]}</option>)}
          </select>
        </Field>
      </div>}
      <Grid2>
        <Field label="Customer Name *">
          <CustomerSearchInput value={complaintForm.customerName} customers={complaintCustomers} onChange={v=>setComplaintForm({...complaintForm,customerName:v})}/>
        </Field>
        <Field label="Product *"><input style={inp} value={complaintForm.productName} onChange={e=>setComplaintForm({...complaintForm,productName:e.target.value})} placeholder="Product name"/></Field>
      </Grid2>
      {/* User / Salesman — auto-filled for salesman source, manual for HO */}
      <Field label="User / Salesman">
        {complaintForm.source==="salesman"
          ?<div style={{...inp,color:"#94a3b8",background:"#060d1a",display:"flex",alignItems:"center",gap:"8px"}}>
            <span>👤</span>
            <span style={{color:"#e2e8f0",fontWeight:"600"}}>{allProfiles[user.email]?.displayName||user.email.split("@")[0]}</span>
            <span style={{fontSize:"10.5px",color:"#475569"}}>(you — auto-filled)</span>
          </div>
          :<select style={sl} value={complaintForm.reportedByUser||""} onChange={e=>setComplaintForm({...complaintForm,reportedByUser:e.target.value})}>
            <option value="">— Select user —</option>
            {Object.keys(allRoles).sort().map(e=><option key={e} value={e}>{allProfiles[e]?.displayName||e.split("@")[0]}</option>)}
          </select>}
      </Field>
      <Grid3>
        <Field label="Batch No"><input style={inp} value={complaintForm.batchNo} onChange={e=>setComplaintForm({...complaintForm,batchNo:e.target.value})} placeholder="e.g. GCC-2501-001"/></Field>
        <Field label="Month / Year"><input style={inp} value={complaintForm.monthYear} onChange={e=>setComplaintForm({...complaintForm,monthYear:e.target.value})} placeholder="e.g. Jan 2025"/></Field>
        <Field label="Invoice No"><input style={inp} value={complaintForm.invoiceNo} onChange={e=>setComplaintForm({...complaintForm,invoiceNo:e.target.value})} placeholder="Invoice number"/></Field>
      </Grid3>
      <Field label="Material Available with Customer"><input style={inp} value={complaintForm.materialAvailable} onChange={e=>setComplaintForm({...complaintForm,materialAvailable:e.target.value})} placeholder="e.g. 15 L, 2 tins, approx half drum"/></Field>
      <Grid2>
        <Field label="Process of Application"><input style={inp} value={complaintForm.applicationProcess} onChange={e=>setComplaintForm({...complaintForm,applicationProcess:e.target.value})} placeholder="Spray, brush, roller, dip..."/></Field>
        <Field label="Thinner Used"><input style={inp} value={complaintForm.thinnerUsed} onChange={e=>setComplaintForm({...complaintForm,thinnerUsed:e.target.value})} placeholder="PU Thinner, NC Thinner, ratio..."/></Field>
      </Grid2>
      <Field label="Complaint Description *"><textarea style={{...ta,minHeight:"100px"}} value={complaintForm.complaint} onChange={e=>setComplaintForm({...complaintForm,complaint:e.target.value})} placeholder="Describe the complaint in detail..."/></Field>
      {/* Visited customer */}
      <div style={{background:"#080d18",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 12px",marginBottom:"12px"}}>
        <div style={{fontSize:"11.5px",fontWeight:"700",color:"#e2e8f0",marginBottom:"8px"}}>Customer Visit</div>
        <Grid2>
          <Field label="Visited Customer?">
            <select style={sl} value={complaintForm.visitedCustomer} onChange={e=>setComplaintForm({...complaintForm,visitedCustomer:e.target.value})}>
              <option value="">— Not yet —</option>
              <option value="yes">✓ Yes, visited</option>
              <option value="no">✗ Not yet visited</option>
              <option value="scheduled">📅 Visit scheduled</option>
            </select>
          </Field>
          {complaintForm.visitedCustomer==="yes"&&<Field label="Date of Visit"><input type="date" style={inp} value={complaintForm.visitDate} onChange={e=>setComplaintForm({...complaintForm,visitDate:e.target.value})}/></Field>}
        </Grid2>
      </div>
      <div style={{marginBottom:"14px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>📎 Attach Photos / Videos (optional)</div>
        <FileAttachment folder={`complaints/${user?.email?.split("@")[0]||"user"}`} existingFiles={complaintFiles} onFilesChange={setComplaintFiles} maxFiles={5}/>
      </div>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowAddComplaint(false)} outline color="#475569"/>
        <Btn label={saving?"Saving…":"Submit Complaint"} onClick={saveComplaint} disabled={saving} color="#ef4444"/>
      </div>
    </Modal>

    {/* Complaint Workspace */}
    <Modal wide open={!!activeComplaint} onClose={()=>setActiveComplaint(null)} title="Complaint Details">
      {activeComplaint&&<ComplaintWorkspace complaint={activeComplaint} role={role} roles={roles} showToast={showToast} user={user} allProfiles={allProfiles} allRoles={allRoles} isAdmin={isAdmin}/>}
    </Modal>

    {/* Project Workspace */}
    <Modal wide open={!!activeProject} onClose={()=>setActiveProject(null)} title="Project Workspace">
      {activeProject&&<ProjectWorkspace key={activeProject.id} project={activeProject} isAdmin={isAdmin} showToast={showToast} sysUnits={sysUnits} sysRmCats={sysRmCats} onAddRmCat={addGlobalRmCat} onAddUnit={addGlobalUnit} allProfiles={allProfiles} allRoles={allRoles} user={user}/>}
    </Modal>

    {/* Add Project */}
    <Modal open={showAddProject} onClose={()=>setShowAddProject(false)} title="New R&D Project">
      <Field label="Project Name *"><input style={inp} value={projForm.projectName} onChange={e=>setProjForm({...projForm,projectName:e.target.value})} placeholder="e.g. Water-based Exterior Emulsion v3"/></Field>
      <Grid2>
        <Field label="Project Code"><input style={inp} value={projForm.projectCode} onChange={e=>setProjForm({...projForm,projectCode:e.target.value})} placeholder="Auto-generated if blank"/></Field>
        <Field label="Paint Type"><select style={sl} value={projForm.paintType} onChange={e=>setProjForm({...projForm,paintType:e.target.value})}>{(sysPaintTypes||PAINT_TYPES).map(t=><option key={t}>{t}</option>)}</select></Field>
      </Grid2>
      <Field label="Target Application"><input style={inp} value={projForm.application} onChange={e=>setProjForm({...projForm,application:e.target.value})} placeholder="e.g. Interior walls, Metal surfaces"/></Field>
      <Grid2>
        <Field label="Status"><select style={sl} value={projForm.status} onChange={e=>setProjForm({...projForm,status:e.target.value})}>{PROJECT_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
        <Field label="Target Date"><input type="date" style={inp} value={projForm.targetDate} onChange={e=>setProjForm({...projForm,targetDate:e.target.value})}/></Field>
      </Grid2>
      <Field label="Assigned To">
        <select style={sl} value={projForm.assignedTo} onChange={e=>setProjForm({...projForm,assignedTo:e.target.value})}>
          <option value="">— Select team member —</option>
          {rdUsers.map(email=><option key={email} value={email}>{allProfiles[email]?.displayName||email}</option>)}
        </select>
        {rdUsers.length===0&&<div style={{fontSize:"11px",color:"#f59e0b",marginTop:"6px"}}>⚠ No users currently have R&D access. Grant via Users → 🔒 Permissions.</div>}
      </Field>
      <Field label="Objective"><textarea style={ta} value={projForm.objective} onChange={e=>setProjForm({...projForm,objective:e.target.value})} placeholder="What is this project trying to achieve?"/></Field>
      <Field label="Formulation Base"><textarea style={ta} value={projForm.formulationBase} onChange={e=>setProjForm({...projForm,formulationBase:e.target.value})} placeholder="Base resin, key pigments, binders..."/></Field>
      <Field label="Notes"><textarea style={{...ta,minHeight:"56px"}} value={projForm.notes} onChange={e=>setProjForm({...projForm,notes:e.target.value})}/></Field>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowAddProject(false)} outline color="#475569"/>
        <Btn label={saving?"Creating…":"Create Project"} onClick={saveProject} disabled={saving} color="#3b82f6"/>
      </div>
    </Modal>

    {/* Edit Project */}
    <Modal open={!!editProject} onClose={()=>setEditProject(null)} title="Edit Project">
      {editProject&&<>
        <Field label="Project Name *"><input style={inp} value={editProject.projectName} onChange={e=>setEditProject({...editProject,projectName:e.target.value})}/></Field>
        <Grid2>
          <Field label="Project Code"><input style={inp} value={editProject.projectCode} onChange={e=>setEditProject({...editProject,projectCode:e.target.value})}/></Field>
          <Field label="Paint Type"><select style={sl} value={editProject.paintType} onChange={e=>setEditProject({...editProject,paintType:e.target.value})}>{(sysPaintTypes||PAINT_TYPES).map(t=><option key={t}>{t}</option>)}</select></Field>
        </Grid2>
        <Field label="Target Application"><input style={inp} value={editProject.application||""} onChange={e=>setEditProject({...editProject,application:e.target.value})}/></Field>
        <Grid2>
          <Field label="Status"><select style={sl} value={editProject.status} onChange={e=>setEditProject({...editProject,status:e.target.value})}>{PROJECT_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
          <Field label="Target Date"><input type="date" style={inp} value={editProject.targetDate||""} onChange={e=>setEditProject({...editProject,targetDate:e.target.value})}/></Field>
        </Grid2>
        <Field label="Assigned To">
          <select style={sl} value={editProject.assignedTo||""} onChange={e=>setEditProject({...editProject,assignedTo:e.target.value})}>
            <option value="">— Select team member —</option>
            {rdUsers.map(email=><option key={email} value={email}>{allProfiles[email]?.displayName||email}</option>)}
          </select>
        </Field>
        <Field label="Objective"><textarea style={ta} value={editProject.objective||""} onChange={e=>setEditProject({...editProject,objective:e.target.value})}/></Field>
        <Field label="Formulation Base"><textarea style={ta} value={editProject.formulationBase||""} onChange={e=>setEditProject({...editProject,formulationBase:e.target.value})}/></Field>
        <Field label="Notes"><textarea style={{...ta,minHeight:"56px"}} value={editProject.notes||""} onChange={e=>setEditProject({...editProject,notes:e.target.value})}/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setEditProject(null)} outline color="#475569"/>
          <Btn label={saving?"Saving…":"Save Changes"} onClick={()=>updateProject(editProject)} disabled={saving} color="#f59e0b"/>
        </div>
      </>}
    </Modal>

    {/* Add RM */}
    <Modal open={showAddRM} onClose={()=>setShowAddRM(false)} title="New Raw Material Test Entry">
      <Grid2>
        <Field label="Material Name *"><input style={inp} value={rmForm.materialName} onChange={e=>setRmForm({...rmForm,materialName:e.target.value})} placeholder="e.g. TiO2, Alkyd Resin"/></Field>
        <Field label="Vendor / Supplier *"><input style={inp} value={rmForm.vendorName} onChange={e=>setRmForm({...rmForm,vendorName:e.target.value})}/></Field>
      </Grid2>
      <Grid2>
        <div>
          <div style={{fontSize:"10.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px",display:"flex",alignItems:"center",gap:"8px"}}>Category {addGlobalRmCat&&<QuickAdd label="Category" onAdd={addGlobalRmCat} color="#f97316"/>}</div>
          <select style={sl} value={rmForm.category} onChange={e=>setRmForm({...rmForm,category:e.target.value})}>{(sysRmCats||RM_CATEGORIES).map(c=><option key={c}>{c}</option>)}</select>
        </div>
        <Field label="Date Received"><input type="date" style={inp} value={rmForm.dateReceived} onChange={e=>setRmForm({...rmForm,dateReceived:e.target.value})}/></Field>
      </Grid2>
      <Grid2>
        <Field label="Batch / Lot No"><input style={inp} value={rmForm.batchNo} onChange={e=>setRmForm({...rmForm,batchNo:e.target.value})}/></Field>
        <Field label="Quantity Received"><input style={inp} value={rmForm.quantityReceived} onChange={e=>setRmForm({...rmForm,quantityReceived:e.target.value})} placeholder="e.g. 25 kg"/></Field>
      </Grid2>
      <Field label="Specification — What to Test"><textarea style={ta} value={rmForm.specsToTest} onChange={e=>setRmForm({...rmForm,specsToTest:e.target.value})} placeholder="e.g. Viscosity 80-100cps, pH 6.5-7.5, Density 1.1-1.3 g/ml..."/></Field>
      <Field label="Assign To (QC) — notifies on save">
        <select style={sl} value={rmForm.assignedTo} onChange={e=>setRmForm({...rmForm,assignedTo:e.target.value})}>
          <option value="">— Not assigned (no notification) —</option>
          {qcUsersForRM.length>1&&<option value="__all_qc__">📢 All QC users</option>}
          {qcUsersForRM.map(email=><option key={email} value={email}>{allProfiles[email]?.displayName||email}</option>)}
        </select>
      </Field>
      <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 12px",margin:"4px 0 12px"}}>
        <div style={{fontSize:"10.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"6px"}}>Optional — only fill if this material has already been tested</div>
        <Grid2>
          <Field label="Tested By"><input style={inp} value={rmForm.testedBy} onChange={e=>setRmForm({...rmForm,testedBy:e.target.value})}/></Field>
          <Field label="Test Result"><select style={sl} value={rmForm.testResult} onChange={e=>setRmForm({...rmForm,testResult:e.target.value})}>{TEST_RESULTS.map(r=><option key={r}>{r}</option>)}</select></Field>
        </Grid2>
        <Field label="Tests Performed"><textarea style={ta} value={rmForm.testsPerformed} onChange={e=>setRmForm({...rmForm,testsPerformed:e.target.value})} placeholder="Viscosity, pH, Fineness, Density..."/></Field>
        <Field label="Observations / Results"><textarea style={ta} value={rmForm.observations} onChange={e=>setRmForm({...rmForm,observations:e.target.value})} placeholder="Values measured, deviations from spec..."/></Field>
        <Field label="Remarks / Action Taken"><textarea style={{...ta,minHeight:"56px"}} value={rmForm.remarks} onChange={e=>setRmForm({...rmForm,remarks:e.target.value})} placeholder="Accepted / Rejected / Returned to vendor..."/></Field>
      </div>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowAddRM(false)} outline color="#475569"/>
        <Btn label={saving?"Saving…":"Save Entry"} onClick={saveRM} disabled={saving} color="#3b82f6"/>
      </div>
    </Modal>

    {/* View / Retest RM */}
    <Modal wide open={!!viewRM} onClose={()=>setViewRM(null)} title="Raw Material Test Details">
      {viewRM&&<RMDetailView entry={viewRM} showToast={showToast} allProfiles={allProfiles}/>}
    </Modal>

    {/* Edit RM */}
    <Modal open={!!editRM} onClose={()=>setEditRM(null)} title="Edit RM Entry">
      {editRM&&<>
        <Grid2>
          <Field label="Material Name *"><input style={inp} value={editRM.materialName} onChange={e=>setEditRM({...editRM,materialName:e.target.value})}/></Field>
          <Field label="Vendor / Supplier *"><input style={inp} value={editRM.vendorName} onChange={e=>setEditRM({...editRM,vendorName:e.target.value})}/></Field>
        </Grid2>
        <Grid2>
          <Field label="Category"><select style={sl} value={editRM.category} onChange={e=>setEditRM({...editRM,category:e.target.value})}>{(sysRmCats||RM_CATEGORIES).map(c=><option key={c}>{c}</option>)}</select></Field>
          <Field label="Date Received"><input type="date" style={inp} value={editRM.dateReceived||""} onChange={e=>setEditRM({...editRM,dateReceived:e.target.value})}/></Field>
        </Grid2>
        <Grid2>
          <Field label="Batch / Lot No"><input style={inp} value={editRM.batchNo||""} onChange={e=>setEditRM({...editRM,batchNo:e.target.value})}/></Field>
          <Field label="Qty Received"><input style={inp} value={editRM.quantityReceived||""} onChange={e=>setEditRM({...editRM,quantityReceived:e.target.value})}/></Field>
        </Grid2>
        <Field label="Specification — What to Test"><textarea style={ta} value={editRM.specsToTest||""} onChange={e=>setEditRM({...editRM,specsToTest:e.target.value})}/></Field>
        <Field label="Assign To (QC)">
          <select style={sl} value={editRM.assignedTo||""} onChange={e=>setEditRM({...editRM,assignedTo:e.target.value})}>
            <option value="">— Not assigned —</option>
            {qcUsersForRM.length>1&&<option value="__all_qc__">📢 All QC users</option>}
            {qcUsersForRM.map(email=><option key={email} value={email}>{allProfiles[email]?.displayName||email}</option>)}
          </select>
        </Field>
        <Grid2>
          <Field label="Tested By"><input style={inp} value={editRM.testedBy||""} onChange={e=>setEditRM({...editRM,testedBy:e.target.value})}/></Field>
          <Field label="Test Result"><select style={sl} value={editRM.testResult} onChange={e=>setEditRM({...editRM,testResult:e.target.value})}>{TEST_RESULTS.map(r=><option key={r}>{r}</option>)}</select></Field>
        </Grid2>
        <Field label="Tests Performed"><textarea style={ta} value={editRM.testsPerformed||""} onChange={e=>setEditRM({...editRM,testsPerformed:e.target.value})}/></Field>
        <Field label="Observations / Results"><textarea style={ta} value={editRM.observations||""} onChange={e=>setEditRM({...editRM,observations:e.target.value})}/></Field>
        <Field label="Remarks"><textarea style={{...ta,minHeight:"56px"}} value={editRM.remarks||""} onChange={e=>setEditRM({...editRM,remarks:e.target.value})}/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setEditRM(null)} outline color="#475569"/>
          <Btn label={saving?"Saving…":"Save Changes"} onClick={()=>updateRM(editRM)} disabled={saving} color="#f59e0b"/>
        </div>
      </>}
    </Modal>

    {/* Toast */}
    {toast&&<div style={{position:"fixed",bottom:"24px",left:"50%",transform:"translateX(-50%)",background:toast.type==="error"?"#450a0a":"#052e16",border:`1px solid ${toast.type==="error"?"#7f1d1d":"#166534"}`,borderRadius:"10px",padding:"11px 22px",color:"#f1f5f9",fontSize:"13.5px",fontWeight:"600",zIndex:3000,boxShadow:"0 8px 30px rgba(0,0,0,0.6)",animation:"fadeIn 0.2s ease",whiteSpace:"nowrap"}}>
      {toast.msg}
    </div>}
  </div>;
}

// ══════════════════════════════════════════════════════════
// ROOT
// ══════════════════════════════════════════════════════════
const ROLE_PRIORITY=["admin","qc","issuer","ho","sales","store"];
const primaryRole=(rolesArr)=>ROLE_PRIORITY.find(r=>(rolesArr||[]).includes(r))||rolesArr?.[0]||null;

function App(){
  const [user,setUser]=useState(undefined);
  const [role,setRole]=useState(null);     // primary role (for backward compat)
  const [roles,setRoles]=useState([]);     // full roles array
  const [permissions,setPermissions]=useState([]); // granular permissions array
  const [loading,setLoading]=useState(false);

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async u=>{
      setUser(u||null);
      if(u){
        setLoading(true);
        try{await db.collection("userProfiles").doc(u.uid).set({email:u.email,lastLogin:ts()},{merge:true});}catch(e){}

        // ── ADMIN SHORTCUT: always first, cannot be banned or reset ──
        if(ADMIN_EMAILS.includes(u.email)){
          db.collection("passwordResets").doc(u.email).delete().catch(()=>{});
          db.collection("bannedUsers").doc(u.email).delete().catch(()=>{});
          setRole("admin");setRoles(["admin"]);setPermissions([]);setLoading(false);return;
        }

        // ── Ban check (non-admin only) ──
        try{
          const banned=await db.collection("bannedUsers").doc(u.email).get();
          if(banned.exists){await auth.signOut();setRoles([]);setRole(null);setLoading(false);return;}
        }catch(e){}

        // ── Password reset flow (non-admin only) ──
        try{
          const pr=await db.collection("passwordResets").doc(u.email).get();
          if(pr.exists){
            const {newPassword}=pr.data();
            try{
              const idToken=await u.getIdToken(true);
              const resp=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:update?key=${firebaseConfig.apiKey}`,{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({idToken,password:newPassword,returnSecureToken:true})
              });
              const result=await resp.json();
              if(result.error){throw new Error(result.error.message);}
              await db.collection("passwordResets").doc(u.email).delete();
              await auth.signOut();
              alert("Your password has been changed by the admin.\n\nPlease log in again with your new password.");
              return;
            }catch(passErr){
              console.error("Password update failed:",passErr.message);
              await db.collection("passwordResets").doc(u.email).delete().catch(()=>{});
              alert("Password auto-change failed. Please contact your admin.");
            }
          }
        }catch(e){console.error("Password reset check failed:",e);}

        // ── Role lookup (non-admin only) ──
        try{
          const snap=await db.collection("roles").doc(u.email).get();
          if(snap.exists){
            const data=snap.data();
            const rolesArr=data.roles||(data.role?[data.role]:[]);
            const permsArr=data.permissions||[];
            const prim=primaryRole(rolesArr)||"store";
            setRoles(rolesArr);setRole(prim);
            setPermissions(permsArr);
          }else{setRoles([]);setRole(null);setPermissions([]);}
        }catch(e){setRoles([]);setRole(null);}
        setLoading(false);
      }else{setRoles([]);setRole(null);setLoading(false);}
    });
    return unsub;
  },[]);

  if(user===undefined||loading)return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#475569",fontSize:"14px"}}>Loading…</div>;
  if(!user)return <LoginScreen/>;
  if(!role)return <NoAccessScreen/>;
  return <MainApp user={user} role={role} roles={roles} permissions={permissions}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
