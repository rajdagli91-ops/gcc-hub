        <div style={{fontSize:"14px",fontWeight:"700",color:"#f87171",marginBottom:"4px"}}>↩ Reverse Dispatch — {reverseForm.partyName}</div>
        <div style={{fontSize:"11.5px",color:"#475569",marginBottom:"14px"}}>Adjust quantities to reverse. Set to 0 to keep an item as dispatched. Full reverse restores to pending orders.</div>
        <div style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"14px"}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 80px 80px",gap:"6px",background:"#0b1220",padding:"6px 12px",fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.06em"}}>
            <span>Product</span><span style={{textAlign:"center"}}>Dispatched</span><span style={{textAlign:"center"}}>Reverse Qty</span>
          </div>
          {reverseForm.items.map((item,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"2fr 80px 80px",gap:"6px",padding:"7px 12px",borderTop:"1px solid #0f172a",alignItems:"center"}}>
            <div style={{fontSize:"12px",color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</div>
            <div style={{textAlign:"center",fontSize:"13px",fontWeight:"700",color:"#4ade80"}}>{item.qty}</div>
            <div style={{display:"flex",gap:"4px",alignItems:"center",justifyContent:"center"}}>
              <input type="number" min="0" max={item.qty} step="0.001" value={item.reverseQty}
                onChange={e=>setReverseForm(f=>({...f,items:f.items.map((it,ii)=>ii===i?{...it,reverseQty:e.target.value}:it)}))}
                style={{...inp,width:"65px",padding:"4px 6px",fontSize:"12px",textAlign:"center"}}/>
              <button onClick={()=>setReverseForm(f=>({...f,items:f.items.map((it,ii)=>ii===i?{...it,reverseQty:String(item.qty)}:it)}))}
                style={{background:"none",border:"none",color:"#334155",fontSize:"10px",cursor:"pointer",padding:"0 2px"}} title="Set to full">↑all</button>
            </div>
          </div>)}
        </div>
        <div style={{background:"#0f0505",border:"1px solid #7f1d1d40",borderRadius:"6px",padding:"8px 12px",marginBottom:"14px",fontSize:"11.5px",color:"#fca5a5"}}>
          Leave qty empty to skip an item. Reversed qty restores to <strong>Balance</strong> in pending orders.
        </div>
        <div style={{display:"flex",gap:"8px",justifyContent:"space-between",alignItems:"center"}}>
          <button onClick={()=>setReverseForm(f=>({...f,items:f.items.map(it=>({...it,reverseQty:String(it.qty)}))}))}
            style={{background:"#1a0505",border:"1px solid #7f1d1d",borderRadius:"6px",padding:"7px 14px",color:"#f87171",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>↩ Reverse All (Fill Max)</button>
          <div style={{display:"flex",gap:"8px"}}>
            <button onClick={()=>setReverseForm(null)} style={{background:"none",border:"1px solid #334155",borderRadius:"6px",padding:"7px 14px",color:"#475569",fontSize:"12px",cursor:"pointer"}}>Cancel</button>
            <button onClick={reverseDispatch} disabled={reverseSaving}
              style={{background:"#2e0a0a",border:"1px solid #ef4444",borderRadius:"6px",padding:"7px 14px",color:"#fca5a5",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>{reverseSaving?"Reversing…":"↩ Confirm Reverse"}</button>
          </div>
        </div>
      </div>
    </div>}

    {/* ── DISPATCHED (24h) TAB — confirmed dispatches for reversal within 24h ── */}
    {subTab==="dispatched"&&<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px",flexWrap:"wrap",gap:"8px"}}>
        <div>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#3b82f6"}}>✅ Dispatched — Reversal available for 48h</div>
          <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>{filteredDispatched48h.length} customer{filteredDispatched48h.length!==1?"s":""}</div>
        </div>
        <div style={{display:"flex",gap:"5px",flexWrap:"wrap",alignItems:"center"}}>
          {[["All","All"],["Direct","🚚 Direct"],["Transport","🏢 Transport"]].map(([v,l])=><button key={v} onClick={()=>setDispatched48hTypeFilter(v)} style={{background:dispatched48hTypeFilter===v?"#1e293b":"#080d18",border:`1px solid ${dispatched48hTypeFilter===v?"#475569":"#1e293b"}`,borderRadius:"5px",padding:"3px 10px",color:dispatched48hTypeFilter===v?"#f1f5f9":"#475569",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>{l}</button>)}
          {dispatched48hDates.length>0&&<>
            <span style={{color:"#334155",fontSize:"12px"}}>|</span>
            <button onClick={()=>setDispatched48hDateFilter("all")} style={{background:dispatched48hDateFilter==="all"?"#1e3a5f":"#080d18",border:`1px solid ${dispatched48hDateFilter==="all"?"#3b82f6":"#1e293b"}`,borderRadius:"5px",padding:"3px 9px",color:dispatched48hDateFilter==="all"?"#93c5fd":"#475569",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>All</button>
            {dispatched48hDates.map(d=><button key={d} onClick={()=>setDispatched48hDateFilter(dispatched48hDateFilter===d?"all":d)} style={{background:dispatched48hDateFilter===d?"#1e3a5f":"#080d18",border:`1px solid ${dispatched48hDateFilter===d?"#3b82f6":"#1e293b"}`,borderRadius:"5px",padding:"3px 9px",color:dispatched48hDateFilter===d?"#93c5fd":"#475569",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>{d.slice(5)}</button>)}
          </>}
        </div>
      </div>
      {filteredDispatched48h.length===0
        ?<div style={{textAlign:"center",padding:"50px",border:"2px dashed #1e293b",borderRadius:"10px",color:"#334155"}}>No confirmed dispatches{dispatched48hDateFilter!=="all"?` for ${dispatched48hDateFilter}`:" in the last 48 hours"}.</div>
        :filteredDispatched48h.map((group,gi)=><div key={group.partyName} style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:"3px solid #3b82f6",borderRadius:"10px",marginBottom:"7px",overflow:"hidden",opacity:0.85}}>
          <div style={{padding:"9px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"6px"}}>
            <div>
              <div style={{fontSize:"12.5px",fontWeight:"700",color:"#f1f5f9"}}>{gi+1}. {group.partyName}</div>
              <div style={{fontSize:"10.5px",color:"#475569",display:"flex",gap:"8px",marginTop:"1px",flexWrap:"wrap"}}>
                <span style={{color:group.isDirect?"#22c55e":"#93c5fd"}}>{group.isDirect?"🚚 Direct":"🏢 "+group.transport}</span>
                <span>{group.route}</span>
                {group.items[0]?.dispatchDate&&<span style={{color:"#fcd34d",fontWeight:"700"}}>📅 {group.items[0].dispatchDate}</span>}
              </div>
            </div>
            <div style={{display:"flex",gap:"5px",alignItems:"center"}}>
              <span style={{fontSize:"10px",color:"#4ade80",background:"#052e16",border:"1px solid #166534",borderRadius:"99px",padding:"2px 8px"}}>✓ Delivered</span>
              {canDispatch&&group.items.some(i=>i.canReverse)&&<>
                <button onClick={()=>openReverseForm(group.partyName,group.items.filter(i=>i.canReverse))}
                  style={{background:"#2e0a0a",border:"1px solid #7f1d1d",borderRadius:"6px",padding:"3px 9px",color:"#f87171",fontWeight:"700",fontSize:"11px",cursor:"pointer"}}>↩ Select Items</button>
                <button onClick={()=>{if(confirm(`Reverse ENTIRE order for ${group.partyName}?`))reverseEntireOrder(group.partyName,group.items.filter(i=>i.canReverse));}} disabled={reverseSaving}
                  style={{background:"#450a0a",border:"1px solid #dc2626",borderRadius:"6px",padding:"3px 9px",color:"#fca5a5",fontWeight:"700",fontSize:"11px",cursor:"pointer"}}>↩ Reverse All</button>
              </>}
            </div>
          </div>
          <div style={{background:"#060d1a",borderTop:"1px solid #0f172a"}}>
            {group.items.map((item,ii)=><div key={ii} style={{display:"flex",justifyContent:"space-between",padding:"5px 12px",borderTop:ii===0?"none":"1px solid #0f172a",gap:"8px",alignItems:"center"}}>
              <div style={{fontSize:"11.5px",color:"#64748b",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</div>
              <div style={{display:"flex",gap:"5px",alignItems:"center",flexShrink:0}}>
                <span style={{fontSize:"12px",fontWeight:"700",color:"#4ade80"}}>{item.qty}</span>
                {item.vol&&<span style={{fontSize:"10px",color:"#334155",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"4px",padding:"1px 5px"}}>{item.vol.vol} {item.vol.unit}</span>}
                <span style={{fontSize:"9px",color:"#334155"}}>{item.voucherNo}</span>
                <span style={{fontSize:"9px",color:"#334155"}}>{item.confirmedAt?new Date(item.confirmedAt).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}):""}</span>
              </div>
            </div>)}
          </div>
        </div>)}
    </div>}

    {/* ── DIRECT PREP TAB ── */}
    {subTab==="direct_prep"&&<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px",flexWrap:"wrap",gap:"8px"}}>
        <div>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#22c55e"}}>🚚 Direct Delivery Preparation</div>
          <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>Select an area to view pending direct orders sorted by delivery sequence</div>
        </div>
        <div style={{display:"flex",gap:"5px",alignItems:"center"}}>
          <span style={{fontSize:"10.5px",color:"#64748b"}}>Sequence:</span>
          {Object.keys(deliverySequence.direct||{}).length>0&&<button onClick={async()=>{
            await loadXLSX();const XLSX=window.XLSX;
            const wb=XLSX.utils.book_new();
            const directSeq=deliverySequence.direct||{};
            // Each key = route (or "all"); each sheet = one route
            Object.entries(directSeq).forEach(([routeKey,seqMap])=>{
              if(!seqMap||typeof seqMap!=="object")return;
              const rows=[["#","Customer Name"]];
              Object.values(seqMap).sort((a,b)=>a.seq-b.seq).forEach(({name,seq})=>rows.push([seq,name]));
              const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:6},{wch:40}];
              XLSX.utils.book_append_sheet(wb,ws,routeKey.slice(0,31));
            });
            if(wb.SheetNames.length===0)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["#","Customer Name"]]),"all");
            XLSX.writeFile(wb,"VEEBEE_Direct_Sequence.xlsx");
          }} style={{background:"#060d1a",border:"1px solid #334155",borderRadius:"5px",padding:"3px 10px",color:"#64748b",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>⬇ Download</button>}
          <button onClick={()=>document.getElementById("dir-seq-import").click()} disabled={loadingSeq} style={{background:"#060d1a",border:"1px solid #166534",borderRadius:"5px",padding:"3px 10px",color:"#4ade80",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>⬆ {directPrepArea==="All"?"Upload (All Routes)":"Upload for "+directPrepArea}</button>
          <input id="dir-seq-import" type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={async e=>{if(e.target.files[0]){await importDeliverySequence(e.target.files[0],"direct");e.target.value="";}}}/>
          <span style={{fontSize:"9.5px",color:"#334155"}}>Each sheet = one route</span>        </div>
      </div>

      {/* Area filter + admin management */}
      <div style={{display:"flex",gap:"4px",marginBottom:"8px",flexWrap:"wrap",alignItems:"center"}}>
        {["All",...directAreas].map(area=><button key={area} onClick={()=>setDirectPrepArea(area)} style={{background:directPrepArea===area?"#052e16":"#080d18",border:`1px solid ${directPrepArea===area?"#166534":"#1e293b"}`,borderRadius:"5px",padding:"4px 10px",color:directPrepArea===area?"#4ade80":"#475569",fontSize:"11px",fontWeight:"600",cursor:"pointer",whiteSpace:"nowrap"}}>{area}</button>)}
        {isAdmin&&<button onClick={()=>setEditingAreas(e=>!e)} style={{background:editingAreas?"#1e293b":"#080d18",border:"1px solid #334155",borderRadius:"5px",padding:"4px 10px",color:"#475569",fontSize:"11px",cursor:"pointer",whiteSpace:"nowrap"}}>⚙ {editingAreas?"Done":"Edit Areas"}</button>}
      </div>

      {/* Admin: select areas from existing routes */}
      {editingAreas&&isAdmin&&<div style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 12px",marginBottom:"10px"}}>
        <div style={{fontSize:"11.5px",fontWeight:"700",color:"#64748b",marginBottom:"8px"}}>Select which routes are Direct Delivery areas</div>
        <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
          {routes.map(route=>{
            const selected=directAreas.some(a=>normRoute(a)===normRoute(route));
            return <button key={route} onClick={()=>{

                  <div style={{display:"flex",gap:"4px",alignItems:"center",flexShrink:0}}>
                    {(()=>{const ct=calcCartons(item.name,item.qty);return ct?<span style={{fontSize:"10px",color:"#a78bfa",background:"#12083a",border:"1px solid #7c3aed30",borderRadius:"4px",padding:"1px 5px"}}>{ct.cartons>0?ct.cartons+" ctn":""}{ct.loose>0?(ct.cartons>0?" + ":"")+ct.loose+" loose":""}</span>:null;})()}
                    {item.voucherNo&&<span style={{fontSize:"10px",color:"#475569",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"4px",padding:"1px 5px"}}>{item.voucherNo}</span>}
                    {item.orderDate&&<span style={{fontSize:"10px",color:"#334155"}}>{item.orderDate}</span>}
                  </div>
                  <div style={{display:"flex",gap:"5px",alignItems:"center",flexShrink:0}}>
                    <input type="number" min="0.001" max={item.qty} step="0.001"
                      value={editQty!==undefined?editQty:item.qty}
                      onChange={e=>setStagedQtyOverrides(f=>({...f,[fk]:e.target.value}))}
                      style={{...inp,width:"65px",padding:"2px 5px",fontSize:"11px",textAlign:"center",background:"#0b1220",border:`1px solid ${editQty!==undefined&&parseFloat(editQty)<item.qty?"#f59e0b":"#1e293b"}`}}/>
                    {editQty!==undefined&&parseFloat(editQty)<item.qty&&<span style={{fontSize:"9.5px",color:"#f59e0b",whiteSpace:"nowrap"}}>of {item.qty}</span>}
                  </div>
                  <button onClick={()=>stageItemsForTransport([{orderId:item.orderId,itemIdx:item.itemIdx}],false)} disabled={stagingSaving}
                    style={{background:"none",border:"none",color:"#475569",fontSize:"11px",cursor:"pointer"}}>✕</button>
                </div>;
              })}
            </div>);
          })()}
        </div>

        {/* Right panel: preparation summary */}
        <div>
          {(()=>{
            const volTotals={};
            stagedTransportItems.forEach(i=>{const v=calcVolume(i.name,i.qty);if(v)volTotals[v.unit]=(volTotals[v.unit]||0)+v.vol;});
            return Object.keys(volTotals).length>0&&<div style={{background:"#060d1a",border:"1px solid #1e3a5f",borderRadius:"6px",padding:"6px 12px",marginBottom:"8px",display:"flex",gap:"14px",flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:"10.5px",color:"#475569",fontWeight:"700"}}>Total Volume:</span>
              {Object.entries(volTotals).map(([u,v])=><span key={u} style={{fontSize:"14px",fontWeight:"700",color:"#93c5fd"}}>{v.toFixed(2)} {u}</span>)}
            </div>;
          })()}
          <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"8px"}}>Preparation Summary — {transportPrepView==="customer"?"By Customer":transportPrepView==="product"?"By Product":"By Transporter"}</div>
          {(()=>{
            // Build staged list directly from stagedTransportItems (customerGroups excludes staged items)
            const stagedList=stagedTransportItems;
            if(!stagedList.length)return null;
            if(transportPrepView==="customer"){
              const byC={};stagedList.forEach(i=>{if(!byC[i.partyName])byC[i.partyName]={partyName:i.partyName,transport:i.transport,route:i.route,items:[]};byC[i.partyName].items.push(i);});
              // Sort by delivery sequence
              const sorted=Object.values(byC).sort(seqSortFn);
              return sorted.map((c,ci)=>{
                const seq=getTransportSeq(c.partyName,c.transport);

                    <span>{seq<999&&<span style={{fontSize:"10px",color:"#a78bfa",marginRight:"5px"}}>#{seq}</span>}{c.partyName}</span>
                    <span style={{fontSize:"10px",color:"#93c5fd"}}>🏢 {c.transport}</span>
                  </div>
                  {c.items.map((it,ii)=>{
                    const ct=calcCartons(it.name,it.qty);
                    return <div key={ii} style={{display:"flex",justifyContent:"space-between",padding:"4px 12px",borderTop:ii===0?"none":"1px solid #0f172a",fontSize:"11.5px",gap:"6px"}}>
                      <span style={{color:"#94a3b8",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.name}</span>
                      <div style={{display:"flex",gap:"5px",alignItems:"center",flexShrink:0}}>

                        <span style={{color:"#fcd34d",fontWeight:"700"}}>{it.qty}</span>
                      </div>
                    </div>;
                  })}
                </div>;
              });
            }
            if(transportPrepView==="product"){
              const byP={};stagedList.forEach(i=>{if(!byP[i.name])byP[i.name]={name:i.name,total:0,customers:[]};byP[i.name].total+=i.qty;byP[i.name].customers.push(i);});
              return Object.values(byP).sort((a,b)=>b.total-a.total).map(p=>{
                const pVol=calcVolume(p.name,p.total);
                return <div key={p.name} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",marginBottom:"6px",overflow:"hidden"}}>
                <div style={{padding:"7px 12px",display:"flex",justifyContent:"space-between",borderBottom:"1px solid #0f172a"}}>
                  <span style={{fontSize:"12px",fontWeight:"700",color:"#f1f5f9",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                  <div style={{display:"flex",gap:"8px",alignItems:"center",flexShrink:0}}>
                    <span style={{fontSize:"13px",fontWeight:"700",color:"#fcd34d"}}>{p.total}</span>
                    {pVol&&<span style={{fontSize:"11px",color:"#93c5fd",background:"#0a1a2e",border:"1px solid #1e3a5f",borderRadius:"4px",padding:"1px 6px"}}>{pVol.vol} {pVol.unit}</span>}
                  </div>
                </div>
                {p.customers.map((c,ci)=><div key={ci} style={{display:"flex",justifyContent:"space-between",padding:"4px 12px",borderTop:ci===0?"none":"1px solid #0f172a",fontSize:"11px"}}>
                  <span style={{color:"#94a3b8"}}>{c.partyName}</span><span style={{color:"#fcd34d",fontWeight:"600"}}>{c.qty}</span>
                </div>)}
              </div>;});
            }
            // By transporter
            const byT={};stagedList.forEach(i=>{const k=normTKey(i.transport);if(!byT[k])byT[k]={transport:i.transport,items:[],customers:new Set()};byT[k].items.push(i);byT[k].customers.add(i.partyName);});
            return Object.values(byT).map(t=><div key={t.transport} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",marginBottom:"6px",overflow:"hidden"}}>
              <div style={{padding:"7px 12px",display:"flex",justifyContent:"space-between",borderBottom:"1px solid #0f172a"}}>
                <span style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd"}}>🏢 {t.transport}</span>
                <span style={{fontSize:"10.5px",color:"#475569"}}>{t.customers.size} customer{t.customers.size!==1?"s":""} · {t.items.length} item{t.items.length!==1?"s":""}</span>
              </div>
              {t.items.map((it,ii)=><div key={ii} style={{display:"flex",justifyContent:"space-between",padding:"4px 12px",borderTop:ii===0?"none":"1px solid #0f172a",fontSize:"11px"}}>
                <span style={{color:"#64748b",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.partyName} · {it.name}</span>
                <span style={{color:"#fcd34d",fontWeight:"600",flexShrink:0}}>{it.qty}</span>
              </div>)}
            </div>)
          })()}
        </div>
      </div>}
    </div>}

    {/* ── DISPATCH REPORTS — admin only, auto-expires after 48h ── */}
    {subTab==="reports"&&(isAdmin||roles.includes("issuer")||roles.includes("ho"))&&<DispatchHistoryReport normT={normT} showToast={showToast}/> }
  </div>;
}

function AddProductInline({onAdd, packConfig}){
  const [open,setOpen]=useState(false);
  const [form,setForm]=useState({name:"",category:"Paint (Single)",size:"",unit:"L",tinsPerCarton:"",packType:"Single Pack"});
  const [saving,setSaving]=useState(false);
  const CATEGORIES=["Paint (Single)","Paint (Two Pack)","Thinner","KPF","Car Patch","VEE-Plast","NC Putty"];
  const UNITS=["L","Kg","mL","g"];

  const save=async()=>{
    if(!form.name.trim())return;
    const size=parseFloat(form.size)||0;
    const tpc=parseInt(form.tinsPerCarton)||1;
    setSaving(true);
    await onAdd({name:form.name.trim(),category:form.category,size,unit:form.unit,tinsPerCarton:tpc,packType:form.packType});
    setForm({name:"",category:"Paint (Single)",size:"",unit:"L",tinsPerCarton:"",packType:"Single Pack"});
    setOpen(false);setSaving(false);
  };

  if(!open)return <button onClick={()=>setOpen(true)} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",padding:"5px 10px",color:"#4ade80",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>+ Add Product</button>;
  return <div style={{background:"#0a1a2e",border:"1px solid #1e3a5f",borderRadius:"10px",padding:"10px",minWidth:"280px"}}>
    <input style={{...inp,marginBottom:"5px",fontSize:"12px"}} value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Product name *"/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px",marginBottom:"5px"}}>
      <select style={{...sl,fontSize:"11.5px",padding:"4px"}} value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>
        {CATEGORIES.map(c=><option key={c}>{c}</option>)}
      </select>
      <select style={{...sl,fontSize:"11.5px",padding:"4px"}} value={form.packType} onChange={e=>setForm({...form,packType:e.target.value})}>
        <option>Single Pack</option><option>Two Pack</option>
      </select>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"4px",marginBottom:"8px"}}>
      <input style={{...inp,fontSize:"11.5px",padding:"4px"}} type="number" min="0.001" step="0.001" value={form.size} onChange={e=>setForm({...form,size:e.target.value})} placeholder="Size *"/>
      <select style={{...sl,fontSize:"11.5px",padding:"4px"}} value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})}>
        {UNITS.map(u=><option key={u}>{u}</option>)}
      </select>
      <input style={{...inp,fontSize:"11.5px",padding:"4px"}} type="number" min="1" step="1" value={form.tinsPerCarton} onChange={e=>setForm({...form,tinsPerCarton:e.target.value})} placeholder="Tins/carton"/>
    </div>
    <div style={{display:"flex",gap:"6px"}}>
      <button onClick={save} disabled={saving} style={{flex:1,background:"#052e16",border:"1px solid #166534",borderRadius:"5px",color:"#4ade80",fontSize:"12px",fontWeight:"700",padding:"5px",cursor:"pointer"}}>{saving?"…":"+ Add"}</button>
      <button onClick={()=>setOpen(false)} style={{background:"none",border:"1px solid #334155",borderRadius:"5px",color:"#475569",fontSize:"11px",padding:"5px 8px",cursor:"pointer"}}>✕</button>
    </div>
  </div>;
}

function FGStockTab({role,user,showToast,sysUnits,canManage}){
  const isAdmin=role==="admin";
  const [fgProducts,setFgProducts]=useState([]);
  const [packConfig,setPackConfig]=useState([]);
  const [fgStock,setFgStock]=useState([]); // from fg_stock_v2
  const [search,setSearch]=useState("");
  const [catFilter,setCatFilter]=useState("All");
  const [subTab,setSubTab]=useState("stock"); // stock first — show products immediately
  const [groupByCategory,setGroupByCategory]=useState(false);
  const [stockActionForm,setStockActionForm]=useState(null);
  const [saving,setSaving]=useState(false);
  const [importStatus,setImportStatus]=useState(null);
  const [editProduct,setEditProduct]=useState(null);
  const [showAddForm,setShowAddForm]=useState(false);
  const [addForm,setAddForm]=useState({name:"",size:"",unit:"L",category:"",tinsPerCarton:"",packType:"Single Pack"});

  const saveStockAction=async()=>{
    if(!stockActionForm||!stockActionForm.qty)return;
    const prod=fgProducts.find(p=>p.id===stockActionForm.productId);
    if(!prod)return;
    setSaving(true);
    try{
      const qty=parseFloat(stockActionForm.qty)||0;
      if(qty<=0){showToast("Enter a valid quantity","error");setSaving(false);return;}
      const tpc=prod.tinsPerCarton||1;
      const stk=fgStock.filter(s=>normalize(s.productName||"")===normalize(prod.name));
      const currentTotal=stk.reduce((a,s)=>a+(s.totalQty||0),0);
      const newTotal=stockActionForm.action==="add"?currentTotal+qty:Math.max(0,currentTotal-qty);
      const cartons=Math.floor(newTotal/tpc);
      const looseTins=newTotal%tpc;
      for(const e of stk)await C("fg_stock_v2").doc(e.id).delete();
      if(newTotal>0)await C("fg_stock_v2").add({productName:prod.name,cartons,looseTins,totalQty:newTotal,unit:prod.unit||"L",tinsPerCarton:tpc,sizePerTin:prod.size||0,_createdAt:ts(),lastModifiedAt:ts(),lastModifiedBy:user?.email,cell:"MANUAL"});
      await C("fg_transactions").add({productName:prod.name,type:stockActionForm.action==="add"?"production":"sale",cartons:Math.floor(qty/tpc),looseTins:qty%tpc,totalQty:qty,unit:prod.unit||"L",tinsPerCarton:tpc,sizePerTin:prod.size||0,date:today(),by:user?.email,notes:stockActionForm.notes||"",_createdAt:ts()});
      showToast(`${prod.name} — ${stockActionForm.action==="add"?"added":"sold"} ${qty} tins ✓`);
      setStockActionForm(null);
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // Load data
  useEffect(()=>{
    const u1=C("fg_products").onSnapshot(s=>setFgProducts(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});
    const u2=C("fg_stock_v2").onSnapshot(s=>setFgStock(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});
    const u3=C("fg_pack_config").onSnapshot(s=>setPackConfig(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});
    return ()=>{u1();u2();u3();};
  },[]);

  const DEFAULT_PACK_CONFIG=[
    {category:"Paint (Single)",size:0.2,unit:"L",tinsPerCarton:24},{category:"Paint (Single)",size:0.5,unit:"L",tinsPerCarton:8},
    {category:"Paint (Single)",size:1.0,unit:"L",tinsPerCarton:6},{category:"Paint (Single)",size:4.0,unit:"L",tinsPerCarton:4},
    {category:"Paint (Single)",size:20.0,unit:"L",tinsPerCarton:1},{category:"Paint (Two Pack)",size:0.5,unit:"L",tinsPerCarton:12},
    {category:"Paint (Two Pack)",size:1.0,unit:"L",tinsPerCarton:6},{category:"Paint (Two Pack)",size:4.0,unit:"L",tinsPerCarton:1},
    {category:"Thinner",size:0.5,unit:"L",tinsPerCarton:50},{category:"Thinner",size:1.0,unit:"L",tinsPerCarton:24},
  ];
  const pconf=packConfig.length>0?packConfig:DEFAULT_PACK_CONFIG;

  // Stock totals per product
  const stockByProduct={};
  fgStock.forEach(s=>{
    const k=normalize(s.productName||"");
    if(!stockByProduct[k])stockByProduct[k]={tins:0,cartons:0,loose:0};
    stockByProduct[k].tins+=(s.totalQty||0);
    stockByProduct[k].cartons+=(s.cartons||0);
    stockByProduct[k].loose+=(s.looseTins||0);
  });

  const categories=["All",...new Set(fgProducts.map(p=>p.category||"Other").filter(Boolean)).values()].sort();

  const filtered=fgProducts.filter(p=>{
    const matchCat=catFilter==="All"||(p.category||"Other")===catFilter;
    const matchSearch=!search.trim()||normalize(p.name||"").includes(normalize(search));
    return matchCat&&matchSearch;
  }).sort((a,b)=>(a.name||"").localeCompare(b.name||""));

  // ── Import products from Excel ──
  const importProducts=async(file)=>{
    try{await loadXLSX();}catch(e){showToast("Could not load Excel library","error");return;}
    const XLSX=window.XLSX;
    const data=await new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsArrayBuffer(file);});
    try{
      const wb=XLSX.read(data,{type:"array"});
      const ws=wb.Sheets["FG Product Catalogue"]||wb.Sheets[Object.keys(wb.Sheets)[0]];
      if(!ws){showToast("Could not find product data sheet","error");return;}
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,range:1});
      let added=0,skipped=0,errors=[];const batch=[];
      for(const row of rows){
        const [name,sizeRaw,unit,packType,category,tpc,status]=row;
        if(!name||String(name).trim().length<2)continue;
        if(String(name).startsWith("⚠")||String(status||"").includes("FILL"))continue;
        if(!category||String(category).trim().length<2){errors.push(`${name}: no category`);skipped++;continue;}
        const size=parseFloat(String(sizeRaw).replace(/[^\d.]/g,""))||null;
        const tinsPerCarton=parseInt(String(tpc).replace(/[^\d]/g,""))||null;
        if(!tinsPerCarton){errors.push(`${name}: no tins/carton`);skipped++;continue;}
        batch.push({name:String(name).trim(),size,unit:String(unit||"L").trim(),packType:String(packType||"Single Pack").trim(),category:String(category).trim(),tinsPerCarton,importedAt:today()});
        added++;
      }
      const existing=new Set(fgProducts.map(p=>normalize(p.name)));
      const toAdd=batch.filter(p=>!existing.has(normalize(p.name)));
      for(const p of toAdd)await C("fg_products").add(p);
      setImportStatus({added:toAdd.length,skipped,duplicate:batch.length-toAdd.length,errors:errors.slice(0,5)});
      showToast(`Imported ${toAdd.length} products${batch.length-toAdd.length>0?`, ${batch.length-toAdd.length} duplicates skipped`:""}${skipped>0?`, ${skipped} skipped`:""}  ✓`);
    }catch(err){showToast("Import error: "+err.message,"error");}
  };

  // ── Import closing balance from Tally Excel ──
  const importClosingBalance=async(file)=>{
    try{await loadXLSX();}catch(e){showToast("Could not load Excel library","error");return;}
    const XLSX=window.XLSX;
    const data=await new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsArrayBuffer(file);});
    try{
      const wb=XLSX.read(data,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1});
      let updated=0,notFound=[];
      const headerRow=rows.findIndex(r=>r.some(c=>String(c||"").toLowerCase().includes("particulars")||String(c||"").toLowerCase().includes("closing")));
      const dataRows=headerRow>=0?rows.slice(headerRow+1):rows.slice(1);
      for(const row of dataRows){
        const name=String(row[0]||"").trim();
        if(!name||name.toLowerCase().includes("total")||name.toLowerCase().includes("grand"))continue;
        const qty=parseFloat(String(row[1]||row[2]||"0").replace(/[^\d.-]/g,""))||0;
        if(qty<=0)continue;
        const prod=fgProducts.find(p=>normalize(p.name)===normalize(name)||normalize(name).includes(normalize(p.name)));
        if(!prod){notFound.push(name);continue;}
        const tpc=prod.tinsPerCarton||1;
        const cartons=Math.floor(qty/tpc);
        const looseTins=qty%tpc;
        const existing=fgStock.filter(s=>normalize(s.productName||"")===normalize(prod.name));
        for(const e of existing)await C("fg_stock_v2").doc(e.id).delete();
        await C("fg_stock_v2").add({productName:prod.name,cartons,looseTins,totalQty:qty,unit:prod.unit||"L",tinsPerCarton:tpc,sizePerTin:prod.size||0,_createdAt:ts(),lastModifiedAt:ts(),lastModifiedBy:user?.email,cell:"CLOSING_BALANCE",importedFrom:"Tally"});
        await C("fg_transactions").add({productName:prod.name,type:"closing_balance_import",cartons,looseTins,totalQty:qty,unit:prod.unit||"L",tinsPerCarton:tpc,sizePerTin:prod.size||0,date:today(),by:user?.email,_createdAt:ts()});
        updated++;
      }
      showToast(`Closing balance imported: ${updated} products updated${notFound.length>0?`, ${notFound.length} not found in catalogue`:""} ✓`);
      if(notFound.length>0)console.log("Not found in FG catalogue:",notFound);
    }catch(err){showToast("Import error: "+err.message,"error");}
  };

  // ── Download template ──
  const downloadTemplate=async()=>{
    await loadXLSX();const XLSX=window.XLSX;
    const rows=[["Product Name","Size","Unit","Pack Type","Category","Tins Per Carton",""]];
    const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:40},{wch:8},{wch:6},{wch:14},{wch:20},{wch:14}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"FG Product Catalogue");
    XLSX.writeFile(wb,"FG_Product_Catalogue_Template.xlsx");
  };

  const saveProduct=async(p)=>{

      else{await C("fg_products").add({name:p.name,size:parseFloat(p.size)||0,unit:p.unit,category:p.category,tinsPerCarton:parseInt(p.tinsPerCarton)||0,packType:p.packType,_createdAt:ts()});setShowAddForm(false);}

  const deleteProduct=async(id)=>{

      await C("fg_transactions").add({productName:prod.name,type:"manual_entry",cartons,looseTins,totalQty:qty,unit:prod.unit||"L",tinsPerCarton:tpc,sizePerTin:prod.size||0,date:today(),by:user?.email,_createdAt:ts()});

        <select style={{...inp2,width:"160px"}} value={catFilter} onChange={e=>setCatFilter(e.target.value)}>

        </select>

      {showAddForm&&canManage&&<div style={{background:"#0b1220",border:"1px solid #166534",borderRadius:"10px",padding:"14px",marginBottom:"12px"}}>

    {/* ── STOCK TAB ── */}

        const renderProductRow=(p,i)=>{
          const stk=stockByProduct[normalize(p.name||"")];

          {rows.length===0&&<div style={{padding:"40px",textAlign:"center",color:"#334155"}}>No products found</div>}
          {groups.map(({cat,products})=><div key={cat||"all"}>
            {cat&&<div style={{padding:"6px 14px",background:"#0b1a2e",borderBottom:"1px solid #0f172a",fontSize:"11px",fontWeight:"700",color:"#3b82f6"}}>📂 {cat} <span style={{color:"#334155",fontWeight:"400"}}>({products.length})</span></div>}
            {products.map((p,i)=>renderProductRow(p,i))}
          </div>)}
        </div>;
      })()}
    </div>}

    {/* ── IMPORT TAB ── */}
    {subTab==="import"&&<div style={{display:"flex",flexDirection:"column",gap:"14px",maxWidth:"600px"}}>
      <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"10px",padding:"16px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#4ade80",marginBottom:"6px"}}>📋 Import FG Product Catalogue</div>
        <div style={{fontSize:"11.5px",color:"#475569",marginBottom:"12px"}}>Upload Excel with columns: Product Name | Size | Unit | Pack Type | Category | Tins Per Carton</div>
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
          <button onClick={downloadTemplate} style={{background:"#060d1a",border:"1px solid #334155",borderRadius:"6px",padding:"7px 14px",color:"#64748b",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>⬇ Download Template</button>
          <label style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",padding:"7px 14px",color:"#4ade80",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>

        <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"6px"}}>📊 Import Closing Balance from Tally</div>

        </label>
      </div>
    </div>}
  </div>;
}

    );
    const unsub2=C("rm_stock_transactions").orderBy("date","desc").onSnapshot(
      s=>setTransactions(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{}
    );
    return()=>{unsub1();unsub2();};
  },[]);

  // Save new material
  const saveMaterial=async(isEdit=false)=>{
    if(!matForm.name.trim())return showToast("Material name required","error");
    setSaving(true);
    try{
      if(isEdit&&editMat){
        await C("rm_stock_materials").doc(editMat.id).update({...matForm,updatedBy:user.email,updatedAt:ts()});
        showToast("Material updated ✓");setEditMat(null);
      }else{
        const openingQty=parseFloat(matForm.openingStock)||0;
        const docRef=await C("rm_stock_materials").add({...matForm,currentStock:openingQty,addedBy:user.email,_createdAt:ts()});
        if(openingQty>0){
          await C("rm_stock_transactions").add({materialId:docRef.id,materialName:matForm.name,type:"opening",qty:openingQty,date:today(),addedBy:user.email,notes:"Opening stock",stockAfter:openingQty,_createdAt:ts()});
        }
        showToast("Material added ✓");setShowAddMat(false);
      }
      setMatForm({...blankMat});
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // Save daily consumption
  const saveConsumption=async()=>{
    const valid=consumeRows.filter(r=>r.materialId&&parseFloat(r.qty)>0);
    if(!valid.length)return showToast("Add at least one material with quantity","error");
    setSaving(true);
    try{
      await Promise.all(valid.map(async r=>{
        const mat=materials.find(m=>m.id===r.materialId);
        if(!mat)return;
        const qty=parseFloat(r.qty);
        const newStock=Math.max(0,(parseFloat(mat.currentStock)||0)-qty);
        await C("rm_stock_materials").doc(r.materialId).update({currentStock:newStock,updatedAt:ts()});
        await C("rm_stock_transactions").add({materialId:r.materialId,materialName:mat.name,unit:mat.unit,type:"consumption",qty,date:consumeDate,addedBy:user.email,notes:r.notes||"Daily consumption",stockAfter:newStock,_createdAt:ts()});
      }));
      showToast(`Consumption recorded for ${valid.length} material${valid.length!==1?"s":""} ✓`);
      setConsumeRows([{materialId:"",qty:"",notes:""}]);setConsumeDate(today());
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // Admin: add stock received
  const saveStockAddition=async()=>{
    const valid=addStockRows.filter(r=>r.materialId&&parseFloat(r.qty)>0);
    if(!valid.length)return showToast("Add at least one material with quantity","error");
    setSaving(true);
    try{
      await Promise.all(valid.map(async r=>{
        const mat=materials.find(m=>m.id===r.materialId);
        if(!mat)return;
        const qty=parseFloat(r.qty);
        const newStock=(parseFloat(mat.currentStock)||0)+qty;
        await C("rm_stock_materials").doc(r.materialId).update({currentStock:newStock,updatedAt:ts()});
        await C("rm_stock_transactions").add({materialId:r.materialId,materialName:mat.name,unit:mat.unit,type:"addition",qty,date:addStockDate,supplier:r.supplier||"",invoiceNo:r.invoiceNo||"",addedBy:user.email,notes:r.notes||"Stock received",stockAfter:newStock,_createdAt:ts()});
      }));
      showToast(`Stock added for ${valid.length} material${valid.length!==1?"s":""} ✓`);
      setAddStockRows([{materialId:"",qty:"",supplier:"",invoiceNo:"",notes:""}]);setAddStockDate(today());
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // Admin: physical stock correction
  const saveAdjustment=async(matId,correctedQty,reason)=>{
    const mat=materials.find(m=>m.id===matId);
    if(!mat)return;
    const qty=parseFloat(correctedQty);
    if(isNaN(qty)||qty<0)return showToast("Enter valid quantity","error");
    const diff=qty-(parseFloat(mat.currentStock)||0);
    await C("rm_stock_materials").doc(matId).update({currentStock:qty,updatedAt:ts()});
    await C("rm_stock_transactions").add({materialId:matId,materialName:mat.name,unit:mat.unit,type:"adjustment",qty:Math.abs(diff),adjustedTo:qty,date:today(),addedBy:user.email,notes:reason||"Physical stock correction",stockAfter:qty,_createdAt:ts()});
    showToast("Stock corrected ✓");
  };

  const delMaterial=async(id)=>{if(!confirm("Delete this material and all its transactions?"))return;
    const txn=transactions.filter(t=>t.materialId===id);
    await Promise.all(txn.map(t=>C("rm_stock_transactions").doc(t.id).delete()));
    await C("rm_stock_materials").doc(id).delete();showToast("Deleted","error");};

  // Stock status
  const stockStatus=(mat)=>{
    const curr=parseFloat(mat.currentStock)||0;
    const reorder=parseFloat(mat.reorderLevel)||0;
    if(curr<=0)return{color:"#ef4444",label:"Out of Stock",bg:"#450a0a"};
    if(reorder>0&&curr<=reorder)return{color:"#f59e0b",label:"Low Stock",bg:"#422006"};
    if(reorder>0&&curr<=reorder*1.5)return{color:"#eab308",label:"Near Reorder",bg:"#422006"};
    return{color:"#22c55e",label:"In Stock",bg:"#052e16"};
  };

  const fm=materials.filter(m=>{
    const q=normalize(search);
    const cs=filterCat==="All"||m.category===filterCat;
    const ms=!q||normalize(m.name||"").includes(q)||normalize(m.supplier||"").includes(q);
    return cs&&ms;
  });

  const lowCount=materials.filter(m=>{const s=stockStatus(m);return s.label==="Low Stock"||s.label==="Out of Stock";}).length;

  const txnType={consumption:{color:"#ef4444",icon:"📉"},addition:{color:"#22c55e",icon:"📈"},adjustment:{color:"#f59e0b",icon:"⚖️"},opening:{color:"#3b82f6",icon:"🔓"}};

  return <div>
    <SectionHead title="🏪 Raw Material Stock"/>

    {/* Summary bar */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px",marginBottom:"14px"}}>
      {[["📦 Total Materials",materials.length,"#3b82f6"],["⚠️ Low / Out",lowCount,"#ef4444"],["✅ In Stock",materials.length-lowCount,"#22c55e"]].map(([l,v,c])=>(
        <div key={l} style={{background:"#0b1220",border:`1px solid ${c}30`,borderRadius:"10px",padding:"12px 16px",textAlign:"center"}}>
          <div style={{fontSize:"22px",fontWeight:"700",color:c}}>{v}</div>
          <div style={{fontSize:"11px",color:"#64748b",marginTop:"2px"}}>{l}</div>
        </div>
      ))}
    </div>

    {/* Sub-tabs */}
    <div style={{display:"flex",gap:"4px",marginBottom:"14px",flexWrap:"wrap"}}>
      {[["stock","📊 Stock Levels"],["consume","📉 Record Consumption"],[isAdmin?"addstock":"","📈 Add Received Stock"],[isAdmin?"addmat":"","➕ Add Material"],[isAdmin?"importexport":"","📤 Export / Import"],["history","🕐 History"]].filter(([k])=>k).map(([key,label])=>(
        <button key={key} onClick={()=>setSubTab(key)} style={{background:subTab===key?"#1e293b":"transparent",border:`1px solid ${subTab===key?"#38bdf8":"#1e293b"}`,color:subTab===key?"#38bdf8":"#475569",borderRadius:"8px",padding:"6px 12px",cursor:"pointer",fontSize:"12.5px",fontWeight:"600"}}>{label}</button>
      ))}
    </div>

    {/* ── STOCK LEVELS ── */}
    {subTab==="stock"&&<>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"12px"}}>
        <input placeholder="Search material…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"7px 10px",fontSize:"12.5px"}}/>
        <select value={filterCat} onChange={e=>{setFilterCat(e.target.value);if(e.target.value!=="All")setGroupByCat(false);}} style={{...sl,width:"140px",padding:"7px 6px",fontSize:"12px"}}>
          <option value="All">All Categories</option>
          {CATS.map(c=><option key={c}>{c}</option>)}
        </select>
        {/* Group by category toggle — only when showing All */}
        {filterCat==="All"&&<button onClick={()=>setGroupByCat(g=>!g)}
          style={{background:groupByCat?"#1e3a5f":"transparent",border:`1px solid ${groupByCat?"#38bdf8":"#1e293b"}`,color:groupByCat?"#38bdf8":"#475569",borderRadius:"8px",padding:"6px 12px",cursor:"pointer",fontSize:"12px",fontWeight:"600",whiteSpace:"nowrap"}}>
          {groupByCat?"📂 Grouped by Category":"📋 Flat List"}
        </button>}
        <span style={{fontSize:"11px",color:"#334155"}}>{fm.length} material{fm.length!==1?"s":""}</span>
        {isAdmin&&<div style={{marginLeft:"auto",display:"flex",gap:"6px"}}>
          <Btn label="📉 Consume" onClick={()=>setSubTab("consume")} color="#ef4444" small/>
          <Btn label="📈 Add Stock" onClick={()=>setSubTab("addstock")} color="#22c55e" small/>
          <Btn label="➕ Material" onClick={()=>setSubTab("addmat")} color="#38bdf8" small/>
        </div>}
      </div>
      {loading&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading…</div>}
      {!loading&&fm.length===0&&<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px"}}>🏪</div><div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>{isAdmin?"No materials yet. Click ➕ Add Material.":"No materials found."}</div></div>}

      {/* ── Flat list ── */}
      {fm.length>0&&!groupByCat&&<div style={{border:"1px solid #1e293b",borderRadius:"10px",overflow:"hidden"}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 100px 80px 80px",background:"#0b1220",padding:"8px 14px",gap:"8px"}}>
          {["Material","Category","Supplier","Current Stock","Reorder Level","Status"].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
        </div>
        {fm.map((m,i)=><StockRow key={m.id} m={m} i={i} isAdmin={isAdmin} saveAdjustment={saveAdjustment} delMaterial={delMaterial}/>)}
      </div>}

      {fm.length>0&&groupByCat&&<StockGroupedView fm={fm} isAdmin={isAdmin} saveAdjustment={saveAdjustment}/>}
    </>}

    {/* ── RECORD CONSUMPTION ── */}
    {subTab==="consume"&&<div>
      <InfoBox color="#ef4444">Select a category to see all its materials. Enter quantities consumed — only filled rows will be saved.</InfoBox>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"14px"}}>
        <Field label="Date"><input type="date" style={inp} value={consumeDate} onChange={e=>setConsumeDate(e.target.value)}/></Field>
        <Field label="Filter by Category">
          <select style={sl} value={filterCat} onChange={e=>{setFilterCat(e.target.value);}}>
            <option value="All">All Categories</option>
            {CATS.map(c=><option key={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="Common Notes (optional)"><input style={inp} value={consumeRows[0]?.notes||""} onChange={e=>setConsumeRows(consumeRows.map(r=>({...r,notes:e.target.value})))} placeholder="e.g. Batch 0042, daily use"/></Field>
      </div>

      {/* Category-grouped consumption grid */}
      {(filterCat==="All"?CATS:[filterCat]).map(cat=>{
        const catMats=materials.filter(m=>(m.category||"Uncategorised")===cat);
        if(!catMats.length) return null;
        return <div key={cat} style={{border:"1px solid #1e293b",borderRadius:"10px",overflow:"hidden",marginBottom:"10px"}}>
          <div style={{background:"#0f1d35",padding:"8px 14px",display:"flex",alignItems:"center",gap:"10px",borderBottom:"1px solid #1e3a5f"}}>
            <span style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd"}}>{cat}</span>
            <span style={{fontSize:"11px",color:"#475569"}}>{catMats.length} material{catMats.length!==1?"s":""}</span>
            <button onClick={()=>{
              const ids=catMats.map(m=>m.id);
              setConsumeRows(prev=>{
                const newRows=[...prev];
                ids.forEach(id=>{if(!newRows.find(r=>r.materialId===id))newRows.push({materialId:id,qty:"",notes:prev[0]?.notes||""});});
                return newRows;
              });
            }} style={{background:"#0f1d35",border:"1px solid #2563eb40",borderRadius:"5px",padding:"2px 8px",color:"#93c5fd",cursor:"pointer",fontSize:"11px",marginLeft:"auto"}}>+ Add All</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"2fr 120px 100px",background:"#0b1220",padding:"5px 12px",gap:"8px"}}>
            {["Material (Current Stock)","Qty Used",""].map((h,i)=><div key={i} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
          </div>
          {catMats.map(m=>{
            const row=consumeRows.find(r=>r.materialId===m.id);
            const stock=parseFloat(m.currentStock||0);
            const qty=parseFloat(row?.qty||0);
            const isLow=stock<=0||(parseFloat(m.reorderLevel||0)>0&&stock<=parseFloat(m.reorderLevel||0));
            const willExceed=qty>stock;
            return <div key={m.id} style={{display:"grid",gridTemplateColumns:"2fr 120px 100px",padding:"7px 12px",gap:"8px",borderTop:"1px solid #1e293b",alignItems:"center",background:row?.qty?qty>0?"#060d0d":"#080d18":"#080d18"}}>
              <div>
                <div style={{fontSize:"12px",color:"#e2e8f0",fontWeight:row?.qty?"600":"400"}}>{m.name}</div>
                <div style={{fontSize:"10.5px",color:isLow?"#ef4444":"#475569"}}>
                  Stock: {stock.toFixed(2)} {m.unit} {isLow&&"⚠️ Low"}
                </div>
              </div>
              <div style={{display:"flex",gap:"4px",alignItems:"center"}}>
                <input style={{...sml,textAlign:"center",borderColor:willExceed?"#ef4444":row?.qty?"#22c55e30":"#1e293b",background:willExceed?"#2d0a0a":"#0b1220"}}
                  type="number" min="0" step="0.01"
                  value={row?.qty||""}
                  onChange={e=>{
                    const val=e.target.value;
                    setConsumeRows(prev=>{
                      const exists=prev.find(r=>r.materialId===m.id);
                      if(exists) return prev.map(r=>r.materialId===m.id?{...r,qty:val}:r);
                      return [...prev,{materialId:m.id,qty:val,notes:prev[0]?.notes||""}];
                    });
                  }}
                  placeholder="0"/>
                <span style={{fontSize:"10px",color:"#475569",whiteSpace:"nowrap"}}>{m.unit}</span>
              </div>
              {willExceed
                ?<div style={{fontSize:"10px",color:"#ef4444"}}>⚠️ Exceeds stock</div>
                :row?.qty&&qty>0
                  ?<div style={{fontSize:"10px",color:"#22c55e"}}>→ {(stock-qty).toFixed(2)} {m.unit} left</div>
                  :<div/>}
            </div>;
          })}
        </div>;
      })}

      <div style={{display:"flex",gap:"8px",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",marginTop:"4px"}}>
        <div style={{fontSize:"12px",color:"#475569"}}>
          {consumeRows.filter(r=>r.materialId&&parseFloat(r.qty)>0).length} material{consumeRows.filter(r=>r.materialId&&parseFloat(r.qty)>0).length!==1?"s":""} to record
        </div>
        <div style={{display:"flex",gap:"8px"}}>
          <Btn label="Clear All" onClick={()=>setConsumeRows([{materialId:"",qty:"",notes:""}])} outline color="#475569" small/>
          <Btn label={saving?"Saving…":"📉 Save Consumption"} onClick={saveConsumption} disabled={saving} color="#ef4444"/>
        </div>
      </div>
    </div>}

    {/* ── ADD RECEIVED STOCK ── */}
    {subTab==="addstock"&&isAdmin&&<div>
      <InfoBox color="#22c55e">Record stock received from supplier. Stock will be added to current balance.</InfoBox>
      <Grid2 style={{marginBottom:"12px"}}>
        <Field label="Date Received"><input type="date" style={inp} value={addStockDate} onChange={e=>setAddStockDate(e.target.value)}/></Field>
      </Grid2>
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"8px"}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 100px 1.5fr 1fr 1fr 28px",background:"#0b1220",padding:"7px 12px",gap:"8px"}}>
          {["Material","Qty Received","Supplier","Invoice No","Notes",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
        </div>
        {addStockRows.map((row,i)=>{
          const mat=materials.find(m=>m.id===row.materialId);
          return <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 100px 1.5fr 1fr 1fr 28px",padding:"7px 12px",gap:"8px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
            <select style={sl} value={row.materialId} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,materialId:e.target.value}:r))}>
              <option value="">— Select Material —</option>
              {materials.map(m=><option key={m.id} value={m.id}>{m.name} ({m.unit})</option>)}
            </select>
            <div style={{display:"flex",gap:"4px",alignItems:"center"}}>
              <input style={{...sml,textAlign:"center"}} type="number" min="0" step="0.01" value={row.qty} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,qty:e.target.value}:r))} placeholder="0"/>
              {mat&&<span style={{fontSize:"10px",color:"#475569"}}>{mat.unit}</span>}
            </div>
            <input style={sml} value={row.supplier} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,supplier:e.target.value}:r))} placeholder="Supplier name"/>
            <input style={sml} value={row.invoiceNo} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,invoiceNo:e.target.value}:r))} placeholder="Invoice #"/>
            <input style={sml} value={row.notes} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,notes:e.target.value}:r))} placeholder="Notes"/>
            <button onClick={()=>setAddStockRows(addStockRows.filter((_,idx)=>idx!==i))} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
          </div>;
        })}
      </div>
      <div style={{display:"flex",gap:"8px",justifyContent:"space-between",flexWrap:"wrap"}}>
        <button onClick={()=>setAddStockRows([...addStockRows,{materialId:"",qty:"",supplier:"",invoiceNo:"",notes:""}])} style={{background:"none",border:"1px dashed #1e293b",borderRadius:"6px",padding:"5px 12px",color:"#475569",cursor:"pointer",fontSize:"12px"}}>+ Add Row</button>
        <Btn label={saving?"Saving…":"📈 Save Stock Addition"} onClick={saveStockAddition} disabled={saving} color="#22c55e"/>
      </div>
    </div>}

    {/* ── ADD MATERIAL ── */}
    {subTab==="addmat"&&isAdmin&&<div>
      {!showAddMat&&!editMat&&<div style={{display:"flex",justifyContent:"flex-end",marginBottom:"10px"}}><Btn label="➕ Add New Material" onClick={()=>setShowAddMat(true)} color="#38bdf8"/></div>}
      {(showAddMat||editMat)&&<div style={{background:"#080d18",border:"1px solid #38bdf830",borderRadius:"12px",padding:"18px",marginBottom:"16px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#38bdf8",marginBottom:"14px"}}>{editMat?"✏️ Edit Material":"➕ New Raw Material"}</div>
        <Grid3>
          <Field label="Material Name *"><input style={inp} value={matForm.name} onChange={e=>setMatForm({...matForm,name:e.target.value})} placeholder="e.g. TiO2 White"/></Field>
          <div>
            <div style={{fontSize:"10.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px",display:"flex",alignItems:"center",gap:"8px"}}>Category {onAddRmCat&&<QuickAdd label="Category" onAdd={v=>{if(onAddRmCat)onAddRmCat(v);}} color="#f97316"/>}</div>
            <select style={sl} value={matForm.category} onChange={e=>setMatForm({...matForm,category:e.target.value})}>
              {CATS.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <div style={{fontSize:"10.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px",display:"flex",alignItems:"center",gap:"8px"}}>Unit {onAddUnit&&<QuickAdd label="Unit" onAdd={onAddUnit} color="#38bdf8"/>}</div>
            <select style={sl} value={matForm.unit} onChange={e=>setMatForm({...matForm,unit:e.target.value})}>
              {UNITS.map(u=><option key={u}>{u}</option>)}
            </select>
          </div>
        </Grid3>
        <Grid3>
          <Field label={editMat?"Current Stock (direct edit)":"Opening Stock"}><input style={inp} type="number" value={matForm.openingStock} onChange={e=>setMatForm({...matForm,openingStock:e.target.value})} placeholder="0"/></Field>
          <Field label="Reorder Level (alert when below)"><input style={inp} type="number" value={matForm.reorderLevel} onChange={e=>setMatForm({...matForm,reorderLevel:e.target.value})} placeholder="e.g. 50"/></Field>
          <Field label="Supplier Name"><input style={inp} value={matForm.supplier} onChange={e=>setMatForm({...matForm,supplier:e.target.value})} placeholder="Supplier company"/></Field>
        </Grid3>
        <Field label="Notes"><input style={inp} value={matForm.notes} onChange={e=>setMatForm({...matForm,notes:e.target.value})} placeholder="Any notes about this material"/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
          <Btn label="Cancel" onClick={()=>{setShowAddMat(false);setEditMat(null);setMatForm({...blankMat});}} outline color="#475569" small/>
          <Btn label={saving?"Saving…":editMat?"💾 Update":"✓ Add Material"} onClick={()=>saveMaterial(!!editMat)} disabled={saving} color="#38bdf8" small/>
        </div>
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {materials.map(m=><div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0f172a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 14px"}}>
          <div>
            <span style={{fontSize:"13px",fontWeight:"600",color:"#e2e8f0"}}>{m.name}</span>
            <span style={{fontSize:"11px",color:"#475569",marginLeft:"10px"}}>{m.category} · {m.unit}</span>
            {m.supplier&&<span style={{fontSize:"11px",color:"#475569",marginLeft:"6px"}}>· {m.supplier}</span>}
          </div>
          <div style={{display:"flex",gap:"6px"}}>
            <button onClick={()=>{setEditMat(m);setMatForm({name:m.name,category:m.category,unit:m.unit,openingStock:m.currentStock,reorderLevel:m.reorderLevel||"",supplier:m.supplier||"",notes:m.notes||""});setShowAddMat(false);}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"5px",color:"#93c5fd",cursor:"pointer",fontSize:"12px",padding:"3px 8px"}}>✏️</button>
            <button onClick={()=>delMaterial(m.id)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px"}}>🗑</button>
          </div>
        </div>)}
      </div>
    </div>}

    {/* ── HISTORY ── */}
    {subTab==="history"&&<div>
      <div style={{fontSize:"12px",color:"#475569",marginBottom:"12px"}}>Showing last {Math.min(transactions.length,100)} transactions</div>
      {transactions.length===0&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>No transactions yet.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:"4px"}}>
        {transactions.slice(0,100).map(t=>{
          const tt=txnType[t.type]||{color:"#94a3b8",icon:"📋"};
          const sign=t.type==="consumption"?"−":t.type==="addition"||t.type==="opening"?"+":"⚖";
          return <div key={t.id} style={{display:"flex",gap:"10px",alignItems:"center",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"8px 14px"}}>
            <span style={{fontSize:"16px",flexShrink:0}}>{tt.icon}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",gap:"8px",alignItems:"baseline",flexWrap:"wrap"}}>
                <span style={{fontSize:"13px",fontWeight:"600",color:"#e2e8f0"}}>{t.materialName}</span>
                <span style={{fontSize:"12px",fontWeight:"700",color:tt.color}}>{sign}{t.qty} {t.unit||""}</span>
                {t.type==="adjustment"&&<span style={{fontSize:"11px",color:"#f59e0b"}}>→ {t.adjustedTo} {t.unit||""}</span>}
                <span style={{fontSize:"11px",color:"#334155",marginLeft:"auto"}}>Stock after: {parseFloat(t.stockAfter||0).toFixed(2)} {t.unit||""}</span>
              </div>
              <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>
                {t.date} · {t.addedBy} · {t.notes||""}
                {t.supplier&&<span> · {t.supplier}</span>}
                {t.invoiceNo&&<span> · #{t.invoiceNo}</span>}
              </div>
            </div>
            <span style={{fontSize:"10px",fontWeight:"700",background:tt.color+"20",color:tt.color,padding:"2px 7px",borderRadius:"99px",flexShrink:0,textTransform:"capitalize"}}>{t.type}</span>
          </div>;
        })}
      </div>
    </div>}

    {/* ── EXPORT / IMPORT ── */}
    {subTab==="importexport"&&isAdmin&&<RMExportImport materials={materials} CATS={CATS} UNITS={UNITS} user={user} showToast={showToast} onImport={async(rows)=>{
      // rows: [{name,category,unit,openingStock,reorderLevel,supplier,notes}]

      // ── Step 1: Auto-create any new categories and units from the CSV ──
      const newCats=[...new Set(rows.map(r=>(r.category||"").trim()).filter(Boolean))]
        .filter(cat=>cat&&!CATS.includes(cat));
      const newUnits=[...new Set(rows.map(r=>(r.unit||"").trim()).filter(Boolean))]
        .filter(u=>u&&!UNITS.includes(u));

      for(const cat of newCats){
        if(onAddRmCat) await onAddRmCat(cat);
      }
      for(const unit of newUnits){
        if(onAddUnit) await onAddUnit(unit);
      }

      // ── Step 2: Import materials ──
      let added=0, skipped=0;
      for(const row of rows){
        if(!row.name||!row.name.trim()){skipped++;continue;}
        const existing=materials.find(m=>normalize(m.name)===normalize(row.name));
        if(existing){
          await C("rm_stock_materials").doc(existing.id).update({
            category:row.category||existing.category,unit:row.unit||existing.unit,
            reorderLevel:row.reorderLevel||existing.reorderLevel,supplier:row.supplier||existing.supplier,
            notes:row.notes||existing.notes,updatedAt:ts()
          });
          added++;
        }else{
          const qty=parseFloat(row.openingStock)||0;
          const docRef=await C("rm_stock_materials").add({...row,currentStock:qty,addedBy:user.email,_createdAt:ts()});
          if(qty>0)await C("rm_stock_transactions").add({materialId:docRef.id,materialName:row.name,type:"opening",qty,date:today(),addedBy:user.email,notes:"Imported opening stock",stockAfter:qty,_createdAt:ts()});
          added++;
        }
      }
      const catMsg=newCats.length?` · ${newCats.length} new categor${newCats.length===1?"y":"ies"} added`:"";
      const unitMsg=newUnits.length?` · ${newUnits.length} new unit${newUnits.length===1?"":"s"} added`:"";
      showToast(`Imported: ${added} materials${skipped?`, ${skipped} skipped`:""}${catMsg}${unitMsg} ✓`);
    }}/>}
  </div>;
}

// BOM (Bill of Materials) MODULE
