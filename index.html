// BOM (Bill of Materials) MODULE
// ══════════════════════════════════════════════════════════


// BOM Form component — stable to avoid cursor loss
function BOMForm({form,setForm,saving,isEdit,onCancel,onSave,sysProducts,sysQcParams,usedProductNames}){
  // Filter out products that already have a BOM — only when creating a NEW BOM (not editing)
  const filteredSysProducts=(()=>{
    if(isEdit||!usedProductNames||!usedProductNames.size)return sysProducts;
    const source=sysProducts||DEFAULT_PRODUCTS;
    const out={};
    Object.keys(source).forEach(cat=>{
      out[cat]=(source[cat]||[]).filter(p=>{
        const name=typeof p==="string"?p:(p?.name||"");
        return !usedProductNames.has(name);
      });
    });
    return out;
  })();
  // Helper: build BOM QC params from Settings QC params for a category
  const buildQCFromSettings=(category)=>{
    const settingsParams=(sysQcParams||DEFAULT_QC_PARAMS)[category]||[];
    return settingsParams.map(p=>{
      const pName=typeof p==="string"?p:(p.name||"");
      const existing=(form.qcTests||[]).find(q=>q.name===pName);
      return {id:existing?.id||newId(), name:pName, standard:existing?.standard||""};
    });
  };
  const syncQCFromSettings=()=>{
    const synced=buildQCFromSettings(form.category);
    if(!synced.length)return;
    setForm({...form,qcTests:synced});
  };
  const addIng=()=>setForm(f=>({...f,ingredients:[...f.ingredients,{id:newId(),name:"",standardQty:"",unit:f.baseUnit||"L",isProcess:false}]}));
  const addProcess=()=>setForm(f=>({...f,ingredients:[...f.ingredients,{id:newId(),name:"",isProcess:true}]}));
  const updIng=(id,field,val)=>setForm(f=>({...f,ingredients:f.ingredients.map(i=>i.id===id?{...i,[field]:val}:i)}));
  const delIng=(id)=>setForm(f=>({...f,ingredients:f.ingredients.filter(i=>i.id!==id)}));
  const moveIng=(idx,dir)=>setForm(f=>{const arr=[...f.ingredients];const to=idx+dir;if(to<0||to>=arr.length)return f;[arr[idx],arr[to]]=[arr[to],arr[idx]];return{...f,ingredients:arr};});

  return <div>
    <Grid3>
      <div>
        <div style={{fontSize:"10.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px"}}>Product Name *</div>
        <CategoryProductSelect
          category={form.category}
          setCategory={cat=>{
            const newQC=buildQCFromSettings(cat);
            setForm({...form,category:cat,productName:"",qcTests:newQC.length?newQC:form.qcTests});
          }}
          productName={form.productName}
          setProductName={p=>setForm({...form,productName:typeof p==="string"?p:(p?.name||p)})}
          products={filteredSysProducts}
          catUnits={{}}
        />
        {!form.productName&&<div style={{fontSize:"10.5px",color:"#334155",marginTop:"4px"}}>Select category first, then product</div>}
        {!isEdit&&usedProductNames&&usedProductNames.size>0&&<div style={{fontSize:"10px",color:"#f59e0b",marginTop:"4px"}}>⚠ Products that already have a BOM aren't shown — edit the existing BOM instead.</div>}
      </div>
      <Field label="Category (auto-filled)"><input style={{...inp,color:"#64748b"}} value={form.category} readOnly placeholder="Auto-fills from product"/></Field>
      <Grid2>
        <Field label="Base Batch Size"><input style={inp} type="number" value={form.baseBatchSize} onChange={e=>setForm({...form,baseBatchSize:e.target.value})} placeholder="100"/></Field>
        <Field label="Unit"><select style={sl} value={form.baseUnit} onChange={e=>setForm({...form,baseUnit:e.target.value})}>{["L","kg","g","mL"].map(u=><option key={u}>{u}</option>)}</select></Field>
      </Grid2>
    </Grid3>

    {/* Ingredients / Process steps */}
    <div style={{marginBottom:"14px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>Ingredients & Process Steps</div>
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"6px"}}>
        <div style={{display:"grid",gridTemplateColumns:"28px 1.8fr 85px 65px 1fr 50px 28px",background:"#0b1220",padding:"6px 10px",gap:"6px"}}>
          {["↕","Material / Step","Std Qty","Unit","Description / Notes","",""].map((h,i)=><div key={i} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
        </div>
        {(form.ingredients||[]).map((ing,idx)=>
          ing.isProcess
            ?<div key={ing.id} style={{display:"grid",gridTemplateColumns:"28px 1.8fr 85px 65px 1fr 50px 28px",padding:"5px 10px",gap:"6px",borderTop:"1px solid #1e293b",alignItems:"center",background:"#0a1520"}}>
              <div style={{display:"flex",flexDirection:"column",gap:"1px"}}>
                <button onClick={()=>moveIng(idx,-1)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"10px",padding:"1px",lineHeight:1}}>▲</button>
                <button onClick={()=>moveIng(idx,1)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"10px",padding:"1px",lineHeight:1}}>▼</button>
              </div>
              <input style={{...sml,color:"#f59e0b",fontStyle:"italic",background:"#0f1d10",borderColor:"#f59e0b30"}} value={ing.name} onChange={e=>updIng(ing.id,"name",e.target.value)} placeholder="Process instruction e.g. Grind for 6hrs"/>
              <div style={{fontSize:"10px",color:"#475569",fontStyle:"italic"}}>— process —</div>
              <div/>
              <input style={{...sml,color:"#64748b"}} value={ing.desc||""} onChange={e=>updIng(ing.id,"desc",e.target.value)} placeholder="Notes (optional)"/>
              <span style={{fontSize:"10px",color:"#64748b",background:"#0f1720",border:"1px solid #1e293b",borderRadius:"4px",padding:"2px 5px",textAlign:"center"}}>Step</span>
              <button onClick={()=>delIng(ing.id)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
            </div>
            :<div key={ing.id} style={{display:"grid",gridTemplateColumns:"28px 1.8fr 85px 65px 1fr 50px 28px",padding:"5px 10px",gap:"6px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
              <div style={{display:"flex",flexDirection:"column",gap:"1px"}}>
                <button onClick={()=>moveIng(idx,-1)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"10px",padding:"1px",lineHeight:1}}>▲</button>
                <button onClick={()=>moveIng(idx,1)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"10px",padding:"1px",lineHeight:1}}>▼</button>
              </div>
              <input style={sml} value={ing.name} onChange={e=>updIng(ing.id,"name",e.target.value)} placeholder="Material/ingredient name"/>
              <input style={{...sml,textAlign:"center"}} type="number" step="0.001" value={ing.standardQty} onChange={e=>updIng(ing.id,"standardQty",e.target.value)} placeholder="0"/>
              <select style={{...sml,padding:"6px 4px",fontSize:"11.5px"}} value={ing.unit||form.baseUnit||"L"} onChange={e=>updIng(ing.id,"unit",e.target.value)}>
                {["L","kg","g","mL"].map(u=><option key={u} value={u}>{u}</option>)}
              </select>
              <input style={{...sml,color:"#94a3b8"}} value={ing.desc||""} onChange={e=>updIng(ing.id,"desc",e.target.value)} placeholder="e.g. imported, grind 6hrs, wash 1"/>
              <div style={{fontSize:"10px",color:"#22c55e",background:"#052e16",border:"1px solid #166534",borderRadius:"4px",padding:"2px 5px",textAlign:"center"}}>Ingr.</div>
              <button onClick={()=>delIng(ing.id)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
            </div>
        )}
      </div>
      <div style={{fontSize:"10px",color:"#475569",marginBottom:"8px"}}>Set the unit per ingredient if it differs from the batch unit — e.g. paint batch in Litres, but a raw material weighed in kg.</div>
      <div style={{display:"flex",gap:"8px"}}>
        <button onClick={addIng} style={{background:"#052e16",border:"1px dashed #166534",borderRadius:"6px",padding:"5px 12px",color:"#22c55e",cursor:"pointer",fontSize:"12px"}}>+ Add Ingredient</button>
        <button onClick={addProcess} style={{background:"#0f1d10",border:"1px dashed #f59e0b50",borderRadius:"6px",padding:"5px 12px",color:"#f59e0b",cursor:"pointer",fontSize:"12px"}}>+ Add Process Step</button>
      </div>
    </div>

    {/* QC Test Parameters — Category defaults + Product-specific additions */}
    <div style={{marginBottom:"14px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>QC Test Parameters</div>

      {/* Part 1: Category defaults (read-only, from Settings) */}
      <div style={{marginBottom:"10px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"5px"}}>
          <div style={{fontSize:"11px",color:"#475569",fontWeight:"600"}}>
            📂 Category Defaults — <span style={{color:"#93c5fd"}}>{form.category||"(select a category)"}</span>
            <span style={{color:"#334155",fontWeight:"400",marginLeft:"6px"}}>· from Settings · used if no product-specific params below</span>
          </div>
          {form.category&&<button onClick={syncQCFromSettings} style={{background:"#0f1d35",border:"1px solid #2563eb40",borderRadius:"5px",padding:"2px 8px",color:"#93c5fd",cursor:"pointer",fontSize:"10px",fontWeight:"600"}}>🔄 Refresh</button>}
        </div>
        <div style={{border:"1px solid #1e3a5f",borderRadius:"6px",overflow:"hidden",background:"#060d1a",opacity:0.85}}>
          {(()=>{
            const catParams=form.category?(sysQcParams||DEFAULT_QC_PARAMS)[form.category]||[]:[];
            if(!catParams.length)return <div style={{padding:"8px 12px",fontSize:"11px",color:"#334155",fontStyle:"italic"}}>No category parameters defined in Settings for {form.category||"this category"}.</div>;
            return catParams.map((p,i)=>{
              const nm=typeof p==="string"?p:(p.name||"");
              return <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr",padding:"4px 10px",borderTop:i?`1px solid #0f1d35`:"none",gap:"8px",alignItems:"center"}}>
                <div style={{fontSize:"11px",color:"#64748b"}}>{nm}</div>
                <div style={{fontSize:"10px",color:"#334155",fontStyle:"italic"}}>standard set in product below</div>
              </div>;
            });
          })()}
        </div>
      </div>

      {/* Part 2: Product-specific parameters (editable) */}
      <div>
        <div style={{fontSize:"11px",color:"#475569",fontWeight:"600",marginBottom:"5px"}}>
          🧪 Product-specific Parameters — <span style={{color:"#22c55e"}}>Standard values + any extra params just for this product</span>
        </div>
        <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"6px"}}>
          <div style={{display:"grid",gridTemplateColumns:"28px 2fr 2fr 28px",background:"#0b1220",padding:"6px 10px",gap:"6px"}}>
            {["↕","Parameter Name","Standard / Expected Value",""].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
          </div>
          {(form.qcTests||[]).map((p,i)=><div key={p.id||i} style={{display:"grid",gridTemplateColumns:"28px 2fr 2fr 28px",padding:"5px 10px",gap:"6px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
            <div style={{display:"flex",flexDirection:"column",gap:"1px"}}>
              <button onClick={()=>{const arr=[...(form.qcTests||[])];if(i===0)return;[arr[i-1],arr[i]]=[arr[i],arr[i-1]];setForm({...form,qcTests:arr});}} style={{background:"none",border:"none",color:i===0?"#1e293b":"#334155",cursor:i===0?"default":"pointer",fontSize:"10px",padding:"1px",lineHeight:1}}>▲</button>
              <button onClick={()=>{const arr=[...(form.qcTests||[])];if(i===arr.length-1)return;[arr[i],arr[i+1]]=[arr[i+1],arr[i]];setForm({...form,qcTests:arr});}} style={{background:"none",border:"none",color:i===(form.qcTests||[]).length-1?"#1e293b":"#334155",cursor:i===(form.qcTests||[]).length-1?"default":"pointer",fontSize:"10px",padding:"1px",lineHeight:1}}>▼</button>
            </div>
            <input style={sml} value={p.name||""} onChange={e=>{const arr=[...(form.qcTests||[])];arr[i]={...arr[i],name:e.target.value};setForm({...form,qcTests:arr});}} placeholder="Parameter name"/>
            <input style={sml} value={p.standard||""} onChange={e=>{const arr=[...(form.qcTests||[])];arr[i]={...arr[i],standard:e.target.value};setForm({...form,qcTests:arr});}} placeholder="Standard value"/>
            <button onClick={()=>setForm({...form,qcTests:(form.qcTests||[]).filter((_,j)=>j!==i)})} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
          </div>)}
          {!(form.qcTests||[]).length&&<div style={{padding:"10px 12px",fontSize:"12px",color:"#334155",fontStyle:"italic"}}>
            No product-specific parameters added. Category defaults will be used for printing.

            // Pre-fill from category defaults so user can set standard values

            const mapped=catParams.map(p=>{const nm=typeof p==="string"?p:(p.name||"");const ex=(form.qcTests||[]).find(q=>q.name===nm);return ex||{id:newId(),name:nm,standard:""};});
            setForm({...form,qcTests:mapped});
          }} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",padding:"5px 12px",color:"#22c55e",cursor:"pointer",fontSize:"12px"}}>
            ↓ Fill from Category Defaults
          </button>
          <button onClick={()=>setForm({...form,qcTests:[...(form.qcTests||[]),{id:newId(),name:"",standard:""}]})}
            style={{background:"none",border:"1px dashed #334155",borderRadius:"6px",padding:"5px 12px",color:"#475569",cursor:"pointer",fontSize:"12px"}}>+ Add Extra Parameter</button>
          <button onClick={()=>setForm({...form,qcTests:[]})}
            style={{background:"none",border:"1px dashed #7f1d1d",borderRadius:"6px",padding:"5px 12px",color:"#475569",cursor:"pointer",fontSize:"12px"}}>↺ Clear (use category defaults)</button>
        </div>
        {!(form.qcTests||[]).length&&form.category&&<div style={{fontSize:"10.5px",color:"#22c55e",marginTop:"6px",background:"#052e16",borderRadius:"6px",padding:"5px 10px"}}>
          ✓ Will print category defaults for <strong>{form.category}</strong> ({((sysQcParams||DEFAULT_QC_PARAMS)[form.category]||[]).length} parameters)
        </div>}
      </div>
    </div>


    {/* Extra Additions */}
    <div style={{marginBottom:"14px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>Extra Additions (printed on production sheet)</div>
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"6px"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 28px",background:"#0b1220",padding:"5px 10px",gap:"6px"}}>
          <div style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>Row Label</div>
          <div/>
        </div>
        {((form.extraAdditions||{}).items||["Dhoyela","Extra Output","Dhoyela"]).map((item,i)=>{
          const items=(form.extraAdditions||{}).items||["Dhoyela","Extra Output","Dhoyela"];
          const isHighlight=item==="Extra Output"||item.toLowerCase().includes("extra output");
          return <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 28px",padding:"5px 10px",gap:"6px",borderTop:"1px solid #1e293b",alignItems:"center",background:isHighlight?"#0a1520":"#080d18"}}>
            <input style={{...sml,color:isHighlight?"#93c5fd":"#e2e8f0"}} value={item}
              onChange={e=>{const arr=[...items];arr[i]=e.target.value;setForm({...form,extraAdditions:{...(form.extraAdditions||{}),items:arr}});}}
              placeholder="e.g. Dhoyela or Extra Output"/>
            <button onClick={()=>{const arr=items.filter((_,idx)=>idx!==i);setForm({...form,extraAdditions:{...(form.extraAdditions||{}),items:arr}});}}
              style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
          </div>;
        })}
        {!((form.extraAdditions||{}).items||[]).length&&<div style={{padding:"8px 10px",fontSize:"12px",color:"#334155",fontStyle:"italic"}}>No extra addition rows.</div>}
      </div>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
        <button onClick={()=>setForm({...form,extraAdditions:{...(form.extraAdditions||{}),items:[...((form.extraAdditions||{}).items||[]),"Dhoyela"]}})}
          style={{background:"none",border:"1px dashed #334155",borderRadius:"6px",padding:"4px 10px",color:"#64748b",cursor:"pointer",fontSize:"12px"}}>+ Dhoyela</button>
        <button onClick={()=>setForm({...form,extraAdditions:{...(form.extraAdditions||{}),items:[...((form.extraAdditions||{}).items||[]),"Extra Output"]}})}
          style={{background:"none",border:"1px dashed #2563eb50",borderRadius:"6px",padding:"4px 10px",color:"#93c5fd",cursor:"pointer",fontSize:"12px"}}>+ Extra Output</button>
        <button onClick={()=>setForm({...form,extraAdditions:{...(form.extraAdditions||{}),items:[...((form.extraAdditions||{}).items||[]),""]}})}
          style={{background:"none",border:"1px dashed #1e293b",borderRadius:"6px",padding:"4px 10px",color:"#475569",cursor:"pointer",fontSize:"12px"}}>+ Custom Row</button>
        <div style={{display:"flex",alignItems:"center",gap:"6px",marginLeft:"auto"}}>
          <span style={{fontSize:"11px",color:"#475569"}}>Blank rows:</span>
          <input type="number" min="0" max="8" value={(form.extraAdditions||{}).blankRows!=null?(form.extraAdditions||{}).blankRows:0}
            onChange={e=>setForm({...form,extraAdditions:{...(form.extraAdditions||{}),blankRows:parseInt(e.target.value)||0}})}
            style={{...sml,width:"48px",textAlign:"center"}}/>

    {isEdit&&<InfoBox color="#f59e0b">Saving will create a new version and archive the current BOM for future reference.</InfoBox>}
    <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
      <Btn label="Cancel" onClick={onCancel} outline color="#475569" small/>
      <Btn label={saving?"Saving…":isEdit?"💾 Save New Version":"✓ Create BOM"} onClick={onSave} disabled={saving} color="#3b82f6" small/>
    </div>
  </div>;
}

// Print dialog component — extracted to avoid remount
function PrintDialog({bom,packSizes,sysQcParams,onClose}){
  const [batchSize,setBatchSize]=useState(bom.baseBatchSize||"100");
  const [batchNo,setBatchNo]=useState("");
  const storedExtra=bom.extraAdditions||{items:["Dhoyela","Extra Output","Dhoyela"],blankRows:0};
  const [extraItems,setExtraItems]=useState([...(storedExtra.items||["Dhoyela","Extra Output","Dhoyela"])]);
  const [blankRows,setBlankRows]=useState(storedExtra.blankRows!=null?storedExtra.blankRows:0);
  const [oldStocks,setOldStocks]=useState([]);
  const addItem=(label)=>setExtraItems(v=>[...v,label]);
  const removeItem=(i)=>setExtraItems(v=>v.filter((_,idx)=>idx!==i));

  // Fetch available old/rejected stock for this exact product only
  useEffect(()=>{
    C("old_stock").where("status","==","Available").get()
      .then(snap=>{
        const all=snap.docs.map(d=>({id:d.id,...d.data()}));
        const matched=all.filter(s=>s.productName&&bom.productName&&
          s.productName.trim().toLowerCase()===bom.productName.trim().toLowerCase());
        setOldStocks(matched);
      }).catch(()=>{});
  },[bom.productName]);

  return <div style={{background:"#0b1220",border:"1px solid #3b82f6",borderRadius:"10px",padding:"16px",marginBottom:"14px"}}>
    <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"12px"}}>🖨 Print Production Sheet — {bom.productName}</div>
    <Grid2>
      <Field label={"Batch Size ("+bom.baseUnit+") *"}><input style={inp} type="number" value={batchSize} onChange={e=>setBatchSize(e.target.value)} placeholder={bom.baseBatchSize}/></Field>
      <Field label="Batch No"><input style={inp} value={batchNo} onChange={e=>setBatchNo(e.target.value)} placeholder="e.g. 0042"/></Field>
    </Grid2>
    <div style={{fontSize:"11px",color:"#475569",marginBottom:"12px"}}>Filling Date and Charging Date will be filled manually on the printed sheet.</div>

    {/* Extra Additions config */}
    <div style={{background:"#080d18",border:"1px solid #1e293b",borderRadius:"8px",padding:"12px",marginBottom:"12px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>Extra Additions Rows</div>
      <div style={{display:"flex",flexDirection:"column",gap:"4px",marginBottom:"8px"}}>
        {extraItems.map((item,i)=><div key={i} style={{display:"flex",gap:"6px",alignItems:"center"}}>
          <input style={{...sml,flex:1}} value={item} onChange={e=>setExtraItems(v=>v.map((x,idx)=>idx===i?e.target.value:x))} placeholder="Row label"/>
          <button onClick={()=>removeItem(i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:"0 2px"}}>×</button>
        </div>)}
      </div>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
        <button onClick={()=>addItem("Dhoyela")} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",padding:"4px 10px",color:"#22c55e",cursor:"pointer",fontSize:"11px"}}>+ Dhoyela</button>
        <button onClick={()=>addItem("Extra Output")} style={{background:"#0f1d35",border:"1px solid #2563eb40",borderRadius:"6px",padding:"4px 10px",color:"#93c5fd",cursor:"pointer",fontSize:"11px"}}>+ Extra Output</button>
        <button onClick={()=>addItem("")} style={{background:"none",border:"1px dashed #334155",borderRadius:"6px",padding:"4px 10px",color:"#475569",cursor:"pointer",fontSize:"11px"}}>+ Custom Row</button>
        <div style={{display:"flex",alignItems:"center",gap:"6px",marginLeft:"auto"}}>
          <span style={{fontSize:"11px",color:"#475569"}}>Extra blank rows:</span>
          <input type="number" min="0" max="8" value={blankRows} onChange={e=>setBlankRows(parseInt(e.target.value)||0)} style={{...sml,width:"48px",textAlign:"center"}}/>
        </div>
      </div>
    </div>

    {/* Old/rejected stock preview */}
    {oldStocks.length>0&&<div style={{background:"#1a0a00",border:"1px solid #f59e0b40",borderRadius:"8px",padding:"10px 12px",marginBottom:"12px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>📦 Old/Rejected Material (will print on sheet)</div>
      {oldStocks.map(s=><div key={s.id} style={{fontSize:"11px",color:"#fcd34d",padding:"2px 0"}}>
        • {s.productName} — {s.qty} {s.unit||""}  {s.notes?`(${s.notes})`:""}
      </div>)}
    </div>}

    <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
      <Btn label="Cancel" onClick={onClose} outline color="#475569" small/>
      <Btn label="🖨 Open Print Preview" onClick={()=>{printProductionSheet(bom,batchSize,batchNo,"","","",packSizes,"",{items:extraItems,blankRows},sysQcParams,oldStocks);onClose();}} color="#22c55e" small/>
    </div>
  </div>;
}

// ── Global XLSX loader — available to any component (BOMTab, FGStockTab, etc.) ──
const loadXLSX=()=>new Promise((resolve,reject)=>{
  if(window.XLSX)return resolve();
  const s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  s.onload=()=>resolve();
  s.onerror=()=>reject(new Error("Failed to load Excel library"));
  document.head.appendChild(s);
});

function BOMTab({role,roles,user,showToast,sysProducts,sysPackSizes,sysQcParams}){
  const isAdmin=roles.includes("admin");
  const canEdit=roles.some(r=>["admin","qc","issuer"].includes(r));
  const directPrintBOM=async(b)=>{
    let oldStocksForPrint=[];
    try{
      const osSnap=await C("old_stock").where("status","==","Available").get();
      const allOs=osSnap.docs.map(d=>({id:d.id,...d.data()}));
      oldStocksForPrint=allOs.filter(s=>s.productName&&b.productName&&
        s.productName.trim().toLowerCase()===b.productName.trim().toLowerCase());
    }catch(_){}
    printProductionSheet(b,b.baseBatchSize,"","","","",sysPackSizes,"",b.extraAdditions||{},sysQcParams,oldStocksForPrint);
  };
  const [boms,setBoms]=useState([]);
  // Products that already have a BOM — used to prevent creating a duplicate BOM for the same product
  const usedProductNames=new Set(boms.map(b=>b.productName).filter(Boolean));
  const [versions,setVersions]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState("");
  const [filterCat,setFilterCat]=useState("All");
  const [groupByCat,setGroupByCat]=useState(true);
  const [activeBOM,setActiveBOM]=useState(null);
  const [showCreate,setShowCreate]=useState(false);
  const [saving,setSaving]=useState(false);

  const defaultQCParams=(category)=>{
    const settingsParams=category&&(sysQcParams||DEFAULT_QC_PARAMS)[category];
    if(settingsParams?.length) return settingsParams.map(p=>({id:newId(),name:typeof p==="string"?p:(p.name||""),standard:""}));
    return [{id:newId(),name:"SD (Drying)",standard:""},{id:newId(),name:"TF (Drying)",standard:""},{id:newId(),name:"HD (Drying)",standard:""},{id:newId(),name:"Colour",standard:""},{id:newId(),name:"Finish",standard:""},{id:newId(),name:"Viscosity",standard:""},{id:newId(),name:"Specific Gravity",standard:""}];
  };
  const blankBOM={productName:"",category:"",baseBatchSize:"100",baseUnit:"L",
    ingredients:[{id:newId(),name:"",standardQty:"",isProcess:false}],
    qcTests:defaultQCParams(""),
    packingSizes:[],
    extraAdditions:{items:["Dhoyela","Extra Output","Dhoyela"],blankRows:0}};
  const [form,setForm]=useState({...blankBOM});

  useEffect(()=>{
    const u1=C("bom_products").orderBy("productName").onSnapshot(s=>{setBoms(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},()=>setLoading(false));
    const u2=C("bom_versions").orderBy("archivedAt","desc").onSnapshot(s=>setVersions(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});
    return()=>{u1();u2();};
  },[]);

  const saveBOM=async(isEdit=false,editId=null)=>{
    if(!form.productName.trim())return showToast("Product name required","error");
    if(!isEdit&&boms.some(b=>b.productName.trim().toLowerCase()===form.productName.trim().toLowerCase())){
      return showToast(`A BOM already exists for "${form.productName}" — edit that one instead of creating a duplicate.`,"error");
    }
    setSaving(true);
    try{
      if(isEdit&&editId){
        // Archive current version first
        const curr=boms.find(b=>b.id===editId);
        if(curr){
          await C("bom_versions").add({...curr,productId:editId,archivedAt:ts(),archivedBy:user.email});
        }
        const newVer=(curr?.currentVersion||1)+1;
        await C("bom_products").doc(editId).update({...form,currentVersion:newVer,updatedBy:user.email,updatedAt:ts()});
        showToast(`BOM updated to v${newVer} — previous version archived ✓`);
      }else{
        await C("bom_products").add({...form,currentVersion:1,createdBy:user.email,createdAt:ts(),updatedAt:ts()});
        showToast("BOM created ✓");
      }
      setShowCreate(false);setActiveBOM(null);setForm({...blankBOM});
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const deleteBOM=async(id)=>{
    if(!confirm("Delete this BOM and all its version history?"))return;
    const vids=versions.filter(v=>v.productId===id).map(v=>v.id);
    await Promise.all(vids.map(vid=>C("bom_versions").doc(vid).delete()));
    await C("bom_products").doc(id).delete();
    showToast("BOM deleted","error");setActiveBOM(null);
  };

  const exportAllBOMs=()=>{
    if(!boms.length)return showToast("No BOMs to export","error");
    const rows=[["Product Name","Category","Base Batch Size","Unit","Version","Last Updated","Ingredient No","Ingredient/Step","Standard Qty","Ingredient Unit","Notes/Description","Is Process Step","SD","TF","HD","Colour","Finish","Viscosity","SG","Remarks"]];
    boms.forEach(b=>{
      const q=b.qcTests||{};
      (b.ingredients||[]).forEach((ing,i)=>{
        const qcSD=i===0?q.sd||"":"";const qcTF=i===0?q.tf||"":"";const qcHD=i===0?q.hd||"":"";
        const qcCol=i===0?q.colour||"":"";const qcFin=i===0?q.finish||"":"";
        const qcVis=i===0?q.viscosity||"":"";const qcSG=i===0?q.sg||"":"";const qcRem=i===0?q.remarks||"":"";
        rows.push([b.productName,b.category||"",b.baseBatchSize||100,b.baseUnit||"L",b.currentVersion||1,b.updatedAt?.toDate?.()?.toLocaleDateString("en-IN")||"",i+1,ing.name||"",ing.isProcess?"":ing.standardQty||"",ing.isProcess?"":(ing.unit||b.baseUnit||"L"),ing.desc||"",ing.isProcess?"Yes":"No",qcSD,qcTF,qcHD,qcCol,qcFin,qcVis,qcSG,qcRem]);
      });
    });
    const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`GCC_BOMs_${today()}.csv`;a.click();
    showToast("BOMs exported ✓");
  };

  const [exportingExcel,setExportingExcel]=useState(false);
  // Export BOMs to Excel — one sheet per product, with LIVE FORMULAS so changing the
  // Batch Size cell automatically recalculates every ingredient quantity.
  const exportBOMsExcel=async()=>{
    if(!boms.length)return showToast("No BOMs to export","error");
    setExportingExcel(true);
    try{
      await loadXLSX();
      const XLSX=window.XLSX;
      const wb=XLSX.utils.book_new();
      const usedNames={};
      boms.forEach(b=>{
        // Sheet name: Excel limits to 31 chars, no \ / ? * [ ] : , and must be unique
        let sheetName=(b.productName||"Product").replace(/[\\\/\?\*\[\]:]/g,"").slice(0,28).trim()||"Product";
        if(usedNames[sheetName]!=null){usedNames[sheetName]++;sheetName=sheetName.slice(0,25)+"_"+usedNames[sheetName];}
        else usedNames[sheetName]=0;

        const base=parseFloat(b.baseBatchSize)||100;
        const unit=b.baseUnit||"L";
        const aoa=[];
        aoa.push([b.productName||"",null,null,null]);
        aoa.push(["Base Batch Size",base,unit,null]);
        aoa.push(["Enter Batch Size",base,unit,"← change this cell"]);
        aoa.push([null,null,null,null]);
        aoa.push(["No","Material / Step","Standard Qty (per "+base+unit+")","Qty for Entered Batch Size"]);
        const firstDataRow=6; // 1-indexed row in the sheet where ingredient rows start
        let rowNo=0;
        const ingredientRowIdxs=[]; // 0-indexed positions within aoa for ingredients (not process steps)
        (b.ingredients||[]).forEach(ing=>{
          if(ing.isProcess){
            aoa.push([null,"→ "+(ing.name||""),null,null]);
          }else{
            rowNo++;
            aoa.push([rowNo,ing.name||"",parseFloat(ing.standardQty)||0,null]); // formula filled in below
            ingredientRowIdxs.push(aoa.length); // 1-indexed sheet row (aoa.length after push = row number, since aoa[0] is sheet row1)
          }
        });
        const totalRowIdx=aoa.length+1; // sheet row number for TOTAL
        aoa.push(["","TOTAL",{f:`SUM(C${firstDataRow}:C${aoa.length})`},{f:`SUM(D${firstDataRow}:D${aoa.length})`}]);

        const ws=XLSX.utils.aoa_to_sheet(aoa);
        // Write live formulas into the "Qty for Entered Batch Size" column (col D) for each ingredient row
        ingredientRowIdxs.forEach(r=>{
          ws["D"+r]={f:`C${r}*$B$3/$B$2`};
        });
        ws["!cols"]=[{wch:6},{wch:34},{wch:24},{wch:26}];
        ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:3}}];
        XLSX.utils.book_append_sheet(wb,ws,sheetName);
      });
      XLSX.writeFile(wb,`GCC_BOM_Formulations_${today()}.xlsx`);
      showToast("Excel exported ✓ — change 'Enter Batch Size' cell on any sheet to auto-recalculate");
    }catch(e){showToast("Error: "+e.message,"error");}
    setExportingExcel(false);
  };

  // Export ONE BOM as Excel laid out like the production sheet (left: ingredients table
  // with live formula scaling; right: QC Standards + Packing), for that single product.
  const [exportingOne,setExportingOne]=useState(null);
  // ── Resolve QC params, pack sizes, and extra-addition items for a BOM/version snapshot ──
  const resolveQcPackExtra=(b)=>{
    const _qcRaw=b.qcTests||{};
    let qcParams=Array.isArray(_qcRaw)?_qcRaw:[];
    if(!qcParams.length&&sysQcParams&&b.category&&sysQcParams[b.category]){
      qcParams=(sysQcParams[b.category]||[]).map(p=>typeof p==="string"?{name:p,standard:""}:{name:p.name||"",standard:""});
    }
    if(!qcParams.length){
      qcParams=[
        {name:"SD (Drying)",standard:_qcRaw.sd||""},{name:"TF (Drying)",standard:_qcRaw.tf||""},
        {name:"HD (Drying)",standard:_qcRaw.hd||""},{name:"Colour",standard:_qcRaw.colour||""},
        {name:"Finish",standard:_qcRaw.finish||""},{name:"Viscosity",standard:_qcRaw.viscosity||""},
        {name:"Specific Gravity",standard:_qcRaw.sg||""}
      ].filter(p=>p.standard);
    }
    let catPackSizes=[];
    if(sysPackSizes&&b.category&&sysPackSizes[b.category]){
      catPackSizes=(sysPackSizes[b.category]||[]).map(p=>typeof p==="string"?p:(p.size||p.label||String(p))).filter(Boolean);
    }
    const extraItems=(b.extraAdditions?.items)||["Dhoyela","Extra Output","Dhoyela"];
    return {qcParams,catPackSizes,extraItems};
  };

  const loadExcelJS=()=>new Promise((resolve,reject)=>{
    if(window.ExcelJS)return resolve();
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error("Failed to load Excel library"));
    document.head.appendChild(s);
  });

  // ── Build ONE real worksheet (genuine sheet, not a fake HTML stack) inside the given workbook,
  // laid out like the production sheet, with real borders/fonts/fills AND live formulas. ──
  const addBOMSheetToWorkbook=(workbook,sheetName,b)=>{
    const base=parseFloat(b.baseBatchSize)||100;
    const unit=b.baseUnit||"L";
    const {qcParams,catPackSizes,extraItems}=resolveQcPackExtra(b);
    let safeName=sheetName.replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31)||"Sheet";
    // Guarantee uniqueness within this workbook — two archived versions can share the same
    // currentVersion number (data inconsistency), which would otherwise throw "Worksheet
    // name already exists" and abort the whole export.
    if(workbook.getWorksheet(safeName)){
      let n=2;
      while(workbook.getWorksheet(`${safeName.slice(0,28)} (${n})`))n++;
      safeName=`${safeName.slice(0,28)} (${n})`;
    }
    const ws=workbook.addWorksheet(safeName,{pageSetup:{
      fitToPage:true,fitToWidth:1,fitToHeight:1,orientation:"portrait",paperSize:9,
      margins:{left:0.25,right:0.25,top:0.3,bottom:0.3,header:0,footer:0}
    }});
    ws.views=[{showGridLines:false}];
    ws.columns=[
      {width:16},{width:34},{width:11},{width:11},{width:11},{width:2.5},{width:16},{width:12},{width:12}
    ];

    const thin={style:"thin",color:{argb:"FF888888"}};
    const allBorder={top:thin,bottom:thin,left:thin,right:thin};
    const fillGrey={type:"pattern",pattern:"solid",fgColor:{argb:"FFD9D9D9"}};
    const fillAmber={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFF3CD"}};
    const fillLight={type:"pattern",pattern:"solid",fgColor:{argb:"FFF0F0F0"}};
    const setCell=(addr,value,opts={})=>{
      const c=ws.getCell(addr);
      c.value=value;
      c.border=opts.noBorder?undefined:allBorder;
      c.font={bold:!!opts.bold,italic:!!opts.italic,size:opts.size||11,color:opts.color?{argb:opts.color}:undefined};
      if(opts.fill)c.fill=opts.fill;
      if(opts.center)c.alignment={horizontal:"center",vertical:"middle",wrapText:!!opts.wrap};
      else c.alignment={vertical:"top",wrapText:opts.wrap!==false};
      return c;
    };
    const merge=(range)=>ws.mergeCells(range);

    let r=1;
    // Title row
    merge(`A${r}:B${r}`); setCell(`A${r}`,"VEEBEE",{bold:true,size:16});
    merge(`C${r}:I${r}`); setCell(`C${r}`,"PRODUCTION SHEET",{bold:true,size:13,center:true});
    r++;
    merge(`A${r}:I${r}`); setCell(`A${r}`,"G.C.C/7.2.1/F/03",{});
    r++;
    // Batch Size — single row (no separate "base" row); the original base value is baked
    // into the formula as a constant, so we don't need a second reference row for it.
    const batchSizeRow=r;
    setCell(`A${r}`,"Batch Size",{bold:true});
    setCell(`B${r}`,base,{center:true});
    setCell(`C${r}`,unit,{});
    merge(`D${r}:I${r}`); setCell(`D${r}`,"← change this cell to recalculate",{bold:true,color:"FF16A34A"});
    r++;
    // Product Name — given the full row width since Version was removed, so long names don't overlap
    setCell(`A${r}`,"PRODUCT NAME:",{bold:true});
    merge(`B${r}:I${r}`); setCell(`B${r}`,b.productName||"",{bold:true,size:11});
    r++;

    // Ingredient table header + QC Standards header (same row)
    const headerRow=r;
    ["NO","INGREDIENTS","STANDARD QTY","CURRENT QTY","ACTUAL QTY"].forEach((h,i)=>{
      setCell(ws.getCell(headerRow,1+i).address,h,{bold:true,center:true,fill:fillGrey});
    });
    merge(`G${headerRow}:I${headerRow}`); setCell(`G${headerRow}`,"QC STANDARDS",{bold:true,center:true,fill:fillGrey});
    r++;
    // QC sub-header sits one row below its title; ingredient data starts directly below its header
    ["Parameter","Standard","Actual Value"].forEach((h,i)=>{
      setCell(ws.getCell(r,7+i).address,h,{bold:true,center:true,fill:fillGrey});
    });
    const qcDataStartRow=r+1;
    let qcRow=qcDataStartRow;
    if(qcParams.length)qcParams.forEach(p=>{
      setCell(`G${qcRow}`,p.name||"",{size:11});setCell(`H${qcRow}`,p.standard||"",{center:true,size:11});setCell(`I${qcRow}`,"",{size:11});
      qcRow++;
    });else{ merge(`G${qcRow}:I${qcRow}`); setCell(`G${qcRow}`,"No QC parameters defined",{}); qcRow++; }
    const packHeaderRow=qcRow;
    merge(`G${packHeaderRow}:I${packHeaderRow}`); setCell(`G${packHeaderRow}`,"PACKING",{bold:true,italic:true,center:true,fill:fillLight});
    setCell(`G${packHeaderRow+1}`,"Size",{bold:true,center:true,fill:fillGrey});
    merge(`H${packHeaderRow+1}:I${packHeaderRow+1}`); setCell(`H${packHeaderRow+1}`,"No. of Packs",{bold:true,center:true,fill:fillGrey});
    let packRow=packHeaderRow+2;
    const packSizesToShow=catPackSizes.length?catPackSizes:["","",""];
    packSizesToShow.forEach(s=>{
      setCell(`G${packRow}`,s,{size:11});merge(`H${packRow}:I${packRow}`);setCell(`H${packRow}`,"",{size:11});
      packRow++;
    });
    const rightBlockEndRow=packRow-1;

    // Ingredient rows (left side), starting at headerRow+1
    let rowNo=0;
    const dataStartRow=headerRow+1;
    let lr=dataStartRow;
    (b.ingredients||[]).forEach(ing=>{
      if(ing.isProcess){
        merge(`B${lr}:E${lr}`);
        setCell(`A${lr}`,"",{});
        setCell(`B${lr}`,"→ "+(ing.name||""),{italic:true,color:"FF92400E",size:11});
        ws.getRow(lr).height=20;
        lr++;
      }else{
        rowNo++;
        const nameDisplay=ing.name+(ing.desc?` (${ing.desc})`:"");
        setCell(`A${lr}`,rowNo,{center:true,size:12});
        setCell(`B${lr}`,nameDisplay,{wrap:true,size:12});
        const stdQty=parseFloat(ing.standardQty)||0;
        setCell(`C${lr}`,stdQty,{center:true,size:12});
        const curCell=setCell(`D${lr}`,null,{center:true,size:12});
        curCell.value={formula:`C${lr}*$B$${batchSizeRow}/${base}`};
        setCell(`E${lr}`,"",{size:12});
        ws.getRow(lr).height=20;
        lr++;
      }
    });
    const lastIngRow=lr-1;
    const totalRow=lr;
    setCell(`A${totalRow}`,"",{});
    setCell(`B${totalRow}`,"TOTAL",{bold:true});
    const totalStdCell=setCell(`C${totalRow}`,null,{bold:true,center:true});
    totalStdCell.value={formula:`SUM(C${dataStartRow}:C${lastIngRow})`};
    const totalCurCell=setCell(`D${totalRow}`,null,{bold:true,center:true});
    totalCurCell.value={formula:`SUM(D${dataStartRow}:D${lastIngRow})`};
    setCell(`E${totalRow}`,"",{});

    // Bottom rows span the FULL width
    let br=Math.max(totalRow,rightBlockEndRow)+1;
    merge(`A${br}:I${br}`); setCell(`A${br}`,"Additional Materials (if any)",{bold:true,italic:true,fill:fillAmber});
    br++;
    merge(`A${br}:I${br}`); setCell(`A${br}`,"",{}); ws.getRow(br).height=20; br++;
    merge(`A${br}:I${br}`); setCell(`A${br}`,"EXTRA ADDITIONS",{bold:true,italic:true,fill:fillLight});
    br++;
    extraItems.forEach(item=>{
      setCell(`A${br}`,item,{italic:true,size:11});
      merge(`B${br}:I${br}`); setCell(`B${br}`,"",{});
      br++;
    });
    setCell(`A${br}`,"Check by:",{bold:true});
    merge(`B${br}:D${br}`); setCell(`B${br}`,"",{});
    setCell(`E${br}`,"Prepared by:",{bold:true});
    merge(`F${br}:I${br}`); setCell(`F${br}`,"",{});

    return ws;
  };

  const [exportingZip,setExportingZip]=useState(false);
  const loadJSZip=()=>new Promise((resolve,reject)=>{
    if(window.JSZip)return resolve();
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";

  // Export ONE product as a real multi-sheet workbook: "Current (vX)" + one sheet per archived version.
  const exportSingleBOMExcel=async(b)=>{
    setExportingOne(b.id);
    try{
      await loadExcelJS();
      const workbook=new window.ExcelJS.Workbook();
      addBOMSheetToWorkbook(workbook,`Current (v${b.currentVersion||1})`,b);
      const bVersions=versions.filter(v=>v.productId===b.id).sort((x,y)=>(y.currentVersion||0)-(x.currentVersion||0));
      bVersions.forEach(v=>addBOMSheetToWorkbook(workbook,`v${v.currentVersion||"?"} (Archived)`,v));
      const buffer=await workbook.xlsx.writeBuffer();
      const blob=new Blob([buffer],{type:"application/octet-stream"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);
      const fname=(b.productName||"BOM").replace(/[\\\/\?\*\[\]:<>|]/g,"").replace(/\s+/g,"_");
      a.download=`GCC_${fname}_${today()}.xlsx`;a.click();
      const histNote=bVersions.length?` Includes ${bVersions.length} archived version(s) as separate sheets in the same file.`:"";

    setExportingOne(null);

  // Download ALL BOMs at once — ONE real multi-sheet .xlsx workbook per product
  // (Current + every Archived version as separate sheets within that single file),
  // all bundled together into one ZIP.
  const exportAllBOMsZip=async()=>{
    if(!boms.length)return showToast("No BOMs to export","error");
    setExportingZip(true);
    try{
      await Promise.all([loadExcelJS(),loadJSZip()]);
      const zip=new window.JSZip();
      const usedFile={};
      for(const b of boms){
        const workbook=new window.ExcelJS.Workbook();
        addBOMSheetToWorkbook(workbook,`Current (v${b.currentVersion||1})`,b);
        const bVersions=versions.filter(v=>v.productId===b.id).sort((x,y)=>(y.currentVersion||0)-(x.currentVersion||0));
        bVersions.forEach(v=>addBOMSheetToWorkbook(workbook,`v${v.currentVersion||"?"} (Archived)`,v));
        const buffer=await workbook.xlsx.writeBuffer();
        let fname=(b.productName||"BOM").replace(/[\\\/\?\*\[\]:<>|]/g,"").replace(/\s+/g,"_");
        if(usedFile[fname]!=null){usedFile[fname]++;fname=fname+"_"+usedFile[fname];} else usedFile[fname]=0;
        zip.file(`${fname}.xlsx`,buffer);
      }
      const blob=await zip.generateAsync({type:"blob"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);
      a.download=`GCC_All_BOMs_${today()}.zip`;a.click();
      showToast(`✓ ${boms.length} products exported as ZIP — each file contains Current + Archived versions as separate sheets.`);
    }catch(e){showToast("Error: "+e.message,"error");}
    setExportingZip(false);
  };

  // When grouped: sort by category then product name
  const fbSorted=groupByCat?[...fb].sort((a,b)=>{const cc=(a.category||"").localeCompare(b.category||"");return cc||a.productName.localeCompare(b.productName);}):[...fb];
  // Group into {cat: [boms]}
  const grouped=fbSorted.reduce((acc,b)=>{const c=b.category||"(No Category)";if(!acc[c])acc[c]=[];acc[c].push(b);return acc;},{});

                  <div/><div style={{fontSize:"11px",fontWeight:"700",color:"#94a3b8"}}>Total</div>

            </div>
            <div>
              <div style={{fontSize:"10px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>QC Standards</div>
              <div style={{border:"1px solid #1e293b",borderRadius:"6px",overflow:"hidden"}}>
                {((Array.isArray(b.qcTests)?b.qcTests:Object.entries(b.qcTests||{}).map(([k,v])=>({name:k,standard:v}))).filter(p=>p.standard||p.standard===0)).map((p,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr",padding:"5px 10px",borderTop:"1px solid #1e293b",gap:"6px"}}>
                  <div style={{fontSize:"11px",color:"#475569"}}>{p.name}</div>
                  <div style={{fontSize:"12px",color:"#e2e8f0"}}>{p.standard}</div>
                </div>)}
                {!(Array.isArray(b.qcTests)?b.qcTests:Object.entries(b.qcTests||{})).filter(p=>p.standard||p[1]).length&&<div style={{padding:"8px 10px",fontSize:"11px",color:"#334155",fontStyle:"italic"}}>No test parameters defined</div>}
              </div>
            </div>
          </div>
        </div>}
      </div>;
  };


  return <div>
    <SectionHead title="📋 Bill of Materials"/>
    <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"12px"}}>
      <input placeholder="Search product…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"7px 10px",fontSize:"12.5px"}}/>
      <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={{...sl,width:"140px",padding:"7px 6px",fontSize:"12px"}}>
        <option value="All">All Categories</option>
        {cats.map(c=><option key={c}>{c}</option>)}
      </select>
      <button onClick={()=>setGroupByCat(v=>!v)} style={{background:groupByCat?"#1e3a5f":"#1e293b",border:`1px solid ${groupByCat?"#3b82f6":"#334155"}`,borderRadius:"6px",padding:"5px 12px",color:groupByCat?"#93c5fd":"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600"}}>
        {groupByCat?"📂 Grouped":"☰ List"}
      </button>
      <span style={{fontSize:"11px",color:"#334155"}}>{fb.length} BOM{fb.length!==1?"s":""}</span>
      <div style={{marginLeft:"auto",display:"flex",gap:"8px"}}>
        <Btn label="📥 Export All (CSV)" onClick={exportAllBOMs} color="#64748b" small outline/>
        <Btn label={exportingExcel?"Exporting…":"📊 Export Excel (Live Formulas)"} onClick={exportBOMsExcel} color="#16a34a" small outline disabled={exportingExcel}/>
        <Btn label={exportingZip?"Zipping…":"📦 Download All (ZIP)"} onClick={exportAllBOMsZip} color="#a855f7" small outline disabled={exportingZip}/>
        {canEdit&&<Btn label="+ Create BOM" onClick={()=>{setForm({...blankBOM});setShowCreate(true);setActiveBOM(null);}} color="#3b82f6"/>}
      </div>
    </div>

    {/* Create form */}
    {showCreate&&<div style={{background:"#080d18",border:"1px solid #3b82f630",borderRadius:"12px",padding:"18px",marginBottom:"16px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"14px"}}>📋 New Bill of Materials</div>
      <BOMForm form={form} setForm={setForm} saving={saving} isEdit={false} onCancel={()=>{setShowCreate(false);setForm({...blankBOM});}} onSave={()=>saveBOM(false)} sysProducts={sysProducts} sysQcParams={sysQcParams} usedProductNames={usedProductNames}/>
    </div>}

    {loading&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading…</div>}
    {!loading&&fb.length===0&&!showCreate&&<div style={{textAlign:"center",padding:"50px 0"}}>
      <div style={{fontSize:"36px"}}>📋</div>
      <div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>{canEdit?"No BOMs yet. Create your first BOM to print production sheets.":"No BOMs found."}</div>
    </div>}

    {/* BOM cards — grouped or flat */}
    {groupByCat&&filterCat==="All"
      ?Object.entries(grouped).map(([cat,catBoms])=><div key={cat} style={{marginBottom:"16px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",textTransform:"uppercase",letterSpacing:"0.08em",padding:"6px 12px",background:"#0f1d35",border:"1px solid #1e3a5f",borderRadius:"8px 8px 0 0",display:"flex",alignItems:"center",gap:"10px"}}>
            <span>📂 {cat}</span>
            <span style={{fontSize:"11px",color:"#475569",fontWeight:"400"}}>{catBoms.length} product{catBoms.length!==1?"s":""}</span>
          </div>
          <div style={{border:"1px solid #1e3a5f",borderTop:"none",borderRadius:"0 0 8px 8px",overflow:"hidden"}}>
            {catBoms.map((b,idx)=>renderBOMCard(b,idx===catBoms.length-1))}
          </div>
        </div>)
      :fbSorted.map(b=>renderBOMCard(b,false))
    }
  </div>;
}

// ══════════════════════════════════════════════════════════
// TASKS MODULE
// ══════════════════════════════════════════════════════════
function TasksTab({user,roles,showToast,allRoles,allProfiles}){
  const isAdmin=roles.includes("admin");
  const canAssign=isAdmin; // Only admin can assign tasks
  const [tasks,setTasks]=useState([]);
  const [loading,setLoading]=useState(true);
  const [subTab,setSubTab]=useState("pending");
  const [showCreate,setShowCreate]=useState(false);
  const [saving,setSaving]=useState(false);
  const [completeTask,setCompleteTask]=useState(null);
  const [reassignTask,setReassignTask]=useState(null); // {id, assignedTo, title}
  const [completedSortUser,setCompletedSortUser]=useState("All"); // filter by user

  const blankTask={title:"",description:"",assignedTo:user.email,dueDate:"",priority:"Normal",category:"General",formula:{name:"",type:"Paint",ingredients:[{id:newId(),name:"",qty:"",unit:""}]}};
  const [form,setForm]=useState({...blankTask});

  // Only show users who actually exist in the system (have logged in or have a role)
  const assignableUsers=[...new Set([
    ...Object.keys(allProfiles),   // users who have logged in
    ...Object.keys(allRoles),      // users with assigned roles
    user.email                     // always include self
  ])].filter(Boolean).sort((a,b)=>{
    const na=allProfiles[a]?.displayName||a;
    const nb=allProfiles[b]?.displayName||b;
    return na.localeCompare(nb);
  });

  useEffect(()=>{
    // Auto-delete completed tasks older than 60 days
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-60);
    const cutoffStr=cutoff.toISOString().slice(0,10);
    C("tasks").where("status","==","completed").get().then(snap=>{
      const old=snap.docs.filter(d=>(d.data().completedAt||"")<=cutoffStr);
      if(old.length){const b=db.batch();old.slice(0,20).forEach(d=>b.delete(C("tasks").doc(d.id)));b.commit().catch(()=>{});}
    }).catch(()=>{});
  },[]);

  const reassign=async()=>{
    if(!reassignTask?.assignedTo)return;
    setSaving(true);
    try{
      await C("tasks").doc(reassignTask.id).update({status:"pending",assignedTo:reassignTask.assignedTo,reassignedBy:user.email,reassignedAt:today(),completedAt:null,completionNotes:"",completedBy:null});
      if(reassignTask.assignedTo!==user.email)
        await C("notifications").add({assignedTo:reassignTask.assignedTo,title:"Task reassigned: "+reassignTask.title,message:"Reassigned by "+(allProfiles[user.email]?.displayName||user.email),type:"task_assigned",read:false,_createdAt:ts()});
      showToast("Task reassigned ✓");setReassignTask(null);
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  useEffect(()=>{
    // Admin sees ALL tasks. Non-admins see ONLY tasks assigned TO them — nothing else,
    // since only Admin can assign tasks (no legacy "tasks I assigned" merge needed).
    const q=isAdmin
      ?C("tasks")
      :C("tasks").where("assignedTo","==",user.email);
    const u=q.onSnapshot(s=>{
      let all=s.docs.map(d=>({id:d.id,...d.data()}));
      all.sort((a,b)=>(b._createdAt?.seconds||0)-(a._createdAt?.seconds||0));
      setTasks(all);setLoading(false);
    },()=>setLoading(false));
    return u;
  },[]);

  const createTask=async()=>{
    if(!form.title.trim())return showToast("Task title required","error");
    if(!form.assignedTo)return showToast("Assign to someone","error");
    setSaving(true);
    try{
      const isRD=form.category==="R&D";
      const hasFormula=isRD&&form.formula?.name?.trim()&&form.formula?.ingredients?.some(r=>r.name.trim());
      const taskData={...form,status:"pending",assignedBy:user.email,assignedAt:today(),_createdAt:ts()};
      // Only store formula if R&D + has content
      if(!hasFormula)delete taskData.formula;
      const taskRef=await C("tasks").add(taskData);

      // If R&D task with formula → also create an R&D project entry
      if(hasFormula){
        const validIngredients=form.formula.ingredients.filter(r=>r.name.trim());
        await C("rd_projects").add({
          projectName:form.formula.name,
          paintType:form.formula.type,
          formulationType:"Task Formula",
          taskId:taskRef.id,
          taskTitle:form.title,
          assignedTo:form.assignedTo,
          ingredients:validIngredients,
          status:"Ongoing",
          createdBy:user.email,
          startDate:today(),
          notes:"Formula added via task: "+form.title,
          _createdAt:ts()
        });
      }

      // Notification
      if(form.assignedTo!==user.email){
        await C("notifications").add({
          assignedTo:form.assignedTo,
          title:(isRD?"🧪 R&D Task: ":"📋 New task: ")+form.title,
          message:"Assigned by "+(allProfiles[user.email]?.displayName||user.email)+(form.dueDate?" · Due: "+form.dueDate:"")+(hasFormula?" · Includes formula: "+form.formula.name:""),
          taskId:taskRef.id,type:"task_assigned",read:false,_createdAt:ts()
        });
      }
      showToast("Task assigned ✓"+(hasFormula?" · Formula saved to R&D":""));
      setShowCreate(false);setForm({...blankTask});
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const markComplete=async(task,notes)=>{
    setSaving(true);
    try{
      await C("tasks").doc(task.id).update({status:"completed",completedAt:today(),completionNotes:notes||"",completedBy:user.email});
      showToast("Task marked complete ✓");setCompleteTask(null);
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const deleteTask=async(id)=>{
    if(!confirm("Delete this task?"))return;
    await C("tasks").doc(id).delete();
    showToast("Deleted","error");
  };

  const PRIORITY_COLORS={High:"#ef4444",Normal:"#3b82f6",Low:"#22c55e"};
  const pending=tasks.filter(t=>t.status==="pending");
  const completed=tasks.filter(t=>t.status==="completed");
  const myPending=pending.filter(t=>t.assignedTo===user.email);

  return <div>
    <SectionHead title="✅ Tasks"/>
    <div style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"12px",flexWrap:"wrap"}}>
      {["pending","completed"].map(s=><button key={s} onClick={()=>setSubTab(s)} style={{background:subTab===s?"#1e293b":"transparent",border:"none",borderBottom:subTab===s?"2px solid #3b82f6":"2px solid transparent",color:subTab===s?"#f1f5f9":"#64748b",padding:"7px 16px",cursor:"pointer",fontSize:"13px",fontWeight:"600",borderRadius:"8px 8px 0 0"}}>
        {s==="pending"?"📋 Pending":"✅ Completed"}
        <span style={{fontSize:"11px",marginLeft:"5px",background:"#0b1220",padding:"1px 6px",borderRadius:"99px",color:"#475569"}}>{s==="pending"?pending.length:completed.length}</span>
      </button>)}
      {canAssign&&<Btn label="+ Assign Task" onClick={()=>{setForm({...blankTask});setShowCreate(true);}} color="#3b82f6" style={{marginLeft:"auto"}}/>}
    </div>

    {/* Create task form */}
    {showCreate&&canAssign&&<div style={{background:"#080d18",border:"1px solid #3b82f630",borderRadius:"12px",padding:"16px",marginBottom:"14px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"12px"}}>📋 Assign New Task</div>
      <Grid2>
        <Field label="Task Title *"><input style={inp} value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Check batch 0042 QC parameters"/></Field>
        <Field label="Assign To *">
          <select style={sl} value={form.assignedTo} onChange={e=>setForm({...form,assignedTo:e.target.value})}>
            {assignableUsers.map(e=><option key={e} value={e}>{allProfiles[e]?.displayName?`${allProfiles[e].displayName} (${e})`:e}</option>)}
          </select>
        </Field>
      </Grid2>
      <Field label="Description / Instructions"><textarea style={{...inp,minHeight:"70px",resize:"vertical"}} value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Detailed instructions (optional)"/></Field>
      <Grid2>
        <Field label="Due Date (optional)"><input type="date" style={inp} value={form.dueDate} onChange={e=>setForm({...form,dueDate:e.target.value})}/></Field>
        <Field label="Priority">
          <select style={sl} value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}>
            {["High","Normal","Low"].map(p=><option key={p}>{p}</option>)}
          </select>
        </Field>
      </Grid2>
      <Field label="Category">
        <div style={{display:"flex",gap:"8px"}}>
          {["General","R&D"].map(cat=><button key={cat} onClick={()=>setForm({...form,category:cat})} style={{background:form.category===cat?(cat==="R&D"?"#0d1f10":"#0f1d35"):"#0b1220",border:`1px solid ${form.category===cat?(cat==="R&D"?"#22c55e":"#3b82f6"):"#334155"}`,borderRadius:"7px",padding:"6px 16px",color:form.category===cat?(cat==="R&D"?"#86efac":"#93c5fd"):"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600"}}>
            {cat==="R&D"?"🧪 R&D":"📋 General"}
          </button>)}
        </div>
      </Field>

      {/* R&D Formula Editor — only shown when R&D category selected */}
      {form.category==="R&D"&&<div style={{background:"#060d0a",border:"1px solid #22c55e30",borderRadius:"10px",padding:"14px",marginTop:"2px",marginBottom:"4px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#86efac",marginBottom:"10px"}}>🧪 Formula (optional) — will be saved to R&D Projects</div>
        <Grid2>
          <Field label="Formula / Product Name"><input style={inp} value={form.formula?.name||""} onChange={e=>setForm({...form,formula:{...form.formula,name:e.target.value}})} placeholder="e.g. Trial Enamel White 01"/></Field>
          <Field label="Type">
            <select style={sl} value={form.formula?.type||"Paint"} onChange={e=>setForm({...form,formula:{...form.formula,type:e.target.value}})}>
              {["Paint","Thinner","Varnish","Primer","Putty","Other"].map(t=><option key={t}>{t}</option>)}
            </select>
          </Field>
        </Grid2>
        <div style={{border:"1px solid #1e3a2f",borderRadius:"8px",overflow:"hidden",marginBottom:"8px"}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 80px 80px 28px",background:"#0a1a0f",padding:"6px 10px",gap:"6px"}}>
            {["Ingredient / Raw Material","Qty","Unit",""].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
          </div>
          {(form.formula?.ingredients||[]).map((row,i)=><div key={row.id||i} style={{display:"grid",gridTemplateColumns:"2fr 80px 80px 28px",padding:"5px 10px",gap:"6px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
            <input style={sml} value={row.name} onChange={e=>{const arr=[...(form.formula.ingredients||[])];arr[i]={...arr[i],name:e.target.value};setForm({...form,formula:{...form.formula,ingredients:arr}});}} placeholder="e.g. TiO2, Linseed Oil"/>
            <input style={{...sml,textAlign:"center"}} type="number" min="0" step="0.01" value={row.qty} onChange={e=>{const arr=[...(form.formula.ingredients||[])];arr[i]={...arr[i],qty:e.target.value};setForm({...form,formula:{...form.formula,ingredients:arr}});}} placeholder="0"/>
            <input style={sml} value={row.unit} onChange={e=>{const arr=[...(form.formula.ingredients||[])];arr[i]={...arr[i],unit:e.target.value};setForm({...form,formula:{...form.formula,ingredients:arr}});}} placeholder="kg/L"/>
            <button onClick={()=>{const arr=(form.formula.ingredients||[]).filter((_,j)=>j!==i);setForm({...form,formula:{...form.formula,ingredients:arr.length?arr:[{id:newId(),name:"",qty:"",unit:""}]}});}} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
          </div>)}
        </div>
        <button onClick={()=>setForm({...form,formula:{...form.formula,ingredients:[...(form.formula.ingredients||[]),{id:newId(),name:"",qty:"",unit:""}]}})} style={{background:"none",border:"1px dashed #1e3a2f",borderRadius:"6px",padding:"4px 12px",color:"#4ade80",cursor:"pointer",fontSize:"12px"}}>+ Add Ingredient</button>
        {!(form.formula?.name?.trim())&&<div style={{fontSize:"10.5px",color:"#334155",marginTop:"6px",fontStyle:"italic"}}>Formula name required for it to be saved to R&D Projects.</div>}
      </div>}

      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowCreate(false)} outline color="#475569" small/>
        <Btn label={saving?"Saving…":"✓ Assign Task"} onClick={createTask} disabled={saving} color="#3b82f6" small/>
      </div>
    </div>}

    {loading&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading…</div>}

    {/* PENDING tab */}
    {subTab==="pending"&&!loading&&<div>
      {pending.length===0&&<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px"}}>✅</div><div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>No pending tasks</div></div>}
      {pending.map(task=>{
        const isOverdue=task.dueDate&&task.dueDate<today()&&task.status==="pending";
        const isMine=task.assignedTo===user.email;
        const assigneeName=allProfiles[task.assignedTo]?.displayName||task.assignedTo;
        const assignerName=allProfiles[task.assignedBy]?.displayName||task.assignedBy;
        const isCompletingThis=completeTask?.id===task.id;
        return <div key={task.id} style={{background:"#0f172a",border:`1px solid ${isOverdue?"#7f1d1d":isMine?"#1e3a5f":"#1e293b"}`,borderLeft:`3px solid ${PRIORITY_COLORS[task.priority]||"#3b82f6"}`,borderRadius:"10px",padding:"13px 16px",marginBottom:"8px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px",flexWrap:"wrap"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap",marginBottom:"4px"}}>
                <span style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9"}}>{task.title}</span>
                {task.category==="R&D"&&<Bdg label="🧪 R&D" color="#22c55e" small/>}
                <Bdg label={task.priority} color={PRIORITY_COLORS[task.priority]||"#3b82f6"} small/>
                {isOverdue&&<Bdg label="⚠️ Overdue" color="#ef4444" small/>}
                {isMine&&<Bdg label="👤 Assigned to you" color="#22c55e" small/>}
              </div>
              {task.description&&<div style={{fontSize:"12px",color:"#64748b",marginBottom:"4px"}}>{task.description}</div>}
              {task.formula?.name&&<div style={{fontSize:"11px",background:"#0a1a0f",border:"1px solid #22c55e20",borderRadius:"6px",padding:"5px 10px",marginBottom:"4px",color:"#86efac"}}>
                🧪 Formula: <strong>{task.formula.name}</strong> ({task.formula.type}) · {(task.formula.ingredients||[]).filter(r=>r.name).length} ingredients
              </div>}
              <div style={{fontSize:"11px",color:"#475569",display:"flex",gap:"12px",flexWrap:"wrap"}}>
                <span>📅 Assigned: {task.assignedAt}</span>
                {task.dueDate&&<span style={{color:isOverdue?"#ef4444":"#64748b"}}>⏰ Due: {task.dueDate}</span>}
                {canAssign&&<span>👤 To: {assigneeName}</span>}
                <span>Assigned by: {assignerName}</span>
              </div>
            </div>
            <div style={{display:"flex",gap:"6px",flexShrink:0}}>
              {isMine&&!isCompletingThis&&<Btn label="✅ Mark Complete" onClick={()=>setCompleteTask({id:task.id,notes:""})} color="#22c55e" small/>}
              {(isAdmin||task.assignedBy===user.email)&&<button onClick={()=>deleteTask(task.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"14px"}}>🗑</button>}
            </div>
          </div>
          {/* Completion form */}
          {isCompletingThis&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b"}}>
            <Field label="Completion Notes (optional)"><textarea style={{...inp,minHeight:"60px",resize:"vertical"}} value={completeTask.notes} onChange={e=>setCompleteTask({...completeTask,notes:e.target.value})} placeholder="What was done, any observations…"/></Field>
            <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
              <Btn label="Cancel" onClick={()=>setCompleteTask(null)} outline color="#475569" small/>
              <Btn label={saving?"Saving…":"✅ Confirm Complete"} onClick={()=>markComplete(task,completeTask.notes)} disabled={saving} color="#22c55e" small/>
            </div>
          </div>}
        </div>;
      })}
    </div>}

    {/* COMPLETED tab */}
    {subTab==="completed"&&!loading&&<div>
      {/* Sort & filter controls */}
      <div style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"10px",flexWrap:"wrap"}}>
        <span style={{fontSize:"12px",color:"#475569",fontWeight:"600"}}>Filter by user:</span>
        <select style={{...sl,width:"200px",fontSize:"12px",padding:"5px 8px"}} value={completedSortUser} onChange={e=>setCompletedSortUser(e.target.value)}>
          <option value="All">All Users</option>
          {[...new Set(completed.map(t=>t.assignedTo))].sort().map(e=><option key={e} value={e}>{allProfiles[e]?.displayName||e}</option>)}
        </select>
        <span style={{fontSize:"11px",color:"#334155",marginLeft:"4px"}}>
          {completed.filter(t=>completedSortUser==="All"||t.assignedTo===completedSortUser).length} tasks
        </span>
        <span style={{fontSize:"10px",color:"#334155",marginLeft:"auto",fontStyle:"italic"}}>
          ⏳ Completed tasks auto-delete after 60 days
        </span>
      </div>

      {completed.length===0&&<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px"}}>📋</div><div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>No completed tasks yet</div></div>}

      {/* Group by user if "All" selected */}
      {(completedSortUser==="All"
        ?[...new Set(completed.map(t=>t.assignedTo))].sort()
        :[completedSortUser]
      ).map(userEmail=>{
        const userTasks=completed.filter(t=>t.assignedTo===userEmail);
        if(!userTasks.length)return null;
        const userName=allProfiles[userEmail]?.displayName||userEmail;
        return <div key={userEmail} style={{marginBottom:"14px"}}>
          {completedSortUser==="All"&&<div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px",paddingBottom:"4px",borderBottom:"1px solid #1e293b"}}>
            👤 {userName} — {userTasks.length} task{userTasks.length!==1?"s":""}
          </div>}
          {userTasks.map(task=>{
            const isReassigningThis=reassignTask?.id===task.id;
            const daysSince=task.completedAt?Math.floor((new Date()-new Date(task.completedAt))/(86400000)):null;
            const daysLeft=daysSince!==null?60-daysSince:null;
            return <div key={task.id} style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:"3px solid #22c55e",borderRadius:"10px",padding:"12px 16px",marginBottom:"6px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px",flexWrap:"wrap"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:"13px",fontWeight:"700",color:"#94a3b8",marginBottom:"3px"}}>✅ {task.title}</div>
                  {task.completionNotes&&<div style={{fontSize:"12px",color:"#475569",marginBottom:"3px",fontStyle:"italic"}}>"{task.completionNotes}"</div>}
                  <div style={{fontSize:"11px",color:"#334155",display:"flex",gap:"10px",flexWrap:"wrap"}}>
                    <span>Assigned: {task.assignedAt}</span>
                    <span>Completed: {task.completedAt}</span>
                    {canAssign&&completedSortUser==="All"&&<span>By: {userName}</span>}
                    {daysLeft!==null&&daysLeft<=14&&<span style={{color:daysLeft<=3?"#ef4444":"#f59e0b"}}>🗑 Auto-deletes in {daysLeft}d</span>}
                  </div>
                </div>
                <div style={{display:"flex",gap:"6px",flexShrink:0}}>
                  {canAssign&&!isReassigningThis&&<Btn label="↩ Reassign" onClick={()=>setReassignTask({id:task.id,title:task.title,assignedTo:task.assignedTo})} color="#f59e0b" small outline/>}
                  {(isAdmin||task.assignedBy===user.email)&&<button onClick={()=>deleteTask(task.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"14px"}}>🗑</button>}
                </div>
              </div>
              {/* Reassign form */}
              {isReassigningThis&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b"}}>
                <div style={{fontSize:"12px",color:"#f59e0b",fontWeight:"600",marginBottom:"8px"}}>↩ Reassign Task — moves back to Pending</div>
                <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
                  <select style={{...sl,flex:1}} value={reassignTask.assignedTo} onChange={e=>setReassignTask({...reassignTask,assignedTo:e.target.value})}>
                    {assignableUsers.map(e=><option key={e} value={e}>{allProfiles[e]?.displayName?`${allProfiles[e].displayName} (${e})`:e}</option>)}
                  </select>
                  <Btn label={saving?"Saving…":"↩ Confirm Reassign"} onClick={reassign} disabled={saving} color="#f59e0b" small/>
                  <Btn label="Cancel" onClick={()=>setReassignTask(null)} outline color="#475569" small/>
                </div>
              </div>}
            </div>;
          })}
        </div>;
      })}
    </div>}
  </div>;
}
