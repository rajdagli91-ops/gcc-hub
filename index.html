// TASKS MODULE
// ══════════════════════════════════════════════════════════
function TasksTab({user,roles,showToast,allRoles,allProfiles}){
  const isAdmin=roles.includes("admin");
  const canAssign=isAdmin; // Only admin can assign tasks
  const [tasks,setTasks]=useState([]);
  const [loading,setLoading]=useState(true);
  const [subTab,setSubTab]=useState("pending");
  const [showCreate,setShowCreate]=useState(false);
  const [saving,setSaving]=useState(false);
  const [completeTask,setCompleteTask]=useState(null);
  const [reassignTask,setReassignTask]=useState(null); // {id, assignedTo, title}
  const [completedSortUser,setCompletedSortUser]=useState("All"); // filter by user

  const blankTask={title:"",description:"",assignedTo:user.email,dueDate:"",priority:"Normal",category:"General",formula:{name:"",type:"Paint",ingredients:[{id:newId(),name:"",qty:"",unit:""}]}};
  const [form,setForm]=useState({...blankTask});

  // Only show users who actually exist in the system (have logged in or have a role)
  const assignableUsers=[...new Set([
    ...Object.keys(allProfiles),   // users who have logged in
    ...Object.keys(allRoles),      // users with assigned roles
    user.email                     // always include self
  ])].filter(Boolean).sort((a,b)=>{
    const na=allProfiles[a]?.displayName||a;
    const nb=allProfiles[b]?.displayName||b;
    return na.localeCompare(nb);
  });

  useEffect(()=>{
    // Auto-delete completed tasks older than 60 days
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-60);
    const cutoffStr=cutoff.toISOString().slice(0,10);
    C("tasks").where("status","==","completed").get().then(snap=>{
      const old=snap.docs.filter(d=>(d.data().completedAt||"")<=cutoffStr);
      if(old.length){const b=db.batch();old.slice(0,20).forEach(d=>b.delete(C("tasks").doc(d.id)));b.commit().catch(()=>{});}
    }).catch(()=>{});
  },[]);

  const reassign=async()=>{
    if(!reassignTask?.assignedTo)return;
    setSaving(true);
    try{
      await C("tasks").doc(reassignTask.id).update({status:"pending",assignedTo:reassignTask.assignedTo,reassignedBy:user.email,reassignedAt:today(),completedAt:null,completionNotes:"",completedBy:null});
      if(reassignTask.assignedTo!==user.email){
        await notify(reassignTask.assignedTo,{type:"task_assigned",msg:`📋 Task "${reassignTask.title}" assigned to you by ${allProfiles[user.email]?.displayName||user.email.split("@")[0]}`});
        const adminEmails=Object.keys(allRoles).filter(e=>(allRoles[e]||[]).includes("admin")&&e!==user.email);
        await notify(adminEmails,{type:"task_reassigned",msg:`📋 Task "${reassignTask.title}" reassigned to ${reassignTask.assignedTo.split("@")[0]}`});
      }
      showToast("Task reassigned ✓");setReassignTask(null);
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  useEffect(()=>{
    // Admin sees ALL tasks. Non-admins see ONLY tasks assigned TO them — nothing else,
    // since only Admin can assign tasks (no legacy "tasks I assigned" merge needed).
    const q=isAdmin
      ?C("tasks")
      :C("tasks").where("assignedTo","==",user.email);
    const u=q.onSnapshot(s=>{
      let all=s.docs.map(d=>({id:d.id,...d.data()}));
      all.sort((a,b)=>(b._createdAt?.seconds||0)-(a._createdAt?.seconds||0));
      setTasks(all);setLoading(false);
    },()=>setLoading(false));
    return u;
  },[]);

  const createTask=async()=>{
    if(!form.title.trim())return showToast("Task title required","error");
    if(!form.assignedTo)return showToast("Assign to someone","error");
    setSaving(true);
    try{
      const isRD=form.category==="R&D";
      const hasFormula=isRD&&form.formula?.name?.trim()&&form.formula?.ingredients?.some(r=>r.name.trim());
      const taskData={...form,status:"pending",assignedBy:user.email,assignedAt:today(),_createdAt:ts()};
      // Only store formula if R&D + has content
      if(!hasFormula)delete taskData.formula;
      const taskRef=await C("tasks").add(taskData);

      // If R&D task with formula → also create an R&D project entry
      if(hasFormula){
        const validIngredients=form.formula.ingredients.filter(r=>r.name.trim());
        await C("rd_projects").add({
          projectName:form.formula.name,
          paintType:form.formula.type,
          formulationType:"Task Formula",
          taskId:taskRef.id,
          taskTitle:form.title,
          assignedTo:form.assignedTo,
          ingredients:validIngredients,
          status:"Ongoing",
          createdBy:user.email,
          startDate:today(),
          notes:"Formula added via task: "+form.title,
          _createdAt:ts()
        });
      }

      // Notification
      if(form.assignedTo!==user.email){
        await C("notifications").add({
          assignedTo:form.assignedTo,
          title:(isRD?"🧪 R&D Task: ":"📋 New task: ")+form.title,
          message:"Assigned by "+(allProfiles[user.email]?.displayName||user.email)+(form.dueDate?" · Due: "+form.dueDate:"")+(hasFormula?" · Includes formula: "+form.formula.name:""),
          taskId:taskRef.id,type:"task_assigned",read:false,_createdAt:ts()
        });
      }
      showToast("Task assigned ✓"+(hasFormula?" · Formula saved to R&D":""));
      setShowCreate(false);setForm({...blankTask});
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const markComplete=async(task,notes)=>{
    setSaving(true);
    try{
      await C("tasks").doc(task.id).update({status:"completed",completedAt:today(),completionNotes:notes||"",completedBy:user.email});
      showToast("Task marked complete ✓");setCompleteTask(null);
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const deleteTask=async(id)=>{
    if(!confirm("Delete this task?"))return;
    await C("tasks").doc(id).delete();
    showToast("Deleted","error");
  };

  const PRIORITY_COLORS={High:"#ef4444",Normal:"#3b82f6",Low:"#22c55e"};
  const pending=tasks.filter(t=>t.status==="pending");
  const completed=tasks.filter(t=>t.status==="completed");
  const myPending=pending.filter(t=>t.assignedTo===user.email);

  return <div>
    <SectionHead title="✅ Tasks"/>
    <div style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"12px",flexWrap:"wrap"}}>
      {["pending","completed"].map(s=><button key={s} onClick={()=>setSubTab(s)} style={{background:subTab===s?"#1e293b":"transparent",border:"none",borderBottom:subTab===s?"2px solid #3b82f6":"2px solid transparent",color:subTab===s?"#f1f5f9":"#64748b",padding:"7px 16px",cursor:"pointer",fontSize:"13px",fontWeight:"600",borderRadius:"8px 8px 0 0"}}>
        {s==="pending"?"📋 Pending":"✅ Completed"}
        <span style={{fontSize:"11px",marginLeft:"5px",background:"#0b1220",padding:"1px 6px",borderRadius:"99px",color:"#475569"}}>{s==="pending"?pending.length:completed.length}</span>
      </button>)}
      {canAssign&&<Btn label="+ Assign Task" onClick={()=>{setForm({...blankTask});setShowCreate(true);}} color="#3b82f6" style={{marginLeft:"auto"}}/>}
    </div>

    {/* Create task form */}
    {showCreate&&canAssign&&<div style={{background:"#080d18",border:"1px solid #3b82f630",borderRadius:"12px",padding:"16px",marginBottom:"14px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"12px"}}>📋 Assign New Task</div>
      <Grid2>
        <Field label="Task Title *"><input style={inp} value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Check batch 0042 QC parameters"/></Field>
        <Field label="Assign To *">
          <select style={sl} value={form.assignedTo} onChange={e=>setForm({...form,assignedTo:e.target.value})}>
            {assignableUsers.map(e=><option key={e} value={e}>{allProfiles[e]?.displayName?`${allProfiles[e].displayName} (${e})`:e}</option>)}
          </select>
        </Field>
      </Grid2>
      <Field label="Description / Instructions"><textarea style={{...inp,minHeight:"70px",resize:"vertical"}} value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Detailed instructions (optional)"/></Field>
      <Grid2>
        <Field label="Due Date (optional)"><input type="date" style={inp} value={form.dueDate} onChange={e=>setForm({...form,dueDate:e.target.value})}/></Field>
        <Field label="Priority">
          <select style={sl} value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}>
            {["High","Normal","Low"].map(p=><option key={p}>{p}</option>)}
          </select>
        </Field>
      </Grid2>
      <Field label="Category">
        <div style={{display:"flex",gap:"8px"}}>
          {["General","R&D"].map(cat=><button key={cat} onClick={()=>setForm({...form,category:cat})} style={{background:form.category===cat?(cat==="R&D"?"#0d1f10":"#0f1d35"):"#0b1220",border:`1px solid ${form.category===cat?(cat==="R&D"?"#22c55e":"#3b82f6"):"#334155"}`,borderRadius:"7px",padding:"6px 16px",color:form.category===cat?(cat==="R&D"?"#86efac":"#93c5fd"):"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600"}}>
            {cat==="R&D"?"🧪 R&D":"📋 General"}
          </button>)}
        </div>
      </Field>

      {/* R&D Formula Editor — only shown when R&D category selected */}
      {form.category==="R&D"&&<div style={{background:"#060d0a",border:"1px solid #22c55e30",borderRadius:"10px",padding:"14px",marginTop:"2px",marginBottom:"4px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#86efac",marginBottom:"10px"}}>🧪 Formula (optional) — will be saved to R&D Projects</div>
        <Grid2>
          <Field label="Formula / Product Name"><input style={inp} value={form.formula?.name||""} onChange={e=>setForm({...form,formula:{...form.formula,name:e.target.value}})} placeholder="e.g. Trial Enamel White 01"/></Field>
          <Field label="Type">
            <select style={sl} value={form.formula?.type||"Paint"} onChange={e=>setForm({...form,formula:{...form.formula,type:e.target.value}})}>
              {["Paint","Thinner","Varnish","Primer","Putty","Other"].map(t=><option key={t}>{t}</option>)}
            </select>
          </Field>
        </Grid2>
        <div style={{border:"1px solid #1e3a2f",borderRadius:"8px",overflow:"hidden",marginBottom:"8px"}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 80px 80px 28px",background:"#0a1a0f",padding:"6px 10px",gap:"6px"}}>
            {["Ingredient / Raw Material","Qty","Unit",""].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
          </div>
          {(form.formula?.ingredients||[]).map((row,i)=><div key={row.id||i} style={{display:"grid",gridTemplateColumns:"2fr 80px 80px 28px",padding:"5px 10px",gap:"6px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
            <input style={sml} value={row.name} onChange={e=>{const arr=[...(form.formula.ingredients||[])];arr[i]={...arr[i],name:e.target.value};setForm({...form,formula:{...form.formula,ingredients:arr}});}} placeholder="e.g. TiO2, Linseed Oil"/>
            <input style={{...sml,textAlign:"center"}} type="number" min="0" step="0.01" value={row.qty} onChange={e=>{const arr=[...(form.formula.ingredients||[])];arr[i]={...arr[i],qty:e.target.value};setForm({...form,formula:{...form.formula,ingredients:arr}});}} placeholder="0"/>
            <input style={sml} value={row.unit} onChange={e=>{const arr=[...(form.formula.ingredients||[])];arr[i]={...arr[i],unit:e.target.value};setForm({...form,formula:{...form.formula,ingredients:arr}});}} placeholder="kg/L"/>
            <button onClick={()=>{const arr=(form.formula.ingredients||[]).filter((_,j)=>j!==i);setForm({...form,formula:{...form.formula,ingredients:arr.length?arr:[{id:newId(),name:"",qty:"",unit:""}]}});}} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
          </div>)}
        </div>
        <button onClick={()=>setForm({...form,formula:{...form.formula,ingredients:[...(form.formula.ingredients||[]),{id:newId(),name:"",qty:"",unit:""}]}})} style={{background:"none",border:"1px dashed #1e3a2f",borderRadius:"6px",padding:"4px 12px",color:"#4ade80",cursor:"pointer",fontSize:"12px"}}>+ Add Ingredient</button>
        {!(form.formula?.name?.trim())&&<div style={{fontSize:"10.5px",color:"#334155",marginTop:"6px",fontStyle:"italic"}}>Formula name required for it to be saved to R&D Projects.</div>}
      </div>}

      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowCreate(false)} outline color="#475569" small/>
        <Btn label={saving?"Saving…":"✓ Assign Task"} onClick={createTask} disabled={saving} color="#3b82f6" small/>
      </div>
    </div>}

    {loading&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading…</div>}

    {/* PENDING tab */}
    {subTab==="pending"&&!loading&&<div>
      {pending.length===0&&<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px"}}>✅</div><div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>No pending tasks</div></div>}
      {pending.map(task=>{
        const isOverdue=task.dueDate&&task.dueDate<today()&&task.status==="pending";
        const isMine=task.assignedTo===user.email;
        const assigneeName=allProfiles[task.assignedTo]?.displayName||task.assignedTo;
        const assignerName=allProfiles[task.assignedBy]?.displayName||task.assignedBy;
        const isCompletingThis=completeTask?.id===task.id;
        return <div key={task.id} style={{background:"#0f172a",border:`1px solid ${isOverdue?"#7f1d1d":isMine?"#1e3a5f":"#1e293b"}`,borderLeft:`3px solid ${PRIORITY_COLORS[task.priority]||"#3b82f6"}`,borderRadius:"10px",padding:"13px 16px",marginBottom:"8px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px",flexWrap:"wrap"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap",marginBottom:"4px"}}>
                <span style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9"}}>{task.title}</span>
                {task.category==="R&D"&&<Bdg label="🧪 R&D" color="#22c55e" small/>}
                <Bdg label={task.priority} color={PRIORITY_COLORS[task.priority]||"#3b82f6"} small/>
                {isOverdue&&<Bdg label="⚠️ Overdue" color="#ef4444" small/>}
                {isMine&&<Bdg label="👤 Assigned to you" color="#22c55e" small/>}
              </div>
              {task.description&&<div style={{fontSize:"12px",color:"#64748b",marginBottom:"4px"}}>{task.description}</div>}
              {task.formula?.name&&<div style={{fontSize:"11px",background:"#0a1a0f",border:"1px solid #22c55e20",borderRadius:"6px",padding:"5px 10px",marginBottom:"4px",color:"#86efac"}}>
                🧪 Formula: <strong>{task.formula.name}</strong> ({task.formula.type}) · {(task.formula.ingredients||[]).filter(r=>r.name).length} ingredients
              </div>}
              <div style={{fontSize:"11px",color:"#475569",display:"flex",gap:"12px",flexWrap:"wrap"}}>
                <span>📅 Assigned: {task.assignedAt}</span>
                {task.dueDate&&<span style={{color:isOverdue?"#ef4444":"#64748b"}}>⏰ Due: {task.dueDate}</span>}
                {canAssign&&<span>👤 To: {assigneeName}</span>}
                <span>Assigned by: {assignerName}</span>
              </div>
            </div>
            <div style={{display:"flex",gap:"6px",flexShrink:0}}>
              {isMine&&!isCompletingThis&&<Btn label="✅ Mark Complete" onClick={()=>setCompleteTask({id:task.id,notes:""})} color="#22c55e" small/>}
              {(isAdmin||task.assignedBy===user.email)&&<button onClick={()=>deleteTask(task.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"14px"}}>🗑</button>}
            </div>
          </div>
          {/* Completion form */}
          {isCompletingThis&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b"}}>
            <Field label="Completion Notes (optional)"><textarea style={{...inp,minHeight:"60px",resize:"vertical"}} value={completeTask.notes} onChange={e=>setCompleteTask({...completeTask,notes:e.target.value})} placeholder="What was done, any observations…"/></Field>
            <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
              <Btn label="Cancel" onClick={()=>setCompleteTask(null)} outline color="#475569" small/>
              <Btn label={saving?"Saving…":"✅ Confirm Complete"} onClick={()=>markComplete(task,completeTask.notes)} disabled={saving} color="#22c55e" small/>
            </div>
          </div>}
        </div>;
      })}
    </div>}

    {/* COMPLETED tab */}
    {subTab==="completed"&&!loading&&<div>
      {/* Sort & filter controls */}
      <div style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"10px",flexWrap:"wrap"}}>
        <span style={{fontSize:"12px",color:"#475569",fontWeight:"600"}}>Filter by user:</span>
        <select style={{...sl,width:"200px",fontSize:"12px",padding:"5px 8px"}} value={completedSortUser} onChange={e=>setCompletedSortUser(e.target.value)}>
          <option value="All">All Users</option>
          {[...new Set(completed.map(t=>t.assignedTo))].sort().map(e=><option key={e} value={e}>{allProfiles[e]?.displayName||e}</option>)}
        </select>
        <span style={{fontSize:"11px",color:"#334155",marginLeft:"4px"}}>
          {completed.filter(t=>completedSortUser==="All"||t.assignedTo===completedSortUser).length} tasks
        </span>
        <span style={{fontSize:"10px",color:"#334155",marginLeft:"auto",fontStyle:"italic"}}>
          ⏳ Completed tasks auto-delete after 60 days
        </span>
      </div>

      {completed.length===0&&<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px"}}>📋</div><div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>No completed tasks yet</div></div>}

      {/* Group by user if "All" selected */}
      {(completedSortUser==="All"
        ?[...new Set(completed.map(t=>t.assignedTo))].sort()
        :[completedSortUser]
      ).map(userEmail=>{
        const userTasks=completed.filter(t=>t.assignedTo===userEmail);
        if(!userTasks.length)return null;
        const userName=allProfiles[userEmail]?.displayName||userEmail;
        return <div key={userEmail} style={{marginBottom:"14px"}}>
          {completedSortUser==="All"&&<div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px",paddingBottom:"4px",borderBottom:"1px solid #1e293b"}}>
            👤 {userName} — {userTasks.length} task{userTasks.length!==1?"s":""}
          </div>}
          {userTasks.map(task=>{
            const isReassigningThis=reassignTask?.id===task.id;
            const daysSince=task.completedAt?Math.floor((new Date()-new Date(task.completedAt))/(86400000)):null;
            const daysLeft=daysSince!==null?60-daysSince:null;
            return <div key={task.id} style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:"3px solid #22c55e",borderRadius:"10px",padding:"12px 16px",marginBottom:"6px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px",flexWrap:"wrap"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:"13px",fontWeight:"700",color:"#94a3b8",marginBottom:"3px"}}>✅ {task.title}</div>
                  {task.completionNotes&&<div style={{fontSize:"12px",color:"#475569",marginBottom:"3px",fontStyle:"italic"}}>"{task.completionNotes}"</div>}
                  <div style={{fontSize:"11px",color:"#334155",display:"flex",gap:"10px",flexWrap:"wrap"}}>
                    <span>Assigned: {task.assignedAt}</span>
                    <span>Completed: {task.completedAt}</span>
                    {canAssign&&completedSortUser==="All"&&<span>By: {userName}</span>}
                    {daysLeft!==null&&daysLeft<=14&&<span style={{color:daysLeft<=3?"#ef4444":"#f59e0b"}}>🗑 Auto-deletes in {daysLeft}d</span>}
                  </div>
                </div>
                <div style={{display:"flex",gap:"6px",flexShrink:0}}>
                  {canAssign&&!isReassigningThis&&<Btn label="↩ Reassign" onClick={()=>setReassignTask({id:task.id,title:task.title,assignedTo:task.assignedTo})} color="#f59e0b" small outline/>}
                  {(isAdmin||task.assignedBy===user.email)&&<button onClick={()=>deleteTask(task.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"14px"}}>🗑</button>}
                </div>
              </div>
              {/* Reassign form */}
              {isReassigningThis&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b"}}>
                <div style={{fontSize:"12px",color:"#f59e0b",fontWeight:"600",marginBottom:"8px"}}>↩ Reassign Task — moves back to Pending</div>
                <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
                  <select style={{...sl,flex:1}} value={reassignTask.assignedTo} onChange={e=>setReassignTask({...reassignTask,assignedTo:e.target.value})}>
                    {assignableUsers.map(e=><option key={e} value={e}>{allProfiles[e]?.displayName?`${allProfiles[e].displayName} (${e})`:e}</option>)}
                  </select>
                  <Btn label={saving?"Saving…":"↩ Confirm Reassign"} onClick={reassign} disabled={saving} color="#f59e0b" small/>
                  <Btn label="Cancel" onClick={()=>setReassignTask(null)} outline color="#475569" small/>
                </div>
              </div>}
            </div>;
          })}
        </div>;
      })}
    </div>}
  </div>;
}

// STAINER PIGMENT CALCULATOR
// ══════════════════════════════════════════════════════════
function StainerCalc(){
  const [batchSize,setBatchSize]=useState("");
  const [origPigment,setOrigPigment]=useState("");
  const [targetPigment,setTargetPigment]=useState("");
  const [targetOverride,setTargetOverride]=useState(false); // true = user manually set different target
  const [stainers,setStainers]=useState([{id:"s1",name:"",amt:"",pigment:""}]);
  const [actualPigment,setActualPigment]=useState("");
  const [mode,setMode]=useState("forward");

  const addStainer=()=>setStainers(s=>[...s,{id:"s"+Date.now(),name:"",amt:"",pigment:""}]);
  const removeStainer=(id)=>setStainers(s=>s.filter(x=>x.id!==id));
  const updateStainer=(id,field,val)=>setStainers(s=>s.map(x=>x.id===id?{...x,[field]:val}:x));

  // Target defaults to = original pigment unless manually overridden
  const effectiveTarget=targetOverride?targetPigment:origPigment;

  const B=parseFloat(batchSize)||0;
  const P0=parseFloat(origPigment)||0;
  const Pt=parseFloat(effectiveTarget)||0;
  const Pact=parseFloat(actualPigment)||0;

  // Stainer totals
  const totalStainerVol=stainers.reduce((s,x)=>s+(parseFloat(x.amt)||0),0);
  const totalStainerPigMass=stainers.reduce((s,x)=>s+(parseFloat(x.amt)||0)*(parseFloat(x.pigment)||0)/100,0);

  // Original pigment mass = B × P0/100
  // Total pigment = B×P0/100 + Σ stainer pigment
  // Final batch (at Pt%) = Total pigment / (Pt/100) → floor to nearest 10L
  // Extra base = Final batch - B - Σ stainer vol
  const origPigMass=B*P0/100;
  const totalPigMass=origPigMass+totalStainerPigMass;
  const finalBatchRaw=Pt>0?totalPigMass/(Pt/100):0;
  const finalBatch=finalBatchRaw>0?Math.floor(finalBatchRaw/10)*10:0; // floor to nearest 10L
  const extraBase=Math.max(0,finalBatch-B-totalStainerVol);
  const currentPigPct=(B+totalStainerVol)>0?totalPigMass/(B+totalStainerVol)*100:0;
  const finalPct=finalBatch>0?(totalPigMass+extraBase*0)/finalBatch*100:0;

  // Reverse: floor to nearest 10L as well
  const revFinalBatchRaw=Pt>0&&Pact>0?B*Pact/100/(Pt/100):0;
  const revFinalBatch=revFinalBatchRaw>0?Math.floor(revFinalBatchRaw/10)*10:0;
  const revExtra=Math.max(0,revFinalBatch-B);

  const fL=(v)=>v>0?v.toFixed(2)+" L":"—";
  const fP=(v)=>v>0?v.toFixed(3)+"%":"—";
  const hasStainers=stainers.some(x=>parseFloat(x.amt)>0&&parseFloat(x.pigment)>0);
  const rowSt={display:"grid",gridTemplateColumns:"1fr 80px 90px 80px 28px",gap:"6px",alignItems:"center",padding:"7px 10px",borderTop:"1px solid #1e293b"};

  return <div>
    <SectionHead title="🎨 Stainer Pigment Calculator"/>
    <InfoBox color="#3b82f6">Enter original batch pigment% — target defaults to same. Stainer raises pigment%; calculator shows how much base to add. Final batch size rounded down to nearest 10L.</InfoBox>

    <div style={{display:"flex",gap:"8px",marginBottom:"16px"}}>
      {[["forward","📥 Stainer Added → Calc Extra Base"],["reverse","🔬 Actual Pigment% Measured → Calc Base"]].map(([m,l])=>
        <button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:"9px 14px",background:mode===m?"#0f1d35":"#080d18",border:`1px solid ${mode===m?"#3b82f6":"#1e293b"}`,borderRadius:"8px",color:mode===m?"#93c5fd":"#475569",cursor:"pointer",fontSize:"12px",fontWeight:mode===m?"700":"400"}}>
          {m==="forward"?"📥 Stainer Added → Calc Extra Base":"🔬 Actual Pigment% Measured → Calc Base"}
        </button>
      )}
    </div>

    <Grid2>
      <Field label="Original Batch Size (L)">
        <input style={inp} type="number" min="0" step="0.01" value={batchSize} onChange={e=>setBatchSize(e.target.value)} placeholder="e.g. 1000"/>
      </Field>
      <Field label="Original Pigment % (from BOM)">
        <input style={inp} type="number" min="0" max="100" step="0.001" value={origPigment}
          onChange={e=>{setOrigPigment(e.target.value);if(!targetOverride)setTargetPigment(e.target.value);}}
          placeholder="e.g. 15"/>
      </Field>
    </Grid2>
    {/* Target pigment — linked to orig by default, can be overridden */}
    <div style={{background:"#080d18",border:`1px solid ${targetOverride?"#f59e0b40":"#1e293b"}`,borderRadius:"8px",padding:"10px 12px",marginBottom:"12px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:targetOverride?"#f59e0b":"#64748b",textTransform:"uppercase",letterSpacing:"0.06em"}}>
          Target Pigment % {!targetOverride&&<span style={{fontWeight:"400",color:"#334155"}}>(= Original — linked)</span>}
        </div>
        <button onClick={()=>{setTargetOverride(v=>!v);if(targetOverride)setTargetPigment(origPigment);}}
