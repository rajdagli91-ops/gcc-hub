// FY ARCHIVE — Export & Delete Financial Year Data
// ══════════════════════════════════════════════════════════
function FYArchiveTab({showToast}){
  const curFY=getFY();
  const [selFY,setSelFY]=useState(String(curFY-1));
  const [counts,setCounts]=useState(null);
  const [loading,setLoading]=useState(false);
  const [exporting,setExporting]=useState(false);
  const [deleting,setDeleting]=useState(false);
  const [step,setStep]=useState("idle");

  const fyRange=(fy)=>{
    const fy_=parseInt(fy);
    return {from:`20${String(fy_-1).padStart(2,"0")}-04-01`, to:`20${String(fy_).padStart(2,"0")}-03-31`};
  };
  const inFY=(dateStr,fy)=>{if(!dateStr)return false;const {from,to}=fyRange(fy);return dateStr>=from&&dateStr<=to;};

  // ALWAYS derive FY from dateIssued — same logic as getBatchFY in MainApp
  const getBFY=(b)=>{
    if(b.dateIssued){const d=new Date(b.dateIssued);const y=d.getFullYear()%100;return String(d.getMonth()>=3?y+1:y);}
    if(b.fyYear)return String(b.fyYear);
    return String(curFY);
  };

  const loadCounts=async(fy)=>{
    setLoading(true);setCounts(null);
    try{
      const [bSnap,cSnap,osSnap,rdSnap,txSnap]=await Promise.all([
        C("batches").get(),
        C("complaints").get(),
        C("old_stock").get(),
        C("rd_projects").get(),
        C("rm_stock_transactions").get()
      ]);
      const {from,to}=fyRange(fy);
      const batches=bSnap.docs.filter(d=>getBFY(d.data())===fy);
      const complaints=cSnap.docs.filter(d=>inFY(d.data().dateCreated,fy));
      const oldStock=osSnap.docs.filter(d=>inFY(d.data().dateAdded,fy));
      const rdProjects=rdSnap.docs.filter(d=>inFY(d.data().startDate||d.data()._createdAt?.toDate?.()?.toISOString?.()?.slice(0,10),fy));
      const rmConsumption=txSnap.docs.filter(d=>{const dat=d.data();return dat.type==="consumption"&&inFY(dat.date,fy);});
      setCounts({
        batches:batches.length, complaints:complaints.length, oldStock:oldStock.length,
        rdProjects:rdProjects.length, rmConsumption:rmConsumption.length,
        batchIds:batches.map(d=>d.id), complaintIds:complaints.map(d=>d.id), oldStockIds:oldStock.map(d=>d.id),
        rmConsumptionIds:rmConsumption.map(d=>d.id),
        // R&D never deleted — no rdIds in delete
        batchDocs:batches.map(d=>({id:d.id,...d.data()})),
        complaintDocs:complaints.map(d=>({id:d.id,...d.data()})),
        oldStockDocs:oldStock.map(d=>({id:d.id,...d.data()})),
        rdDocs:rdProjects.map(d=>({id:d.id,...d.data()})),
        rmConsumptionDocs:rmConsumption.map(d=>({id:d.id,...d.data()}))
      });
    }catch(e){showToast("Error loading: "+e.message,"error");}
    setLoading(false);
  };

  useEffect(()=>{loadCounts(selFY);},[selFY]);

  const exportFY=async()=>{
    if(!counts||!window.XLSX){showToast("Excel library not ready","error");return;}
    setExporting(true);
    try{
      const XLSX=window.XLSX;
      const wb=XLSX.utils.book_new();
      const fy=parseInt(selFY);
      const label=getFYLabel(fy);

      // ── Summary ──
      const sumRows=[
        [`GCC Operations Hub — FY ${label} Archive`],[`Exported: ${new Date().toLocaleDateString("en-IN")}`],[""],
        ["Data Type","Count","Action on Archive"],
        ["Batches",counts.batches,"Deleted after export"],
        ["Complaints",counts.complaints,"Deleted after export"],
        ["Old/Rejected Stock",counts.oldStock,"Deleted after export"],
        ["R&D Projects",counts.rdProjects,"Exported only — NOT deleted"],
        ["RM Consumption Transactions",counts.rmConsumption,"Deleted after export"],
      ];
      const wsSum=XLSX.utils.aoa_to_sheet(sumRows);wsSum["!cols"]=[{wch:36},{wch:10},{wch:30}];
      XLSX.utils.book_append_sheet(wb,wsSum,"Summary");

      // ── Batches ──
      const bRows=[["Batch No","FY","Category","Product","Shade","Batch Size","Unit","Status","Date Issued","Issued By","Actual Qty","QC Result","QC By","QC Date","Packed Qty","Packed By"]];
      counts.batchDocs.forEach(b=>{bRows.push([b.batchNo,getFYLabel(parseInt(getBFY(b))),b.category||"",b.productName||"",b.shade||"",b.batchSize||"",b.unit||"",b.status||"",b.dateIssued||"",b.issuedBy||"",b.production?.actualQty||"",b.qc?.result||"",b.qc?.qcBy||"",b.qc?.qcDate||"",b.packing?.totalQty||"",b.packing?.packedBy||""]);});
      const wsBatch=XLSX.utils.aoa_to_sheet(bRows);wsBatch["!cols"]=[{wch:12},{wch:10},{wch:16},{wch:30},{wch:16},{wch:10},{wch:8},{wch:14},{wch:14},{wch:24},{wch:12},{wch:10},{wch:20},{wch:12},{wch:12},{wch:20}];
      XLSX.utils.book_append_sheet(wb,wsBatch,"Batches");

      // ── Complaints ──
      const cRows=[["Customer","Product","Batch No","Date Raised","Status","QC Response","Days to Respond","Added By"]];
      counts.complaintDocs.forEach(c=>{const qcR=c.qcResponses?.[0];const days=qcR?.responseDate?(new Date(qcR.responseDate)-new Date(c.dateCreated||""))/(86400000):null;cRows.push([c.customerName||"",c.productName||"",c.batchNo||"",c.dateCreated||"",c.status||"",qcR?.findings||qcR?.action||"",days!==null?Math.round(days):"",c.addedBy||""]);});
      const wsComp=XLSX.utils.aoa_to_sheet(cRows);wsComp["!cols"]=[{wch:24},{wch:28},{wch:12},{wch:14},{wch:16},{wch:40},{wch:14},{wch:28}];
      XLSX.utils.book_append_sheet(wb,wsComp,"Complaints");

      // ── Old Stock ──
      const osRows=[["Product","Category","Qty","Unit","Status","Batch Ref","Date Added","Notes"]];
      counts.oldStockDocs.forEach(s=>{osRows.push([s.productName||"",s.category||"",s.qty||"",s.unit||"",s.status||"",s.batchRef||"",s.dateAdded||"",s.notes||""]);});
      const wsOS=XLSX.utils.aoa_to_sheet(osRows);wsOS["!cols"]=[{wch:28},{wch:16},{wch:10},{wch:8},{wch:12},{wch:14},{wch:14},{wch:40}];
      XLSX.utils.book_append_sheet(wb,wsOS,"Old Stock");

      // ── R&D Projects (full details) ──
      const rdRows=[["Project Name","Category","Paint Type","Status","Start Date","End Date","Created By","Trials Count","Notes"]];
      counts.rdDocs.forEach(p=>{rdRows.push([p.name||p.productName||"",p.category||"",p.paintType||"",p.status||"",p.startDate||"",p.endDate||"",p.createdBy||"",(p.trials||[]).length,p.notes||"",]);});
      const wsRD=XLSX.utils.aoa_to_sheet(rdRows);wsRD["!cols"]=[{wch:32},{wch:16},{wch:16},{wch:14},{wch:14},{wch:14},{wch:24},{wch:12},{wch:40}];
      XLSX.utils.book_append_sheet(wb,wsRD,"R&D Projects");

      // ── RM Consumption ──
      const rmRows=[["Date","Material","Unit","Qty Consumed","Stock After","Added By","Notes"]];
      counts.rmConsumptionDocs.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(t=>{rmRows.push([t.date||"",t.materialName||"",t.unit||"",t.qty||"",t.stockAfter||"",t.addedBy||"",t.notes||""]);});
      const wsRM=XLSX.utils.aoa_to_sheet(rmRows);wsRM["!cols"]=[{wch:14},{wch:28},{wch:8},{wch:12},{wch:12},{wch:24},{wch:32}];
      XLSX.utils.book_append_sheet(wb,wsRM,"RM Consumption");

      XLSX.writeFile(wb,`GCC_FY_${label.replace("-","_")}_Archive.xlsx`);
      showToast(`FY ${label} archive exported ✓ — ${counts.rdProjects} R&D projects included (not deleted)`);
    }catch(e){showToast("Export failed: "+e.message,"error");}
    setExporting(false);
  };

  const deleteFY=async()=>{
    if(!counts)return;
    setDeleting(true);
    try{
      const deleteAll=async(ids,col)=>{
        for(let i=0;i<ids.length;i+=20){
          const wb_=db.batch();
          ids.slice(i,i+20).forEach(id=>wb_.delete(db.collection(col).doc(id)));
          await wb_.commit();
        }
      };
      // R&D projects are NEVER deleted
      await Promise.all([
        deleteAll(counts.batchIds,"batches"),
        deleteAll(counts.complaintIds,"complaints"),
        deleteAll(counts.oldStockIds,"old_stock"),
        deleteAll(counts.rmConsumptionIds,"rm_stock_transactions"),
      ]);
      showToast(`FY ${getFYLabel(parseInt(selFY))} data deleted ✓ (R&D projects kept)`);
      setStep("done");loadCounts(selFY);
    }catch(e){showToast("Delete failed: "+e.message,"error");}
    setDeleting(false);
  };

  const fy_=parseInt(selFY);
  const label=getFYLabel(fy_);
  const isPrevFY=fy_<curFY;
  const totalCount=(counts?.batches||0)+(counts?.complaints||0)+(counts?.oldStock||0)+(counts?.rmConsumption||0);

  return <div>
    <InfoBox color="#f59e0b">⚠️ Archive completed financial years. R&D projects are NEVER deleted. Current FY: <strong style={{color:"#fcd34d"}}>FY {getFYLabel(curFY)}</strong></InfoBox>

    <div style={{display:"flex",gap:"12px",alignItems:"flex-end",flexWrap:"wrap",marginBottom:"16px"}}>
      <Field label="Select Financial Year">
        <select style={{...sl,width:"160px"}} value={selFY} onChange={e=>{setSelFY(e.target.value);setStep("idle");}}>
          {Array.from({length:5},(_,i)=>curFY-1-i).map(fy=><option key={fy} value={String(fy)}>FY {getFYLabel(fy)} {fy<curFY?"(Completed)":"(Current)"}</option>)}
        </select>
      </Field>
      {!isPrevFY&&<InfoBox color="#ef4444">Current FY cannot be archived.</InfoBox>}
    </div>

    {loading&&<div style={{fontSize:"13px",color:"#475569",padding:"10px 0"}}>⏳ Loading data counts…</div>}
    {counts&&isPrevFY&&step!=="done"&&<>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:"10px",marginBottom:"16px"}}>
        {[["📦 Batches",counts.batches,"#3b82f6","Deleted"],["⚠️ Complaints",counts.complaints,"#ef4444","Deleted"],["🔄 Old Stock",counts.oldStock,"#f59e0b","Deleted"],["🧪 R&D Projects",counts.rdProjects,"#22c55e","Kept ✓"],["📉 RM Consumption",counts.rmConsumption,"#a855f7","Deleted"]].map(([lbl,count,color,action])=>(
          <div key={lbl} style={{background:"#0b1220",border:`1px solid ${color}30`,borderRadius:"10px",padding:"12px 14px",textAlign:"center"}}>
            <div style={{fontSize:"22px",fontWeight:"700",color}}>{count}</div>
            <div style={{fontSize:"11px",color:"#64748b",marginTop:"2px"}}>{lbl}</div>
            <div style={{fontSize:"9px",color:action==="Kept ✓"?"#22c55e":"#475569",marginTop:"2px",fontWeight:"600"}}>{action}</div>
          </div>
        ))}
      </div>

      <div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"10px",padding:"16px",marginBottom:"12px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#22c55e",marginBottom:"6px"}}>Step 1: Export FY {label} Data</div>
        <div style={{fontSize:"12px",color:"#86efac",marginBottom:"12px"}}>Downloads Batches, Complaints, Old Stock, R&D Projects and RM Consumption as separate Excel sheets. R&D projects are exported but <strong>never deleted</strong> from the system.</div>
        <Btn label={exporting?"Exporting…":`📥 Download FY ${label} Archive (Excel)`} onClick={exportFY} disabled={exporting||totalCount+counts.rdProjects===0} color="#22c55e"/>
        {totalCount+counts.rdProjects===0&&<div style={{fontSize:"12px",color:"#334155",marginTop:"6px"}}>No data found for FY {label}.</div>}
      </div>

      {totalCount>0&&<div style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"10px",padding:"16px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#ef4444",marginBottom:"6px"}}>Step 2: Delete FY {label} Data</div>
        <div style={{fontSize:"12px",color:"#fca5a5",marginBottom:"12px"}}>Permanently deletes {counts.batches} batches, {counts.complaints} complaints, {counts.oldStock} old stock, {counts.rmConsumption} RM consumption records. <strong>R&D projects ({counts.rdProjects}) are NOT deleted.</strong></div>
        {step==="idle"&&<Btn label={`🗑 Delete FY ${label} Data (excl. R&D)`} onClick={()=>setStep("confirm")} color="#ef4444" outline/>}
        {step==="confirm"&&<div>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#ef4444",marginBottom:"10px"}}>⚠️ Type the FY label to confirm deletion:</div>
          <ConfirmDelete expected={label} onConfirm={deleteFY} onCancel={()=>setStep("idle")} saving={deleting}/>
        </div>}
      </div>}
    </>}
    {step==="done"&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"10px",padding:"20px",textAlign:"center"}}>
      <div style={{fontSize:"24px",marginBottom:"8px"}}>✅</div>
      <div style={{fontSize:"14px",fontWeight:"700",color:"#22c55e"}}>FY {label} data deleted successfully.</div>
      <div style={{fontSize:"12px",color:"#86efac",marginTop:"4px"}}>The app is now clean for FY {getFYLabel(curFY)}.</div>
    </div>}
  </div>;
}

// Type-to-confirm delete component
function ConfirmDelete({expected,onConfirm,onCancel,saving}){
  const [val,setVal]=useState("");
  return <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
    <input style={{...inp,maxWidth:"160px",borderColor:val===expected?"#ef4444":"#1e293b"}} value={val} onChange={e=>setVal(e.target.value)} placeholder={`Type: ${expected}`}/>
    <Btn label={saving?"Deleting…":`Yes, Delete FY ${expected}`} onClick={onConfirm} disabled={val!==expected||saving} color="#ef4444" small/>
    <Btn label="Cancel" onClick={onCancel} outline color="#475569" small/>
  </div>;
}

function SettingsTab({showToast, initialProducts, initialQcParams, initialPackSizes, initialCatUnits, initialUnits, initialPaintTypes, initialRmCats, onSaved, onDirtyChange, roles=[]}){
  const isAdmin=(roles||[]).includes("admin");
  const isIssuer=(roles||[]).includes("issuer");
  const isQC=(roles||[]).includes("qc");

  // Define which sub-tabs each role can access
  const allSubTabs=[
    ["products","🎨 Products",       isAdmin||isIssuer],
    ["qcparams","🔬 QC Parameters",  isAdmin],
    ["packsizes","📦 Pack Sizes",    isAdmin||isIssuer],
    ["units","📏 Units",             isAdmin],
    ["painttypes","🖌 Paint Types",  isAdmin||isQC],
    ["rmcats","🧫 RM Categories",    isAdmin],
    ["fyarchive","📁 FY Archive",    isAdmin],
  ].filter(([,,allowed])=>allowed);
  const [subTab,setSubTab]=useState(()=>allSubTabs[0]?.[0]||"products");
  const [saving,setSaving]=useState(false);
  const [isDirty,setIsDirty]=useState(false);
  const [pendingSubTab,setPendingSubTab]=useState(null); // sub-tab waiting for confirm
  const [prodData,setProdData]=useState(()=>{
    const p=JSON.parse(JSON.stringify(initialProducts||DEFAULT_PRODUCTS));
    Object.keys(p).forEach(cat=>{if(Array.isArray(p[cat]))p[cat].sort((a,b)=>(a.name||a).localeCompare(b.name||b));});
    return p;
  });
  const [qcData,setQcData]=useState(()=>JSON.parse(JSON.stringify(initialQcParams||DEFAULT_QC_PARAMS)));
  const [packSizeData,setPackSizeData]=useState(()=>JSON.parse(JSON.stringify(initialPackSizes||DEFAULT_PACK_SIZES_BY_CAT)));
  const [catUnits,setCatUnits]=useState(()=>({...CATEGORY_UNITS,...(initialCatUnits||{})}));
  const [unitsData,setUnitsData]=useState(()=>[...(initialUnits||BATCH_UNITS)].sort((a,b)=>a.localeCompare(b)));
  const [paintTypesData,setPaintTypesData]=useState(()=>[...(initialPaintTypes||PAINT_TYPES)].sort((a,b)=>a.localeCompare(b)));
  const [rmCatsData,setRmCatsData]=useState(()=>[...(initialRmCats||RM_CATEGORIES)].sort((a,b)=>a.localeCompare(b)));

  // Dirty-aware setters — mark changed whenever any data is modified
  const markDirty=()=>{setIsDirty(true);if(onDirtyChange)onDirtyChange(true);};
  const dpd=(v)=>{setProdData(v);markDirty();};
  const dqd=(v)=>{setQcData(v);markDirty();};
  const dpkd=(v)=>{setPackSizeData(v);markDirty();};
  const dcu=(v)=>{setCatUnits(v);markDirty();};
  const dud=(v)=>{setUnitsData(v);markDirty();};
  const dptd=(v)=>{setPaintTypesData(v);markDirty();};
  const drcd=(v)=>{setRmCatsData(v);markDirty();};

  // Intercept sub-tab switch — warn if dirty
  const trySetSubTab=(key)=>{
    if(isDirty){setPendingSubTab(key);}
    else{setSubTab(key);}
  };

  const discardAndSwitch=(key)=>{
    // Reset all data to current saved state (re-initialize from props)
    setProdData(JSON.parse(JSON.stringify(initialProducts||DEFAULT_PRODUCTS)));
    setQcData(JSON.parse(JSON.stringify(initialQcParams||DEFAULT_QC_PARAMS)));
    setPackSizeData(JSON.parse(JSON.stringify(initialPackSizes||DEFAULT_PACK_SIZES_BY_CAT)));
    setCatUnits({...CATEGORY_UNITS,...(initialCatUnits||{})});
    setUnitsData([...(initialUnits||BATCH_UNITS)]);
    setPaintTypesData([...(initialPaintTypes||PAINT_TYPES)]);
    setRmCatsData([...(initialRmCats||RM_CATEGORIES)]);
    setIsDirty(false);if(onDirtyChange)onDirtyChange(false);
    setPendingSubTab(null);
    setSubTab(key);
  };
  const [newUnit,setNewUnit]=useState("");
  const [newPaintType,setNewPaintType]=useState("");
  const [newRmCat,setNewRmCat]=useState("");
  const [newPackSize,setNewPackSize]=useState("");
  const [newPackQty,setNewPackQty]=useState("");
  const [selCat,setSelCat]=useState(Object.keys(initialProducts||DEFAULT_PRODUCTS)[0]);
  const [newProduct,setNewProduct]=useState("");
  const [newProductUnit,setNewProductUnit]=useState("L");
  const [newParam,setNewParam]=useState("");
  const [newCat,setNewCat]=useState("");
  const [newCatUnit,setNewCatUnit]=useState("L");

  const fileRef = useRef(null);
  const [importing,setImporting]=useState(false);
  const [exporting,setExporting]=useState(false);

  const exportExcel=async()=>{
    setExporting(true);
    try{
      const XLSX=window.XLSX;
      if(!XLSX){showToast("Excel library not loaded yet, try again","error");setExporting(false);return;}
      const wb=XLSX.utils.book_new();
      const cats=Object.keys(prodData).sort((a,b)=>a.localeCompare(b));

      // ── Products sheet ──────────────────────────────
      const prodRows=[["CATEGORY","PRODUCT NAME","UNIT","HINT"]];
      cats.forEach(cat=>{
        (prodData[cat]||[]).forEach((p,i)=>{
          const name=gpn(p); const unit=gpu(p);
          prodRows.push([cat,name,unit,i===0?"← edit rows freely":""]);
        });
        prodRows.push(["","","",""]);// spacer
      });
      for(let i=0;i<5;i++)prodRows.push(["← Category","← Product name","← kg or L","← new"]);
      const wsProd=XLSX.utils.aoa_to_sheet(prodRows);
      wsProd["!cols"]=[{wch:26},{wch:44},{wch:10},{wch:18}];
      XLSX.utils.book_append_sheet(wb,wsProd,"🎨 Products");

      // ── QC Parameters sheet ─────────────────────────
      const qcRows=[["CATEGORY","QC PARAMETER","UNIT","MIN VALUE","MAX VALUE","HINT"]];
      cats.forEach(cat=>{
        (qcData[cat]||[]).forEach((p,i)=>{
          const parsed=typeof p==="string"?{name:p,unit:"",min:"",max:""}:p;
          qcRows.push([cat,parsed.name||"",parsed.unit||"",parsed.min||"",parsed.max||"",i===0?"← edit freely":""]);
        });
        qcRows.push(["","","","","",""]); // spacer
      });
      for(let i=0;i<5;i++)qcRows.push(["← Category","← Parameter name","← Unit e.g. KU","← Min","← Max","← add"]);
      const wsQC=XLSX.utils.aoa_to_sheet(qcRows);
      wsQC["!cols"]=[{wch:26},{wch:36},{wch:14},{wch:12},{wch:12},{wch:16}];
      XLSX.utils.book_append_sheet(wb,wsQC,"🔬 QC Parameters");

      // ── Units sheet ─────────────────────────────────
      const unitRows=[["CATEGORY","DEFAULT UNIT","ALLOWED UNITS"],["","","kg / L / MT / Bags"]];
      cats.forEach(cat=>{
        unitRows.push([cat,catUnits[cat]||"kg",""]);
      });
      const wsUnits=XLSX.utils.aoa_to_sheet(unitRows);
      wsUnits["!cols"]=[{wch:26},{wch:18},{wch:24}];
      XLSX.utils.book_append_sheet(wb,wsUnits,"⚖️ Category Units");

      // ── Remove Categories sheet ─────────────────────
      const remRows=[["CATEGORY NAME","REMOVE? (YES to delete)","NOTE"],
                     ["","","Leave blank to keep | Type YES to remove from Products & QC"]];
      cats.forEach(cat=>remRows.push([cat,"",""]));
      const wsRem=XLSX.utils.aoa_to_sheet(remRows);
      wsRem["!cols"]=[{wch:26},{wch:24},{wch:50}];
      XLSX.utils.book_append_sheet(wb,wsRem,"🗑 Remove Categories");

      // ── Pack Sizes sheet ────────────────────────────
      const packRows=[["CATEGORY","PACK SIZE LABEL","QTY PER PACK","HINT"]];
      const packCats=Object.keys(packSizeData).filter(k=>k!=="Other"&&k!=="_default");
      packCats.forEach(cat=>{
        (packSizeData[cat]||[]).forEach((ps,i)=>{
          const s=gps(ps);
          packRows.push([cat,s.size,s.qty||"",i===0?"← edit qty, add/delete rows":""]);
        });
        packRows.push(["","","",""]);
      });
      // Default sizes
      packRows.push(["_default (fallback for all categories)","","",""]);
      (packSizeData._default||DEFAULT_PACK_SIZES).forEach(ps=>{
        const s=gps(ps);
        packRows.push(["_default",s.size,s.qty||",",""]);
      });
      for(let i=0;i<3;i++)packRows.push(["← category","← label e.g. 4 L tin","← qty e.g. 4",""]);
      const wsPack=XLSX.utils.aoa_to_sheet(packRows);
      wsPack["!cols"]=[{wch:32},{wch:22},{wch:16},{wch:22}];
      XLSX.utils.book_append_sheet(wb,wsPack,"📦 Pack Sizes");
      const instrRows=[
        ["GCC Operations Hub — Products & QC Parameters Template"],
        ["Gujarat Colours & Coatings Pvt Ltd | Exported: "+new Date().toLocaleDateString("en-IN")],
        [""],
        ["SHEET","WHAT TO DO"],
        ["🎨 Products","Col A = Category, Col B = Product Name, Col C = Unit (kg/L/MT/Bags)."],
        ["🔬 QC Parameters","Col A = Category, Col B = Parameter, Col C = Min, Col D = Max."],
        ["📦 Pack Sizes","Col A = Category, Col B = Pack Size Label, Col C = Qty per Pack. This pre-fills the packing form."],
        ["⚖️ Category Units","Fallback unit per category."],
        ["🗑 Remove Categories","Type YES in column B to remove a category from Products & QC."],
        [""],
        ["RULES",""],
        ["• Do NOT rename the sheet tabs.",""],
        ["• Category names must match exactly across all sheets.",""],
        ["• For Unit column: only kg, L, MT, Bags are valid.",""],
      ];
      const wsInstr=XLSX.utils.aoa_to_sheet(instrRows);
      wsInstr["!cols"]=[{wch:36},{wch:60}];
      XLSX.utils.book_append_sheet(wb,wsInstr,"📋 Instructions");

      XLSX.writeFile(wb,"GCC_Products_QC_Template.xlsx");
      showToast("Excel exported ✓");
    }catch(err){showToast("Error exporting: "+err.message,"error");}
    setExporting(false);
  };

  const importExcel=async(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    setImporting(true);
    try{
      const XLSX=window.XLSX;
      if(!XLSX){showToast("Excel reader not loaded yet, try again","error");setImporting(false);return;}
      const buf=await file.arrayBuffer();
      const wb_=XLSX.read(buf,{type:"array"});

      // ── Step 1: Collect categories to remove ──────────────
      const toRemove=new Set();
      const remSheet=wb_.Sheets["🗑 Remove Categories"];
      if(remSheet){
        const rows=XLSX.utils.sheet_to_json(remSheet,{header:1,defval:""});
        for(let ri=5;ri<rows.length;ri++){
          const cat=(rows[ri][0]||"").toString().trim();
          const flag=(rows[ri][1]||"").toString().trim().toUpperCase();
          if(cat&&(flag==="YES"||flag==="Y"||flag==="✓"))toRemove.add(cat);
        }
      }

      // ── Step 2: Read Products (A=Category, B=Product, C=Unit) ──
      const newProds={};
      const prodSheet=wb_.Sheets["🎨 Products"];
      if(prodSheet){
        const rows=XLSX.utils.sheet_to_json(prodSheet,{header:1,defval:""});
        for(let ri=1;ri<rows.length;ri++){
          const cat=(rows[ri][0]||"").toString().trim();
          const prod=(rows[ri][1]||"").toString().trim();
          const unit=(rows[ri][2]||"").toString().trim()||"kg";
          if(!cat||!prod)continue;
          if(cat.startsWith("←")||prod.startsWith("←"))continue;
          if(toRemove.has(cat))continue;
          if(!newProds[cat])newProds[cat]=[];
          // Store as {name,unit} object
          if(!newProds[cat].some(p=>gpn(p)===prod))
            newProds[cat].push({name:prod,unit:["kg","L","MT","Bags"].includes(unit)?unit:"kg"});
        }
      }

      // ── Step 3: Read QC Params (2-column or 4-column: A=Category, B=Param, C=Min, D=Max) ──
      const newQc={};
      const qcSheet=wb_.Sheets["🔬 QC Parameters"];
      if(qcSheet){
        const rows=XLSX.utils.sheet_to_json(qcSheet,{header:1,defval:""});
        for(let ri=1;ri<rows.length;ri++){
          const cat=(rows[ri][0]||"").toString().trim();
          const param=(rows[ri][1]||"").toString().trim();
          if(!cat||!param)continue;
          if(cat.startsWith("←")||param.startsWith("←"))continue;
          if(toRemove.has(cat))continue;
          if(!newQc[cat])newQc[cat]=[];
          const min=(rows[ri][3]||"").toString().trim();
          const max=(rows[ri][4]||"").toString().trim();
          const unit=(rows[ri][2]||"").toString().trim();
          if(!newQc[cat].some(x=>(typeof x==="object"?x.name:x)===param))
            newQc[cat].push({name:param,unit,min,max});
        }
      }

      // ── Step 4: Read Units sheet ──────────────────────────
      const newUnits={};
      const unitsSheet=wb_.Sheets["⚖️ Category Units"];
      if(unitsSheet){
        const rows=XLSX.utils.sheet_to_json(unitsSheet,{header:1,defval:""});
        for(let ri=2;ri<rows.length;ri++){
          const cat=(rows[ri][0]||"").toString().trim();
          const unit=(rows[ri][1]||"").toString().trim();
          if(cat&&unit&&!toRemove.has(cat))newUnits[cat]=unit;
        }
      }

      // ── Step 5: Read Pack Sizes sheet ─────────────────
      const packSheet=wb_.Sheets["📦 Pack Sizes"];
      if(packSheet){
        const rows=XLSX.utils.sheet_to_json(packSheet,{header:1,defval:""});
        const newPack={};
        for(let ri=1;ri<rows.length;ri++){
          const cat=(rows[ri][0]||"").toString().trim();
          const size=(rows[ri][1]||"").toString().trim();
          const qty=(rows[ri][2]||"").toString().trim();
          if(!cat||!size||cat.startsWith("←"))continue;
          if(!newPack[cat])newPack[cat]=[];
          newPack[cat].push({size,qty});
        }
        if(Object.keys(newPack).length>0)dpkd(p=>({...p,...newPack}));
      }

      if(Object.keys(newProds).length>0)dpd(newProds);
      if(Object.keys(newQc).length>0)dqd(newQc);
      if(Object.keys(newUnits).length>0)dcu(u=>({...u,...newUnits}));

      const removedList=[...toRemove].join(", ");
      const msg=toRemove.size>0
        ?`Imported ✓ — ${Object.keys(newProds).length} categories loaded, ${toRemove.size} removed (${removedList}). Click 💾 Save All Settings.`
        :`Imported ✓ — ${Object.keys(newProds).length} categories, ${Object.values(newProds).reduce((s,a)=>s+a.length,0)} products loaded. Click 💾 Save All Settings.`;
      showToast(msg);
    }catch(err){showToast("Error reading file: "+err.message,"error");}
    setImporting(false);
    e.target.value="";
  };

  useEffect(()=>{
    // Load SheetJS if not already loaded
    if(!window.XLSX){
      const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      document.head.appendChild(s);
    }
  },[]);

  const saveAll=async()=>{
    setSaving(true);
    try{
      await C("settings").doc("products").set({products:prodData,qcParams:qcData,packSizes:packSizeData,catUnits,units:unitsData,paintTypes:paintTypesData,rmCategories:rmCatsData,updatedAt:ts()});
      if(onSaved)onSaved({products:prodData,qcParams:qcData,packSizes:packSizeData,catUnits,units:unitsData,paintTypes:paintTypesData,rmCategories:rmCatsData});
      setIsDirty(false);if(onDirtyChange)onDirtyChange(false);
      if(pendingSubTab){setSubTab(pendingSubTab);setPendingSubTab(null);}
      showToast("Settings saved ✓");
    }catch(e){showToast("Error saving","error");}
    setSaving(false);
  };

  const addProduct=()=>{
    if(!newProduct.trim())return;
    const existing=prodData[selCat]||[];const sorted=[...existing,{name:newProduct.trim(),unit:newProductUnit}].sort((a,b)=>(a.name||a).localeCompare(b.name||b));dpd({...prodData,[selCat]:sorted});setNewProduct("");setNewProductUnit("L");
  };
  const removeProduct=(cat,idx)=>{const arr=[...(prodData[cat]||[])];arr.splice(idx,1);dpd({...prodData,[cat]:arr});};
  const addParam=()=>{
    if(!newParam.trim())return;
    const existingP=qcData[selCat]||[];const sortedP=[...existingP,newParam.trim()].sort((a,b)=>(a.name||a).localeCompare(b.name||b));dqd({...qcData,[selCat]:sortedP});setNewParam("");
  };
  const removeParam=(cat,idx)=>{const arr=[...(qcData[cat]||[])];arr.splice(idx,1);dqd({...qcData,[cat]:arr});};
  const addCategory=()=>{
    if(!newCat.trim())return;
    const catName=newCat.trim();
    if(!prodData[catName]){
      dpd({...prodData,[catName]:[]});
      dqd({...qcData,[catName]:[]});
      dcu({...catUnits,[catName]:newCatUnit});
      setSelCat(catName);
    }
    setNewCat("");setNewCatUnit("L");
  };

  const cats=Object.keys(prodData).sort((a,b)=>a.localeCompare(b));

  return <div>
    <SectionHead title="⚙️ System Settings"/>

    {/* Unsaved changes warning banner */}
    {isDirty&&<div style={{background:"#422006",border:"1px solid #f59e0b",borderRadius:"8px",padding:"10px 16px",marginBottom:"12px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"10px",flexWrap:"wrap"}}>
      <span style={{fontSize:"13px",fontWeight:"600",color:"#f59e0b"}}>⚠️ You have unsaved changes</span>
      <div style={{display:"flex",gap:"8px"}}>
        <Btn label={saving?"Saving…":"💾 Save Now"} onClick={saveAll} disabled={saving} color="#f59e0b" small/>
        <Btn label="Discard" onClick={()=>discardAndSwitch(subTab)} outline color="#475569" small/>
      </div>
    </div>}

    {/* Sub-tab switch confirmation dialog */}
    {pendingSubTab&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:3000,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#0f1729",border:"1px solid #f59e0b",borderRadius:"14px",padding:"28px 32px",maxWidth:"380px",width:"90%",boxShadow:"0 20px 60px rgba(0,0,0,0.6)"}}>
        <div style={{fontSize:"20px",marginBottom:"8px"}}>⚠️</div>
        <div style={{fontSize:"15px",fontWeight:"700",color:"#f1f5f9",marginBottom:"8px"}}>Unsaved Changes</div>
        <div style={{fontSize:"13px",color:"#94a3b8",marginBottom:"20px",lineHeight:1.5}}>
          You have changes in Settings that haven't been saved yet.<br/>What would you like to do?
        </div>
        <div style={{display:"flex",gap:"10px",flexDirection:"column"}}>
          <Btn label={saving?"Saving…":"💾 Save & Switch Tab"} onClick={saveAll} disabled={saving} color="#22c55e"/>
          <Btn label="Discard Changes & Switch" onClick={()=>discardAndSwitch(pendingSubTab)} outline color="#ef4444"/>
          <Btn label="Cancel — Stay Here" onClick={()=>setPendingSubTab(null)} outline color="#475569"/>
        </div>
      </div>
    </div>}
    <div style={{display:"flex",gap:"4px",marginBottom:"20px",borderBottom:"1px solid #1e293b"}}>
      {allSubTabs.map(([key,label])=>(
        <button key={key} onClick={()=>trySetSubTab(key)} style={{background:subTab===key?"#1e293b":"transparent",border:"none",borderBottom:subTab===key?"2px solid #3b82f6":"2px solid transparent",color:subTab===key?"#f1f5f9":"#64748b",padding:"8px 16px",cursor:"pointer",fontSize:"13px",fontWeight:"600",borderRadius:"8px 8px 0 0",transition:"all 0.15s"}}>{label}</button>
      ))}
    </div>

    {/* Category selector — shared across all sub-tabs */}
    <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"10px",padding:"12px 16px",marginBottom:"16px"}}>
      <div style={{display:"flex",gap:"10px",alignItems:"flex-end",flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:"160px"}}>
          <Field label="Working Category">
            <select style={sl} value={selCat} onChange={e=>setSelCat(e.target.value)}>
              {cats.map(c=><option key={c}>{c}</option>)}
            </select>
          </Field>
        </div>
        <div style={{minWidth:"130px"}}>
          <Field label="Default Unit">
            <select style={{...sl,borderColor:catUnits[selCat]?"#22c55e30":"#1e293b"}} value={catUnits[selCat]||"kg"}
              onChange={e=>dcu({...catUnits,[selCat]:e.target.value})}>
              {(unitsData||BATCH_UNITS).map(u=><option key={u}>{u}</option>)}
            </select>
          </Field>
        </div>
        {selCat&&<div style={{fontSize:"11px",color:"#334155",paddingBottom:"14px"}}>
          Unit auto-fills as <strong style={{color:"#22c55e"}}>{catUnits[selCat]||"kg"}</strong>
        </div>}
      </div>
    </div>

    {subTab==="products"&&<div>
      <InfoBox color="#3b82f6">Each product has its own unit. The unit auto-fills when the product is selected in batch issue.</InfoBox>

      {/* ── Add / Delete Category ── */}
      <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"12px 14px",marginBottom:"14px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>Manage Categories</div>
        <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}}>
          <input style={{...inp,flex:1,minWidth:"160px",padding:"7px 10px",fontSize:"12.5px"}} value={newCat}
            onChange={e=>setNewCat(e.target.value)} placeholder="New category name…"
            onKeyDown={e=>e.key==="Enter"&&addCategory()}/>
          <select style={{...sl,width:"80px",padding:"7px 6px",fontSize:"12.5px"}} value={newCatUnit}
            onChange={e=>setNewCatUnit(e.target.value)}>
            {(unitsData||BATCH_UNITS).map(u=><option key={u}>{u}</option>)}
          </select>
          <Btn label="+ Add Category" onClick={addCategory} color="#64748b" small/>
          {selCat&&<button onClick={()=>{
            if(!confirm(`Delete category "${selCat}" and ALL its products from Products, QC Parameters and Pack Sizes? This cannot be undone.`))return;
            const newProd={...prodData};delete newProd[selCat];
            const newQC={...qcData};delete newQC[selCat];
            const newPack={...packSizeData};delete newPack[selCat];
            const newCU={...catUnits};delete newCU[selCat];
            dpd(newProd);dqd(newQC);dpkd(newPack);dcu(newCU);
            const remaining=Object.keys(newProd).sort((a,b)=>a.localeCompare(b));
            setSelCat(remaining[0]||"");
            showToast&&showToast(`Category "${selCat}" deleted`,"error");
          }} style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"6px",padding:"7px 12px",color:"#fca5a5",fontSize:"12px",fontWeight:"600",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px"}}>
            🗑 Delete "{selCat}"
          </button>}
        </div>
        <div style={{fontSize:"11px",color:"#334155",marginTop:"6px"}}>
          💡 Deleting a category removes it from Products, QC Parameters and Pack Sizes. Remember to 💾 Save All Settings after.
        </div>
      </div>

      {/* ── Add new product row ── */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 90px 60px",gap:"6px",marginBottom:"12px"}}>
        <input style={inp} value={newProduct} onChange={e=>setNewProduct(e.target.value)} placeholder={`Product name in ${selCat}…`} onKeyDown={e=>e.key==="Enter"&&addProduct()}/>
        <select style={sl} value={newProductUnit} onChange={e=>setNewProductUnit(e.target.value)}>
          {(unitsData||BATCH_UNITS).map(u=><option key={u}>{u}</option>)}
        </select>
        <Btn label="+ Add" onClick={addProduct} color="#3b82f6" small/>
      </div>
      {/* Column headers */}
      {(prodData[selCat]||[]).length>0&&<div style={{display:"grid",gridTemplateColumns:"1fr 90px 36px",gap:"6px",marginBottom:"4px",padding:"0 4px"}}>
        {["Product Name","Unit",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {(prodData[selCat]||[]).length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"12px 0"}}>No products in {selCat}. Add one above.</div>}
        {(prodData[selCat]||[]).map((p,i)=>{
          const name=gpn(p); const unit=gpu(p);
          return <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 90px 36px",gap:"6px",alignItems:"center"}}>
            <input style={sml} value={name} onChange={e=>{
              const arr=[...(prodData[selCat]||[])];
              arr[i]={name:e.target.value,unit};
              dpd({...prodData,[selCat]:arr});
            }} placeholder="Product name"/>
            <select style={{...sml,padding:"6px 6px",borderColor:unit?"#22c55e30":"#1e293b"}} value={unit} onChange={e=>{
              const arr=[...(prodData[selCat]||[])];
              arr[i]={name,unit:e.target.value};
              dpd({...prodData,[selCat]:arr});
            }}>
              {(unitsData||BATCH_UNITS).map(u=><option key={u}>{u}</option>)}
            </select>
            <button onClick={()=>removeProduct(selCat,i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px",textAlign:"center"}}>×</button>
          </div>;
        })}
      </div>
    </div>}

    {subTab==="qcparams"&&<div>
      <InfoBox color="#22c55e">Each QC parameter has a Name, Unit (e.g. KU, g/cc, %), Min and Max. Leave unit blank if not applicable. Min/Max trigger auto pass/fail.</InfoBox>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 36px",gap:"6px",marginBottom:"6px"}}>
        {["Parameter Name","Unit","Min","Max",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",padding:"0 4px"}}>{h}</div>)}
      </div>
      {(qcData[selCat]||[]).map((p,i)=>{
        const parsed=gp(p);
        const update=(field,val)=>{
          const arr=[...(qcData[selCat]||[])];
          arr[i]={...parsed,[field]:val};
          setQcData({...qcData,[selCat]:arr});
        };
        return <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 36px",gap:"6px",marginBottom:"6px"}}>
          <input style={sml} value={parsed.name} onChange={e=>update("name",e.target.value)} placeholder="Parameter name"/>
          <input style={{...sml,borderColor:parsed.unit?"#a855f730":"#1e293b"}} value={parsed.unit||""} onChange={e=>update("unit",e.target.value)} placeholder="e.g. KU"/>
          <input style={{...sml,borderColor:parsed.min?"#22c55e30":"#1e293b"}} value={parsed.min} onChange={e=>update("min",e.target.value)} placeholder="Min"/>
          <input style={{...sml,borderColor:parsed.max?"#ef444430":"#1e293b"}} value={parsed.max} onChange={e=>update("max",e.target.value)} placeholder="Max"/>
          <button onClick={()=>removeParam(selCat,i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px",padding:0,alignSelf:"center"}}>×</button>
        </div>;
      })}
      {(qcData[selCat]||[]).length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"10px 0"}}>No QC params for {selCat}.</div>}
      <button onClick={()=>{const arr=[...(qcData[selCat]||[]),{name:"",unit:"",min:"",max:""}];dqd({...qcData,[selCat]:arr});}}
        style={{marginTop:"8px",background:"none",border:"1px dashed #1e293b",borderRadius:"7px",padding:"7px 14px",color:"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600",width:"100%"}}>
        + Add Parameter
      </button>
    </div>}


    {subTab==="packsizes"&&<div>
      <InfoBox color="#f59e0b">Set pack sizes and their fixed quantity per pack for each category. The quantity auto-fills in the packing form — you only need to enter number of packs filled.</InfoBox>
      {/* Add new pack size */}
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 60px",gap:"6px",marginBottom:"8px"}}>
        <input style={inp} value={newPackSize} onChange={e=>setNewPackSize(e.target.value)} placeholder={`Pack size label… e.g. 4 L tin, 25 kg`}/>
        <input style={inp} value={newPackQty} onChange={e=>setNewPackQty(e.target.value)} placeholder="Qty (e.g. 4, 25)"/>
        <Btn label="+ Add" onClick={()=>{
          if(newPackSize.trim()){
            const cat_arr=[...(packSizeData[selCat]||[]),{size:newPackSize.trim(),qty:newPackQty.trim()}];
            dpkd({...packSizeData,[selCat]:cat_arr});
            setNewPackSize("");setNewPackQty("");
          }
        }} color="#f59e0b" small/>
      </div>
      {/* Column headers */}
      {(packSizeData[selCat]||[]).length>0&&<div style={{display:"grid",gridTemplateColumns:"2fr 1fr 120px 36px",gap:"6px",marginBottom:"4px",padding:"0 4px"}}>
        {["Pack Size Label","Qty per Pack","Order",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
      </div>}
      {(packSizeData[selCat]||[]).length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"10px 0"}}>
        No pack sizes for {selCat}. Default sizes will be used: {(packSizeData._default||DEFAULT_PACK_SIZES).map(p=>gps(p).size).join(", ")}
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {(packSizeData[selCat]||[]).map((ps,i)=>{
          const s=gps(ps);
          const update=(field,val)=>{
            const d=[...(packSizeData[selCat]||[])];
            d[i]={...s,[field]:val};
            dpkd({...packSizeData,[selCat]:d});
          };
          return <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 120px 36px",gap:"6px",alignItems:"center"}}>
            <input style={sml} value={s.size} onChange={e=>update("size",e.target.value)} placeholder="e.g. 4 L tin"/>
            <input style={{...sml,borderColor:s.qty?"#22c55e30":"#f59e0b30",textAlign:"center"}} value={s.qty} onChange={e=>update("qty",e.target.value)} placeholder="qty"/>
            <div style={{display:"flex",gap:"4px"}}>
              {i>0&&<button onClick={()=>{const d=[...(packSizeData[selCat]||[])];[d[i-1],d[i]]=[d[i],d[i-1]];dpkd({...packSizeData,[selCat]:d});}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"5px",color:"#64748b",cursor:"pointer",fontSize:"12px",padding:"2px 8px"}}>↑</button>}
              {i<(packSizeData[selCat]||[]).length-1&&<button onClick={()=>{const d=[...(packSizeData[selCat]||[])];[d[i],d[i+1]]=[d[i+1],d[i]];dpkd({...packSizeData,[selCat]:d});}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"5px",color:"#64748b",cursor:"pointer",fontSize:"12px",padding:"2px 8px"}}>↓</button>}
            </div>
            <button onClick={()=>{const d=(packSizeData[selCat]||[]).filter((_,idx)=>idx!==i);dpkd({...packSizeData,[selCat]:d});}} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px",textAlign:"center"}}>×</button>
          </div>;
        })}
      </div>
    </div>}

    {subTab==="units"&&<div>
      <InfoBox color="#38bdf8">Manage the unit options (kg, L, MT, etc.) that appear in product unit, pack size, and batch size fields across the app. These are your company's standard units.</InfoBox>
      <div style={{display:"flex",gap:"6px",marginBottom:"12px"}}>
        <input style={{...inp,flex:1}} value={newUnit} onChange={e=>setNewUnit(e.target.value)}
          placeholder="Add unit… e.g. Litre, Drum, Pail, 5 gal"
          onKeyDown={e=>{if(e.key==="Enter"&&newUnit.trim()&&!unitsData.includes(newUnit.trim())){dud(u=>[...u,newUnit.trim()].sort((a,b)=>a.localeCompare(b)));setNewUnit("");}}}/>
        <Btn label="+ Add" onClick={()=>{
          if(newUnit.trim()&&!unitsData.includes(newUnit.trim())){dud(u=>[...u,newUnit.trim()].sort((a,b)=>a.localeCompare(b)));setNewUnit("");}
        }} color="#38bdf8" small/>
      </div>
      {unitsData.length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"10px 0"}}>No units defined. Add some above.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {unitsData.map((u,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0f172a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 14px"}}>
            <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
              <span style={{fontSize:"11px",fontWeight:"700",color:"#38bdf8",background:"#38bdf818",padding:"2px 8px",borderRadius:"99px",border:"1px solid #38bdf830"}}>#{i+1}</span>
              <span style={{fontSize:"13px",color:"#e2e8f0",fontWeight:"500"}}>{u}</span>
            </div>
            <button onClick={()=>{
              if(unitsData.length<=1){showToast("Must keep at least one unit","error");return;}
              dud(unitsData.filter((_,idx)=>idx!==i));
            }} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px"}}>×</button>
          </div>
        ))}
      </div>
      <div style={{marginTop:"10px",fontSize:"12px",color:"#334155"}}>
        These units appear in: Product unit dropdown, Pack size qty, Batch size, Old/Rejected material. Changes apply after 💾 Save All Settings.
      </div>
    </div>}
    {subTab==="painttypes"&&<div>
      <InfoBox color="#e879f9">Manage paint types used in R&amp;D Projects. Appear in the Paint Type dropdown when creating or editing a project.</InfoBox>
      <div style={{display:"flex",gap:"6px",marginBottom:"12px"}}>
        <input style={{...inp,flex:1}} value={newPaintType} onChange={e=>setNewPaintType(e.target.value)}
          placeholder="Add paint type… e.g. Waterproofing, Cement Paint"
          onKeyDown={e=>{if(e.key==="Enter"&&newPaintType.trim()&&!paintTypesData.includes(newPaintType.trim())){dptd(d=>[...d,newPaintType.trim()].sort((a,b)=>a.localeCompare(b)));setNewPaintType("");}}}/>
        <Btn label="+ Add" onClick={()=>{if(newPaintType.trim()&&!paintTypesData.includes(newPaintType.trim())){dptd(d=>[...d,newPaintType.trim()].sort((a,b)=>a.localeCompare(b)));setNewPaintType("");}}} color="#e879f9" small/>
      </div>
      {paintTypesData.length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"10px 0"}}>No paint types.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {paintTypesData.map((t,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0f172a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 14px"}}>
            <span style={{fontSize:"13px",color:"#e2e8f0"}}>{t}</span>
            <button onClick={()=>{if(paintTypesData.length<=1){showToast("Must keep at least one","error");return;}dptd(paintTypesData.filter((_,j)=>j!==i));}}
              style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px"}}>×</button>
          </div>
        ))}
      </div>
    </div>}

    {subTab==="rmcats"&&<div>
      <InfoBox color="#f97316">Manage raw material categories used in RM Tests. Appear in the Category dropdown when adding an RM test entry.</InfoBox>
      <div style={{display:"flex",gap:"6px",marginBottom:"12px"}}>
        <input style={{...inp,flex:1}} value={newRmCat} onChange={e=>setNewRmCat(e.target.value)}
          placeholder="Add RM category… e.g. Catalyst, Hardener, Thixotrope"
          onKeyDown={e=>{if(e.key==="Enter"&&newRmCat.trim()&&!rmCatsData.includes(newRmCat.trim())){drcd(d=>[...d,newRmCat.trim()].sort((a,b)=>a.localeCompare(b)));setNewRmCat("");}}}/>
        <Btn label="+ Add" onClick={()=>{if(newRmCat.trim()&&!rmCatsData.includes(newRmCat.trim())){drcd(d=>[...d,newRmCat.trim()].sort((a,b)=>a.localeCompare(b)));setNewRmCat("");}}} color="#f97316" small/>
      </div>
      {rmCatsData.length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"10px 0"}}>No RM categories.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {rmCatsData.map((c,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0f172a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 14px"}}>
            <span style={{fontSize:"13px",color:"#e2e8f0"}}>{c}</span>
            <button onClick={()=>{if(rmCatsData.length<=1){showToast("Must keep at least one","error");return;}drcd(rmCatsData.filter((_,j)=>j!==i));}}
              style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px"}}>×</button>
          </div>
        ))}
      </div>
    </div>}

    {subTab==="fyarchive"&&<FYArchiveTab showToast={showToast}/>}

    <div style={{marginTop:"20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"10px"}}>
      <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
        <input ref={fileRef} type="file" accept=".xlsx" onChange={importExcel} style={{display:"none"}}/>
        <Btn label={importing?"Reading…":"📥 Import from Excel"} onClick={()=>fileRef.current?.click()} disabled={importing} color="#64748b" small/>
        <Btn label={exporting?"Exporting…":"📤 Export to Excel"} onClick={exportExcel} disabled={exporting} color="#475569" small/>
        <span style={{fontSize:"11px",color:"#334155"}}>Export → edit → import back</span>
      </div>
      <Btn label={saving?"Saving…":"💾 Save All Settings"} onClick={saveAll} disabled={saving} color="#3b82f6"/>
    </div>
  </div>;
}

// LOGIN SCREEN
// ══════════════════════════════════════════════════════════
function LoginScreen(){
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);
  const handleLogin=async(e)=>{
    e.preventDefault();setLoading(true);setError("");
    const cleanEmail=email.trim().toLowerCase();
    try{await auth.signInWithEmailAndPassword(cleanEmail,password);}
    catch(err){setError(err.code==="auth/wrong-password"||err.code==="auth/user-not-found"||err.code==="auth/invalid-credential"?"Invalid email or password.":err.message);}
    setLoading(false);
  };
  return <div style={{minHeight:"100vh",background:"#060b16",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
    <div style={{width:"100%",maxWidth:"380px"}}>
      <div style={{textAlign:"center",marginBottom:"28px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#3b82f6",letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:"8px"}}>Gujarat Colours & Coatings Pvt Ltd</div>
        <h1 style={{fontSize:"30px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9",margin:0}}>GCC <span style={{fontStyle:"italic",color:"#3b82f6"}}>Operations Hub</span></h1>
        <p style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>Sign in to your workspace</p>
      </div>
      <form onSubmit={handleLogin} style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:"16px",padding:"28px",boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>
        <div style={{marginBottom:"14px"}}>
          <label style={{display:"block",fontSize:"11px",fontWeight:"600",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>Email / Login</label>
          <input type="text" value={email} onChange={e=>setEmail(e.target.value.trimStart())} placeholder="email@company.com or name@gcc-hub.app" required style={inp} autoComplete="email"/>
          <div style={{fontSize:"10px",color:"#334155",marginTop:"4px"}}>Use your email address or the login provided by Admin</div>
        </div>
        <div style={{marginBottom:"20px"}}>
          <label style={{display:"block",fontSize:"11px",fontWeight:"600",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>Password</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" required style={inp} autoComplete="current-password"/>
        </div>
        {error&&<div style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"8px",padding:"10px 14px",color:"#fca5a5",fontSize:"13px",marginBottom:"14px"}}>{error}</div>}
        <button type="submit" disabled={loading} style={{width:"100%",background:"#3b82f6",border:"none",borderRadius:"10px",padding:"12px",color:"#fff",fontWeight:"700",fontSize:"14px",opacity:loading?0.7:1,transition:"opacity 0.2s"}}>
          {loading?"Signing in…":"Sign In →"}
        </button>
      </form>
    </div>
  </div>;
}

function NoAccessScreen(){
  return <div style={{minHeight:"100vh",background:"#060b16",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px",flexDirection:"column",gap:"12px"}}>
    <div style={{fontSize:"40px"}}>🔒</div>
    <div style={{fontSize:"16px",fontWeight:"600",color:"#f1f5f9"}}>Access Pending</div>
    <div style={{fontSize:"13px",color:"#475569",textAlign:"center",maxWidth:"360px"}}>Your account exists but no role has been assigned yet. Please contact your admin (Raj) to assign your role.</div>
    <button onClick={()=>auth.signOut()} style={{background:"none",border:"1px solid #1e293b",borderRadius:"8px",padding:"8px 18px",color:"#64748b",fontSize:"13px",marginTop:"8px",cursor:"pointer"}}>Sign Out</button>
  </div>;
}

// MAIN APP

const EP={projectName:"",projectCode:"",paintType:"Emulsion",application:"",status:"Ongoing",objective:"",formulationBase:"",assignedTo:"",targetDate:"",notes:""};
const ER={materialName:"",vendorName:"",category:"Resin / Binder",batchNo:"",lotNo:"",quantityReceived:"",dateReceived:"",testedBy:"",testResult:"Pending",testsPerformed:"",observations:"",remarks:""};
const EB={category:"",productName:"",shade:"",batchSize:"",unit:"kg",dateIssued:today(),issuedBy:"",oldStockUsed:"",issueNotes:""};
const EC={customerName:"",productName:"",batchNo:"",monthYear:"",invoiceNo:"",materialAvailable:"",complaint:""};

// ══════════════════════════════════════════════════════════
// SAMPLE TESTING TAB — Customer / Competitor Samples
// ══════════════════════════════════════════════════════════
const SAMPLE_SOURCES=["Customer Sample","Competitor Sample","Market Sample","In-house Reference"];
const SAMPLE_VERDICT=["Pass — Matches Spec","Pass — Better than Spec","Fail — Below Spec","Inconclusive","Requires Further Testing"];
const VERDICT_COL={"Pass — Matches Spec":"#22c55e","Pass — Better than Spec":"#3b82f6","Fail — Below Spec":"#ef4444","Inconclusive":"#f59e0b","Requires Further Testing":"#a855f7"};

// ── Extracted outside SampleTestsTab to prevent remount on each keystroke ──
function SampleForm({form,setForm,formFiles,setFormFiles,saving,isEdit,blank,addParam,updParam,remParam,onCancel,onSave}){
  return <div>
    <Grid3>
      <Field label="Sample Name *"><input style={inp} value={form.sampleName} onChange={e=>setForm({...form,sampleName:e.target.value})} placeholder="e.g. Competitor Emulsion X"/></Field>
      <Field label="Source">
        <select style={sl} value={form.source} onChange={e=>setForm({...form,source:e.target.value})}>
          {SAMPLE_SOURCES.map(s=><option key={s}>{s}</option>)}
        </select>
      </Field>
      <Field label={form.source==="Customer Sample"?"Customer Name":"Company / Source Name"}>
        <input style={inp} value={form.providerName} onChange={e=>setForm({...form,providerName:e.target.value})} placeholder={form.source==="Customer Sample"?"Customer name":"Competitor / brand name"}/>
      </Field>
    </Grid3>
    <Grid3>
      <Field label="Product Category"><input style={inp} value={form.productCategory} onChange={e=>setForm({...form,productCategory:e.target.value})} placeholder="e.g. Emulsion, Enamel"/></Field>
      <Field label="Product Type / Shade"><input style={inp} value={form.productType} onChange={e=>setForm({...form,productType:e.target.value})} placeholder="e.g. Interior White 3000"/></Field>
      <Field label="Date Received"><input type="date" style={inp} value={form.dateReceived} onChange={e=>setForm({...form,dateReceived:e.target.value})}/></Field>
    </Grid3>
    <Grid2>
      <Field label="Received By"><input style={inp} value={form.receivedBy} onChange={e=>setForm({...form,receivedBy:e.target.value})} placeholder="Who received the sample"/></Field>
      <Field label="Purpose of Testing"><input style={inp} value={form.purpose} onChange={e=>setForm({...form,purpose:e.target.value})} placeholder="e.g. Benchmark, Match formulation, QC comparison"/></Field>
    </Grid2>
    <div style={{marginBottom:"14px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>Test Parameters & Results</div>
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"6px"}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 80px 1.5fr 2fr 28px",background:"#0b1220",padding:"7px 12px",gap:"6px"}}>
          {["Parameter","Unit","Result Value","Remarks",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
        </div>
        {form.testParameters.map((p,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"2fr 80px 1.5fr 2fr 28px",padding:"6px 12px",gap:"6px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
          <input style={sml} value={p.name} onChange={e=>updParam(i,"name",e.target.value)} placeholder="e.g. Viscosity, pH"/>
          <input style={{...sml,textAlign:"center"}} value={p.unit} onChange={e=>updParam(i,"unit",e.target.value)} placeholder="KU"/>
          <input style={sml} value={p.result} onChange={e=>updParam(i,"result",e.target.value)} placeholder="Enter value"/>
          <input style={sml} value={p.remarks} onChange={e=>updParam(i,"remarks",e.target.value)} placeholder="Within spec? Notes?"/>
          <button onClick={()=>remParam(i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
        </div>)}
      </div>
      <button onClick={addParam} style={{background:"none",border:"1px dashed #1e293b",borderRadius:"6px",padding:"5px 12px",color:"#475569",cursor:"pointer",fontSize:"12px",width:"100%"}}>+ Add Parameter Row</button>
    </div>
    <Field label="Observations / Findings">
      <textarea style={{...ta,minHeight:"90px"}} value={form.observations} onChange={e=>setForm({...form,observations:e.target.value})} placeholder="Overall quality observations, how it compares to our product, notable characteristics…"/>
    </Field>
    <Grid2>
      <Field label="Overall Verdict">
        <select style={{...sl,borderColor:VERDICT_COL[form.verdict]||"#1e293b"}} value={form.verdict} onChange={e=>setForm({...form,verdict:e.target.value})}>
          {SAMPLE_VERDICT.map(v=><option key={v}>{v}</option>)}
        </select>
      </Field>
      <Field label="Recommendation / Action">
        <input style={inp} value={form.recommendation} onChange={e=>setForm({...form,recommendation:e.target.value})} placeholder="e.g. Use as benchmark for formulation trial, Improve viscosity to match…"/>
      </Field>
    </Grid2>
    <div style={{marginBottom:"14px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>📎 Attach Photos / Lab Reports</div>
      <FileAttachment folder={`sample_tests/${form.sampleName.replace(/\s/g,"_")||"sample"}`} existingFiles={formFiles} onFilesChange={setFormFiles} maxFiles={8}/>
    </div>
    <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
      <Btn label="Cancel" onClick={onCancel} outline color="#475569" small/>
      <Btn label={saving?"Saving…":isEdit?"💾 Save Changes":"✓ Save Test Entry"} onClick={onSave} disabled={saving} color="#22c55e" small/>
    </div>
  </div>;
}

function SampleTestsTab({role,user,showToast,sysQcParams,onCreateProject}){
  const [samples,setSamples]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showAdd,setShowAdd]=useState(false);
  const [viewItem,setViewItem]=useState(null);
  const [editItem,setEditItem]=useState(null);
  const [saving,setSaving]=useState(false);
  const [search,setSearch]=useState("");
  const [filterSource,setFilterSource]=useState("All");
  const [filterVerdict,setFilterVerdict]=useState("All");
  const isAdmin=role==="admin";
  const canQC=role==="admin"||role==="qc";

  const blank={
    sampleName:"",source:SAMPLE_SOURCES[0],providerName:"",
    productCategory:"",productType:"",dateReceived:today(),receivedBy:"",
    purpose:"",testParameters:[{name:"",unit:"",result:"",remarks:""}],
    observations:"",verdict:SAMPLE_VERDICT[0],recommendation:"",
    attachments:[]
  };
  const [form,setForm]=useState({...blank});
  const [formFiles,setFormFiles]=useState([]);

  useEffect(()=>{
    const unsub=C("sample_tests").orderBy("_createdAt","desc").onSnapshot(
      s=>{setSamples(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},
      ()=>setLoading(false)
    );
    return unsub;
  },[]);

  const save=async(isEdit=false)=>{
    if(!form.sampleName.trim())return showToast("Sample name required","error");
    setSaving(true);
    try{
      const data={...form,attachments:formFiles,addedBy:user?.email,_updatedAt:ts()};
      if(isEdit&&editItem){
        await C("sample_tests").doc(editItem.id).update(data);
        showToast("Updated ✓");setEditItem(null);
      }else{
        await C("sample_tests").add({...data,_createdAt:ts()});
        showToast("Sample test saved ✓");setShowAdd(false);
      }
      setForm({...blank});setFormFiles([]);
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const startEdit=(item)=>{setEditItem(item);setForm({...blank,...item});setFormFiles(item.attachments||[]);setViewItem(null);};
  const del=async(id)=>{if(!confirm("Delete this entry?"))return;await C("sample_tests").doc(id).delete();showToast("Deleted","error");};

  const addParam=()=>setForm(f=>({...f,testParameters:[...f.testParameters,{name:"",unit:"",result:"",remarks:""}]}));
  const updParam=(i,field,val)=>setForm(f=>({...f,testParameters:f.testParameters.map((p,idx)=>idx===i?{...p,[field]:val}:p)}));
  const remParam=(i)=>setForm(f=>({...f,testParameters:f.testParameters.filter((_,idx)=>idx!==i)}));

  const fs_=samples.filter(s=>{
    const q=normalize(search);
    const src=filterSource==="All"||s.source===filterSource;
    const vrd=filterVerdict==="All"||s.verdict===filterVerdict;
    const ms=!q||normalize(s.sampleName||"").includes(q)||normalize(s.providerName||"").includes(q)||normalize(s.productType||"").includes(q);
    return src&&vrd&&ms;
  });

  return <div>
    {/* Filters + add */}
    <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"14px"}}>
      <input placeholder="Search sample, company…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"7px 10px",fontSize:"12.5px"}}/>
      <select value={filterSource} onChange={e=>setFilterSource(e.target.value)} style={{...sl,width:"155px",padding:"7px 6px",fontSize:"12px"}}>
        <option value="All">All Sources</option>
        {SAMPLE_SOURCES.map(s=><option key={s}>{s}</option>)}
      </select>
      <select value={filterVerdict} onChange={e=>setFilterVerdict(e.target.value)} style={{...sl,width:"160px",padding:"7px 6px",fontSize:"12px"}}>
        <option value="All">All Verdicts</option>
        {SAMPLE_VERDICT.map(v=><option key={v}>{v}</option>)}
      </select>
      <span style={{fontSize:"11px",color:"#334155"}}>{fs_.length} entr{fs_.length!==1?"ies":"y"}</span>
      {canQC&&<div style={{marginLeft:"auto"}}><Btn label="+ Add Sample Test" onClick={()=>setShowAdd(true)} color="#22c55e"/></div>}
    </div>

    {/* Add form inline */}
    {showAdd&&<div style={{background:"#080d18",border:"1px solid #22c55e30",borderRadius:"12px",padding:"18px",marginBottom:"16px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#22c55e",marginBottom:"14px"}}>🔭 New Sample Test Entry</div>
      <SampleForm form={form} setForm={setForm} formFiles={formFiles} setFormFiles={setFormFiles} saving={saving} isEdit={false} blank={blank} addParam={addParam} updParam={updParam} remParam={remParam}
        onCancel={()=>{setShowAdd(false);setForm({...blank});setFormFiles([]);}}
        onSave={()=>save(false)}/>
    </div>}

    {loading&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading…</div>}
    {!loading&&fs_.length===0&&!showAdd&&<div style={{textAlign:"center",padding:"50px 0"}}>
      <div style={{fontSize:"40px",marginBottom:"10px"}}>🔭</div>
      <div style={{fontSize:"13px",color:"#475569"}}>No sample tests yet.{canQC?" Click + Add Sample Test.":""}</div>
    </div>}

    {/* Cards */}
    {fs_.map(s=>{
      const vc=VERDICT_COL[s.verdict]||"#94a3b8";
      const isEditingThis=editItem?.id===s.id;
      return <div key={s.id} style={{background:"#0f172a",border:`1px solid #1e293b`,borderLeft:`3px solid ${vc}`,borderRadius:"12px",marginBottom:"10px",overflow:"hidden"}}>
        {/* Card header */}
        {!isEditingThis&&<div onClick={()=>setViewItem(viewItem?.id===s.id?null:s)} style={{padding:"14px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}
          onMouseEnter={e=>e.currentTarget.style.background="#0f1f35"} onMouseLeave={e=>e.currentTarget.style.background=""}>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap",marginBottom:"4px"}}>
              <span style={{fontSize:"13.5px",fontWeight:"700",color:"#f1f5f9"}}>{s.sampleName}</span>
              <span style={{fontSize:"11px",background:"#1e293b",color:"#94a3b8",padding:"2px 8px",borderRadius:"99px"}}>{s.source}</span>
              {s.providerName&&<span style={{fontSize:"11px",color:"#64748b"}}>— {s.providerName}</span>}
            </div>
            <div style={{fontSize:"11.5px",color:"#475569"}}>
              {s.productCategory&&<span>{s.productCategory}{s.productType?` · ${s.productType}`:""}</span>}
              <span style={{marginLeft:"8px"}}>📅 {s.dateReceived}</span>
              {s.receivedBy&&<span style={{marginLeft:"8px"}}>👤 {s.receivedBy}</span>}
              {(s.testParameters||[]).filter(p=>p.name).length>0&&<span style={{marginLeft:"8px"}}>🔬 {s.testParameters.filter(p=>p.name).length} tests</span>}
              {(s.attachments||[]).length>0&&<span style={{marginLeft:"8px"}}>📎 {s.attachments.length}</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
            <Bdg label={s.verdict} color={vc}/>
            {canQC&&<button onClick={e=>{e.stopPropagation();startEdit(s);}} style={{background:"#1e3a5f",border:"1px solid #2563eb40",borderRadius:"6px",color:"#93c5fd",cursor:"pointer",fontSize:"11px",fontWeight:"600",padding:"3px 8px"}}>✏️ Edit</button>}
            {onCreateProject&&canQC&&<button onClick={e=>{e.stopPropagation();onCreateProject({projectName:`${s.sampleName} — R&D`,paintType:s.productCategory||"Other",application:s.productType||"",objective:`Develop/match sample: ${s.sampleName} from ${s.providerName||s.source}. ${s.observations||""}`.trim(),notes:`From Sample Test | Provider: ${s.providerName||"—"} | Verdict: ${s.verdict||"—"}${s.recommendation?` | ${s.recommendation}`:""}`});}} title="Create R&D Project from this sample" style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",color:"#22c55e",cursor:"pointer",fontSize:"11px",fontWeight:"600",padding:"3px 8px",whiteSpace:"nowrap"}}>🧪 → R&D</button>}
            {isAdmin&&<button onClick={e=>{e.stopPropagation();del(s.id);}} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"14px"}}>🗑</button>}
            <span style={{color:"#334155",fontSize:"12px"}}>{viewItem?.id===s.id?"▲":"▼"}</span>
          </div>
        </div>}

        {/* Edit form */}
        {isEditingThis&&<div style={{padding:"16px 18px",borderTop:"1px solid #2563eb40",background:"#060d1a"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"14px"}}>✏️ Editing: {s.sampleName}</div>
          <SampleForm form={form} setForm={setForm} formFiles={formFiles} setFormFiles={setFormFiles} saving={saving} isEdit={true} blank={blank} addParam={addParam} updParam={updParam} remParam={remParam}
            onCancel={()=>{setEditItem(null);setForm({...blank});setFormFiles([]);}}
            onSave={()=>save(true)}/>
        </div>}

        {/* Expanded view */}
        {viewItem?.id===s.id&&!isEditingThis&&<div style={{padding:"16px 18px",borderTop:"1px solid #1e293b",background:"#080d18"}}>
          {s.purpose&&<div style={{marginBottom:"10px"}}><span style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>Purpose: </span><span style={{fontSize:"13px",color:"#94a3b8"}}>{s.purpose}</span></div>}
          {/* Parameters table */}
          {(s.testParameters||[]).filter(p=>p.name).length>0&&<div style={{marginBottom:"12px"}}>
            <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>Test Results</div>
            <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden"}}>
              <div style={{display:"grid",gridTemplateColumns:"2fr 80px 1.5fr 2fr",background:"#0b1220",padding:"6px 12px",gap:"6px"}}>
                {["Parameter","Unit","Result","Remarks"].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
              </div>
              {s.testParameters.filter(p=>p.name).map((p,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"2fr 80px 1.5fr 2fr",padding:"6px 12px",gap:"6px",borderTop:"1px solid #1e293b",background:i%2===0?"#080d18":"#0b1220"}}>
                <div style={{fontSize:"12.5px",color:"#e2e8f0",fontWeight:"600"}}>{p.name}</div>
                <div style={{fontSize:"12px",color:"#64748b"}}>{p.unit||"—"}</div>
                <div style={{fontSize:"12.5px",color:"#22c55e",fontWeight:"600"}}>{p.result||"—"}</div>
                <div style={{fontSize:"12px",color:"#94a3b8"}}>{p.remarks||"—"}</div>
              </div>)}
            </div>
          </div>}
          {s.observations&&<div style={{marginBottom:"10px"}}><div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"4px"}}>Observations</div><div style={{fontSize:"13px",color:"#cbd5e1",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{s.observations}</div></div>}
          {s.recommendation&&<div style={{marginBottom:"10px"}}><div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"4px"}}>Recommendation</div><div style={{fontSize:"13px",color:"#f59e0b"}}>{s.recommendation}</div></div>}
          {(s.attachments||[]).length>0&&<div style={{marginBottom:"8px"}}><div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>Attachments</div><FileAttachment folder="" existingFiles={s.attachments||[]} onFilesChange={()=>{}} readOnly={true}/></div>}
          <div style={{fontSize:"10.5px",color:"#334155",marginTop:"6px"}}>Added by {s.addedBy} on {s.dateReceived}</div>
          {onCreateProject&&canQC&&<div style={{marginTop:"12px",borderTop:"1px solid #1e293b",paddingTop:"10px"}}>
            <Btn label="🧪 Create R&D Project from this Sample" onClick={()=>onCreateProject({projectName:`${s.sampleName} — R&D`,paintType:s.productCategory||"Other",application:s.productType||"",objective:`Develop/match: ${s.sampleName} from ${s.providerName||s.source}. ${s.observations||""}`.trim(),notes:`From Sample Test | Provider: ${s.providerName||"—"} | Verdict: ${s.verdict}${s.recommendation?` | Rec: ${s.recommendation}`:""}`})} color="#22c55e" small/>
            <div style={{fontSize:"10.5px",color:"#334155",marginTop:"5px"}}>Opens a new R&D Project pre-filled with this sample's details</div>
          </div>}
        </div>}
      </div>;
    })}
  </div>;
}

// RAW MATERIAL STOCK MODULE

// Grouped category view — extracted to avoid IIFE anti-pattern
function StockGroupedView({fm,isAdmin,saveAdjustment}){
  const cats=[...new Set(fm.map(m=>m.category||"Uncategorised"))].sort();
  return <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
    {cats.map(cat=>{
      const catMats=fm.filter(m=>(m.category||"Uncategorised")===cat);
      const totalLow=catMats.filter(m=>{const cv=parseFloat(m.currentStock||0);const r=parseFloat(m.reorderLevel||0);return cv<=0||(r>0&&cv<=r);}).length;
      return <div key={cat} style={{border:"1px solid #1e293b",borderRadius:"10px",overflow:"hidden"}}>
        <div style={{background:"#0f1d35",padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #1e3a5f"}}>
          <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
            <span style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd"}}>{cat}</span>
            <span style={{fontSize:"11px",color:"#475569"}}>{catMats.length} material{catMats.length!==1?"s":""}</span>
          </div>
          {totalLow>0&&<span style={{fontSize:"11px",fontWeight:"700",color:"#f59e0b",background:"#422006",padding:"2px 8px",borderRadius:"99px",border:"1px solid #f59e0b30"}}>⚠️ {totalLow} low/out</span>}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 100px 80px 80px",background:"#0b1220",padding:"7px 14px",gap:"8px"}}>
          {["Material","Supplier","Current Stock","Reorder Level","Status"].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
        </div>
        {catMats.map((m,i)=><StockRowCompact key={m.id} m={m} i={i} isAdmin={isAdmin} saveAdjustment={saveAdjustment}/>)}
      </div>;
    })}
  </div>;
}

// Inline quick-add for categories and units from any screen
function QuickAdd({label,onAdd,color}){
  const clr=color||"#38bdf8";
  const [show,setShow]=useState(false);
  const [val,setVal]=useState("");
  return <span style={{display:"inline-flex",alignItems:"center",gap:"4px"}}>
    {!show&&<button onClick={()=>setShow(true)} title={"Add new "+label}
      style={{background:"none",border:"1px dashed "+clr+"50",borderRadius:"5px",padding:"2px 7px",color:clr,cursor:"pointer",fontSize:"11px",fontWeight:"600",whiteSpace:"nowrap"}}>
      + New {label}
    </button>}
    {show&&<span style={{display:"inline-flex",gap:"4px",alignItems:"center"}}>
      <input autoFocus style={{...sml,width:"130px",borderColor:clr+"50"}} value={val} onChange={e=>setVal(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter"&&val.trim()){onAdd(val.trim());setVal("");setShow(false);}if(e.key==="Escape"){setShow(false);setVal("");}}}
        placeholder={"New "+label+" name…"}/>
      <button onClick={()=>{if(val.trim()){onAdd(val.trim());setVal("");setShow(false);}}} style={{background:clr,border:"none",borderRadius:"5px",padding:"4px 8px",color:"#000",cursor:"pointer",fontSize:"11px",fontWeight:"700"}}>Add</button>
      <button onClick={()=>{setShow(false);setVal("");}} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:"14px"}}>×</button>
    </span>}
  </span>;
}

// Extracted to avoid hooks-in-map violation
// Compact row for category-grouped view (no category column)
function StockRowCompact({m,i,isAdmin,saveAdjustment}){
  const curr=parseFloat(m.currentStock||0);
  const reorder=parseFloat(m.reorderLevel||0);
  const color=curr<=0?"#ef4444":reorder>0&&curr<=reorder?"#f59e0b":reorder>0&&curr<=reorder*1.5?"#eab308":"#22c55e";
  const label=curr<=0?"Out of Stock":reorder>0&&curr<=reorder?"Low Stock":reorder>0&&curr<=reorder*1.5?"Near Reorder":"In Stock";
  const bg=curr<=0?"#450a0a":reorder>0&&curr<=reorder?"#422006":"#052e16";
  const [adjQty,setAdjQty]=useState("");
  const [adjReason,setAdjReason]=useState("");
  const [adjOpen,setAdjOpen]=useState(false);
