// FG MOVEMENTS — Tally movement analysis import + Direct/Unracked log
// ══════════════════════════════════════════════════════════
function FGMovementsTab({role,user,showToast,isAdmin,canManage}){
  const [movements,setMovements]=useState([]);
  const [savedMovements,setSavedMovements]=useState([]);
  const [loading,setLoading]=useState(true);
  const [parsing,setParsing]=useState(false);
  const [search,setSearch]=useState("");
  const [filter,setFilter]=useState("all");
  const [postModal,setPostModal]=useState(null);
  const [racks,setRacks]=useState([]);
  const [fgProducts,setFgProducts]=useState([]);
  const [postForm,setPostForm]=useState({rackId:"",level:"1",isDirect:false,cartons:"",looseTins:""});
  const [saving,setSaving]=useState(false);
  const [dateRange,setDateRange]=useState("");
  // Closing balance state
  const [cbItems,setCbItems]=useState([]);
  const [cbNegative,setCbNegative]=useState([]);
  const [cbParsing,setCbParsing]=useState(false);
  const [cbDate,setCbDate]=useState("");
  const [cbView,setCbView]=useState("cb");
  const [showAssigned,setShowAssigned]=useState(false); // hide completed items by default
  const [packingMode,setPackingMode]=useState("cartons"); // "cartons"|"loose"|"custom" — per assign modal

  useEffect(()=>{
    const u1=C("fg_movements").orderBy("importedAt","desc").onSnapshot(
      s=>{setSavedMovements(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},
      ()=>{C("fg_movements").onSnapshot(s=>{setSavedMovements(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);});});
    const u2=C("fg_config").doc("warehouse").onSnapshot(s=>{if(s.exists&&s.data().racks)setRacks(s.data().racks);},()=>{});
    const u3=C("fg_products").onSnapshot(s=>{setFgProducts(s.docs.map(d=>({id:d.id,...d.data()})));},()=>{});
    // ── Load persisted import sessions (survive browser close) ──
    const u4=C("fg_config").doc("cb_session").onSnapshot(s=>{
      if(s.exists&&s.data().items?.length>0){
        setCbItems(s.data().items);setCbDate(s.data().date||"");
      }
    },()=>{});
    const u5=C("fg_config").doc("mv_session").onSnapshot(s=>{
      if(s.exists&&s.data().items?.length>0){
        setMovements(s.data().items);setDateRange(s.data().dateRange||"");
      }
    },()=>{});
    return ()=>{u1();u2();u3();u4();u5();};
  },[]);

  const persistCBSession=async(items,date)=>{
    try{await C("fg_config").doc("cb_session").set({items,date,savedAt:ts()},{merge:false});}catch(e){}
  };
  const deleteCBSession=async()=>{
    await C("fg_config").doc("cb_session").delete();
    setCbItems([]);setCbDate("");setCbNegative([]);
    showToast("Closing balance session cleared");
  };
  const persistMVSession=async(items,range)=>{
    try{await C("fg_config").doc("mv_session").set({items,dateRange:range,savedAt:ts()},{merge:false});}catch(e){}
  };
  const deleteMVSession=async()=>{
    await C("fg_config").doc("mv_session").delete();
    setMovements([]);setDateRange("");
    showToast("Movement session cleared");
  };

  // ── Parse Tally closing balance (Stock Group Summary) ──
  const parseClosingBalance=async(file)=>{
    setCbParsing(true);
    try{
      await loadXLSX();
      const XLSX=window.XLSX;
      const buf=await new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsArrayBuffer(file);});
      const wb=XLSX.read(buf,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});

      // Extract date period
      let period="";
      for(let i=0;i<16;i++){
        const cell=String(raw[i]?.[0]||"");
        if(/\d+-[A-Za-z]+-\d+/.test(cell)){period=cell.trim();break;}
      }
      setCbDate(period);

      const SKIP=/Gujarat Colours|Factory:|Village|Office:|CIN:|Contact|E-Mail|UDYAM|Laxminagar|Ghatkopar|FINAL PACKED|Stock Group|1-Apr|Gcc Erp|Particulars|Closing|Movement Analysis/i;

      // Walk rows, collect products with their GCC godown qty
      const parsed=[], negatives=[];
      let i=16;
      while(i<raw.length){
        const row=raw[i];
        if(!row){i++;continue;}
        const name=String(row[0]||"").trim();
        const godownCol=String(row[1]||"").trim();

        // Skip godown sub-rows (col1 has godown name, col0 blank)
        if(!name&&godownCol){i++;continue;}
        if(!name){i++;continue;}
        // Skip pure numbers (Tally total rows)
        if(/^\d+(\.\d+)?$/.test(name)){i++;continue;}
        // Skip header/company rows
        if(SKIP.test(name)){i++;continue;}

        // Collect godown breakdown from following rows
        let gccQty=null, totalQty=null;
        const rowQty=parseFloat(row[2])||null;
        if(rowQty!==null)totalQty=rowQty;
        let j=i+1;
        while(j<raw.length){
          const sub=raw[j];
          if(!sub){j++;continue;}
          const subName=String(sub[0]||"").trim();
          const subGodown=String(sub[1]||"").trim();
          if(subName)break; // next product
          if(subGodown){
            const q=parseFloat(sub[2])||0;
            if(/Gujarat Colours/i.test(subGodown))gccQty=q;
          }
          j++;
        }

        // Only use GCC godown qty — never fall back to product-row total
        // (total would include Inspection Godown which we intentionally ignore)
        const useQty=gccQty;
        i=j;
        if(useQty===null||useQty===0)continue; // no GCC sub-row found → skip
        // Parse unit from name
        const um=name.match(/([\d.]+)\s*(ml|l|L|kg|Kg|KG|K\b|ltr)/i);
        let unit="L";
        if(um){const u=um[2].toLowerCase();unit=(u==="kg"||u==="k")?"Kg":"L";}
        // useQty from Tally is in TINS. Store as tallyTins — litres computed at assign time via catalogue.
        parsed.push({name,tallyTins:useQty,qty:useQty,unit:"Tins",negative:useQty<0,direct:false,posted:false});
      }

      setCbItems(parsed);
      setCbNegative(negatives);
      await persistCBSession(parsed,period);
      showToast(`Parsed ${parsed.length} products · session saved, resume anytime${negatives.length>0?` · ${negatives.length} negative flagged`:""}`);
    }catch(e){showToast("Parse error: "+e.message,"error");}
    setCbParsing(false);
  };

  // ── Parse Tally movement analysis Excel ──
  const parseTally=async(file)=>{
    setParsing(true);
    try{
      await loadXLSX();
      const XLSX=window.XLSX;
      const buf=await new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsArrayBuffer(file);});
      const wb=XLSX.read(buf,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});

      // Find period from header rows
      let period="";
      for(let i=0;i<16;i++){
        const r=raw[i];
        if(r&&String(r[0]||"").match(/\d+-[A-Za-z]+-\d+\s+to\s+\d+-[A-Za-z]+-\d+/)){
          period=String(r[0]).trim();break;
        }
      }
      setDateRange(period);

      // Data starts from row index 16
      const parsed=[];
      for(let i=16;i<raw.length;i++){
        const row=raw[i];
        if(!row||!row[0])continue;
        const name=String(row[0]).trim();
        const godown=row[1]?String(row[1]).trim():"";
        // Skip godown sub-rows (duplicate data)
        if(godown.includes("Gujarat"))continue;
        // Skip company header rows
        if(/Gujarat Colours|Factory:|Village|Office:|CIN:|Contact|E-Mail|FINAL PACKED|Movement|1-Apr|UDYAM|Laxminagar|Ghatkopar/i.test(name))continue;
        if(!name||name==="nan")continue;

        // Determine if product or group: a product row is followed by a godown row
        let isProduct=false;
        for(let j=i+1;j<Math.min(i+3,raw.length);j++){
          const nr=raw[j];if(!nr)continue;
          if(nr[1]&&String(nr[1]).includes("Gujarat")){isProduct=true;break;}
          if(nr[0]&&String(nr[0]).trim())break;
        }
        if(!isProduct)continue;

        const inward=parseFloat(row[2])||0;
        const outward=parseFloat(row[5])||0;
        if(inward===0&&outward===0)continue;

        // Parse unit from name
        const unitM=name.match(/([\d.]+)\s*(ml|l|L|kg|Kg|KG|K\b|ltr)/i);
        let unit="L";
        if(unitM){const u=unitM[2].toLowerCase();unit=u==="kg"||u==="k"?"Kg":"L";}

        // inward/outward from Tally are in TINS (physical container count)
        parsed.push({name,inward,outward,inwardTins:inward,outwardTins:outward,unit:"Tins",direct:false,posted:false});
      }
      setMovements(parsed);
      await persistMVSession(parsed,period);
      showToast(`Parsed ${parsed.length} products · session saved, resume anytime`);
    }catch(e){showToast("Parse error: "+e.message,"error");}
    setParsing(false);
  };

  // ── Save movements to Firestore (as a record/log) ──
  const saveMovements=async()=>{
    if(!movements.length)return;
    setSaving(true);
    try{
      const batch={importedAt:ts(),importedBy:user?.email,dateRange,count:movements.length};
      const docRef=await C("fg_movements").add({...batch,movements});
      showToast(`Saved ${movements.length} movements ✓`);
      setMovements([]);
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // ── Post inward to a rack level ──
  const postToRack=async()=>{
    const {item,idx,isCB}=postModal;
    if(!postForm.rackId||!postForm.level)return showToast("Select rack and level","error");
    // Resolve product config for carton maths
    const prod=fgProducts.find(p=>normalize(p.name)===normalize(item.name));
    const tpc=prod?.tinsPerCarton||null;
    const sizePerTin=prod?.size||null;
    const cartons=parseInt(postForm.cartons)||0;
    const looseTins=parseInt(postForm.looseTins)||0;
    if(cartons===0&&looseTins===0)return showToast("Enter cartons or loose tins to assign","error");
    // Calculate qty being posted
    let postQty;
    if(tpc&&sizePerTin) postQty=parseFloat(((cartons*tpc+looseTins)*sizePerTin).toFixed(3));
    else postQty=parseFloat((item.remaining||item.inward||item.qty)).toFixed(3);
    const remaining=parseFloat(item.remaining||item.inward||item.qty||0);
    if(postQty>remaining+0.001)return showToast(`Only ${remaining} ${item.unit} remaining to assign. Cannot post ${postQty}.`,"error");
    setSaving(true);
    try{
      const cell=`${postForm.rackId}.${postForm.level}`;
      const existing=(await C("fg_stock_v2").where("cell","==",cell).where("productName","==",item.name).get()).docs[0];
      if(existing){
        await C("fg_stock_v2").doc(existing.id).update({
          cartons:(parseInt(existing.data().cartons)||0)+cartons,
          looseTins:(parseInt(existing.data().looseTins)||0)+looseTins,
          totalQty:parseFloat((parseFloat(existing.data().totalQty||0)+postQty).toFixed(3)),
          tinsPerCarton:tpc,sizePerTin,lastModifiedAt:ts(),lastModifiedBy:user?.email
        });
      }else{
        await C("fg_stock_v2").add({cell,productName:item.name,cartons,looseTins,totalQty:postQty,unit:item.unit,tinsPerCarton:tpc,sizePerTin,_createdAt:ts(),lastModifiedAt:ts(),lastModifiedBy:user?.email});
      }
      await C("fg_transactions").add({cell,productName:item.name,type:"add",cartons,looseTins,totalQty:postQty,unit:item.unit,tinsPerCarton:tpc,sizePerTin,notes:"Tally import"+(dateRange?" ("+dateRange+")":""),date:today(),by:user?.email,_createdAt:ts()});
      const newRemaining=parseFloat((remaining-postQty).toFixed(3));
      const fullyAssigned=newRemaining<=0.001;
      const updater=isCB?setCbItems:setMovements;
      updater(prev=>{
        const updated=prev.map((m,i)=>i===idx?{...m,remaining:newRemaining,posted:fullyAssigned}:m);
        // Persist progress to Firestore so work survives browser close
        if(isCB)persistCBSession(updated,cbDate);
        else persistMVSession(updated,dateRange);
        return updated;
      });
      const rack=racks.find(r=>r.id===postForm.rackId);
      showToast(`${cartons>0?cartons+" cartons":""}${cartons>0&&looseTins>0?" + ":""}${looseTins>0?looseTins+" loose tins":""} → ${rack?.name} L${postForm.level} ✓${fullyAssigned?" — fully assigned":""}`);
      if(fullyAssigned)setPostModal(null);
      else{setPostForm(f=>({...f,cartons:"",looseTins:""}));setPostModal(prev=>({...prev,item:{...prev.item,remaining:newRemaining}}));}
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const toggleDirect=(idx)=>setMovements(prev=>prev.map((m,i)=>i===idx?{...m,direct:!m.direct}:m));

  const filtered=movements.filter(m=>{
    if(filter==="racked"&&m.direct)return false;
    if(filter==="direct"&&!m.direct)return false;
    if(search.trim()&&!normalize(m.name).includes(normalize(search)))return false;
    return true;
  });

  const directItems=filtered.filter(m=>m.direct);
  const rackedItems=filtered.filter(m=>!m.direct);
  const rack=racks.find(r=>r.id===postForm.rackId);
  const cbFiltered=cbItems.filter(p=>(showAssigned||!p.posted)&&(!search.trim()||normalize(p.name).includes(normalize(search))));
  const getCatFromCatalogue=(name)=>fgProducts.find(p=>normalize(p.name)===normalize(name))?.category||"";
  const getCartonBreakdown=(name,tallyTins)=>{
    const prod=fgProducts.find(p=>normalize(p.name)===normalize(name));
    if(!prod||!prod.tinsPerCarton||!tallyTins)return null;
    const tins=Math.round(tallyTins);
    const cartons=Math.floor(tins/prod.tinsPerCarton);
    const loose=tins%prod.tinsPerCarton;
    const totalQty=parseFloat((tins*prod.size).toFixed(3));
    return {cartons,loose,totalQty,unit:prod.unit,tpc:prod.tinsPerCarton,sizePerTin:prod.size};
  };

  return <div>
    <div style={{fontSize:"22px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9",marginBottom:"14px"}}>📊 FG Movements</div>

    {/* Top toggle: Closing Balance vs Movement Analysis */}
    <div style={{display:"flex",gap:"4px",marginBottom:"16px",borderBottom:"1px solid #1e293b"}}>
      {[["cb","📦 Closing Balance"],["movements","📊 Movement Analysis"]].map(([k,l])=><button key={k} onClick={()=>setCbView(k)} style={{background:cbView===k?"#1e293b":"transparent",border:"none",borderBottom:cbView===k?"2px solid #3b82f6":"2px solid transparent",color:cbView===k?"#f1f5f9":"#64748b",padding:"8px 18px",cursor:"pointer",fontSize:"13px",fontWeight:"600",borderRadius:"8px 8px 0 0"}}>{l}</button>)}
    </div>

    {/* ── CLOSING BALANCE VIEW ── */}
    {cbView==="cb"&&<>
      <div style={{background:"#060d1a",border:"1px solid #1e3a5f",borderRadius:"12px",padding:"14px",marginBottom:"14px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"6px"}}>Import Closing Balance (Stock Group Summary from Tally)</div>
        <div style={{fontSize:"11.5px",color:"#475569",marginBottom:"10px"}}>
          Export from Tally: <strong style={{color:"#64748b"}}>Display → Inventory Books → Stock Summary</strong> → set date to last day of month → Export to Excel. Only GCC godown quantities are imported. Negative stock quantities are flagged separately.
        </div>
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
          <button onClick={()=>document.getElementById("cb-import").click()} disabled={cbParsing} style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"7px",padding:"7px 14px",color:"#93c5fd",fontWeight:"700",fontSize:"12.5px",cursor:"pointer"}}>
            {cbParsing?"Parsing…":"⬆ Import Closing Balance Excel"}
          </button>
          <input id="cb-import" type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={async e=>{if(e.target.files[0]){await parseClosingBalance(e.target.files[0]);e.target.value="";}}}/>
          {cbDate&&<span style={{fontSize:"12px",color:"#64748b"}}>As at: {cbDate}</span>}
          {cbItems.length>0&&<><span style={{fontSize:"12px",color:"#22c55e"}}>{cbItems.filter(p=>!p.posted).length} remaining of {cbItems.length}</span>
            <button onClick={deleteCBSession} style={{background:"none",border:"1px solid #7f1d1d",borderRadius:"6px",padding:"5px 10px",color:"#f87171",fontSize:"11px",cursor:"pointer"}}>🗑 Delete session</button>
          </>}
        </div>
      </div>

      {cbItems.length>0&&<>
        <div style={{display:"flex",gap:"8px",marginBottom:"10px",flexWrap:"wrap",alignItems:"center"}}>
          <div style={{position:"relative",flex:1,minWidth:"180px"}}>
            <span style={{position:"absolute",left:"10px",top:"50%",transform:"translateY(-50%)",color:"#334155",pointerEvents:"none"}}>🔍</span>
            <input style={{...inp,paddingLeft:"32px"}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search product…"/>
          </div>
          <span style={{fontSize:"11px",color:"#475569"}}>{cbItems.filter(p=>p.posted).length}/{cbItems.length} assigned</span>
          <button onClick={()=>setShowAssigned(v=>!v)} style={{background:"none",border:"1px solid #334155",borderRadius:"6px",padding:"4px 10px",color:"#475569",fontSize:"11px",cursor:"pointer"}}>{showAssigned?"Hide assigned":"Show assigned"}</button>
          <button onClick={deleteCBSession} style={{background:"none",border:"1px solid #7f1d1d",borderRadius:"6px",padding:"4px 10px",color:"#f87171",fontSize:"11px",cursor:"pointer"}}>🗑 Delete session</button>
          {cbItems.some(p=>p.negative&&!p.posted)&&<span style={{fontSize:"11px",color:"#f87171"}}>⚠ {cbItems.filter(p=>p.negative&&!p.posted).length} negative balance items — investigate in Tally or Skip</span>}
        </div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12.5px"}}>
          <thead><tr style={{background:"#0b1220"}}>
            {["Product","Tally (Tins)","Cartons / Loose",""].map(h=><th key={h} style={{padding:"8px 12px",textAlign:"left",fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",borderBottom:"1px solid #1e293b"}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {cbFiltered.map((p,i)=>{
              const realIdx=cbItems.indexOf(p);
              const tallyTins=p.tallyTins||p.qty||0;
              const breakdown=getCartonBreakdown(p.name,tallyTins);
              return <tr key={i} style={{borderBottom:"1px solid #0f172a",background:p.posted?"#052e16":p.negative?"#1a0a00":p.direct?"#1a0f00":i%2===0?"#080d18":"transparent"}}>
                <td style={{padding:"9px 12px",color:p.posted?"#4ade80":p.negative?"#f87171":p.direct?"#fcd34d":"#e2e8f0"}}>
                  {p.name}
                  {p.posted&&<span style={{fontSize:"10px",color:"#4ade80",marginLeft:"6px"}}>✓</span>}
                  {p.negative&&!p.posted&&<span style={{fontSize:"10px",color:"#f87171",marginLeft:"6px"}}>⚠ Negative</span>}
                  {p.direct&&!p.negative&&<span style={{fontSize:"10px",color:"#f59e0b",marginLeft:"6px"}}>🚚 Direct</span>}
                </td>
                <td style={{padding:"9px 12px",color:p.negative?"#f87171":"#94a3b8",fontWeight:"600"}}>{Math.abs(tallyTins)} tins</td>
                <td style={{padding:"9px 12px"}}>
                  {breakdown
                    ?<><div style={{fontSize:"13px",fontWeight:"700",color:"#4ade80"}}>{breakdown.cartons} cartons{breakdown.loose>0?` + ${breakdown.loose} loose`:""}</div>
                      <div style={{fontSize:"10.5px",color:"#475569"}}>{breakdown.totalQty} {breakdown.unit} · {breakdown.tpc} tins/carton</div>
                    </>
                    :<span style={{fontSize:"11px",color:"#334155"}}>Not in catalogue</span>}
                </td>
                <td style={{padding:"9px 12px"}}>
                  {!p.posted&&<div style={{display:"flex",gap:"5px"}}>
                    {!p.negative&&<button onClick={()=>{
                      const item={...p,tallyTins,inward:tallyTins,qty:tallyTins,unit:"Tins",remaining:p.remaining!=null?p.remaining:tallyTins};
                      setPostModal({item,idx:realIdx,isCB:true});
                      setPackingMode("cartons");
                      // Auto-fill cartons from tally tins
                      if(breakdown){setPostForm({rackId:"",level:"1",isDirect:p.direct,cartons:String(breakdown.cartons),looseTins:String(breakdown.loose)});}
                      else{setPostForm({rackId:"",level:"1",isDirect:p.direct,cartons:"",looseTins:""});}
                    }} style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"5px",color:"#93c5fd",fontSize:"11px",fontWeight:"700",padding:"3px 8px",cursor:"pointer"}}>→ Assign</button>}
                    {p.negative&&<button onClick={()=>setCbItems(prev=>prev.map((x,xi)=>xi===realIdx?{...x,posted:true}:x))}
                      style={{background:"#2e0a0a",border:"1px solid #7f1d1d",borderRadius:"5px",color:"#f87171",fontSize:"11px",fontWeight:"700",padding:"3px 8px",cursor:"pointer"}}>Skip</button>}
                  </div>}
                </td>
              </tr>;
            })}
          </tbody>
        </table>
      </>}
      {cbItems.length===0&&<div style={{textAlign:"center",padding:"50px",border:"2px dashed #1e293b",borderRadius:"10px",color:"#334155"}}>
        Import a closing balance Excel above to start assigning stock to rack locations.
      </div>}
    </>}

    {/* ── MOVEMENT ANALYSIS VIEW ── */}
    {cbView==="movements"&&<>
      <div style={{background:"#060d1a",border:"1px solid #1e3a5f",borderRadius:"12px",padding:"14px",marginBottom:"14px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"8px"}}>Import Tally Movement Analysis</div>
        <div style={{fontSize:"11.5px",color:"#475569",marginBottom:"10px"}}>Export from Tally: <strong style={{color:"#64748b"}}>Display → Inventory Books → Movement Analysis</strong> → set date range → Export to Excel.</div>
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
          <button onClick={()=>document.getElementById("mv-import").click()} disabled={parsing} style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"7px",padding:"7px 14px",color:"#93c5fd",fontWeight:"700",fontSize:"12.5px",cursor:"pointer"}}>{parsing?"Parsing…":"⬆ Import Tally Excel"}</button>
          <input id="mv-import" type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={async e=>{if(e.target.files[0]){await parseTally(e.target.files[0]);e.target.value="";}}}/>
          {dateRange&&<span style={{fontSize:"12px",color:"#64748b"}}>Period: {dateRange}</span>}
          {movements.length>0&&<>
            <span style={{fontSize:"12px",color:"#22c55e"}}>{movements.length} products parsed</span>
            <button onClick={saveMovements} disabled={saving} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"7px 14px",color:"#4ade80",fontWeight:"700",fontSize:"12.5px",cursor:"pointer"}}>{saving?"…":"💾 Save Log"}</button>
            <button onClick={()=>setMovements([])} style={{background:"none",border:"1px solid #334155",borderRadius:"7px",padding:"6px 12px",color:"#475569",fontSize:"12px",cursor:"pointer"}}>✕ Clear</button>
          </>}
        </div>
      </div>
      {movements.length>0&&<>
        <div style={{display:"flex",gap:"8px",marginBottom:"10px",flexWrap:"wrap",alignItems:"center"}}>
          <div style={{position:"relative",flex:1,minWidth:"180px"}}>
            <span style={{position:"absolute",left:"10px",top:"50%",transform:"translateY(-50%)",color:"#334155",pointerEvents:"none"}}>🔍</span>
            <input style={{...inp,paddingLeft:"32px"}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search product…"/>
          </div>
          {[["all","All"],["racked","🏪 Racked"],["direct","🚚 Direct"]].map(([v,l])=><button key={v} onClick={()=>setFilter(v)} style={{background:filter===v?"#1e293b":"transparent",border:"1px solid #1e293b",borderRadius:"99px",padding:"5px 14px",color:filter===v?"#f1f5f9":"#64748b",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>{l} ({v==="all"?movements.length:v==="racked"?movements.filter(m=>!m.direct).length:movements.filter(m=>m.direct).length})</button>)}
        </div>
        {filter!=="direct"&&rackedItems.length>0&&<div style={{marginBottom:"16px"}}>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>🏪 Racked ({rackedItems.length})</div>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12.5px"}}><thead><tr style={{background:"#0b1220"}}>{["Product","Inward","Outward",""].map(h=><th key={h} style={{padding:"8px 12px",textAlign:"left",fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",borderBottom:"1px solid #1e293b"}}>{h}</th>)}</tr></thead>
            <tbody>{rackedItems.map((m,i)=>{const realIdx=movements.indexOf(m);return <tr key={i} style={{borderBottom:"1px solid #0f172a",background:m.posted?"#052e16":i%2===0?"#080d18":"transparent"}}>
              <td style={{padding:"9px 12px",color:m.posted?"#4ade80":"#e2e8f0"}}>{m.name}{m.posted&&<span style={{fontSize:"10px",color:"#4ade80",marginLeft:"6px"}}>✓</span>}</td>
              <td style={{padding:"9px 12px",color:"#22c55e",fontWeight:"600"}}>{m.inward>0?`+${m.inward} ${m.unit}`:""}</td>
              <td style={{padding:"9px 12px",color:"#f87171"}}>{m.outward>0?`−${m.outward} ${m.unit}`:""}</td>
              <td style={{padding:"9px 12px"}}><div style={{display:"flex",gap:"5px"}}>
                {m.inward>0&&!m.posted&&canManage&&<button onClick={()=>{setPostModal({item:m,idx:realIdx});setPostForm({rackId:"",level:"1",isDirect:false});}} style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"5px",color:"#93c5fd",fontSize:"11px",fontWeight:"700",padding:"3px 8px",cursor:"pointer"}}>→ Assign</button>}
                <button onClick={()=>toggleDirect(realIdx)} style={{background:"none",border:"1px solid #334155",borderRadius:"5px",color:"#475569",fontSize:"10px",padding:"3px 6px",cursor:"pointer"}}>Direct</button>
              </div></td>
            </tr>;})}
          </tbody></table>
        </div>}
        {filter!=="racked"&&directItems.length>0&&<div>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>🚚 Direct / Unracked ({directItems.length})</div>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12.5px"}}><thead><tr style={{background:"#0b1220"}}>{["Product","Inward","Outward",""].map(h=><th key={h} style={{padding:"8px 12px",textAlign:"left",fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",borderBottom:"1px solid #1e293b"}}>{h}</th>)}</tr></thead>
            <tbody>{directItems.map((m,i)=>{const realIdx=movements.indexOf(m);return <tr key={i} style={{borderBottom:"1px solid #0f172a",background:i%2===0?"#080d18":"transparent"}}>
              <td style={{padding:"9px 12px",color:"#fcd34d"}}>{m.name}</td>
              <td style={{padding:"9px 12px",color:"#22c55e",fontWeight:"600"}}>{m.inward>0?`+${m.inward} ${m.unit}`:""}</td>
              <td style={{padding:"9px 12px",color:"#f87171"}}>{m.outward>0?`−${m.outward} ${m.unit}`:""}</td>
              <td style={{padding:"9px 12px"}}><button onClick={()=>toggleDirect(realIdx)} style={{background:"none",border:"1px solid #334155",borderRadius:"5px",color:"#475569",fontSize:"10px",padding:"3px 6px",cursor:"pointer"}}>→ Racked</button></td>
            </tr>;})}
          </tbody></table>
        </div>}
      </>}
      {movements.length===0&&<div>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"10px"}}>Saved Movement Logs</div>
        {loading?<div style={{color:"#475569",fontSize:"12px"}}>Loading…</div>
        :savedMovements.length===0?<div style={{textAlign:"center",padding:"40px",border:"2px dashed #1e293b",borderRadius:"10px",color:"#334155"}}>No movement logs yet.</div>
        :<div>{savedMovements.map(log=><div key={log.id} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"10px",padding:"12px 16px",marginBottom:"8px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:"13px",color:"#e2e8f0",fontWeight:"600"}}>{log.dateRange||"Movement Log"}</div>
            <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>{log.count} products · {log.importedAt?.toDate?.()?.toLocaleDateString("en-IN")||""}</div>
          </div>
          <div style={{display:"flex",gap:"8px"}}>
            <button onClick={()=>{setMovements(log.movements||[]);setDateRange(log.dateRange||"");showToast("Log loaded");}} style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"6px",color:"#93c5fd",fontSize:"11.5px",fontWeight:"700",padding:"5px 12px",cursor:"pointer"}}>📂 Load</button>
            {isAdmin&&<button onClick={async()=>{if(!confirm("Delete?"))return;await C("fg_movements").doc(log.id).delete();}} style={{background:"none",border:"1px solid #334155",borderRadius:"6px",color:"#475569",fontSize:"11.5px",padding:"5px 10px",cursor:"pointer"}}>🗑</button>}
          </div>
        </div>)}</div>}
      </div>}
    </>}

    {/* Post to Rack modal */}
    {postModal&&(()=>{
      const item=postModal.item;
      // remaining is in TINS (Tally's unit). tallyTins is the authoritative source.
      const remaining=parseFloat(item.remaining!=null?item.remaining:(item.tallyTins||item.inward||item.qty||0));
      const prod=fgProducts.find(p=>normalize(p.name)===normalize(item.name));
      const tpc=prod?.tinsPerCarton;
      const sizePerTin=prod?.size;
      const moveC=parseInt(postForm.cartons)||0;
      const moveL=parseInt(postForm.looseTins)||0;
      const assignQty=tpc&&sizePerTin?parseFloat(((moveC*tpc+moveL)*sizePerTin).toFixed(3)):(moveC+moveL);
      const afterRemaining=parseFloat((remaining-assignQty).toFixed(3));
      const rack=racks.find(r=>r.id===postForm.rackId);
      return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"14px",padding:"22px",width:"min(440px,96vw)",maxHeight:"90vh",overflowY:"auto"}}>
          <div style={{fontSize:"15px",fontWeight:"700",color:"#4ade80",marginBottom:"2px"}}>Assign to Rack</div>
          <div style={{fontSize:"12px",color:"#64748b",marginBottom:"10px"}}>{item.name}</div>
          {/* Remaining balance */}
          <div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"8px 12px",marginBottom:"12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:"12px",color:"#64748b"}}>Still to assign:</span>
            <span style={{fontSize:"16px",fontWeight:"700",color:"#4ade80"}}>{remaining} {item.unit}</span>
          </div>
          {/* Rack or Direct */}
          <div style={{display:"flex",gap:"8px",marginBottom:"14px"}}>
            <button onClick={()=>setPostForm({...postForm,isDirect:false})} style={{flex:1,background:!postForm.isDirect?"#1e3a5f":"#0b1220",border:`1px solid ${!postForm.isDirect?"#3b82f6":"#1e293b"}`,borderRadius:"8px",padding:"9px",color:!postForm.isDirect?"#93c5fd":"#475569",fontWeight:"700",fontSize:"13px",cursor:"pointer"}}>🏪 Post to Rack</button>
            <button onClick={()=>setPostForm({...postForm,isDirect:true})} style={{flex:1,background:postForm.isDirect?"#2e1a00":"#0b1220",border:`1px solid ${postForm.isDirect?"#f59e0b":"#1e293b"}`,borderRadius:"8px",padding:"9px",color:postForm.isDirect?"#fcd34d":"#475569",fontWeight:"700",fontSize:"13px",cursor:"pointer"}}>🚚 Direct</button>
          </div>
          {!postForm.isDirect&&<>
            {/* Tally qty is in TINS — let user specify how it's physically packed */}
            {tpc&&sizePerTin&&<>
              <div style={{fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"6px"}}>How is it physically packed?</div>
              <div style={{display:"flex",gap:"6px",marginBottom:"10px"}}>
                {[["cartons","📦 In Cartons"],["loose","🔓 Loose Tins"],["custom","✏️ Custom"]].map(([v,l])=><button key={v} onClick={()=>{
                  setPackingMode(v);
                  const totalTins=Math.round(item.tallyTins||item.remaining||0); // Tally qty IS the tin count
                  if(v==="cartons"&&tpc){const c=Math.floor(totalTins/tpc),lt=totalTins%tpc;setPostForm(f=>({...f,cartons:String(c),looseTins:String(lt)}));}
                  else if(v==="loose"){setPostForm(f=>({...f,cartons:"0",looseTins:String(totalTins)}));}
                  else{setPostForm(f=>({...f,cartons:"",looseTins:""}));}
                }} style={{flex:1,background:packingMode===v?"#1e3a5f":"#0b1220",border:`1px solid ${packingMode===v?"#3b82f6":"#1e293b"}`,borderRadius:"7px",padding:"7px",color:packingMode===v?"#93c5fd":"#475569",fontWeight:"600",fontSize:"11.5px",cursor:"pointer"}}>{l}</button>)}
              </div>
              <Grid2>
                <Field label="Cartons"><input style={inp} type="number" min="0" step="1" value={postForm.cartons} onChange={e=>{setPackingMode("custom");setPostForm({...postForm,cartons:e.target.value});}} placeholder="0"/></Field>
                <Field label="Loose Tins"><input style={inp} type="number" min="0" step="1" value={postForm.looseTins} onChange={e=>{setPackingMode("custom");setPostForm({...postForm,looseTins:e.target.value});}} placeholder="0"/></Field>
              </Grid2>
              {tpc&&<div style={{fontSize:"11px",color:"#334155",marginTop:"-4px",marginBottom:"8px"}}>{tpc} tins per carton · {sizePerTin}{item.unit} per tin</div>}
              {moveC+moveL>0&&<div style={{background:"#0a1a2e",border:"1px solid #1e3a5f",borderRadius:"7px",padding:"7px 12px",marginBottom:"10px",fontSize:"12px",display:"flex",justifyContent:"space-between"}}>
                <span style={{color:"#64748b"}}>{moveC>0?`${moveC} cartons`:""}{moveC>0&&moveL>0?" + ":""}{moveL>0?`${moveL} tins`:""} = {assignQty} {item.unit}</span>
                <span style={{color:afterRemaining<-0.001?"#f87171":afterRemaining<0.001?"#4ade80":"#fcd34d",fontWeight:"700"}}>{afterRemaining<0.001?"✓ Fully assigned":`${afterRemaining} ${item.unit} left`}</span>
              </div>}
            </>}
            <Field label="Rack">
              <select style={sl} value={postForm.rackId} onChange={e=>setPostForm({...postForm,rackId:e.target.value})}>
                <option value="">— Select rack —</option>
                {racks.map(r=><option key={r.id} value={r.id}>{r.name} ({r.levels} levels)</option>)}
              </select>
            </Field>
            {!postForm.rackId&&<div style={{fontSize:"11px",color:"#f59e0b",marginTop:"-6px",marginBottom:"8px"}}>Rack missing? Go to FG Stock → 🗺 Edit Layout → + Add Rack</div>}
            {rack&&<Field label={`Level (L1=bottom, L${rack.levels}=top)`}>
              <select style={sl} value={postForm.level} onChange={e=>setPostForm({...postForm,level:e.target.value})}>
                {Array.from({length:rack.levels},(_,i)=>rack.levels-i).map(l=><option key={l} value={l}>Level {l}</option>)}
              </select>
            </Field>}
          </>}
          {postForm.isDirect&&<div style={{background:"#1a0f00",border:"1px solid #92400e40",borderRadius:"8px",padding:"10px 12px",fontSize:"12px",color:"#fcd34d"}}>
            Logs the full remaining {remaining} {item.unit} as direct dispatch — not assigned to any rack.
          </div>}
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px",flexWrap:"wrap"}}>
            <Btn label="Cancel" onClick={()=>setPostModal(null)} outline color="#475569" small/>
            {/* Skip remainder option */}
            {remaining>0&&(postModal.item.remaining!=null)&&<Btn label="✓ Mark rest as done" onClick={()=>{
              const updater=postModal.isCB?setCbItems:setMovements;
              updater(prev=>prev.map((m,i)=>i===postModal.idx?{...m,posted:true}:m));
              setPostModal(null);showToast("Marked as fully assigned ✓");
            }} outline color="#475569" small/>}

// Print today's dispatch list — plain ES5, defined in script block but called here
function printDispatchList(groups,routeLabel,dateStr,fgProds){
  function calcVol(name,qty){
    if(!fgProds||!fgProds.length)return null;
    var n=name.toLowerCase().trim();
    var prod=null;
    for(var i=0;i<fgProds.length;i++){
      var pn=(fgProds[i].name||'').toLowerCase().trim();
      if(pn===n||pn.indexOf(n)!==-1||n.indexOf(pn)!==-1){prod=fgProds[i];break;}
    }
    if(!prod||!prod.size)return null;
    return (qty*prod.size).toFixed(2)+' '+(prod.unit||'L');
  }
  function calcCtn(name,qty){
    if(!fgProds||!fgProds.length)return '';
    var n=name.toLowerCase().trim();
    var prod=null;
    for(var i=0;i<fgProds.length;i++){
      var pn=(fgProds[i].name||'').toLowerCase().trim();
      if(pn===n||pn.indexOf(n)!==-1||n.indexOf(pn)!==-1){prod=fgProds[i];break;}
    }
    if(!prod||!prod.tinsPerCarton)return '';
    var tpc=prod.tinsPerCarton;
    var cartons=Math.floor(qty/tpc);
    var loose=qty%tpc;
    var parts=[];
    if(cartons>0)parts.push(cartons+' ctn');
    if(loose>0)parts.push(loose+' loose');
    return parts.join('+');
  }
  var volTotals={};
  groups.forEach(function(g){g.items.forEach(function(it){
    if(!fgProds)return;
    var v=calcVol(it.name,it.qty);
    if(!v)return;
    var parts=v.split(' ');var u=parts[1]||'L';var val=parseFloat(parts[0])||0;
    volTotals[u]=(volTotals[u]||0)+val;
  });});
  var volSummary='';
  Object.keys(volTotals).forEach(function(u){volSummary+=' &nbsp;|&nbsp; <b>'+volTotals[u].toFixed(2)+' '+u+'</b>';});
  var css='*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:4pt 6pt;font-size:8pt}@page{size:A4 portrait;margin:6mm}table{border-collapse:collapse;width:100%}tr{page-break-inside:avoid}td,th{padding:2pt 5pt}';
  var h='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Dispatch List<\/title><style>'+css+'<\/style><\/head><body>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:3pt;margin-bottom:4pt">';
  h+='<b style="font-size:11pt">VEEBEE — DISPATCH LIST<\/b>';
  h+='<span style="font-size:8pt"><b>'+dateStr+'<\/b> &nbsp;|&nbsp; Route: <b>'+routeLabel+'<\/b> &nbsp;|&nbsp; Customers: <b>'+groups.length+'<\/b>'+volSummary+'<\/span>';
  h+='<\/div>';
  h+='<table><tr><th style="border:1px solid #000;background:#e8e8e8;text-align:left;width:4%">#<\/th><th style="border:1px solid #000;background:#e8e8e8;text-align:left;width:20%">Customer<\/th><th style="border:1px solid #000;background:#e8e8e8;text-align:left;width:38%">Product<\/th><th style="border:1px solid #000;background:#e8e8e8;text-align:center;width:7%">Qty<\/th><th style="border:1px solid #000;background:#e8e8e8;text-align:center;width:12%">Cartons<\/th><th style="border:1px solid #000;background:#e8e8e8;text-align:center;width:8%">Volume<\/th><th style="border:1px solid #000;background:#e8e8e8;text-align:left;width:11%">Order No<\/th><\/tr>';
  groups.forEach(function(g,gi){
    g.items.forEach(function(it,ii){
      var vol=calcVol(it.name,it.qty)||'';
      var ctn=calcCtn(it.name,it.qty);
      var bg=gi%2===0?'#fff':'#f5f5f5';
      h+='<tr style="background:'+bg+'">';
      if(ii===0)h+='<td style="border:1px solid #000;font-weight:700;vertical-align:top" rowspan="'+g.items.length+'">'+(gi+1)+'<\/td><td style="border:1px solid #000;font-size:7.5pt;vertical-align:top" rowspan="'+g.items.length+'"><b>'+g.partyName+'<\/b><br><span style="color:#666;font-size:7pt">'+(g.isDirect?'Direct':g.transport)+'<\/span><\/td>';
      h+='<td style="border:1px solid #000">'+it.name+'<\/td><td style="border:1px solid #000;text-align:center;font-weight:700">'+it.qty+'<\/td><td style="border:1px solid #000;text-align:center;color:#555;font-size:7.5pt">'+ctn+'<\/td><td style="border:1px solid #000;text-align:center;color:#333">'+vol+'<\/td><td style="border:1px solid #000;font-size:7pt;color:#555">'+it.voucherNo+'<\/td><\/tr>';
    });
  });
  h+='<\/table>';
  h+='<div style="margin-top:6pt;font-size:7pt;display:flex;justify-content:space-between;border-top:1px solid #ccc;padding-top:3pt"><span>GCC Operations Hub<\/span><span>Prepared by: _________________________ &nbsp; Checked by: _________________________<\/span><\/div>';
  h+='<\/body><\/html>';
  var w=window.open('','_blank');w.document.write(h);w.document.close();setTimeout(function(){w.print();},400);
}

function DispatchHistoryReport({normT,showToast}){
  const todayISO=new Date().toISOString().slice(0,10);
  const [mode,setMode]=useState("single"); // "single"|"range"
  const [reportDate,setReportDate]=useState(todayISO);
  const [fromDate,setFromDate]=useState(new Date(Date.now()-6*24*60*60*1000).toISOString().slice(0,10));
  const [toDate,setToDate]=useState(todayISO);
  const [report,setReport]=useState(null);
  const [reports,setReports]=useState([]);
  const [loading,setLoading]=useState(false);
  const [routeFilter,setRouteFilter]=useState("All");
  const [transportFilter,setTransportFilter]=useState("All");

  const loadSingle=async(date)=>{
    setLoading(true);
    try{const doc=await C("dispatch_reports").doc("report_"+date).get();setReport(doc.exists?{id:doc.id,...doc.data()}:null);}
    catch(e){showToast("Error: "+e.message,"error");}
    setLoading(false);
  };
  const loadRange=async()=>{
    setLoading(true);
    try{const snap=await C("dispatch_reports").where("date",">=",fromDate).where("date","<=",toDate).orderBy("date","desc").get();setReports(snap.docs.map(d=>({id:d.id,...d.data()})));}
    catch(e){showToast("Error: "+e.message,"error");}
    setLoading(false);
  };

  useEffect(()=>{if(mode==="single")loadSingle(reportDate);else loadRange();},[mode,reportDate,fromDate,toDate]);

  // Filter helpers
  const filterEntry=e=>{
    if(routeFilter!=="All"&&e.route!==routeFilter)return false;
    return true;
  };

  // Single mode data
  const entries=(report?.entries||[]).filter(filterEntry);
  const reversals=(report?.reversals||[]);
  const allRoutesSingle=[...new Set((report?.entries||[]).map(e=>e.route).filter(Boolean))].sort();
  const allTransSingle=[...new Set((report?.entries||[]).map(e=>e.transport).filter(t=>t&&!["DIRECT","direct","Direct"].includes(t)))].sort();

  // Range mode data
  const filteredReports=reports.map(r=>({...r,entries:(r.entries||[]).filter(filterEntry)})).filter(r=>r.entries.length>0||(r.reversals||[]).length>0);
  const allRoutesRange=[...new Set(reports.flatMap(r=>(r.entries||[]).map(e=>e.route).filter(Boolean)))].sort();
  const allTransRange=[...new Set(reports.flatMap(r=>(r.entries||[]).map(e=>e.transport).filter(t=>t&&!["DIRECT","direct","Direct"].includes(t))))].sort();

  // Totals
  const calcTotals=(entriesList)=>{const vols={};let qty=0;entriesList.forEach(e=>(e.items||[]).forEach(it=>{qty+=it.qty||0;if(it.vol)vols[it.vol.unit]=(vols[it.vol.unit]||0)+it.vol.vol;}));return{qty,vols};};

    });

  })();
  const [loading,setLoading]=useState(true);

  const [subTab,setSubTab]=useState("pending"); // "pending"|"dispatch"|"setup"

  const [search,setSearch]=useState("");

  const [expandedCustomer,setExpandedCustomer]=useState(null);

  const [customerSearch,setCustomerSearch]=useState("");

  const [custForm,setCustForm]=useState({customer:"",transport:"",route:"",isDirect:false});
  const [custSaving,setCustSaving]=useState(false);
  const [unknownCusts,setUnknownCusts]=useState(null);
  const [pendingImport,setPendingImport]=useState(null);
  const [savingUnknown,setSavingUnknown]=useState(false);

  // Normalise transporter name — ignore dots, extra spaces, case
  const normT=s=>String(s||"").toLowerCase().replace(/[.\s]+/g," ").trim();

  // Core import save logic — separated so it can be called after unknown-customer modal
  const _doImport=async(sanitisedMap)=>{
    const incomingSet=new Set(Object.keys(sanitisedMap));
    const pendingInDB=orders.filter(o=>o.status==="Pending"||o.status==="Partial");
    let closedCount=0;
    for(const dbOrder of pendingInDB){
      if(!incomingSet.has(dbOrder.id)){
        await C("orders").doc(dbOrder.id).update({status:"Pre-closed",preClosedAt:ts(),preClosedNote:"Not found in latest Tally export — likely pre-closed by HO"});
        closedCount++;
      }
    }
    let newCount=0,updCount=0;
    const alreadyDispatched=[]; // vouchers that were fully dispatched — warn team
    const unknownItemsFound={}; // local accumulator — don't use state inside async loop

    for(const [key,order] of Object.entries(sanitisedMap)){
      const docRef=C("orders").doc(key);
      const existing=orders.find(o=>o.id===key);
      if(existing){
        // ── Guard: if order is already fully dispatched, do NOT reset it ──
        if(existing.status==="Dispatched"){
          alreadyDispatched.push(order.voucherNo||key);
          // Update metadata only — preserve all dispatch state
          await docRef.update({partyName:order.partyName,route:order.route,transport:order.transport,isDirect:order.isDirect,lastImportedAt:ts()});
          continue;
        }
        // For Partial orders — preserve dispatched items, only update balance on pending items
        const mergedItems=order.items.map(ni=>{
          const prev=(existing.items||[]).find(p=>normalize(p.name)===normalize(ni.name));
          if(!prev)return ni;
          // If this specific item is already dispatched, keep its current state entirely
          if(prev.status==="Dispatched")return prev;
          // If partially dispatched, preserve dispatched qty; update balance from Tally
          return {...ni,dispatchedQty:prev.dispatchedQty||0,status:prev.status||"Pending",
            stagedForTransport:prev.stagedForTransport||false,stagedAt:prev.stagedAt||null,
            dispatchConfirmed:prev.dispatchConfirmed||false,dispatchConfirmedAt:prev.dispatchConfirmedAt||null,
            lastDispatchedAt:prev.lastDispatchedAt||null};
        });
        const allDone=mergedItems.every(i=>i.status==="Dispatched");
        const anyDone=mergedItems.some(i=>i.status==="Dispatched"||i.status==="Partial");
        await docRef.update({...order,items:san(mergedItems),status:allDone?"Dispatched":anyDone?"Partial":"Pending",lastImportedAt:ts()});
        updCount++;
      }else{
        // Check if any items are not in FG catalogue — use local accumulator (state reads are stale)
        const unknownItems=(order.items||[]).filter(i=>!fgProducts.some(p=>normalize(p.name)===normalize(i.name)||normalize(i.name).includes(normalize(p.name))));
        unknownItems.forEach(i=>{
          if(!unknownItemsFound[i.name]){
            const lname=i.name.toLowerCase();
            const guessedPack=lname.includes("2pk")||lname.includes("2 pk")||lname.includes("combo")||lname.includes("twin")?"2-pack":"single";
            const sizeMatch=i.name.match(/(\d+(?:\.\d+)?)\s*(l|ltr|litre|ml|kg|g)\b/i);
            const guessedSize=sizeMatch?parseFloat(sizeMatch[1]):"";
            unknownItemsFound[i.name]={size:guessedSize,tpc:"",packType:guessedPack};
          }
        });
        await docRef.set({...order,importedBy:user.email,importedAt:ts(),lastImportedAt:ts()});
        newCount++;
      }
    }
    // Trigger prompt for new items — set both states at once
    if(Object.keys(unknownItemsFound).length>0){
      setNewItemForms(unknownItemsFound); // pre-filled with guessed values
      setNewItemsPrompt({items:Object.keys(unknownItemsFound)});
    }
    let msg=`Import done: ${newCount} new · ${updCount} updated · ${closedCount} auto-closed ✓`;
    if(alreadyDispatched.length>0){
      showToast(msg,"success");
      setTimeout(()=>showToast(`⚠ ${alreadyDispatched.length} order${alreadyDispatched.length!==1?"s":""} already dispatched — skipped: ${alreadyDispatched.slice(0,3).join(", ")}${alreadyDispatched.length>3?" …":""}. Please verify Tally export.`,"error"),600);
    }else{
      showToast(msg);
    }
  };
  const [fgProducts,setFgProducts]=useState([]);
  const [quickAddCustomer,setQuickAddCustomer]=useState(null);
  const [newItemsPrompt,setNewItemsPrompt]=useState(null);
  const [newItemForms,setNewItemForms]=useState({});
  const [confirmingDispatch,setConfirmingDispatch]=useState(null);
  const [transporterSuggest,setTransporterSuggest]=useState(null);

  // Auto-clear transporter suggestion if those orders are reverted out of today's dispatch
  useEffect(()=>{
    if(!transporterSuggest)return;
    const stillDispatchedToday=todayDispatched.some(g=>normTKey(g.transport)===normTKey(transporterSuggest.transport));
    if(!stillDispatchedToday)setTransporterSuggest(null);
  },[todayDispatched]);
  const [printRouteFilter,setPrintRouteFilter]=useState("All");
  const [dispatchRouteFilter,setDispatchRouteFilter]=useState("All");
  const [dispatchDeliveryFilter,setDispatchDeliveryFilter]=useState("All");

  useEffect(()=>{
    const u1=C("orders").orderBy("orderDate","asc").onSnapshot(
      s=>{setOrders(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},
      ()=>{C("orders").onSnapshot(s=>{setOrders(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);});});
    const u2=C("settings").doc("customerTransport").onSnapshot(snap=>{
      if(snap.exists){const d=snap.data();setCustomerMap(d.map||{});setRoutes(d.routes||[]);}
    },()=>{});
    const u3=C("fg_products").onSnapshot(s=>{setFgProducts(s.docs.map(d=>({id:d.id,...d.data()})));},()=>{});
    return ()=>{u1();u2();u3();};
  },[]);

  // ── Import Transport List ──
  const downloadTransportFormat=async()=>{
    await loadXLSX();
    const XLSX=window.XLSX;
    const rows=[
      ["Particulars","Transport","Route"],
      ["ABC TRADERS","JANSEVA TRANSPORT","BHIWANDI"],
      ["XYZ PAINTS","DIRECT","AHMEDNAGAR"],
      ["HARSHIT AGENCIES","VIJAY TRANSPORT","PUNE"],
      ["SAMPLE CUSTOMER","DIRECT","NASHIK"],
    ];
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const ck="!cols";ws[ck]=[{wch:35},{wch:25},{wch:20}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Customer Transport List");
    XLSX.writeFile(wb,"VEEBEE_Transport_List_Format.xlsx");
  };

  const importTransportList=async(file)=>{
    setTransportParsing(true);
    try{
      await loadXLSX();const XLSX=window.XLSX;
      const buf=await new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsArrayBuffer(file);});
      const wb=XLSX.read(buf,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
      const map={};const routeSet=new Set();
      for(let i=1;i<raw.length;i++){
        const row=raw[i];if(!row||!row[0])continue;
        const customer=String(row[0]).trim();
        const transport=String(row[1]||"").trim();
        const route=String(row[2]||"").trim();
        if(!customer||!route)continue;
        const isDirect=transport.toLowerCase().includes("direct");
        map[normalize(customer)]={customer,transport,route,isDirect};
        if(route)routeSet.add(route);
      }
      const routeArr=Array.from(routeSet).sort();
      await C("settings").doc("customerTransport").set({map,routes:routeArr,importedAt:ts(),importedBy:user.email});
      showToast(`Transport list saved — ${Object.keys(map).length} customers, ${routeArr.length} routes ✓`);
    }catch(e){showToast("Error: "+e.message,"error");}
    setTransportParsing(false);
  };

  // ── Save customer manually ──
  const saveCustomer=async()=>{
    if(!custForm.customer.trim()||!custForm.route.trim())return showToast("Customer name and route required","error");
    setCustSaving(true);
    try{
      const isDirect=custForm.isDirect||(custForm.transport||"").toLowerCase().includes("direct");
      const normalizedTransport=isDirect?"DIRECT":(custForm.transport||"").trim().toUpperCase().replace(/\.+/g,"").replace(/\s+/g," ");
      const key=normalize(custForm.customer.trim());
      const newEntry={customer:custForm.customer.trim(),transport:normalizedTransport,route:custForm.route.trim(),isDirect};
      const newMap={...customerMap,[key]:newEntry};
      const routeSet=new Set(Object.values(newMap).map(c=>c.route).filter(Boolean));
      await C("settings").doc("customerTransport").set({map:newMap,routes:Array.from(routeSet).sort(),updatedAt:ts()},{merge:true});
      // Backfill any pending orders for this customer that still show Unknown
      const snap=await C("orders").where("status","in",["Pending","Partial"]).get();
      const batch=firebase.firestore().batch();
      let backfilled=0;
      snap.docs.forEach(doc=>{
        const d=doc.data();
        if(normalize(d.partyName)===key&&(d.route==="Unknown"||d.transport==="Unknown"||!d.route)){
          batch.update(doc.ref,{route:newEntry.route,transport:newEntry.transport,isDirect:newEntry.isDirect});
          backfilled++;
        }
      });
      if(backfilled>0){await batch.commit();showToast(`${editingCustomer?"Updated":"Added"} customer + ${backfilled} pending order${backfilled!==1?"s":""} updated ✓`);}
      else showToast(editingCustomer?"Customer updated ✓":"Customer added ✓");

      // Check if new customer/transporter is missing from delivery sequence — nudge to update
      if(!editingCustomer){
        const seqMap=deliverySequence.transport||{};
        const seqDirect=deliverySequence.direct||{};
        if(!isDirect){
          const transInSeq=Object.keys(seqMap).some(k=>k===normalize(normalizedTransport));
          if(!transInSeq&&Object.keys(seqMap).length>0){
            setSeqWarning({msg:`"${normalizedTransport}" is not in the transport delivery sequence. Add it in Transport Prep → ⬆ Upload sequence.`,type:"transport"});
          }
        }else{
          const routeKey=normalize(custForm.route.trim()||"all");
          const seqForRoute=seqDirect[routeKey]||seqDirect["all"]||{};
          const custInSeq=Object.keys(seqForRoute).some(k=>k===normalize(custForm.customer.trim()));
          if(!custInSeq&&Object.keys(seqForRoute).length>0){
            setSeqWarning({msg:`"${custForm.customer.trim()}" is not in the ${custForm.route} delivery sequence. Add it in Direct Prep → ⬆ Upload sequence.`,type:"direct"});
          }

    }catch(e){showToast("Error: "+e.message,"error");}

  };
  const deleteCustomer=async(key)=>{
    if(!confirm("Remove this customer?"))return;
    const newMap={...customerMap};delete newMap[key];
    const routeSet=new Set(Object.values(newMap).map(c=>c.route).filter(Boolean));
    await C("settings").doc("customerTransport").set({map:newMap,routes:Array.from(routeSet).sort()},{merge:true});
    showToast("Removed","error");
  };

  // ── Sanitise voucher number for Firestore doc ID ──
  const sanitise=k=>k.replace(/\//g,"-").replace(/\s+/g,"_").replace(/[^a-zA-Z0-9_\-.]/g,"").slice(0,400);

  // ── Import Tally Sales Orders ──
  const importOrders=async(file)=>{
    setParsing(true);
    try{
      await loadXLSX();const XLSX=window.XLSX;
      const buf=await new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsArrayBuffer(file);});
      const wb=XLSX.read(buf,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
      // Headers row 11, data from row 14
      // Col: 0=Date 1=OrderNo 2=PartyName 3=Item 4=OrderedQty 5=BalanceQty 6=Rate 7=Disc 8=Value 9=DueOn
      const orderMap={};
      for(let i=14;i<raw.length;i++){
        const row=raw[i];if(!row)continue;
        const dateRaw=row[0],orderNo=String(row[1]||"").trim(),party=String(row[2]||"").trim(),item=String(row[3]||"").trim();
        const balanceQty=parseFloat(row[5])||0;
        if(!orderNo||!party||!item||balanceQty<=0)continue;
        if(party.toLowerCase().includes("total"))continue;
        let dateStr="";
        if(dateRaw instanceof Date)dateStr=dateRaw.toISOString().slice(0,10);
        else if(dateRaw&&String(dateRaw).includes("-"))dateStr=String(dateRaw).slice(0,10);
        else if(typeof dateRaw==="number"){try{const d=new Date((dateRaw-25569)*86400000);dateStr=d.toISOString().slice(0,10);}catch(e){}}
        const cInfo=customerMap[normalize(party)]||null;
        if(!orderMap[orderNo]){
          orderMap[orderNo]={voucherNo:orderNo,partyName:party,orderDate:dateStr,
            route:cInfo?.route||"Unknown",transport:cInfo?.transport||"Unknown",isDirect:cInfo?.isDirect||false,
            items:[],status:"Pending"};
        }
        orderMap[orderNo].items.push({name:item,balanceQty,rate:parseFloat(row[6])||0,discount:parseFloat(row[7])||0,value:parseFloat(row[8])||0,dueOn:String(row[9]||"").slice(0,10),dispatchedQty:0,status:"Pending"});
      }
      const sanitisedMap={};
      for(const [rawKey,order] of Object.entries(orderMap)){
        const safeKey=sanitise(rawKey)||("order_"+Date.now()+"_"+Math.random().toString(36).slice(2));
        sanitisedMap[safeKey]={...order,voucherNo:order.voucherNo||rawKey};
      }

      // Detect customers not in transport list — collect unique unknowns
      const unknownMap={};
      Object.values(sanitisedMap).forEach(o=>{
        if((o.route==="Unknown"||!o.route)&&!unknownMap[normalize(o.partyName)]){
          unknownMap[normalize(o.partyName)]={partyName:o.partyName,route:"",transport:"",isDirect:false};
        }
      });
      if(Object.keys(unknownMap).length>0){
        // Pause import — show modal to fill in routes for new customers
        setPendingImport({sanitisedMap});
        setUnknownCusts(Object.values(unknownMap));
        setParsing(false);
        return;
      }
      await _doImport(sanitisedMap);
    }catch(e){showToast("Parse error: "+e.message,"error");}
    setParsing(false);
  };

  // ── Confirm dispatch for a customer group (all selected items across orders) ──
  const confirmDispatch=async(customerOrders)=>{
    const keys=Object.keys(dispatchForm);
    if(!keys.length)return showToast("Select items to dispatch","error");

          const df=dispatchForm[order.id+"__"+idx];
          if(!df)return item;
          const dispQty=df.type==="full"?item.balanceQty:(parseFloat(df.qty)||0);

          const newDispatched=(item.dispatchedQty||0)+dispQty;
          const status=newBalance<=0?"Dispatched":"Partial";

        });
        const allDone=updatedItems.every(i=>i.status==="Dispatched");
        const anyDone=updatedItems.some(i=>i.status==="Dispatched"||i.status==="Partial");
        await C("orders").doc(order.id).update({items:san(updatedItems),status:allDone?"Dispatched":anyDone?"Partial":"Pending",updatedAt:ts()});
      }
      setDispatchForm({});setExpandedCustomer(null);
      showToast("Dispatch recorded ✓ — check Today's Dispatch tab");
      // Suggest other orders with same transporter
      const dispatchedGroup=customerGroups.find(g=>g.orders.some(o=>customerOrders.some(co=>co.id===o.id)));
      if(dispatchedGroup&&dispatchedGroup.transport&&!dispatchedGroup.isDirect){

        );
        if(sameTransporter.length>0)setTransporterSuggest({partyName:dispatchedGroup.partyName,transport:dispatchedGroup.transport,others:sameTransporter});
      }
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);

  // ── Calculate total volume (L or KG) from FG catalogue ──
  const calcVolume=(itemName,qty)=>{
    const prod=fgProducts.find(p=>normalize(p.name)===normalize(itemName)||normalize(itemName).includes(normalize(p.name)));
    if(!prod||!prod.size)return null;
    return {vol:parseFloat((qty*prod.size).toFixed(2)),unit:prod.unit||"L"};
  };

  const calcCartons=(itemName,qty)=>{
    const prod=fgProducts.find(p=>normalize(p.name)===normalize(itemName)||normalize(itemName).includes(normalize(p.name)));
    if(!prod||!prod.tinsPerCarton)return null;
    const cartons=Math.floor(qty/prod.tinsPerCarton);
    const loose=qty%(prod.tinsPerCarton);
    return {cartons,loose,tpc:prod.tinsPerCarton};
  };

  // ── Reverse a confirmed dispatch within 24h ──
  const [reverseForm,setReverseForm]=useState(null);
  const [reverseSaving,setReverseSaving]=useState(false);
  const [dispatched48hDateFilter,setDispatched48hDateFilter]=useState("all");
  const [dispatched48hTypeFilter,setDispatched48hTypeFilter]=useState("All"); // All/Direct/Transport
  const todayStr=new Date().toISOString().slice(0,10);
  const [dispatchDateChoice,setDispatchDateChoice]=useState("today");
  const dispatchDateStr=dispatchDateChoice==="tomorrow"?new Date(Date.now()+24*60*60*1000).toISOString().slice(0,10):todayStr;

  const openReverseForm=(partyName,items)=>{
    setReverseForm({partyName,items:items.map(i=>({...i,reverseQty:""}))});
  };

  const reverseEntireOrder=async(partyName,items)=>{
    // Pre-fill all items with max quantity and immediately reverse
    setReverseForm({partyName,items:items.map(i=>({...i,reverseQty:String(i.qty)}))});
    // Use a small timeout to let state settle, then auto-submit
    setTimeout(async()=>{
      // State won't be updated yet in closure, so call reverseDispatch directly with the filled form
      if(!items.length)return;
      setReverseSaving(true);
      try{
        const orderIds=[...new Set(items.map(i=>i.orderId))];
        const firstOrderItem=items[0];
        const firstOrder=orders.find(o=>o.id===firstOrderItem.orderId);
        const firstFi=firstOrder?(firstOrder.items||[]).find(i=>normalize(i.name)===normalize(firstOrderItem.name)):null;
        const confirmedAtRaw=firstFi?.dispatchConfirmedAt;
        const confirmedAtMs=confirmedAtRaw?typeof confirmedAtRaw==="string"?new Date(confirmedAtRaw).getTime():confirmedAtRaw.toMillis?confirmedAtRaw.toMillis():confirmedAtRaw.seconds?confirmedAtRaw.seconds*1000:0:0;
        const isGracePeriod=confirmedAtMs>0&&(Date.now()-confirmedAtMs<2*60*60*1000);
        for(const orderId of orderIds){
          const orderDoc=await C("orders").doc(orderId).get();
          if(!orderDoc.exists)continue;
          const data=orderDoc.data();
          const hasTransporter=data.transport&&normalize(data.transport||"")!=="direct"&&normalize(data.transport||"")!=="";
          const goToPrep=!data.isDirect||hasTransporter; // always stage transport orders regardless of grace period
          const updatedItems=(data.items||[]).map(item=>{
            const rev=items.find(i=>i.orderId===orderId&&normalize(i.name)===normalize(item.name));
            if(!rev)return item;
            const newDispatched=0;const newBalance=(item.balanceQty||0)+rev.qty;
            return {...item,dispatchedQty:0,balanceQty:newBalance,
              dispatchConfirmed:false,dispatchConfirmedAt:null,lastDispatchedAt:null,
              stagedForTransport:goToPrep,
              stagedAt:goToPrep?new Date().toISOString():null,
              stagedBy:goToPrep?user.email:null,
              status:"Pending"};
          });
          await C("orders").doc(orderId).update({items:san(updatedItems),status:"Pending",updatedAt:ts()});
        }
        if(isGracePeriod){
          showToast(`${partyName} — fully reversed (grace period) ✓`);
        } else {
          showToast(`${partyName} — entire order reversed ✓`);
          try{
            const dispDate=firstFi?.lastDispatchedAt||dispatchDateStr||todayStr;
            const reportId="report_"+dispDate;
            const reversedItems=items.map(i=>({name:i.name,qty:i.qty,voucherNo:i.voucherNo}));
            const reportDoc=await C("dispatch_reports").doc(reportId).get();
            const reversalEntry={partyName,items:reversedItems,reversedAt:new Date().toISOString(),reversedBy:user.email};
            if(reportDoc.exists)await C("dispatch_reports").doc(reportId).update({reversals:[...(reportDoc.data().reversals||[]),reversalEntry],updatedAt:new Date().toISOString()});
            else await C("dispatch_reports").doc(reportId).set({date:dispDate,entries:[],reversals:[reversalEntry],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),createdBy:user.email});
          }catch(e){/* best-effort */}
        }
        setReverseForm(null);
      }catch(e){showToast("Error: "+e.message,"error");}
      setReverseSaving(false);
    },50);
  };

  const reverseDispatch=async()=>{
    if(!reverseForm)return;
    setReverseSaving(true);
    try{
      const orderIds=[...new Set(reverseForm.items.map(i=>i.orderId))];
      // Capture dispatch date and confirmed time BEFORE any Firestore writes (avoid race condition)
      const firstItem=reverseForm.items.find(i=>parseFloat(i.reverseQty)>0);
      const firstOrder=firstItem?orders.find(o=>o.id===firstItem.orderId):null;
      const firstFi=firstOrder?(firstOrder.items||[]).find(i=>normalize(i.name)===normalize(firstItem.name)):null;
      const originalDispatchDate=firstFi?.lastDispatchedAt||dispatchDateStr||todayStr; // capture NOW
      const confirmedAtRaw=firstFi?.dispatchConfirmedAt;
      const confirmedAtMs=confirmedAtRaw?typeof confirmedAtRaw==="string"?new Date(confirmedAtRaw).getTime():confirmedAtRaw.toMillis?confirmedAtRaw.toMillis():confirmedAtRaw.seconds?confirmedAtRaw.seconds*1000:0:0;
      const isGracePeriod=confirmedAtMs>0&&(Date.now()-confirmedAtMs<2*60*60*1000);

      for(const orderId of orderIds){
        const orderDoc=await C("orders").doc(orderId).get();
        if(!orderDoc.exists)continue;
        const data=orderDoc.data();
        // Go to Transport Prep if order has a transporter (or is non-direct) — regardless of grace period
        const hasTransporter=data.transport&&normalize(data.transport||"")!=="direct"&&normalize(data.transport||"")!=="";
        const goToTransportPrep=!data.isDirect||hasTransporter;
        const updatedItems=(data.items||[]).map(item=>{
          const rev=reverseForm.items.find(i=>i.orderId===orderId&&normalize(i.name)===normalize(item.name));
          if(!rev)return item;
          const rQty=Math.min(parseFloat(rev.reverseQty)||0,rev.qty);
          if(rQty<=0)return item;
          const newDispatched=Math.max(0,(item.dispatchedQty||0)-rQty);
          const newBalance=(item.balanceQty||0)+rQty;
          const fullyReversed=newDispatched<=0;
          const shouldStage=fullyReversed&&goToTransportPrep; // always stage if transport order
          return {...item,
            dispatchedQty:newDispatched,balanceQty:newBalance,
            dispatchConfirmed:fullyReversed?false:item.dispatchConfirmed,
            dispatchConfirmedAt:fullyReversed?null:item.dispatchConfirmedAt,
            lastDispatchedAt:fullyReversed?null:item.lastDispatchedAt,
            stagedForTransport:shouldStage,
            stagedAt:shouldStage?new Date().toISOString():null,
            stagedBy:shouldStage?user.email:null,
            status:fullyReversed?"Pending":newBalance<=0?"Dispatched":"Partial"
          };
        });
        const anyActive=updatedItems.some(i=>i.status==="Dispatched"||i.status==="Partial");
        await C("orders").doc(orderId).update({items:san(updatedItems),status:anyActive?"Partial":"Pending",updatedAt:ts()});
      }

      if(isGracePeriod){
        showToast(`${reverseForm.partyName} — reversed within 2h grace period. Removed from report ✓`);
        // Remove entry from dispatch report entirely (as if dispatch never happened)
        try{
          const reportId="report_"+originalDispatchDate;
          const reportDoc=await C("dispatch_reports").doc(reportId).get();
          if(reportDoc.exists){
            const existing=reportDoc.data();
            const updatedEntries=(existing.entries||[]).map(e=>{
              if(normalize(e.partyName)!==normalize(reverseForm.partyName))return e;
              // Remove fully reversed items; keep partial quantities
              const updItems=(e.items||[]).map(it=>{
                const rev=reverseForm.items.find(r=>normalize(r.name)===normalize(it.name));
                if(!rev)return it;
                const newQty=Math.max(0,(it.qty||0)-(parseFloat(rev.reverseQty)||0));
                return newQty>0?{...it,qty:newQty}:null;
              }).filter(Boolean);
              return updItems.length>0?{...e,items:updItems}:null;
            }).filter(Boolean);
            await C("dispatch_reports").doc(reportId).update({entries:updatedEntries,updatedAt:new Date().toISOString()});
          }
        }catch(e){/* best-effort */}
      }else{
        showToast(`${reverseForm.partyName} — dispatch reversed ✓ · Returned to Transport Prep`);
        try{
          const reportId="report_"+originalDispatchDate;
          const reversedItems=reverseForm.items.filter(i=>parseFloat(i.reverseQty)>0).map(i=>({name:i.name,qty:parseFloat(i.reverseQty)||0,voucherNo:i.voucherNo}));
          if(reversedItems.length>0){
            const reportDoc=await C("dispatch_reports").doc(reportId).get();
            const reversalEntry={partyName:reverseForm.partyName,items:reversedItems,reversedAt:new Date().toISOString(),reversedBy:user.email};
            if(reportDoc.exists)await C("dispatch_reports").doc(reportId).update({reversals:[...(reportDoc.data().reversals||[]),reversalEntry],updatedAt:new Date().toISOString()});
            else await C("dispatch_reports").doc(reportId).set({date:originalDispatchDate,entries:[],reversals:[reversalEntry],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),createdBy:user.email});
          }
        }catch(e){/* best-effort */}
      }
      setReverseForm(null);
    }catch(e){showToast("Error: "+e.message,"error");}
    setReverseSaving(false);
  };

  // ── Confirm ALL unconfirmed customers in today's dispatch ──
  const confirmAllDispatches=async()=>{
    const unconfirmed=filteredToday.filter(g=>g.items.some(i=>!i.confirmed));
    if(!unconfirmed.length)return showToast("All dispatches already confirmed","error");
    setSaving(true);
    try{
      for(const group of unconfirmed){
        const pendingItems=group.items.filter(i=>!i.confirmed);
        await finaliseDispatch(group.partyName,pendingItems);
      }
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // ── Finalise dispatch for a customer ──
  const [dispatchReports,setDispatchReports]=useState([]);
  useEffect(()=>{
    if(!isAdmin)return;
    const cutoff=new Date(Date.now()-48*60*60*1000).toISOString();
    const unsub=C("dispatch_reports").where("createdAt",">=",cutoff).orderBy("createdAt","desc").onSnapshot(
      s=>setDispatchReports(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});
    return unsub;
  },[isAdmin]);

  const finaliseDispatch=async(partyName,items)=>{
    setConfirmingDispatch(partyName);
    try{
      const orderIds=[...new Set(items.map(i=>i.orderId))];
      const confirmedAt=new Date().toISOString();
      for(const orderId of orderIds){
        const orderDoc=await C("orders").doc(orderId).get();
        if(!orderDoc.exists)continue;
        const data=orderDoc.data();
        const updatedItems=(data.items||[]).map(item=>{
          const matched=items.find(i=>i.orderId===orderId&&normalize(i.name)===normalize(item.name));
          return matched?{...item,dispatchConfirmed:true,dispatchConfirmedAt:confirmedAt,lastDispatchedAt:dispatchDateStr}:item;
        });
        const allDone=updatedItems.every(i=>i.status==="Dispatched"||i.balanceQty<=0);
        await C("orders").doc(orderId).update({items:san(updatedItems),status:allDone?"Dispatched":"Partial",updatedAt:ts()});
      }
      // Save dispatch report — get route/transport from the order

      const volTotals={};
      items.forEach(item=>{const v=calcVolume(item.name,item.qty);if(v){volTotals[v.unit]=(volTotals[v.unit]||0)+v.vol;}});
      const sampleOrder=orders.find(o=>items.some(i=>i.orderId===o.id));
      const entry={partyName,route:sampleOrder?.route||"",transport:sampleOrder?.transport||"",isDirect:sampleOrder?.isDirect||false,items:items.map(i=>{const ord=orders.find(o=>o.id===i.orderId);return {name:i.name,qty:i.qty,vol:calcVolume(i.name,i.qty),voucherNo:i.voucherNo,orderDate:ord?.orderDate||""};}) ,confirmedAt,volTotals};
      if(reportDoc.exists){
        const existing=reportDoc.data();
        const entries=[...(existing.entries||[]).filter(e=>e.partyName!==partyName),entry];
        await C("dispatch_reports").doc(reportId).update({entries,updatedAt:confirmedAt});
      }else{
        await C("dispatch_reports").doc(reportId).set({date:dispatchDateStr,entries:[entry],createdAt:confirmedAt,updatedAt:confirmedAt,createdBy:user.email});
      }
      showToast(`${partyName} — dispatch confirmed ✓`);
      setPrintRouteFilter("All");
    }catch(e){showToast("Error: "+e.message,"error");}
    setConfirmingDispatch(null);
  };

  const STATUS_COLOR={Pending:"#f59e0b",Partial:"#3b82f6",Dispatched:"#22c55e","Pre-closed":"#475569"};

  // ── Group orders by customer for pending view ──
  const pendingOrders=orders.filter(o=>["Pending","Partial"].includes(o.status)&&(o.items||[]).some(i=>i.balanceQty>0&&i.status!=="Dispatched"&&!i.stagedForTransport));
  const customerGroups=(()=>{
    const map={};
    const filtered=pendingOrders.filter(o=>{
      if(routeFilter==="Unknown"){if(o.route!=="Unknown"&&o.route)return false;}
      else if(routeFilter!=="All"&&o.route!==routeFilter)return false;

      if(deliveryFilter==="Transport"&&o.isDirect)return false;
      if(search.trim()&&!normalize(o.partyName||"").includes(normalize(search))&&!normalize(o.voucherNo||"").includes(normalize(search))&&!(o.items||[]).some(i=>normalize(i.name||"").includes(normalize(search))))return false;

      const bMin=b.orders.map(o=>o.orderDate||'9999').sort()[0];
      return aMin.localeCompare(bMin); // oldest order date first
    });
  })();

  // ── Unconfirmed dispatches — all items dispatched but not yet confirmed ──
  const todayDispatchedAll=(()=>{
    const map={};
    orders.forEach(o=>{
      (o.items||[]).forEach((item)=>{
        if(!item.dispatchConfirmed&&item.lastDispatchedAt&&(item.dispatchedQty||0)>0&&!item.stagedForTransport){
          const k=normalize(o.partyName);
          if(!map[k])map[k]={partyName:o.partyName,route:o.route,transport:o.transport,isDirect:o.isDirect,items:[]};
          const vol=calcVolume(item.name,item.dispatchedQty||0);
          map[k].items.push({name:item.name,qty:item.dispatchedQty||0,vol,voucherNo:o.voucherNo,orderId:o.id,confirmed:false,canReverse:false,confirmedAt:null,dispatchDate:item.lastDispatchedAt});
        }
      });

    return Object.values(map).sort((a,b)=>a.partyName.localeCompare(b.partyName));
  })();

  // Split: unconfirmed → Today's Dispatch; confirmed (48h) → Dispatched tab
  const todayDispatched=todayDispatchedAll.map(g=>({...g,items:g.items.filter(i=>!i.confirmed)})).filter(g=>g.items.length>0);
  const dispatched48h=(()=>{
    const now=Date.now();
    const WINDOW_MS=48*60*60*1000; // 48h from start of dispatch date
    const map={};
    orders.forEach(o=>{
      (o.items||[]).forEach(item=>{
        if(!item.dispatchConfirmed)return;
        // Use lastDispatchedAt DATE (midnight) as window start — not the confirmed timestamp
        const dispDate=item.lastDispatchedAt; // "YYYY-MM-DD"
        if(!dispDate)return;
        const windowStart=new Date(dispDate+"T00:00:00").getTime();
        if(now-windowStart>WINDOW_MS)return; // outside 48h window from dispatch date
        const cat=item.dispatchConfirmedAt;
        const confirmedAt=cat?typeof cat==="string"?new Date(cat).getTime():cat.toMillis?cat.toMillis():cat.seconds?cat.seconds*1000:0:0;

        const k=normalize(o.partyName);
        if(!map[k])map[k]={partyName:o.partyName,route:o.route,transport:o.transport,isDirect:o.isDirect,items:[]};
        const vol=calcVolume(item.name,item.dispatchedQty||0);
        map[k].items.push({name:item.name,qty:item.dispatchedQty||0,vol,voucherNo:o.voucherNo,orderId:o.id,confirmed:true,canReverse:true,confirmedAt,dispatchDate:item.lastDispatchedAt||null});
      });
    });
    return Object.values(map).sort((a,b)=>a.partyName.localeCompare(b.partyName));
  })();
  const dispatched48hDates=[...new Set(dispatched48h.flatMap(g=>g.items.map(i=>i.dispatchDate||todayStr)))].sort().reverse();
  const filteredDispatched48h=(()=>{
    let res=dispatched48h;
    if(dispatched48hDateFilter!=="all")res=res.map(g=>({...g,items:g.items.filter(i=>(i.dispatchDate||"")===dispatched48hDateFilter)})).filter(g=>g.items.length>0);
    if(dispatched48hTypeFilter==="Direct")res=res.filter(g=>g.isDirect);
    else if(dispatched48hTypeFilter==="Transport")res=res.filter(g=>!g.isDirect);
    if(search.trim())res=res.filter(g=>normalize(g.partyName).includes(normalize(search)));
    return res;
  })();

  const [deliverySequence,setDeliverySequence]=useState({direct:{},transport:{}});
  const getTransportSeq=(partyName,transport)=>{
    const seqMap=deliverySequence.transport||{};
    if(!Object.keys(seqMap).length)return 999;
    const normParty=normalize(partyName||"");
    const normTrans=normalize(transport||"");
    if(seqMap[normTrans])return seqMap[normTrans].seq;
    const partialTrans=Object.keys(seqMap).find(k=>k.length>=4&&(normTrans.includes(k)||k.includes(normTrans)));
    if(partialTrans)return seqMap[partialTrans].seq;
    if(seqMap[normParty])return seqMap[normParty].seq;
    const partialCust=Object.keys(seqMap).find(k=>k.length>=4&&(normParty.includes(k)||k.includes(normParty)));
    if(partialCust)return seqMap[partialCust].seq;
    return 999;
  };
  const seqSortFn=(a,b)=>getTransportSeq(a.partyName,a.transport)-getTransportSeq(b.partyName,b.transport)||((a.partyName||"").localeCompare(b.partyName||""));

  const filteredToday=(()=>{
    // Helper: order goes with transport if it's non-direct OR it appears in transport sequence
    const isTransportOrder=g=>!g.isDirect||getTransportSeq(g.partyName,g.transport)<999;
    let res=todayDispatched.filter(g=>{
      if(search.trim()&&!normalize(g.partyName).includes(normalize(search)))return false;
      if(printRouteFilter==="transport")return isTransportOrder(g);
      if(printRouteFilter==="directonly")return g.isDirect&&getTransportSeq(g.partyName,g.transport)===999;
      if(printRouteFilter.startsWith("direct:"))return g.isDirect&&g.route===printRouteFilter.slice(7);
      return true;
    });
    return [...res].sort(seqSortFn);
  })();

  // ── Transporter grouping (for booking consolidated dispatches) ──
  const transporterGroups=(()=>{
    const map={};
    customerGroups.forEach(cg=>{
      // Use normT to merge transporters that differ only by dots/spaces
      const rawT=cg.isDirect?"🚚 DIRECT DELIVERY":cg.transport||"Unknown";
      const tKey=cg.isDirect?"DIRECT":normTKey(rawT);
      if(!map[tKey])map[tKey]={transport:rawT,isDirect:cg.isDirect,customers:[]};
      const totalItems=(cg.orders||[]).reduce((a,o)=>(o.items||[]).filter(i=>i.status!=="Dispatched"&&i.balanceQty>0).length+a,0);
      const totalQty=(cg.orders||[]).reduce((a,o)=>(o.items||[]).reduce((b,i)=>i.status!=="Dispatched"&&i.balanceQty>0?b+i.balanceQty:b,0)+a,0);
      map[tKey].customers.push({partyName:cg.partyName,route:cg.route,orders:cg.orders,totalItems,totalQty});
    });
    // Sort: Direct first (our vehicle), then by customer count desc
    return Object.values(map).sort((a,b)=>{
      if(a.isDirect&&!b.isDirect)return -1;
      if(!a.isDirect&&b.isDirect)return 1;
      return b.customers.length-a.customers.length;
    }).map(tg=>({...tg,customers:tg.customers.sort((a,b)=>{
      const aMin=a.orders.map(o=>o.orderDate||"9999").sort()[0];
      const bMin=b.orders.map(o=>o.orderDate||"9999").sort()[0];
      return aMin.localeCompare(bMin);
    })}));
  })();
  const totalTodayItems=filteredToday.reduce((a,g)=>a+g.items.length,0);

  // ── Product-wise grouping (for material preparation view) ──
  const [selectedCustomerInProduct,setSelectedCustomerInProduct]=useState(null);

  // Clear suggestion when customer has no selected items left in dispatchForm
  useEffect(()=>{
