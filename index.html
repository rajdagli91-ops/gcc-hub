// TASKS MODULE
// ══════════════════════════════════════════════════════════
function TasksTab({user,roles,showToast,allRoles,allProfiles}){
  const isAdmin=roles.includes("admin");
  const canAssign=isAdmin; // Only admin can assign tasks
  const [tasks,setTasks]=useState([]);
  const [loading,setLoading]=useState(true);
  const [subTab,setSubTab]=useState("pending");
  const [showCreate,setShowCreate]=useState(false);
  const [saving,setSaving]=useState(false);
  const [completeTask,setCompleteTask]=useState(null);
  const [reassignTask,setReassignTask]=useState(null); // {id, assignedTo, title}
  const [completedSortUser,setCompletedSortUser]=useState("All"); // filter by user

  const blankTask={title:"",description:"",assignedTo:user.email,dueDate:"",priority:"Normal",category:"General",formula:{name:"",type:"Paint",ingredients:[{id:newId(),name:"",qty:"",unit:""}]}};
  const [form,setForm]=useState({...blankTask});

  // Only show users who actually exist in the system (have logged in or have a role)
  const assignableUsers=[...new Set([
    ...Object.keys(allProfiles),   // users who have logged in
    ...Object.keys(allRoles),      // users with assigned roles
    user.email                     // always include self
  ])].filter(Boolean).sort((a,b)=>{
    const na=allProfiles[a]?.displayName||a;
    const nb=allProfiles[b]?.displayName||b;
    return na.localeCompare(nb);
  });

  useEffect(()=>{
    // Auto-delete completed tasks older than 60 days
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-60);
    const cutoffStr=cutoff.toISOString().slice(0,10);
    C("tasks").where("status","==","completed").get().then(snap=>{
      const old=snap.docs.filter(d=>(d.data().completedAt||"")<=cutoffStr);
      if(old.length){const b=db.batch();old.slice(0,20).forEach(d=>b.delete(C("tasks").doc(d.id)));b.commit().catch(()=>{});}
    }).catch(()=>{});
  },[]);

  const reassign=async()=>{
    if(!reassignTask?.assignedTo)return;
    setSaving(true);
    try{
      await C("tasks").doc(reassignTask.id).update({status:"pending",assignedTo:reassignTask.assignedTo,reassignedBy:user.email,reassignedAt:today(),completedAt:null,completionNotes:"",completedBy:null});
      if(reassignTask.assignedTo!==user.email)
        await C("notifications").add({assignedTo:reassignTask.assignedTo,title:"Task reassigned: "+reassignTask.title,message:"Reassigned by "+(allProfiles[user.email]?.displayName||user.email),type:"task_assigned",read:false,_createdAt:ts()});
      showToast("Task reassigned ✓");setReassignTask(null);
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  useEffect(()=>{
    // Admin sees ALL tasks. Non-admins see ONLY tasks assigned TO them — nothing else,
    // since only Admin can assign tasks (no legacy "tasks I assigned" merge needed).
    const q=isAdmin
      ?C("tasks")
      :C("tasks").where("assignedTo","==",user.email);
    const u=q.onSnapshot(s=>{
      let all=s.docs.map(d=>({id:d.id,...d.data()}));
      all.sort((a,b)=>(b._createdAt?.seconds||0)-(a._createdAt?.seconds||0));
      setTasks(all);setLoading(false);
    },()=>setLoading(false));
    return u;
  },[]);

  const createTask=async()=>{
    if(!form.title.trim())return showToast("Task title required","error");
    if(!form.assignedTo)return showToast("Assign to someone","error");
    setSaving(true);
    try{
      const isRD=form.category==="R&D";
      const hasFormula=isRD&&form.formula?.name?.trim()&&form.formula?.ingredients?.some(r=>r.name.trim());
      const taskData={...form,status:"pending",assignedBy:user.email,assignedAt:today(),_createdAt:ts()};
      // Only store formula if R&D + has content
      if(!hasFormula)delete taskData.formula;
      const taskRef=await C("tasks").add(taskData);

      // If R&D task with formula → also create an R&D project entry
      if(hasFormula){
        const validIngredients=form.formula.ingredients.filter(r=>r.name.trim());
        await C("rd_projects").add({
          projectName:form.formula.name,
          paintType:form.formula.type,
          formulationType:"Task Formula",
          taskId:taskRef.id,
          taskTitle:form.title,
          assignedTo:form.assignedTo,
          ingredients:validIngredients,
          status:"Ongoing",
          createdBy:user.email,
          startDate:today(),
          notes:"Formula added via task: "+form.title,
          _createdAt:ts()
        });
      }

      // Notification
      if(form.assignedTo!==user.email){
        await C("notifications").add({
          assignedTo:form.assignedTo,
          title:(isRD?"🧪 R&D Task: ":"📋 New task: ")+form.title,
          message:"Assigned by "+(allProfiles[user.email]?.displayName||user.email)+(form.dueDate?" · Due: "+form.dueDate:"")+(hasFormula?" · Includes formula: "+form.formula.name:""),
          taskId:taskRef.id,type:"task_assigned",read:false,_createdAt:ts()
        });
      }
      showToast("Task assigned ✓"+(hasFormula?" · Formula saved to R&D":""));
      setShowCreate(false);setForm({...blankTask});
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const markComplete=async(task,notes)=>{
    setSaving(true);
    try{
      await C("tasks").doc(task.id).update({status:"completed",completedAt:today(),completionNotes:notes||"",completedBy:user.email});
      showToast("Task marked complete ✓");setCompleteTask(null);
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const deleteTask=async(id)=>{
    if(!confirm("Delete this task?"))return;
    await C("tasks").doc(id).delete();
    showToast("Deleted","error");
  };

  const PRIORITY_COLORS={High:"#ef4444",Normal:"#3b82f6",Low:"#22c55e"};
  const pending=tasks.filter(t=>t.status==="pending");
  const completed=tasks.filter(t=>t.status==="completed");
  const myPending=pending.filter(t=>t.assignedTo===user.email);

  return <div>
    <SectionHead title="✅ Tasks"/>
    <div style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"12px",flexWrap:"wrap"}}>
      {["pending","completed"].map(s=><button key={s} onClick={()=>setSubTab(s)} style={{background:subTab===s?"#1e293b":"transparent",border:"none",borderBottom:subTab===s?"2px solid #3b82f6":"2px solid transparent",color:subTab===s?"#f1f5f9":"#64748b",padding:"7px 16px",cursor:"pointer",fontSize:"13px",fontWeight:"600",borderRadius:"8px 8px 0 0"}}>
        {s==="pending"?"📋 Pending":"✅ Completed"}
        <span style={{fontSize:"11px",marginLeft:"5px",background:"#0b1220",padding:"1px 6px",borderRadius:"99px",color:"#475569"}}>{s==="pending"?pending.length:completed.length}</span>
      </button>)}
      {canAssign&&<Btn label="+ Assign Task" onClick={()=>{setForm({...blankTask});setShowCreate(true);}} color="#3b82f6" style={{marginLeft:"auto"}}/>}
    </div>

    {/* Create task form */}
    {showCreate&&canAssign&&<div style={{background:"#080d18",border:"1px solid #3b82f630",borderRadius:"12px",padding:"16px",marginBottom:"14px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"12px"}}>📋 Assign New Task</div>
      <Grid2>
        <Field label="Task Title *"><input style={inp} value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Check batch 0042 QC parameters"/></Field>
        <Field label="Assign To *">
          <select style={sl} value={form.assignedTo} onChange={e=>setForm({...form,assignedTo:e.target.value})}>
            {assignableUsers.map(e=><option key={e} value={e}>{allProfiles[e]?.displayName?`${allProfiles[e].displayName} (${e})`:e}</option>)}
          </select>
        </Field>
      </Grid2>
      <Field label="Description / Instructions"><textarea style={{...inp,minHeight:"70px",resize:"vertical"}} value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Detailed instructions (optional)"/></Field>
      <Grid2>
        <Field label="Due Date (optional)"><input type="date" style={inp} value={form.dueDate} onChange={e=>setForm({...form,dueDate:e.target.value})}/></Field>
        <Field label="Priority">
          <select style={sl} value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}>
            {["High","Normal","Low"].map(p=><option key={p}>{p}</option>)}
          </select>
        </Field>
      </Grid2>
      <Field label="Category">
        <div style={{display:"flex",gap:"8px"}}>
          {["General","R&D"].map(cat=><button key={cat} onClick={()=>setForm({...form,category:cat})} style={{background:form.category===cat?(cat==="R&D"?"#0d1f10":"#0f1d35"):"#0b1220",border:`1px solid ${form.category===cat?(cat==="R&D"?"#22c55e":"#3b82f6"):"#334155"}`,borderRadius:"7px",padding:"6px 16px",color:form.category===cat?(cat==="R&D"?"#86efac":"#93c5fd"):"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600"}}>
            {cat==="R&D"?"🧪 R&D":"📋 General"}
          </button>)}
        </div>
      </Field>

      {/* R&D Formula Editor — only shown when R&D category selected */}
      {form.category==="R&D"&&<div style={{background:"#060d0a",border:"1px solid #22c55e30",borderRadius:"10px",padding:"14px",marginTop:"2px",marginBottom:"4px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#86efac",marginBottom:"10px"}}>🧪 Formula (optional) — will be saved to R&D Projects</div>
        <Grid2>
          <Field label="Formula / Product Name"><input style={inp} value={form.formula?.name||""} onChange={e=>setForm({...form,formula:{...form.formula,name:e.target.value}})} placeholder="e.g. Trial Enamel White 01"/></Field>
          <Field label="Type">
            <select style={sl} value={form.formula?.type||"Paint"} onChange={e=>setForm({...form,formula:{...form.formula,type:e.target.value}})}>
              {["Paint","Thinner","Varnish","Primer","Putty","Other"].map(t=><option key={t}>{t}</option>)}
            </select>
          </Field>
        </Grid2>
        <div style={{border:"1px solid #1e3a2f",borderRadius:"8px",overflow:"hidden",marginBottom:"8px"}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 80px 80px 28px",background:"#0a1a0f",padding:"6px 10px",gap:"6px"}}>
            {["Ingredient / Raw Material","Qty","Unit",""].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
          </div>
          {(form.formula?.ingredients||[]).map((row,i)=><div key={row.id||i} style={{display:"grid",gridTemplateColumns:"2fr 80px 80px 28px",padding:"5px 10px",gap:"6px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
            <input style={sml} value={row.name} onChange={e=>{const arr=[...(form.formula.ingredients||[])];arr[i]={...arr[i],name:e.target.value};setForm({...form,formula:{...form.formula,ingredients:arr}});}} placeholder="e.g. TiO2, Linseed Oil"/>
            <input style={{...sml,textAlign:"center"}} type="number" min="0" step="0.01" value={row.qty} onChange={e=>{const arr=[...(form.formula.ingredients||[])];arr[i]={...arr[i],qty:e.target.value};setForm({...form,formula:{...form.formula,ingredients:arr}});}} placeholder="0"/>
            <input style={sml} value={row.unit} onChange={e=>{const arr=[...(form.formula.ingredients||[])];arr[i]={...arr[i],unit:e.target.value};setForm({...form,formula:{...form.formula,ingredients:arr}});}} placeholder="kg/L"/>
            <button onClick={()=>{const arr=(form.formula.ingredients||[]).filter((_,j)=>j!==i);setForm({...form,formula:{...form.formula,ingredients:arr.length?arr:[{id:newId(),name:"",qty:"",unit:""}]}});}} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
          </div>)}
        </div>
        <button onClick={()=>setForm({...form,formula:{...form.formula,ingredients:[...(form.formula.ingredients||[]),{id:newId(),name:"",qty:"",unit:""}]}})} style={{background:"none",border:"1px dashed #1e3a2f",borderRadius:"6px",padding:"4px 12px",color:"#4ade80",cursor:"pointer",fontSize:"12px"}}>+ Add Ingredient</button>
        {!(form.formula?.name?.trim())&&<div style={{fontSize:"10.5px",color:"#334155",marginTop:"6px",fontStyle:"italic"}}>Formula name required for it to be saved to R&D Projects.</div>}
      </div>}

      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowCreate(false)} outline color="#475569" small/>
        <Btn label={saving?"Saving…":"✓ Assign Task"} onClick={createTask} disabled={saving} color="#3b82f6" small/>
      </div>
    </div>}

    {loading&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading…</div>}

    {/* PENDING tab */}
    {subTab==="pending"&&!loading&&<div>
      {pending.length===0&&<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px"}}>✅</div><div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>No pending tasks</div></div>}
      {pending.map(task=>{
        const isOverdue=task.dueDate&&task.dueDate<today()&&task.status==="pending";
        const isMine=task.assignedTo===user.email;
        const assigneeName=allProfiles[task.assignedTo]?.displayName||task.assignedTo;
        const assignerName=allProfiles[task.assignedBy]?.displayName||task.assignedBy;
        const isCompletingThis=completeTask?.id===task.id;
        return <div key={task.id} style={{background:"#0f172a",border:`1px solid ${isOverdue?"#7f1d1d":isMine?"#1e3a5f":"#1e293b"}`,borderLeft:`3px solid ${PRIORITY_COLORS[task.priority]||"#3b82f6"}`,borderRadius:"10px",padding:"13px 16px",marginBottom:"8px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px",flexWrap:"wrap"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap",marginBottom:"4px"}}>
                <span style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9"}}>{task.title}</span>
                {task.category==="R&D"&&<Bdg label="🧪 R&D" color="#22c55e" small/>}
                <Bdg label={task.priority} color={PRIORITY_COLORS[task.priority]||"#3b82f6"} small/>
                {isOverdue&&<Bdg label="⚠️ Overdue" color="#ef4444" small/>}
                {isMine&&<Bdg label="👤 Assigned to you" color="#22c55e" small/>}
              </div>
              {task.description&&<div style={{fontSize:"12px",color:"#64748b",marginBottom:"4px"}}>{task.description}</div>}
              {task.formula?.name&&<div style={{fontSize:"11px",background:"#0a1a0f",border:"1px solid #22c55e20",borderRadius:"6px",padding:"5px 10px",marginBottom:"4px",color:"#86efac"}}>
                🧪 Formula: <strong>{task.formula.name}</strong> ({task.formula.type}) · {(task.formula.ingredients||[]).filter(r=>r.name).length} ingredients
              </div>}
              <div style={{fontSize:"11px",color:"#475569",display:"flex",gap:"12px",flexWrap:"wrap"}}>
                <span>📅 Assigned: {task.assignedAt}</span>
                {task.dueDate&&<span style={{color:isOverdue?"#ef4444":"#64748b"}}>⏰ Due: {task.dueDate}</span>}
                {canAssign&&<span>👤 To: {assigneeName}</span>}
                <span>Assigned by: {assignerName}</span>
              </div>
            </div>
            <div style={{display:"flex",gap:"6px",flexShrink:0}}>
              {isMine&&!isCompletingThis&&<Btn label="✅ Mark Complete" onClick={()=>setCompleteTask({id:task.id,notes:""})} color="#22c55e" small/>}
              {(isAdmin||task.assignedBy===user.email)&&<button onClick={()=>deleteTask(task.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"14px"}}>🗑</button>}
            </div>
          </div>
          {/* Completion form */}
          {isCompletingThis&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b"}}>
            <Field label="Completion Notes (optional)"><textarea style={{...inp,minHeight:"60px",resize:"vertical"}} value={completeTask.notes} onChange={e=>setCompleteTask({...completeTask,notes:e.target.value})} placeholder="What was done, any observations…"/></Field>
            <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
              <Btn label="Cancel" onClick={()=>setCompleteTask(null)} outline color="#475569" small/>
              <Btn label={saving?"Saving…":"✅ Confirm Complete"} onClick={()=>markComplete(task,completeTask.notes)} disabled={saving} color="#22c55e" small/>
            </div>
          </div>}
        </div>;
      })}
    </div>}

    {/* COMPLETED tab */}
    {subTab==="completed"&&!loading&&<div>
      {/* Sort & filter controls */}
      <div style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"10px",flexWrap:"wrap"}}>
        <span style={{fontSize:"12px",color:"#475569",fontWeight:"600"}}>Filter by user:</span>
        <select style={{...sl,width:"200px",fontSize:"12px",padding:"5px 8px"}} value={completedSortUser} onChange={e=>setCompletedSortUser(e.target.value)}>
          <option value="All">All Users</option>
          {[...new Set(completed.map(t=>t.assignedTo))].sort().map(e=><option key={e} value={e}>{allProfiles[e]?.displayName||e}</option>)}
        </select>
        <span style={{fontSize:"11px",color:"#334155",marginLeft:"4px"}}>
          {completed.filter(t=>completedSortUser==="All"||t.assignedTo===completedSortUser).length} tasks
        </span>
        <span style={{fontSize:"10px",color:"#334155",marginLeft:"auto",fontStyle:"italic"}}>
          ⏳ Completed tasks auto-delete after 60 days
        </span>
      </div>

      {completed.length===0&&<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px"}}>📋</div><div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>No completed tasks yet</div></div>}

      {/* Group by user if "All" selected */}
      {(completedSortUser==="All"
        ?[...new Set(completed.map(t=>t.assignedTo))].sort()
        :[completedSortUser]
      ).map(userEmail=>{
        const userTasks=completed.filter(t=>t.assignedTo===userEmail);
        if(!userTasks.length)return null;
        const userName=allProfiles[userEmail]?.displayName||userEmail;
        return <div key={userEmail} style={{marginBottom:"14px"}}>
          {completedSortUser==="All"&&<div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px",paddingBottom:"4px",borderBottom:"1px solid #1e293b"}}>
            👤 {userName} — {userTasks.length} task{userTasks.length!==1?"s":""}
          </div>}
          {userTasks.map(task=>{
            const isReassigningThis=reassignTask?.id===task.id;
            const daysSince=task.completedAt?Math.floor((new Date()-new Date(task.completedAt))/(86400000)):null;
            const daysLeft=daysSince!==null?60-daysSince:null;
            return <div key={task.id} style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:"3px solid #22c55e",borderRadius:"10px",padding:"12px 16px",marginBottom:"6px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px",flexWrap:"wrap"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:"13px",fontWeight:"700",color:"#94a3b8",marginBottom:"3px"}}>✅ {task.title}</div>
                  {task.completionNotes&&<div style={{fontSize:"12px",color:"#475569",marginBottom:"3px",fontStyle:"italic"}}>"{task.completionNotes}"</div>}
                  <div style={{fontSize:"11px",color:"#334155",display:"flex",gap:"10px",flexWrap:"wrap"}}>
                    <span>Assigned: {task.assignedAt}</span>
                    <span>Completed: {task.completedAt}</span>
                    {canAssign&&completedSortUser==="All"&&<span>By: {userName}</span>}
                    {daysLeft!==null&&daysLeft<=14&&<span style={{color:daysLeft<=3?"#ef4444":"#f59e0b"}}>🗑 Auto-deletes in {daysLeft}d</span>}
                  </div>
                </div>
                <div style={{display:"flex",gap:"6px",flexShrink:0}}>
                  {canAssign&&!isReassigningThis&&<Btn label="↩ Reassign" onClick={()=>setReassignTask({id:task.id,title:task.title,assignedTo:task.assignedTo})} color="#f59e0b" small outline/>}
                  {(isAdmin||task.assignedBy===user.email)&&<button onClick={()=>deleteTask(task.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"14px"}}>🗑</button>}
                </div>
              </div>
              {/* Reassign form */}
              {isReassigningThis&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b"}}>
                <div style={{fontSize:"12px",color:"#f59e0b",fontWeight:"600",marginBottom:"8px"}}>↩ Reassign Task — moves back to Pending</div>
                <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
                  <select style={{...sl,flex:1}} value={reassignTask.assignedTo} onChange={e=>setReassignTask({...reassignTask,assignedTo:e.target.value})}>
                    {assignableUsers.map(e=><option key={e} value={e}>{allProfiles[e]?.displayName?`${allProfiles[e].displayName} (${e})`:e}</option>)}
                  </select>
                  <Btn label={saving?"Saving…":"↩ Confirm Reassign"} onClick={reassign} disabled={saving} color="#f59e0b" small/>
                  <Btn label="Cancel" onClick={()=>setReassignTask(null)} outline color="#475569" small/>
                </div>
              </div>}
            </div>;
          })}
        </div>;
      })}
    </div>}
  </div>;
}

// STAINER PIGMENT CALCULATOR
// ══════════════════════════════════════════════════════════
function StainerCalc(){
  const [batchSize,setBatchSize]=useState("");
  const [origPigment,setOrigPigment]=useState("");
  const [targetPigment,setTargetPigment]=useState("");
  const [targetOverride,setTargetOverride]=useState(false); // true = user manually set different target
  const [stainers,setStainers]=useState([{id:"s1",name:"",amt:"",pigment:""}]);
  const [actualPigment,setActualPigment]=useState("");
  const [mode,setMode]=useState("forward");

  const addStainer=()=>setStainers(s=>[...s,{id:"s"+Date.now(),name:"",amt:"",pigment:""}]);
  const removeStainer=(id)=>setStainers(s=>s.filter(x=>x.id!==id));
  const updateStainer=(id,field,val)=>setStainers(s=>s.map(x=>x.id===id?{...x,[field]:val}:x));

  // Target defaults to = original pigment unless manually overridden
  const effectiveTarget=targetOverride?targetPigment:origPigment;

  const B=parseFloat(batchSize)||0;
  const P0=parseFloat(origPigment)||0;
  const Pt=parseFloat(effectiveTarget)||0;
  const Pact=parseFloat(actualPigment)||0;

  // Stainer totals
  const totalStainerVol=stainers.reduce((s,x)=>s+(parseFloat(x.amt)||0),0);
  const totalStainerPigMass=stainers.reduce((s,x)=>s+(parseFloat(x.amt)||0)*(parseFloat(x.pigment)||0)/100,0);

  // Original pigment mass = B × P0/100
  // Total pigment = B×P0/100 + Σ stainer pigment
  // Final batch (at Pt%) = Total pigment / (Pt/100) → floor to nearest 10L
  // Extra base = Final batch - B - Σ stainer vol
  const origPigMass=B*P0/100;
  const totalPigMass=origPigMass+totalStainerPigMass;
  const finalBatchRaw=Pt>0?totalPigMass/(Pt/100):0;
  const finalBatch=finalBatchRaw>0?Math.floor(finalBatchRaw/10)*10:0; // floor to nearest 10L
  const extraBase=Math.max(0,finalBatch-B-totalStainerVol);
  const currentPigPct=(B+totalStainerVol)>0?totalPigMass/(B+totalStainerVol)*100:0;
  const finalPct=finalBatch>0?(totalPigMass+extraBase*0)/finalBatch*100:0;

  // Reverse: floor to nearest 10L as well
  const revFinalBatchRaw=Pt>0&&Pact>0?B*Pact/100/(Pt/100):0;
  const revFinalBatch=revFinalBatchRaw>0?Math.floor(revFinalBatchRaw/10)*10:0;
  const revExtra=Math.max(0,revFinalBatch-B);

  const fL=(v)=>v>0?v.toFixed(2)+" L":"—";
  const fP=(v)=>v>0?v.toFixed(3)+"%":"—";
  const hasStainers=stainers.some(x=>parseFloat(x.amt)>0&&parseFloat(x.pigment)>0);
  const rowSt={display:"grid",gridTemplateColumns:"1fr 80px 90px 80px 28px",gap:"6px",alignItems:"center",padding:"7px 10px",borderTop:"1px solid #1e293b"};

  return <div>
    <SectionHead title="🎨 Stainer Pigment Calculator"/>
    <InfoBox color="#3b82f6">Enter original batch pigment% — target defaults to same. Stainer raises pigment%; calculator shows how much base to add. Final batch size rounded down to nearest 10L.</InfoBox>

    <div style={{display:"flex",gap:"8px",marginBottom:"16px"}}>
      {[["forward","📥 Stainer Added → Calc Extra Base"],["reverse","🔬 Actual Pigment% Measured → Calc Base"]].map(([m,l])=>
        <button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:"9px 14px",background:mode===m?"#0f1d35":"#080d18",border:`1px solid ${mode===m?"#3b82f6":"#1e293b"}`,borderRadius:"8px",color:mode===m?"#93c5fd":"#475569",cursor:"pointer",fontSize:"12px",fontWeight:mode===m?"700":"400"}}>
          {m==="forward"?"📥 Stainer Added → Calc Extra Base":"🔬 Actual Pigment% Measured → Calc Base"}
        </button>
      )}
    </div>

    <Grid2>
      <Field label="Original Batch Size (L)">
        <input style={inp} type="number" min="0" step="0.01" value={batchSize} onChange={e=>setBatchSize(e.target.value)} placeholder="e.g. 1000"/>
      </Field>
      <Field label="Original Pigment % (from BOM)">
        <input style={inp} type="number" min="0" max="100" step="0.001" value={origPigment}
          onChange={e=>{setOrigPigment(e.target.value);if(!targetOverride)setTargetPigment(e.target.value);}}
          placeholder="e.g. 15"/>
      </Field>
    </Grid2>
    {/* Target pigment — linked to orig by default, can be overridden */}
    <div style={{background:"#080d18",border:`1px solid ${targetOverride?"#f59e0b40":"#1e293b"}`,borderRadius:"8px",padding:"10px 12px",marginBottom:"12px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:targetOverride?"#f59e0b":"#64748b",textTransform:"uppercase",letterSpacing:"0.06em"}}>
          Target Pigment % {!targetOverride&&<span style={{fontWeight:"400",color:"#334155"}}>(= Original — linked)</span>}
        </div>
        <button onClick={()=>{setTargetOverride(v=>!v);if(targetOverride)setTargetPigment(origPigment);}}
          style={{background:targetOverride?"#78350f30":"#0b1220",border:`1px solid ${targetOverride?"#f59e0b":"#334155"}`,borderRadius:"6px",padding:"3px 10px",color:targetOverride?"#f59e0b":"#475569",cursor:"pointer",fontSize:"11px",fontWeight:"600"}}>
          {targetOverride?"✓ Custom (click to link back)":"✏️ Set different target"}
        </button>
      </div>
      {targetOverride
        ?<input style={{...inp,borderColor:"#f59e0b60"}} type="number" min="0" max="100" step="0.001" value={targetPigment} onChange={e=>setTargetPigment(e.target.value)} placeholder="Enter custom target %"/>
        :<div style={{fontSize:"18px",fontWeight:"700",color:"#94a3b8",padding:"4px 0"}}>{origPigment||"—"} <span style={{fontSize:"12px",color:"#334155"}}>%</span></div>
      }
    </div>

    {mode==="reverse"&&<Field label="Actual Measured Pigment % (lab / instrument result)">
      <input style={{...inp,borderColor:"#22c55e40"}} type="number" min="0" max="100" step="0.001" value={actualPigment} onChange={e=>setActualPigment(e.target.value)} placeholder="e.g. 18.5"/>
    </Field>}

    {mode==="forward"&&<div style={{marginBottom:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em"}}>Stainers Added</div>
        <button onClick={addStainer} style={{background:"none",border:"1px dashed #1e3a5f",borderRadius:"6px",padding:"4px 14px",color:"#93c5fd",cursor:"pointer",fontSize:"12px",fontWeight:"600"}}>+ Add Stainer</button>
      </div>
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden"}}>
        <div style={{...rowSt,background:"#0b1220",borderTop:"none",padding:"6px 10px"}}>
          {["Stainer Name","Amt (L / kg)","Pigment %","Pig. Mass",""].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
        </div>
        {stainers.map((s,i)=>{
          const a=parseFloat(s.amt)||0,p=parseFloat(s.pigment)||0,mass=a*p/100;
          return <div key={s.id} style={{...rowSt,background:a>0&&p>0?"#06100d":"#080d18"}}>
            <input style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:"5px",padding:"5px 8px",color:"#e2e8f0",fontSize:"12px",width:"100%"}} value={s.name} onChange={e=>updateStainer(s.id,"name",e.target.value)} placeholder={"Stainer "+(i+1)}/>
            <input style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:"5px",padding:"5px 6px",color:"#e2e8f0",fontSize:"12px",width:"100%",textAlign:"center"}} type="number" min="0" step="0.01" value={s.amt} onChange={e=>updateStainer(s.id,"amt",e.target.value)} placeholder="0"/>
            <div style={{display:"flex",gap:"3px",alignItems:"center"}}>
              <input style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:"5px",padding:"5px 6px",color:"#e2e8f0",fontSize:"12px",width:"100%",textAlign:"center"}} type="number" min="0" max="100" step="0.1" value={s.pigment} onChange={e=>updateStainer(s.id,"pigment",e.target.value)} placeholder="%"/>
              <span style={{fontSize:"10px",color:"#475569",flexShrink:0}}>%</span>
            </div>
            <div style={{fontSize:"11px",color:mass>0?"#93c5fd":"#334155",textAlign:"center",fontWeight:mass>0?"700":"400"}}>{mass>0?mass.toFixed(3):"—"}</div>

// Exact lookup at 50/60/70%; linear interpolation/extrapolation for any other %
function lookupResinSolvent(entry,pct){
  if(pct===50)return{resin:entry.r50,solvent:entry.s50};
  if(pct===60)return{resin:entry.r60,solvent:entry.s60};
  if(pct===70)return{resin:entry.r70,solvent:entry.s70};
  let p0,r0,s0,p1,r1,s1;
  if(pct<=60){p0=50;r0=entry.r50;s0=entry.s50;p1=60;r1=entry.r60;s1=entry.s60;}
  else{p0=60;r0=entry.r60;s0=entry.s60;p1=70;r1=entry.r70;s1=entry.s70;}
  const t=(pct-p0)/(p1-p0);
  const resin=r0+(r1-r0)*t;
  const solvent=Math.max(0,s0+(s1-s0)*t);
  return{resin,solvent};
}

function ResinSolventCalc(){
  const [mill,setMill]=useState("sandmill");
  const [solidsPct,setSolidsPct]=useState(70);
  const [customPct,setCustomPct]=useState("");
  const [useCustomPct,setUseCustomPct]=useState(false);
  const mkRow=()=>({id:"r"+Date.now()+Math.random(),pigmentIdx:0,custom:false,customName:"",customR0:"",customS0:"",weight:"100"});
  const [rows,setRows]=useState([mkRow()]);

  const changeMill=(m)=>{
    setMill(m);
    setRows([{id:"r"+Date.now(),pigmentIdx:0,custom:false,customName:"",customR0:"",customS0:"",weight:"100"}]);
  };
  const addRow=()=>setRows(r=>[...r,{id:"r"+Date.now()+Math.random(),pigmentIdx:0,custom:false,customName:"",customR0:"",customS0:"",weight:"100"}]);
  const removeRow=(id)=>setRows(r=>r.filter(x=>x.id!==id));
  const updateRow=(id,field,val)=>setRows(r=>r.map(x=>x.id===id?{...x,[field]:val}:x));

  const pct=useCustomPct?(parseFloat(customPct)||0):solidsPct;

  const calcRow=(row)=>{
    let resinBase,solventBase,label;
    const weight=parseFloat(row.weight)||0;
    const scale=weight/100; // base data is per 100kg pigment
    if(row.custom){
      // Custom: user enters base resin/solvent directly at THIS % (no interpolation possible)
      resinBase=parseFloat(row.customR0)||0;
      solventBase=parseFloat(row.customS0)||0;
      label=row.customName||"Custom Pigment";
    }else{
      const pd=MILL_PIGMENT_DATA[mill][row.pigmentIdx];
      label=pd?.name||"";
      if(pd&&pct>0){
        const r=lookupResinSolvent(pd,pct);
        resinBase=r.resin;solventBase=r.solvent;
      }else{resinBase=0;solventBase=0;}
    }
    const resinReq=resinBase*scale;
    const solventReq=solventBase*scale;
    const totalYield=weight+resinReq+solventReq;
    return{label,weight,resinReq,solventReq,totalYield};
  };

  const results=rows.map(calcRow);
  const totals=results.reduce((acc,r)=>({weight:acc.weight+r.weight,resinReq:acc.resinReq+r.resinReq,solventReq:acc.solventReq+r.solventReq,totalYield:acc.totalYield+r.totalYield}),{weight:0,resinReq:0,solventReq:0,totalYield:0});

          return <div key={row.id} style={{display:"grid",gridTemplateColumns:rowGridCols,gap:"6px",padding:"8px 10px",borderTop:"1px solid #1e293b",alignItems:"center",background:res.resinReq>0?"#06100d":"#080d18"}}>
            <div>
              {!row.custom&&<select style={{...sml,width:"100%"}} value={row.pigmentIdx} onChange={e=>{
                const v=e.target.value;
                if(v==="custom")updateRow(row.id,"custom",true);
                else updateRow(row.id,"pigmentIdx",parseInt(v));
              }}>
                {opts.map((p,idx)=><option key={idx} value={idx}>{p.name}</option>)}
                <option value="custom">✏️ Custom pigment…</option>
              </select>}
              {row.custom&&<div>
                <div style={{display:"flex",gap:"4px"}}>
                  <input style={{...sml,flex:1}} value={row.customName} onChange={e=>updateRow(row.id,"customName",e.target.value)} placeholder="Pigment name"/>
                  <button onClick={()=>updateRow(row.id,"custom",false)} title="Use preset list" style={{background:"none",border:"1px solid #1e293b",borderRadius:"5px",color:"#475569",cursor:"pointer",fontSize:"11px",padding:"0 8px"}}>↩</button>
                </div>
                <div style={{display:"flex",gap:"4px",marginTop:"4px"}}>
                  <input style={{...sml,width:"80px"}} type="number" step="0.01" value={row.customR0} onChange={e=>updateRow(row.id,"customR0",e.target.value)} placeholder="Resin/100kg"/>
                  <input style={{...sml,width:"80px"}} type="number" step="0.01" value={row.customS0} onChange={e=>updateRow(row.id,"customS0",e.target.value)} placeholder="Solvent/100kg"/>
                </div>
              </div>}
            </div>
            <input style={{...sml,textAlign:"center"}} type="number" min="0" step="0.01" value={row.weight} onChange={e=>updateRow(row.id,"weight",e.target.value)} placeholder="100"/>
            <div style={{fontSize:"12px",color:"#93c5fd",fontWeight:"700",textAlign:"center"}}>{fmt(res.resinReq)}</div>
            <div style={{fontSize:"12px",color:"#fbbf24",fontWeight:"700",textAlign:"center"}}>{fmt(res.solventReq)}</div>
            <div style={{fontSize:"12px",color:"#f1f5f9",fontWeight:"700",textAlign:"center"}}>{fmt(res.totalYield)}</div>
            <button onClick={()=>removeRow(row.id)} disabled={rows.length===1} style={{background:"none",border:"none",color:rows.length>1?"#ef4444":"#1e293b",cursor:rows.length>1?"pointer":"default",fontSize:"16px",lineHeight:1,padding:0}}>×</button>
          </div>;
        })}
        {rows.length>1&&<div style={{display:"grid",gridTemplateColumns:rowGridCols,gap:"6px",padding:"8px 10px",borderTop:"1px solid #1e3a5f",background:"#0a1520",alignItems:"center"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:"#475569"}}>TOTAL</div>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#f1f5f9",textAlign:"center"}}>{fmt(totals.weight)}</div>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#93c5fd",textAlign:"center"}}>{fmt(totals.resinReq)}</div>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#fbbf24",textAlign:"center"}}>{fmt(totals.solventReq)}</div>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#f1f5f9",textAlign:"center"}}>{fmt(totals.totalYield)}</div>
          <div/>
        </div>}
      </div>
    </div>

    {/* Summary action box */}
    {totals.resinReq>0&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"8px",padding:"14px 16px",marginBottom:"14px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#22c55e",marginBottom:"6px"}}>✅ Mix Summary — {MILL_LABELS[mill]} @ {pct}% Resin Solids</div>
      <div style={{fontSize:"13px",color:"#86efac",lineHeight:1.7}}>
        Pigment: <strong>{totals.weight.toFixed(2)} kg</strong> · Resin: <strong style={{color:"#93c5fd"}}>{totals.resinReq.toFixed(2)} kg</strong> · Solvent: <strong style={{color:"#fbbf24"}}>{totals.solventReq.toFixed(2)} kg</strong>
        <br/>Total Millbase Yield: <strong style={{fontSize:"16px",color:"#4ade80"}}>{totals.totalYield.toFixed(2)} kg</strong>
      </div>
    </div>}

    <div style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"8px",padding:"11px 14px"}}>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px"}}>How it works</div>
      <div style={{fontSize:"11px",color:"#475569",lineHeight:1.8}}>
        <div>Resin &amp; Solvent values are looked up directly from verified reference data at 50%, 60%, and 70% resin solids — exact, no approximation.</div>
        <div>Other % values are linearly interpolated between the nearest known points.</div>
        <div>Total Yield = Pigment Wt + Resin Req + Solvent Req (scaled from the 100kg pigment basis to your actual weight)</div>
      </div>
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════════
// SHADE CORRECTION CALCULATOR — reverse-engineers the stainer correction
// made during production into a permanent BOM pigment ratio update,
// so the same shade is achieved directly next time, without stainer.
// ══════════════════════════════════════════════════════════
function ShadeCorrectionCalc({showToast,user,isAdmin,canApprove,canSubmit}){
  const [boms,setBoms]=useState([]);
  const [allBatches,setAllBatches]=useState([]);
  const [pendingCorrections,setPendingCorrections]=useState([]);
  const [productName,setProductName]=useState("");
  const [productSearch,setProductSearch]=useState("");
  const [showProductList,setShowProductList]=useState(false);
  const [batchId,setBatchId]=useState("");
  const [bomId,setBomId]=useState("");
  const [bomBaseSize,setBomBaseSize]=useState(0);
  const [batchSize,setBatchSize]=useState("100");
  const [lastScaledSize,setLastScaledSize]=useState(0); // tracks size pigments were last scaled to
  const [pigments,setPigments]=useState([{id:"p1",name:"",qty:"",pigmentPct:""},{id:"p2",name:"",qty:"",pigmentPct:""}]);
  const [formulationType,setFormulationType]=useState("pigment"); // "pigment" or "stainer" — auto-detected, user-overridable
  const [targetTotal,setTargetTotal]=useState("");
  const [targetOverride,setTargetOverride]=useState(false);
  const [stainers,setStainers]=useState([{id:"s1",name:"",amt:"",pigment:""}]);
  const [submitting,setSubmitting]=useState(false);
  const [reviewingId,setReviewingId]=useState(null);
  const [editingCorrId,setEditingCorrId]=useState(null);
  const [editRows,setEditRows]=useState([]);

  useEffect(()=>{
    const u1=C("bom_products").orderBy("productName").onSnapshot(s=>setBoms(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u2=C("batches").orderBy("_createdAt","desc").limit(300).onSnapshot(s=>setAllBatches(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});
    const u3=C("shade_corrections").where("status","==","Pending").onSnapshot(s=>setPendingCorrections(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});
    return ()=>{u1();u2();u3();};
  },[]);

  const isPigmentCode=(name)=>/^\s*3\d/.test(name||""); // pigment codes start with digit 3, e.g. 3220, 3020/822
  const isStrName=(name)=>/str/i.test(name||""); // ingredient/batch is a stainer if name contains "STR"
  const productNames=[...new Set(allBatches.map(b=>b.productName).filter(Boolean))].sort();
  const filteredProductNames=productSearch.trim()
    ?productNames.filter(n=>normalize(n).includes(normalize(productSearch)))
    :productNames;
  const batchesForProduct=allBatches.filter(b=>b.productName===productName&&b.status!=="Packed"&&b.status!=="QC Pass").sort((a,b)=>(b._createdAt?.seconds||0)-(a._createdAt?.seconds||0));

  const loadFromBatch=(bId)=>{
    setBatchId(bId);
    const b=allBatches.find(x=>x.id===bId);
    if(!b)return;
    const actualSize=parseFloat(b.batchSize)||100;
    setBatchSize(String(actualSize));
    setLastScaledSize(actualSize);
    const matchedBom=boms.find(x=>x.productName===b.productName);
    if(matchedBom){
      setBomId(matchedBom.id);
      const base=parseFloat(matchedBom.baseBatchSize)||100;
      setBomBaseSize(base);
      const mult=actualSize/base;
      const rows=(matchedBom.ingredients||[]).filter(i=>!i.isProcess&&i.name&&parseFloat(i.standardQty)>0&&(isPigmentCode(i.name)||isStrName(i.name)))
        .map(i=>({id:i.id||newId(),name:i.name,qty:((parseFloat(i.standardQty)||0)*mult).toFixed(3),pigmentPct:""}));
      setPigments(rows.length?rows:[{id:"p1",name:"",qty:"",pigmentPct:""},{id:"p2",name:"",qty:"",pigmentPct:""}]);
      // Auto-detect: if any ingredient is stainer-named, this product is formulated via stainer
      setFormulationType(rows.some(r=>isStrName(r.name))?"stainer":"pigment");
    }else{
      setBomId("");setBomBaseSize(0);
      showToast("No BOM found for "+b.productName+" — enter pigments manually","error");
    }
    setTargetOverride(false);
  };

  const rescaleToBatchSize=()=>{
    const newSize=parseFloat(batchSize)||0;
    if(!lastScaledSize||!newSize)return;
    const ratio=newSize/lastScaledSize;
    setPigments(p=>p.map(x=>({...x,qty:x.qty?((parseFloat(x.qty)||0)*ratio).toFixed(3):x.qty})));
    setLastScaledSize(newSize);
    showToast("Pigment quantities rescaled to "+newSize+" ✓");
  };

  const addPigment=()=>setPigments(p=>[...p,{id:"p"+Date.now()+Math.random(),name:"",qty:"",pigmentPct:""}]);
  const removePigment=(id)=>setPigments(p=>p.filter(x=>x.id!==id));
  const updatePigment=(id,field,val)=>setPigments(p=>p.map(x=>x.id===id?{...x,[field]:val}:x));

  const addStainer=()=>setStainers(s=>[...s,{id:"s"+Date.now()+Math.random(),name:"",amt:"",pigment:""}]);
  const removeStainer=(id)=>setStainers(s=>s.filter(x=>x.id!==id));
  const updateStainer=(id,field,val)=>setStainers(s=>s.map(x=>x.id===id?{...x,[field]:val}:x));

  const pigmentPureMass=(p)=>{
    const qty=parseFloat(p.qty)||0;
    if(formulationType==="stainer"){
      const pct=parseFloat(p.pigmentPct)||0;
      return qty*pct/100;
    }
    return qty;
  };
  const currentTotal=pigments.reduce((sum,p)=>sum+pigmentPureMass(p),0);
  const effectiveTarget=targetOverride?(parseFloat(targetTotal)||0):currentTotal;
  const missingStrPct=formulationType==="stainer"&&pigments.some(p=>p.name.trim()&&!(parseFloat(p.pigmentPct)>0));

  const validStainers=stainers.filter(s=>s.name.trim()&&parseFloat(s.amt)>0&&parseFloat(s.pigment)>0);
  const stainerContrib={};
  const standaloneStainers=[]; // new corrections that don't match anything already in the batch
  validStainers.forEach(s=>{
    const amt=parseFloat(s.amt)||0;
    const pct=parseFloat(s.pigment)||0;
    const pureMass=amt*pct/100;
    const sLower=s.name.trim().toLowerCase();
    const match=pigments.find(p=>p.name&&p.name.trim()&&
      (p.name.toLowerCase().includes(sLower)||sLower.includes(p.name.toLowerCase())));
    if(match){
      stainerContrib[match.id]=(stainerContrib[match.id]||0)+pureMass;
    }else{
      const key="_new_"+s.name.trim();
      const existing=standaloneStainers.find(n=>n.key===key);
      if(existing){existing.pureMass+=pureMass;existing.rawMass+=amt;}
      else standaloneStainers.push({key,name:s.name.trim(),pureMass,rawMass:amt});
    }
  });

  const combinedRows=[
    ...pigments.filter(p=>p.name.trim()).map(p=>{
      const rawQty=parseFloat(p.qty)||0;
      const pureMass=pigmentPureMass(p);
      return {
        id:p.id,name:p.name,isStr:formulationType==="stainer",pigmentPct:p.pigmentPct,
        oldQty:pureMass,oldQtyRaw:rawQty,
        added:stainerContrib[p.id]||0,
        afterAddition:pureMass+(stainerContrib[p.id]||0),
        isNew:false,isStandaloneStainer:false
      };
    }),
    // New corrections that didn't match an existing row — always correctly converted back
    // to raw stainer quantity using their own (mass-weighted) pigment%, since they were
    // explicitly entered with a real concentration regardless of the base formulation type.
    ...standaloneStainers.map(n=>{
      const effectivePct=n.rawMass>0?(n.pureMass/n.rawMass*100):0;
      return {
        id:n.key,name:n.name,isStr:true,pigmentPct:effectivePct.toFixed(2),
        oldQty:0,oldQtyRaw:0,added:n.pureMass,afterAddition:n.pureMass,
        isNew:true,isStandaloneStainer:true
      };
    })
  ];
  const grandTotalAfterAddition=combinedRows.reduce((s,r)=>s+r.afterAddition,0);
  const scale=grandTotalAfterAddition>0?effectiveTarget/grandTotalAfterAddition:0;
  const finalRows=combinedRows.map(r=>{
    const newQtyPure=r.afterAddition*scale;
    const pct=parseFloat(r.pigmentPct)||0;
    const newQtyRaw=r.isStr&&pct>0?newQtyPure/(pct/100):newQtyPure;
    return {...r,newQty:newQtyPure,newQtyRaw,newPigmentPct:pct};
  });

  const hasValidInputs=currentTotal>0&&validStainers.length>0&&effectiveTarget>0;
  const fmt=(v)=>v!==0?v.toFixed(3):"—";
  const pctChange=effectiveTarget>0&&currentTotal>0?((effectiveTarget-currentTotal)/currentTotal*100):0;
  const prodBatchSizeNum=parseFloat(batchSize)||0;
  const multiplierToBase=bomBaseSize>0&&prodBatchSizeNum>0?prodBatchSizeNum/bomBaseSize:0;

  const submitForApproval=async()=>{
    if(!hasValidInputs)return;
    if(!canSubmit)return showToast("You don't have permission to submit shade corrections","error");
    setSubmitting(true);
    try{
      const suggestedAtBase=finalRows.map(r=>({
        name:r.name,oldQty:r.oldQtyRaw,newQty:r.newQtyRaw,
        newQtyAtBase:multiplierToBase>0?r.newQtyRaw/multiplierToBase:r.newQtyRaw,
        isNew:r.isNew,matchedIngId:r.isNew?null:r.id,
        isStr:r.isStr,pigmentPct:r.pigmentPct||null,
        adjustMode:r.adjustMode||"qty",newPigmentPct:r.newPigmentPct||null
      }));
      await C("shade_corrections").add({
        productName:productName||(boms.find(b=>b.id===bomId)?.productName)||"",
        batchId:batchId||null,
        batchNo:allBatches.find(b=>b.id===batchId)?.batchNo||null,
        bomId:bomId||null,
        bomBaseBatchSize:bomBaseSize||null,
        productionBatchSize:prodBatchSizeNum,
        pigments:pigments.filter(p=>p.name.trim()).map(p=>({name:p.name,qty:parseFloat(p.qty)||0})),
        stainers:validStainers.map(s=>({name:s.name,amt:parseFloat(s.amt),pigment:parseFloat(s.pigment)})),
        targetTotal:effectiveTarget,
        suggestedRows:suggestedAtBase,
        status:"Pending",
        createdBy:user?.email||"",
        _createdAt:ts()
      });
      if(batchId){
        await C("batches").doc(batchId).update({shadeCorrectionStatus:"Pending"});
      }
      showToast("Submitted for approval ✓ — Admin/Issuer will review");
    }catch(e){showToast("Error: "+e.message,"error");}
    setSubmitting(false);
  };

  const approveCorrection=async(corr,overrideRows,overrideIngredients)=>{
    if(!canApprove)return showToast("You don't have permission to approve shade corrections","error");
    if(!corr.bomId)return showToast("No BOM linked — cannot apply","error");
    setReviewingId(corr.id);
    try{
      const rowsToApply=overrideRows||corr.suggestedRows;
      const bomSnap=await C("bom_products").doc(corr.bomId).get();
      if(!bomSnap.exists)throw new Error("BOM no longer exists");
      const bomData=bomSnap.data();
      let ingredients;
      const pctNotes=[];
      if(overrideIngredients){
        // Full-BOM edit path: admin reviewed/reordered the whole ingredient list directly
        ingredients=overrideIngredients.map(({_changed,...i})=>i);
      }else{
        ingredients=[...(bomData.ingredients||[])];
        rowsToApply.forEach(row=>{
          if(row.adjustMode==="pct"){
            pctNotes.push(`${row.name}: update stainer concentration to ${row.newPigmentPct?.toFixed(2)}% (was ${row.pigmentPct}%) — qty in this BOM unchanged`);
            return;
          }
          if(row.matchedIngId){
            const idx=ingredients.findIndex(i=>i.id===row.matchedIngId);
            if(idx>=0)ingredients[idx]={...ingredients[idx],standardQty:row.newQtyAtBase.toFixed(3)};
          }else{
            ingredients.push({id:newId(),name:row.name,standardQty:row.newQtyAtBase.toFixed(3),isProcess:false});
          }
        });
      }
      // Archive current version, then update
      await C("bom_versions").add({...bomData,productId:corr.bomId,archivedAt:ts(),archivedBy:user.email});
      await C("bom_products").doc(corr.bomId).update({ingredients,currentVersion:(bomData.currentVersion||1)+1,updatedBy:user.email,updatedAt:ts()});
      await C("shade_corrections").doc(corr.id).update({status:"Approved",reviewedBy:user.email,reviewedAt:ts(),appliedRows:rowsToApply,...(overrideRows||overrideIngredients?{editedByApprover:true}:{})});
      if(corr.batchId)await C("batches").doc(corr.batchId).update({shadeCorrectionStatus:"Approved"});
      showToast(pctNotes.length?"Approved — BOM updated. "+pctNotes.join("; "):"Approved & applied to BOM — new version saved ✓");
    }catch(e){showToast("Error: "+e.message,"error");}
    setReviewingId(null);
    setEditingCorrId(null);
  };

  const rejectCorrection=async(corr)=>{
    if(!canApprove)return showToast("You don't have permission to reject shade corrections","error");
    setReviewingId(corr.id);
    try{
      await C("shade_corrections").doc(corr.id).update({status:"Rejected",reviewedBy:user.email,reviewedAt:ts()});
      if(corr.batchId)await C("batches").doc(corr.batchId).update({shadeCorrectionStatus:"Rejected"});
      showToast("Rejected — treated as one-time correction, BOM unchanged");
    }catch(e){showToast("Error: "+e.message,"error");}
    setReviewingId(null);
  };

  const [editBomIngredients,setEditBomIngredients]=useState([]);
  const [loadingFullBom,setLoadingFullBom]=useState(false);
  const startEditingCorrection=async(corr)=>{
    setEditingCorrId(corr.id);
    const corrMultiplier=corr.bomBaseBatchSize>0?corr.productionBatchSize/corr.bomBaseBatchSize:1;
    setEditRows(corr.suggestedRows.map(r=>({...r,_mult:corrMultiplier})));
    // Fetch the FULL current BOM so admin can see everything, not just the changed pigments,
    // and can reorder the ingredient sequence before approving.
    if(corr.bomId){
      setLoadingFullBom(true);
      try{
        const bomSnap=await C("bom_products").doc(corr.bomId).get();
        if(bomSnap.exists){
          const bomData=bomSnap.data();
          let ingredients=(bomData.ingredients||[]).map(i=>({...i}));
          corr.suggestedRows.forEach(row=>{
            if(row.adjustMode==="pct")return; // qty unchanged for stainer-% rows
            if(row.matchedIngId){
              const idx=ingredients.findIndex(i=>i.id===row.matchedIngId);
              if(idx>=0)ingredients[idx]={...ingredients[idx],standardQty:row.newQtyAtBase.toFixed(3),_changed:true};
            }else{
              ingredients.push({id:newId(),name:row.name,standardQty:row.newQtyAtBase.toFixed(3),isProcess:false,_changed:true});
            }
          });
          setEditBomIngredients(ingredients);
        }
      }catch(e){showToast("Error loading BOM: "+e.message,"error");}
      setLoadingFullBom(false);
    }
  };
  const moveIngredient=(idx,dir)=>setEditBomIngredients(list=>{
    const newIdx=idx+dir;
    if(newIdx<0||newIdx>=list.length)return list;
    const copy=[...list];
    [copy[idx],copy[newIdx]]=[copy[newIdx],copy[idx]];
    return copy;
  });
  const updateBomIngredientQty=(idx,val)=>setEditBomIngredients(list=>list.map((ing,i)=>i===idx?{...ing,standardQty:val}:ing));
  const updateEditRow=(idx,field,val)=>setEditRows(rows=>rows.map((r,i)=>{
    if(i!==idx)return r;
    if(field==="newQty"){
      const v=parseFloat(val)||0;
      return {...r,newQty:val,newQtyAtBase:r._mult>0?v/r._mult:v};
    }
    return {...r,[field]:val};
  }));
  const roundEditRow=(idx,decimals)=>setEditRows(rows=>rows.map((r,i)=>{
    if(i!==idx)return r;
    if(r.adjustMode==="pct"){
      const rounded=parseFloat((parseFloat(r.newPigmentPct)||0).toFixed(decimals));
      return {...r,newPigmentPct:rounded};
    }
    const rounded=parseFloat((parseFloat(r.newQty)||0).toFixed(decimals));
    return {...r,newQty:rounded,newQtyAtBase:r._mult>0?rounded/r._mult:rounded};
  }));
  const saveEditsAndApprove=(corr)=>approveCorrection(corr,editRows.map(({_mult,...r})=>r),editBomIngredients.length?editBomIngredients:null);

  return <div>
    <SectionHead title="🎯 Shade Correction → Pigment Ratio Tuner"/>
    <InfoBox color="#3b82f6">Select the product and batch where a stainer was added to correct shade. The tool redistributes pigment proportionally — maintain total pigment level, or increase/decrease it — then submit for Admin/Issuer approval before it's applied to the BOM.</InfoBox>

    {/* Pending Corrections — visible to all, actionable by admin/issuer */}
    {pendingCorrections.length>0&&<div style={{background:"#0c1a2e",border:"1px solid #06b6d440",borderRadius:"10px",padding:"14px",marginBottom:"18px"}}>
      <div style={{fontSize:"12px",fontWeight:"700",color:"#22d3ee",marginBottom:"10px"}}>⏳ Pending Shade Corrections ({pendingCorrections.length})</div>
      {pendingCorrections.map(corr=>{
        const isEditing=editingCorrId===corr.id;
        return <div key={corr.id} style={{background:"#080d18",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 12px",marginBottom:"8px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:"8px"}}>
          <div>
            <div style={{fontSize:"13px",fontWeight:"700",color:"#e2e8f0"}}>{corr.productName} {corr.batchNo&&<span style={{color:"#64748b",fontWeight:"400"}}>· Batch {corr.batchNo}</span>}</div>
            <div style={{fontSize:"11px",color:"#64748b",marginTop:"3px"}}>
              Stainer: {corr.stainers.map(s=>s.name).join(", ")} · Target pigment: {corr.targetTotal.toFixed(2)} · Submitted by {corr.createdBy}
            </div>
          </div>
          {canApprove&&!isEditing&&<div style={{display:"flex",gap:"6px",flexShrink:0}}>
            <button disabled={reviewingId===corr.id} onClick={()=>startEditingCorrection(corr)} style={{background:"#1e1b4b",border:"1px solid #4338ca",borderRadius:"6px",color:"#a5b4fc",cursor:"pointer",fontSize:"12px",fontWeight:"600",padding:"5px 12px"}}>✏️ Edit</button>
            <button disabled={reviewingId===corr.id} onClick={()=>approveCorrection(corr)} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",color:"#4ade80",cursor:"pointer",fontSize:"12px",fontWeight:"600",padding:"5px 12px"}}>✅ Approve & Apply</button>
            <button disabled={reviewingId===corr.id} onClick={()=>rejectCorrection(corr)} style={{background:"#2e0a0a",border:"1px solid #7f1d1d",borderRadius:"6px",color:"#f87171",cursor:"pointer",fontSize:"12px",fontWeight:"600",padding:"5px 12px"}}>❌ Reject</button>
          </div>}
          {!canApprove&&<span style={{fontSize:"11px",color:"#475569",fontStyle:"italic"}}>Awaiting Admin/Issuer review</span>}
        </div>

        {!isEditing&&<div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginTop:"8px"}}>
          {corr.suggestedRows.map((r,i)=><span key={i} style={{fontSize:"10.5px",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"6px",padding:"2px 8px",color:"#94a3b8"}}>
            {r.name}: {r.oldQty.toFixed(2)}→<strong style={{color:"#4ade80"}}>{r.newQty.toFixed(2)}</strong>
            {r.isNew&&<span style={{color:"#d8b4fe"}}> · new stainer line</span>}
          </span>)}
        </div>}

        {isEditing&&<div style={{marginTop:"10px",border:"1px solid #4338ca40",borderRadius:"8px",overflow:"hidden"}}>
          <div style={{padding:"8px 10px",background:"#0b1220",fontSize:"11px",color:"#a5b4fc",fontWeight:"700"}}>
            📋 Full BOM — reorder with ▲▼, edit any quantity. Rows marked 🎯 were changed by this correction.
          </div>
          {loadingFullBom&&<div style={{padding:"16px",textAlign:"center",fontSize:"12px",color:"#64748b"}}>Loading BOM…</div>}
          {!loadingFullBom&&<>
            <div style={{display:"grid",gridTemplateColumns:"50px 1.6fr 110px",gap:"6px",background:"#0b1220",padding:"6px 10px",borderTop:"1px solid #1e293b"}}>
              {["Order","Ingredient","Quantity"].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
            </div>
            {editBomIngredients.map((ing,idx)=><div key={ing.id||idx} style={{display:"grid",gridTemplateColumns:"50px 1.6fr 110px",gap:"6px",padding:"6px 10px",borderTop:"1px solid #1e293b",alignItems:"center",background:ing._changed?"#0c1a2e":"transparent"}}>
              <div style={{display:"flex",gap:"3px"}}>
                <button onClick={()=>moveIngredient(idx,-1)} disabled={idx===0} style={{background:"none",border:"1px solid #334155",borderRadius:"4px",color:idx===0?"#1e293b":"#94a3b8",cursor:idx===0?"default":"pointer",fontSize:"10px",padding:"2px 5px"}}>▲</button>
                <button onClick={()=>moveIngredient(idx,1)} disabled={idx===editBomIngredients.length-1} style={{background:"none",border:"1px solid #334155",borderRadius:"4px",color:idx===editBomIngredients.length-1?"#1e293b":"#94a3b8",cursor:idx===editBomIngredients.length-1?"default":"pointer",fontSize:"10px",padding:"2px 5px"}}>▼</button>
              </div>
              {ing.isProcess
                ?<div style={{fontSize:"11px",color:"#94a3b8",fontStyle:"italic",fontWeight:"600"}}>⚙ {ing.name}</div>
                :<div style={{fontSize:"12px",color:"#e2e8f0"}}>{ing.name}{ing._changed&&<span style={{fontSize:"10px",color:"#22d3ee",marginLeft:"6px"}}>🎯 changed</span>}</div>}
              {!ing.isProcess&&<input style={{...sml,textAlign:"center",borderColor:ing._changed?"#22d3ee60":"#1e293b"}} type="number" step="0.001" value={ing.standardQty} onChange={e=>updateBomIngredientQty(idx,e.target.value)}/>}
            </div>)}
          </>}
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",padding:"10px",background:"#0a1520"}}>
            <button onClick={()=>setEditingCorrId(null)} style={{background:"none",border:"1px solid #334155",borderRadius:"6px",color:"#64748b",cursor:"pointer",fontSize:"12px",padding:"6px 14px"}}>Cancel</button>
            <button disabled={reviewingId===corr.id||loadingFullBom} onClick={()=>saveEditsAndApprove(corr)} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",color:"#4ade80",cursor:"pointer",fontSize:"12px",fontWeight:"600",padding:"6px 14px"}}>💾 Save BOM &amp; Approve</button>
          </div>
        </div>}
      </div>;})}
    </div>}

    {/* Product + Batch selection */}
    <Grid2>
      <Field label="Select Product">
        <div style={{position:"relative"}}>
          <input
            style={inp}
            value={productName||productSearch}
            onChange={e=>{setProductSearch(e.target.value);setProductName("");setBatchId("");setShowProductList(true);}}
            onFocus={()=>{setShowProductList(true);if(productName){setProductSearch("");}}}
            onBlur={()=>setTimeout(()=>setShowProductList(false),150)}
            placeholder="🔍 Type to search… ignores spaces & special characters"
          />
          {showProductList&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,zIndex:50,background:"#0b1220",border:"1px solid #1e3a5f",borderRadius:"8px",maxHeight:"220px",overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,0.4)"}}>
            {filteredProductNames.length===0&&<div style={{padding:"10px 12px",fontSize:"12px",color:"#475569"}}>No matching products</div>}
            {filteredProductNames.map(n=><div key={n}
              onMouseDown={e=>{e.preventDefault();setProductName(n);setProductSearch("");setBatchId("");setShowProductList(false);}}
              style={{padding:"8px 12px",fontSize:"13px",color:"#e2e8f0",cursor:"pointer",borderBottom:"1px solid #1e293b"}}
              onMouseEnter={e=>e.currentTarget.style.background="#1e293b"}
              onMouseLeave={e=>e.currentTarget.style.background="transparent"}>{n}</div>)}
          </div>}
        </div>
      </Field>
      <Field label="Select Batch Number">
        <select style={sl} value={batchId} onChange={e=>loadFromBatch(e.target.value)} disabled={!productName}>
          <option value="">— Select a batch —</option>
          {batchesForProduct.map(b=><option key={b.id} value={b.id}>{b.batchNo} · {b.batchSize}{b.unit} · {b.dateIssued}</option>)}
        </select>
        {productName&&batchesForProduct.length===0&&<div style={{fontSize:"10px",color:"#475569",marginTop:"5px"}}>No correctable batches — all batches for this product are already Packed or QC Pass.</div>}
        {productName&&batchesForProduct.length>0&&<div style={{fontSize:"10px",color:"#475569",marginTop:"5px"}}>Packed &amp; QC Pass batches are hidden — no correction needed for those.</div>}
      </Field>
    </Grid2>

    <Grid2>
      <Field label="Batch Size (actual, can edit if different)">
        <div style={{display:"flex",gap:"6px"}}>
          <input style={inp} value={batchSize} onChange={e=>setBatchSize(e.target.value)} placeholder="100"/>
          {lastScaledSize>0&&<button onClick={rescaleToBatchSize} title="Rescale pigment quantities to this batch size" style={{background:"#0f1d35",border:"1px solid #3b82f660",borderRadius:"8px",padding:"0 14px",color:"#93c5fd",cursor:"pointer",fontSize:"12px",fontWeight:"600",whiteSpace:"nowrap"}}>↻ Rescale</button>}
        </div>
      </Field>
      <Field label="Linked BOM"><div style={{...inp,display:"flex",alignItems:"center",color:bomId?"#94a3b8":"#475569"}}>{bomId?boms.find(b=>b.id===bomId)?.productName+" (base "+bomBaseSize+")":"— none linked, manual entry —"}</div></Field>
    </Grid2>

    {/* Pigments in batch */}
    <div style={{marginBottom:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px",flexWrap:"wrap",gap:"8px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em"}}>{formulationType==="stainer"?"Stainers Currently in Batch":"Pigments Currently in Batch"}</div>
        <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
          <div style={{display:"flex",gap:"4px",background:"#080d18",border:"1px solid #1e293b",borderRadius:"7px",padding:"3px"}}>
            <button onClick={()=>setFormulationType("pigment")} style={{fontSize:"11px",padding:"4px 10px",borderRadius:"5px",border:"none",background:formulationType==="pigment"?"#1e293b":"transparent",color:formulationType==="pigment"?"#93c5fd":"#475569",cursor:"pointer",fontWeight:formulationType==="pigment"?"700":"400"}}>🎨 Pigment-based</button>
            <button onClick={()=>setFormulationType("stainer")} style={{fontSize:"11px",padding:"4px 10px",borderRadius:"5px",border:"none",background:formulationType==="stainer"?"#2e1065":"transparent",color:formulationType==="stainer"?"#d8b4fe":"#475569",cursor:"pointer",fontWeight:formulationType==="stainer"?"700":"400"}}>🧪 Stainer-based</button>
          </div>
          <button onClick={addPigment} style={{background:"none",border:"1px dashed #1e3a5f",borderRadius:"6px",padding:"4px 14px",color:"#93c5fd",cursor:"pointer",fontSize:"12px",fontWeight:"600"}}>+ Add {formulationType==="stainer"?"Stainer":"Pigment"}</button>
        </div>
      </div>
      <div style={{fontSize:"10px",color:"#475569",marginBottom:"8px"}}>Auto-detected from the original formulation when loaded from a BOM — switch manually if you want the recommendation expressed the other way.</div>
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden"}}>
        <div style={{display:"grid",gridTemplateColumns:formulationType==="stainer"?"1.6fr 100px 90px 28px":"1.6fr 100px 28px",gap:"6px",background:"#0b1220",padding:"6px 10px"}}>
          {(formulationType==="stainer"?["Name","Current Qty","Pigment %",""]:["Pigment Name","Current Qty",""]).map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
        </div>
        {pigments.map((p,i)=>
          <div key={p.id} style={{display:"grid",gridTemplateColumns:formulationType==="stainer"?"1.6fr 100px 90px 28px":"1.6fr 100px 28px",gap:"6px",padding:"7px 10px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
            <input style={sml} value={p.name} onChange={e=>updatePigment(p.id,"name",e.target.value)} placeholder={(formulationType==="stainer"?"Stainer ":"Pigment ")+(i+1)+" (e.g. Titanium Dioxide)"}/>
            <input style={{...sml,textAlign:"center"}} type="number" min="0" step="0.001" value={p.qty} onChange={e=>updatePigment(p.id,"qty",e.target.value)} placeholder="kg"/>
            {formulationType==="stainer"&&<input style={{...sml,textAlign:"center",borderColor:!parseFloat(p.pigmentPct)?"#f59e0b60":"#1e293b"}} type="number" min="0" max="100" step="0.1" value={p.pigmentPct} onChange={e=>updatePigment(p.id,"pigmentPct",e.target.value)} placeholder="%"/>}
            <button onClick={()=>removePigment(p.id)} disabled={pigments.length===1} style={{background:"none",border:"none",color:pigments.length>1?"#ef4444":"#1e293b",cursor:pigments.length>1?"pointer":"default",fontSize:"16px",lineHeight:1,padding:0}}>×</button>
          </div>
        )}
        {pigments.length>1&&<div style={{display:"grid",gridTemplateColumns:formulationType==="stainer"?"1.6fr 100px 90px 28px":"1.6fr 100px 28px",gap:"6px",padding:"6px 10px",borderTop:"1px solid #1e3a5f",background:"#0a1520"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:"#475569"}}>CURRENT TOTAL{formulationType==="stainer"?" (pure pigment)":""}</div>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#f1f5f9",textAlign:"center"}}>{currentTotal.toFixed(3)}</div>
          <div/>{formulationType==="stainer"&&<div/>}
        </div>}
      </div>
      {missingStrPct&&<div style={{fontSize:"11px",color:"#f59e0b",marginTop:"6px"}}>⚠ Enter Pigment % for the stainer(s) above — without it, pigment contribution can't be calculated.</div>}
    </div>

    {/* Target total pigment */}
    <div style={{background:"#080d18",border:`1px solid ${targetOverride?"#f59e0b40":"#1e293b"}`,borderRadius:"8px",padding:"10px 12px",marginBottom:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:targetOverride?"#f59e0b":"#64748b",textTransform:"uppercase",letterSpacing:"0.06em"}}>
          Target Total Pigment {!targetOverride&&<span style={{fontWeight:"400",color:"#334155"}}>(= current total — maintained)</span>}
        </div>
        <button onClick={()=>{setTargetOverride(v=>!v);if(targetOverride)setTargetTotal("");}}
          style={{background:targetOverride?"#78350f30":"#0b1220",border:`1px solid ${targetOverride?"#f59e0b":"#334155"}`,borderRadius:"6px",padding:"3px 10px",color:targetOverride?"#f59e0b":"#475569",cursor:"pointer",fontSize:"11px",fontWeight:"600"}}>
          {targetOverride?"✓ Custom (click to reset)":"✏️ Increase / decrease target"}
        </button>
      </div>
      {targetOverride
        ?<input style={{...inp,borderColor:"#f59e0b60"}} type="number" min="0" step="0.001" value={targetTotal} onChange={e=>setTargetTotal(e.target.value)} placeholder={"e.g. "+(currentTotal*1.1).toFixed(2)+" to increase 10%"}/>
        :<div style={{fontSize:"18px",fontWeight:"700",color:"#94a3b8",padding:"4px 0"}}>{currentTotal.toFixed(3)}</div>}
      {targetOverride&&effectiveTarget>0&&currentTotal>0&&<div style={{fontSize:"11px",color:pctChange>=0?"#4ade80":"#f87171",marginTop:"4px"}}>
        {pctChange>=0?"↑":"↓"} {Math.abs(pctChange).toFixed(1)}% vs current pigment level
      </div>}
    </div>

    {/* Stainer rows */}
    <div style={{marginBottom:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em"}}>Stainer(s) Added to Correct Shade</div>
        <button onClick={addStainer} style={{background:"none",border:"1px dashed #1e3a5f",borderRadius:"6px",padding:"4px 14px",color:"#93c5fd",cursor:"pointer",fontSize:"12px",fontWeight:"600"}}>+ Add Stainer</button>
      </div>
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden"}}>
        <div style={{display:"grid",gridTemplateColumns:"1.6fr 90px 90px 28px",gap:"6px",background:"#0b1220",padding:"6px 10px"}}>
          {["Stainer Name","Amt","Pigment %",""].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
        </div>
        {stainers.map((s,i)=><div key={s.id} style={{display:"grid",gridTemplateColumns:"1.6fr 90px 90px 28px",gap:"6px",padding:"7px 10px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
          <input style={sml} value={s.name} onChange={e=>updateStainer(s.id,"name",e.target.value)} placeholder={"e.g. Titanium Dioxide Stainer"}/>
          <input style={{...sml,textAlign:"center"}} type="number" min="0" step="0.01" value={s.amt} onChange={e=>updateStainer(s.id,"amt",e.target.value)} placeholder="kg"/>
          <input style={{...sml,textAlign:"center"}} type="number" min="0" max="100" step="0.1" value={s.pigment} onChange={e=>updateStainer(s.id,"pigment",e.target.value)} placeholder="%"/>
          <button onClick={()=>removeStainer(s.id)} disabled={stainers.length===1} style={{background:"none",border:"none",color:stainers.length>1?"#ef4444":"#1e293b",cursor:stainers.length>1?"pointer":"default",fontSize:"16px",lineHeight:1,padding:0}}>×</button>
        </div>)}
      </div>
      <div style={{fontSize:"10px",color:"#475569",marginTop:"6px"}}>If the name matches an existing pigment/stainer above, it's merged in automatically. Otherwise it's added as a new line, correctly converted using its own pigment%.</div>
    </div>

    {/* Results */}
    {hasValidInputs&&<div style={{background:"#080d18",border:"1px solid #1e3a5f",borderRadius:"12px",padding:"16px",marginBottom:"14px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"4px"}}>📊 Suggested Pigment Ratio (per {batchSize} batch)</div>
      <div style={{fontSize:"13px",color:"#94a3b8",marginBottom:"12px"}}>Total Pigment: <strong style={{color:"#4ade80",fontSize:"15px"}}>{effectiveTarget.toFixed(3)}</strong> <span style={{fontSize:"11px",color:"#64748b"}}>{targetOverride?(pctChange>=0?"(↑ increased)":"(↓ decreased)"):"(maintained — same as before)"}</span></div>
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden"}}>
        <div style={{display:"grid",gridTemplateColumns:"1.6fr 90px 90px 100px 110px",gap:"6px",background:"#0b1220",padding:"6px 10px"}}>
          {["Pigment","Current","Stainer","Total Pigment","Suggested New"].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
        </div>
        {finalRows.map(r=><div key={r.id} style={{display:"grid",gridTemplateColumns:"1.6fr 90px 90px 100px 110px",gap:"6px",padding:"8px 10px",borderTop:"1px solid #1e293b",alignItems:"center",background:r.added>0?"#06100d":"#080d18"}}>
          <div>
            <div style={{fontSize:"12px",color:"#e2e8f0",fontWeight:"600"}}>{r.name}</div>
            {r.isNew&&<div style={{fontSize:"10px",color:"#f59e0b"}}>⚠ New — add to BOM</div>}
            {r.isStr&&r.isStandaloneStainer&&<div style={{fontSize:"10px",color:"#d8b4fe"}}>🎨 New stainer addition @ {r.pigmentPct||"?"}% — kept separate, qty shown is raw stainer to add</div>}
            {r.isStr&&!r.isStandaloneStainer&&<div style={{fontSize:"10px",color:"#22d3ee"}}>🎨 Stainer @ {r.pigmentPct||"?"}% — qty shown is raw material</div>}
          </div>
          <div style={{fontSize:"12px",color:"#64748b",textAlign:"center"}}>{r.oldQtyRaw>0?r.oldQtyRaw.toFixed(3):"—"}</div>
          <div style={{fontSize:"12px",color:r.added>0?"#fbbf24":"#334155",fontWeight:r.added>0?"700":"400",textAlign:"center"}}>{r.added>0?"+"+r.added.toFixed(3):"—"}</div>
          <div style={{fontSize:"12px",color:"#94a3b8",textAlign:"center"}}>{r.afterAddition.toFixed(3)}</div>
          <div style={{fontSize:"13px",color:"#4ade80",fontWeight:"700",textAlign:"center"}}>{r.newQtyRaw.toFixed(3)}</div>
        </div>)}
        <div style={{display:"grid",gridTemplateColumns:"1.6fr 90px 90px 100px 110px",gap:"6px",padding:"7px 10px",borderTop:"1px solid #1e3a5f",background:"#0a1520"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:"#475569"}}>TOTAL (pure pigment)</div>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#f1f5f9",textAlign:"center"}}>{currentTotal.toFixed(3)}</div>
          <div/><div/>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#4ade80",textAlign:"center"}}>{finalRows.reduce((s,r)=>s+r.newQty,0).toFixed(3)}</div>
        </div>
      </div>

      {bomId
        ?<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"8px",padding:"12px 16px",marginTop:"10px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"10px"}}>
          <div style={{fontSize:"12.5px",color:"#86efac",lineHeight:1.7}}>
            ✅ Linked to a real batch &amp; BOM. Submit for review — Admin/Issuer can approve to permanently update the BOM, or reject if this was a one-time correction.
          </div>
          {canSubmit
            ?<button disabled={submitting} onClick={submitForApproval} style={{background:"#22c55e",border:"none",borderRadius:"8px",padding:"9px 18px",color:"#06200f",cursor:"pointer",fontSize:"13px",fontWeight:"700",whiteSpace:"nowrap"}}>{submitting?"Submitting…":"📤 Submit for Approval"}</button>
            :<span style={{fontSize:"11px",color:"#475569",fontStyle:"italic",whiteSpace:"nowrap"}}>No permission to submit</span>}
        </div>
        :<div style={{background:"#1a1500",border:"1px solid #92400e40",borderRadius:"8px",padding:"12px 16px",marginTop:"10px"}}>
          <div style={{fontSize:"12.5px",color:"#fcd34d",lineHeight:1.7}}>
            ⚠ No batch/BOM linked — this is a manual what-if calculation only. Select a Product + Batch Number above to enable submitting this for approval.
          </div>
        </div>}
    </div>}

    <div style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"8px",padding:"11px 14px"}}>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px"}}>Formula</div>
      <div style={{fontSize:"11px",color:"#475569",lineHeight:1.8}}>
        <div>Stainer Pure Pigment = Stainer Amount × Stainer Pigment% ÷ 100</div>
        <div>Subtotal (per pigment) = Current Qty + Stainer Pigment (if matched to that pigment)</div>
        <div>Scale Factor = Target Total Pigment ÷ Sum of All Subtotals</div>
        <div>Suggested New Qty = Subtotal × Scale Factor</div>
        <div style={{color:"#334155",marginTop:"4px"}}>Default target = current total (maintains pigment level). Increase the target to raise overall pigment loading.</div>
      </div>
    </div>
  </div>;
}

function MainApp({user,role,roles=[],permissions=[]}){
  const isAdmin=roles.includes("admin");
  const hp=(perm)=>userHasPerm(roles,permissions,perm); // check permission helper
  // Global: pressing Escape clears any focused search/text input
  useEffect(()=>{
    const handler=(e)=>{
      if(e.key==="Escape"){
        const el=document.activeElement;
        if(el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")&&el.value){
          e.preventDefault();
          // Trigger React's synthetic onChange by setting nativeInputValueSetter
          const nativeInputValueSetter=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,"value").set;
          nativeInputValueSetter.call(el,"");
          el.dispatchEvent(new Event("input",{bubbles:true}));
          el.blur();
        }
      }
    };
    document.addEventListener("keydown",handler);
    return()=>document.removeEventListener("keydown",handler);
  },[]);
  const canQC=isAdmin||roles.includes("qc")||hp("batches_qc");
  const canIssuer=isAdmin||roles.includes("issuer")||hp("batches_issue");
  const [tab,setTab]=useState(CAN_SEE.dashboard.some(r=>(roles.length?roles:[role]).includes(r))?"dashboard":"complaints");
  const [settingsDirty,setSettingsDirty]=useState(false);
  const [pendingMainTab,setPendingMainTab]=useState(null);

  const trySetTab=(key)=>{
    if(tab==="settings"&&settingsDirty){setPendingMainTab(key);}
    else{setTab(key);}
  };
  const [rdSubTab,setRdSubTab]=useState("projects");
  const [batchSubTab,setBatchSubTab]=useState("batches"); // "batches" | "oldstock"

  // Products & QC params loaded from Firestore settings
  const [sysProducts,setSysProducts]=useState(null); // null = not yet loaded
  const [sysQcParams,setSysQcParams]=useState(DEFAULT_QC_PARAMS);
  const [sysPackSizes,setSysPackSizes]=useState(DEFAULT_PACK_SIZES_BY_CAT);
  const [sysCatUnits,setSysCatUnits]=useState({});
  const [sysUnits,setSysUnits]=useState([...BATCH_UNITS]);
  const [sysPaintTypes,setSysPaintTypes]=useState([...PAINT_TYPES]);
  const [sysRmCats,setSysRmCats]=useState([...RM_CATEGORIES]);

  // Add a new RM category or unit globally (from any screen) — saves to Firestore immediately
  const addGlobalRmCat=async(cat)=>{
    if(!cat.trim()||sysRmCats.includes(cat.trim()))return;
    const updated=[...sysRmCats,cat.trim()].sort((a,b)=>a.localeCompare(b));
    setSysRmCats(updated);
    try{await C("settings").doc("products").set({rmCategories:updated},{merge:true});}catch(e){}
  };
  const addGlobalUnit=async(unit)=>{
    if(!unit.trim()||sysUnits.includes(unit.trim()))return;
    const updated=[...sysUnits,unit.trim()].sort((a,b)=>a.localeCompare(b));
    setSysUnits(updated);
    try{await C("settings").doc("products").set({units:updated},{merge:true});}catch(e){}
  };
  const [oldStocks,setOldStocks]=useState([]);
  const [allRoles,setAllRoles]=useState({});       // email -> roles array (for task assignment)
  const [allPermissions,setAllPermissions]=useState({}); // email -> explicit permission overrides array
  const [allProfiles,setAllProfiles]=useState({}); // email -> profile
  const [notifications,setNotifications]=useState([]);  // unread notifications for current user
  const [showNotifs,setShowNotifs]=useState(false);

  // Data
  const [batches,setBatches]=useState([]);
  const [complaints,setComplaints]=useState([]);
  const [projects,setProjects]=useState([]);
  const [rmTests,setRmTests]=useState([]);

  // Modals/views
  const [activeBatch,setActiveBatch]=useState(null);
  const [activeComplaint,setActiveComplaint]=useState(null);
  const [activeProject,setActiveProject]=useState(null);
  const [viewRM,setViewRM]=useState(null);
  const [showIssueBatch,setShowIssueBatch]=useState(false);
  const [showChangePw,setShowChangePw]=useState(false);
  const [cpForm,setCpForm]=useState({cur:"",nw:"",nw2:""});
  const [cpError,setCpError]=useState("");
  const [cpSaving,setCpSaving]=useState(false);

  const doChangePw=async()=>{
    if(cpForm.nw.length<6)return setCpError("New password must be at least 6 characters.");
    if(cpForm.nw!==cpForm.nw2)return setCpError("Passwords do not match.");
    setCpSaving(true);setCpError("");
    try{
      const u=auth.currentUser;
      // Re-authenticate first
      const cred=firebase.auth.EmailAuthProvider.credential(u.email,cpForm.cur);
