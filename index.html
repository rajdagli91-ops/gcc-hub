function BOMTab({role,roles,user,showToast,sysProducts,sysPackSizes,sysQcParams}){
  const isAdmin=roles.includes("admin");
  const canEdit=roles.some(r=>["admin","qc","issuer"].includes(r));
  const [boms,setBoms]=useState([]);
  const [versions,setVersions]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState("");
  const [filterCat,setFilterCat]=useState("All");
  const [activeBOM,setActiveBOM]=useState(null); // {bom, mode: "view"|"edit"|"print"|"history"}
  const [showCreate,setShowCreate]=useState(false);
  const [saving,setSaving]=useState(false);

  const defaultQCParams=(category)=>{
    const settingsParams=category&&(sysQcParams||DEFAULT_QC_PARAMS)[category];
    if(settingsParams?.length) return settingsParams.map(p=>({id:newId(),name:typeof p==="string"?p:(p.name||""),standard:""}));
    return [{id:newId(),name:"SD (Drying)",standard:""},{id:newId(),name:"TF (Drying)",standard:""},{id:newId(),name:"HD (Drying)",standard:""},{id:newId(),name:"Colour",standard:""},{id:newId(),name:"Finish",standard:""},{id:newId(),name:"Viscosity",standard:""},{id:newId(),name:"Specific Gravity",standard:""}];
  };
  const blankBOM={productName:"",category:"",baseBatchSize:"100",baseUnit:"L",
    ingredients:[{id:newId(),name:"",standardQty:"",isProcess:false}],
    qcTests:defaultQCParams(""),
    packingSizes:[]};
  const [form,setForm]=useState({...blankBOM});

  useEffect(()=>{
    const u1=C("bom_products").orderBy("productName").onSnapshot(s=>{setBoms(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},()=>setLoading(false));
    const u2=C("bom_versions").orderBy("archivedAt","desc").onSnapshot(s=>setVersions(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});
    return()=>{u1();u2();};
  },[]);

  const saveBOM=async(isEdit=false,editId=null)=>{
    if(!form.productName.trim())return showToast("Product name required","error");
    setSaving(true);
    try{
      if(isEdit&&editId){
        // Archive current version first
        const curr=boms.find(b=>b.id===editId);
        if(curr){
          await C("bom_versions").add({...curr,productId:editId,archivedAt:ts(),archivedBy:user.email});
        }
        const newVer=(curr?.currentVersion||1)+1;
        await C("bom_products").doc(editId).update({...form,currentVersion:newVer,updatedBy:user.email,updatedAt:ts()});
        showToast(`BOM updated to v${newVer} — previous version archived ✓`);
      }else{
        await C("bom_products").add({...form,currentVersion:1,createdBy:user.email,createdAt:ts(),updatedAt:ts()});
        showToast("BOM created ✓");
      }
      setShowCreate(false);setActiveBOM(null);setForm({...blankBOM});
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const deleteBOM=async(id)=>{
    if(!confirm("Delete this BOM and all its version history?"))return;
    const vids=versions.filter(v=>v.productId===id).map(v=>v.id);
    await Promise.all(vids.map(vid=>C("bom_versions").doc(vid).delete()));
    await C("bom_products").doc(id).delete();
    showToast("BOM deleted","error");setActiveBOM(null);
  };

  const exportAllBOMs=()=>{
    if(!boms.length)return showToast("No BOMs to export","error");
    const rows=[["Product Name","Category","Base Batch Size","Unit","Version","Last Updated","Ingredient No","Ingredient/Step","Standard Qty","Is Process Step","SD","TF","HD","Colour","Finish","Viscosity","SG","Remarks"]];
    boms.forEach(b=>{
      const q=b.qcTests||{};
      (b.ingredients||[]).forEach((ing,i)=>{
        const qcSD=i===0?q.sd||"":"";const qcTF=i===0?q.tf||"":"";const qcHD=i===0?q.hd||"":"";
        const qcCol=i===0?q.colour||"":"";const qcFin=i===0?q.finish||"":"";
        const qcVis=i===0?q.viscosity||"":"";const qcSG=i===0?q.sg||"":"";const qcRem=i===0?q.remarks||"":"";
        rows.push([b.productName,b.category||"",b.baseBatchSize||100,b.baseUnit||"L",b.currentVersion||1,b.updatedAt?.toDate?.()?.toLocaleDateString("en-IN")||"",i+1,ing.name||"",ing.isProcess?"":ing.standardQty||"",ing.isProcess?"Yes":"No",qcSD,qcTF,qcHD,qcCol,qcFin,qcVis,qcSG,qcRem]);
      });
    });
    const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`GCC_BOMs_${today()}.csv`;a.click();
    showToast("BOMs exported ✓");
  };

  const cats=[...new Set(boms.map(b=>b.category).filter(Boolean))].sort();
  const fb=boms.filter(b=>{
    const q=normalize(search);
    const cs=filterCat==="All"||b.category===filterCat;
    return cs&&(!q||normalize(b.productName||"").includes(q));
  });

  return <div>
    <SectionHead title="📋 Bill of Materials"/>
    <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"12px"}}>
      <input placeholder="Search product…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"7px 10px",fontSize:"12.5px"}}/>
      <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={{...sl,width:"130px",padding:"7px 6px",fontSize:"12px"}}>
        <option value="All">All Categories</option>
        {cats.map(c=><option key={c}>{c}</option>)}
      </select>
      <span style={{fontSize:"11px",color:"#334155"}}>{fb.length} BOM{fb.length!==1?"s":""}</span>
      <div style={{marginLeft:"auto",display:"flex",gap:"8px"}}>
        <Btn label="📥 Export All (CSV)" onClick={exportAllBOMs} color="#64748b" small outline/>
        {canEdit&&<Btn label="+ Create BOM" onClick={()=>{setForm({...blankBOM});setShowCreate(true);setActiveBOM(null);}} color="#3b82f6"/>}
      </div>
    </div>

    {/* Create form */}
    {showCreate&&<div style={{background:"#080d18",border:"1px solid #3b82f630",borderRadius:"12px",padding:"18px",marginBottom:"16px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"14px"}}>📋 New Bill of Materials</div>
      <BOMForm form={form} setForm={setForm} saving={saving} isEdit={false} onCancel={()=>{setShowCreate(false);setForm({...blankBOM});}} onSave={()=>saveBOM(false)} sysProducts={sysProducts} sysQcParams={sysQcParams}/>
    </div>}

    {loading&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading…</div>}
    {!loading&&fb.length===0&&!showCreate&&<div style={{textAlign:"center",padding:"50px 0"}}>
      <div style={{fontSize:"36px"}}>📋</div>
      <div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>{canEdit?"No BOMs yet. Create your first BOM to print production sheets.":"No BOMs found."}</div>
    </div>}

    {/* BOM cards */}
    {fb.map(b=>{
      const isOpen=activeBOM?.bom?.id===b.id;
      const mode=activeBOM?.mode;
      const bVersions=versions.filter(v=>v.productId===b.id).sort((a,z)=>z.currentVersion-a.currentVersion);
      const totalIngr=(b.ingredients||[]).filter(i=>!i.isProcess).length;
      const totalStd=(b.ingredients||[]).filter(i=>!i.isProcess).reduce((s,i)=>s+(parseFloat(i.standardQty)||0),0);

      return <div key={b.id} style={{background:"#0f172a",border:"1px solid #1e293b",borderLeft:"3px solid #3b82f6",borderRadius:"12px",marginBottom:"10px",overflow:"hidden"}}>
        {/* Card header */}
        <div style={{padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}>
          <div style={{flex:1,cursor:"pointer"}} onClick={()=>setActiveBOM(isOpen&&mode==="view"?null:{bom:b,mode:"view"})}>
            <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9"}}>{b.productName}</div>
            <div style={{fontSize:"11.5px",color:"#475569",marginTop:"2px"}}>
              {b.category&&<span>{b.category} · </span>}Base: {b.baseBatchSize} {b.baseUnit} · {totalIngr} ingredients · Total: {totalStd.toFixed(2)}{b.baseUnit} · v{b.currentVersion||1}
              {bVersions.length>0&&<span style={{color:"#64748b",marginLeft:"6px"}}>· {bVersions.length} archived version{bVersions.length!==1?"s":""}</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:"6px",flexShrink:0,flexWrap:"wrap"}}>
            <Btn label="🖨 Print" onClick={()=>setActiveBOM({bom:b,mode:"print"})} color="#22c55e" small/>
            {bVersions.length>0&&<Btn label={`📚 History (${bVersions.length})`} onClick={()=>setActiveBOM(isOpen&&mode==="history"?null:{bom:b,mode:"history"})} color="#64748b" small outline/>}
            {canEdit&&<Btn label="✏️ Edit" onClick={()=>{setForm({...blankBOM,...b,ingredients:b.ingredients?.map(i=>({...i,id:i.id||newId()})),qcTests:Array.isArray(b.qcTests)?b.qcTests.map(p=>({...p,id:p.id||newId()})):defaultQCParams(b.category)});setActiveBOM({bom:b,mode:"edit"});setShowCreate(false);}} color="#f59e0b" small/>}
            {isAdmin&&<button onClick={()=>deleteBOM(b.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"14px"}}>🗑</button>}
          </div>
        </div>

        {/* Print dialog */}
        {isOpen&&mode==="print"&&<div style={{padding:"14px 16px",borderTop:"1px solid #1e293b",background:"#080d18"}}>
          <PrintDialog bom={b} packSizes={sysPackSizes} onClose={()=>setActiveBOM(null)}/>
        </div>}

        {/* Edit form */}
        {isOpen&&mode==="edit"&&<div style={{padding:"16px",borderTop:"1px solid #f59e0b30",background:"#080d18"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#f59e0b",marginBottom:"12px"}}>✏️ Editing: {b.productName} (currently v{b.currentVersion||1})</div>
          <BOMForm form={form} setForm={setForm} saving={saving} isEdit={true} onCancel={()=>{setActiveBOM(null);setForm({...blankBOM});}} onSave={()=>saveBOM(true,b.id)} sysProducts={sysProducts} sysQcParams={sysQcParams}/>
        </div>}

        {/* Version history */}
        {isOpen&&mode==="history"&&<div style={{padding:"14px 16px",borderTop:"1px solid #1e293b",background:"#080d18"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#64748b",marginBottom:"10px"}}>📚 BOM Version History — {b.productName}</div>
          <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
            {/* Current version */}
            <div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"8px",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <span style={{fontSize:"12px",fontWeight:"700",color:"#22c55e"}}>v{b.currentVersion||1} (Current)</span>
                <span style={{fontSize:"11px",color:"#64748b",marginLeft:"10px"}}>{(b.ingredients||[]).filter(i=>!i.isProcess).length} ingredients · Updated by {b.updatedBy||b.createdBy}</span>
              </div>
              <Btn label="🖨 Print" onClick={()=>setActiveBOM({bom:b,mode:"print"})} color="#22c55e" small/>
            </div>
            {/* Archived versions */}
            {bVersions.map(v=><div key={v.id} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}}>
              <div>
                <span style={{fontSize:"12px",fontWeight:"700",color:"#64748b"}}>v{v.currentVersion||"?"}</span>
                <span style={{fontSize:"11px",color:"#475569",marginLeft:"10px"}}>{(v.ingredients||[]).filter(i=>!i.isProcess).length} ingredients · Archived by {v.archivedBy||"—"}</span>
                <span style={{fontSize:"10px",color:"#334155",marginLeft:"8px"}}>{v.archivedAt?.toDate?.()?.toLocaleDateString("en-IN")||""}</span>
              </div>
              <div style={{display:"flex",gap:"6px"}}>
                <Btn label="🖨 Print this version" onClick={()=>printProductionSheet(v,v.baseBatchSize,"","","","",sysPackSizes,"")} color="#64748b" small outline/>
                {canEdit&&<Btn label="⬆ Restore as Current" onClick={async()=>{if(!confirm("Restore v"+v.currentVersion+" as current BOM? Current will be archived."))return;const curr=boms.find(x=>x.id===b.id);if(curr)await C("bom_versions").add({...curr,productId:b.id,archivedAt:ts(),archivedBy:user.email});await C("bom_products").doc(b.id).update({...v,currentVersion:(curr?.currentVersion||1)+1,updatedBy:user.email,updatedAt:ts()});await C("bom_versions").doc(v.id).delete();showToast("Version restored ✓");}} color="#f59e0b" small/>}
              </div>
            </div>)}
          </div>
        </div>}

        {/* Quick ingredient view */}
        {isOpen&&mode==="view"&&<div style={{padding:"14px 16px",borderTop:"1px solid #1e293b",background:"#080d18"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
            <div>
              <div style={{fontSize:"10px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>Ingredients / Process</div>
              <div style={{border:"1px solid #1e293b",borderRadius:"6px",overflow:"hidden"}}>
                <div style={{display:"grid",gridTemplateColumns:"20px 1fr 70px",background:"#0b1220",padding:"5px 10px",gap:"6px"}}>
                  {["#","Material","Std Qty"].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155"}}>{h}</div>)}
                </div>
                {(b.ingredients||[]).map((ing,i)=>ing.isProcess
                  ?<div key={i} style={{padding:"5px 10px",borderTop:"1px solid #1e293b",background:"#0a1520",fontSize:"11px",color:"#f59e0b",fontStyle:"italic",gridColumn:"1/-1"}}>→ {ing.name}</div>
                  :<div key={i} style={{display:"grid",gridTemplateColumns:"20px 1fr 70px",padding:"5px 10px",borderTop:"1px solid #1e293b",gap:"6px",alignItems:"center"}}>
                    <div style={{fontSize:"10px",color:"#475569"}}>{i+1}</div>
                    <div style={{fontSize:"12px",color:"#cbd5e1"}}>{ing.name}</div>
                    <div style={{fontSize:"12px",color:"#22c55e",textAlign:"right"}}>{ing.standardQty} {b.baseUnit}</div>
                  </div>
                )}
                <div style={{display:"grid",gridTemplateColumns:"20px 1fr 70px",padding:"6px 10px",borderTop:"1px solid #1e293b",background:"#0b1220",gap:"6px"}}>
                  <div/><div style={{fontSize:"11px",fontWeight:"700",color:"#94a3b8"}}>Total</div>
                  <div style={{fontSize:"12px",fontWeight:"700",color:"#22c55e",textAlign:"right"}}>{totalStd.toFixed(2)} {b.baseUnit}</div>
                </div>
              </div>
            </div>
            <div>
              <div style={{fontSize:"10px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>QC Standards</div>
              <div style={{border:"1px solid #1e293b",borderRadius:"6px",overflow:"hidden"}}>
                {((Array.isArray(b.qcTests)?b.qcTests:Object.entries(b.qcTests||{}).map(([k,v])=>({name:k,standard:v}))).filter(p=>p.standard||p.standard===0)).map((p,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr",padding:"5px 10px",borderTop:"1px solid #1e293b",gap:"6px"}}>
                  <div style={{fontSize:"11px",color:"#475569"}}>{p.name}</div>
                  <div style={{fontSize:"12px",color:"#e2e8f0"}}>{p.standard}</div>
                </div>)}
                {!(Array.isArray(b.qcTests)?b.qcTests:Object.entries(b.qcTests||{})).filter(p=>p.standard||p[1]).length&&<div style={{padding:"8px 10px",fontSize:"11px",color:"#334155",fontStyle:"italic"}}>No test parameters defined</div>}
              </div>
            </div>
          </div>
        </div>}
      </div>;
    })}
  </div>;
}

function MainApp({user,role,roles=[]}){
  const isAdmin=roles.includes("admin");
  // Helper: does user have ANY of the given roles?
  const hasRole=(...rs)=>rs.some(r=>roles.includes(r));
  const canQC=hasRole("admin","qc");
  const canIssuer=hasRole("admin","issuer");
  const [tab,setTab]=useState(CAN_SEE.dashboard.some(r=>(roles.length?roles:[role]).includes(r))?"dashboard":"complaints");
  const [settingsDirty,setSettingsDirty]=useState(false);
  const [pendingMainTab,setPendingMainTab]=useState(null);

  const trySetTab=(key)=>{
    if(tab==="settings"&&settingsDirty){setPendingMainTab(key);}
    else{setTab(key);}
  };
  const [rdSubTab,setRdSubTab]=useState("projects");
  const [batchSubTab,setBatchSubTab]=useState("batches"); // "batches" | "oldstock"

  // Products & QC params loaded from Firestore settings
  const [sysProducts,setSysProducts]=useState(null); // null = not yet loaded
  const [sysQcParams,setSysQcParams]=useState(DEFAULT_QC_PARAMS);
  const [sysPackSizes,setSysPackSizes]=useState(DEFAULT_PACK_SIZES_BY_CAT);
  const [sysCatUnits,setSysCatUnits]=useState({});
  const [sysUnits,setSysUnits]=useState([...BATCH_UNITS]);
  const [sysPaintTypes,setSysPaintTypes]=useState([...PAINT_TYPES]);
  const [sysRmCats,setSysRmCats]=useState([...RM_CATEGORIES]);

  // Add a new RM category or unit globally (from any screen) — saves to Firestore immediately
  const addGlobalRmCat=async(cat)=>{
    if(!cat.trim()||sysRmCats.includes(cat.trim()))return;
    const updated=[...sysRmCats,cat.trim()].sort((a,b)=>a.localeCompare(b));
    setSysRmCats(updated);
    try{await C("settings").doc("products").set({rmCategories:updated},{merge:true});}catch(e){}
  };
  const addGlobalUnit=async(unit)=>{
    if(!unit.trim()||sysUnits.includes(unit.trim()))return;
    const updated=[...sysUnits,unit.trim()].sort((a,b)=>a.localeCompare(b));
    setSysUnits(updated);
    try{await C("settings").doc("products").set({units:updated},{merge:true});}catch(e){}
  };
  const [oldStocks,setOldStocks]=useState([]);

  // Data
  const [batches,setBatches]=useState([]);
  const [complaints,setComplaints]=useState([]);
  const [projects,setProjects]=useState([]);
  const [rmTests,setRmTests]=useState([]);

  // Modals/views
  const [activeBatch,setActiveBatch]=useState(null);
  const [activeComplaint,setActiveComplaint]=useState(null);
  const [activeProject,setActiveProject]=useState(null);
  const [viewRM,setViewRM]=useState(null);
  const [showIssueBatch,setShowIssueBatch]=useState(false);
  const [showChangePw,setShowChangePw]=useState(false);
  const [cpForm,setCpForm]=useState({cur:"",nw:"",nw2:""});
  const [cpError,setCpError]=useState("");
  const [cpSaving,setCpSaving]=useState(false);

  const doChangePw=async()=>{
    if(cpForm.nw.length<6)return setCpError("New password must be at least 6 characters.");
    if(cpForm.nw!==cpForm.nw2)return setCpError("Passwords do not match.");
    setCpSaving(true);setCpError("");
    try{
      const u=auth.currentUser;
      // Re-authenticate first
      const cred=firebase.auth.EmailAuthProvider.credential(u.email,cpForm.cur);
      await u.reauthenticateWithCredential(cred);
      await u.updatePassword(cpForm.nw);
      setShowChangePw(false);setCpForm({cur:"",nw:"",nw2:""});showToast("Password changed ✓");
    }catch(e){
      if(e.code==="auth/wrong-password")setCpError("Current password is incorrect.");
      else if(e.code==="auth/too-many-requests")setCpError("Too many attempts. Try again later.");
      else setCpError(e.message||"Error changing password.");
    }
    setCpSaving(false);
  };
  const [showAddComplaint,setShowAddComplaint]=useState(false);
  const [showAddProject,setShowAddProject]=useState(false);
  const [showAddRM,setShowAddRM]=useState(false);
  const [editProject,setEditProject]=useState(null);
  const [editRM,setEditRM]=useState(null);

  // Forms
  const [batchForm,setBatchForm]=useState(EB);
  const [complaintForm,setComplaintForm]=useState(EC);
  const [projForm,setProjForm]=useState(EP);
  const [rmForm,setRmForm]=useState(ER);
  const [saving,setSaving]=useState(false);

  // Filters
  const [batchFilter,setBatchFilter]=useState("All");
  const [batchSearch,setBatchSearch]=useState("");
  const [batchMonthFilter,setBatchMonthFilter]=useState("All");
  const [batchCatFilter,setBatchCatFilter]=useState("All");
  const [batchFYFilter,setBatchFYFilter]=useState("All"); // Default All so existing batches show
  const [complaintFilter,setComplaintFilter]=useState("All");
  const [complaintSearch,setComplaintSearch]=useState("");
  const [projSearch,setProjSearch]=useState("");
  const [projFilter,setProjFilter]=useState("All");
  const [rmSearch,setRmSearch]=useState("");
  const [rmFilter,setRmFilter]=useState("All");

  const [toast,setToast]=useState(null);
  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),2800);};

  useEffect(()=>{
    const subs=[];
    // Load product/QC settings for all roles
    C("settings").doc("products").get().then(snap=>{
      if(snap.exists){const d=snap.data();
        setSysProducts(d.products||DEFAULT_PRODUCTS);
        if(d.qcParams)setSysQcParams(d.qcParams);
        if(d.catUnits)setSysCatUnits(u=>({...u,...d.catUnits}));
        if(d.units&&d.units.length)setSysUnits(d.units);
        if(d.paintTypes&&d.paintTypes.length)setSysPaintTypes(d.paintTypes);
        if(d.rmCategories&&d.rmCategories.length)setSysRmCats(d.rmCategories);
        if(d.packSizes){
          const ps=d.packSizes;
          const normalize=(arr)=>(arr||[]).map(p=>typeof p==="string"?{size:p,qty:""}:p);
          if(Array.isArray(ps))setSysPackSizes({...DEFAULT_PACK_SIZES_BY_CAT,_default:normalize(ps)});
          else{const norm={};Object.keys(ps).forEach(k=>norm[k]=normalize(ps[k]));setSysPackSizes(norm);}
        }
      }else{
        // No settings saved yet — use defaults
        setSysProducts(DEFAULT_PRODUCTS);
      }
    }).catch(()=>{
      // Firestore error — fall back to defaults so app doesn't hang
      setSysProducts(DEFAULT_PRODUCTS);
    });
    // Old stock for batch-capable roles
    if(CAN_SEE.batches.some(r=>roles.includes(r))){
      subs.push(C("old_stock").orderBy("_createdAt","desc").onSnapshot(s=>setOldStocks(s.docs.map(d=>({id:d.id,...d.data()}))),
        ()=>C("old_stock").onSnapshot(s=>setOldStocks(s.docs.map(d=>({id:d.id,...d.data()}))))));
    }
    if(CAN_SEE.batches.some(r=>roles.includes(r))){
      subs.push(C("batches").orderBy("_createdAt","desc").onSnapshot(s=>setBatches(s.docs.map(d=>({id:d.id,...d.data()}))),()=>C("batches").onSnapshot(s=>setBatches(s.docs.map(d=>({id:d.id,...d.data()}))))));
    }
    if(CAN_SEE.complaints.some(r=>roles.includes(r))){
      const cQuery=roles.includes("sales")&&!roles.includes("admin")&&!roles.includes("qc")&&!roles.includes("issuer")
        ?C("complaints").where("addedBy","==",user.email).orderBy("_createdAt","desc")
        :C("complaints").orderBy("_createdAt","desc");
      subs.push(cQuery.onSnapshot(s=>setComplaints(s.docs.map(d=>({id:d.id,...d.data()}))),
        ()=>C("complaints").onSnapshot(s=>setComplaints(s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>!roles.includes("sales")||roles.includes("admin")||c.addedBy===user.email)))));
    }
    if(CAN_SEE.rd.some(r=>roles.includes(r))){
      subs.push(C("rd_projects").orderBy("_createdAt","desc").onSnapshot(s=>setProjects(s.docs.map(d=>({id:d.id,...d.data()}))),()=>C("rd_projects").onSnapshot(s=>setProjects(s.docs.map(d=>({id:d.id,...d.data()}))))));
      subs.push(C("rm_tests").orderBy("_createdAt","desc").onSnapshot(s=>setRmTests(s.docs.map(d=>({id:d.id,...d.data()}))),()=>C("rm_tests").onSnapshot(s=>setRmTests(s.docs.map(d=>({id:d.id,...d.data()}))))));
    }
    return()=>subs.forEach(u=>u());
  },[role]);

  // Sync active items
  useEffect(()=>{if(activeBatch){const u=batches.find(b=>b.id===activeBatch.id);if(u)setActiveBatch(u);}},[batches]);
  useEffect(()=>{if(activeComplaint){const u=complaints.find(c=>c.id===activeComplaint.id);if(u)setActiveComplaint(u);}},[complaints]);
  useEffect(()=>{if(activeProject){const u=projects.find(p=>p.id===activeProject.id);if(u)setActiveProject(u);}},[projects]);
  useEffect(()=>{if(viewRM){const u=rmTests.find(r=>r.id===viewRM.id);if(u)setViewRM(u);}},[rmTests]);

  // Save functions
  const saveBatch=async()=>{
    if(!batchForm.productName.trim()||!batchForm.category)return showToast("Category and product required","error");
    if(saving)return;setSaving(true);
    try{
      const fy=getFY();
      const snap=await C("batches").where("fyYear","==",fy).get();
      const maxSeq=snap.docs.reduce((m,d)=>{const n=parseInt(d.data().batchSeq||0);return Math.max(m,n);},0);
      const seq=maxSeq+1;
      const bNo=String(seq).padStart(4,"0");
      await C("batches").add({...batchForm,batchNo:bNo,batchSeq:seq,fyYear:fy,status:"Issued",issuedBy:batchForm.issuedBy||user.email,_createdAt:ts()});
      // Look up BOM for this product and auto-print
      try{
        const bomSnap=await C("bom_products").where("productName","==",batchForm.productName).limit(1).get();
        if(!bomSnap.empty){
          const bom=bomSnap.docs[0].data();
          if(window.confirm(`Batch ${bNo} issued ✓\n\nPrint production sheet for ${batchForm.productName} (${batchForm.batchSize} ${batchForm.unit})?`)){
            printProductionSheet(bom,batchForm.batchSize,bNo,"","","",sysPackSizes,batchForm.dateIssued);
          }
        }else{
          showToast(`Batch ${bNo} issued ✓ (No BOM found for this product)`);
        }
      }catch(e){showToast(`Batch ${bNo} issued ✓`);}
      setBatchForm(EB);setShowIssueBatch(false);
    }catch(e){showToast("Error issuing batch","error");}
    setSaving(false);
  };

  const [complaintFiles,setComplaintFiles]=useState([]);
  const saveComplaint=async()=>{
    if(!complaintForm.customerName.trim()||!complaintForm.complaint.trim())return showToast("Customer name and complaint required","error");
    if(saving)return;setSaving(true);
    try{
      await C("complaints").add({...complaintForm,attachments:complaintFiles,status:"Open",addedBy:user.email,dateCreated:today(),currentRound:1,_createdAt:ts()});
      setComplaintFiles([]);
      setComplaintForm(EC);setShowAddComplaint(false);showToast("Complaint added ✓");
    }catch(e){showToast("Error saving","error");}
    setSaving(false);
  };

  const saveProject=async()=>{
    if(!projForm.projectName.trim())return showToast("Project name required","error");
    if(saving)return;setSaving(true);
    try{
      const cnt=(await C("rd_projects").get()).size;
      const code=projForm.projectCode.trim()||`GCC-RD-${String(cnt+1).padStart(3,"0")}`;
      await C("rd_projects").add({...projForm,projectCode:code,dateCreated:today(),trials:[],_createdAt:ts()});
      setProjForm(EP);setShowAddProject(false);showToast("Project created ✓");
    }catch(e){showToast("Error saving","error");}
    setSaving(false);
  };

  const saveRM=async()=>{
    if(!rmForm.materialName.trim()||!rmForm.vendorName.trim())return showToast("Material and vendor required","error");
    if(saving)return;setSaving(true);
    try{await C("rm_tests").add({...rmForm,_createdAt:ts()});setRmForm(ER);setShowAddRM(false);showToast("Entry saved ✓");}
    catch(e){showToast("Error saving","error");}
    setSaving(false);
  };

  const updateProject=async(data)=>{
    if(!data.projectName.trim())return showToast("Name required","error");
    setSaving(true);
    try{const{id,_createdAt,trials,...fields}=data;await C("rd_projects").doc(id).update(fields);setEditProject(null);showToast("Updated ✓");}
    catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const updateRM=async(data)=>{
    if(!data.materialName.trim())return showToast("Name required","error");
    setSaving(true);
    try{const{id,_createdAt,...fields}=data;await C("rm_tests").doc(id).update(fields);setEditRM(null);showToast("Updated ✓");}
    catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const totalTrials=projects.reduce((s,p)=>s+(p.trials||[]).length,0);

  // Wait for settings to load from Firestore before rendering
  // This prevents the product list from briefly showing defaults then resetting
  if(sysProducts===null){
    return <div style={{minHeight:"100vh",background:"#060b16",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:"12px"}}>
      <div style={{width:"36px",height:"36px",border:"3px solid #1e293b",borderTop:"3px solid #3b82f6",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
      <div style={{fontSize:"13px",color:"#475569"}}>Loading settings…</div>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>;
  }

  // Infer FY from batch — uses stored fyYear if available, else derives from dateIssued
  const getBatchFY=(b)=>{
    if(b.fyYear)return b.fyYear;
    if(b.dateIssued){const d=new Date(b.dateIssued);const y=d.getFullYear()%100;return d.getMonth()>=3?y+1:y;}
    return getFY();
  };

  // Filtered data
  const fb=batches.filter(b=>{
    const ms=batchFilter==="All"||b.status===batchFilter;
    const cs=batchCatFilter==="All"||b.category===batchCatFilter;
    const fys=batchFYFilter==="All"||getBatchFY(b)===parseInt(batchFYFilter);
    // Month filter: compare just MM part of dateIssued (e.g. "05" for May)
    const mths=batchMonthFilter==="All"||(b.dateIssued||"").slice(5,7)===batchMonthFilter;
    const q=normalize(batchSearch);
    const match=!q||normalize(b.batchNo||"").includes(q)||normalize(b.productName||"").includes(q)||normalize(b.shade||"").includes(q);
    return ms&&cs&&fys&&mths&&match;
  });
  const isSalesOnly=roles.includes("sales")&&!roles.some(r=>["admin","qc","issuer"].includes(r));
  const fc=complaints.filter(c=>{
    if(isSalesOnly&&c.addedBy!==user.email)return false;
    const ms=complaintFilter==="All"||c.status===complaintFilter;
    const q=complaintSearch.toLowerCase();
    return ms&&(!q||c.customerName?.toLowerCase().includes(q)||c.productName?.toLowerCase().includes(q)||c.batchNo?.toLowerCase().includes(q));
  });
  const fp=projects.filter(p=>{
    const ms=projFilter==="All"||p.status===projFilter;
    const q=projSearch.toLowerCase();
    return ms&&(!q||p.projectName?.toLowerCase().includes(q)||p.projectCode?.toLowerCase().includes(q));
  });
  const frm=rmTests.filter(r=>{
    const ms=rmFilter==="All"||r.testResult===rmFilter;
    const q=rmSearch.toLowerCase();
    return ms&&(!q||r.materialName?.toLowerCase().includes(q)||r.vendorName?.toLowerCase().includes(q));
  });

  const tabs=[
    {key:"dashboard",label:"📊 Dashboard"},
    {key:"batches",label:"📦 Batches"},
    {key:"complaints",label:"⚠️ Complaints"},
    {key:"rd",label:"🧪 R&D & QC"},
    {key:"bom",label:"📋 BOM"},
    {key:"stock",label:"🏪 RM Stock"},
    {key:"testimonials",label:"⭐ Testimonials"},
    {key:"users",label:"👥 Users"},
    {key:"settings",label:"⚙️ Settings"},
  ].filter(t=>CAN_SEE[t.key]?.some(r=>roles.includes(r)));

  return <div style={{minHeight:"100vh",background:"#060b16",fontFamily:"'DM Sans',sans-serif",color:"#e2e8f0",paddingBottom:"48px"}}>
    <style>{`@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}`}</style>

    {/* Header */}
    <div style={{background:"linear-gradient(135deg,#0b1220,#0d1526)",borderBottom:"1px solid #1e293b",padding:"20px 28px 0"}}>
      <div style={{maxWidth:"1000px",margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:"18px",flexWrap:"wrap",gap:"10px"}}>
          <div>
            <div style={{fontSize:"11px",fontWeight:"700",color:"#3b82f6",letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:"3px"}}>Gujarat Colours & Coatings Pvt Ltd</div>
            <h1 style={{fontSize:"24px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9",margin:0}}>GCC <span style={{fontStyle:"italic",color:"#3b82f6"}}>Operations Hub</span></h1>
          </div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
            {CAN_SEE.batches.some(r=>roles.includes(r))&&[["📦",batches.filter(b=>["Issued","In Production","QC Pending","QC Pass","Packed"].includes(b.status)).length,"#3b82f6","Active"],["🔬",batches.filter(b=>b.status==="QC Pending").length,"#a855f7","QC Pending"]].map(([icon,count,color,label])=><div key={label} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"10px",padding:"8px 12px",textAlign:"center"}}>
              <div style={{fontWeight:"700",fontSize:"17px",color}}>{icon} {count}</div>
              <div style={{color:"#475569",fontSize:"10px",fontWeight:"600"}}>{label}</div>
            </div>)}
            {CAN_SEE.complaints.some(r=>roles.includes(r))&&<div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"10px",padding:"8px 12px",textAlign:"center"}}>
              <div style={{fontWeight:"700",fontSize:"17px",color:"#ef4444"}}>⚠️ {complaints.filter(c=>["Open","Under Review"].includes(c.status)&&(role!=="sales"||c.addedBy===user.email)).length}</div>
              <div style={{color:"#475569",fontSize:"10px",fontWeight:"600"}}>{role==="sales"?"My Open":"Open"}</div>
            </div>}
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"4px"}}>
              <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                <span style={{fontSize:"11px",color:"#334155"}}>{user.email}</span>
                <span style={{fontSize:"10px",fontWeight:"700",padding:"2px 8px",borderRadius:"99px",background:`${ROLE_COLORS[role]}18`,color:ROLE_COLORS[role],border:`1px solid ${ROLE_COLORS[role]}30`}}>{ROLE_LABELS[role]}</span>
              </div>
              <div style={{display:"flex",gap:"4px"}}>
                <button onClick={()=>setShowChangePw(true)} style={{background:"none",border:"1px solid #1e3a5f",borderRadius:"7px",padding:"4px 10px",color:"#93c5fd",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>🔑 Change PW</button>
                <button onClick={()=>auth.signOut()} style={{background:"none",border:"1px solid #1e293b",borderRadius:"7px",padding:"4px 12px",color:"#475569",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>Sign Out</button>
              </div>
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:"4px",overflowX:"auto"}}>
          {tabs.map(t=><button key={t.key} onClick={()=>trySetTab(t.key)} style={{background:tab===t.key?"#1e293b":"transparent",border:"none",borderBottom:tab===t.key?"2px solid #3b82f6":"2px solid transparent",color:tab===t.key?"#f1f5f9":"#64748b",padding:"9px 18px",cursor:"pointer",fontSize:"13px",fontWeight:"600",borderRadius:"8px 8px 0 0",transition:"all 0.15s",whiteSpace:"nowrap"}}>{t.label}</button>)}
        </div>
      </div>
    </div>

    {/* Content */}
    <div style={{maxWidth:"1000px",margin:"0 auto",padding:"24px 28px 0"}}>

      {/* DASHBOARD */}
      {tab==="dashboard"&&<DashboardTab role={role} user={user}/>}

      {/* BATCHES */}
      {tab==="batches"&&<>
        {/* Sub-tabs */}
        <div style={{display:"flex",gap:"4px",marginBottom:"18px",borderBottom:"1px solid #1e293b"}}>
          {[["batches","📦 Batch List"],["oldstock","🗃 Old/Rejected Material"]].map(([key,label])=>(
            <button key={key} onClick={()=>setBatchSubTab(key)} style={{background:batchSubTab===key?"#1e293b":"transparent",border:"none",borderBottom:batchSubTab===key?"2px solid #3b82f6":"2px solid transparent",color:batchSubTab===key?"#f1f5f9":"#64748b",padding:"8px 16px",cursor:"pointer",fontSize:"13px",fontWeight:"600",borderRadius:"8px 8px 0 0",transition:"all 0.15s"}}>{label}</button>
          ))}
        </div>

        {batchSubTab==="batches"&&<>
          {/* Filter row */}
          <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center",marginBottom:"8px"}}>
            <input placeholder="Search batch, product…" value={batchSearch} onChange={e=>setBatchSearch(e.target.value)} style={{...inp,maxWidth:"170px",padding:"7px 10px",fontSize:"12.5px"}}/>
            {/* FY selector */}
            <select value={batchFYFilter} onChange={e=>setBatchFYFilter(e.target.value)} style={{...sl,width:"90px",padding:"7px 6px",fontSize:"12px"}}>
              {[["All","All FY"],...Array.from({length:4},(_,k)=>{const fy=getFY()-k;return[String(fy),"FY "+getFYLabel(fy)+" "+(fy<getFY()?"(Completed)":"(Current)")];})].map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
            {/* Month selector — just month names, no year */}
            <select value={batchMonthFilter} onChange={e=>setBatchMonthFilter(e.target.value)} style={{...sl,width:"110px",padding:"7px 6px",fontSize:"12px"}}>
              <option value="All">All Months</option>
              {[["04","April"],["05","May"],["06","June"],["07","July"],["08","August"],["09","September"],["10","October"],["11","November"],["12","December"],["01","January"],["02","February"],["03","March"]].map(([v,n])=><option key={v} value={v}>{n}</option>)}
            </select>
            {/* Category selector */}
            <select value={batchCatFilter} onChange={e=>setBatchCatFilter(e.target.value)} style={{...sl,width:"120px",padding:"7px 6px",fontSize:"12px"}}>
              <option value="All">All Categories</option>
              {[...new Set(batches.map(b=>b.category).filter(Boolean))].sort().map(c=><option key={c}>{c}</option>)}
            </select>
            {canIssuer&&<Btn label="+ Issue New Batch" onClick={()=>setShowIssueBatch(true)} color="#3b82f6" small/>}
          </div>
          {/* Status chips */}
          <div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"10px",alignItems:"center"}}>
            {["All",...BATCH_STATUS].map(s=><button key={s} onClick={()=>setBatchFilter(s)} style={{background:batchFilter===s?"#1e3a5f":"transparent",border:`1px solid ${batchFilter===s?"#3b82f6":"#1e293b"}`,color:batchFilter===s?"#93c5fd":"#475569",borderRadius:"99px",padding:"4px 10px",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>{s}</button>)}
            <span style={{marginLeft:"auto",fontSize:"11px",color:"#334155"}}>{fb.length} batch{fb.length!==1?"es":""}</span>
          </div>
          {/* Compact table header */}
          {fb.length>0&&<div style={{display:"grid",gridTemplateColumns:"100px 1fr 1fr auto 24px",gap:"8px",padding:"4px 14px",marginBottom:"2px"}}>
            {["Batch #","Product","Size · Date","Status",""].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
          </div>}
          {fb.length===0?<div style={{textAlign:"center",padding:"40px 0"}}><div style={{fontSize:"30px",marginBottom:"8px"}}>📦</div><div style={{fontSize:"13px",color:"#475569"}}>No batches match filters.{canIssuer?" Click + Issue New Batch.":""}</div></div>
            :fb.map(b=><BatchCard key={b.id} b={b} onClick={()=>setActiveBatch(b)}
              onReprint={async(batch)=>{
                try{
                  const bomSnap=await C("bom_products").where("productName","==",batch.productName).limit(1).get();
                  if(!bomSnap.empty){
                    printProductionSheet(bomSnap.docs[0].data(),batch.batchSize,batch.batchNo,"","","",sysPackSizes,batch.dateIssued);
                  }else{
                    showToast("No BOM found for "+batch.productName+". Create a BOM in the 📋 BOM tab first.","error");
                  }
                }catch(e){showToast("Error: "+e.message,"error");}
              }}
              onDelete={async(id)=>{if(!confirm("Delete batch?"))return;await C("batches").doc(id).delete();showToast("Deleted","error");}} role={role}/>)}
        </>}

        {batchSubTab==="oldstock"&&<OldStockSection role={role} user={user} showToast={showToast} products={sysProducts} catUnits={sysCatUnits}/>}
      </>}

      {/* COMPLAINTS */}
      {tab==="complaints"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"10px"}}>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",flex:1}}>
            <input placeholder="Search customer, product…" value={complaintSearch} onChange={e=>setComplaintSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"8px 12px",fontSize:"13px"}}/>
            {["All",...COMPLAINT_STATUS].map(s=><button key={s} onClick={()=>setComplaintFilter(s)} style={{background:complaintFilter===s?"#1e3a5f":"transparent",border:`1px solid ${complaintFilter===s?"#3b82f6":"#1e293b"}`,color:complaintFilter===s?"#93c5fd":"#475569",borderRadius:"99px",padding:"5px 12px",fontSize:"11.5px",fontWeight:"600",transition:"all 0.15s",cursor:"pointer"}}>{s}</button>)}
          </div>
          {(role==="sales"||role==="admin")&&<Btn label="+ Add Complaint" onClick={()=>setShowAddComplaint(true)} color="#ef4444"/>}
        </div>
        {fc.length===0?<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px",marginBottom:"10px"}}>✅</div><div style={{fontSize:"13px",color:"#475569"}}>No complaints found.{role==="sales"?" Click + Add Complaint.":""}</div></div>:fc.map(c=><ComplaintCard key={c.id} c={c} onClick={()=>setActiveComplaint(c)} onDelete={async(id)=>{if(!confirm("Delete?"))return;await C("complaints").doc(id).delete();showToast("Deleted","error");}} role={role}/>)}
      </>}

      {/* R&D */}
      {tab==="rd"&&<>
        <div style={{display:"flex",gap:"4px",marginBottom:"20px",borderBottom:"1px solid #1e293b",paddingBottom:"0"}}>
          {[["projects","⚗️ R&D Projects"],["rmtests","🧫 RM Tests"],["sampletests","🔭 Sample Testing"]].map(([key,label])=><button key={key} onClick={()=>setRdSubTab(key)} style={{background:rdSubTab===key?"#1e293b":"transparent",border:"none",borderBottom:rdSubTab===key?"2px solid #22c55e":"2px solid transparent",color:rdSubTab===key?"#f1f5f9":"#64748b",padding:"8px 16px",cursor:"pointer",fontSize:"13px",fontWeight:"600",borderRadius:"8px 8px 0 0",transition:"all 0.15s"}}>{label}</button>)}
        </div>
        {rdSubTab==="projects"&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"10px"}}>
            <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",flex:1}}>
              <input placeholder="Search projects…" value={projSearch} onChange={e=>setProjSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"8px 12px",fontSize:"13px"}}/>
              {["All",...PROJECT_STATUS].map(s=><button key={s} onClick={()=>setProjFilter(s)} style={{background:projFilter===s?"#1e3a5f":"transparent",border:`1px solid ${projFilter===s?"#3b82f6":"#1e293b"}`,color:projFilter===s?"#93c5fd":"#475569",borderRadius:"99px",padding:"5px 12px",fontSize:"11.5px",fontWeight:"600",cursor:"pointer"}}>{s}</button>)}
            </div>
            {isAdmin&&<Btn label="+ New Project" onClick={()=>setShowAddProject(true)} color="#3b82f6"/>}
          </div>
          {fp.length===0?<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px",marginBottom:"10px"}}>🧪</div><div style={{fontSize:"13px",color:"#475569"}}>No projects.{isAdmin?" Click + New Project.":""}</div></div>:fp.map(p=><ProjectCard key={p.id} p={p} onClick={()=>setActiveProject(p)} onDelete={async(id)=>{if(!confirm("Delete project?"))return;await C("rd_projects").doc(id).delete();showToast("Deleted","error");}} onEdit={p=>setEditProject({...p})} isAdmin={isAdmin}/>)}
        </>}
        {rdSubTab==="rmtests"&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"10px"}}>
            <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",flex:1}}>
              <input placeholder="Search material, vendor…" value={rmSearch} onChange={e=>setRmSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"8px 12px",fontSize:"13px"}}/>
              {["All",...TEST_RESULTS].map(r=><button key={r} onClick={()=>setRmFilter(r)} style={{background:rmFilter===r?"#1e3a5f":"transparent",border:`1px solid ${rmFilter===r?"#3b82f6":"#1e293b"}`,color:rmFilter===r?"#93c5fd":"#475569",borderRadius:"99px",padding:"5px 12px",fontSize:"11.5px",fontWeight:"600",cursor:"pointer"}}>{r}</button>)}
            </div>
            <Btn label="+ Add Test Entry" onClick={()=>setShowAddRM(true)} color="#3b82f6"/>
          </div>
          {frm.length===0?<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px",marginBottom:"10px"}}>🧫</div><div style={{fontSize:"13px",color:"#475569"}}>No entries.</div></div>:frm.map(r=><RMCard key={r.id} r={r} onClick={()=>setViewRM(r)} onDelete={async(id)=>{if(!confirm("Delete?"))return;await C("rm_tests").doc(id).delete();showToast("Deleted","error");}} onEdit={r=>setEditRM({...r})} isAdmin={isAdmin}/>)}
        </>}
        {rdSubTab==="sampletests"&&<SampleTestsTab role={role} user={user} showToast={showToast} sysQcParams={sysQcParams}
          onCreateProject={(prefill)=>{setProjForm({...EP,...prefill});setShowAddProject(true);setRdSubTab("projects");}}
        />}
      </>}
      {tab==="bom"&&<BOMTab role={role} roles={roles} user={user} showToast={showToast} sysProducts={sysProducts} sysPackSizes={sysPackSizes} sysQcParams={sysQcParams}/>}
      {tab==="stock"&&<RawMaterialStockTab role={role} user={user} showToast={showToast} sysUnits={sysUnits} sysRmCats={sysRmCats} onAddRmCat={addGlobalRmCat} onAddUnit={addGlobalUnit}/>}
      {tab==="testimonials"&&<TestimonialsTab role={role} user={user} showToast={showToast}/>}
      {tab==="users"&&<UsersTab currentUser={user}/>}

      {/* SETTINGS */}
      {tab==="settings"&&<SettingsTab
        showToast={showToast}
        initialProducts={sysProducts}
        initialQcParams={sysQcParams}
        initialPackSizes={sysPackSizes}
        initialCatUnits={sysCatUnits}
        initialUnits={sysUnits}
        initialPaintTypes={sysPaintTypes}
        initialRmCats={sysRmCats}
        onDirtyChange={setSettingsDirty}
        onSaved={({products,qcParams,packSizes,catUnits,units,paintTypes,rmCategories})=>{
          setSysProducts(products);setSysQcParams(qcParams);setSysPackSizes(packSizes);
          setSysCatUnits(catUnits);if(units)setSysUnits(units);
          if(paintTypes)setSysPaintTypes(paintTypes);if(rmCategories)setSysRmCats(rmCategories);
          setSettingsDirty(false);
          if(pendingMainTab){setTab(pendingMainTab);setPendingMainTab(null);}
        }}
      />}
      {/* Main-tab switch blocked by unsaved settings */}
      {pendingMainTab&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:4000,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"#0f1729",border:"1px solid #f59e0b",borderRadius:"14px",padding:"28px 32px",maxWidth:"380px",width:"90%",boxShadow:"0 20px 60px rgba(0,0,0,0.6)"}}>
          <div style={{fontSize:"20px",marginBottom:"8px"}}>⚠️</div>
          <div style={{fontSize:"15px",fontWeight:"700",color:"#f1f5f9",marginBottom:"8px"}}>Unsaved Settings</div>
          <div style={{fontSize:"13px",color:"#94a3b8",marginBottom:"20px",lineHeight:1.5}}>
            You have unsaved changes in Settings.<br/>Save before leaving or discard changes?
          </div>
          <div style={{display:"flex",gap:"10px",flexDirection:"column"}}>
            <Btn label="Go back to Settings to Save" onClick={()=>setPendingMainTab(null)} color="#22c55e"/>
            <Btn label="Discard Changes & Leave" onClick={()=>{setSettingsDirty(false);setTab(pendingMainTab);setPendingMainTab(null);}} outline color="#ef4444"/>
            <Btn label="Cancel" onClick={()=>setPendingMainTab(null)} outline color="#475569"/>
          </div>
        </div>
      </div>}
    </div>

    {/* ══ MODALS ══ */}

    {/* Batch Workspace */}
    <Modal wide open={!!activeBatch} onClose={()=>setActiveBatch(null)} title="Batch Details">
      {activeBatch&&<BatchWorkspace batch={activeBatch} role={role} showToast={showToast} qcParams={sysQcParams} packSizes={sysPackSizes}/>}
    </Modal>

    {/* Issue Batch */}
    {/* Change Password Modal */}
    {showChangePw&&<Modal title="🔑 Change My Password" onClose={()=>{setShowChangePw(false);setCpForm({cur:"",nw:"",nw2:""});setCpError("");}}>
      <div style={{padding:"4px 0"}}>
        <InfoBox color="#3b82f6">Enter your current password to verify identity, then set a new one.</InfoBox>
        <Field label="Current Password">
          <input type="password" style={inp} value={cpForm.cur} onChange={e=>setCpForm({...cpForm,cur:e.target.value})} placeholder="Your current password" autoComplete="current-password"/>
        </Field>
        <Field label="New Password (min 6 chars)">
          <input type="password" style={inp} value={cpForm.nw} onChange={e=>{setCpForm({...cpForm,nw:e.target.value});setCpError("");}} placeholder="New password" autoComplete="new-password"/>
        </Field>
        <Field label="Confirm New Password">
          <input type="password" style={{...inp,borderColor:cpForm.nw2&&cpForm.nw2!==cpForm.nw?"#ef4444":cpForm.nw2?"#22c55e":"#1e293b"}} value={cpForm.nw2} onChange={e=>{setCpForm({...cpForm,nw2:e.target.value});setCpError("");}} placeholder="Repeat new password" autoComplete="new-password"/>
        </Field>
        {cpError&&<div style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"7px",padding:"9px 12px",color:"#fca5a5",fontSize:"12.5px",marginBottom:"10px"}}>❌ {cpError}</div>}
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
          <Btn label="Cancel" onClick={()=>{setShowChangePw(false);setCpForm({cur:"",nw:"",nw2:""});setCpError("");}} outline color="#475569"/>
          <Btn label={cpSaving?"Changing…":"Change Password"} onClick={doChangePw} disabled={cpSaving||!cpForm.cur||!cpForm.nw||!cpForm.nw2} color="#3b82f6"/>
        </div>
      </div>
    </Modal>}

    <Modal open={showIssueBatch} onClose={()=>setShowIssueBatch(false)} title="Issue New Batch">
      {(()=>{
        const availOldStock=oldStocks.filter(s=>(s.status==="Available")&&s.productName===batchForm.productName);
        return <>
          <CategoryProductSelect
            category={batchForm.category||""} setCategory={cat=>setBatchForm({...batchForm,category:cat,productName:""})}
            productName={batchForm.productName} setProductName={pn=>setBatchForm({...batchForm,productName:pn})}
            products={sysProducts}
            catUnits={sysCatUnits}
            onUnitChange={unit=>setBatchForm(f=>({...f,unit}))}/>
          {availOldStock.length>0&&<div style={{background:"#422006",border:"1px solid #f59e0b",borderRadius:"8px",padding:"10px 14px",marginBottom:"14px",display:"flex",alignItems:"center",gap:"8px"}}>
            <span style={{fontSize:"16px"}}>⚠️</span>
            <div>
              <div style={{fontSize:"12px",fontWeight:"700",color:"#f59e0b"}}>Old/Rejected Material Available for this Product!</div>
              <div style={{fontSize:"12px",color:"#d97706"}}>{availOldStock.map(s=>`${s.qty} ${s.unit} (Ref: ${s.batchRef||"—"})`).join(" · ")} — consider using this before new production.</div>
            </div>
          </div>}
          <Grid2>
            <Field label="Shade / Colour"><input style={inp} value={batchForm.shade} onChange={e=>setBatchForm({...batchForm,shade:e.target.value})} placeholder="e.g. Off White, Base"/></Field>
            <Field label={isAdmin?"Date Issued (Admin — editable)":"🔒 Date Issued (auto-set, admin only)"}>{isAdmin
              ?<input type="date" style={inp} value={batchForm.dateIssued} onChange={e=>setBatchForm({...batchForm,dateIssued:e.target.value})}/>
              :<div style={{...inp,color:"#22c55e",fontWeight:"600",cursor:"default",display:"flex",alignItems:"center",gap:"6px"}}><span>📅</span>{batchForm.dateIssued}<span style={{fontSize:"10px",color:"#334155",marginLeft:"auto"}}>🔒 locked</span></div>
            }</Field>
          </Grid2>
          <Grid2>
            <Field label="Batch Size *"><input style={inp} value={batchForm.batchSize} onChange={e=>setBatchForm({...batchForm,batchSize:e.target.value})} placeholder="1000"/></Field>
            <Field label="Unit">
              <div style={{...inp,background:"#060b16",cursor:"default",display:"flex",alignItems:"center",gap:"8px",color:batchForm.unit?"#22c55e":"#475569",fontWeight:"600"}}>
                {batchForm.unit||"— select category first —"}
                {batchForm.unit&&<span style={{fontSize:"10px",color:"#475569",fontWeight:"400"}}>(auto from category)</span>}
              </div>
            </Field>
          </Grid2>
          <Field label="Issued By"><input style={inp} value={batchForm.issuedBy} onChange={e=>setBatchForm({...batchForm,issuedBy:e.target.value})} placeholder={user.email}/></Field>
          <Field label="Old/Rejected Material Used (if any)"><input style={inp} value={batchForm.oldStockUsed} onChange={e=>setBatchForm({...batchForm,oldStockUsed:e.target.value})} placeholder="e.g. 200kg from GCC-2501-005"/></Field>
          <Field label="Issue Notes"><textarea style={{...ta,minHeight:"56px"}} value={batchForm.issueNotes} onChange={e=>setBatchForm({...batchForm,issueNotes:e.target.value})}/></Field>
          <InfoBox color="#3b82f6">Batch number is a 4-digit sequential number (e.g. 0001, 0002…) — resets to 0001 each April 1st (new financial year). FY {getFYLabel(getFY())} current.</InfoBox>
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
            <Btn label="Cancel" onClick={()=>setShowIssueBatch(false)} outline color="#475569"/>
            <Btn label={saving?"Issuing…":"Issue Batch"} onClick={saveBatch} disabled={saving} color="#3b82f6"/>
          </div>
        </>;
      })()}
    </Modal>

    {/* Add Complaint */}
    <Modal open={showAddComplaint} onClose={()=>setShowAddComplaint(false)} title="Add New Complaint">
      <Grid2>
        <Field label="Customer Name *"><input style={inp} value={complaintForm.customerName} onChange={e=>setComplaintForm({...complaintForm,customerName:e.target.value})} placeholder="Customer / party name"/></Field>
        <Field label="Product *"><input style={inp} value={complaintForm.productName} onChange={e=>setComplaintForm({...complaintForm,productName:e.target.value})} placeholder="Product name"/></Field>
      </Grid2>
      <Grid3>
        <Field label="Batch No"><input style={inp} value={complaintForm.batchNo} onChange={e=>setComplaintForm({...complaintForm,batchNo:e.target.value})} placeholder="e.g. GCC-2501-001"/></Field>
        <Field label="Month / Year"><input style={inp} value={complaintForm.monthYear} onChange={e=>setComplaintForm({...complaintForm,monthYear:e.target.value})} placeholder="e.g. Jan 2025"/></Field>
        <Field label="Invoice No"><input style={inp} value={complaintForm.invoiceNo} onChange={e=>setComplaintForm({...complaintForm,invoiceNo:e.target.value})} placeholder="Invoice number"/></Field>
      </Grid3>
      <Field label="Material Available with Customer"><input style={inp} value={complaintForm.materialAvailable} onChange={e=>setComplaintForm({...complaintForm,materialAvailable:e.target.value})} placeholder="e.g. 15 L, 2 tins, approx half drum"/></Field>
      <Field label="Complaint Description *"><textarea style={{...ta,minHeight:"100px"}} value={complaintForm.complaint} onChange={e=>setComplaintForm({...complaintForm,complaint:e.target.value})} placeholder="Describe the complaint in detail — what is the issue, when was it noticed, what conditions..."/></Field>
      <div style={{marginBottom:"14px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>📎 Attach Photos / Videos (optional)</div>
        <FileAttachment folder={`complaints/${user?.email?.split("@")[0]||"user"}`} existingFiles={complaintFiles} onFilesChange={setComplaintFiles} maxFiles={5}/>
        <div style={{fontSize:"10.5px",color:"#334155",marginTop:"4px"}}>Attach photos or short videos showing the issue (max 5 files)</div>
      </div>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowAddComplaint(false)} outline color="#475569"/>
        <Btn label={saving?"Saving…":"Submit Complaint"} onClick={saveComplaint} disabled={saving} color="#ef4444"/>
      </div>
    </Modal>

    {/* Complaint Workspace */}
    <Modal wide open={!!activeComplaint} onClose={()=>setActiveComplaint(null)} title="Complaint Details">
      {activeComplaint&&<ComplaintWorkspace complaint={activeComplaint} role={role} showToast={showToast}/>}
    </Modal>

    {/* Project Workspace */}
    <Modal wide open={!!activeProject} onClose={()=>setActiveProject(null)} title="Project Workspace">
      {activeProject&&<ProjectWorkspace key={activeProject.id} project={activeProject} isAdmin={isAdmin} showToast={showToast} sysUnits={sysUnits} sysRmCats={sysRmCats} onAddRmCat={addGlobalRmCat} onAddUnit={addGlobalUnit}/>}
    </Modal>

    {/* Add Project */}
    <Modal open={showAddProject} onClose={()=>setShowAddProject(false)} title="New R&D Project">
      <Field label="Project Name *"><input style={inp} value={projForm.projectName} onChange={e=>setProjForm({...projForm,projectName:e.target.value})} placeholder="e.g. Water-based Exterior Emulsion v3"/></Field>
      <Grid2>
        <Field label="Project Code"><input style={inp} value={projForm.projectCode} onChange={e=>setProjForm({...projForm,projectCode:e.target.value})} placeholder="Auto-generated if blank"/></Field>
        <Field label="Paint Type"><select style={sl} value={projForm.paintType} onChange={e=>setProjForm({...projForm,paintType:e.target.value})}>{(sysPaintTypes||PAINT_TYPES).map(t=><option key={t}>{t}</option>)}</select></Field>
      </Grid2>
      <Field label="Target Application"><input style={inp} value={projForm.application} onChange={e=>setProjForm({...projForm,application:e.target.value})} placeholder="e.g. Interior walls, Metal surfaces"/></Field>
      <Grid2>
        <Field label="Status"><select style={sl} value={projForm.status} onChange={e=>setProjForm({...projForm,status:e.target.value})}>{PROJECT_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
        <Field label="Target Date"><input type="date" style={inp} value={projForm.targetDate} onChange={e=>setProjForm({...projForm,targetDate:e.target.value})}/></Field>
      </Grid2>
      <Field label="Assigned To"><input style={inp} value={projForm.assignedTo} onChange={e=>setProjForm({...projForm,assignedTo:e.target.value})} placeholder="Chemist / Team member"/></Field>
      <Field label="Objective"><textarea style={ta} value={projForm.objective} onChange={e=>setProjForm({...projForm,objective:e.target.value})} placeholder="What is this project trying to achieve?"/></Field>
      <Field label="Formulation Base"><textarea style={ta} value={projForm.formulationBase} onChange={e=>setProjForm({...projForm,formulationBase:e.target.value})} placeholder="Base resin, key pigments, binders..."/></Field>
      <Field label="Notes"><textarea style={{...ta,minHeight:"56px"}} value={projForm.notes} onChange={e=>setProjForm({...projForm,notes:e.target.value})}/></Field>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowAddProject(false)} outline color="#475569"/>
        <Btn label={saving?"Creating…":"Create Project"} onClick={saveProject} disabled={saving} color="#3b82f6"/>
      </div>
    </Modal>

    {/* Edit Project */}
    <Modal open={!!editProject} onClose={()=>setEditProject(null)} title="Edit Project">
      {editProject&&<>
        <Field label="Project Name *"><input style={inp} value={editProject.projectName} onChange={e=>setEditProject({...editProject,projectName:e.target.value})}/></Field>
        <Grid2>
          <Field label="Project Code"><input style={inp} value={editProject.projectCode} onChange={e=>setEditProject({...editProject,projectCode:e.target.value})}/></Field>
          <Field label="Paint Type"><select style={sl} value={editProject.paintType} onChange={e=>setEditProject({...editProject,paintType:e.target.value})}>{(sysPaintTypes||PAINT_TYPES).map(t=><option key={t}>{t}</option>)}</select></Field>
        </Grid2>
        <Field label="Target Application"><input style={inp} value={editProject.application||""} onChange={e=>setEditProject({...editProject,application:e.target.value})}/></Field>
        <Grid2>
          <Field label="Status"><select style={sl} value={editProject.status} onChange={e=>setEditProject({...editProject,status:e.target.value})}>{PROJECT_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
          <Field label="Target Date"><input type="date" style={inp} value={editProject.targetDate||""} onChange={e=>setEditProject({...editProject,targetDate:e.target.value})}/></Field>
        </Grid2>
        <Field label="Assigned To"><input style={inp} value={editProject.assignedTo||""} onChange={e=>setEditProject({...editProject,assignedTo:e.target.value})}/></Field>
        <Field label="Objective"><textarea style={ta} value={editProject.objective||""} onChange={e=>setEditProject({...editProject,objective:e.target.value})}/></Field>
        <Field label="Formulation Base"><textarea style={ta} value={editProject.formulationBase||""} onChange={e=>setEditProject({...editProject,formulationBase:e.target.value})}/></Field>
        <Field label="Notes"><textarea style={{...ta,minHeight:"56px"}} value={editProject.notes||""} onChange={e=>setEditProject({...editProject,notes:e.target.value})}/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setEditProject(null)} outline color="#475569"/>
          <Btn label={saving?"Saving…":"Save Changes"} onClick={()=>updateProject(editProject)} disabled={saving} color="#f59e0b"/>
        </div>
      </>}
    </Modal>

    {/* Add RM */}
    <Modal open={showAddRM} onClose={()=>setShowAddRM(false)} title="New Raw Material Test Entry">
      <Grid2>
        <Field label="Material Name *"><input style={inp} value={rmForm.materialName} onChange={e=>setRmForm({...rmForm,materialName:e.target.value})} placeholder="e.g. TiO2, Alkyd Resin"/></Field>
        <Field label="Vendor / Supplier *"><input style={inp} value={rmForm.vendorName} onChange={e=>setRmForm({...rmForm,vendorName:e.target.value})}/></Field>
      </Grid2>
      <Grid2>
        <div>
          <div style={{fontSize:"10.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px",display:"flex",alignItems:"center",gap:"8px"}}>Category {addGlobalRmCat&&<QuickAdd label="Category" onAdd={addGlobalRmCat} color="#f97316"/>}</div>
          <select style={sl} value={rmForm.category} onChange={e=>setRmForm({...rmForm,category:e.target.value})}>{(sysRmCats||RM_CATEGORIES).map(c=><option key={c}>{c}</option>)}</select>
        </div>
        <Field label="Date Received"><input type="date" style={inp} value={rmForm.dateReceived} onChange={e=>setRmForm({...rmForm,dateReceived:e.target.value})}/></Field>
      </Grid2>
      <Grid2>
        <Field label="Batch / Lot No"><input style={inp} value={rmForm.batchNo} onChange={e=>setRmForm({...rmForm,batchNo:e.target.value})}/></Field>
        <Field label="Quantity Received"><input style={inp} value={rmForm.quantityReceived} onChange={e=>setRmForm({...rmForm,quantityReceived:e.target.value})} placeholder="e.g. 25 kg"/></Field>
      </Grid2>
      <Grid2>
        <Field label="Tested By"><input style={inp} value={rmForm.testedBy} onChange={e=>setRmForm({...rmForm,testedBy:e.target.value})}/></Field>
        <Field label="Test Result"><select style={sl} value={rmForm.testResult} onChange={e=>setRmForm({...rmForm,testResult:e.target.value})}>{TEST_RESULTS.map(r=><option key={r}>{r}</option>)}</select></Field>
      </Grid2>
      <Field label="Tests Performed"><textarea style={ta} value={rmForm.testsPerformed} onChange={e=>setRmForm({...rmForm,testsPerformed:e.target.value})} placeholder="Viscosity, pH, Fineness, Density..."/></Field>
      <Field label="Observations / Results"><textarea style={ta} value={rmForm.observations} onChange={e=>setRmForm({...rmForm,observations:e.target.value})} placeholder="Values measured, deviations from spec..."/></Field>
      <Field label="Remarks / Action Taken"><textarea style={{...ta,minHeight:"56px"}} value={rmForm.remarks} onChange={e=>setRmForm({...rmForm,remarks:e.target.value})} placeholder="Accepted / Rejected / Returned to vendor..."/></Field>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowAddRM(false)} outline color="#475569"/>
        <Btn label={saving?"Saving…":"Save Entry"} onClick={saveRM} disabled={saving} color="#3b82f6"/>
      </div>
    </Modal>

    {/* View / Retest RM */}
    <Modal wide open={!!viewRM} onClose={()=>setViewRM(null)} title="Raw Material Test Details">
      {viewRM&&<RMDetailView entry={viewRM} showToast={showToast}/>}
    </Modal>

    {/* Edit RM */}
    <Modal open={!!editRM} onClose={()=>setEditRM(null)} title="Edit RM Entry">
      {editRM&&<>
        <Grid2>
          <Field label="Material Name *"><input style={inp} value={editRM.materialName} onChange={e=>setEditRM({...editRM,materialName:e.target.value})}/></Field>
          <Field label="Vendor / Supplier *"><input style={inp} value={editRM.vendorName} onChange={e=>setEditRM({...editRM,vendorName:e.target.value})}/></Field>
        </Grid2>
        <Grid2>
          <Field label="Category"><select style={sl} value={editRM.category} onChange={e=>setEditRM({...editRM,category:e.target.value})}>{(sysRmCats||RM_CATEGORIES).map(c=><option key={c}>{c}</option>)}</select></Field>
          <Field label="Date Received"><input type="date" style={inp} value={editRM.dateReceived||""} onChange={e=>setEditRM({...editRM,dateReceived:e.target.value})}/></Field>
        </Grid2>
        <Grid2>
          <Field label="Batch / Lot No"><input style={inp} value={editRM.batchNo||""} onChange={e=>setEditRM({...editRM,batchNo:e.target.value})}/></Field>
          <Field label="Qty Received"><input style={inp} value={editRM.quantityReceived||""} onChange={e=>setEditRM({...editRM,quantityReceived:e.target.value})}/></Field>
        </Grid2>
        <Grid2>
          <Field label="Tested By"><input style={inp} value={editRM.testedBy||""} onChange={e=>setEditRM({...editRM,testedBy:e.target.value})}/></Field>
          <Field label="Test Result"><select style={sl} value={editRM.testResult} onChange={e=>setEditRM({...editRM,testResult:e.target.value})}>{TEST_RESULTS.map(r=><option key={r}>{r}</option>)}</select></Field>
        </Grid2>
        <Field label="Tests Performed"><textarea style={ta} value={editRM.testsPerformed||""} onChange={e=>setEditRM({...editRM,testsPerformed:e.target.value})}/></Field>
        <Field label="Observations / Results"><textarea style={ta} value={editRM.observations||""} onChange={e=>setEditRM({...editRM,observations:e.target.value})}/></Field>
        <Field label="Remarks"><textarea style={{...ta,minHeight:"56px"}} value={editRM.remarks||""} onChange={e=>setEditRM({...editRM,remarks:e.target.value})}/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setEditRM(null)} outline color="#475569"/>
          <Btn label={saving?"Saving…":"Save Changes"} onClick={()=>updateRM(editRM)} disabled={saving} color="#f59e0b"/>
        </div>
      </>}
    </Modal>

    {/* Toast */}
    {toast&&<div style={{position:"fixed",bottom:"24px",left:"50%",transform:"translateX(-50%)",background:toast.type==="error"?"#450a0a":"#052e16",border:`1px solid ${toast.type==="error"?"#7f1d1d":"#166534"}`,borderRadius:"10px",padding:"11px 22px",color:"#f1f5f9",fontSize:"13.5px",fontWeight:"600",zIndex:3000,boxShadow:"0 8px 30px rgba(0,0,0,0.6)",animation:"fadeIn 0.2s ease",whiteSpace:"nowrap"}}>
      {toast.msg}
    </div>}
  </div>;
}

// ══════════════════════════════════════════════════════════
// ROOT
// ══════════════════════════════════════════════════════════
// Role priority — used to derive primary role from multi-role array
const ROLE_PRIORITY=["admin","qc","issuer","sales","store"];
const primaryRole=(rolesArr)=>ROLE_PRIORITY.find(r=>(rolesArr||[]).includes(r))||rolesArr?.[0]||null;

function App(){
  const [user,setUser]=useState(undefined);
  const [role,setRole]=useState(null);     // primary role (for backward compat)
  const [roles,setRoles]=useState([]);     // full roles array
  const [loading,setLoading]=useState(false);

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async u=>{
      setUser(u||null);
      if(u){
        setLoading(true);
        try{await db.collection("userProfiles").doc(u.uid).set({email:u.email,lastLogin:ts()},{merge:true});}catch(e){}
        try{
          const pr=await db.collection("passwordResets").doc(u.email).get();
          if(pr.exists){
            const {newPassword}=pr.data();
            const idToken=await u.getIdToken(true);
            await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:update?key=${window._firebaseConfig.apiKey}`,{
              method:"POST",headers:{"Content-Type":"application/json"},
              body:JSON.stringify({idToken,password:newPassword,returnSecureToken:false})
            });
            await db.collection("passwordResets").doc(u.email).delete();
            await auth.signOut();
            alert("Your password was changed by the admin. Please log in with your new password.");
            return;
          }
        }catch(e){}
        if(ADMIN_EMAILS.includes(u.email)){setRole("admin");setRoles(["admin"]);setLoading(false);return;}
        try{
          const snap=await db.collection("roles").doc(u.email).get();
          if(snap.exists){
            // Support both old {role:"x"} and new {roles:["x","y"]} formats
            const data=snap.data();
            const rolesArr=data.roles||(data.role?[data.role]:[]);
            const prim=primaryRole(rolesArr);
            setRoles(rolesArr);setRole(prim);
          }else{setRoles([]);setRole(null);}
        }catch(e){setRoles([]);setRole(null);}
        setLoading(false);
      }else{setRoles([]);setRole(null);setLoading(false);}
    });
    return unsub;
  },[]);

  if(user===undefined||loading)return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#475569",fontSize:"14px"}}>Loading…</div>;
  if(!user)return <LoginScreen/>;
  if(!role)return <NoAccessScreen/>;
  return <MainApp user={user} role={role} roles={roles}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
