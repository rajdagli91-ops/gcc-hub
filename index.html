    style={{background:"#0f172a",border:"1px solid #1e293b",borderLeft:`3px solid ${rc}`,borderRadius:"12px",padding:"15px 20px",cursor:"pointer",transition:"background 0.15s",boxShadow:"0 2px 10px rgba(0,0,0,0.3)",marginBottom:"10px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}>
      <div style={{flex:1}}>
        <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9",marginBottom:"3px",fontFamily:"'DM Serif Display',serif"}}>{r.materialName}</div>
        <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"6px"}}>{r.vendorName} · {r.category} · Batch: {r.batchNo||"—"}</div>
      </div>
      <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
        {r.testResult==="Retest Required"&&<Bdg label="⚠️ Retest" color="#f97316" small/>}
        <Bdg label={r.testResult} color={rc}/>
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onEdit(r)}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",color:"#475569",fontSize:"12px",padding:"2px 8px",cursor:"pointer"}}>✏️</button>}
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onDelete(r.id)}} style={{background:"none",border:"none",color:"#334155",fontSize:"15px",padding:"2px 4px",cursor:"pointer"}}>🗑</button>}
      </div>
    </div>
    <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
      {r.dateReceived&&<span style={{fontSize:"11px",color:"#475569"}}>📦 {r.dateReceived}</span>}
      {r.testedBy&&<span style={{fontSize:"11px",color:"#475569"}}>🔬 {r.testedBy}</span>}
      {retestCount>0&&<span style={{fontSize:"11px",color:"#f97316",background:"#f9731612",border:"1px solid #f9731625",borderRadius:"6px",padding:"2px 8px"}}>🔄 {retestCount} retest{retestCount!==1?"s":""}</span>}
    </div>
  </div>;
}

function RMDetailView({entry,showToast}){
  const [live,setLive]=useState(entry);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [showOU,setShowOU]=useState(false);
  const [newResult,setNewResult]=useState(entry.testResult);
  const blank={date:today(),testedBy:"",testsPerformed:"",results:"",newResult:"Pass",remarks:""};
  const [retestForm,setRetestForm]=useState(blank);

  useEffect(()=>{
    const unsub=C("rm_tests").doc(entry.id).onSnapshot(snap=>{
      if(snap.exists)setLive({id:snap.id,...snap.data()});
    });
    return unsub;
  },[entry.id]);

  const retests=live.retests||[];
  const rc=RESULT_COLORS[live.testResult]||"#94a3b8";
  const isRetest=live.testResult==="Retest Required";

  const saveRetest=async()=>{
    if(!retestForm.results.trim()&&!retestForm.testsPerformed.trim())return showToast("Add results or tests performed","error");
    if(saving)return;setSaving(true);
    try{
      const nr={...retestForm,id:newId()};
      await C("rm_tests").doc(entry.id).update({retests:[...retests,nr]});
      setRetestForm(blank);setShowForm(false);
      setNewResult(nr.newResult);setShowOU(true);showToast("Retest saved ✓");
    }catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const applyResult=async()=>{
    setSaving(true);
    try{await C("rm_tests").doc(entry.id).update({testResult:newResult});setShowOU(false);showToast("Status updated ✓");}catch(e){showToast("Error","error");}
    setSaving(false);
  };

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"14px",gap:"8px"}}>
      <div>
        <div style={{fontSize:"20px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>{live.materialName}</div>
        <div style={{fontSize:"12px",color:"#64748b"}}>{live.vendorName} · {live.category}</div>
      </div>
      <div style={{display:"flex",gap:"8px",alignItems:"center",flexShrink:0}}>
        {retests.length>0&&<Bdg label={`🔄 ${retests.length} Retest${retests.length!==1?"s":""}`} color="#f97316" small/>}
        <Bdg label={live.testResult} color={rc}/>
      </div>
    </div>
    {isRetest&&<div style={{background:"#431407",border:"1px solid #ea580c50",borderRadius:"10px",padding:"10px 14px",marginBottom:"12px",display:"flex",alignItems:"center",gap:"8px"}}>
      <span>⚠️</span><div><div style={{fontSize:"12px",fontWeight:"700",color:"#f97316"}}>Retest Required</div><div style={{fontSize:"11.5px",color:"#c2410c"}}>This sample needs retesting.</div></div>
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"12px"}}>
      {[["Batch No",live.batchNo],["Lot No",live.lotNo],["Quantity",live.quantityReceived],["Date Received",live.dateReceived],["Tested By",live.testedBy]].map(([l,v])=>v&&<div key={l} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"8px 12px"}}>
        <div style={{fontSize:"10px",color:"#475569",fontWeight:"600",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"2px"}}>{l}</div>
        <div style={{fontSize:"13px",color:"#94a3b8",fontWeight:"600"}}>{v}</div>
      </div>)}
    </div>
    <div style={{border:"1px solid #1e293b",borderRadius:"10px",marginBottom:"12px",overflow:"hidden"}}>
      <div style={{background:"#0b1220",padding:"9px 14px",fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",borderBottom:"1px solid #1e293b"}}>🧫 Original Test</div>
      <div style={{padding:"12px 14px"}}>
        {[["Tests Performed",live.testsPerformed],["Observations / Results",live.observations],["Remarks",live.remarks]].map(([l,v])=>v&&<div key={l} style={{marginBottom:"8px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"3px"}}>{l}</div>
          <div style={{fontSize:"13px",color:"#94a3b8",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{v}</div>
        </div>)}
      </div>
    </div>
    {/* Retests */}
    <div style={{borderTop:"1px solid #1e293b",paddingTop:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
        <span style={{fontSize:"11px",fontWeight:"700",color:isRetest?"#f97316":"#475569",textTransform:"uppercase",letterSpacing:"0.09em"}}>🔄 Retest History ({retests.length})</span>
        <button onClick={()=>{setShowForm(v=>!v);setShowOU(false);}} style={{background:isRetest?"#431407":"#1e293b",border:`1px solid ${isRetest?"#ea580c":"#334155"}`,borderRadius:"7px",padding:"5px 12px",color:isRetest?"#fb923c":"#64748b",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>
          {showForm?"▲ Cancel":"+ Add Retest"}</button>
      </div>
      {retests.length===0&&!showForm&&<div style={{textAlign:"center",padding:"12px",border:"1px dashed #1e293b",borderRadius:"8px",marginBottom:"8px"}}>
        <div style={{fontSize:"12px",color:"#334155"}}>{isRetest?"⏳ Awaiting retest.":"No retests."}</div>
      </div>}
      {retests.map((r,i)=>{
        const rrc=RESULT_COLORS[r.newResult]||"#94a3b8";
        return <div key={r.id} style={{display:"flex",gap:"10px",marginBottom:"10px"}}>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",flexShrink:0}}>
            <div style={{width:"26px",height:"26px",borderRadius:"50%",background:`${rrc}20`,border:`2px solid ${rrc}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",fontWeight:"700",color:rrc}}>{i+1}</div>
            {i<retests.length-1&&<div style={{width:"2px",flex:1,background:"#1e293b",marginTop:"4px"}}/>}
          </div>
          <div style={{flex:1,background:"#0b1220",border:"1px solid #1e293b",borderLeft:`3px solid ${rrc}`,borderRadius:"8px",padding:"10px 12px",marginBottom:"4px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6px"}}>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontSize:"11px",fontWeight:"700",color:"#475569",background:"#1e293b",padding:"2px 8px",borderRadius:"6px"}}>Retest #{i+1}</span>
                {r.date&&<span style={{fontSize:"11px",color:"#475569"}}>📅 {r.date}</span>}
                {r.testedBy&&<span style={{fontSize:"11px",color:"#475569"}}>🔬 {r.testedBy}</span>}
              </div>
              <div style={{display:"flex",gap:"5px",alignItems:"center",flexShrink:0}}>
                <Bdg label={r.newResult} color={rrc} small/>
                <button onClick={async()=>{if(confirm("Delete?"))await C("rm_tests").doc(entry.id).update({retests:retests.filter(x=>x.id!==r.id)});}} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"12px"}}>🗑</button>
              </div>
            </div>
            {[["Tests",r.testsPerformed],["Results",r.results],["Remarks",r.remarks]].map(([l,v])=>v&&<div key={l} style={{marginBottom:"4px"}}>
              <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"2px"}}>{l}</div>
              <div style={{fontSize:"12.5px",color:"#94a3b8",whiteSpace:"pre-wrap"}}>{v}</div>
            </div>)}
          </div>
        </div>;
      })}
      {showForm&&<div style={{background:"#0a0f1e",border:"1px solid #ea580c40",borderRadius:"10px",padding:"14px",marginBottom:"10px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#fb923c",marginBottom:"12px"}}>🔄 Retest #{retests.length+1}</div>
        <Grid3>
          <Field label="Date"><input type="date" style={inp} value={retestForm.date} onChange={e=>setRetestForm({...retestForm,date:e.target.value})}/></Field>
          <Field label="Tested By"><input style={inp} value={retestForm.testedBy} onChange={e=>setRetestForm({...retestForm,testedBy:e.target.value})}/></Field>
          <Field label="Result"><select style={{...sl,borderColor:(RESULT_COLORS[retestForm.newResult]||"#1e293b")+"60"}} value={retestForm.newResult} onChange={e=>setRetestForm({...retestForm,newResult:e.target.value})}>{TEST_RESULTS.map(r=><option key={r}>{r}</option>)}</select></Field>
        </Grid3>
        <Grid2>
          <Field label="Tests Performed"><textarea style={{...ta,minHeight:"70px"}} value={retestForm.testsPerformed} onChange={e=>setRetestForm({...retestForm,testsPerformed:e.target.value})}/></Field>
          <Field label="Results / Values *"><textarea style={{...ta,minHeight:"70px"}} value={retestForm.results} onChange={e=>setRetestForm({...retestForm,results:e.target.value})}/></Field>
        </Grid2>
        <Field label="Remarks"><textarea style={{...ta,minHeight:"50px"}} value={retestForm.remarks} onChange={e=>setRetestForm({...retestForm,remarks:e.target.value})}/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setShowForm(false)} outline color="#475569" small/>
          <Btn label={saving?"Saving…":"Save Retest"} onClick={saveRetest} disabled={saving} color="#ea580c" small/>
        </div>
      </div>}
      {showOU&&<div style={{background:"#0c1a2e",border:"1px solid #2563eb60",borderRadius:"10px",padding:"12px 14px",marginTop:"6px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"6px"}}>🔄 Update Overall Status</div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
          <select style={{...sl,flex:1,minWidth:"170px"}} value={newResult} onChange={e=>setNewResult(e.target.value)}>{TEST_RESULTS.map(r=><option key={r}>{r}</option>)}</select>
          <Btn label={saving?"Saving…":"✓ Update"} onClick={applyResult} disabled={saving} color="#2563eb" small/>
          <Btn label="Keep as is" onClick={()=>setShowOU(false)} outline color="#475569" small/>
        </div>
      </div>}
    </div>
  </div>;
}

function DashboardTab({role}){
  const [counts,setCounts]=useState({batches:0,activeBatches:0,openComplaints:0,rdProjects:0,rmTests:0,qcPending:0});
  useEffect(()=>{
    Promise.all([
      C("batches").get(),
      C("batches").where("status","in",["Issued","In Production","QC Pending","QC Pass","Packed"]).get(),
      C("batches").where("status","==","QC Pending").get(),
      C("complaints").where("status","in",["Open","Under Review"]).get(),
      C("rd_projects").get(),
      C("rm_tests").get()
    ]).then(([b,ab,qc,oc,rd,rm])=>setCounts({batches:b.size,activeBatches:ab.size,qcPending:qc.size,openComplaints:oc.size,rdProjects:rd.size,rmTests:rm.size}));
  },[]);

  const tiles=[
    {label:"Active Batches",val:counts.activeBatches,color:"#3b82f6",icon:"📦",roles:["admin","issuer","qc"]},
    {label:"QC Pending",val:counts.qcPending,color:"#a855f7",icon:"🔬",roles:["admin","qc"]},
    {label:"Open Complaints",val:counts.openComplaints,color:"#ef4444",icon:"⚠️",roles:["admin","issuer","qc","sales"]},
    {label:"R&D Projects",val:counts.rdProjects,color:"#22c55e",icon:"🧪",roles:["admin","qc"]},
    {label:"RM Tests",val:counts.rmTests,color:"#f59e0b",icon:"🧫",roles:["admin","qc"]},
    {label:"Total Batches",val:counts.batches,color:"#64748b",icon:"📋",roles:["admin","issuer"]},
  ].filter(t=>t.roles.includes(role));

  return <div>
    <div style={{marginBottom:"24px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#3b82f6",letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:"4px"}}>Welcome back</div>
      <h2 style={{fontSize:"22px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>Operations <span style={{fontStyle:"italic",color:"#3b82f6"}}>Overview</span></h2>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:"12px"}}>
      {tiles.map(t=><div key={t.label} style={{background:"#0f172a",border:`1px solid #1e293b`,borderTop:`3px solid ${t.color}`,borderRadius:"12px",padding:"16px 18px",boxShadow:"0 2px 10px rgba(0,0,0,0.3)"}}>
        <div style={{fontSize:"24px",marginBottom:"8px"}}>{t.icon}</div>
        <div style={{fontSize:"28px",fontWeight:"700",color:t.color,marginBottom:"4px"}}>{t.val}</div>
        <div style={{fontSize:"12px",color:"#475569",fontWeight:"600"}}>{t.label}</div>
      </div>)}
    </div>

// USERS TAB (Admin only)
// ══════════════════════════════════════════════════════════
function UsersTab({currentUser}){
  const [profiles,setProfiles]=useState({});  // uid/email -> {email, displayName}
  const [roles,setRoles]=useState({});         // email -> role
  const [editingRole,setEditingRole]=useState(null);
  const [editRoleVal,setEditRoleVal]=useState("");
  const [saving,setSaving]=useState(null);
  const [localToast,setLocalToast]=useState(null);
  const showLT=(msg,type="success")=>{setLocalToast({msg,type});setTimeout(()=>setLocalToast(null),3000);};

  const [createEmail,setCreateEmail]=useState("");
  const [createPassword,setCreatePassword]=useState("");
  const [createName,setCreateName]=useState("");
  const [createRole,setCreateRole]=useState("sales");
  const [creating,setCreating]=useState(false);
  const [createError,setCreateError]=useState("");
  const [createSuccess,setCreateSuccess]=useState("");
  const [editPassEmail,setEditPassEmail]=useState(null);
  const [savingPass,setSavingPass]=useState(false);

  useEffect(()=>{
    // Load profiles
    const unsub1=C("userProfiles").onSnapshot(snap=>{
      const p={};
      snap.docs.forEach(d=>{const dat=d.data();if(dat.email)p[dat.email]={...dat,uid:d.id};});
      setProfiles(p);
    });
    // Load roles — this is the source of truth for all users
    const unsub2=C("roles").onSnapshot(snap=>{
      const r={};snap.docs.forEach(d=>r[d.id]=d.data().role);setRoles(r);
    });
    return()=>{unsub1();unsub2();};
  },[]);

  const createUser=async()=>{
    const isAdminRole=createRole==="admin";
    const DOMAIN="@gcc-hub.app";
    if(!createName.trim()&&!isAdminRole)return setCreateError("Name / Username is required.");
    if(!createPassword.trim())return setCreateError("Password is required.");
    if(createPassword.length<6)return setCreateError("Password must be at least 6 characters.");
    if(isAdminRole&&!createEmail.trim())return setCreateError("Admin accounts require a real email address (for password reset).");
    let finalEmail=createEmail.trim();
    if(!finalEmail){
      const username=createName.trim().toLowerCase().replace(/\s+/g,".").replace(/[^a-z0-9._]/g,"");
      finalEmail=username+DOMAIN;
    }
    setCreating(true);setCreateError("");setCreateSuccess("");
    try{
      const res=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${window._firebaseConfig.apiKey}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email:finalEmail,password:createPassword,returnSecureToken:false})
      });
      const data=await res.json();
      if(data.error)throw new Error(data.error.message);
      await C("roles").doc(finalEmail).set({role:createRole,assignedBy:currentUser.email,assignedAt:ts()},{merge:true});
      if(createName.trim()){
        await C("userProfiles").doc(data.localId||finalEmail).set({
          email:finalEmail,displayName:createName.trim(),
          isUsernameAccount:!createEmail.trim(),
          createdBy:currentUser.email,createdAt:ts()
        },{merge:true});
      }
      const loginInfo=createEmail.trim()?`Email: ${finalEmail}`:`Login email (auto): ${finalEmail}`;
      setCreateSuccess(`✅ Created: ${createName.trim()||finalEmail} — ${ROLE_LABELS[createRole]} | ${loginInfo}`);
      setCreateEmail("");setCreatePassword("");setCreateName("");setCreateRole("sales");
    }catch(e){
      const m=e.message;
      setCreateError(m==="EMAIL_EXISTS"?"This username/email already exists."
        :m.includes("WEAK_PASSWORD")?"Password must be 6+ characters.":m||"Error creating user.");
    }
    setCreating(false);
  };

  const saveRoleEdit=async(email)=>{
    setSaving(email);
    try{
      await C("roles").doc(email).set({role:editRoleVal,assignedBy:currentUser.email,assignedAt:ts()},{merge:true});
      setEditingRole(null);showLT(`Role updated to ${ROLE_LABELS[editRoleVal]} ✓`);
    }catch(e){showLT("Error updating role","error");}
    setSaving(null);
  };

  const removeAccess=async(email)=>{
    if(!confirm(`Remove ${email}'s access? They will see "Access Pending" until re-assigned.`))return;
    try{await C("roles").doc(email).delete();showLT("Access removed ✓");}
    catch(e){showLT("Error","error");}
  };

  const sendReset=async(email)=>{
    setSavingPass(true);
    try{await auth.sendPasswordResetEmail(email);showLT(`Reset email sent to ${email} ✓`);setEditPassEmail(null);}
    catch(e){showLT("Error: "+e.message,"error");}
    setSavingPass(false);
  };

  // Merge roles + profiles into single list — roles is the master list
  const allEmails=[...new Set([...Object.keys(roles),...Object.keys(profiles)])].filter(Boolean).sort();

  return <div>
    <SectionHead title="User Management"/>

    {/* CREATE */}
    <div style={{background:"#0a1628",border:"1px solid #1e3a5f",borderRadius:"12px",padding:"18px",marginBottom:"20px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px"}}>
        <span style={{fontSize:"16px"}}>➕</span>
        <span style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",textTransform:"uppercase",letterSpacing:"0.09em"}}>Create New User Account</span>
      </div>
      {/* Role selector first so form adapts */}
      <Grid2>
        <Field label="Role *">
          <select style={sl} value={createRole} onChange={e=>setCreateRole(e.target.value)}>
            {["admin","issuer","qc","sales"].map(r=><option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
          </select>
        </Field>
        <Field label={createRole==="admin"?"Full Name (optional)":"Full Name / Username *"}>
          <input style={inp} value={createName} onChange={e=>setCreateName(e.target.value)}
            placeholder={createRole==="admin"?"e.g. Vijay Dagli":"e.g. Ramesh (used as login)"}/>
        </Field>
      </Grid2>
      {/* Email — required for admin, optional for others */}
      <div style={{background:createRole==="admin"?"#0a1010":"#0b1220",border:`1px solid ${createRole==="admin"?"#f59e0b30":"#1e293b"}`,borderRadius:"8px",padding:"12px 14px",marginBottom:"12px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:createRole==="admin"?"#f59e0b":"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>
          {createRole==="admin"?"🔑 Admin Email (required for password reset)":"📧 Email Address (optional — leave blank to auto-generate from name)"}
        </div>
        <input type="email" style={{...inp,borderColor:createRole==="admin"?"#f59e0b50":"#1e293b"}}
          value={createEmail} onChange={e=>setCreateEmail(e.target.value)}
          placeholder={createRole==="admin"?"admin@yourcompany.com (real email required)":"user@company.com (or leave blank)"}/>
        {createRole!=="admin"&&!createEmail&&createName&&<div style={{fontSize:"11px",color:"#475569",marginTop:"4px"}}>
          Login will be: <strong style={{color:"#64748b"}}>
            {createName.trim().toLowerCase().replace(/\s+/g,".").replace(/[^a-z0-9._]/g,"")}@gcc-hub.app
          </strong> — share this with the user
        </div>}
      </div>
      <Field label="Password *">
        <input type="password" style={inp} value={createPassword} onChange={e=>setCreatePassword(e.target.value)} placeholder="Min 6 characters"/>
      </Field>
      {createError&&<div style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"7px",padding:"9px 12px",color:"#fca5a5",fontSize:"12.5px",marginBottom:"10px"}}>❌ {createError}</div>}
      {createSuccess&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"9px 12px",color:"#86efac",fontSize:"12.5px",marginBottom:"10px"}}>{createSuccess}</div>}
      <div style={{display:"flex",justifyContent:"flex-end"}}>
        <Btn label={creating?"Creating…":"Create User Account"} onClick={createUser} disabled={creating} color="#3b82f6" small/>
      </div>
    </div>

    {/* USERS LIST */}
    <SectionHead title={`All Users (${allEmails.length})`}/>
    <InfoBox color="#f59e0b">All users with created accounts appear here. Use ✏️ to change a role, 🔑 to send a password reset email, ✕ to remove access.</InfoBox>

    {allEmails.length===0
      ?<div style={{textAlign:"center",padding:"32px",color:"#334155",fontSize:"13px"}}>No users yet. Create one above.</div>
      :allEmails.map(email=>{
        const isHardAdmin=ADMIN_EMAILS.includes(email);
        const currentRole=isHardAdmin?"admin":(roles[email]||null);
        const rc=ROLE_COLORS[currentRole]||"#475569";
        const name=profiles[email]?.displayName||"";
        const isEditing=editingRole===email;

        return <div key={email} style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:"10px",padding:"13px 16px",marginBottom:"8px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"10px",flexWrap:"wrap"}}>
            <div style={{flex:1}}>
              {name&&<div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9",marginBottom:"2px"}}>{name}</div>}
              <div style={{fontSize:name?"12px":"13.5px",fontWeight:name?"400":"600",color:name?"#64748b":"#e2e8f0",marginBottom:"4px"}}>{email}</div>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}}>
                {currentRole
                  ?<Bdg label={ROLE_LABELS[currentRole]||currentRole} color={rc} small/>
                  :<span style={{fontSize:"11px",color:"#ef4444",fontStyle:"italic"}}>No role assigned</span>}
                {isHardAdmin&&<span style={{fontSize:"10px",color:"#475569",fontStyle:"italic"}}>· hardcoded admin</span>}
              </div>
            </div>
            {!isHardAdmin&&<div style={{display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap",flexShrink:0}}>
              <button onClick={()=>{setEditingRole(isEditing?null:email);setEditRoleVal(roles[email]||"sales");}}
                style={{background:"#1e293b",border:"1px solid #334155",borderRadius:"6px",padding:"5px 10px",color:"#94a3b8",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>✏️ Role</button>
              <button onClick={()=>setEditPassEmail(editPassEmail===email?null:email)}
                style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"6px",padding:"5px 10px",color:"#93c5fd",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>🔑 Reset PW</button>
              <button onClick={()=>removeAccess(email)}
                style={{background:"none",border:"1px solid #7f1d1d",borderRadius:"6px",padding:"5px 10px",color:"#ef4444",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>✕ Remove</button>
            </div>}
          </div>

          {/* Inline role edit */}
          {isEditing&&!isHardAdmin&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b",display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:"12px",color:"#64748b",fontWeight:"600"}}>Change role to:</span>
            {["admin","issuer","qc","sales"].map(r=>(
              <button key={r} onClick={()=>setEditRoleVal(r)} style={{
                background:editRoleVal===r?`${ROLE_COLORS[r]}20`:"none",
                border:`1px solid ${editRoleVal===r?ROLE_COLORS[r]:"#334155"}`,
                borderRadius:"7px",padding:"5px 12px",
                color:editRoleVal===r?ROLE_COLORS[r]:"#475569",
                fontSize:"12px",fontWeight:"700",cursor:"pointer"
              }}>{ROLE_LABELS[r]}</button>
            ))}
            <Btn label={saving===email?"Saving…":"✓ Save"} onClick={()=>saveRoleEdit(email)} disabled={saving===email} color="#22c55e" small/>
            <Btn label="Cancel" onClick={()=>setEditingRole(null)} outline color="#475569" small/>
          </div>}

          {/* Password reset */}
          {editPassEmail===email&&!isHardAdmin&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b",background:"#0a1628",borderRadius:"8px",padding:"12px"}}>
            <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"6px"}}>🔑 Send Password Reset Email</div>
            <div style={{fontSize:"12.5px",color:"#64748b",marginBottom:"10px"}}>A reset link will be sent to <strong style={{color:"#e2e8f0"}}>{email}</strong>.</div>
            <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
              <Btn label="Cancel" onClick={()=>setEditPassEmail(null)} outline color="#475569" small/>
              <Btn label={savingPass?"Sending…":"Send Reset Email"} onClick={()=>sendReset(email)} disabled={savingPass} color="#f59e0b" small/>
            </div>
          </div>}
        </div>;
      })
    }

    {localToast&&<div style={{position:"fixed",bottom:"24px",left:"50%",transform:"translateX(-50%)",background:localToast.type==="error"?"#450a0a":"#052e16",border:`1px solid ${localToast.type==="error"?"#7f1d1d":"#166534"}`,borderRadius:"10px",padding:"10px 20px",color:"#f1f5f9",fontSize:"13px",fontWeight:"600",zIndex:4000,boxShadow:"0 8px 30px rgba(0,0,0,0.6)",animation:"fadeIn 0.2s ease",whiteSpace:"nowrap"}}>{localToast.msg}</div>}
  </div>;
}

// Searchable product selector component
const normalize = (s) => (s||"").toLowerCase().replace(/[\s\-_.()\/\\,&+*#@!?'"%]/g,"");

function ProductSearch({prods, value, onChange, disabled}){
  const [query,setQuery]=useState(value||"");
  const [open,setOpen]=useState(false);
  const ref=useRef(null);

  useEffect(()=>{ setQuery(value||""); },[value]);

  useEffect(()=>{
    const handler=(e)=>{ if(ref.current&&!ref.current.contains(e.target))setOpen(false); };
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[]);

  // Smart filter: ignores spaces, special chars, case
  const filtered=prods.filter(p=>{
    if(!query)return true;
    const nq=normalize(query);
    const nn=normalize(gpn(p));
    // Match if normalized name contains normalized query (contiguous or split)
    return nn.includes(nq)||
      // Also match initials: "IE" matches "Interior Emulsion"
      gpn(p).split(/\s+/).map(w=>w[0]||"").join("").toLowerCase().startsWith(nq);
  });

  const select=(p)=>{ setQuery(gpn(p)); setOpen(false); onChange(p); };
  const highlight=(text)=>{
    if(!query)return text;
    try{
      const re=new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`, "gi");
      const parts=text.split(re);
      return parts.map((part,i)=>re.test(part)?<mark key={i} style={{background:"#f59e0b30",color:"#f59e0b",borderRadius:"2px"}}>{part}</mark>:part);
    }catch{return text;}
  };

  return <div ref={ref} style={{position:"relative"}}>
    <div style={{position:"relative"}}>
      <input style={{...inp,paddingRight:"30px",cursor:disabled?"not-allowed":"text",opacity:disabled?0.5:1}}
        value={query} disabled={disabled}
        onChange={e=>{setQuery(e.target.value);setOpen(true);onChange(null);}}
        onFocus={()=>!disabled&&setOpen(true)}
        placeholder={disabled?"← select category first":"Type to search products…"}/>
      <span onClick={()=>!disabled&&setOpen(o=>!o)}
        style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",cursor:"pointer",color:"#475569",fontSize:"12px",pointerEvents:disabled?"none":"auto"}}>
        {open?"▲":"▼"}
      </span>
    </div>
    {open&&!disabled&&<div style={{position:"absolute",zIndex:500,top:"100%",left:0,right:0,background:"#0f172a",border:"1px solid #3b82f6",borderTop:"none",borderRadius:"0 0 8px 8px",maxHeight:"220px",overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}}>
      {query&&<div style={{padding:"6px 14px",fontSize:"11px",color:"#334155",borderBottom:"1px solid #1e293b",background:"#060d1a"}}>
        {filtered.length} result{filtered.length!==1?"s":""} — spaces & symbols ignored in search
      </div>}
      {filtered.length===0
        ?<div style={{padding:"12px 14px",fontSize:"12.5px",color:"#475569",fontStyle:"italic"}}>No products match — try fewer characters</div>
        :filtered.map(p=>{
          const n=gpn(p); const u=gpu(p);
          const isSelected=n===value;
          return <div key={n} onClick={()=>select(p)}
            style={{padding:"9px 14px",cursor:"pointer",fontSize:"13px",
              color:isSelected?"#22c55e":"#e2e8f0",
              background:isSelected?"#052e16":"transparent",
              borderTop:"1px solid #1e293b",
              display:"flex",justifyContent:"space-between",alignItems:"center"}}
            onMouseEnter={e=>e.currentTarget.style.background=isSelected?"#052e16":"#1e293b"}
            onMouseLeave={e=>e.currentTarget.style.background=isSelected?"#052e16":"transparent"}>
            <span>{highlight(n)}</span>
            <span style={{fontSize:"11px",color:isSelected?"#22c55e":"#475569",background:"#0b1220",padding:"1px 7px",borderRadius:"99px",border:"1px solid #1e293b",flexShrink:0,marginLeft:"8px"}}>{u}</span>
          </div>;
        })}
    </div>}
  </div>;
}

function CategoryProductSelect({category,setCategory,productName,setProductName,products,onUnitChange,catUnits}){
  const cats = Object.keys(products||DEFAULT_PRODUCTS);
  const prods = (products||DEFAULT_PRODUCTS)[category] || [];
  const units = catUnits||CATEGORY_UNITS;
  return <Grid2>
    <Field label="Category *">
      <select style={sl} value={category} onChange={e=>{
        setCategory(e.target.value);
        if(onUnitChange)onUnitChange(units[e.target.value]||CATEGORY_UNITS[e.target.value]||"kg");
      }}>
        <option value="">— Select Category —</option>
        {cats.map(c=><option key={c} value={c}>{c}</option>)}
      </select>
    </Field>
    <Field label="Product *">
      <ProductSearch prods={prods} value={productName} disabled={!category} onChange={p=>{
        if(p){
          setProductName(gpn(p));
          if(onUnitChange)onUnitChange(gpu(p));
        }else{
          setProductName("");
        }
      }}/>
    </Field>
  </Grid2>;
}

// OLD STOCK SECTION
// ══════════════════════════════════════════════════════════
function OldStockSection({role,user,showToast,products,catUnits}){
  const [stocks,setStocks]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [search,setSearch]=useState("");
  const [form,setForm]=useState({category:"",productName:"",qty:"",unit:"kg",batchRef:"",dateAdded:today(),addedBy:"",notes:""});

  useEffect(()=>{
    const unsub=C("old_stock").orderBy("_createdAt","desc").onSnapshot(s=>setStocks(s.docs.map(d=>({id:d.id,...d.data()}))),
      ()=>C("old_stock").onSnapshot(s=>setStocks(s.docs.map(d=>({id:d.id,...d.data()})))));
    return unsub;
  },[]);

  const saveStock=async()=>{
    if(!form.category||!form.productName||!form.qty)return showToast("Category, product and qty required","error");
    if(saving)return;setSaving(true);
    try{
      await C("old_stock").add({...form,addedBy:form.addedBy||user.email,status:"Available",_createdAt:ts()});
      setForm({category:"",productName:"",qty:"",unit:"kg",batchRef:"",dateAdded:today(),addedBy:"",notes:""});
      setShowForm(false);showToast("Old stock entry added ✓");
    }catch(e){showToast("Error saving","error");}
    setSaving(false);
  };

  const toggleStatus=async(id,current)=>{
    await C("old_stock").doc(id).update({status:current==="Available"?"Used":"Available"});
    showToast("Status updated ✓");
  };

  const deleteStock=async(id)=>{
    if(!confirm("Delete this entry?"))return;
    await C("old_stock").doc(id).delete();showToast("Deleted","error");
  };

  const filtered=stocks.filter(s=>{
    const q=search.toLowerCase();
    return !q||s.productName?.toLowerCase().includes(q)||s.category?.toLowerCase().includes(q)||s.batchRef?.toLowerCase().includes(q);
  });

  const available=filtered.filter(s=>s.status==="Available");
  const used=filtered.filter(s=>s.status!=="Available");
  const canEdit=role==="admin"||role==="issuer"||role==="qc";

  return <div style={{marginTop:"24px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"10px"}}>
      <div style={{display:"flex",gap:"8px",alignItems:"center",flex:1}}>
        <span style={{fontSize:"12px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.1em"}}>📦 Old / Rejected Material Register</span>
        <span style={{fontSize:"11px",background:"#f59e0b18",border:"1px solid #f59e0b30",borderRadius:"99px",padding:"2px 10px",color:"#f59e0b",fontWeight:"700"}}>{available.length} Available</span>
      </div>
      <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
        <input placeholder="Search stock…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:"180px",padding:"7px 10px",fontSize:"12px"}}/>
        {canEdit&&<Btn label="+ Add Old/Rejected Material" onClick={()=>setShowForm(v=>!v)} color="#f59e0b" small/>}
      </div>
    </div>

    {showForm&&<div style={{background:"#0a1010",border:"1px solid #f59e0b40",borderRadius:"10px",padding:"16px",marginBottom:"14px"}}>
      <div style={{fontSize:"12px",fontWeight:"700",color:"#f59e0b",marginBottom:"12px"}}>📦 Add Old/Rejected Material Entry</div>
      <CategoryProductSelect category={form.category} setCategory={cat=>{
        const unit=(catUnits?.[cat])||CATEGORY_UNITS[cat]||"kg";
        setForm({...form,category:cat,productName:"",unit});
      }} productName={form.productName} setProductName={pn=>setForm({...form,productName:pn})} products={products} catUnits={catUnits}/>
      <Grid2>
        <Field label="Quantity *"><input style={inp} value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} placeholder="e.g. 500"/></Field>
        <Field label="Unit">
          <div style={{...inp,background:"#060b16",cursor:"default",display:"flex",alignItems:"center",gap:"8px",color:form.unit?"#22c55e":"#475569",fontWeight:"600"}}>
            {form.unit||(form.category?(sysCatUnits?.[form.category]||CATEGORY_UNITS[form.category]||"kg"):"— select category first —")}
            {form.unit&&<span style={{fontSize:"10px",color:"#475569",fontWeight:"400"}}>(auto)</span>}
          </div>
        </Field>
        <Field label="Date Added"><input type="date" style={inp} value={form.dateAdded} onChange={e=>setForm({...form,dateAdded:e.target.value})}/></Field>
      </Grid2>
      <Grid2>
        <Field label="Original Batch Ref (if any)"><input style={inp} value={form.batchRef} onChange={e=>setForm({...form,batchRef:e.target.value})} placeholder="e.g. GCC-2501-005"/></Field>
        <Field label="Added By"><input style={inp} value={form.addedBy} onChange={e=>setForm({...form,addedBy:e.target.value})} placeholder={user.email}/></Field>
      </Grid2>
      <Field label="Notes"><textarea style={{...ta,minHeight:"50px"}} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Condition, reason for old stock..."/></Field>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowForm(false)} outline color="#475569" small/>
        <Btn label={saving?"Saving…":"Save Entry"} onClick={saveStock} disabled={saving} color="#f59e0b" small/>
      </div>
    </div>}

    {available.length===0&&used.length===0&&!showForm&&<div style={{textAlign:"center",padding:"24px",border:"1px dashed #1e293b",borderRadius:"8px",color:"#334155",fontSize:"13px"}}>No entries yet.{canEdit?" Click + Add Old/Rejected Material to log material.":""}</div>}

    {available.length>0&&<>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"8px"}}>Available ({available.length})</div>
      {available.map(s=><OldStockCard key={s.id} s={s} canEdit={canEdit} onToggle={toggleStatus} onDelete={deleteStock}/>)}
    </>}
    {used.length>0&&<>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"8px",marginTop:"12px"}}>Used / Consumed ({used.length})</div>
      {used.map(s=><OldStockCard key={s.id} s={s} canEdit={canEdit} onToggle={toggleStatus} onDelete={deleteStock}/>)}
    </>}
  </div>;
}

function OldStockCard({s,canEdit,onToggle,onDelete}){
  const isAvail=s.status==="Available";
  return <div style={{background:"#0f172a",border:`1px solid ${isAvail?"#f59e0b30":"#1e293b"}`,borderLeft:`3px solid ${isAvail?"#f59e0b":"#334155"}`,borderRadius:"10px",padding:"12px 16px",marginBottom:"8px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}}>
    <div style={{flex:1}}>
      <div style={{fontSize:"13.5px",fontWeight:"600",color:"#f1f5f9"}}>{s.productName}</div>
      <div style={{fontSize:"11.5px",color:"#64748b",marginTop:"2px"}}>{s.category} · <strong style={{color:isAvail?"#f59e0b":"#475569"}}>{s.qty} {s.unit}</strong>{s.batchRef&&` · Ref: ${s.batchRef}`}</div>
      {s.notes&&<div style={{fontSize:"11.5px",color:"#475569",marginTop:"2px",fontStyle:"italic"}}>{s.notes}</div>}
    </div>
    <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
      <span style={{fontSize:"11px",fontWeight:"700",color:isAvail?"#f59e0b":"#64748b",background:isAvail?"#f59e0b18":"#1e293b",padding:"2px 9px",borderRadius:"99px",border:`1px solid ${isAvail?"#f59e0b30":"#334155"}`}}>{s.status||"Available"}</span>
      {canEdit&&<button onClick={()=>onToggle(s.id,s.status||"Available")} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 8px",color:"#475569",fontSize:"11px",cursor:"pointer"}}>{isAvail?"Mark Used":"Restore"}</button>}
      {canEdit&&<button onClick={()=>onDelete(s.id)} style={{background:"none",border:"none",color:"#334155",fontSize:"14px",cursor:"pointer"}}>🗑</button>}
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════════
// SETTINGS TAB (Admin only)
// ══════════════════════════════════════════════════════════
function SettingsTab({showToast, initialProducts, initialQcParams, initialPackSizes, initialCatUnits, initialUnits, initialPaintTypes, initialRmCats, onSaved}){
  const [subTab,setSubTab]=useState("products");
  const [saving,setSaving]=useState(false);
  const [prodData,setProdData]=useState(()=>JSON.parse(JSON.stringify(initialProducts||DEFAULT_PRODUCTS)));
  const [qcData,setQcData]=useState(()=>JSON.parse(JSON.stringify(initialQcParams||DEFAULT_QC_PARAMS)));
  const [packSizeData,setPackSizeData]=useState(()=>JSON.parse(JSON.stringify(initialPackSizes||DEFAULT_PACK_SIZES_BY_CAT)));
  const [catUnits,setCatUnits]=useState(()=>({...CATEGORY_UNITS,...(initialCatUnits||{})}));
  const [unitsData,setUnitsData]=useState(()=>[...(initialUnits||BATCH_UNITS)]);
  const [paintTypesData,setPaintTypesData]=useState(()=>[...(initialPaintTypes||PAINT_TYPES)]);
  const [rmCatsData,setRmCatsData]=useState(()=>[...(initialRmCats||RM_CATEGORIES)]);
  const [newUnit,setNewUnit]=useState("");
  const [newPaintType,setNewPaintType]=useState("");
  const [newRmCat,setNewRmCat]=useState("");
  const [newPackSize,setNewPackSize]=useState("");
  const [newPackQty,setNewPackQty]=useState("");
  const [selCat,setSelCat]=useState(Object.keys(initialProducts||DEFAULT_PRODUCTS)[0]);
  const [newProduct,setNewProduct]=useState("");
  const [newProductUnit,setNewProductUnit]=useState("L");
  const [newParam,setNewParam]=useState("");
  const [newCat,setNewCat]=useState("");
  const [newCatUnit,setNewCatUnit]=useState("L");

  const fileRef = useRef(null);
  const [importing,setImporting]=useState(false);
  const [exporting,setExporting]=useState(false);

  const exportExcel=async()=>{
    setExporting(true);
    try{
      const XLSX=window.XLSX;
      if(!XLSX){showToast("Excel library not loaded yet, try again","error");setExporting(false);return;}
      const wb=XLSX.utils.book_new();
      const cats=Object.keys(prodData);

      // ── Products sheet ──────────────────────────────
      const prodRows=[["CATEGORY","PRODUCT NAME","UNIT","HINT"]];
      cats.forEach(cat=>{
        (prodData[cat]||[]).forEach((p,i)=>{
          const name=gpn(p); const unit=gpu(p);
          prodRows.push([cat,name,unit,i===0?"← edit rows freely":""]);
        });
        prodRows.push(["","","",""]);// spacer
      });
      for(let i=0;i<5;i++)prodRows.push(["← Category","← Product name","← kg or L","← new"]);
      const wsProd=XLSX.utils.aoa_to_sheet(prodRows);
      wsProd["!cols"]=[{wch:26},{wch:44},{wch:10},{wch:18}];
      XLSX.utils.book_append_sheet(wb,wsProd,"🎨 Products");

      // ── QC Parameters sheet ─────────────────────────
      const qcRows=[["CATEGORY","QC PARAMETER","UNIT","MIN VALUE","MAX VALUE","HINT"]];
      cats.forEach(cat=>{
        (qcData[cat]||[]).forEach((p,i)=>{
          const parsed=typeof p==="string"?{name:p,unit:"",min:"",max:""}:p;
          qcRows.push([cat,parsed.name||"",parsed.unit||"",parsed.min||"",parsed.max||"",i===0?"← edit freely":""]);
        });
        qcRows.push(["","","","","",""]); // spacer
      });
      for(let i=0;i<5;i++)qcRows.push(["← Category","← Parameter name","← Unit e.g. KU","← Min","← Max","← add"]);
      const wsQC=XLSX.utils.aoa_to_sheet(qcRows);
      wsQC["!cols"]=[{wch:26},{wch:36},{wch:14},{wch:12},{wch:12},{wch:16}];
      XLSX.utils.book_append_sheet(wb,wsQC,"🔬 QC Parameters");

      // ── Units sheet ─────────────────────────────────
      const unitRows=[["CATEGORY","DEFAULT UNIT","ALLOWED UNITS"],["","","kg / L / MT / Bags"]];
      cats.forEach(cat=>{
        unitRows.push([cat,catUnits[cat]||"kg",""]);
      });
      const wsUnits=XLSX.utils.aoa_to_sheet(unitRows);
      wsUnits["!cols"]=[{wch:26},{wch:18},{wch:24}];
      XLSX.utils.book_append_sheet(wb,wsUnits,"⚖️ Category Units");

      // ── Remove Categories sheet ─────────────────────
      const remRows=[["CATEGORY NAME","REMOVE? (YES to delete)","NOTE"],
                     ["","","Leave blank to keep | Type YES to remove from Products & QC"]];
      cats.forEach(cat=>remRows.push([cat,"",""]));
      const wsRem=XLSX.utils.aoa_to_sheet(remRows);
      wsRem["!cols"]=[{wch:26},{wch:24},{wch:50}];
      XLSX.utils.book_append_sheet(wb,wsRem,"🗑 Remove Categories");

      // ── Pack Sizes sheet ────────────────────────────
      const packRows=[["CATEGORY","PACK SIZE LABEL","QTY PER PACK","HINT"]];
      const packCats=Object.keys(packSizeData).filter(k=>k!=="Other"&&k!=="_default");
      packCats.forEach(cat=>{
        (packSizeData[cat]||[]).forEach((ps,i)=>{
          const s=gps(ps);
          packRows.push([cat,s.size,s.qty||"",i===0?"← edit qty, add/delete rows":""]);
        });
        packRows.push(["","","",""]);
      });
      // Default sizes
      packRows.push(["_default (fallback for all categories)","","",""]);
      (packSizeData._default||DEFAULT_PACK_SIZES).forEach(ps=>{
        const s=gps(ps);
        packRows.push(["_default",s.size,s.qty||",",""]);
      });
      for(let i=0;i<3;i++)packRows.push(["← category","← label e.g. 4 L tin","← qty e.g. 4",""]);
      const wsPack=XLSX.utils.aoa_to_sheet(packRows);
      wsPack["!cols"]=[{wch:32},{wch:22},{wch:16},{wch:22}];
      XLSX.utils.book_append_sheet(wb,wsPack,"📦 Pack Sizes");
      const instrRows=[
        ["GCC Operations Hub — Products & QC Parameters Template"],
        ["Gujarat Colours & Coatings Pvt Ltd | Exported: "+new Date().toLocaleDateString("en-IN")],
        [""],
        ["SHEET","WHAT TO DO"],
        ["🎨 Products","Col A = Category, Col B = Product Name, Col C = Unit (kg/L/MT/Bags)."],
        ["🔬 QC Parameters","Col A = Category, Col B = Parameter, Col C = Min, Col D = Max."],
        ["📦 Pack Sizes","Col A = Category, Col B = Pack Size Label, Col C = Qty per Pack. This pre-fills the packing form."],
        ["⚖️ Category Units","Fallback unit per category."],
        ["🗑 Remove Categories","Type YES in column B to remove a category from Products & QC."],
        [""],
        ["RULES",""],
        ["• Do NOT rename the sheet tabs.",""],
        ["• Category names must match exactly across all sheets.",""],
        ["• For Unit column: only kg, L, MT, Bags are valid.",""],
      ];
      const wsInstr=XLSX.utils.aoa_to_sheet(instrRows);
      wsInstr["!cols"]=[{wch:36},{wch:60}];
      XLSX.utils.book_append_sheet(wb,wsInstr,"📋 Instructions");

      XLSX.writeFile(wb,"GCC_Products_QC_Template.xlsx");
      showToast("Excel exported ✓");
    }catch(err){showToast("Error exporting: "+err.message,"error");}
    setExporting(false);
  };

  const importExcel=async(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    setImporting(true);
    try{
      const XLSX=window.XLSX;
      if(!XLSX){showToast("Excel reader not loaded yet, try again","error");setImporting(false);return;}
      const buf=await file.arrayBuffer();
      const wb_=XLSX.read(buf,{type:"array"});

      // ── Step 1: Collect categories to remove ──────────────
      const toRemove=new Set();
      const remSheet=wb_.Sheets["🗑 Remove Categories"];
      if(remSheet){
        const rows=XLSX.utils.sheet_to_json(remSheet,{header:1,defval:""});
        for(let ri=5;ri<rows.length;ri++){
          const cat=(rows[ri][0]||"").toString().trim();
          const flag=(rows[ri][1]||"").toString().trim().toUpperCase();
          if(cat&&(flag==="YES"||flag==="Y"||flag==="✓"))toRemove.add(cat);
        }
      }

      // ── Step 2: Read Products (A=Category, B=Product, C=Unit) ──
      const newProds={};
      const prodSheet=wb_.Sheets["🎨 Products"];
      if(prodSheet){
        const rows=XLSX.utils.sheet_to_json(prodSheet,{header:1,defval:""});
        for(let ri=1;ri<rows.length;ri++){
          const cat=(rows[ri][0]||"").toString().trim();
          const prod=(rows[ri][1]||"").toString().trim();
          const unit=(rows[ri][2]||"").toString().trim()||"kg";
          if(!cat||!prod)continue;
          if(cat.startsWith("←")||prod.startsWith("←"))continue;
          if(toRemove.has(cat))continue;
          if(!newProds[cat])newProds[cat]=[];
          // Store as {name,unit} object
          if(!newProds[cat].some(p=>gpn(p)===prod))
            newProds[cat].push({name:prod,unit:["kg","L","MT","Bags"].includes(unit)?unit:"kg"});
        }
      }

      // ── Step 3: Read QC Params (2-column or 4-column: A=Category, B=Param, C=Min, D=Max) ──
      const newQc={};
      const qcSheet=wb_.Sheets["🔬 QC Parameters"];
      if(qcSheet){
        const rows=XLSX.utils.sheet_to_json(qcSheet,{header:1,defval:""});
        for(let ri=1;ri<rows.length;ri++){
          const cat=(rows[ri][0]||"").toString().trim();
          const param=(rows[ri][1]||"").toString().trim();
          if(!cat||!param)continue;
          if(cat.startsWith("←")||param.startsWith("←"))continue;
          if(toRemove.has(cat))continue;
          if(!newQc[cat])newQc[cat]=[];
          const min=(rows[ri][3]||"").toString().trim();
          const max=(rows[ri][4]||"").toString().trim();
          const unit=(rows[ri][2]||"").toString().trim();
          if(!newQc[cat].some(x=>(typeof x==="object"?x.name:x)===param))
            newQc[cat].push({name:param,unit,min,max});
        }
      }

      // ── Step 4: Read Units sheet ──────────────────────────
      const newUnits={};
      const unitsSheet=wb_.Sheets["⚖️ Category Units"];
      if(unitsSheet){
        const rows=XLSX.utils.sheet_to_json(unitsSheet,{header:1,defval:""});
        for(let ri=2;ri<rows.length;ri++){
          const cat=(rows[ri][0]||"").toString().trim();
          const unit=(rows[ri][1]||"").toString().trim();
          if(cat&&unit&&!toRemove.has(cat))newUnits[cat]=unit;
        }
      }

      // ── Step 5: Read Pack Sizes sheet ─────────────────
      const packSheet=wb_.Sheets["📦 Pack Sizes"];
      if(packSheet){
        const rows=XLSX.utils.sheet_to_json(packSheet,{header:1,defval:""});
        const newPack={};
        for(let ri=1;ri<rows.length;ri++){
          const cat=(rows[ri][0]||"").toString().trim();
          const size=(rows[ri][1]||"").toString().trim();
          const qty=(rows[ri][2]||"").toString().trim();
          if(!cat||!size||cat.startsWith("←"))continue;
          if(!newPack[cat])newPack[cat]=[];
          newPack[cat].push({size,qty});
        }
        if(Object.keys(newPack).length>0)setPackSizeData(p=>({...p,...newPack}));
      }

      if(Object.keys(newProds).length>0)setProdData(newProds);
      if(Object.keys(newQc).length>0)setQcData(newQc);
      if(Object.keys(newUnits).length>0)setCatUnits(u=>({...u,...newUnits}));

      const removedList=[...toRemove].join(", ");
      const msg=toRemove.size>0
        ?`Imported ✓ — ${Object.keys(newProds).length} categories loaded, ${toRemove.size} removed (${removedList}). Click 💾 Save All Settings.`
        :`Imported ✓ — ${Object.keys(newProds).length} categories, ${Object.values(newProds).reduce((s,a)=>s+a.length,0)} products loaded. Click 💾 Save All Settings.`;
      showToast(msg);
    }catch(err){showToast("Error reading file: "+err.message,"error");}
    setImporting(false);
    e.target.value="";
  };

  useEffect(()=>{
    // Load SheetJS if not already loaded
    if(!window.XLSX){
      const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      document.head.appendChild(s);
    }
  },[]);

  const saveAll=async()=>{
    setSaving(true);
    try{
      await C("settings").doc("products").set({products:prodData,qcParams:qcData,packSizes:packSizeData,catUnits,units:unitsData,paintTypes:paintTypesData,rmCategories:rmCatsData,updatedAt:ts()});
      if(onSaved)onSaved({products:prodData,qcParams:qcData,packSizes:packSizeData,catUnits,units:unitsData,paintTypes:paintTypesData,rmCategories:rmCatsData});
      showToast("Settings saved ✓");
    }catch(e){showToast("Error saving","error");}
    setSaving(false);
  };

  const addProduct=()=>{
    if(!newProduct.trim())return;
    const updated={...prodData,[selCat]:[...(prodData[selCat]||[]),{name:newProduct.trim(),unit:newProductUnit}]};
    setProdData(updated);setNewProduct("");setNewProductUnit("L");
  };
  const removeProduct=(cat,idx)=>{const arr=[...(prodData[cat]||[])];arr.splice(idx,1);setProdData({...prodData,[cat]:arr});};
  const addParam=()=>{
    if(!newParam.trim())return;
    const updated={...qcData,[selCat]:[...(qcData[selCat]||[]),newParam.trim()]};
    setQcData(updated);setNewParam("");
  };
  const removeParam=(cat,idx)=>{const arr=[...(qcData[cat]||[])];arr.splice(idx,1);setQcData({...qcData,[cat]:arr});};
  const addCategory=()=>{
    if(!newCat.trim())return;
    const catName=newCat.trim();
    if(!prodData[catName]){
      setProdData({...prodData,[catName]:[]});
      setQcData({...qcData,[catName]:[]});
      setCatUnits({...catUnits,[catName]:newCatUnit});
      setSelCat(catName);
    }
    setNewCat("");setNewCatUnit("L");
  };

  const cats=Object.keys(prodData);

  return <div>
    <SectionHead title="⚙️ System Settings"/>
    <div style={{display:"flex",gap:"4px",marginBottom:"20px",borderBottom:"1px solid #1e293b"}}>
      {[["products","🎨 Products"],["qcparams","🔬 QC Parameters"],["packsizes","📦 Pack Sizes"],["units","📏 Units"],["painttypes","🖌 Paint Types"],["rmcats","🧫 RM Categories"]].map(([key,label])=>(
        <button key={key} onClick={()=>setSubTab(key)} style={{background:subTab===key?"#1e293b":"transparent",border:"none",borderBottom:subTab===key?"2px solid #3b82f6":"2px solid transparent",color:subTab===key?"#f1f5f9":"#64748b",padding:"8px 16px",cursor:"pointer",fontSize:"13px",fontWeight:"600",borderRadius:"8px 8px 0 0",transition:"all 0.15s"}}>{label}</button>
      ))}
    </div>

    {/* Category selector + unit + add new category */}
    <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"10px",padding:"14px 16px",marginBottom:"16px"}}>
      <div style={{display:"flex",gap:"10px",alignItems:"flex-end",flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:"140px"}}>
          <Field label="Working Category">
            <select style={sl} value={selCat} onChange={e=>setSelCat(e.target.value)}>
              {cats.map(c=><option key={c}>{c}</option>)}
            </select>
          </Field>
        </div>
        <div style={{minWidth:"120px"}}>
          <Field label="Default Unit">
            <select style={{...sl,borderColor:catUnits[selCat]?"#22c55e30":"#1e293b"}} value={catUnits[selCat]||"kg"}
              onChange={e=>setCatUnits({...catUnits,[selCat]:e.target.value})}>
              {(unitsData||BATCH_UNITS).map(u=><option key={u}>{u}</option>)}
            </select>
          </Field>
        </div>
        <div style={{display:"flex",gap:"6px",paddingBottom:"14px",flex:2,minWidth:"240px"}}>
          <input style={{...inp,flex:1,padding:"8px 10px",fontSize:"12.5px"}} value={newCat}
            onChange={e=>setNewCat(e.target.value)} placeholder="New category name"/>
          <select style={{...sl,width:"80px",padding:"8px 6px",fontSize:"12.5px"}} value={newCatUnit}
            onChange={e=>setNewCatUnit(e.target.value)}>
            {(unitsData||BATCH_UNITS).map(u=><option key={u}>{u}</option>)}
          </select>
          <Btn label="+ Add" onClick={addCategory} color="#64748b" small/>
        </div>
      </div>
      {selCat&&<div style={{fontSize:"11px",color:"#334155",marginTop:"4px"}}>
        Unit for <strong style={{color:"#64748b"}}>{selCat}</strong> auto-fills as <strong style={{color:"#22c55e"}}>{catUnits[selCat]||"kg"}</strong> when issuing a batch. Change above to update.
      </div>}
    </div>

    {subTab==="products"&&<div>
      <InfoBox color="#3b82f6">Each product has its own unit. The unit auto-fills when the product is selected in batch issue. You can also set these via Excel export → edit → import.</InfoBox>
      {/* Add new product row */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 90px 60px",gap:"6px",marginBottom:"12px"}}>
        <input style={inp} value={newProduct} onChange={e=>setNewProduct(e.target.value)} placeholder={`Product name in ${selCat}…`} onKeyDown={e=>e.key==="Enter"&&addProduct()}/>
        <select style={sl} value={newProductUnit} onChange={e=>setNewProductUnit(e.target.value)}>
          {(unitsData||BATCH_UNITS).map(u=><option key={u}>{u}</option>)}
        </select>
        <Btn label="+ Add" onClick={addProduct} color="#3b82f6" small/>
      </div>
      {/* Column headers */}
      {(prodData[selCat]||[]).length>0&&<div style={{display:"grid",gridTemplateColumns:"1fr 90px 36px",gap:"6px",marginBottom:"4px",padding:"0 4px"}}>
        {["Product Name","Unit",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {(prodData[selCat]||[]).length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"12px 0"}}>No products in {selCat}. Add one above.</div>}
        {(prodData[selCat]||[]).map((p,i)=>{
          const name=gpn(p); const unit=gpu(p);
          return <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 90px 36px",gap:"6px",alignItems:"center"}}>
            <input style={sml} value={name} onChange={e=>{
              const arr=[...(prodData[selCat]||[])];
              arr[i]={name:e.target.value,unit};
              setProdData({...prodData,[selCat]:arr});
            }} placeholder="Product name"/>
            <select style={{...sml,padding:"6px 6px",borderColor:unit?"#22c55e30":"#1e293b"}} value={unit} onChange={e=>{
              const arr=[...(prodData[selCat]||[])];
              arr[i]={name,unit:e.target.value};
              setProdData({...prodData,[selCat]:arr});
            }}>
              {(unitsData||BATCH_UNITS).map(u=><option key={u}>{u}</option>)}
            </select>
            <button onClick={()=>removeProduct(selCat,i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px",textAlign:"center"}}>×</button>
          </div>;
        })}
      </div>
    </div>}

    {subTab==="qcparams"&&<div>
      <InfoBox color="#22c55e">Each QC parameter has a Name, Unit (e.g. KU, g/cc, %), Min and Max. Leave unit blank if not applicable. Min/Max trigger auto pass/fail.</InfoBox>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 36px",gap:"6px",marginBottom:"6px"}}>
        {["Parameter Name","Unit","Min","Max",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",padding:"0 4px"}}>{h}</div>)}
      </div>
      {(qcData[selCat]||[]).map((p,i)=>{
        const parsed=gp(p);
        const update=(field,val)=>{
          const arr=[...(qcData[selCat]||[])];
          arr[i]={...parsed,[field]:val};
          setQcData({...qcData,[selCat]:arr});
        };
        return <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 36px",gap:"6px",marginBottom:"6px"}}>
          <input style={sml} value={parsed.name} onChange={e=>update("name",e.target.value)} placeholder="Parameter name"/>
          <input style={{...sml,borderColor:parsed.unit?"#a855f730":"#1e293b"}} value={parsed.unit||""} onChange={e=>update("unit",e.target.value)} placeholder="e.g. KU"/>
          <input style={{...sml,borderColor:parsed.min?"#22c55e30":"#1e293b"}} value={parsed.min} onChange={e=>update("min",e.target.value)} placeholder="Min"/>
          <input style={{...sml,borderColor:parsed.max?"#ef444430":"#1e293b"}} value={parsed.max} onChange={e=>update("max",e.target.value)} placeholder="Max"/>
          <button onClick={()=>removeParam(selCat,i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px",padding:0,alignSelf:"center"}}>×</button>
        </div>;
      })}
      {(qcData[selCat]||[]).length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"10px 0"}}>No QC params for {selCat}.</div>}
      <button onClick={()=>{const arr=[...(qcData[selCat]||[]),{name:"",unit:"",min:"",max:""}];setQcData({...qcData,[selCat]:arr});}}
        style={{marginTop:"8px",background:"none",border:"1px dashed #1e293b",borderRadius:"7px",padding:"7px 14px",color:"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600",width:"100%"}}>
        + Add Parameter
      </button>
    </div>}


    {subTab==="packsizes"&&<div>
      <InfoBox color="#f59e0b">Set pack sizes and their fixed quantity per pack for each category. The quantity auto-fills in the packing form — you only need to enter number of packs filled.</InfoBox>
      {/* Add new pack size */}
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 60px",gap:"6px",marginBottom:"8px"}}>
        <input style={inp} value={newPackSize} onChange={e=>setNewPackSize(e.target.value)} placeholder={`Pack size label… e.g. 4 L tin, 25 kg`}/>
        <input style={inp} value={newPackQty} onChange={e=>setNewPackQty(e.target.value)} placeholder="Qty (e.g. 4, 25)"/>
        <Btn label="+ Add" onClick={()=>{
          if(newPackSize.trim()){
            const cat_arr=[...(packSizeData[selCat]||[]),{size:newPackSize.trim(),qty:newPackQty.trim()}];
            setPackSizeData({...packSizeData,[selCat]:cat_arr});
            setNewPackSize("");setNewPackQty("");
          }
        }} color="#f59e0b" small/>
      </div>
      {/* Column headers */}
      {(packSizeData[selCat]||[]).length>0&&<div style={{display:"grid",gridTemplateColumns:"2fr 1fr 120px 36px",gap:"6px",marginBottom:"4px",padding:"0 4px"}}>
        {["Pack Size Label","Qty per Pack","Order",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
      </div>}
      {(packSizeData[selCat]||[]).length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"10px 0"}}>
        No pack sizes for {selCat}. Default sizes will be used: {(packSizeData._default||DEFAULT_PACK_SIZES).map(p=>gps(p).size).join(", ")}
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {(packSizeData[selCat]||[]).map((ps,i)=>{
          const s=gps(ps);
          const update=(field,val)=>{
            const d=[...(packSizeData[selCat]||[])];
            d[i]={...s,[field]:val};
            setPackSizeData({...packSizeData,[selCat]:d});
          };
          return <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 120px 36px",gap:"6px",alignItems:"center"}}>
            <input style={sml} value={s.size} onChange={e=>update("size",e.target.value)} placeholder="e.g. 4 L tin"/>
            <input style={{...sml,borderColor:s.qty?"#22c55e30":"#f59e0b30",textAlign:"center"}} value={s.qty} onChange={e=>update("qty",e.target.value)} placeholder="qty"/>
            <div style={{display:"flex",gap:"4px"}}>
              {i>0&&<button onClick={()=>{const d=[...(packSizeData[selCat]||[])];[d[i-1],d[i]]=[d[i],d[i-1]];setPackSizeData({...packSizeData,[selCat]:d});}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"5px",color:"#64748b",cursor:"pointer",fontSize:"12px",padding:"2px 8px"}}>↑</button>}
              {i<(packSizeData[selCat]||[]).length-1&&<button onClick={()=>{const d=[...(packSizeData[selCat]||[])];[d[i],d[i+1]]=[d[i+1],d[i]];setPackSizeData({...packSizeData,[selCat]:d});}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"5px",color:"#64748b",cursor:"pointer",fontSize:"12px",padding:"2px 8px"}}>↓</button>}
            </div>
            <button onClick={()=>{const d=(packSizeData[selCat]||[]).filter((_,idx)=>idx!==i);setPackSizeData({...packSizeData,[selCat]:d});}} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px",textAlign:"center"}}>×</button>
          </div>;
        })}
      </div>
    </div>}

    {subTab==="units"&&<div>
      <InfoBox color="#38bdf8">Manage the unit options (kg, L, MT, etc.) that appear in product unit, pack size, and batch size fields across the app. These are your company's standard units.</InfoBox>
      <div style={{display:"flex",gap:"6px",marginBottom:"12px"}}>
        <input style={{...inp,flex:1}} value={newUnit} onChange={e=>setNewUnit(e.target.value)}
          placeholder="Add unit… e.g. Litre, Drum, Pail, 5 gal"
          onKeyDown={e=>{if(e.key==="Enter"&&newUnit.trim()&&!unitsData.includes(newUnit.trim())){setUnitsData(u=>[...u,newUnit.trim()]);setNewUnit("");}}}/>
        <Btn label="+ Add" onClick={()=>{
          if(newUnit.trim()&&!unitsData.includes(newUnit.trim())){setUnitsData(u=>[...u,newUnit.trim()]);setNewUnit("");}
        }} color="#38bdf8" small/>
      </div>
      {unitsData.length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"10px 0"}}>No units defined. Add some above.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {unitsData.map((u,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0f172a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 14px"}}>
            <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
              <span style={{fontSize:"11px",fontWeight:"700",color:"#38bdf8",background:"#38bdf818",padding:"2px 8px",borderRadius:"99px",border:"1px solid #38bdf830"}}>#{i+1}</span>
              <span style={{fontSize:"13px",color:"#e2e8f0",fontWeight:"500"}}>{u}</span>
            </div>
            <button onClick={()=>{
              if(unitsData.length<=1){showToast("Must keep at least one unit","error");return;}
              setUnitsData(unitsData.filter((_,idx)=>idx!==i));
            }} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px"}}>×</button>
          </div>
        ))}
      </div>
      <div style={{marginTop:"10px",fontSize:"12px",color:"#334155"}}>
        These units appear in: Product unit dropdown, Pack size qty, Batch size, Old/Rejected material. Changes apply after 💾 Save All Settings.
      </div>
    </div>}
    {subTab==="painttypes"&&<div>
      <InfoBox color="#e879f9">Manage paint types used in R&amp;D Projects. Appear in the Paint Type dropdown when creating or editing a project.</InfoBox>
      <div style={{display:"flex",gap:"6px",marginBottom:"12px"}}>
        <input style={{...inp,flex:1}} value={newPaintType} onChange={e=>setNewPaintType(e.target.value)}
          placeholder="Add paint type… e.g. Waterproofing, Cement Paint"
          onKeyDown={e=>{if(e.key==="Enter"&&newPaintType.trim()&&!paintTypesData.includes(newPaintType.trim())){setPaintTypesData(d=>[...d,newPaintType.trim()]);setNewPaintType("");}}}/>
        <Btn label="+ Add" onClick={()=>{if(newPaintType.trim()&&!paintTypesData.includes(newPaintType.trim())){setPaintTypesData(d=>[...d,newPaintType.trim()]);setNewPaintType("");}}} color="#e879f9" small/>
      </div>
      {paintTypesData.length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"10px 0"}}>No paint types.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {paintTypesData.map((t,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0f172a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 14px"}}>
            <span style={{fontSize:"13px",color:"#e2e8f0"}}>{t}</span>
            <button onClick={()=>{if(paintTypesData.length<=1){showToast("Must keep at least one","error");return;}setPaintTypesData(paintTypesData.filter((_,j)=>j!==i));}}
              style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px"}}>×</button>
          </div>
        ))}
      </div>
    </div>}

    {subTab==="rmcats"&&<div>
      <InfoBox color="#f97316">Manage raw material categories used in RM Tests. Appear in the Category dropdown when adding an RM test entry.</InfoBox>
      <div style={{display:"flex",gap:"6px",marginBottom:"12px"}}>
        <input style={{...inp,flex:1}} value={newRmCat} onChange={e=>setNewRmCat(e.target.value)}
          placeholder="Add RM category… e.g. Catalyst, Hardener, Thixotrope"
          onKeyDown={e=>{if(e.key==="Enter"&&newRmCat.trim()&&!rmCatsData.includes(newRmCat.trim())){setRmCatsData(d=>[...d,newRmCat.trim()]);setNewRmCat("");}}}/>
        <Btn label="+ Add" onClick={()=>{if(newRmCat.trim()&&!rmCatsData.includes(newRmCat.trim())){setRmCatsData(d=>[...d,newRmCat.trim()]);setNewRmCat("");}}} color="#f97316" small/>
      </div>
      {rmCatsData.length===0&&<div style={{fontSize:"13px",color:"#334155",fontStyle:"italic",padding:"10px 0"}}>No RM categories.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {rmCatsData.map((c,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0f172a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 14px"}}>
            <span style={{fontSize:"13px",color:"#e2e8f0"}}>{c}</span>
            <button onClick={()=>{if(rmCatsData.length<=1){showToast("Must keep at least one","error");return;}setRmCatsData(rmCatsData.filter((_,j)=>j!==i));}}
              style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"16px"}}>×</button>
          </div>
        ))}
      </div>
    </div>}

    <div style={{marginTop:"20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"10px"}}>
      <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
        <input ref={fileRef} type="file" accept=".xlsx" onChange={importExcel} style={{display:"none"}}/>
        <Btn label={importing?"Reading…":"📥 Import from Excel"} onClick={()=>fileRef.current?.click()} disabled={importing} color="#64748b" small/>
        <Btn label={exporting?"Exporting…":"📤 Export to Excel"} onClick={exportExcel} disabled={exporting} color="#475569" small/>
        <span style={{fontSize:"11px",color:"#334155"}}>Export → edit → import back</span>
      </div>
      <Btn label={saving?"Saving…":"💾 Save All Settings"} onClick={saveAll} disabled={saving} color="#3b82f6"/>
    </div>
  </div>;
}

// LOGIN SCREEN

function LoginScreen(){
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);
  const handleLogin=async(e)=>{
    e.preventDefault();setLoading(true);setError("");
    try{await auth.signInWithEmailAndPassword(email,password);}
    catch(err){setError(err.code==="auth/wrong-password"||err.code==="auth/user-not-found"||err.code==="auth/invalid-credential"?"Invalid email or password.":err.message);}
    setLoading(false);
  };
  return <div style={{minHeight:"100vh",background:"#060b16",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
    <div style={{width:"100%",maxWidth:"380px"}}>
      <div style={{textAlign:"center",marginBottom:"28px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#3b82f6",letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:"8px"}}>Gujarat Colours & Coatings Pvt Ltd</div>
        <h1 style={{fontSize:"30px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9",margin:0}}>GCC <span style={{fontStyle:"italic",color:"#3b82f6"}}>Operations Hub</span></h1>
        <p style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>Sign in to your workspace</p>
      </div>
      <form onSubmit={handleLogin} style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:"16px",padding:"28px",boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>
        <div style={{marginBottom:"14px"}}>
          <label style={{display:"block",fontSize:"11px",fontWeight:"600",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>Email / Login</label>
          <input type="text" value={email} onChange={e=>setEmail(e.target.value)} placeholder="email@company.com or name@gcc-hub.app" required style={inp} autoComplete="email"/>
          <div style={{fontSize:"10px",color:"#334155",marginTop:"4px"}}>Use your email address or the login provided by Admin</div>
        </div>
        <div style={{marginBottom:"20px"}}>
          <label style={{display:"block",fontSize:"11px",fontWeight:"600",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>Password</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" required style={inp} autoComplete="current-password"/>
        </div>
        {error&&<div style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"8px",padding:"10px 14px",color:"#fca5a5",fontSize:"13px",marginBottom:"14px"}}>{error}</div>}
        <button type="submit" disabled={loading} style={{width:"100%",background:"#3b82f6",border:"none",borderRadius:"10px",padding:"12px",color:"#fff",fontWeight:"700",fontSize:"14px",opacity:loading?0.7:1,transition:"opacity 0.2s"}}>
          {loading?"Signing in…":"Sign In →"}
        </button>
      </form>
    </div>
  </div>;
}

function NoAccessScreen(){
  return <div style={{minHeight:"100vh",background:"#060b16",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px",flexDirection:"column",gap:"12px"}}>
    <div style={{fontSize:"40px"}}>🔒</div>
    <div style={{fontSize:"16px",fontWeight:"600",color:"#f1f5f9"}}>Access Pending</div>
