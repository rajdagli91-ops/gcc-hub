input,select,textarea{width:100%;background:#0b1220;border:1px solid #1e293b;border-radius:8px;padding:9px 12px;color:#e2e8f0;font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box}

  .print-report *{color:#000!important;background:#fff!important;border-color:#999!important;font-family:Arial,sans-serif!important;font-size:8.5pt!important}
  .print-report .pr-co{font-size:11pt!important;font-weight:bold!important}
  .print-report .pr-title{font-size:9pt!important;color:#444!important}
  .print-report .pr-section-title{font-size:8pt!important;font-weight:bold!important;border-bottom:1px solid #000!important;padding-bottom:2px!important;margin:5px 0 3px!important;text-transform:uppercase!important;letter-spacing:0.05em!important}
  .print-report .pr-pass{color:#166534!important;font-weight:bold!important}
  .print-report .pr-fail{color:#991b1b!important;font-weight:bold!important}
  .print-report .pr-result{font-size:10pt!important;font-weight:bold!important}
  .print-report table{width:100%;border-collapse:collapse}
  .print-report td,.print-report th{border:1px solid #bbb;padding:2px 5px;font-size:8pt}
  .print-report th{background:#eee!important;font-weight:bold!important;text-align:left}
  .print-report .pr-info td{border:none!important;padding:1px 4px}
  .print-report .pr-info td:first-child{font-weight:bold;width:32%;color:#333!important}
  /* Two reports side by side on one A4 sheet */
  .print-report{width:50%;float:left;box-sizing:border-box;padding:4mm}
  /* Force portrait A4 for all printing from this app */
  @page{size:210mm 297mm portrait;margin:8mm}
  @page :first{size:210mm 297mm portrait}
}

  var stack=err&&err.stack?err.stack:'(no stack)';
  // Extract lines with gcc-hub to find the exact source line
  var gccLines=stack.split('\n').filter(function(l){return l.includes('gcc-hub')||l.includes('eval')||l.includes('<anonymous>');}).slice(0,6).join('\n');
  document.getElementById('root').innerHTML=

    +'<div style="font-size:10px;color:#475569;max-width:700px;white-space:pre-wrap;text-align:left;max-height:200px;overflow:auto">'+stack.replace(/</g,"&lt;").slice(0,2000)+'</div>'

<script>
// Print production sheet — extracted from Babel to avoid large template literal issues
// Print production sheet — opens in new window, auto-prints
function printProductionSheet(bom, batchSize, batchNo, millNo, fillingDate, chargingDate, packSizes, issueDate, extraConfig, sysQcParams, oldStocks, viewOnly){
  const bs=parseFloat(batchSize)||parseFloat(bom.baseBatchSize)||100;
  const base=parseFloat(bom.baseBatchSize)||100;
  const factor=bs/base;

  // ── Resolve QC params + pack sizes FIRST, so their row counts can drive right-column sizing ──
  const _qcRaw=bom.qcTests||{};
  var productQcParams=Array.isArray(_qcRaw)?_qcRaw:[];
  if(!productQcParams.length&&sysQcParams&&bom.category&&sysQcParams[bom.category]){
    productQcParams=(sysQcParams[bom.category]||[]).map(function(p){return typeof p==='string'?{name:p,standard:''}:{name:p.name||'',standard:''};});
  }
  const qcParams=productQcParams.length?productQcParams:[
      {name:"SD (Drying)",standard:_qcRaw.sd||""},{name:"TF (Drying)",standard:_qcRaw.tf||""},
      {name:"HD (Drying)",standard:_qcRaw.hd||""},{name:"Colour",standard:_qcRaw.colour||""},
      {name:"Finish",standard:_qcRaw.finish||""},{name:"Viscosity",standard:_qcRaw.viscosity||""},
      {name:"Specific Gravity",standard:_qcRaw.sg||""}
    ].filter(p=>p.standard);
  var catPackSizes=[];
  if(packSizes&&bom.category&&packSizes[bom.category]){
    catPackSizes=(packSizes[bom.category]||[]).map(function(p){
      return typeof p==='string'?p:(p.size||p.label||String(p));
    }).filter(Boolean);
  }

  // ── Auto-fit density: scale font size & padding based on content length,
  // so the sheet always fits a single A4 page regardless of ingredient/QC/packing count.
  // LEFT (ingredient table) and RIGHT (QC+Packing) are sized INDEPENDENTLY, since one
  // can be long while the other is short — e.g. 5 ingredients but 10 pack sizes. ──
  const allIngRows=(bom.ingredients||[]);
  const ingCount=allIngRows.filter(i=>!i.isProcess).length;
  const stepCount=allIngRows.filter(i=>i.isProcess).length;
  const extraItemCount=(extraConfig?.items||['Dhoyela','Extra Output','Dhoyela']).length;
  const oldStockCount=(oldStocks||[]).length;
  const leftWeight=ingCount+stepCount+extraItemCount+(oldStockCount>0?oldStockCount+1:0);
  // Right column weight: QC header+subheader(2) + each QC row + Packing header+subheader(2) + each pack row
  const rightWeight=4+qcParams.length+(catPackSizes.length||3);

  const TIERS=[
    {rowPad:7,fontSz:11,addlMatRows:3,extraPad:8,extraBlanks:0,qcPad:7,qcFont:11,packPad:7,packFont:10,bodyPad:5,coNameSz:18,sheetTitleSz:15,batchNoSz:18},
    {rowPad:6,fontSz:10.5,addlMatRows:3,extraPad:7,extraBlanks:0,qcPad:6,qcFont:10.5,packPad:6,packFont:9.5,bodyPad:4,coNameSz:17,sheetTitleSz:14,batchNoSz:17},
    {rowPad:5,fontSz:10,addlMatRows:2,extraPad:6,extraBlanks:0,qcPad:5,qcFont:10,packPad:5,packFont:9,bodyPad:3,coNameSz:16,sheetTitleSz:13.5,batchNoSz:16},
    {rowPad:4,fontSz:9.5,addlMatRows:1,extraPad:5,extraBlanks:0,qcPad:4,qcFont:9.5,packPad:4,packFont:8.5,bodyPad:2,coNameSz:15,sheetTitleSz:13,batchNoSz:15},
    {rowPad:3,fontSz:9,addlMatRows:1,extraPad:4,extraBlanks:0,qcPad:3,qcFont:9,packPad:3,packFont:8,bodyPad:2,coNameSz:14,sheetTitleSz:12,batchNoSz:14},
    {rowPad:2,fontSz:8.5,addlMatRows:0,extraPad:3,extraBlanks:0,qcPad:2,qcFont:8.5,packPad:2,packFont:7.5,bodyPad:1,coNameSz:13,sheetTitleSz:11,batchNoSz:13},
    {rowPad:1.5,fontSz:8,addlMatRows:0,extraPad:2,extraBlanks:0,qcPad:1.5,qcFont:8,packPad:1.5,packFont:7,bodyPad:1,coNameSz:12,sheetTitleSz:10,batchNoSz:12},
    {rowPad:1,fontSz:7.5,addlMatRows:0,extraPad:1.5,extraBlanks:0,qcPad:1,qcFont:7.5,packPad:1,packFont:6.5,bodyPad:1,coNameSz:11,sheetTitleSz:9.5,batchNoSz:11},
  ];
  const tierIdxFor=(weight)=>{
    const thresholds=[10,14,18,22,27,33,40]; // weight ceilings per tier (last tier has no ceiling)
    for(let i=0;i<thresholds.length;i++)if(weight<=thresholds[i])return i;
    return TIERS.length-1;
  };
  const leftIdx=tierIdxFor(leftWeight);
  const rightIdx=tierIdxFor(rightWeight);
  const overallIdx=Math.max(leftIdx,rightIdx); // page-level chrome (header sizes, margins) follows whichever side is denser
  const DL=TIERS[leftIdx];   // drives ingredient table row sizing
  const DR=TIERS[rightIdx];  // drives QC + Packing row sizing
  const D=TIERS[overallIdx]; // drives shared page chrome (body padding, header/title/batch-no font sizes, addlMatRows, extra additions)
  let ingRows="";
  let rowNo=0;
  (bom.ingredients||[]).forEach(ing=>{
    if(ing.isProcess){
      ingRows+=`<tr style="background:#f0f0f0"><td colspan="5" style="padding:${DL.rowPad}pt 6pt;font-style:italic;font-weight:600;font-size:${DL.fontSz}pt;border:1px solid #999">${ing.name||""}</td></tr>`;
    }else{
      rowNo++;
      const stdQty=parseFloat(ing.standardQty)||0;
      const currQty=(stdQty*factor).toFixed(3).replace(/\.?0+$/,"");
      const ingUnit=ing.unit||bom.baseUnit;
      const unitSuffix=ingUnit!==bom.baseUnit?` <span style="color:#b45309;font-weight:700">${ingUnit}</span>`:` <span style="color:#999">${ingUnit}</span>`;
      const nameDisplay=ing.name+(ing.desc?` (${ing.desc})`:"");
      ingRows+=`<tr>
        <td style="border:1px solid #999;padding:${DL.rowPad}pt 5pt;text-align:center;font-size:${DL.fontSz}pt">${rowNo}</td>
        <td style="border:1px solid #999;padding:${DL.rowPad}pt 5pt;font-size:${DL.fontSz}pt">${nameDisplay}</td>
        <td style="border:1px solid #999;padding:${DL.rowPad}pt 5pt;text-align:center;font-size:${DL.fontSz}pt">${stdQty?stdQty+unitSuffix:""}</td>
        <td style="border:1px solid #999;padding:${DL.rowPad}pt 5pt;text-align:center;font-size:${DL.fontSz}pt">${currQty?currQty+unitSuffix:""}</td>
        <td style="border:1px solid #999;padding:${DL.rowPad}pt 5pt;text-align:center;font-size:${DL.fontSz}pt"></td>
      </tr>`;
    }
  });
  // Total row — sums all ingredients regardless of unit
  const totalStd=(bom.ingredients||[]).filter(i=>!i.isProcess).reduce((s,i)=>s+(parseFloat(i.standardQty)||0),0);
  const totalCurr=(totalStd*factor).toFixed(3).replace(/\.?0+$/,"");
  var packRows=catPackSizes.length
    ?catPackSizes.map(function(s){return '<tr><td style="border:1px solid #999;padding:'+DR.packPad+'pt 6pt;font-size:'+DR.packFont+'pt">'+s+'</td><td colspan="2" style="border:1px solid #999;padding:'+DR.packPad+'pt 6pt;min-width:60pt">&nbsp;</td></tr>';}).join("")
    :'<tr><td style="border:1px solid #999;padding:'+DR.packPad+'pt 6pt">&nbsp;</td><td colspan="2" style="border:1px solid #999;padding:'+DR.packPad+'pt 6pt">&nbsp;</td></tr><tr><td style="border:1px solid #999;padding:'+DR.packPad+'pt 6pt">&nbsp;</td><td colspan="2" style="border:1px solid #999;padding:'+DR.packPad+'pt 6pt">&nbsp;</td></tr><tr><td style="border:1px solid #999;padding:'+DR.packPad+'pt 6pt">&nbsp;</td><td colspan="2" style="border:1px solid #999;padding:'+DR.packPad+'pt 6pt">&nbsp;</td></tr>';
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production Sheet — ${bom.productName}</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:Arial,sans-serif;margin:0;padding:${D.bodyPad}pt 10pt ${D.bodyPad}pt 25mm;font-size:11pt;}
  .header-table{width:100%;border-collapse:collapse;margin-bottom:8pt;}
  .header-table td{padding:3pt 5pt;font-size:10pt;}
  .co-name{font-size:18pt;font-weight:800;letter-spacing:1px;}
  .sheet-title{font-size:15pt;font-weight:700;text-align:center;}
  .prod-name{font-size:12pt;font-weight:700;border:1px solid #000;padding:5pt 8pt;margin-bottom:6pt;}
  .main-table{width:100%;border-collapse:collapse;margin-bottom:6pt;}
  .main-table th{border:1px solid #000;padding:6pt 4pt;background:#d0d0d0;font-size:10pt;text-align:center;}
  .main-table td{border:1px solid #999;padding:7pt 5pt;font-size:11pt;min-height:22pt;}
  .right-table{width:100%;border-collapse:collapse;font-size:11pt;}
  .right-table td{border:1px solid #999;padding:5pt 6pt;}
  .section-head{font-weight:700;background:#e0e0e0;padding:3pt 5pt;font-size:10pt;text-transform:uppercase;}
  .footer-row{display:flex;justify-content:space-between;margin-top:12pt;font-size:11pt;}
  @page{size:210mm 297mm portrait;margin:${Math.max(4,D.bodyPad)}mm 8mm 3mm 8mm;}
  @media print{
    body{padding:${D.bodyPad}pt 8pt 2pt 25mm!important;}
    .main-table tr,.right-table tr,.header-table tr{page-break-inside:avoid;}
  }
</style>
</head>
<body>
<table class="header-table">
  <tr>
    <td style="width:28%"><span class="co-name" style="font-size:${D.coNameSz}pt">VEEBEE</span><br><span style="font-size:8pt">G.C.C/7.2.1/F/03</span></td>
    <td style="width:32%;text-align:center"><span class="sheet-title" style="font-size:${D.sheetTitleSz}pt">PRODUCTION SHEET</span></td>
    <td style="width:40%;text-align:right;font-size:8pt;line-height:1.35">
      <span style="white-space:nowrap"><b>MILL NO:</b> _________</span><br>
      <span style="white-space:nowrap"><b>CHARGING DATE:</b> __________</span><br>
      <span style="white-space:nowrap"><b>FILLING DATE:</b> __________</span>
    </td>
  </tr>
</table>
<!-- Batch No + Issue Date — prominent bar -->
<table style="width:100%;border-collapse:collapse;margin-bottom:6pt;border:2px solid #000;">
  <tr>
    <td style="padding:6pt 10pt;width:55%;border-right:2px solid #000;">
      <span style="font-size:8pt;font-weight:700;text-transform:uppercase;color:#444;">Batch No</span><br>
      <span style="font-size:${D.batchNoSz}pt;font-weight:900;letter-spacing:2px;">${batchNo||"____________"}</span>
    </td>
    <td style="padding:6pt 10pt;width:45%;">
      <span style="font-size:8pt;font-weight:700;text-transform:uppercase;color:#444;">Issue Date</span><br>
      <span style="font-size:14pt;font-weight:700;">${issueDate||"____________"}</span>
    </td>
  </tr>
</table>
<div class="prod-name">PRODUCT NAME: ${bom.productName||""} &nbsp;&nbsp;&nbsp; B.SIZE: ${bs} ${bom.baseUnit||"L"}</div>
<table style="width:100%;border-collapse:collapse">
  <tr>
    <td style="width:60%;vertical-align:top">
      <table class="main-table" style="width:100%">
        <thead>
          <tr>
            <th style="width:5%">NO</th>
            <th style="width:27%">INGREDIENTS</th>
            <th style="width:14%">STANDARD QTY</th>
            <th style="width:14%">CURRENT QTY</th>
            <th style="width:28%">ACTUAL QTY</th>
          </tr>
        </thead>
        <tbody>
          ${ingRows}
          <tr style="font-weight:700;background:#f5f5f5">
            <td colspan="2" style="border:1px solid #999;padding:7pt 5pt;text-align:center;font-size:11pt">TOTAL</td>
            <td style="border:1px solid #999;padding:7pt 5pt;text-align:center;font-size:11pt">${totalStd.toFixed(3).replace(/\.?0+$/,"")}</td>
            <td style="border:1px solid #999;padding:7pt 5pt;text-align:center;font-size:11pt">${totalCurr}</td>
            <td style="border:1px solid #999;padding:7pt 5pt"></td>
          </tr>
          <tr><td colspan="5" style="border:1px solid #999;padding:3pt 6pt;font-size:9pt;font-style:italic;font-weight:600;background:#fff3cd">Additional Materials (if any)</td></tr>
          ${Array.from({length:D.addlMatRows}).map(()=>`<tr><td style="border:1px solid #999;padding:${D.rowPad+6}pt 5pt"></td><td style="border:1px solid #999;padding:${D.rowPad+6}pt 5pt"></td><td style="border:1px solid #999;padding:${D.rowPad+6}pt 5pt"></td><td style="border:1px solid #999;padding:${D.rowPad+6}pt 5pt"></td><td style="border:1px solid #999;padding:${D.rowPad+6}pt 5pt"></td></tr>`).join("")}
          <tr><td colspan="5" style="border:1px solid #999;padding:3px 5px;font-size:10px;font-style:italic;font-weight:600;background:#f5f5f5">EXTRA ADDITIONS</td></tr>
          ${(function(){
            var cfg=extraConfig||{};
            var rows='';
            var normalStyle='border:1px solid #999;padding:'+D.extraPad+'px 5px;font-size:11px;font-style:italic';
            var highlightStyle='border:1px solid #999;padding:'+(D.extraPad-1)+'px 5px;font-size:11px;font-style:italic;font-weight:700;background:#f0f0f0';
            var blankCell='<td style="border:1px solid #999;padding:'+D.extraPad+'px 5px"></td>';
            var items=cfg.items||['Dhoyela','Extra Output','Dhoyela'];
            items.forEach(function(label){
              var isHighlight=label==='Extra Output'||label.toLowerCase().includes('extra output');
              var style=isHighlight?highlightStyle:normalStyle;
              rows+='<tr><td colspan="4" style="'+style+'">'+label+'</td>'+blankCell+'</tr>';
            });
            var blanks=0;
            for(var i=0;i<blanks;i++) rows+='<tr><td colspan="4" style="'+normalStyle+'">&nbsp;</td>'+blankCell+'</tr>';
            return rows;
          })()}
          ${(function(){
            var stocks=oldStocks||[];
            if(!stocks.length) return '';
            var rows='<tr><td colspan="5" style="border:2px solid #b45309;padding:3pt 6pt;font-size:8pt;font-weight:800;background:#fef3c7;color:#92400e;text-transform:uppercase;letter-spacing:0.04em">⚠ Old / Rejected Material Available — Use First</td></tr>';
            stocks.forEach(function(s){
              rows+='<tr style="background:#fffbeb">'
                +'<td colspan="2" style="border:1px solid #d97706;padding:5pt 6pt;font-size:9pt;font-weight:600;color:#92400e">'+s.productName+(s.notes?' ('+s.notes+')':'')+'</td>'
                +'<td style="border:1px solid #d97706;padding:5pt 6pt;font-size:9pt;text-align:center;color:#92400e">'+s.qty+' '+(s.unit||'')+'</td>'
                +'<td colspan="2" style="border:1px solid #d97706;padding:5pt 6pt;font-size:8pt;color:#b45309"></td>'
                +'</tr>';
            });
            return rows;
          })()}
        </tbody>
      </table>
    </td>
    <td style="width:3%"></td>
    <td style="width:37%;vertical-align:top">
      <table class="right-table" style="width:100%">
        <colgroup><col style="width:40%"><col style="width:27%"><col style="width:33%"></colgroup>
        <tr><td style="font-size:9pt;padding:3pt 6pt;white-space:nowrap">Charging Date</td><td colspan="2" style="padding:3pt 6pt"></td></tr>
        <tr><td style="font-size:9pt;padding:3pt 6pt;white-space:nowrap">Charging Time</td><td colspan="2" style="padding:3pt 6pt"></td></tr>
        <tr><td style="font-size:9pt;padding:3pt 6pt;white-space:nowrap">Discharge Date</td><td colspan="2" style="padding:3pt 6pt"></td></tr>
        <tr><td style="font-size:9pt;padding:3pt 6pt;white-space:nowrap">Discharge Time</td><td colspan="2" style="padding:3pt 6pt"></td></tr>
        <tr><td colspan="3" class="section-head" style="margin-top:4px;font-size:12pt;padding:5pt 6pt">Test Parameters</td></tr>
        <tr>
          <th style="border:1px solid #999;padding:7px 6px;background:#d0d0d0;font-size:12px">Parameter</th>
          <th style="border:1px solid #999;padding:7px 6px;background:#d0d0d0;font-size:12px">Standard</th>
          <th style="border:1px solid #999;padding:7px 6px;background:#d0d0d0;font-size:12px">Actual Value</th>
        </tr>
        ${qcParams.length
          ?qcParams.map(p=>`<tr>
            <td style="border:1px solid #999;padding:${DR.qcPad}px 6px;font-size:${DR.qcFont+2}px">${p.name||""}</td>
            <td style="border:1px solid #999;padding:${DR.qcPad}px 6px;font-size:${DR.qcFont+2}px;text-align:center;font-weight:600">${p.standard||""}</td>

function printTrialComparison(trials,project,qcParams){
  if(!trials||trials.length===0)return;
  var s=trials.slice(0,8),n=s.length;
  var seen={},allMats=[];
  s.forEach(function(t){(t.ingredients||[]).forEach(function(r){
    if(r.material&&r.material.trim()&&!seen[r.material.trim()]){seen[r.material.trim()]=true;allMats.push(r.material.trim());}
  });});
  function mkth(txt){return '<th style="border:1px solid #000;padding:4pt 3pt;background:#e8e8e8;font-size:8.5pt;text-align:center">'+txt+'</th>';}
  function mktd(txt){return '<td style="border:1px solid #000;padding:3pt 4pt;text-align:center;font-size:9pt">'+txt+'</td>';}
  var hdrs=s.map(function(t,i){return mkth(t.trialName||('Trial '+(i+1)));}).join('');
  var shd=s.map(function(t,i){return '<th style="border:1px solid #000;padding:4pt;background:#e8e8e8;text-align:center;font-size:8.5pt">'+(t.trialName||('Trial '+(i+1)))+'</th>';}).join('');
  var ingRows=allMats.map(function(mat,ri){
    var cells=s.map(function(t){
      var ing=(t.ingredients||[]).filter(function(r){return r.material&&r.material.trim()===mat;})[0];
      return mktd(ing?(ing.quantity||'')+(ing.unit?' '+ing.unit:''):'');
    }).join('');
    return '<tr style="background:'+(ri%2===0?'#fff':'#f9f9f9')+'"><td style="border:1px solid #000;padding:3pt 5pt;font-size:9pt">'+(ri+1)+'. '+mat+'</td>'+cells+'</tr>';
  }).join('');
  var totRow='<tr style="background:#f0f0f0"><td style="border:1px solid #000;padding:4pt 5pt;font-weight:700">TOTAL BATCH</td>'+s.map(function(t){var tot=(t.ingredients||[]).reduce(function(a,r){return a+(parseFloat(r.quantity)||0);},0);return mktd(tot>0?tot.toFixed(2):'');}).join('')+'</tr>';
  var params=qcParams&&qcParams.length?qcParams:['Viscosity','Fineness','Sp. Gravity','pH','Non-Volatile %','Drying Time','Gloss','Adhesion','Flexibility','Appearance'];
  var qcRows=params.map(function(p,ri){return '<tr style="background:'+(ri%2===0?'#fff':'#f9f9f9')+'"><td style="border:1px solid #000;padding:4pt 5pt;white-space:nowrap">'+(ri+1)+'. '+p+'</td>'+s.map(function(){return '<td style="border:1px solid #000;padding:12pt 4pt"> </td>';}).join('')+'</tr>';}).join('');
  var dt=(s[0]&&s[0].date)||(new Date().toISOString().slice(0,10));
  var pn=(project&&(project.projectName||project.name||project.productName))||'R&D';
  var css='*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:3pt 5pt;font-size:9pt}@page{size:297mm 210mm landscape;margin:5mm}table{border-collapse:collapse;width:100%}.sh{border-bottom:2px solid #000;font-weight:700;padding:3pt 6pt;font-size:9pt;text-transform:uppercase}tr{page-break-inside:avoid}';
  var h='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Trial Comparison<'+'/title><style>'+css+'<'+'/style><'+'/head><body>';
  h+='<table style="margin-bottom:2pt"><tr><td><b style="font-size:13pt">VEEBEE<'+'/b><'+'/td><td style="text-align:right;font-size:10pt;font-weight:700">R&amp;D TRIAL COMPARISON SHEET<'+'/td><'+'/tr><'+'/table>';
  h+='<div style="border:2px solid #000;padding:5pt 10pt;margin-bottom:3pt"><span style="font-size:7.5pt;font-weight:normal">PROJECT</span><br><b style="font-size:15pt;letter-spacing:0.01em">'+pn+'</b></div>';
  h+='<table style="border:1px solid #000;margin-bottom:3pt"><tr>';
  h+='<td style="padding:3pt 7pt;border-right:1px solid #000;width:35%"><span style="font-size:7pt">DATE:<'+'/span> <b>'+dt+'<'+'/b><'+'/td>';
  h+='<td style="padding:3pt 7pt"><span style="font-size:7pt">SAMPLES:<'+'/span> <b>'+n+'<'+'/b><'+'/td><'+'/tr><'+'/table>';
  h+='<table style="margin-bottom:4pt"><tr><td colspan="'+(n+1)+'" class="sh">FORMULATION COMPARISON<'+'/td><'+'/tr>';
  h+='<tr><th style="border:1px solid #000;padding:4pt;background:#e8e8e8;width:28%;text-align:left">Material<'+'/th>'+hdrs+'<'+'/tr>'+ingRows+totRow+'<'+'/table>';
  h+='<table><tr><td colspan="'+(n+1)+'" class="sh">QC PARAMETERS — RECORD RESULTS BELOW<'+'/td><'+'/tr>';
  h+='<tr><th style="border:1px solid #000;padding:4pt;background:#e8e8e8;width:28%;text-align:left">Parameter<'+'/th>'+shd+'<'+'/tr>'+qcRows+'<'+'/table>';

  var w=window.open('','_blank');w.document.write(h);w.document.close();setTimeout(function(){w.print();},400);
}

// Derive a display label from permissions (for badge)
const labelFromPerms=(perms)=>{
  if(!perms||!perms.length)return null;
  const p=new Set(perms);
  if(p.has("batches_qc")&&p.has("rd_edit"))return"QC";
  if(p.has("batches_issue"))return"Issuer";
  if(p.has("complaints_add")&&!p.has("batches_view"))return"Sales";
  if(p.has("stock_consume")&&!p.has("batches_view"))return"Store";
  return"Custom";
};

// Check if user has a specific permission (supports both old roles and new permissions)
const userHasPerm=(roles,permissions,perm)=>{
  if(!permissions||!permissions.length){
    // Fall back to role-based check
    const rolePermsMap={
      admin:["batches_view","batches_issue","batches_qc","complaints_view_all","complaints_add","complaints_respond","rd_view","rd_edit","calc_tools","shade_submit","shade_approve","bom_view","bom_edit","tasks_own","tasks_assign","stock_view","stock_consume","stock_manage","testimonials","settings_products","settings_advanced"],
      issuer:["batches_view","batches_issue","bom_view","bom_edit","complaints_view_all","tasks_own","stock_view","stock_consume","settings_products","calc_tools","shade_approve","enquiries_dispatch"],
      qc:["batches_view","batches_qc","rd_view","rd_edit","calc_tools","shade_submit","complaints_view_all","complaints_respond","tasks_own","settings_advanced"],
      sales:["complaints_add","complaints_view_all","tasks_own","testimonials","enquiries_update"],
      store:["stock_view","stock_consume","tasks_own"],
      ho:["enquiries_create","enquiries_view_all","tasks_own"],
    };
    return (roles||[]).some(r=>r==="admin"||(rolePermsMap[r]||[]).includes(perm));
  }
  if((roles||[]).includes("admin"))return true;
  return permissions.includes(perm);
};

// Firestore rejects undefined values — convert them to null
const san=obj=>{if(obj===undefined)return null;if(obj===null||typeof obj!=="object")return obj;if(Array.isArray(obj))return obj.map(san);const out={};Object.entries(obj).forEach(([k,v])=>{if(v!==undefined)out[k]=san(v);});return out;};
// Notify one or more emails — writes to Firestore so dashboard picks it up live
const notify=async(emails,{type,msg,customer,link})=>{
  const targets=[...(Array.isArray(emails)?emails:[emails])].filter(Boolean);
  if(!targets.length)return;
  const batch=firebase.firestore().batch();
  targets.forEach(email=>{const ref=firebase.firestore().collection("notifications").doc();batch.set(ref,{for:email,type:type||"info",msg,customer:customer||"",link:link||"",read:false,createdAt:new Date().toISOString()});});
  await batch.commit();
};

function Btn({label,onClick,color="#3b82f6",disabled,small,outline}){
  const bg=outline?"none":color;
  const c=outline?color:"#fff";
  const br=outline?`1px solid ${color}`:"none";
  const p=small?"6px 14px":"9px 20px";
  const fs=small?"12px":"13px";
  return <button onClick={onClick} disabled={disabled} style={{background:bg,border:br,borderRadius:"8px",padding:p,color:c,fontWeight:"700",fontSize:fs,opacity:disabled?0.6:1,cursor:disabled?"not-allowed":"pointer",transition:"filter 0.15s",whiteSpace:"nowrap"}}
    onMouseEnter={e=>!disabled&&(e.currentTarget.style.filter="brightness(1.1)")}
    onMouseLeave={e=>e.currentTarget.style.filter="none"}>{label}</button>;
}

// StageBox must be defined at top level (not inside BatchWorkspace) to avoid React hook errors
function StageBox({icon,title,done,active,children,editForm,editLabel,onEdit,onEditDone,onSave,saveLabel,editStage,setEditStage,saving}){
  const [open,setOpen]=useState(!!active||!!done);
  return <div style={{border:`1px solid ${active?"#2563eb":done?"#166534":"#1e293b"}`,borderRadius:"10px",marginBottom:"10px",overflow:"hidden"}}>
    <div onClick={()=>setOpen(o=>!o)} style={{display:"flex",alignItems:"center",gap:"10px",padding:"12px 16px",cursor:"pointer",background:done?"#052e16":active?"#0a1626":"#0b1220"}}>
      <span style={{fontSize:"16px"}}>{done?"✅":active?"🔄":"⏸"}</span>
      <span style={{flex:1,fontSize:"13px",fontWeight:"700",color:done?"#22c55e":active?"#93c5fd":"#475569"}}>{icon} {title}</span>
      <div style={{display:"flex",gap:"6px",alignItems:"center"}} onClick={e=>e.stopPropagation()}>
        {done&&onEditDone&&editStage!==title&&<Btn label="✏️ Edit" onClick={onEditDone} color="#f59e0b" small outline/>}
        <span style={{color:"#334155",fontSize:"12px"}}>{open?"▲":"▼"}</span>
      </div>
    </div>
    {open&&<div style={{padding:"14px 16px",borderTop:`1px solid ${active?"#1e3a5f":"#1e293b"}`,background:"#080d18"}}>
      {children}
      {active&&editForm&&editStage!==title&&onEdit&&<div style={{marginTop:"10px"}}><Btn label={editLabel||"Fill Details"} onClick={onEdit} color="#2563eb" small/></div>}
      {editStage===title&&editForm&&<div style={{marginTop:"12px",padding:"14px",background:"#060d1a",border:"1px solid #f59e0b30",borderRadius:"8px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#f59e0b",marginBottom:"10px"}}>✏️ Editing {title} — changes save without affecting batch status</div>
        {editForm}
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"12px"}}>
          <Btn label="Cancel" onClick={()=>setEditStage(null)} outline color="#475569" small/>
          <Btn label={saving?"Saving…":saveLabel||"Save Changes"} onClick={onSave} disabled={saving} color="#f59e0b" small/>
        </div>
      </div>}
    </div>}
  </div>;
}

// Financial year helper — April 1 = new FY. Returns 2-digit year ending (e.g. 26 for FY 2025-26)
const getFY=()=>{const d=new Date();const y=d.getFullYear()%100;return d.getMonth()>=3?y+1:y;};
// Get FY from a specific date string (YYYY-MM-DD) — April onwards = new FY
const getFYFromDate=(dateStr)=>{if(!dateStr)return getFY();const d=new Date(dateStr);const y=d.getFullYear()%100;return d.getMonth()>=3?y+1:y;};
const getFYLabel=(fy)=>`${String(fy-1).padStart(2,"0")}-${String(fy).padStart(2,"0")}`;

function BatchCard({b,onClick,onDelete,onReprint,role,getBatchFY}){
  const sc=BS_COL[b.status]||"#94a3b8";
  const fy=getBatchFY?getBatchFY(b):null;
  const fyLabel=fy?getFYLabel(fy):null;
  return <div onClick={onClick} onMouseEnter={e=>e.currentTarget.style.background="#0f1f35"} onMouseLeave={e=>e.currentTarget.style.background="#080e1a"}
    style={{background:"#080e1a",border:"1px solid #1e293b",borderLeft:`3px solid ${sc}`,borderRadius:"8px",padding:"8px 14px",cursor:"pointer",transition:"background 0.1s",display:"grid",gridTemplateColumns:"100px 1fr 1fr auto auto auto auto",gap:"8px",alignItems:"center",marginBottom:"4px"}}>
    <div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9",fontFamily:"monospace"}}>{b.batchNo}</div>
    <div style={{minWidth:0}}>
      <div style={{fontSize:"12.5px",fontWeight:"600",color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{b.productName}{b.shade?` · ${b.shade}`:""}</div>
      <div style={{fontSize:"10.5px",color:"#475569"}}>{b.category||""}</div>
    </div>
    <div style={{fontSize:"11px",color:"#64748b"}}>{b.batchSize} {b.unit} · {b.dateIssued}</div>
    {fyLabel&&<span style={{fontSize:"10px",fontWeight:"700",color:"#64748b",background:"#1e293b",borderRadius:"5px",padding:"2px 6px",whiteSpace:"nowrap"}}>FY {fyLabel}</span>}
    <Bdg label={b.status} color={sc}/>
    {b.shadeCorrectionStatus==="Pending"&&<span title="Shade correction awaiting review" style={{fontSize:"10px",fontWeight:"700",color:"#22d3ee",background:"#06b6d418",border:"1px solid #06b6d440",borderRadius:"99px",padding:"2px 7px",whiteSpace:"nowrap"}}>🎯 Pending</span>}
    {b.shadeCorrectionStatus==="Approved"&&<span title="Shade correction applied to BOM" style={{fontSize:"10px",fontWeight:"700",color:"#4ade80",background:"#22c55e18",border:"1px solid #22c55e40",borderRadius:"99px",padding:"2px 7px",whiteSpace:"nowrap"}}>🎯 Applied</span>}
    {onReprint&&<button onClick={e=>{e.stopPropagation();onReprint(b);}} title="Reprint production sheet" style={{background:"none",border:"1px solid #334155",borderRadius:"5px",color:"#64748b",fontSize:"12px",padding:"2px 6px",cursor:"pointer"}}>🖨</button>}
    {(role==="admin")&&<button onClick={e=>{e.stopPropagation();onDelete(b.id)}} style={{background:"none",border:"none",color:"#334155",fontSize:"14px",padding:"2px 4px"}}>🗑</button>}
  </div>;
}

function BatchWorkspace({batch,role,onClose,showToast,qcParams,packSizes}){
  const [live,setLive]=useState(batch);
  const [editStage,setEditStage]=useState(null);
  const [saving,setSaving]=useState(false);
  const [availOldStock,setAvailOldStock]=useState([]);
  const [allOldStock,setAllOldStock]=useState([]);
  const [showOtherStock,setShowOtherStock]=useState(false);
  const [selectedOldStock,setSelectedOldStock]=useState([]);
  const [prodForm,setProdForm]=useState({startDate:today(),completionDate:today(),actualQty:"",oldStockUsed:"",producedBy:"",notes:""});
  const [qcForm,setQcForm]=useState({other:"",result:"Pass",qcDate:today(),qcBy:"",remarks:""});
  const [packForm,setPackForm]=useState({sizes:[],packingDate:today(),packedBy:"",labelChecked:"Yes",remarks:""});

  // Auto-fill QC By and Packed By with current user's name on mount
  useEffect(()=>{
    const name=live.issuedBy||"";
    db.collection("userProfiles").where("email","==",role==="admin"||role==="qc"?batch.issuedBy||"":"").get().catch(()=>{});
    // Get current user profile for auto-fill
    const uid=window._auth?.currentUser?.uid;
    if(uid){
      db.collection("userProfiles").doc(uid).get().then(snap=>{
        const displayName=snap.exists?(snap.data().displayName||snap.data().email||""):"";
        if(displayName){
          setQcForm(f=>({...f,qcBy:f.qcBy||displayName}));
          setPackForm(f=>({...f,packedBy:f.packedBy||displayName}));
        }
      }).catch(()=>{});
    }
  },[]);

  const resolvedPackSizes=(()=>{
    let list;
    if(!packSizes)list=DEFAULT_PACK_SIZES_BY_CAT[live.category]||DEFAULT_PACK_SIZES;
    else if(Array.isArray(packSizes))list=packSizes;
    else list=packSizes[live.category]||packSizes._default||DEFAULT_PACK_SIZES;
    // Normalize: each item is either a string (old) or {size,qty} (new)
    return list.map(p=>gps(p));
  })();

  useEffect(()=>{
    // Pre-fill qty from the configured pack size qty
    const sizes=resolvedPackSizes.map(p=>{const ps=gps(p);return {size:ps.size,qty:ps.qty||"",pcs:""};});
    setPackForm(f=>({...f,sizes}));
  },[live.category,JSON.stringify(resolvedPackSizes)]);

  useEffect(()=>{
    const unsub=C("batches").doc(batch.id).onSnapshot(snap=>{if(snap.exists)setLive({id:snap.id,...snap.data()});});
    return unsub;
  },[batch.id]);

  useEffect(()=>{
    if(!live.productName)return;
    C("old_stock").where("status","==","Available").where("productName","==",live.productName).get()
      .then(snap=>setAvailOldStock(snap.docs.map(d=>({id:d.id,...d.data()}))))
      .catch(()=>C("old_stock").where("status","==","Available").get()
        .then(snap=>setAvailOldStock(snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.productName===live.productName))));
    C("old_stock").where("status","==","Available").get()
      .then(snap=>setAllOldStock(snap.docs.map(d=>({id:d.id,...d.data()})))).catch(()=>{});
  },[live.productName]);

  const save=async(data,nextStatus,extraOps)=>{
    setSaving(true);
    try{
      await C("batches").doc(batch.id).update({...data,status:nextStatus});
      // Auto-add to Old/Rejected Material when QC Fails
      if(nextStatus==="QC Fail"){
        const qty=live.production?.actualQty||live.batchSize;
        const remarks=data.qc?.remarks||"QC Failed";
        await C("old_stock").add({
          productName:live.productName,category:live.category||"",
          unit:live.unit,qty:String(qty),
          status:"Available",batchRef:live.batchNo,
          notes:`Auto-added: QC Fail · ${remarks}`,
          dateAdded:today(),addedBy:"System",_createdAt:ts()
        });
        showToast("QC Fail — batch auto-added to Old/Rejected Material ✓");
      }else{
        showToast("Saved ✓");
      }
      if(extraOps)await Promise.all(extraOps);
      setEditStage(null);
    }catch(e){showToast("Error saving","error");}
    setSaving(false);
  };

  const cat=live.category||"Other";
  const rawParams=(qcParams||DEFAULT_QC_PARAMS)[cat]||DEFAULT_QC_PARAMS["Other"]||[];
  const params=rawParams.map(gp);

  const checkParam=(p,val)=>{
    const v=parseFloat(val);
    if(isNaN(v)||(!p.min&&!p.max))return null;
    if(p.min&&v<parseFloat(p.min))return false;
    if(p.max&&v>parseFloat(p.max))return false;
    return true;
  };
  const autoResult=()=>{
    const withRange=params.filter(p=>p.min||p.max);
    if(!withRange.length)return null;
    return withRange.every(p=>{const r=checkParam(p,qcForm[p.name]);return r===null||r===true;})?"Pass":"Fail";
  };

  const sc=BS_COL[live.status]||"#94a3b8";
  const canQC=role==="admin"||role==="qc";
  const stageIndex=["Issued","In Production","QC Pending","QC Pass","Packed"].indexOf(live.status);
  const sb={editStage,setEditStage,saving};

  const PrintQCReport=()=><div className="print-report">
    <div style={{borderBottom:"2px solid #000",paddingBottom:"3px",marginBottom:"5px",display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
      <div>
        <div className="pr-co">Gujarat Colours &amp; Coatings Pvt Ltd</div>
        <div className="pr-title">QC Test Report | {live.batchNo} | {live.qc?.qcDate||today()}</div>
      </div>
      <div className={live.qc?.result==="Pass"?"pr-pass pr-result":"pr-fail pr-result"}>{live.qc?.result||"—"}</div>
    </div>
    <table className="pr-info" style={{marginBottom:"4px",width:"100%"}}><tbody>
      <tr><td>Product</td><td>{live.productName}</td><td>Category</td><td>{live.category||"—"}</td></tr>
      <tr><td>Batch Size</td><td>{live.batchSize} {live.unit}</td><td>Shade</td><td>{live.shade||"—"}</td></tr>
      <tr><td>QC By</td><td>{live.qc?.qcBy||"—"}</td><td>Date</td><td>{live.qc?.qcDate||"—"}</td></tr>
    </tbody></table>
    <div className="pr-section-title">Test Parameters</div>
    <table><thead><tr><th>Parameter</th><th>Unit</th><th>Min</th><th>Max</th><th>Value</th><th>Result</th></tr></thead>
    <tbody>
      {params.map(p=>{const val=live.qc?.[p.name]||"—";const r=live.qc?.[p.name]?checkParam(p,live.qc[p.name]):null;
        return <tr key={p.name}><td>{p.name}</td><td>{p.unit||"—"}</td><td>{p.min||"—"}</td><td>{p.max||"—"}</td>
          <td><strong>{val}</strong></td>
          <td className={r===true?"pr-pass":r===false?"pr-fail":""}>{r===true?"✓":r===false?"✗":"—"}</td></tr>;
      })}
    </tbody></table>
    {(live.qc?.remarks||live.qc?.other)&&<div style={{marginTop:"3px",fontSize:"8pt"}}>
      {live.qc?.remarks&&<span><strong>Remarks:</strong> {live.qc.remarks}&nbsp;&nbsp;</span>}
      {live.qc?.other&&<span><strong>Other:</strong> {live.qc.other}</span>}
    </div>}
    <div style={{marginTop:"6px",display:"flex",justifyContent:"space-between",borderTop:"1px solid #999",paddingTop:"3px",fontSize:"8pt"}}>
      <span>QC Sign: _______________________</span>
      <span>Date: {live.qc?.qcDate||"____________"}</span>
    </div>
  </div>;

  const PrintPackReport=()=><div className="print-report" style={{borderLeft:"1px dashed #aaa"}}>
    <div style={{borderBottom:"2px solid #000",paddingBottom:"3px",marginBottom:"5px",display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
      <div>
        <div className="pr-co">Gujarat Colours &amp; Coatings Pvt Ltd</div>
        <div className="pr-title">Packing Report | {live.batchNo} | {live.packing?.packingDate||today()}</div>
      </div>
      <div style={{fontSize:"9pt",fontWeight:"bold"}}>{live.packing?.totalQty} {live.unit}</div>
    </div>
    <table className="pr-info" style={{marginBottom:"4px",width:"100%"}}><tbody>
      <tr><td>Product</td><td>{live.productName}</td><td>Shade</td><td>{live.shade||"—"}</td></tr>
      <tr><td>Batch Size</td><td>{live.batchSize} {live.unit}</td><td>Label</td><td>{live.packing?.labelChecked||"—"}</td></tr>
      <tr><td>Packed By</td><td>{live.packing?.packedBy||"—"}</td><td>Date</td><td>{live.packing?.packingDate||"—"}</td></tr>
    </tbody></table>
    <div className="pr-section-title">Packing Details</div>
    <table><thead><tr><th>Pack Size</th><th>Packs</th><th>Qty/Pack</th><th>Total</th></tr></thead>
    <tbody>
      {(live.packing?.sizes||[]).filter(s=>parseInt(s.pcs)>0).map(s=>{const lt=((parseFloat(s.qty)||0)*(parseInt(s.pcs)||0));
        return <tr key={s.size}><td>{s.size}</td><td><strong>{s.pcs}</strong></td><td>{s.qty} {live.unit}</td><td><strong>{lt.toFixed(1)} {live.unit}</strong></td></tr>;
      })}
      <tr><td colSpan="3" style={{textAlign:"right",fontWeight:"bold"}}>Total Packed</td><td style={{fontWeight:"bold"}}>{live.packing?.totalQty} {live.unit}</td></tr>
    </tbody></table>
    {live.packing?.remarks&&<div style={{marginTop:"3px",fontSize:"8pt"}}><strong>Remarks:</strong> {live.packing.remarks}</div>}
    <div style={{marginTop:"6px",display:"flex",justifyContent:"space-between",borderTop:"1px solid #999",paddingTop:"3px",fontSize:"8pt"}}>
      <span>Packed By: _______________________</span>
      <span>QC Sign: _______________________</span>
    </div>
  </div>;

  return <div>
    <PrintQCReport/><PrintPackReport/>
    <div className="no-print">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px",gap:"8px"}}>
      <div>
        <div style={{fontSize:"22px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>{live.batchNo}</div>
        <div style={{fontSize:"12px",color:"#64748b",marginTop:"3px"}}>{live.category?`${live.category} · `:""}{live.productName}{live.shade?` — ${live.shade}`:""} · {live.batchSize} {live.unit}</div>
      </div>
      <Bdg label={live.status} color={sc}/>
    </div>

    <StageBox {...sb} icon="📋" title="Issue Details" done={true} active={false}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
        {[["Product",live.productName],["Shade/Color",live.shade||"—"],["Batch Size",`${live.batchSize} ${live.unit}`],["Date Issued",live.dateIssued],["Issued By",live.issuedBy],["Old/Rejected Used",live.oldStockUsed||"—"]].map(([l,v])=><div key={l} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"8px 12px"}}>
          <div style={{fontSize:"10px",color:"#334155",fontWeight:"600",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"2px"}}>{l}</div>
          <div style={{fontSize:"13px",color:"#94a3b8",fontWeight:"500"}}>{v||"—"}</div>
        </div>)}
      </div>
    </StageBox>

    <StageBox {...sb} icon="🏭" title="Production Details" done={stageIndex>=1&&!!live.production?.completionDate} active={live.status==="Issued"||live.status==="In Production"}
      editLabel="Enter Production Details" onEdit={canQC?()=>setEditStage("Production Details"):null}
      onEditDone={canQC?()=>{
        // Pre-fill form with existing data for correction
        if(live.production)setProdForm({
          startDate:live.production.startDate||today(),
          completionDate:live.production.completionDate||today(),
          actualQty:live.production.actualQty||"",
          producedBy:live.production.producedBy||"",
          notes:live.production.notes||""
        });
        setEditStage("Production Details");
      }:null}
      editForm={<div>
        <Grid2>
          <Field label="Start Date"><input type="date" style={inp} value={prodForm.startDate} onChange={e=>setProdForm({...prodForm,startDate:e.target.value})}/></Field>
          <Field label="Completion Date"><input type="date" style={inp} value={prodForm.completionDate} onChange={e=>setProdForm({...prodForm,completionDate:e.target.value})}/></Field>
        </Grid2>
        <Grid2>
          <Field label={`Actual Qty (${live.unit})`}><input style={inp} value={prodForm.actualQty} onChange={e=>setProdForm({...prodForm,actualQty:e.target.value})}/></Field>
          <Field label="Produced By"><input style={inp} value={prodForm.producedBy} onChange={e=>setProdForm({...prodForm,producedBy:e.target.value})}/></Field>
        </Grid2>

        {/* ── SAME PRODUCT OLD/REJECTED STOCK ── */}
        <div style={{marginBottom:"14px"}}>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>📦 Old/Rejected Material Used — Same Product</div>
          {availOldStock.length===0
            ?<div style={{fontSize:"12px",color:"#334155",fontStyle:"italic",padding:"6px 0"}}>No available stock for {live.productName||"this product"}.</div>
            :<div style={{border:"1px solid #f59e0b30",borderRadius:"8px",background:"#0a1010",padding:"10px 12px",display:"flex",flexDirection:"column",gap:"8px"}}>
              {availOldStock.map(s=>{
                const sel=selectedOldStock.find(x=>x.id===s.id);
                const isSel=!!sel;
                return <div key={s.id} style={{padding:"8px",borderRadius:"6px",background:isSel?"#422006":"transparent",border:`1px solid ${isSel?"#f59e0b30":"transparent"}`}}>
                  <label style={{display:"flex",alignItems:"flex-start",gap:"10px",cursor:"pointer"}}>
                    <input type="checkbox" checked={isSel} onChange={e=>{
                      if(e.target.checked)setSelectedOldStock(p=>[...p,{...s,usedQty:s.qty}]);
                      else setSelectedOldStock(p=>p.filter(x=>x.id!==s.id));
                    }} style={{width:"16px",height:"16px",cursor:"pointer",marginTop:"2px",flexShrink:0}}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:"13px",fontWeight:"600",color:"#f1f5f9"}}>{s.productName}</div>
                      <div style={{fontSize:"11px",color:"#64748b"}}>Available: {s.qty} {s.unit}{s.batchRef?` · Ref: ${s.batchRef}`:""}{s.notes?` · ${s.notes}`:""}</div>
                    </div>
                  </label>
                  {isSel&&<div style={{marginTop:"8px",marginLeft:"26px",display:"flex",alignItems:"center",gap:"8px"}}>
                    <span style={{fontSize:"11px",color:"#f59e0b",fontWeight:"600",flexShrink:0}}>Qty to use:</span>
                    <input type="number" min="0.1" max={parseFloat(s.qty)||9999} step="0.1"
                      style={{...sml,width:"100px",borderColor:"#f59e0b50"}}
                      value={sel.usedQty}
                      onChange={e=>setSelectedOldStock(p=>p.map(x=>x.id===s.id?{...x,usedQty:e.target.value}:x))}/>
                    <span style={{fontSize:"11px",color:"#64748b"}}>{s.unit} (max {s.qty})</span>
                    {parseFloat(sel.usedQty)<parseFloat(s.qty)&&<span style={{fontSize:"10px",color:"#22c55e",background:"#052e16",padding:"2px 7px",borderRadius:"99px",border:"1px solid #166534"}}>Partial</span>}
                  </div>}
                </div>;
              })}
            </div>
          }
        </div>

        {/* ── OTHER MATERIAL (different products) ── */}
        <div style={{marginBottom:"14px"}}>
          <button onClick={()=>setShowOtherStock(v=>!v)} style={{background:"none",border:"1px dashed #334155",borderRadius:"7px",padding:"7px 14px",color:"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600",width:"100%",textAlign:"left"}}>
            {showOtherStock?"▲ Hide":"▼ + Add Material from Other Products (optional)"}
          </button>
          {showOtherStock&&<div style={{border:"1px solid #334155",borderRadius:"8px",background:"#0a1010",padding:"10px 12px",marginTop:"8px",display:"flex",flexDirection:"column",gap:"8px",maxHeight:"240px",overflowY:"auto"}}>
            {allOldStock.filter(s=>s.productName!==live.productName).length===0
              ?<div style={{fontSize:"12px",color:"#334155",fontStyle:"italic"}}>No other old/rejected material available.</div>
              :allOldStock.filter(s=>s.productName!==live.productName).map(s=>{
                const sel=selectedOldStock.find(x=>x.id===s.id);
                const isSel=!!sel;
                return <div key={s.id} style={{padding:"8px",borderRadius:"6px",background:isSel?"#0c2340":"transparent",border:`1px solid ${isSel?"#2563eb30":"transparent"}`}}>
                  <label style={{display:"flex",alignItems:"flex-start",gap:"10px",cursor:"pointer"}}>
                    <input type="checkbox" checked={isSel} onChange={e=>{
                      if(e.target.checked)setSelectedOldStock(p=>[...p,{...s,usedQty:s.qty}]);
                      else setSelectedOldStock(p=>p.filter(x=>x.id!==s.id));
                    }} style={{width:"16px",height:"16px",cursor:"pointer",marginTop:"2px",flexShrink:0}}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:"13px",fontWeight:"600",color:"#e2e8f0"}}>{s.productName}</div>
                      <div style={{fontSize:"11px",color:"#64748b"}}>{s.category} · Available: {s.qty} {s.unit}{s.batchRef?` · Ref: ${s.batchRef}`:""}</div>
                    </div>
                  </label>
                  {isSel&&<div style={{marginTop:"8px",marginLeft:"26px",display:"flex",alignItems:"center",gap:"8px"}}>
                    <span style={{fontSize:"11px",color:"#93c5fd",fontWeight:"600",flexShrink:0}}>Qty to use:</span>
                    <input type="number" min="0.1" max={parseFloat(s.qty)||9999} step="0.1"
                      style={{...sml,width:"100px",borderColor:"#2563eb50"}}
                      value={sel.usedQty}
                      onChange={e=>setSelectedOldStock(p=>p.map(x=>x.id===s.id?{...x,usedQty:e.target.value}:x))}/>
                    <span style={{fontSize:"11px",color:"#64748b"}}>{s.unit}</span>
                  </div>}
                </div>;
              })
            }
          </div>}
        </div>

        {selectedOldStock.length>0&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"8px 12px",marginBottom:"10px",fontSize:"12px",color:"#22c55e"}}>
          ✓ {selectedOldStock.length} item{selectedOldStock.length!==1?"s":""} selected · Total: {selectedOldStock.map(x=>`${x.usedQty} ${x.unit} ${x.productName}`).join(", ")}
        </div>}

        <Field label="Production Notes"><textarea style={{...ta,minHeight:"56px"}} value={prodForm.notes} onChange={e=>setProdForm({...prodForm,notes:e.target.value})} placeholder="Any production notes..."/></Field>
      </div>}
      saveLabel={live.status==="QC Pending"||live.status==="QC Pass"||live.status==="QC Fail"||live.status==="Packed"||live.status==="Dispatched"?"💾 Save Correction":"Save & Mark QC Pending"}
      onSave={()=>{
        const isCorrection=live.status!=="Issued"&&live.status!=="In Production";
        const desc=selectedOldStock.length>0?selectedOldStock.map(s=>`${s.usedQty||s.qty} ${s.unit} ${s.productName}`).join(", "):prodForm.notes;
        const markUsed=selectedOldStock.map(s=>{
          const used=parseFloat(s.usedQty)||parseFloat(s.qty);
          const avail=parseFloat(s.qty)||0;
          const remaining=avail-used;
          if(remaining<=0.01){
            return C("old_stock").doc(s.id).update({status:"Used",usedInBatch:live.batchNo,usedDate:today()});
          }else{
            return C("old_stock").doc(s.id).update({qty:remaining.toFixed(2),usedInBatch:live.batchNo,lastUsedDate:today(),notes:`${s.notes||""} | Partial: ${used} used in ${live.batchNo}`.trim()});
          }
        });
        save({production:{...prodForm,oldStockUsed:desc,selectedOldStockIds:selectedOldStock.map(s=>s.id)}},isCorrection?live.status:"QC Pending",markUsed);

// FILE STORAGE — Base64 in Firestore (no Firebase Storage needed)
// Images compressed via Canvas to keep size small
// ══════════════════════════════════════════════════════════

const compressImage=async(file,maxPx=900,quality=0.72)=>{
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxPx/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale);
        const h=Math.round(img.height*scale);
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL("image/jpeg",quality);
        resolve(dataUrl);
      };
      img.onerror=reject;
      img.src=ev.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
};

const fileToBase64=async(file,userEmail)=>{
  let dataUrl;
  if(file.type.startsWith("image/")){
    dataUrl=await compressImage(file);
  }else if(file.type.startsWith("video/")){
    // Videos too large for Firestore — store metadata only, ask user to share via WhatsApp
    return {name:file.name,type:file.type,size:file.size,url:null,isVideoStub:true,uploadedBy:userEmail,uploadedAt:today(),note:"Video too large to store inline — share via WhatsApp/email separately"};
  }else{
    // PDF/other — store as base64 if small enough
    if(file.size>800000)throw new Error(`File "${file.name}" is too large (${(file.size/1024/1024).toFixed(1)}MB). Max 800KB for non-image files. For photos, any size is fine.`);
    dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file);});
  }
  const sizeKB=Math.round(dataUrl.length*0.75/1024);
  return {name:file.name,type:file.type,size:file.size,sizeKB,url:dataUrl,uploadedBy:userEmail,uploadedAt:today()};
};

function FileAttachment({folder,existingFiles=[],onFilesChange,readOnly=false,maxFiles=5}){
  const [uploading,setUploading]=useState(false);
  const [error,setError]=useState("");
  const [zoomFile,setZoomFile]=useState(null);
  const user=auth.currentUser;
  const fileRef=useRef(null);

  const handleSelect=async(e)=>{
    const files=[...e.target.files];
    if(!files.length)return;
    if(existingFiles.length+files.length>maxFiles){setError(`Max ${maxFiles} files allowed`);return;}
    setUploading(true);setError("");
    try{
      const processed=await Promise.all(files.map(f=>fileToBase64(f,user?.email||"")));
      onFilesChange([...existingFiles,...processed]);
    }catch(err){setError(err.message||"Processing failed");}
    setUploading(false);
    e.target.value="";
  };

  const removeFile=(idx)=>{onFilesChange(existingFiles.filter((_,i)=>i!==idx));};

  return <div>
    {!readOnly&&existingFiles.length<maxFiles&&<div style={{marginBottom:"8px"}}>
      <input ref={fileRef} type="file" accept="image/*,.pdf" multiple onChange={handleSelect} style={{display:"none"}}/>
      <button onClick={()=>fileRef.current?.click()} disabled={uploading}
        style={{background:"none",border:"1px dashed #334155",borderRadius:"7px",padding:"7px 14px",color:uploading?"#334155":"#64748b",cursor:uploading?"not-allowed":"pointer",fontSize:"12px",fontWeight:"600",display:"flex",alignItems:"center",gap:"6px"}}>
        {uploading?"⏳ Processing…":"📎 Add Photo / PDF"}
        <span style={{fontSize:"10px",color:"#334155"}}>({existingFiles.length}/{maxFiles}) — images auto-compressed</span>
      </button>
      {error&&<div style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"7px",padding:"8px 12px",color:"#fca5a5",fontSize:"12px",marginTop:"6px"}}>❌ {error}</div>}
    </div>}
    {existingFiles.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:"8px",marginTop:"6px"}}>
      {existingFiles.map((f,i)=>{
        const isImg=f.type?.startsWith("image/");
        const isPDF=f.type==="application/pdf";
        const isVideoStub=f.isVideoStub;
        return <div key={i} style={{position:"relative",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",maxWidth:"180px"}}>
          {isImg&&f.url&&<div style={{position:"relative",cursor:"zoom-in"}} onClick={()=>setZoomFile(f)}>
            <img src={f.url} alt={f.name} style={{width:"160px",height:"120px",objectFit:"cover",display:"block"}}/>
            <div style={{position:"absolute",bottom:"6px",right:"6px",background:"rgba(0,0,0,0.6)",borderRadius:"6px",width:"26px",height:"26px",display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
              <span style={{fontSize:"14px"}}>🔍</span>
            </div>
          </div>}
          {isPDF&&f.url&&<a href={f.url} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:"6px",padding:"10px 12px",color:"#93c5fd",fontSize:"12px",textDecoration:"none"}}>📄 {f.name.length>18?f.name.slice(0,18)+"…":f.name}</a>}
          {isVideoStub&&<div style={{padding:"10px 12px",fontSize:"11px",color:"#f59e0b"}}>🎥 {f.name.length>16?f.name.slice(0,16)+"…":f.name}<br/><span style={{fontSize:"10px",color:"#475569"}}>Share separately</span></div>}
          <div style={{padding:"3px 8px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:"9px",color:isImg?"#3b82f6":"#334155"}}>{isImg?"🔍 Tap to enlarge":(f.sizeKB?`${f.sizeKB}KB`:"")}</span>
            {!readOnly&&<button onClick={()=>removeFile(i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:"0 2px",flexShrink:0}}>×</button>}
          </div>
        </div>;
      })}
    </div>}
    {/* Lightbox — click image to zoom, supports pinch-zoom on mobile */}
    {zoomFile&&<div onClick={()=>setZoomFile(null)} style={{position:"fixed",inset:0,background:"rgba(2,6,16,0.95)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",cursor:"zoom-out",padding:"16px",overflow:"auto"}}>
      <button onClick={()=>setZoomFile(null)} style={{position:"fixed",top:"16px",right:"16px",background:"rgba(255,255,255,0.12)",border:"1px solid rgba(255,255,255,0.25)",borderRadius:"50%",color:"#fff",fontSize:"20px",width:"44px",height:"44px",cursor:"pointer",lineHeight:1,zIndex:10000}}>×</button>
      <img src={zoomFile.url} alt={zoomFile.name} onClick={e=>e.stopPropagation()}
        style={{maxWidth:"95vw",maxHeight:"85vh",width:"auto",height:"auto",objectFit:"contain",borderRadius:"8px",boxShadow:"0 10px 60px rgba(0,0,0,0.6)",cursor:"default",touchAction:"pinch-zoom"}}/>
      <div style={{position:"fixed",bottom:"16px",left:"50%",transform:"translateX(-50%)",display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap",justifyContent:"center",maxWidth:"92vw"}}>
        <span style={{fontSize:"12px",color:"rgba(255,255,255,0.6)",background:"rgba(255,255,255,0.08)",padding:"6px 14px",borderRadius:"99px"}}>{zoomFile.name}{zoomFile.sizeKB?` · ${zoomFile.sizeKB}KB`:""}</span>
        <a href={zoomFile.url} download={zoomFile.name} onClick={e=>e.stopPropagation()} style={{fontSize:"12px",color:"#93c5fd",background:"rgba(59,130,246,0.15)",border:"1px solid rgba(59,130,246,0.3)",padding:"6px 14px",borderRadius:"99px",textDecoration:"none"}}>⬇ Download</a>
      </div>
    </div>}
  </div>;
}

// ── Field Visit Form — salesman adds visit details after customer visit ──
function FieldVisitForm({complaint,user,showToast,allProfiles,allRoles}){
  const [open,setOpen]=useState(false);
  const [form,setForm]=useState({
    notes:complaint.fieldVisit?.notes||"",
    visitedCustomer:complaint.fieldVisit?complaint.visitedCustomer||"yes":(complaint.visitedCustomer||""),
    visitDate:complaint.fieldVisit?.date||complaint.visitDate||today(),
    photos:complaint.fieldVisit?.photos||[]
  });
  const [saving,setSaving]=useState(false);

  const save=async()=>{
    if(!form.notes.trim())return showToast("Add visit notes before saving","error");
    setSaving(true);
    try{
      await C("complaints").doc(complaint.id).update({
        fieldVisit:{notes:form.notes,date:form.visitDate,by:user.email,photos:form.photos,updatedAt:new Date().toISOString()},
        visitedCustomer:form.visitedCustomer,
        visitDate:form.visitDate,
        status:complaint.status==="Assigned to Salesman"?"Under Review":complaint.status,
      });
      // Notify each QC user that salesman has visited and updated
      const qcList=Object.keys(allRoles||{}).filter(e=>(allRoles[e]||[]).includes("qc"));
      for(const qcEmail of qcList){
        await C("notifications").add({type:"field_visit_done",complaintId:complaint.id,customer:complaint.customerName,msg:`Field visit done for complaint: ${complaint.customerName} — by ${user.email.split("@")[0]}. Please add QC response.`,assignedTo:qcEmail,date:today(),read:false,_createdAt:ts()});
      }
      showToast("Field visit details saved — QC notified ✓");
      setOpen(false);
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  if(!open)return <button onClick={()=>setOpen(true)} style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"7px",padding:"6px 14px",color:"#93c5fd",fontWeight:"700",fontSize:"12px",cursor:"pointer",marginTop:"4px"}}>
    {complaint.fieldVisit?"✏️ Update Field Visit":"📍 Add Field Visit Details"}
  </button>;
  return <div style={{background:"#060d1a",border:"1px solid #2563eb40",borderRadius:"8px",padding:"12px",marginTop:"8px"}}>
    <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"10px"}}>📍 Field Visit Details</div>
    <Grid2>
      <Field label="Visited Customer?">
        <select style={sl} value={form.visitedCustomer} onChange={e=>setForm({...form,visitedCustomer:e.target.value})}>
          <option value="yes">✓ Yes, visited</option>
          <option value="no">✗ Not yet visited</option>
          <option value="scheduled">📅 Visit scheduled</option>
        </select>
      </Field>
      {form.visitedCustomer==="yes"&&<Field label="Date of Visit"><input type="date" style={inp} value={form.visitDate} onChange={e=>setForm({...form,visitDate:e.target.value})}/></Field>}
    </Grid2>
    <Field label="Visit Notes / Observations *">
      <textarea style={{...ta,minHeight:"90px"}} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="What did you observe at customer site? What was the actual issue? What did customer say?..."/>
    </Field>
    <div style={{marginBottom:"10px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>📎 Photos from Site Visit</div>
      <FileAttachment folder={`complaints/visit_${complaint.id}`} existingFiles={form.photos} onFilesChange={photos=>setForm({...form,photos})} maxFiles={8}/>
    </div>
    <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
      <Btn label="Cancel" onClick={()=>setOpen(false)} outline color="#475569" small/>
      <Btn label={saving?"Saving…":"Save & Notify QC"} onClick={save} disabled={saving} color="#22c55e" small/>
    </div>
  </div>;
}



class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null,info:null};}
  componentDidCatch(err,info){this.setState({err,info});}
  render(){
    if(this.state.err){
      const lines=(this.state.info?.componentStack||"").split("\n").slice(0,8).join("\n");
      return <div style={{background:"#1a0000",border:"2px solid #ef4444",borderRadius:"10px",padding:"20px",margin:"20px",color:"#fca5a5",fontFamily:"monospace",fontSize:"13px"}}>
        <div style={{fontSize:"16px",fontWeight:"700",color:"#ef4444",marginBottom:"10px"}}>⚠ App Error — Exact Location:</div>
        <div style={{background:"#0f0000",padding:"10px",borderRadius:"6px",marginBottom:"10px",whiteSpace:"pre-wrap",color:"#fcd34d"}}>{String(this.state.err)}</div>
        <div style={{background:"#0f0000",padding:"10px",borderRadius:"6px",fontSize:"11px",color:"#94a3b8",whiteSpace:"pre-wrap"}}>{lines}</div>
        <button onClick={()=>this.setState({err:null,info:null})} style={{marginTop:"12px",background:"#7f1d1d",border:"1px solid #ef4444",borderRadius:"6px",padding:"6px 16px",color:"#fca5a5",cursor:"pointer",fontWeight:"700"}}>↩ Try Again</button>
      </div>;
    }
    return this.props.children;
  }
}
function CustomerSearchInput({value,customers,onChange}){
  const [search,setSearch]=useState(value||"");
  const [open,setOpen]=useState(false);
  const matches=search.trim()?customers.filter(c=>normalize(c).includes(normalize(search))).slice(0,12):[];
  return <div style={{position:"relative"}}>
    <input style={inp} value={search} placeholder="Type to search customer…"
      onChange={e=>{setSearch(e.target.value);onChange(e.target.value);setOpen(true);}}
      onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false),150)}/>
    {open&&matches.length>0&&<div style={{position:"absolute",top:"100%",left:0,right:0,background:"#0b1220",border:"1px solid #2563eb",borderRadius:"0 0 8px 8px",zIndex:100,maxHeight:"190px",overflowY:"auto",boxShadow:"0 4px 20px rgba(0,0,0,0.5)"}}>
      {matches.map((c,i)=><div key={i} onMouseDown={()=>{setSearch(c);onChange(c);setOpen(false);}}
        style={{padding:"7px 12px",cursor:"pointer",fontSize:"12.5px",color:"#e2e8f0",borderBottom:"1px solid #0f172a"}}
        onMouseEnter={e=>e.currentTarget.style.background="#1e3a5f"} onMouseLeave={e=>e.currentTarget.style.background=""}>{c}</div>)}
    </div>}
  </div>;
}
