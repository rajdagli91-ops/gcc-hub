// ── RM Export / Import component ──
function RMExportImport({materials,CATS,UNITS,user,showToast,onImport}){
  const [importing,setImporting]=useState(false);
  const [preview,setPreview]=useState(null);
  const fileRef=useRef(null);

  const exportCSV=()=>{
    const header=["Name","Category","Unit","Current Stock","Reorder Level","Supplier","Notes"];
    const rows=[header,...materials.map(m=>[
      m.name||"",m.category||"",m.unit||"",parseFloat(m.currentStock||0).toFixed(3),
      m.reorderLevel||"",m.supplier||"",m.notes||""
    ])];
    const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download=`RM_Stock_${today()}.csv`;a.click();
    showToast("Raw materials exported ✓");
  };

  const downloadTemplate=()=>{
    const rows=[
      ["Name","Category","Unit","Opening Stock","Reorder Level","Supplier","Notes"],
      ["TiO2 White",CATS[0]||"Pigment","kg","100","20","ABC Chemicals",""],
      ["Acrylic Binder",CATS[0]||"Resin","kg","200","50","XYZ Resin",""],
    ];
    const csv=rows.map(r=>r.map(v=>`"${v}"`).join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download="RM_Import_Template.csv";a.click();
    showToast("Template downloaded ✓");
  };

  const handleFile=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    setImporting(true);
    try{
      const text=await file.text();
      const rows=text.trim().split("\n").map(line=>
        line.split(",").map(cell=>cell.trim().replace(/^"|"$/g,"").replace(/""/g,'"'))
      );
      const header=rows[0].map(h=>h.toLowerCase().trim());
      const nameIdx=header.findIndex(h=>h.includes("name"));
      const catIdx=header.findIndex(h=>h.includes("category"));
      const unitIdx=header.findIndex(h=>h.includes("unit"));
      const stockIdx=header.findIndex(h=>h.includes("opening")||h.includes("current"));
      const reorderIdx=header.findIndex(h=>h.includes("reorder"));
      const supplierIdx=header.findIndex(h=>h.includes("supplier"));
      const notesIdx=header.findIndex(h=>h.includes("notes"));
      const parsed=rows.slice(1).filter(r=>r[nameIdx]?.trim()).map(r=>({
        name:r[nameIdx]?.trim()||"",
        category:r[catIdx]?.trim()||CATS[0]||"",
        unit:r[unitIdx]?.trim()||"kg",
        openingStock:r[stockIdx]?.trim()||"0",
        reorderLevel:r[reorderIdx]?.trim()||"",
        supplier:r[supplierIdx]?.trim()||"",
        notes:r[notesIdx]?.trim()||""
      }));
      setPreview(parsed);
    }catch(err){showToast("Error reading file: "+err.message,"error");}
    setImporting(false);e.target.value="";
  };

  const confirmImport=async()=>{
    if(!preview?.length)return;
    setImporting(true);
    await onImport(preview);
    setPreview(null);setImporting(false);
  };

  return <div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px",marginBottom:"16px"}}>
      {/* Export */}
      <div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"10px",padding:"16px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#22c55e",marginBottom:"6px"}}>📥 Export Raw Materials</div>
        <div style={{fontSize:"12px",color:"#86efac",marginBottom:"12px"}}>Download all {materials.length} materials with current stock levels as CSV. Open in Excel to edit.</div>
        <Btn label="📥 Download as CSV" onClick={exportCSV} disabled={materials.length===0} color="#22c55e" small/>
      </div>
      {/* Import */}
      <div style={{background:"#0f1d35",border:"1px solid #2563eb40",borderRadius:"10px",padding:"16px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"6px"}}>📤 Import Raw Materials</div>
        <div style={{fontSize:"12px",color:"#64748b",marginBottom:"10px"}}>Upload a CSV to bulk-add or update materials. Existing materials are updated; new ones are added.</div>
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
          <Btn label="⬇ Download Template" onClick={downloadTemplate} color="#64748b" small outline/>
          <Btn label={importing?"Reading…":"📤 Upload CSV"} onClick={()=>fileRef.current?.click()} disabled={importing} color="#3b82f6" small/>
          <input ref={fileRef} type="file" accept=".csv,.txt" onChange={handleFile} style={{display:"none"}}/>
        </div>
      </div>
    </div>

    {/* Preview imported data */}
    {preview&&<div style={{background:"#0b1220",border:"1px solid #f59e0b",borderRadius:"10px",padding:"14px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#f59e0b",marginBottom:"10px"}}>Preview — {preview.length} material{preview.length!==1?"s":""} to import</div>
      {/* Show new categories/units that will be auto-created */}
      {[...new Set(preview.map(r=>r.category).filter(Boolean))].filter(c=>!CATS.includes(c)).length>0&&
        <div style={{background:"#0f1d10",border:"1px solid #22c55e40",borderRadius:"6px",padding:"8px 12px",marginBottom:"8px",fontSize:"12px",color:"#86efac"}}>
          ✅ New categories will be auto-created: <strong>{[...new Set(preview.map(r=>r.category).filter(Boolean))].filter(c=>!CATS.includes(c)).join(", ")}</strong>
        </div>}
      {[...new Set(preview.map(r=>r.unit).filter(Boolean))].filter(u=>u&&!UNITS.includes(u)).length>0&&
        <div style={{background:"#0f1d10",border:"1px solid #22c55e40",borderRadius:"6px",padding:"8px 12px",marginBottom:"8px",fontSize:"12px",color:"#86efac"}}>
          ✅ New units will be auto-created: <strong>{[...new Set(preview.map(r=>r.unit).filter(Boolean))].filter(u=>!UNITS.includes(u)).join(", ")}</strong>
        </div>}
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"12px",maxHeight:"300px",overflowY:"auto"}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 80px 80px 1.5fr",background:"#0b1220",padding:"6px 12px",gap:"6px",position:"sticky",top:0}}>
          {["Name","Category","Unit","Opening Stock","Reorder Level","Supplier"].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
        </div>
        {preview.map((row,i)=>{
          const exists=materials.some(m=>normalize(m.name)===normalize(row.name));
          return <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 80px 80px 1.5fr",padding:"6px 12px",gap:"6px",borderTop:"1px solid #1e293b",background:exists?"#0f1d10":"#080d18",alignItems:"center"}}>
            <div style={{fontSize:"12px",color:"#e2e8f0"}}>{row.name} {exists&&<span style={{fontSize:"9px",color:"#22c55e",background:"#052e16",padding:"1px 5px",borderRadius:"4px"}}>UPDATE</span>}</div>
            <div style={{fontSize:"11px",color:"#64748b"}}>{row.category}</div>
            <div style={{fontSize:"11px",color:"#64748b"}}>{row.unit}</div>
            <div style={{fontSize:"11px",color:"#22c55e"}}>{row.openingStock}</div>
            <div style={{fontSize:"11px",color:"#64748b"}}>{row.reorderLevel||"—"}</div>
            <div style={{fontSize:"11px",color:"#64748b"}}>{row.supplier||"—"}</div>
          </div>;
        })}
      </div>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setPreview(null)} outline color="#475569" small/>
        <Btn label={importing?"Importing…":`✓ Import ${preview.length} Materials`} onClick={confirmImport} disabled={importing} color="#22c55e" small/>
      </div>
    </div>}

    <InfoBox color="#64748b" style={{marginTop:"12px"}}>
      CSV columns: Name, Category, Unit, Opening Stock (or Current Stock), Reorder Level, Supplier, Notes.
      Column order doesn't matter — headers are detected automatically.
      Existing materials (matched by name) will be updated; new names will be added.
    </InfoBox>
  </div>;
}

function RawMaterialStockTab({role,user,showToast,sysUnits,sysRmCats,onAddRmCat,onAddUnit}){
  const isAdmin=role==="admin";
  const canStore=role==="admin"||role==="store";
  const UNITS=sysUnits||BATCH_UNITS;
  const CATS=sysRmCats||RM_CATEGORIES;

  // State
  const [materials,setMaterials]=useState([]);
  const [transactions,setTransactions]=useState([]);
  const [loading,setLoading]=useState(true);
  const [subTab,setSubTab]=useState("stock");
  const [groupByCat,setGroupByCat]=useState(false);
  const [search,setSearch]=useState("");
  const [filterCat,setFilterCat]=useState("All");
  const [saving,setSaving]=useState(false);

  // Add material form (admin)
  const blankMat={name:"",category:CATS[0]||"",unit:"kg",openingStock:"",reorderLevel:"",supplier:"",notes:""};
  const [matForm,setMatForm]=useState({...blankMat});
  const [showAddMat,setShowAddMat]=useState(false);
  const [editMat,setEditMat]=useState(null);

  // Consumption form (store)
  const [consumeRows,setConsumeRows]=useState([{materialId:"",qty:"",notes:""}]);
  const [consumeDate,setConsumeDate]=useState(today());

  // Stock addition form (admin)
  const [addStockRows,setAddStockRows]=useState([{materialId:"",qty:"",supplier:"",invoiceNo:"",notes:""}]);
  const [addStockDate,setAddStockDate]=useState(today());

  // Load data
  useEffect(()=>{
    const unsub1=C("rm_stock_materials").orderBy("name").onSnapshot(
      s=>{setMaterials(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},
      ()=>setLoading(false)
    );
    const unsub2=C("rm_stock_transactions").orderBy("date","desc").onSnapshot(
      s=>setTransactions(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{}
    );
    return()=>{unsub1();unsub2();};
  },[]);

  // Save new material
  const saveMaterial=async(isEdit=false)=>{
    if(!matForm.name.trim())return showToast("Material name required","error");
    setSaving(true);
    try{
      if(isEdit&&editMat){
        await C("rm_stock_materials").doc(editMat.id).update({...matForm,updatedBy:user.email,updatedAt:ts()});
        showToast("Material updated ✓");setEditMat(null);
      }else{
        const openingQty=parseFloat(matForm.openingStock)||0;
        const docRef=await C("rm_stock_materials").add({...matForm,currentStock:openingQty,addedBy:user.email,_createdAt:ts()});
        if(openingQty>0){
          await C("rm_stock_transactions").add({materialId:docRef.id,materialName:matForm.name,type:"opening",qty:openingQty,date:today(),addedBy:user.email,notes:"Opening stock",stockAfter:openingQty,_createdAt:ts()});
        }
        showToast("Material added ✓");setShowAddMat(false);
      }
      setMatForm({...blankMat});
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // Save daily consumption
  const saveConsumption=async()=>{
    const valid=consumeRows.filter(r=>r.materialId&&parseFloat(r.qty)>0);
    if(!valid.length)return showToast("Add at least one material with quantity","error");
    setSaving(true);
    try{
      await Promise.all(valid.map(async r=>{
        const mat=materials.find(m=>m.id===r.materialId);
        if(!mat)return;
        const qty=parseFloat(r.qty);
        const newStock=Math.max(0,(parseFloat(mat.currentStock)||0)-qty);
        await C("rm_stock_materials").doc(r.materialId).update({currentStock:newStock,updatedAt:ts()});
        await C("rm_stock_transactions").add({materialId:r.materialId,materialName:mat.name,unit:mat.unit,type:"consumption",qty,date:consumeDate,addedBy:user.email,notes:r.notes||"Daily consumption",stockAfter:newStock,_createdAt:ts()});
      }));
      showToast(`Consumption recorded for ${valid.length} material${valid.length!==1?"s":""} ✓`);
      setConsumeRows([{materialId:"",qty:"",notes:""}]);setConsumeDate(today());
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // Admin: add stock received
  const saveStockAddition=async()=>{
    const valid=addStockRows.filter(r=>r.materialId&&parseFloat(r.qty)>0);
    if(!valid.length)return showToast("Add at least one material with quantity","error");
    setSaving(true);
    try{
      await Promise.all(valid.map(async r=>{
        const mat=materials.find(m=>m.id===r.materialId);
        if(!mat)return;
        const qty=parseFloat(r.qty);
        const newStock=(parseFloat(mat.currentStock)||0)+qty;
        await C("rm_stock_materials").doc(r.materialId).update({currentStock:newStock,updatedAt:ts()});
        await C("rm_stock_transactions").add({materialId:r.materialId,materialName:mat.name,unit:mat.unit,type:"addition",qty,date:addStockDate,supplier:r.supplier||"",invoiceNo:r.invoiceNo||"",addedBy:user.email,notes:r.notes||"Stock received",stockAfter:newStock,_createdAt:ts()});
      }));
      showToast(`Stock added for ${valid.length} material${valid.length!==1?"s":""} ✓`);
      setAddStockRows([{materialId:"",qty:"",supplier:"",invoiceNo:"",notes:""}]);setAddStockDate(today());
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  // Admin: physical stock correction
  const saveAdjustment=async(matId,correctedQty,reason)=>{
    const mat=materials.find(m=>m.id===matId);
    if(!mat)return;
    const qty=parseFloat(correctedQty);
    if(isNaN(qty)||qty<0)return showToast("Enter valid quantity","error");
    const diff=qty-(parseFloat(mat.currentStock)||0);
    await C("rm_stock_materials").doc(matId).update({currentStock:qty,updatedAt:ts()});
    await C("rm_stock_transactions").add({materialId:matId,materialName:mat.name,unit:mat.unit,type:"adjustment",qty:Math.abs(diff),adjustedTo:qty,date:today(),addedBy:user.email,notes:reason||"Physical stock correction",stockAfter:qty,_createdAt:ts()});
    showToast("Stock corrected ✓");
  };

  const delMaterial=async(id)=>{if(!confirm("Delete this material and all its transactions?"))return;
    const txn=transactions.filter(t=>t.materialId===id);
    await Promise.all(txn.map(t=>C("rm_stock_transactions").doc(t.id).delete()));
    await C("rm_stock_materials").doc(id).delete();showToast("Deleted","error");};

  // Stock status
  const stockStatus=(mat)=>{
    const curr=parseFloat(mat.currentStock)||0;
    const reorder=parseFloat(mat.reorderLevel)||0;
    if(curr<=0)return{color:"#ef4444",label:"Out of Stock",bg:"#450a0a"};
    if(reorder>0&&curr<=reorder)return{color:"#f59e0b",label:"Low Stock",bg:"#422006"};
    if(reorder>0&&curr<=reorder*1.5)return{color:"#eab308",label:"Near Reorder",bg:"#422006"};
    return{color:"#22c55e",label:"In Stock",bg:"#052e16"};
  };

  const fm=materials.filter(m=>{
    const q=normalize(search);
    const cs=filterCat==="All"||m.category===filterCat;
    const ms=!q||normalize(m.name||"").includes(q)||normalize(m.supplier||"").includes(q);
    return cs&&ms;
  });

  const lowCount=materials.filter(m=>{const s=stockStatus(m);return s.label==="Low Stock"||s.label==="Out of Stock";}).length;

  const txnType={consumption:{color:"#ef4444",icon:"📉"},addition:{color:"#22c55e",icon:"📈"},adjustment:{color:"#f59e0b",icon:"⚖️"},opening:{color:"#3b82f6",icon:"🔓"}};

  return <div>
    <SectionHead title="🏪 Raw Material Stock"/>

    {/* Summary bar */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px",marginBottom:"14px"}}>
      {[["📦 Total Materials",materials.length,"#3b82f6"],["⚠️ Low / Out",lowCount,"#ef4444"],["✅ In Stock",materials.length-lowCount,"#22c55e"]].map(([l,v,c])=>(
        <div key={l} style={{background:"#0b1220",border:`1px solid ${c}30`,borderRadius:"10px",padding:"12px 16px",textAlign:"center"}}>
          <div style={{fontSize:"22px",fontWeight:"700",color:c}}>{v}</div>
          <div style={{fontSize:"11px",color:"#64748b",marginTop:"2px"}}>{l}</div>
        </div>
      ))}
    </div>

    {/* Sub-tabs */}
    <div style={{display:"flex",gap:"4px",marginBottom:"14px",flexWrap:"wrap"}}>
      {[["stock","📊 Stock Levels"],["consume","📉 Record Consumption"],[isAdmin?"addstock":"","📈 Add Received Stock"],[isAdmin?"addmat":"","➕ Add Material"],[isAdmin?"importexport":"","📤 Export / Import"],["history","🕐 History"]].filter(([k])=>k).map(([key,label])=>(
        <button key={key} onClick={()=>setSubTab(key)} style={{background:subTab===key?"#1e293b":"transparent",border:`1px solid ${subTab===key?"#38bdf8":"#1e293b"}`,color:subTab===key?"#38bdf8":"#475569",borderRadius:"8px",padding:"6px 12px",cursor:"pointer",fontSize:"12.5px",fontWeight:"600"}}>{label}</button>
      ))}
    </div>

    {/* ── STOCK LEVELS ── */}
    {subTab==="stock"&&<>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"12px"}}>
        <input placeholder="Search material…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"7px 10px",fontSize:"12.5px"}}/>
        <select value={filterCat} onChange={e=>{setFilterCat(e.target.value);if(e.target.value!=="All")setGroupByCat(false);}} style={{...sl,width:"140px",padding:"7px 6px",fontSize:"12px"}}>
          <option value="All">All Categories</option>
          {CATS.map(c=><option key={c}>{c}</option>)}
        </select>
        {/* Group by category toggle — only when showing All */}
        {filterCat==="All"&&<button onClick={()=>setGroupByCat(g=>!g)}
          style={{background:groupByCat?"#1e3a5f":"transparent",border:`1px solid ${groupByCat?"#38bdf8":"#1e293b"}`,color:groupByCat?"#38bdf8":"#475569",borderRadius:"8px",padding:"6px 12px",cursor:"pointer",fontSize:"12px",fontWeight:"600",whiteSpace:"nowrap"}}>
          {groupByCat?"📂 Grouped by Category":"📋 Flat List"}
        </button>}
        <span style={{fontSize:"11px",color:"#334155"}}>{fm.length} material{fm.length!==1?"s":""}</span>
        {isAdmin&&<div style={{marginLeft:"auto",display:"flex",gap:"6px"}}>
          <Btn label="📉 Consume" onClick={()=>setSubTab("consume")} color="#ef4444" small/>
          <Btn label="📈 Add Stock" onClick={()=>setSubTab("addstock")} color="#22c55e" small/>
          <Btn label="➕ Material" onClick={()=>setSubTab("addmat")} color="#38bdf8" small/>
        </div>}
      </div>
      {loading&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading…</div>}
      {!loading&&fm.length===0&&<div style={{textAlign:"center",padding:"50px 0"}}><div style={{fontSize:"36px"}}>🏪</div><div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>{isAdmin?"No materials yet. Click ➕ Add Material.":"No materials found."}</div></div>}

      {/* ── Flat list ── */}
      {fm.length>0&&!groupByCat&&<div style={{border:"1px solid #1e293b",borderRadius:"10px",overflow:"hidden"}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 100px 80px 80px",background:"#0b1220",padding:"8px 14px",gap:"8px"}}>
          {["Material","Category","Supplier","Current Stock","Reorder Level","Status"].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
        </div>
        {fm.map((m,i)=><StockRow key={m.id} m={m} i={i} isAdmin={isAdmin} saveAdjustment={saveAdjustment} delMaterial={delMaterial}/>)}
      </div>}

      {fm.length>0&&groupByCat&&<StockGroupedView fm={fm} isAdmin={isAdmin} saveAdjustment={saveAdjustment}/>}
    </>}

    {/* ── RECORD CONSUMPTION ── */}
    {subTab==="consume"&&<div>
      <InfoBox color="#ef4444">Select a category to see all its materials. Enter quantities consumed — only filled rows will be saved.</InfoBox>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"14px"}}>
        <Field label="Date"><input type="date" style={inp} value={consumeDate} onChange={e=>setConsumeDate(e.target.value)}/></Field>
        <Field label="Filter by Category">
          <select style={sl} value={filterCat} onChange={e=>{setFilterCat(e.target.value);}}>
            <option value="All">All Categories</option>
            {CATS.map(c=><option key={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="Common Notes (optional)"><input style={inp} value={consumeRows[0]?.notes||""} onChange={e=>setConsumeRows(consumeRows.map(r=>({...r,notes:e.target.value})))} placeholder="e.g. Batch 0042, daily use"/></Field>
      </div>

      {/* Category-grouped consumption grid */}
      {(filterCat==="All"?CATS:[filterCat]).map(cat=>{
        const catMats=materials.filter(m=>(m.category||"Uncategorised")===cat);
        if(!catMats.length) return null;
        return <div key={cat} style={{border:"1px solid #1e293b",borderRadius:"10px",overflow:"hidden",marginBottom:"10px"}}>
          <div style={{background:"#0f1d35",padding:"8px 14px",display:"flex",alignItems:"center",gap:"10px",borderBottom:"1px solid #1e3a5f"}}>
            <span style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd"}}>{cat}</span>
            <span style={{fontSize:"11px",color:"#475569"}}>{catMats.length} material{catMats.length!==1?"s":""}</span>
            <button onClick={()=>{
              const ids=catMats.map(m=>m.id);
              setConsumeRows(prev=>{
                const newRows=[...prev];
                ids.forEach(id=>{if(!newRows.find(r=>r.materialId===id))newRows.push({materialId:id,qty:"",notes:prev[0]?.notes||""});});
                return newRows;
              });
            }} style={{background:"#0f1d35",border:"1px solid #2563eb40",borderRadius:"5px",padding:"2px 8px",color:"#93c5fd",cursor:"pointer",fontSize:"11px",marginLeft:"auto"}}>+ Add All</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"2fr 120px 100px",background:"#0b1220",padding:"5px 12px",gap:"8px"}}>
            {["Material (Current Stock)","Qty Used",""].map((h,i)=><div key={i} style={{fontSize:"9px",fontWeight:"700",color:"#334155",textTransform:"uppercase"}}>{h}</div>)}
          </div>
          {catMats.map(m=>{
            const row=consumeRows.find(r=>r.materialId===m.id);
            const stock=parseFloat(m.currentStock||0);
            const qty=parseFloat(row?.qty||0);
            const isLow=stock<=0||(parseFloat(m.reorderLevel||0)>0&&stock<=parseFloat(m.reorderLevel||0));
            const willExceed=qty>stock;
            return <div key={m.id} style={{display:"grid",gridTemplateColumns:"2fr 120px 100px",padding:"7px 12px",gap:"8px",borderTop:"1px solid #1e293b",alignItems:"center",background:row?.qty?qty>0?"#060d0d":"#080d18":"#080d18"}}>
              <div>
                <div style={{fontSize:"12px",color:"#e2e8f0",fontWeight:row?.qty?"600":"400"}}>{m.name}</div>
                <div style={{fontSize:"10.5px",color:isLow?"#ef4444":"#475569"}}>
                  Stock: {stock.toFixed(2)} {m.unit} {isLow&&"⚠️ Low"}
                </div>
              </div>
              <div style={{display:"flex",gap:"4px",alignItems:"center"}}>
                <input style={{...sml,textAlign:"center",borderColor:willExceed?"#ef4444":row?.qty?"#22c55e30":"#1e293b",background:willExceed?"#2d0a0a":"#0b1220"}}
                  type="number" min="0" step="0.01"
                  value={row?.qty||""}
                  onChange={e=>{
                    const val=e.target.value;
                    setConsumeRows(prev=>{
                      const exists=prev.find(r=>r.materialId===m.id);
                      if(exists) return prev.map(r=>r.materialId===m.id?{...r,qty:val}:r);
                      return [...prev,{materialId:m.id,qty:val,notes:prev[0]?.notes||""}];
                    });
                  }}
                  placeholder="0"/>
                <span style={{fontSize:"10px",color:"#475569",whiteSpace:"nowrap"}}>{m.unit}</span>
              </div>
              {willExceed
                ?<div style={{fontSize:"10px",color:"#ef4444"}}>⚠️ Exceeds stock</div>
                :row?.qty&&qty>0
                  ?<div style={{fontSize:"10px",color:"#22c55e"}}>→ {(stock-qty).toFixed(2)} {m.unit} left</div>
                  :<div/>}
            </div>;
          })}
        </div>;
      })}

      <div style={{display:"flex",gap:"8px",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",marginTop:"4px"}}>
        <div style={{fontSize:"12px",color:"#475569"}}>
          {consumeRows.filter(r=>r.materialId&&parseFloat(r.qty)>0).length} material{consumeRows.filter(r=>r.materialId&&parseFloat(r.qty)>0).length!==1?"s":""} to record
        </div>
        <div style={{display:"flex",gap:"8px"}}>
          <Btn label="Clear All" onClick={()=>setConsumeRows([{materialId:"",qty:"",notes:""}])} outline color="#475569" small/>
          <Btn label={saving?"Saving…":"📉 Save Consumption"} onClick={saveConsumption} disabled={saving} color="#ef4444"/>
        </div>
      </div>
    </div>}

    {/* ── ADD RECEIVED STOCK ── */}
    {subTab==="addstock"&&isAdmin&&<div>
      <InfoBox color="#22c55e">Record stock received from supplier. Stock will be added to current balance.</InfoBox>
      <Grid2 style={{marginBottom:"12px"}}>
        <Field label="Date Received"><input type="date" style={inp} value={addStockDate} onChange={e=>setAddStockDate(e.target.value)}/></Field>
      </Grid2>
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"8px"}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 100px 1.5fr 1fr 1fr 28px",background:"#0b1220",padding:"7px 12px",gap:"8px"}}>
          {["Material","Qty Received","Supplier","Invoice No","Notes",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
        </div>
        {addStockRows.map((row,i)=>{
          const mat=materials.find(m=>m.id===row.materialId);
          return <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 100px 1.5fr 1fr 1fr 28px",padding:"7px 12px",gap:"8px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
            <select style={sl} value={row.materialId} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,materialId:e.target.value}:r))}>
              <option value="">— Select Material —</option>
              {materials.map(m=><option key={m.id} value={m.id}>{m.name} ({m.unit})</option>)}
            </select>
            <div style={{display:"flex",gap:"4px",alignItems:"center"}}>
              <input style={{...sml,textAlign:"center"}} type="number" min="0" step="0.01" value={row.qty} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,qty:e.target.value}:r))} placeholder="0"/>
              {mat&&<span style={{fontSize:"10px",color:"#475569"}}>{mat.unit}</span>}
            </div>
            <input style={sml} value={row.supplier} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,supplier:e.target.value}:r))} placeholder="Supplier name"/>
            <input style={sml} value={row.invoiceNo} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,invoiceNo:e.target.value}:r))} placeholder="Invoice #"/>
            <input style={sml} value={row.notes} onChange={e=>setAddStockRows(addStockRows.map((r,idx)=>idx===i?{...r,notes:e.target.value}:r))} placeholder="Notes"/>
            <button onClick={()=>setAddStockRows(addStockRows.filter((_,idx)=>idx!==i))} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
          </div>;
        })}
      </div>
      <div style={{display:"flex",gap:"8px",justifyContent:"space-between",flexWrap:"wrap"}}>
        <button onClick={()=>setAddStockRows([...addStockRows,{materialId:"",qty:"",supplier:"",invoiceNo:"",notes:""}])} style={{background:"none",border:"1px dashed #1e293b",borderRadius:"6px",padding:"5px 12px",color:"#475569",cursor:"pointer",fontSize:"12px"}}>+ Add Row</button>
        <Btn label={saving?"Saving…":"📈 Save Stock Addition"} onClick={saveStockAddition} disabled={saving} color="#22c55e"/>
      </div>
    </div>}

    {/* ── ADD MATERIAL ── */}
    {subTab==="addmat"&&isAdmin&&<div>
      {!showAddMat&&!editMat&&<div style={{display:"flex",justifyContent:"flex-end",marginBottom:"10px"}}><Btn label="➕ Add New Material" onClick={()=>setShowAddMat(true)} color="#38bdf8"/></div>}
      {(showAddMat||editMat)&&<div style={{background:"#080d18",border:"1px solid #38bdf830",borderRadius:"12px",padding:"18px",marginBottom:"16px"}}>
        <div style={{fontSize:"13px",fontWeight:"700",color:"#38bdf8",marginBottom:"14px"}}>{editMat?"✏️ Edit Material":"➕ New Raw Material"}</div>
        <Grid3>
          <Field label="Material Name *"><input style={inp} value={matForm.name} onChange={e=>setMatForm({...matForm,name:e.target.value})} placeholder="e.g. TiO2 White"/></Field>
          <div>
            <div style={{fontSize:"10.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px",display:"flex",alignItems:"center",gap:"8px"}}>Category {onAddRmCat&&<QuickAdd label="Category" onAdd={v=>{if(onAddRmCat)onAddRmCat(v);}} color="#f97316"/>}</div>
            <select style={sl} value={matForm.category} onChange={e=>setMatForm({...matForm,category:e.target.value})}>
              {CATS.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <div style={{fontSize:"10.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px",display:"flex",alignItems:"center",gap:"8px"}}>Unit {onAddUnit&&<QuickAdd label="Unit" onAdd={onAddUnit} color="#38bdf8"/>}</div>
            <select style={sl} value={matForm.unit} onChange={e=>setMatForm({...matForm,unit:e.target.value})}>
              {UNITS.map(u=><option key={u}>{u}</option>)}
            </select>
          </div>
        </Grid3>
        <Grid3>
          <Field label={editMat?"Current Stock (direct edit)":"Opening Stock"}><input style={inp} type="number" value={matForm.openingStock} onChange={e=>setMatForm({...matForm,openingStock:e.target.value})} placeholder="0"/></Field>
          <Field label="Reorder Level (alert when below)"><input style={inp} type="number" value={matForm.reorderLevel} onChange={e=>setMatForm({...matForm,reorderLevel:e.target.value})} placeholder="e.g. 50"/></Field>
          <Field label="Supplier Name"><input style={inp} value={matForm.supplier} onChange={e=>setMatForm({...matForm,supplier:e.target.value})} placeholder="Supplier company"/></Field>
        </Grid3>
        <Field label="Notes"><input style={inp} value={matForm.notes} onChange={e=>setMatForm({...matForm,notes:e.target.value})} placeholder="Any notes about this material"/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
          <Btn label="Cancel" onClick={()=>{setShowAddMat(false);setEditMat(null);setMatForm({...blankMat});}} outline color="#475569" small/>
          <Btn label={saving?"Saving…":editMat?"💾 Update":"✓ Add Material"} onClick={()=>saveMaterial(!!editMat)} disabled={saving} color="#38bdf8" small/>
        </div>
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {materials.map(m=><div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0f172a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 14px"}}>
          <div>
            <span style={{fontSize:"13px",fontWeight:"600",color:"#e2e8f0"}}>{m.name}</span>
            <span style={{fontSize:"11px",color:"#475569",marginLeft:"10px"}}>{m.category} · {m.unit}</span>
            {m.supplier&&<span style={{fontSize:"11px",color:"#475569",marginLeft:"6px"}}>· {m.supplier}</span>}
          </div>
          <div style={{display:"flex",gap:"6px"}}>
            <button onClick={()=>{setEditMat(m);setMatForm({name:m.name,category:m.category,unit:m.unit,openingStock:m.currentStock,reorderLevel:m.reorderLevel||"",supplier:m.supplier||"",notes:m.notes||""});setShowAddMat(false);}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"5px",color:"#93c5fd",cursor:"pointer",fontSize:"12px",padding:"3px 8px"}}>✏️</button>
            <button onClick={()=>delMaterial(m.id)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px"}}>🗑</button>
          </div>
        </div>)}
      </div>
    </div>}

    {/* ── HISTORY ── */}
    {subTab==="history"&&<div>
      <div style={{fontSize:"12px",color:"#475569",marginBottom:"12px"}}>Showing last {Math.min(transactions.length,100)} transactions</div>
      {transactions.length===0&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>No transactions yet.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:"4px"}}>
        {transactions.slice(0,100).map(t=>{
          const tt=txnType[t.type]||{color:"#94a3b8",icon:"📋"};
          const sign=t.type==="consumption"?"−":t.type==="addition"||t.type==="opening"?"+":"⚖";
          return <div key={t.id} style={{display:"flex",gap:"10px",alignItems:"center",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"8px 14px"}}>
            <span style={{fontSize:"16px",flexShrink:0}}>{tt.icon}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",gap:"8px",alignItems:"baseline",flexWrap:"wrap"}}>
                <span style={{fontSize:"13px",fontWeight:"600",color:"#e2e8f0"}}>{t.materialName}</span>
                <span style={{fontSize:"12px",fontWeight:"700",color:tt.color}}>{sign}{t.qty} {t.unit||""}</span>
                {t.type==="adjustment"&&<span style={{fontSize:"11px",color:"#f59e0b"}}>→ {t.adjustedTo} {t.unit||""}</span>}
                <span style={{fontSize:"11px",color:"#334155",marginLeft:"auto"}}>Stock after: {parseFloat(t.stockAfter||0).toFixed(2)} {t.unit||""}</span>
              </div>
              <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>
                {t.date} · {t.addedBy} · {t.notes||""}
                {t.supplier&&<span> · {t.supplier}</span>}
                {t.invoiceNo&&<span> · #{t.invoiceNo}</span>}
              </div>
            </div>
            <span style={{fontSize:"10px",fontWeight:"700",background:tt.color+"20",color:tt.color,padding:"2px 7px",borderRadius:"99px",flexShrink:0,textTransform:"capitalize"}}>{t.type}</span>
          </div>;
        })}
      </div>
    </div>}

    {/* ── EXPORT / IMPORT ── */}
    {subTab==="importexport"&&isAdmin&&<RMExportImport materials={materials} CATS={CATS} UNITS={UNITS} user={user} showToast={showToast} onImport={async(rows)=>{
      // rows: [{name,category,unit,openingStock,reorderLevel,supplier,notes}]

      // ── Step 1: Auto-create any new categories and units from the CSV ──
      const newCats=[...new Set(rows.map(r=>(r.category||"").trim()).filter(Boolean))]
        .filter(cat=>cat&&!CATS.includes(cat));
      const newUnits=[...new Set(rows.map(r=>(r.unit||"").trim()).filter(Boolean))]
        .filter(u=>u&&!UNITS.includes(u));

      for(const cat of newCats){
        if(onAddRmCat) await onAddRmCat(cat);
      }
      for(const unit of newUnits){
        if(onAddUnit) await onAddUnit(unit);
      }

      // ── Step 2: Import materials ──
      let added=0, skipped=0;
      for(const row of rows){
        if(!row.name||!row.name.trim()){skipped++;continue;}
        const existing=materials.find(m=>normalize(m.name)===normalize(row.name));
        if(existing){
          await C("rm_stock_materials").doc(existing.id).update({
            category:row.category||existing.category,unit:row.unit||existing.unit,
            reorderLevel:row.reorderLevel||existing.reorderLevel,supplier:row.supplier||existing.supplier,
            notes:row.notes||existing.notes,updatedAt:ts()
          });
          added++;
        }else{
          const qty=parseFloat(row.openingStock)||0;
          const docRef=await C("rm_stock_materials").add({...row,currentStock:qty,addedBy:user.email,_createdAt:ts()});
          if(qty>0)await C("rm_stock_transactions").add({materialId:docRef.id,materialName:row.name,type:"opening",qty,date:today(),addedBy:user.email,notes:"Imported opening stock",stockAfter:qty,_createdAt:ts()});
          added++;
        }
      }
      const catMsg=newCats.length?` · ${newCats.length} new categor${newCats.length===1?"y":"ies"} added`:"";
      const unitMsg=newUnits.length?` · ${newUnits.length} new unit${newUnits.length===1?"":"s"} added`:"";
      showToast(`Imported: ${added} materials${skipped?`, ${skipped} skipped`:""}${catMsg}${unitMsg} ✓`);
    }}/>}
  </div>;
}

// BOM (Bill of Materials) MODULE

// BOM Form component — stable to avoid cursor loss
function BOMForm({form,setForm,saving,isEdit,onCancel,onSave,sysProducts,sysQcParams}){
  // Helper: build BOM QC params from Settings QC params for a category
  const buildQCFromSettings=(category)=>{
    const settingsParams=(sysQcParams||DEFAULT_QC_PARAMS)[category]||[];
    return settingsParams.map(p=>{
      const pName=typeof p==="string"?p:(p.name||"");
      const existing=(form.qcTests||[]).find(q=>q.name===pName);
      return {id:existing?.id||newId(), name:pName, standard:existing?.standard||""};
    });
  };
  const syncQCFromSettings=()=>{
    const synced=buildQCFromSettings(form.category);
    if(!synced.length)return;
    setForm({...form,qcTests:synced});
  };
  const addIng=()=>setForm(f=>({...f,ingredients:[...f.ingredients,{id:newId(),name:"",standardQty:"",isProcess:false}]}));
  const addProcess=()=>setForm(f=>({...f,ingredients:[...f.ingredients,{id:newId(),name:"",isProcess:true}]}));
  const updIng=(id,field,val)=>setForm(f=>({...f,ingredients:f.ingredients.map(i=>i.id===id?{...i,[field]:val}:i)}));
  const delIng=(id)=>setForm(f=>({...f,ingredients:f.ingredients.filter(i=>i.id!==id)}));
  const moveIng=(idx,dir)=>setForm(f=>{const arr=[...f.ingredients];const to=idx+dir;if(to<0||to>=arr.length)return f;[arr[idx],arr[to]]=[arr[to],arr[idx]];return{...f,ingredients:arr};});

  return <div>
    <Grid3>
      <div>
        <div style={{fontSize:"10.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"5px"}}>Product Name *</div>
        <CategoryProductSelect
          category={form.category}
          setCategory={cat=>{
            const newQC=buildQCFromSettings(cat);
            setForm({...form,category:cat,productName:"",qcTests:newQC.length?newQC:form.qcTests});
          }}
          productName={form.productName}
          setProductName={p=>setForm({...form,productName:typeof p==="string"?p:(p?.name||p)})}
          products={sysProducts}
          catUnits={{}}
        />
        {!form.productName&&<div style={{fontSize:"10.5px",color:"#334155",marginTop:"4px"}}>Select category first, then product</div>}
      </div>
      <Field label="Category (auto-filled)"><input style={{...inp,color:"#64748b"}} value={form.category} readOnly placeholder="Auto-fills from product"/></Field>
      <Grid2>
        <Field label="Base Batch Size"><input style={inp} type="number" value={form.baseBatchSize} onChange={e=>setForm({...form,baseBatchSize:e.target.value})} placeholder="100"/></Field>
        <Field label="Unit"><select style={sl} value={form.baseUnit} onChange={e=>setForm({...form,baseUnit:e.target.value})}>{["L","kg","g","mL"].map(u=><option key={u}>{u}</option>)}</select></Field>
      </Grid2>
    </Grid3>

    {/* Ingredients / Process steps */}
    <div style={{marginBottom:"14px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>Ingredients & Process Steps</div>
      <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"6px"}}>
        <div style={{display:"grid",gridTemplateColumns:"28px 2fr 100px 1.2fr 50px 28px",background:"#0b1220",padding:"6px 10px",gap:"6px"}}>

          style={{background:"none",border:"1px dashed #334155",borderRadius:"6px",padding:"4px 10px",color:"#64748b",cursor:"pointer",fontSize:"12px"}}>+ Dhoyela</button>
        <button onClick={()=>setForm({...form,extraAdditions:{...(form.extraAdditions||{}),items:[...((form.extraAdditions||{}).items||[]),"Extra Output"]}})}
          style={{background:"none",border:"1px dashed #2563eb50",borderRadius:"6px",padding:"4px 10px",color:"#93c5fd",cursor:"pointer",fontSize:"12px"}}>+ Extra Output</button>
        <button onClick={()=>setForm({...form,extraAdditions:{...(form.extraAdditions||{}),items:[...((form.extraAdditions||{}).items||[]),""]}})}

// Print dialog component — extracted to avoid remount
function PrintDialog({bom,packSizes,sysQcParams,onClose}){
  const [batchSize,setBatchSize]=useState(bom.baseBatchSize||"100");
  const [batchNo,setBatchNo]=useState("");
  const storedExtra=bom.extraAdditions||{items:["Dhoyela","Extra Output","Dhoyela"],blankRows:2};
  const [extraItems,setExtraItems]=useState([...(storedExtra.items||["Dhoyela","Extra Output","Dhoyela"])]);
  const [blankRows,setBlankRows]=useState(storedExtra.blankRows!=null?storedExtra.blankRows:2);
  const [oldStocks,setOldStocks]=useState([]);
  const addItem=(label)=>setExtraItems(v=>[...v,label]);
  const removeItem=(i)=>setExtraItems(v=>v.filter((_,idx)=>idx!==i));

  // Fetch available old/rejected stock for this exact product only
  useEffect(()=>{
    C("old_stock").where("status","==","Available").get()
      .then(snap=>{
        const all=snap.docs.map(d=>({id:d.id,...d.data()}));
        const matched=all.filter(s=>s.productName&&bom.productName&&
          s.productName.trim().toLowerCase()===bom.productName.trim().toLowerCase());
        setOldStocks(matched);
      }).catch(()=>{});
  },[bom.productName]);

  return <div style={{background:"#0b1220",border:"1px solid #3b82f6",borderRadius:"10px",padding:"16px",marginBottom:"14px"}}>
    <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"12px"}}>🖨 Print Production Sheet — {bom.productName}</div>
    <Grid2>
      <Field label={"Batch Size ("+bom.baseUnit+") *"}><input style={inp} type="number" value={batchSize} onChange={e=>setBatchSize(e.target.value)} placeholder={bom.baseBatchSize}/></Field>
      <Field label="Batch No"><input style={inp} value={batchNo} onChange={e=>setBatchNo(e.target.value)} placeholder="e.g. 0042"/></Field>
    </Grid2>
    <div style={{fontSize:"11px",color:"#475569",marginBottom:"12px"}}>Filling Date and Charging Date will be filled manually on the printed sheet.</div>

    {/* Extra Additions config */}
    <div style={{background:"#080d18",border:"1px solid #1e293b",borderRadius:"8px",padding:"12px",marginBottom:"12px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>Extra Additions Rows</div>
      <div style={{display:"flex",flexDirection:"column",gap:"4px",marginBottom:"8px"}}>
        {extraItems.map((item,i)=><div key={i} style={{display:"flex",gap:"6px",alignItems:"center"}}>
          <input style={{...sml,flex:1}} value={item} onChange={e=>setExtraItems(v=>v.map((x,idx)=>idx===i?e.target.value:x))} placeholder="Row label"/>
          <button onClick={()=>removeItem(i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:"0 2px"}}>×</button>
        </div>)}
      </div>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
        <button onClick={()=>addItem("Dhoyela")} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",padding:"4px 10px",color:"#22c55e",cursor:"pointer",fontSize:"11px"}}>+ Dhoyela</button>
        <button onClick={()=>addItem("Extra Output")} style={{background:"#0f1d35",border:"1px solid #2563eb40",borderRadius:"6px",padding:"4px 10px",color:"#93c5fd",cursor:"pointer",fontSize:"11px"}}>+ Extra Output</button>
        <button onClick={()=>addItem("")} style={{background:"none",border:"1px dashed #334155",borderRadius:"6px",padding:"4px 10px",color:"#475569",cursor:"pointer",fontSize:"11px"}}>+ Custom Row</button>
        <div style={{display:"flex",alignItems:"center",gap:"6px",marginLeft:"auto"}}>
          <span style={{fontSize:"11px",color:"#475569"}}>Extra blank rows:</span>
          <input type="number" min="0" max="8" value={blankRows} onChange={e=>setBlankRows(parseInt(e.target.value)||0)} style={{...sml,width:"48px",textAlign:"center"}}/>
        </div>
      </div>
    </div>

    {/* Old/rejected stock preview */}
    {oldStocks.length>0&&<div style={{background:"#1a0a00",border:"1px solid #f59e0b40",borderRadius:"8px",padding:"10px 12px",marginBottom:"12px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>📦 Old/Rejected Material (will print on sheet)</div>
      {oldStocks.map(s=><div key={s.id} style={{fontSize:"11px",color:"#fcd34d",padding:"2px 0"}}>
        • {s.productName} — {s.qty} {s.unit||""}  {s.notes?`(${s.notes})`:""}
      </div>)}
    </div>}

    <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
      <Btn label="Cancel" onClick={onClose} outline color="#475569" small/>
      <Btn label="🖨 Open Print Preview" onClick={()=>{printProductionSheet(bom,batchSize,batchNo,"","","",packSizes,"",{items:extraItems,blankRows},sysQcParams,oldStocks);onClose();}} color="#22c55e" small/>
    </div>
  </div>;
}

function BOMTab({role,roles,user,showToast,sysProducts,sysPackSizes,sysQcParams}){
  const isAdmin=roles.includes("admin");
  const canEdit=roles.some(r=>["admin","qc","issuer"].includes(r));
  const directPrintBOM=async(b)=>{
    let oldStocksForPrint=[];
    try{
      const osSnap=await C("old_stock").where("status","==","Available").get();
      const allOs=osSnap.docs.map(d=>({id:d.id,...d.data()}));
      oldStocksForPrint=allOs.filter(s=>s.productName&&b.productName&&
        s.productName.trim().toLowerCase()===b.productName.trim().toLowerCase());
    }catch(_){}
    printProductionSheet(b,b.baseBatchSize,"","","","",sysPackSizes,"",b.extraAdditions||{},sysQcParams,oldStocksForPrint);
  };
  const [boms,setBoms]=useState([]);
  const [versions,setVersions]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState("");
  const [filterCat,setFilterCat]=useState("All");
  const [groupByCat,setGroupByCat]=useState(true);
  const [activeBOM,setActiveBOM]=useState(null);
  const [showCreate,setShowCreate]=useState(false);
  const [saving,setSaving]=useState(false);

  const defaultQCParams=(category)=>{
    const settingsParams=category&&(sysQcParams||DEFAULT_QC_PARAMS)[category];
    if(settingsParams?.length) return settingsParams.map(p=>({id:newId(),name:typeof p==="string"?p:(p.name||""),standard:""}));
    return [{id:newId(),name:"SD (Drying)",standard:""},{id:newId(),name:"TF (Drying)",standard:""},{id:newId(),name:"HD (Drying)",standard:""},{id:newId(),name:"Colour",standard:""},{id:newId(),name:"Finish",standard:""},{id:newId(),name:"Viscosity",standard:""},{id:newId(),name:"Specific Gravity",standard:""}];
  };
  const blankBOM={productName:"",category:"",baseBatchSize:"100",baseUnit:"L",
    ingredients:[{id:newId(),name:"",standardQty:"",isProcess:false}],
    qcTests:defaultQCParams(""),
    packingSizes:[],
    extraAdditions:{items:["Dhoyela","Extra Output","Dhoyela"],blankRows:2}};
  const [form,setForm]=useState({...blankBOM});

  useEffect(()=>{
    const u1=C("bom_products").orderBy("productName").onSnapshot(s=>{setBoms(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},()=>setLoading(false));
    const u2=C("bom_versions").orderBy("archivedAt","desc").onSnapshot(s=>setVersions(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});
    return()=>{u1();u2();};
  },[]);

  const saveBOM=async(isEdit=false,editId=null)=>{
    if(!form.productName.trim())return showToast("Product name required","error");
    setSaving(true);
    try{
      if(isEdit&&editId){
        // Archive current version first
        const curr=boms.find(b=>b.id===editId);
        if(curr){
          await C("bom_versions").add({...curr,productId:editId,archivedAt:ts(),archivedBy:user.email});
        }
        const newVer=(curr?.currentVersion||1)+1;
        await C("bom_products").doc(editId).update({...form,currentVersion:newVer,updatedBy:user.email,updatedAt:ts()});
        showToast(`BOM updated to v${newVer} — previous version archived ✓`);
      }else{
        await C("bom_products").add({...form,currentVersion:1,createdBy:user.email,createdAt:ts(),updatedAt:ts()});
        showToast("BOM created ✓");
      }
      setShowCreate(false);setActiveBOM(null);setForm({...blankBOM});
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const deleteBOM=async(id)=>{
    if(!confirm("Delete this BOM and all its version history?"))return;
    const vids=versions.filter(v=>v.productId===id).map(v=>v.id);
    await Promise.all(vids.map(vid=>C("bom_versions").doc(vid).delete()));
    await C("bom_products").doc(id).delete();
    showToast("BOM deleted","error");setActiveBOM(null);
  };

  const exportAllBOMs=()=>{
    if(!boms.length)return showToast("No BOMs to export","error");
    const rows=[["Product Name","Category","Base Batch Size","Unit","Version","Last Updated","Ingredient No","Ingredient/Step","Standard Qty","Is Process Step","SD","TF","HD","Colour","Finish","Viscosity","SG","Remarks"]];
    boms.forEach(b=>{
      const q=b.qcTests||{};
      (b.ingredients||[]).forEach((ing,i)=>{
        const qcSD=i===0?q.sd||"":"";const qcTF=i===0?q.tf||"":"";const qcHD=i===0?q.hd||"":"";
        const qcCol=i===0?q.colour||"":"";const qcFin=i===0?q.finish||"":"";
        const qcVis=i===0?q.viscosity||"":"";const qcSG=i===0?q.sg||"":"";const qcRem=i===0?q.remarks||"":"";
        rows.push([b.productName,b.category||"",b.baseBatchSize||100,b.baseUnit||"L",b.currentVersion||1,b.updatedAt?.toDate?.()?.toLocaleDateString("en-IN")||"",i+1,ing.name||"",ing.isProcess?"":ing.standardQty||"",ing.isProcess?"Yes":"No",qcSD,qcTF,qcHD,qcCol,qcFin,qcVis,qcSG,qcRem]);
      });
    });
    const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`GCC_BOMs_${today()}.csv`;a.click();
    showToast("BOMs exported ✓");
  };

  const cats=[...new Set(boms.map(b=>b.category).filter(Boolean))].sort();
  const fb=boms.filter(b=>{
    const q=normalize(search);
    const cs=filterCat==="All"||b.category===filterCat;
    return cs&&(!q||normalize(b.productName||"").includes(q));
  });
  // When grouped: sort by category then product name
  const fbSorted=groupByCat?[...fb].sort((a,b)=>{const cc=(a.category||"").localeCompare(b.category||"");return cc||a.productName.localeCompare(b.productName);}):[...fb];
  // Group into {cat: [boms]}
  const grouped=fbSorted.reduce((acc,b)=>{const c=b.category||"(No Category)";if(!acc[c])acc[c]=[];acc[c].push(b);return acc;},{});

  const renderBOMCard=(b,isLastInGroup=false)=>{
    const isOpen=activeBOM?.bom?.id===b.id;
    const mode=activeBOM?.mode;
    const bVersions=versions.filter(v=>v.productId===b.id).sort((a,z)=>z.currentVersion-a.currentVersion);
    const totalIngr=(b.ingredients||[]).filter(i=>!i.isProcess).length;
    const totalStd=(b.ingredients||[]).filter(i=>!i.isProcess).reduce((s,i)=>s+(parseFloat(i.standardQty)||0),0);
    const borderStyle=groupByCat&&filterCat==="All"
      ?{border:"none",borderLeft:"3px solid #3b82f6",borderBottom:isLastInGroup?"none":"1px solid #1e293b",borderRadius:0,marginBottom:0}
      :{border:"1px solid #1e293b",borderLeft:"3px solid #3b82f6",borderRadius:"12px",marginBottom:"10px"};
    return <div key={b.id} style={{background:"#0f172a",overflow:"hidden",...borderStyle}}>
        {/* Card header */}
        <div style={{padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}>
          <div style={{flex:1,cursor:"pointer"}} onClick={()=>setActiveBOM(isOpen&&mode==="view"?null:{bom:b,mode:"view"})}>
            <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9"}}>{b.productName}</div>
            <div style={{fontSize:"11.5px",color:"#475569",marginTop:"2px"}}>
              {(!groupByCat||filterCat!=="All")&&b.category&&<span>{b.category} · </span>}Base: {b.baseBatchSize} {b.baseUnit} · {totalIngr} ingredients · Total: {totalStd.toFixed(2)}{b.baseUnit} · v{b.currentVersion||1}
              {bVersions.length>0&&<span style={{color:"#64748b",marginLeft:"6px"}}>· {bVersions.length} archived version{bVersions.length!==1?"s":""}</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:"6px",flexShrink:0,flexWrap:"wrap"}}>
            <Btn label="🖨 Print" onClick={()=>directPrintBOM(b)} color="#22c55e" small/>
            {bVersions.length>0&&<Btn label={`📚 History (${bVersions.length})`} onClick={()=>setActiveBOM(isOpen&&mode==="history"?null:{bom:b,mode:"history"})} color="#64748b" small outline/>}
            {canEdit&&<Btn label="📋 Copy" onClick={()=>{
              const copied={...blankBOM,...b,
                productName:b.productName+" (Copy)",
                ingredients:b.ingredients?.map(i=>({...i,id:newId()})),
                qcTests:Array.isArray(b.qcTests)?b.qcTests.map(p=>({...p,id:newId()})):defaultQCParams(b.category),
                extraAdditions:b.extraAdditions||blankBOM.extraAdditions,
              };
              delete copied.id;delete copied.currentVersion;delete copied.batchSeq;
              setForm(copied);setShowCreate(true);setActiveBOM(null);
              setTimeout(()=>window.scrollTo({top:0,behavior:"smooth"}),100);
            }} color="#3b82f6" small outline/>}
            {canEdit&&<Btn label="✏️ Edit" onClick={()=>{setForm({...blankBOM,...b,ingredients:b.ingredients?.map(i=>({...i,id:i.id||newId()})),qcTests:Array.isArray(b.qcTests)?b.qcTests.map(p=>({...p,id:p.id||newId()})):defaultQCParams(b.category)});setActiveBOM({bom:b,mode:"edit"});setShowCreate(false);}} color="#f59e0b" small/>}
            {isAdmin&&<button onClick={()=>deleteBOM(b.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"14px"}}>🗑</button>}
          </div>
        </div>

        {/* Print dialog */}
        {isOpen&&mode==="print"&&<div style={{padding:"14px 16px",borderTop:"1px solid #1e293b",background:"#080d18"}}>
          <PrintDialog bom={b} packSizes={sysPackSizes} sysQcParams={sysQcParams} onClose={()=>setActiveBOM(null)}/>
        </div>}

        {/* Edit form */}
        {isOpen&&mode==="edit"&&<div style={{padding:"16px",borderTop:"1px solid #f59e0b30",background:"#080d18"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#f59e0b",marginBottom:"12px"}}>✏️ Editing: {b.productName} (currently v{b.currentVersion||1})</div>
          <BOMForm form={form} setForm={setForm} saving={saving} isEdit={true} onCancel={()=>{setActiveBOM(null);setForm({...blankBOM});}} onSave={()=>saveBOM(true,b.id)} sysProducts={sysProducts} sysQcParams={sysQcParams}/>
        </div>}

        {/* Version history */}
        {isOpen&&mode==="history"&&<div style={{padding:"14px 16px",borderTop:"1px solid #1e293b",background:"#080d18"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#64748b",marginBottom:"10px"}}>📚 BOM Version History — {b.productName}</div>
          <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
            {/* Current version */}
            <div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"8px",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <span style={{fontSize:"12px",fontWeight:"700",color:"#22c55e"}}>v{b.currentVersion||1} (Current)</span>
                <span style={{fontSize:"11px",color:"#64748b",marginLeft:"10px"}}>{(b.ingredients||[]).filter(i=>!i.isProcess).length} ingredients · Updated by {b.updatedBy||b.createdBy}</span>
              </div>
              <div style={{display:"flex",gap:"6px"}}>
                <Btn label="👁 View" onClick={()=>printProductionSheet(b,b.baseBatchSize,"","","","",sysPackSizes,"",b.extraAdditions||{},sysQcParams,null,true)} color="#3b82f6" small outline/>
                <Btn label="🖨 Print" onClick={()=>directPrintBOM(b)} color="#22c55e" small/>
              </div>
            </div>
            {/* Archived versions */}
            {bVersions.map(v=><div key={v.id} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}}>
              <div>
                <span style={{fontSize:"12px",fontWeight:"700",color:"#64748b"}}>v{v.currentVersion||"?"}</span>
                <span style={{fontSize:"11px",color:"#475569",marginLeft:"10px"}}>{(v.ingredients||[]).filter(i=>!i.isProcess).length} ingredients · Archived by {v.archivedBy||"—"}</span>
                <span style={{fontSize:"10px",color:"#334155",marginLeft:"8px"}}>{v.archivedAt?.toDate?.()?.toLocaleDateString("en-IN")||""}</span>
              </div>
              <div style={{display:"flex",gap:"6px"}}>
                <Btn label="👁 View" onClick={()=>printProductionSheet(v,v.baseBatchSize,"","","","",sysPackSizes,"",v.extraAdditions||{},sysQcParams,null,true)} color="#3b82f6" small outline/>
                <Btn label="🖨 Print this version" onClick={()=>printProductionSheet(v,v.baseBatchSize,"","","","",sysPackSizes,"",v.extraAdditions||{},sysQcParams)} color="#64748b" small outline/>
                {canEdit&&<Btn label="⬆ Restore as Current" onClick={async()=>{if(!confirm("Restore v"+v.currentVersion+" as current BOM? Current will be archived."))return;const curr=boms.find(x=>x.id===b.id);if(curr)await C("bom_versions").add({...curr,productId:b.id,archivedAt:ts(),archivedBy:user.email});await C("bom_products").doc(b.id).update({...v,currentVersion:(curr?.currentVersion||1)+1,updatedBy:user.email,updatedAt:ts()});await C("bom_versions").doc(v.id).delete();showToast("Version restored ✓");}} color="#f59e0b" small/>}
              </div>
            </div>)}
          </div>
        </div>}

        {/* Quick ingredient view */}
        {isOpen&&mode==="view"&&<div style={{padding:"14px 16px",borderTop:"1px solid #1e293b",background:"#080d18"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
            <div>
              <div style={{fontSize:"10px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>Ingredients / Process</div>
              <div style={{border:"1px solid #1e293b",borderRadius:"6px",overflow:"hidden"}}>
                <div style={{display:"grid",gridTemplateColumns:"20px 1fr 70px",background:"#0b1220",padding:"5px 10px",gap:"6px"}}>
                  {["#","Material","Std Qty"].map(h=><div key={h} style={{fontSize:"9px",fontWeight:"700",color:"#334155"}}>{h}</div>)}
                </div>
                {(b.ingredients||[]).map((ing,i)=>ing.isProcess
                  ?<div key={i} style={{padding:"5px 10px",borderTop:"1px solid #1e293b",background:"#0a1520",fontSize:"11px",color:"#f59e0b",fontStyle:"italic",gridColumn:"1/-1"}}>→ {ing.name}</div>
                  :<div key={i} style={{display:"grid",gridTemplateColumns:"20px 1fr 70px",padding:"5px 10px",borderTop:"1px solid #1e293b",gap:"6px",alignItems:"center"}}>
                    <div style={{fontSize:"10px",color:"#475569"}}>{i+1}</div>
                    <div style={{fontSize:"12px",color:"#cbd5e1"}}>{ing.name}</div>
                    <div style={{fontSize:"12px",color:"#22c55e",textAlign:"right"}}>{ing.standardQty} {b.baseUnit}</div>
                  </div>
                )}
                <div style={{display:"grid",gridTemplateColumns:"20px 1fr 70px",padding:"6px 10px",borderTop:"1px solid #1e293b",background:"#0b1220",gap:"6px"}}>
                  <div/><div style={{fontSize:"11px",fontWeight:"700",color:"#94a3b8"}}>Total</div>
                  <div style={{fontSize:"12px",fontWeight:"700",color:"#22c55e",textAlign:"right"}}>{totalStd.toFixed(2)} {b.baseUnit}</div>
                </div>
              </div>
            </div>
            <div>
              <div style={{fontSize:"10px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>QC Standards</div>
              <div style={{border:"1px solid #1e293b",borderRadius:"6px",overflow:"hidden"}}>
                {((Array.isArray(b.qcTests)?b.qcTests:Object.entries(b.qcTests||{}).map(([k,v])=>({name:k,standard:v}))).filter(p=>p.standard||p.standard===0)).map((p,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr",padding:"5px 10px",borderTop:"1px solid #1e293b",gap:"6px"}}>
                  <div style={{fontSize:"11px",color:"#475569"}}>{p.name}</div>
                  <div style={{fontSize:"12px",color:"#e2e8f0"}}>{p.standard}</div>
                </div>)}
                {!(Array.isArray(b.qcTests)?b.qcTests:Object.entries(b.qcTests||{})).filter(p=>p.standard||p[1]).length&&<div style={{padding:"8px 10px",fontSize:"11px",color:"#334155",fontStyle:"italic"}}>No test parameters defined</div>}
              </div>
            </div>
          </div>
        </div>}
      </div>;
  };


  return <div>
    <SectionHead title="📋 Bill of Materials"/>
    <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"12px"}}>
      <input placeholder="Search product…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"7px 10px",fontSize:"12.5px"}}/>
      <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={{...sl,width:"140px",padding:"7px 6px",fontSize:"12px"}}>
        <option value="All">All Categories</option>
        {cats.map(c=><option key={c}>{c}</option>)}
      </select>
      <button onClick={()=>setGroupByCat(v=>!v)} style={{background:groupByCat?"#1e3a5f":"#1e293b",border:`1px solid ${groupByCat?"#3b82f6":"#334155"}`,borderRadius:"6px",padding:"5px 12px",color:groupByCat?"#93c5fd":"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600"}}>
        {groupByCat?"📂 Grouped":"☰ List"}
      </button>
      <span style={{fontSize:"11px",color:"#334155"}}>{fb.length} BOM{fb.length!==1?"s":""}</span>
      <div style={{marginLeft:"auto",display:"flex",gap:"8px"}}>
        <Btn label="📥 Export All (CSV)" onClick={exportAllBOMs} color="#64748b" small outline/>
        {canEdit&&<Btn label="+ Create BOM" onClick={()=>{setForm({...blankBOM});setShowCreate(true);setActiveBOM(null);}} color="#3b82f6"/>}
      </div>
    </div>

    {/* Create form */}
    {showCreate&&<div style={{background:"#080d18",border:"1px solid #3b82f630",borderRadius:"12px",padding:"18px",marginBottom:"16px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"14px"}}>📋 New Bill of Materials</div>
      <BOMForm form={form} setForm={setForm} saving={saving} isEdit={false} onCancel={()=>{setShowCreate(false);setForm({...blankBOM});}} onSave={()=>saveBOM(false)} sysProducts={sysProducts} sysQcParams={sysQcParams}/>
    </div>}

    {loading&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading…</div>}
    {!loading&&fb.length===0&&!showCreate&&<div style={{textAlign:"center",padding:"50px 0"}}>
      <div style={{fontSize:"36px"}}>📋</div>
      <div style={{fontSize:"13px",color:"#475569",marginTop:"8px"}}>{canEdit?"No BOMs yet. Create your first BOM to print production sheets.":"No BOMs found."}</div>
    </div>}

    {/* BOM cards — grouped or flat */}
    {groupByCat&&filterCat==="All"
      ?Object.entries(grouped).map(([cat,catBoms])=><div key={cat} style={{marginBottom:"16px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",textTransform:"uppercase",letterSpacing:"0.08em",padding:"6px 12px",background:"#0f1d35",border:"1px solid #1e3a5f",borderRadius:"8px 8px 0 0",display:"flex",alignItems:"center",gap:"10px"}}>
            <span>📂 {cat}</span>
            <span style={{fontSize:"11px",color:"#475569",fontWeight:"400"}}>{catBoms.length} product{catBoms.length!==1?"s":""}</span>
          </div>
          <div style={{border:"1px solid #1e3a5f",borderTop:"none",borderRadius:"0 0 8px 8px",overflow:"hidden"}}>
            {catBoms.map((b,idx)=>renderBOMCard(b,idx===catBoms.length-1))}
          </div>
        </div>)
      :fbSorted.map(b=>renderBOMCard(b,false))
    }
  </div>;
}
