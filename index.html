    if(!selectedCustomerInProduct)return;
    const customerOrders=customerGroups.find(g=>normalize(g.partyName)===normalize(selectedCustomerInProduct))?.orders||[];
    const hasAnySelected=customerOrders.some(o=>Object.keys(dispatchForm).some(k=>k.startsWith(o.id+"__")));
    if(!hasAnySelected)setSelectedCustomerInProduct(null);
  },[dispatchForm,selectedCustomerInProduct]);
  const [transportPrepView,setTransportPrepView]=useState("customer");
  const [directPrepArea,setDirectPrepArea]=useState("All");
  const [directQtyOverrides,setDirectQtyOverrides]=useState({});
  const [loadingSeq,setLoadingSeq]=useState(false);
  const [addSeqEntry,setAddSeqEntry]=useState({name:"",seq:""});
  const [seqWarning,setSeqWarning]=useState(null);
  const [missingFromSeq,setMissingFromSeq]=useState([]);
  const [missingFromSeqDirect,setMissingFromSeqDirect]=useState({}); // {routeKey: [customerName,...]}

  useEffect(()=>{
    C("settings").doc("deliverySequence").onSnapshot(s=>{if(s.exists)setDeliverySequence(s.data());},()=>{});
  },[]);

  const saveTransportSeqEntry=async(name,seq)=>{
    if(!name.trim()||!seq)return;
    const key=normalize(name.trim());
    const existing=(await C("settings").doc("deliverySequence").get()).data()||{direct:{},transport:{}};
    const updated={...existing,transport:{...(existing.transport||{}),[key]:{name:name.trim(),seq:parseFloat(seq)}}};
    await C("settings").doc("deliverySequence").set(updated);
    showToast(`${name.trim()} added at position ${seq} ✓`);
    setAddSeqEntry({name:"",seq:""});
  };

  const importDeliverySequence=async(file,type)=>{
    setLoadingSeq(true);
    try{
      await loadXLSX();const XLSX=window.XLSX;
      const ab=await file.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(ab),{type:"array"});
      const seqMap={};
      let counter=0; // use real counter, not row index
      wb.SheetNames.forEach(sheetName=>{
        const ws=wb.Sheets[sheetName];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1});
        rows.forEach((row)=>{
          const name=String(row[0]||"").trim();
          if(!name||name.toLowerCase()==="name"||name.toLowerCase()==="customer"||name.toLowerCase()==="transporter")return;
          counter++;
          const seq=parseFloat(row[1])||counter; // col B if present, else auto-increment
          seqMap[normalize(name)]={name,seq};
        });
      });
      if(type==="direct"){
        const existingDoc=(await C("settings").doc("deliverySequence").get()).data()||{direct:{},transport:{}};
        const routeSeqs={...(existingDoc.direct||{})};
        wb.SheetNames.forEach(sheetName=>{
          const routeKey=normalize(sheetName.trim()||"all");
          let counter=0;
          const ws=wb.Sheets[sheetName];
          const rows=XLSX.utils.sheet_to_json(ws,{header:1});
          const entries={};
          rows.forEach(row=>{
            const name=String(row[0]||"").trim();
            if(!name||name.toLowerCase()==="name"||name.toLowerCase()==="customer"||name.toLowerCase()==="transporter")return;
            counter++;
            const seq=parseFloat(row[1])||counter;
            entries[normalize(name)]={name,seq};
          });
          routeSeqs[routeKey]=entries;
        });
        await C("settings").doc("deliverySequence").set({...existingDoc,direct:routeSeqs});
        // Check ALL direct customers in setup routes not covered by any uploaded sequence
        const XLSX2=window.XLSX;
        const custInRoutes=Object.values(customerMap).filter(c=>c.customer&&!c._transportOnly&&c.isDirect);
        const missingDirectCust=custInRoutes.filter(c=>{
          const routeKey=normalize(c.route||"all");
          const seqForRoute=routeSeqs[routeKey]||routeSeqs["all"]||{};
          return !Object.keys(seqForRoute).some(k=>k===normalize(c.customer||""));
        }).sort((a,b)=>a.customer.localeCompare(b.customer));
        if(missingDirectCust.length>0){
          const rows=[["Customer Name","Route","(Not in sequence — add to Excel and re-upload)"],...missingDirectCust.map(c=>[c.customer,c.route,""])];
          const ws=XLSX2.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:40},{wch:20},{wch:40}];
          const wb=XLSX2.utils.book_new();XLSX2.utils.book_append_sheet(wb,ws,"Missing from Sequence");
          XLSX2.writeFile(wb,"VEEBEE_Direct_Missing_Customers.xlsx");
          // Build per-route missing map for in-UI display
          const perRoute={};
          missingDirectCust.forEach(c=>{const rk=normalize(c.route||"all");if(!perRoute[rk])perRoute[rk]=[];perRoute[rk].push(c.customer);});
          setMissingFromSeqDirect(perRoute);
          showToast(`Direct sequence uploaded · ⚠ ${missingDirectCust.length} customer${missingDirectCust.length!==1?"s":""} from Setup Routes not in sequence — downloaded list ⬇`,"error");
        }else{
          setMissingFromSeqDirect({});
          showToast(`${Object.keys(seqMap).length} entries uploaded — all direct customers covered ✓`);
        }
      } else {
        const existingDoc=(await C("settings").doc("deliverySequence").get()).data()||{direct:{},transport:{}};
        await C("settings").doc("deliverySequence").set({...existingDoc,transport:seqMap});
      }
      // Also add any new transport names to the customerTransport map so they appear in dropdowns
      const custMapDoc=await C("settings").doc("customerTransport").get();
      const existingCustMap=(custMapDoc.exists?custMapDoc.data().map:null)||{};
      const newTransporters={};
      Object.values(seqMap).forEach(({name})=>{
        const k="__trans__"+normTKey(name);
        if(!existingCustMap[k]&&!Object.values(existingCustMap).some(c=>normalize(c.transport||"")=== normalize(name)&&!c._transportOnly)){
          newTransporters[k]={customer:"",transport:name.trim().toUpperCase().replace(/\.+/g,"").replace(/\s+/g," "),route:"",isDirect:false,_transportOnly:true};
        }
      });
      if(Object.keys(newTransporters).length>0){
        await C("settings").doc("customerTransport").set({map:{...existingCustMap,...newTransporters}},{merge:true});
      }
      const allCustMap={...existingCustMap,...newTransporters};
      // All non-direct customers from setup routes whose transporter OR themselves are not in sequence
      const allTransInSystem=[...new Set(Object.values(allCustMap).filter(c=>!c.isDirect&&c.transport&&!c._transportOnly).map(c=>c.transport))];
      const missingTrans=allTransInSystem.filter(t=>!Object.keys(seqMap).some(k=>k===normalize(t)));
      // Customers under missing transporters
      const custUnderMissingTrans=Object.values(allCustMap).filter(c=>c.customer&&!c._transportOnly&&!c.isDirect&&missingTrans.some(t=>normalize(t)===normalize(c.transport||"")));
      // Customers under sequenced transporters but not individually sequenced
      const custUnderSeqTrans=Object.values(allCustMap).filter(c=>c.customer&&!c._transportOnly&&!c.isDirect&&Object.keys(seqMap).some(k=>k===normalize(c.transport||"")));
      const missingIndivCust=custUnderSeqTrans.filter(c=>!Object.keys(seqMap).some(k=>k===normalize(c.customer||"")));
      if(missingTrans.length>0||custUnderMissingTrans.length>0){
        const rows=[
          ["Type","Customer Name","Transporter","Note"],
          ...missingTrans.sort().map(t=>["⚠ Transporter",t,"","Not in sequence — all its customers will sort last"]),
          ...custUnderMissingTrans.sort((a,b)=>a.customer.localeCompare(b.customer)).map(c=>["  → Customer",c.customer,c.transport,"Under unsequenced transporter"]),
          ...(missingIndivCust.length>0?[["","","",""]]:[]),
          ...missingIndivCust.sort((a,b)=>a.customer.localeCompare(b.customer)).map(c=>["ℹ Customer",c.customer,c.transport,"Transporter sequenced but customer not individually listed"]),
        ];
        const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:16},{wch:40},{wch:32},{wch:50}];
        const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Missing from Sequence");
        XLSX.writeFile(wb,"VEEBEE_Transport_Missing_from_Sequence.xlsx");
        showToast(`${Object.keys(seqMap).length} uploaded · ⚠ ${missingTrans.length} transporter${missingTrans.length!==1?"s":""} (${custUnderMissingTrans.length} customer${custUnderMissingTrans.length!==1?"s":""}) missing from sequence — downloaded list ⬇`,"error");
        setMissingFromSeq(missingTrans); // show in Transport Prep UI
      }else{
        showToast(`${Object.keys(seqMap).length} entries uploaded — all transporters & customers covered ✓`);
        setMissingFromSeq([]);
      }
    }catch(e){showToast("Error: "+e.message,"error");}
    setLoadingSeq(false);
  };

  const seqSort=(a,b,seqMap)=>{
    const sa=seqMap[normalize(a)]?.seq??seqMap[normTKey(a)]?.seq??999;
    const sb=seqMap[normalize(b)]?.seq??seqMap[normTKey(b)]?.seq??999;
    return sa!==sb?sa-sb:a.localeCompare(b);
  };

  const [stagingSaving,setStagingSaving]=useState(false);

  // Stage/unstage items in Firestore — gives live updates to all users via onSnapshot
  const [stageSuggest,setStageSuggest]=useState(null);
  const [stagedQtyOverrides,setStagedQtyOverrides]=useState({}); // orderId__itemIdx -> qty string

  const stageItemsForTransport=async(itemsToStage,shouldStage,transport,isDirect)=>{
    setStagingSaving(true);
    try{
      const byOrder={};
      itemsToStage.forEach(({orderId,itemIdx,qty})=>{
        if(!byOrder[orderId])byOrder[orderId]=[];
        byOrder[orderId].push({itemIdx,qty});
      });
      for(const [orderId,idxList] of Object.entries(byOrder)){
        const orderDoc=await C("orders").doc(orderId).get();
        if(!orderDoc.exists)continue;
        const data=orderDoc.data();
        const updatedItems=(data.items||[]).map((item,idx)=>{
          const spec=idxList.find(s=>s.itemIdx===idx);
          if(!spec)return item;
          if(!shouldStage)return {...item,stagedForTransport:false,stagedAt:null,stagedBy:null};
          // Allow partial staging qty
          const stageQty=spec.qty!=null?parseFloat(spec.qty)||item.balanceQty:item.balanceQty;
          return {...item,stagedForTransport:true,stagedQty:stageQty,stagedAt:new Date().toISOString(),stagedBy:user.email};
        });
        await C("orders").doc(orderId).update({items:san(updatedItems),updatedAt:ts()});
      }
      // After staging, suggest OTHER customers with same transporter — exclude just-staged ones
      if(shouldStage&&transport&&!isDirect){
        const stagedPartyNames=new Set(itemsToStage.map(i=>orders.find(o=>o.id===i.orderId)?.partyName).filter(Boolean));
        const unstaged=customerGroups.filter(g=>
          !g.isDirect&&
          normTKey(g.transport)===normTKey(transport)&&
          !stagedPartyNames.has(g.partyName)&&
          g.orders.some(o=>(o.items||[]).some(i=>i.balanceQty>0&&i.status!=="Dispatched"&&!i.stagedForTransport))
        );
        if(unstaged.length>0)setStageSuggest({transport,others:unstaged});
        else setStageSuggest(null);
      }
    }catch(e){showToast("Error staging: "+e.message,"error");}
    setStagingSaving(false);
  };

  // Derive staged items from order state (live via onSnapshot)
  const stagedTransportItems=orders.flatMap(o=>{
    // Include any order (direct or transport) that has staged items
    if(!["Pending","Partial"].includes(o.status))return[];
    return (o.items||[]).filter(i=>i.stagedForTransport&&i.balanceQty>0&&i.status!=="Dispatched")
      .map((item)=>({name:item.name,qty:item.balanceQty,partyName:o.partyName,transport:o.transport,route:o.route,voucherNo:o.voucherNo,orderDate:o.orderDate||"",orderId:o.id,itemIdx:(o.items||[]).indexOf(item),stagedBy:item.stagedBy,stagedAt:item.stagedAt,isDirect:o.isDirect}));
  });

  // Clean item for Firestore — explicit fields only, no undefined
  const cleanItem=item=>({
    name:item.name||"",
    balanceQty:item.balanceQty||0,
    dispatchedQty:item.dispatchedQty||0,
    status:item.status||"Pending",
    lastDispatchedAt:item.lastDispatchedAt||null,
    lastDispatchedBy:item.lastDispatchedBy||null,
    dispatchConfirmed:item.dispatchConfirmed||false,
    dispatchConfirmedAt:item.dispatchConfirmedAt||null,
    stagedForTransport:item.stagedForTransport||false,
    stagedAt:item.stagedAt||null,
    stagedBy:item.stagedBy||null,
    stagedQty:item.stagedQty||null,
  });
  const moveStagedToDispatch=async()=>{
    setSaving(true);
    try{
      // Get staged order IDs from live state
      const stagedOrderIds=[...new Set(stagedTransportItems.map(i=>i.orderId))];
      if(stagedOrderIds.length===0){showToast("No staged items to move","error");setSaving(false);return;}
      for(const orderId of stagedOrderIds){
        // Always fetch fresh from Firestore to avoid stale state issues
        const doc=await C("orders").doc(orderId).get();
        if(!doc.exists)continue;
        const data=doc.data();
        const updatedItems=(data.items||[]).map(item=>{
          if(!item.stagedForTransport||item.status==="Dispatched")return item;
          const balQty=parseFloat(item.balanceQty)||0;
          if(balQty<=0)return {...item,stagedForTransport:false,stagedAt:null}; // clear stuck stage flag
          const idx=(data.items||[]).indexOf(item);
          const fk=orderId+"__"+idx;
          const override=stagedQtyOverrides[fk];
          const dispQty=override!==undefined?Math.min(parseFloat(override)||0,balQty):balQty;
          if(dispQty<=0)return item;
          const newBalance=Math.max(0,balQty-dispQty);
          const newDispatched=(parseFloat(item.dispatchedQty)||0)+dispQty;
          return {...item,
            balanceQty:newBalance,
            dispatchedQty:newDispatched,
            status:newBalance<=0?"Dispatched":"Partial",
            lastDispatchedAt:dispatchDateStr,
            lastDispatchedBy:user.email,
            stagedForTransport:false,
            stagedAt:null,
            dispatchConfirmed:false,
            dispatchConfirmedAt:null
          };
        });
        const allDone=updatedItems.every(i=>i.balanceQty<=0||i.status==="Dispatched");
        const anyDispatched=updatedItems.some(i=>(i.dispatchedQty||0)>0);
        await C("orders").doc(orderId).update({
          items:updatedItems.map(cleanItem),
          status:allDone?"Dispatched":anyDispatched?"Partial":"Pending",
          updatedAt:ts()
        });
      }
      showToast(`${stagedOrderIds.length} order${stagedOrderIds.length!==1?"s":""} moved to Dispatch Today ✓`);
      setPrintRouteFilter("All");
      setDispatchRouteFilter("All");
      setDispatchDeliveryFilter("All");
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const productGroups=(()=>{
    const map={};
    customerGroups.forEach(cg=>{
      cg.orders.forEach(order=>{
        (order.items||[]).forEach((item,itemIdx)=>{
          if(item.status==="Dispatched"||item.balanceQty<=0)return;
          const k=item.name;
          if(!map[k])map[k]={name:item.name,totalQty:0,customers:[]};
          map[k].totalQty+=item.balanceQty;
          const existing=map[k].customers.find(c=>normalize(c.partyName)===normalize(cg.partyName)&&c.orderId===order.id);
          if(existing){existing.qty+=item.balanceQty;}
          else map[k].customers.push({partyName:cg.partyName,qty:item.balanceQty,voucherNo:order.voucherNo,orderId:order.id,itemIdx,isDirect:cg.isDirect,transport:cg.transport,orderDate:order.orderDate||""});
        });
      });
    });
    // Sort customers old-to-new within each product
    return Object.values(map).sort((a,b)=>b.totalQty-a.totalQty).map(pg=>({...pg,customers:pg.customers.sort((a,b)=>String(a.orderDate).localeCompare(String(b.orderDate)))}));
  })();

  const [reverting,setReverting]=useState(null);
  const [revertForm,setRevertForm]=useState({}); // rKey -> qty string
  const revertDispatch=async(orderId,itemName,revertQty,totalDispatched,toTransport=false)=>{
    const key=orderId+"__"+itemName;
    const qty=parseFloat(revertQty)||0;
    if(qty<=0||qty>totalDispatched)return showToast(`Enter a valid quantity between 0.001 and ${totalDispatched}`,"error");
    setReverting(key);
    try{
      const orderDoc=await C("orders").doc(orderId).get();
      if(!orderDoc.exists){showToast("Order not found","error");setReverting(null);return;}
      const data=orderDoc.data();
      const goToTransport=toTransport||!data.isDirect; // transport orders default to transport prep
      const updatedItems=(data.items||[]).map(item=>{
        if(normalize(item.name)!==normalize(itemName))return item;
        const restoredBalance=(item.balanceQty||0)+qty;
        const restoredDispatched=Math.max(0,(item.dispatchedQty||0)-qty);
        const newStatus=restoredDispatched<=0?"Pending":restoredBalance<=0?"Dispatched":"Partial";
        const newLastDispatched=restoredDispatched<=0?null:item.lastDispatchedAt;
        return {...item,balanceQty:restoredBalance,dispatchedQty:restoredDispatched,status:newStatus,
          lastDispatchedAt:newLastDispatched,lastDispatchedBy:restoredDispatched<=0?null:item.lastDispatchedBy,
          stagedForTransport:goToTransport&&restoredDispatched<=0?true:false,
          stagedAt:goToTransport&&restoredDispatched<=0?new Date().toISOString():null,
          stagedBy:goToTransport&&restoredDispatched<=0?user.email:null};
      });
      const anyDispatched=updatedItems.some(i=>i.status==="Dispatched"||i.status==="Partial");
      await C("orders").doc(orderId).update({items:san(updatedItems),status:anyDispatched?"Partial":"Pending",updatedAt:ts()});
      showToast(`"${itemName}" moved back to ${goToTransport?"Transport Prep":"Pending"} ✓`);
      setRevertForm(f=>{const n={...f};delete n[key];return n;});
    }catch(e){showToast("Error: "+e.message,"error");}
    setReverting(null);
  };

  // Send entire customer's dispatch to transport prep or pending
  const revertWholeOrder=async(group,toTransport)=>{
    setReverting("whole__"+group.partyName);
    try{
      const orderIds=[...new Set(group.items.filter(i=>!i.confirmed).map(i=>i.orderId))];
      for(const orderId of orderIds){
        const orderDoc=await C("orders").doc(orderId).get();
        if(!orderDoc.exists)continue;
        const data=orderDoc.data();
        const goToTransport=toTransport||!data.isDirect;
        const updatedItems=(data.items||[]).map(item=>{
          const groupItem=group.items.find(i=>i.orderId===orderId&&normalize(i.name)===normalize(item.name));
          if(!groupItem||groupItem.confirmed)return item;
          const restoredBalance=(item.balanceQty||0)+groupItem.qty;
          const restoredDispatched=Math.max(0,(item.dispatchedQty||0)-groupItem.qty);
          return {...item,balanceQty:restoredBalance,dispatchedQty:restoredDispatched,
            status:restoredDispatched<=0?"Pending":"Partial",
            lastDispatchedAt:restoredDispatched<=0?null:item.lastDispatchedAt,
            stagedForTransport:goToTransport&&restoredDispatched<=0?true:false,
            stagedAt:goToTransport&&restoredDispatched<=0?new Date().toISOString():null,
            stagedBy:goToTransport&&restoredDispatched<=0?user.email:null};
        });
        const anyDispatched=updatedItems.some(i=>i.status==="Dispatched"||i.status==="Partial");
        await C("orders").doc(orderId).update({items:san(updatedItems),status:anyDispatched?"Partial":"Pending",updatedAt:ts()});
      }
      showToast(`${group.partyName} moved to ${toTransport||!group.isDirect?"Transport Prep":"Pending"} ✓`);
    }catch(e){showToast("Error: "+e.message,"error");}
    setReverting(null);
  };

  return <div>
    {/* Header */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"14px",flexWrap:"wrap",gap:"8px"}}>
      <div style={{fontSize:"22px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>🛒 Order Management</div>
      <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
        {canImport&&<><button onClick={()=>document.getElementById("orders-import").click()} disabled={parsing}
          style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"6px 12px",color:"#4ade80",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
          {parsing?"Importing…":"⬆ Import Orders (Tally)"}
        </button>
        <input id="orders-import" type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={async e=>{if(e.target.files[0]){await importOrders(e.target.files[0]);e.target.value="";}}}/>
        </>}
        {isAdmin&&orders.length>0&&<button onClick={async()=>{
          if(!confirm(`Delete all ${orders.length} orders? This cannot be undone.`))return;
          const snap=await C("orders").get();
          const batches=[];let batch=firebase.firestore().batch();let count=0;
          snap.docs.forEach(d=>{batch.delete(d.ref);count++;if(count%400===0){batches.push(batch);batch=firebase.firestore().batch();}});
          batches.push(batch);
          await Promise.all(batches.map(b=>b.commit()));
          showToast(`All ${orders.length} orders cleared ✓`);
        }} style={{background:"#2e0a0a",border:"1px solid #7f1d1d",borderRadius:"7px",padding:"6px 12px",color:"#f87171",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>🗑 Clear All Orders</button>}
        {(isAdmin||roles.includes("issuer"))&&<button onClick={()=>setSubTab(t=>t==="setup"?"pending":"setup")} style={{background:"#1a0a2e",border:"1px solid #7c3aed",borderRadius:"7px",padding:"6px 12px",color:"#c4b5fd",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>⚙️ Setup Routes</button>}
      </div>
    </div>

    {/* Sub-tabs */}
    {subTab!=="setup"&&<div style={{display:"flex",gap:"5px",marginBottom:"14px",borderBottom:"1px solid #1e293b",paddingBottom:"10px",flexWrap:"wrap"}}>
      {[
        ["pending","📋 Pending","#f59e0b"],
        ["direct_prep","🚚 Direct Prep","#22c55e"],
        ["transport_prep","🚛 Transport Prep","#a78bfa"],
        ["dispatch","🚚 Dispatch Today","#22c55e"],
        ["dispatched","✅ Dispatched (48h)","#3b82f6"],
        ...(isAdmin||roles.includes("issuer")||roles.includes("ho")?[["reports","📊 Reports","#a78bfa"]]:[])
      ].map(([k,l,c])=><button key={k} onClick={()=>setSubTab(k)}
        style={{background:subTab===k?c+"22":"transparent",border:`1px solid ${subTab===k?c+"60":"#1e293b"}`,borderRadius:"7px",padding:"6px 12px",color:subTab===k?c:"#475569",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
        {l}
        {k==="dispatch"&&filteredToday.length>0&&<span style={{marginLeft:"5px",background:c+"40",borderRadius:"99px",padding:"0 6px",fontSize:"10px"}}>{filteredToday.length}</span>}
        {k==="dispatched"&&dispatched48h.length>0&&<span style={{marginLeft:"5px",background:c+"40",borderRadius:"99px",padding:"0 6px",fontSize:"10px"}}>{dispatched48h.length}</span>}
        {k==="transport_prep"&&stagedTransportItems.length>0&&<span style={{marginLeft:"5px",background:c+"40",borderRadius:"99px",padding:"0 6px",fontSize:"10px"}}>{stagedTransportItems.length}</span>}
      </button>)}
    </div>}

    {/* ── UNKNOWN CUSTOMERS MODAL — appears after import detects new customers ── */}
    {/* ── New item size prompt modal ── */}
    {newItemsPrompt&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:310,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#0b1220",border:"1px solid #22c55e60",borderRadius:"14px",padding:"20px",width:"min(560px,96vw)",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{fontSize:"14px",fontWeight:"700",color:"#4ade80",marginBottom:"4px"}}>📦 New Products Found</div>
        <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"14px"}}>{newItemsPrompt.items.length} product{newItemsPrompt.items.length!==1?"s":""} not in FG catalogue. Add pack details so carton counts work in Transport Prep.</div>
        {newItemsPrompt.items.map((name,i)=>{
          const f=newItemForms[name]||{size:"",tpc:"",packType:"single"};
          const update=patch=>setNewItemForms(prev=>({...prev,[name]:{...f,...patch}}));
          return <div key={i} style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 12px",marginBottom:"8px"}}>
            <div style={{fontSize:"12.5px",fontWeight:"700",color:"#f1f5f9",marginBottom:"8px"}}>{name}</div>
            <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
              <Field label="Pack Size (L/kg)"><input style={{...inp,width:"80px"}} type="number" step="0.001" value={f.size} onChange={e=>update({size:e.target.value})} placeholder="e.g. 4"/></Field>
              <Field label="Tins / Carton"><input style={{...inp,width:"80px"}} type="number" step="1" value={f.tpc} onChange={e=>update({tpc:e.target.value})} placeholder="e.g. 4"/></Field>
              <Field label="Pack Type">
                <div style={{display:"flex",gap:"4px"}}>
                  {[["single","Single"],["2-pack","2-Pack"]].map(([v,l])=><button key={v} onClick={()=>update({packType:v})} style={{background:f.packType===v?"#052e16":"#080d18",border:`1px solid ${f.packType===v?"#166534":"#1e293b"}`,borderRadius:"5px",padding:"4px 10px",color:f.packType===v?"#4ade80":"#475569",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>{l}</button>)}
                </div>
              </Field>
            </div>
          </div>;
        })}
        <div style={{display:"flex",gap:"8px",marginTop:"4px"}}>
          <button onClick={async()=>{
          // Save to fg_products (FG stock catalogue) for each item that has size and tpc filled
            for(const name of newItemsPrompt.items){
              const f=newItemForms[name]||{};
              if(!f.size||!f.tpc)continue;
              const alreadyExists=fgProducts.some(p=>normalize(p.name)===normalize(name));
              if(!alreadyExists){
                await C("fg_products").add({
                  name,
                  size:parseFloat(f.size)||0,
                  unit:"L",
                  tinsPerCarton:parseInt(f.tpc)||0,
                  packType:f.packType||"single",
                  category:"Imported from Order",
                  importedAt:today(),
                  addedBy:user.email,
                  _createdAt:ts()
                });
              }
            }
            setNewItemsPrompt(null);
            showToast("Product details saved ✓");
          }} style={{flex:1,background:"#052e16",border:"1px solid #166534",borderRadius:"8px",padding:"8px",color:"#4ade80",fontWeight:"700",fontSize:"13px",cursor:"pointer"}}>💾 Save</button>
          <button onClick={()=>setNewItemsPrompt(null)} style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:"8px",padding:"8px 16px",color:"#475569",fontWeight:"700",fontSize:"13px",cursor:"pointer"}}>Skip</button>
        </div>
      </div>
    </div>}

    {unknownCusts&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#0b1220",border:"1px solid #f59e0b60",borderRadius:"14px",padding:"20px",width:"min(540px,96vw)",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{fontSize:"14px",fontWeight:"700",color:"#fcd34d",marginBottom:"4px"}}>⚠ New Customers Found</div>
        <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"14px"}}>{unknownCusts.length} customer{unknownCusts.length!==1?"s":""} in this file are not in the transport list. Add their route and transporter now — or skip and add later from ⚙️ Setup Routes.</div>
        {unknownCusts.map((c,i)=><div key={i} style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 12px",marginBottom:"8px"}}>
          <div style={{fontSize:"12.5px",fontWeight:"700",color:"#f1f5f9",marginBottom:"8px"}}>{c.partyName}</div>
          <Grid2>
            <Field label="Route / Area *">
              <input style={inp} list={`route-uc-${i}`} value={c.route} onChange={e=>setUnknownCusts(u=>u.map((x,xi)=>xi===i?{...x,route:e.target.value}:x))} placeholder="e.g. BHIWANDI"/>
              <datalist id={`route-uc-${i}`}>{routes.map(r=><option key={r} value={r}/>)}</datalist>
            </Field>
            <Field label="Transport / Delivery">
              <input style={inp} list={`uc-trans-${i}`} value={c.transport} onChange={e=>setUnknownCusts(u=>u.map((x,xi)=>xi===i?{...x,transport:e.target.value,isDirect:e.target.value.toLowerCase().includes("direct")}:x))} placeholder="e.g. JANSEVA TRANSPORT or DIRECT"/>
              <datalist id={`uc-trans-${i}`}><option value="DIRECT"/>{transporterNames.map(t=><option key={t} value={t}/>)}</datalist>
            </Field>
          </Grid2>
          <div style={{display:"flex",gap:"6px",marginTop:"4px"}}>
            <button onClick={()=>setUnknownCusts(u=>u.map((x,xi)=>xi===i?{...x,isDirect:true,transport:"DIRECT"}:x))} style={{flex:1,background:c.isDirect?"#052e16":"#080d18",border:`1px solid ${c.isDirect?"#166534":"#1e293b"}`,borderRadius:"5px",color:c.isDirect?"#4ade80":"#475569",fontWeight:"700",fontSize:"11px",padding:"4px",cursor:"pointer"}}>🚚 Direct</button>
            <button onClick={()=>setUnknownCusts(u=>u.map((x,xi)=>xi===i?{...x,isDirect:false}:x))} style={{flex:1,background:!c.isDirect?"#0a1a2e":"#080d18",border:`1px solid ${!c.isDirect?"#2563eb":"#1e293b"}`,borderRadius:"5px",color:!c.isDirect?"#93c5fd":"#475569",fontWeight:"700",fontSize:"11px",padding:"4px",cursor:"pointer"}}>🏢 Transporter</button>
          </div>
        </div>)}
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
          <button onClick={async()=>{
            // Skip — import as-is with Unknown routes
            setUnknownCusts(null);
            if(pendingImport){await _doImport(pendingImport.sanitisedMap);setPendingImport(null);}
          }} style={{background:"none",border:"1px solid #334155",borderRadius:"6px",padding:"7px 14px",color:"#475569",fontSize:"12px",cursor:"pointer"}}>Skip — Import Anyway</button>
          <button onClick={async()=>{
            // Save new customers to transport list, then patch sanitisedMap routes, then import
            setSavingUnknown(true);
            try{
              const newMap={...customerMap};
              const routeSet=new Set(routes);
              for(const c of unknownCusts){
                if(!c.route.trim())continue;
                const key=normalize(c.partyName);
                const isDirect=c.isDirect||(c.transport||"").toLowerCase().includes("direct");
                newMap[key]={customer:c.partyName,transport:c.transport||"DIRECT",route:c.route.trim(),isDirect};
                routeSet.add(c.route.trim());
              }
              await C("settings").doc("customerTransport").set({map:newMap,routes:Array.from(routeSet).sort(),updatedAt:ts()},{merge:true});
              // Patch sanitisedMap with new routes
              const patched={...pendingImport.sanitisedMap};
              Object.keys(patched).forEach(k=>{
                const o=patched[k];
                const cInfo=newMap[normalize(o.partyName)];
                if(cInfo)patched[k]={...o,route:cInfo.route,transport:cInfo.transport,isDirect:cInfo.isDirect};
              });
              await _doImport(patched);
              setUnknownCusts(null);setPendingImport(null);
            }catch(e){showToast("Error: "+e.message,"error");}
            setSavingUnknown(false);
          }} disabled={savingUnknown} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",padding:"7px 16px",color:"#4ade80",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>{savingUnknown?"Saving…":"Save & Import"}</button>
        </div>
      </div>
    </div>}

    {/* Setup panel */}
    {subTab==="setup"&&<div style={{background:"#060d1a",border:"1px solid #7c3aed40",borderRadius:"12px",padding:"16px",marginBottom:"14px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#c4b5fd",marginBottom:"12px"}}>⚙️ Customer Transport & Route Management</div>
      {/* Sequence warning banner — dismissible */}
      {seqWarning&&<div style={{background:"#1a0500",border:"1px solid #dc2626",borderRadius:"8px",padding:"10px 14px",marginBottom:"12px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"12px"}}>
        <div>
          <div style={{fontSize:"12.5px",fontWeight:"700",color:"#fca5a5",marginBottom:"4px"}}>⚠ Delivery Sequence Needs Update</div>
          <div style={{fontSize:"11.5px",color:"#f87171"}}>{seqWarning.msg}</div>
        </div>
        <div style={{display:"flex",gap:"6px",flexShrink:0}}>
          <button onClick={()=>{setSeqWarning(null);setSubTab(seqWarning.type==="transport"?"transport_prep":"direct_prep");}}
            style={{background:"#7f1d1d",border:"1px solid #dc2626",borderRadius:"6px",padding:"5px 10px",color:"#fca5a5",fontSize:"11px",fontWeight:"700",cursor:"pointer",whiteSpace:"nowrap"}}>Update Now</button>
          <button onClick={()=>setSeqWarning(null)}
            style={{background:"none",border:"1px solid #334155",borderRadius:"6px",padding:"5px 10px",color:"#475569",fontSize:"11px",fontWeight:"700",cursor:"pointer",whiteSpace:"nowrap"}}>Skip for Now</button>
        </div>
      </div>}
      <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 12px",marginBottom:"14px"}}>
        <div style={{fontSize:"11.5px",fontWeight:"700",color:"#94a3b8",marginBottom:"6px"}}>Bulk Import from Excel</div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
          <button onClick={()=>document.getElementById("transport-import").click()} disabled={transportParsing}
            style={{background:"#1a0a2e",border:"1px solid #7c3aed",borderRadius:"6px",padding:"6px 12px",color:"#c4b5fd",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
            {transportParsing?"Importing…":"⬆ Upload Transport List Excel"}
          </button>
          <input id="transport-import" type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={async e=>{if(e.target.files[0]){await importTransportList(e.target.files[0]);e.target.value="";}}}/>
          <button onClick={downloadTransportFormat} style={{background:"#060d1a",border:"1px solid #334155",borderRadius:"6px",padding:"6px 12px",color:"#64748b",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>⬇ Format</button>
          {Object.keys(customerMap).length>0&&<button onClick={async()=>{
            await loadXLSX();const XLSX=window.XLSX;
            const rows=[["Particulars","Transport","Route"]];
            Object.values(customerMap)
              .filter(c=>c.customer&&!c._transportOnly)
              .sort((a,b)=>a.customer.localeCompare(b.customer))
              .forEach(c=>rows.push([c.customer,c.isDirect?"DIRECT":c.transport||"",c.route||""]));
            const ws=XLSX.utils.aoa_to_sheet(rows);
            const ck="!cols";ws[ck]=[{wch:35},{wch:25},{wch:20}];
            const wb=XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb,ws,"Customer Transport List");
            XLSX.writeFile(wb,`VEEBEE_Customer_Routes_${new Date().toISOString().slice(0,10)}.xlsx`);
          }} style={{background:"#0a1a2e",border:"1px solid #2563eb",borderRadius:"6px",padding:"6px 12px",color:"#93c5fd",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>⬇ Download List ({Object.values(customerMap).filter(c=>c.customer&&!c._transportOnly).length})</button>}
          {Object.keys(customerMap).length>0&&<span style={{fontSize:"11.5px",color:"#22c55e"}}>{Object.keys(customerMap).length} customers · {routes.length} routes ✓</span>}
        </div>
      </div>
      <div style={{background:"#0b1220",border:"1px solid #1e3a5f",borderRadius:"8px",padding:"12px",marginBottom:"14px"}}>
        <div style={{fontSize:"11.5px",fontWeight:"700",color:"#93c5fd",marginBottom:"8px"}}>{editingCustomer?"✏️ Edit Customer":"+ Add Customer Manually"}</div>
        <Grid2>
          <Field label="Customer Name *"><input style={inp} value={custForm.customer} onChange={e=>setCustForm({...custForm,customer:e.target.value})} placeholder="Exact name as in Tally"/></Field>
          <Field label="Route / Area *"><input style={inp} list="route-options" value={custForm.route} onChange={e=>setCustForm({...custForm,route:e.target.value})} placeholder="e.g. BHIWANDI"/>
            <datalist id="route-options">{routes.map(r=><option key={r} value={r}/>)}</datalist>
          </Field>
        </Grid2>
        <Grid2>
          <Field label="Transport Company">
            <div style={{display:"flex",gap:"5px",alignItems:"center"}}>
              <div style={{flex:1,position:"relative"}}>
                <input style={inp} list="setup-trans-list" value={custForm.transport} onChange={e=>setCustForm({...custForm,transport:e.target.value,isDirect:e.target.value.toLowerCase().includes("direct")})} placeholder="Select or type new transporter…"/>
                <datalist id="setup-trans-list"><option value="DIRECT"/>{transporterNames.map(t=><option key={t} value={t}/>)}</datalist>
              </div>
              {(custForm.transport||"").trim()&&!custForm.isDirect&&!transporterNames.find(t=>normTKey(t)===normTKey(custForm.transport))&&<button onClick={async()=>{
                const name=(custForm.transport||"").trim().toUpperCase().replace(/\.+/g,"").replace(/\s+/g," "); // normalize
                const newMap={...customerMap};
                const tempKey="__trans__"+normTKey(name);
                newMap[tempKey]={customer:"",transport:name,route:"",isDirect:false,_transportOnly:true};
                await C("settings").doc("customerTransport").set({map:newMap},{merge:true});
                showToast(`${name} added to transporter list ✓`);
              }} style={{background:"#1a0a2e",border:"1px solid #7c3aed",borderRadius:"6px",padding:"5px 10px",color:"#c4b5fd",fontSize:"11px",fontWeight:"700",cursor:"pointer",whiteSpace:"nowrap"}}>+ Save</button>}
            </div>
          </Field>
          <Field label="Delivery Type"><div style={{display:"flex",gap:"6px"}}>
            <button onClick={()=>setCustForm({...custForm,isDirect:true,transport:custForm.transport||"DIRECT"})} style={{flex:1,background:custForm.isDirect?"#052e16":"#080d18",border:`1px solid ${custForm.isDirect?"#166534":"#1e293b"}`,borderRadius:"6px",padding:"7px",color:custForm.isDirect?"#4ade80":"#475569",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>🚚 Direct</button>
            <button onClick={()=>setCustForm({...custForm,isDirect:false})} style={{flex:1,background:!custForm.isDirect?"#0a1a2e":"#080d18",border:`1px solid ${!custForm.isDirect?"#2563eb":"#1e293b"}`,borderRadius:"6px",padding:"7px",color:!custForm.isDirect?"#93c5fd":"#475569",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>🏢 Transport</button>
          </div></Field>
        </Grid2>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
          {editingCustomer&&<button onClick={()=>{setEditingCustomer(null);setCustForm({customer:"",transport:"",route:"",isDirect:false});}} style={{background:"none",border:"1px solid #334155",borderRadius:"6px",padding:"6px 12px",color:"#475569",fontSize:"12px",cursor:"pointer"}}>✕ Cancel</button>}
          <button onClick={saveCustomer} disabled={custSaving} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",padding:"6px 14px",color:"#4ade80",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>{custSaving?"Saving…":editingCustomer?"✓ Update":"+ Add"}</button>
        </div>
      </div>
      {Object.keys(customerMap).length>0&&<>
        <div style={{position:"relative",marginBottom:"8px"}}>
          <span style={{position:"absolute",left:"10px",top:"50%",transform:"translateY(-50%)",color:"#334155",pointerEvents:"none"}}>🔍</span>
          <input style={{...inp,paddingLeft:"32px"}} value={customerSearch} onChange={e=>setCustomerSearch(e.target.value)} placeholder={`Search ${Object.keys(customerMap).length} customers…`}/>
        </div>
        <div style={{maxHeight:"340px",overflowY:"auto",border:"1px solid #1e293b",borderRadius:"8px"}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1.2fr 64px",gap:"6px",background:"#0b1220",padding:"6px 12px",fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.06em",position:"sticky",top:0}}>
            <span>Customer</span><span>Transport</span><span>Route</span><span></span>
          </div>
          {Object.entries(customerMap).filter(([k,v])=>!customerSearch.trim()||normalize(v.customer).includes(normalize(customerSearch))||normalize(v.route).includes(normalize(customerSearch))).map(([key,entry],i)=><div key={key} style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1.2fr 64px",gap:"6px",padding:"7px 12px",borderTop:"1px solid #0f172a",alignItems:"center",background:i%2===0?"transparent":"#060d1a"}}>
            <div style={{fontSize:"12px",color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={entry.customer}>{entry.customer}</div>
            <div style={{fontSize:"11px",color:entry.isDirect?"#4ade80":"#93c5fd"}}>{entry.isDirect?"🚚 Direct":entry.transport}</div>
            <div style={{fontSize:"11px",color:"#64748b"}}>{entry.route}</div>
            <div style={{display:"flex",gap:"4px"}}>
              <button onClick={()=>{setEditingCustomer(key);setCustForm({customer:entry.customer,transport:entry.transport,route:entry.route,isDirect:entry.isDirect||false});}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"4px",color:"#fcd34d",fontSize:"10px",padding:"2px 5px",cursor:"pointer"}}>✏️</button>
              <button onClick={()=>deleteCustomer(key)} style={{background:"none",border:"1px solid #1e293b",borderRadius:"4px",color:"#f87171",fontSize:"10px",padding:"2px 5px",cursor:"pointer"}}>🗑</button>
            </div>
          </div>)}
        </div>
      </>}
    </div>}

    {/* Shared search */}
    {subTab!=="setup"&&<div style={{display:"flex",gap:"8px",marginBottom:"8px",flexWrap:"wrap",alignItems:"center"}}>
      <div style={{position:"relative",flex:"1 1 160px",minWidth:"140px"}}>
        <span style={{position:"absolute",left:"9px",top:"50%",transform:"translateY(-50%)",color:"#334155",pointerEvents:"none"}}>🔍</span>
        <input style={{...inp,paddingLeft:"30px",paddingRight:search?"30px":"12px"}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search customer or order no…"/>
        {search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:"8px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:"14px",lineHeight:1,padding:"0"}}>✕</button>}
      </div>
    </div>}
    {/* Pending orders filters — route + delivery */}
    {subTab==="pending"&&<>
      <div style={{display:"flex",gap:"4px",marginBottom:"6px",flexWrap:"wrap"}}>
        <span style={{fontSize:"11px",color:"#475569",fontWeight:"600",alignSelf:"center",whiteSpace:"nowrap"}}>Route:</span>
        {["All",...routes,"Unknown"].map(r=>{
          const isUnknown=r==="Unknown";
          const unknownCount=isUnknown?pendingOrders.filter(o=>o.route==="Unknown"||!o.route).length:0;
          return <button key={r} onClick={()=>setRouteFilter(r)} style={{background:routeFilter===r?(isUnknown?"#2e0a0a":"#1e3a5f"):"#080d18",border:`1px solid ${routeFilter===r?(isUnknown?"#ef4444":"#3b82f6"):"#1e293b"}`,borderRadius:"5px",padding:"3px 9px",color:routeFilter===r?(isUnknown?"#f87171":"#93c5fd"):"#475569",fontSize:"11px",fontWeight:"600",cursor:"pointer",whiteSpace:"nowrap"}}>
            {r}{isUnknown&&unknownCount>0?<span style={{marginLeft:"4px",background:"#ef4444",borderRadius:"99px",color:"#fff",fontSize:"9.5px",padding:"0 5px"}}>{unknownCount}</span>:null}
          </button>;
        })}
      </div>
      <div style={{display:"flex",gap:"5px",marginBottom:"12px",flexWrap:"wrap"}}>
        <span style={{fontSize:"11px",color:"#475569",fontWeight:"600",alignSelf:"center"}}>Delivery:</span>
        {[["All","All"],["Direct","🚚 Direct"],["Transport","🏢 Transporter"]].map(([v,l])=><button key={v} onClick={()=>setDeliveryFilter(v)} style={{background:deliveryFilter===v?"#1e293b":"#080d18",border:`1px solid ${deliveryFilter===v?"#475569":"#1e293b"}`,borderRadius:"5px",padding:"3px 9px",color:deliveryFilter===v?"#f1f5f9":"#475569",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>{l}</button>)}
      </div>
    </>}
    {/* Dispatch tab: direct routes + transport filter — INSIDE dispatch tab */}

    {/* ── PENDING ORDERS — grouped by customer or product ── */}
    {subTab==="pending"&&(loading
      ?<div style={{textAlign:"center",padding:"40px",color:"#334155"}}>Loading orders…</div>
      :customerGroups.length===0
        ?<div style={{textAlign:"center",padding:"50px",border:"2px dashed #1e293b",borderRadius:"10px",color:"#334155"}}>
          {orders.length===0?"No orders yet — import from Tally":"No pending orders match this filter"}
        </div>
        :<div>
          {/* Transporter suggestion banner — dispatch */}
          {transporterSuggest&&<div style={{background:"#0a1a2e",border:"1px solid #2563eb",borderRadius:"10px",padding:"12px 14px",marginBottom:"12px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"10px",flexWrap:"wrap"}}>
            <div>
              <div style={{fontSize:"12.5px",fontWeight:"700",color:"#93c5fd",marginBottom:"4px"}}>📦 Same Transporter for Dispatch — {transporterSuggest.transport||"(no transporter)"}</div>
              <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"6px"}}>These customers also use <strong style={{color:"#93c5fd"}}>{transporterSuggest.transport||"the same transporter"}</strong> — dispatch together:</div>
              {transporterSuggest.others.map((g,i)=><div key={i} style={{fontSize:"12px",color:"#e2e8f0",padding:"2px 0"}}>
                · <strong>{g.partyName}</strong> <span style={{color:"#475569"}}>({g.route} · {g.orders.reduce((a,o)=>a+(o.items||[]).filter(i=>i.status!=="Dispatched"&&i.balanceQty>0).length,0)} items)</span>
              </div>)}
            </div>
            <button onClick={()=>setTransporterSuggest(null)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"16px",flexShrink:0}}>✕</button>
          </div>}

          {/* Stage suggestion banner */}
          {stageSuggest&&<div style={{background:"#120830",border:"1px solid #7c3aed",borderRadius:"10px",padding:"12px 14px",marginBottom:"12px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"10px",flexWrap:"wrap"}}>
            <div>
              <div style={{fontSize:"12.5px",fontWeight:"700",color:"#c4b5fd",marginBottom:"4px"}}>📦 Stage Together — {stageSuggest.transport}</div>
              <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"6px"}}>These customers also use <strong style={{color:"#c4b5fd"}}>{stageSuggest.transport}</strong> — stage together to prepare in one batch:</div>
              {stageSuggest.others.map((g,i)=><div key={i} style={{fontSize:"12px",color:"#e2e8f0",padding:"2px 0",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"12px"}}>
                <span>· <strong>{g.partyName}</strong> <span style={{color:"#475569"}}>({g.route} · {g.orders.reduce((a,o)=>a+(o.items||[]).filter(i=>i.status!=="Dispatched"&&i.balanceQty>0&&!i.stagedForTransport).length,0)} items)</span></span>
                <button onClick={()=>{const items=g.orders.flatMap(o=>(o.items||[]).filter(i=>i.balanceQty>0&&i.status!=="Dispatched"&&!i.stagedForTransport).map(item=>({orderId:o.id,itemIdx:(o.items||[]).indexOf(item)})));stageItemsForTransport(items,true,g.transport,false);}} disabled={stagingSaving}
                  style={{background:"#1a0a2e",border:"1px solid #7c3aed",borderRadius:"5px",padding:"2px 8px",color:"#c4b5fd",fontSize:"10px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>📦 Stage</button>
              </div>)}
            </div>
            <button onClick={()=>setStageSuggest(null)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"16px",flexShrink:0}}>✕</button>
          </div>}

          {/* View mode toggle + summary */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px",flexWrap:"wrap",gap:"8px"}}>
            <div style={{fontSize:"11.5px",color:"#475569"}}>
              {viewMode==="customer"
                ?`${customerGroups.length} customer${customerGroups.length!==1?"s":""} · ${pendingOrders.length} orders${routeFilter!=="All"?` · ${routeFilter}`:""}`
                :viewMode==="product"
                ?`${productGroups.length} product${productGroups.length!==1?"s":""} · ${customerGroups.length} customers${routeFilter!=="All"?` · ${routeFilter}`:""}`
                :`${transporterGroups.length} transporter${transporterGroups.length!==1?"s":""} · ${customerGroups.length} customers${routeFilter!=="All"?` · ${routeFilter}`:""}`}
            </div>
            <div style={{display:"flex",gap:"4px",background:"#080d18",border:"1px solid #1e293b",borderRadius:"7px",padding:"3px"}}>
              {[["customer","👥 By Customer"],["product","📦 By Product"],["transporter","🚛 By Transporter"]].map(([v,l])=><button key={v} onClick={()=>setViewMode(v)}
                style={{background:viewMode===v?"#1e3a5f":"transparent",border:"none",borderRadius:"5px",padding:"5px 10px",color:viewMode===v?"#93c5fd":"#475569",fontWeight:"700",fontSize:"11px",cursor:"pointer",transition:"all 0.15s"}}>{l}</button>)}
            </div>
          </div>

          {/* ── PRODUCT VIEW ── */}
          {viewMode==="product"&&<div>
            <div style={{background:"#0b1220",border:"1px solid #1e3a5f",borderRadius:"8px",padding:"8px 12px",marginBottom:"10px",fontSize:"11.5px",color:"#64748b"}}>
              📋 <strong style={{color:"#93c5fd"}}>Material Preparation View</strong> — sorted old orders first. Click a product to expand. Mark dispatch per customer. Switch to Customer view to confirm.
            </div>
            {/* Cross-product suggestion banner */}
            {selectedCustomerInProduct&&(()=>{
              const allProductsForCustomer=productGroups.filter(pg=>pg.customers.some(c=>normalize(c.partyName)===normalize(selectedCustomerInProduct)));
              const alreadySelected=allProductsForCustomer.filter(pg=>pg.customers.some(c=>normalize(c.partyName)===normalize(selectedCustomerInProduct)&&dispatchForm[c.orderId+"__"+c.itemIdx]));
              const notSelected=allProductsForCustomer.filter(pg=>!pg.customers.some(c=>normalize(c.partyName)===normalize(selectedCustomerInProduct)&&dispatchForm[c.orderId+"__"+c.itemIdx]));
              if(notSelected.length===0)return null;
              return <div style={{background:"#0a1a2e",border:"1px solid #2563eb",borderRadius:"10px",padding:"10px 14px",marginBottom:"10px"}}>
                <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"6px"}}>📦 Other pending orders for <strong>{selectedCustomerInProduct}</strong></div>
                <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"8px"}}>These items are also pending for this customer. Add to dispatch?</div>
                <div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"8px"}}>
                  {notSelected.map((pg,i)=>{
                    const c=pg.customers.find(c=>normalize(c.partyName)===normalize(selectedCustomerInProduct));
                    if(!c)return null;
                    return <div key={i} style={{background:"#080d18",border:"1px solid #1e293b",borderRadius:"6px",padding:"5px 10px",display:"flex",gap:"8px",alignItems:"center"}}>
                      <span style={{fontSize:"11.5px",color:"#e2e8f0"}}>{pg.name}</span>
                      <span style={{fontSize:"12px",fontWeight:"700",color:"#fcd34d"}}>{c.qty}</span>
                      <button onClick={()=>setDispatchForm(f=>({...f,[c.orderId+"__"+c.itemIdx]:{type:"full",qty:String(c.qty)}}))}
                        style={{background:"#052e16",border:"1px solid #166534",borderRadius:"4px",padding:"2px 8px",color:"#4ade80",fontSize:"10px",fontWeight:"700",cursor:"pointer"}}>+ Add</button>
                    </div>;
                  })}
                </div>
                <button onClick={()=>{
                  notSelected.forEach(pg=>{const c=pg.customers.find(c=>normalize(c.partyName)===normalize(selectedCustomerInProduct));if(c)setDispatchForm(f=>({...f,[c.orderId+"__"+c.itemIdx]:{type:"full",qty:String(c.qty)}}));});
                }} style={{background:"#0a1a2e",border:"1px solid #2563eb",borderRadius:"5px",padding:"4px 12px",color:"#93c5fd",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>+ Add All Pending Products</button>
              </div>;
            })()}
            {productGroups.map((pg,pi)=><ProductGroupRow key={pg.name} pg={pg} dispatchForm={dispatchForm} setDispatchForm={setDispatchForm} canDispatch={canDispatch} onCustomerSelect={setSelectedCustomerInProduct} selectedCustomer={selectedCustomerInProduct} stageItems={stageItemsForTransport} stagingSaving={stagingSaving}/>)}
          </div>}

          {/* ── TRANSPORTER VIEW — for consolidated booking ── */}
          {viewMode==="transporter"&&<div>
            <div style={{background:"#0b1220",border:"1px solid #1e3a5f",borderRadius:"8px",padding:"8px 12px",marginBottom:"10px",fontSize:"11.5px",color:"#64748b"}}>
              🚛 <strong style={{color:"#93c5fd"}}>Transporter View</strong> — customers grouped by transporter. Dispatch all customers under one transporter together to avoid sending material to the same transporter multiple times.
            </div>
            {transporterGroups.map(tg=><TransporterGroupRow key={tg.transport} tg={tg} dispatchForm={dispatchForm} setDispatchForm={setDispatchForm} canDispatch={canDispatch} stageItems={stageItemsForTransport} stagingSaving={stagingSaving}/>)}
          </div>}

          {/* ── CUSTOMER VIEW (existing) ── */}
          {viewMode==="customer"&&<div>
          {customerGroups.map(group=>{
            const isUnknown=group.route==="Unknown"||!group.route;
            const isExp=expandedCustomer===group.partyName;
            const groupKey=k=>Object.keys(dispatchForm).some(dk=>dk.startsWith(group.orders.map(o=>o.id).join("|")+"|")||group.orders.some(o=>dk.startsWith(o.id+"__")));
            const selectedCount=group.orders.reduce((a,o)=>a+Object.keys(dispatchForm).filter(k=>k.startsWith(o.id+"__")).length,0);
            const allStatuses=group.orders.map(o=>o.status);
            const hasPartial=allStatuses.includes("Partial");
            const borderColor=isUnknown?"#ef4444":hasPartial?"#3b82f6":"#f59e0b";
            const isQA=quickAddCustomer===group.partyName;

            return <div key={group.partyName} style={{background:"#0b1220",border:`1px solid ${isExp?"#2563eb60":isUnknown?"#ef444430":"#1e293b"}`,borderLeft:`3px solid ${borderColor}`,borderRadius:"10px",marginBottom:"8px",overflow:"hidden"}}>
              {/* Customer header */}
              <div onClick={()=>{setExpandedCustomer(isExp?null:group.partyName);setDispatchForm({});}}
                style={{padding:"11px 14px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:"13.5px",fontWeight:"700",color:"#f1f5f9",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{group.partyName}</div>
                  <div style={{fontSize:"11px",color:"#475569",display:"flex",gap:"10px",flexWrap:"wrap",marginTop:"2px"}}>
                    {isUnknown
                      ?<span style={{color:"#f87171",fontWeight:"700"}}>⚠ Route unknown</span>
                      :<><span style={{color:group.isDirect?"#22c55e":"#93c5fd"}}>{group.isDirect?"🚚 Direct":"🏢 "+group.transport}</span><span>{group.route}</span></>}
                    <span>{group.orders.length} order{group.orders.length!==1?"s":""}</span>
                    <span style={{color:"#f59e0b"}}>{group.orders.reduce((a,o)=>(o.items||[]).filter(i=>i.status!=="Dispatched"&&i.balanceQty>0).length+a,0)} items pending</span>
                  </div>
                </div>
                <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
                  {isUnknown&&<button onClick={e=>{e.stopPropagation();setCustForm({customer:group.partyName,transport:"",route:"",isDirect:false});setQuickAddCustomer(isQA?null:group.partyName);}} style={{background:isQA?"#2e0a0a":"#1a0505",border:`1px solid ${isQA?"#ef4444":"#7f1d1d"}`,borderRadius:"5px",color:isQA?"#f87171":"#fca5a5",fontSize:"10.5px",fontWeight:"700",padding:"2px 8px",cursor:"pointer",whiteSpace:"nowrap"}}>
                    {isQA?"✕ Cancel":"+ Add Route"}
                  </button>}
                  {/* Stage for Transport — non-direct orders OR direct customers in transport sequence */}
                  {!isUnknown&&(canDispatch||isAdmin||roles.includes("issuer"))&&(()=>{
                    const inTransportSeq=group.isDirect&&getTransportSeq(group.partyName,group.transport)<999;
                    if(!group.isDirect||inTransportSeq){
                    const allPending=group.orders.flatMap(o=>(o.items||[]).filter(i=>i.balanceQty>0&&i.status!=="Dispatched"&&!i.stagedForTransport).map((item)=>({orderId:o.id,itemIdx:(o.items||[]).indexOf(item)})));
                    const stagedCount=stagedTransportItems.filter(i=>group.orders.some(o=>o.id===i.orderId)).length;
                    const allStaged=stagedCount>0&&allPending.length===0;
                    return <button onClick={e=>{e.stopPropagation();if(allStaged)stageItemsForTransport(group.orders.flatMap(o=>(o.items||[]).map((_,idx)=>({orderId:o.id,itemIdx:idx}))),false);else stageItemsForTransport(allPending,true,group.transport,group.isDirect);}} disabled={stagingSaving}
                      style={{background:allStaged?"#12083a":"#080d18",border:`1px solid ${allStaged?"#7c3aed":"#1e293b"}`,borderRadius:"5px",color:allStaged?"#c4b5fd":"#475569",fontSize:"10.5px",fontWeight:"700",padding:"2px 9px",cursor:"pointer",whiteSpace:"nowrap"}}>
                      {allStaged?"📦 Staged":"📦 Stage"}
                    </button>;}
                    return null;
                  })()}
                  {selectedCount>0&&<span style={{fontSize:"10px",color:"#4ade80",background:"#052e16",border:"1px solid #166534",borderRadius:"99px",padding:"1px 8px"}}>{selectedCount} selected</span>}
                  <span style={{color:"#334155",fontSize:"11px"}}>{isExp?"▲":"▼"}</span>
                </div>
              </div>

              {/* Quick-add route form for Unknown customers */}
              {isQA&&<div style={{borderTop:"1px solid #7f1d1d40",padding:"10px 14px",background:"#0f0505"}}>
                <div style={{fontSize:"11px",fontWeight:"700",color:"#fca5a5",marginBottom:"8px"}}>Add {group.partyName} to transport list</div>
                <Grid2>
                  <Field label="Route / Area *">
                    <input style={inp} list="qa-route-list" value={custForm.route} onChange={e=>setCustForm({...custForm,route:e.target.value})} placeholder="e.g. BHIWANDI"/>
                    <datalist id="qa-route-list">{routes.map(r=><option key={r} value={r}/>)}</datalist>
                  </Field>
                  <Field label="Transport Company">
                    <input style={inp} list="qa-trans-list" value={custForm.transport} onChange={e=>setCustForm({...custForm,transport:e.target.value,isDirect:e.target.value.toLowerCase().includes("direct")})} placeholder="e.g. JANSEVA or DIRECT"/>
                    <datalist id="qa-trans-list"><option value="DIRECT"/>{transporterNames.map(t=><option key={t} value={t}/>)}</datalist>
                  </Field>
                </Grid2>
                <div style={{display:"flex",gap:"6px",marginBottom:"8px"}}>
                  <button onClick={()=>setCustForm({...custForm,isDirect:true,transport:"DIRECT"})} style={{flex:1,background:custForm.isDirect?"#052e16":"#080d18",border:`1px solid ${custForm.isDirect?"#166534":"#1e293b"}`,borderRadius:"5px",color:custForm.isDirect?"#4ade80":"#475569",fontWeight:"700",fontSize:"11px",padding:"4px",cursor:"pointer"}}>🚚 Direct</button>
                  <button onClick={()=>setCustForm({...custForm,isDirect:false})} style={{flex:1,background:!custForm.isDirect?"#0a1a2e":"#080d18",border:`1px solid ${!custForm.isDirect?"#2563eb":"#1e293b"}`,borderRadius:"5px",color:!custForm.isDirect?"#93c5fd":"#475569",fontWeight:"700",fontSize:"11px",padding:"4px",cursor:"pointer"}}>🏢 Transporter</button>
                </div>
                <div style={{display:"flex",justifyContent:"flex-end"}}>
                  <button onClick={async()=>{await saveCustomer();setQuickAddCustomer(null);}} disabled={custSaving||!custForm.route.trim()} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",padding:"6px 14px",color:"#4ade80",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>{custSaving?"Saving…":"✓ Save & Update Orders"}</button>
                </div>
              </div>}

              {/* Expanded: all orders for this customer */}
              {isExp&&<div style={{padding:"0 14px 14px",borderTop:"1px solid #0f172a"}}>
                {group.orders.map(order=><div key={order.id} style={{marginTop:"10px"}}>
                  <div style={{fontSize:"11px",color:"#64748b",marginBottom:"4px",display:"flex",gap:"10px"}}>
                    <span style={{fontWeight:"700",color:"#94a3b8"}}>📄 {order.voucherNo}</span>
                    <span>{order.orderDate}</span>
                    <span style={{background:order.status==="Partial"?"#1e3a5f":"#1a0a00",border:`1px solid ${order.status==="Partial"?"#2563eb":"#f59e0b"}40`,borderRadius:"5px",padding:"0px 7px",color:order.status==="Partial"?"#93c5fd":"#fcd34d",fontSize:"10px"}}>{order.status}</span>
                  </div>
                  <div style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"7px",overflow:"auto"}}>
                    <div style={{display:"grid",gridTemplateColumns:"2.5fr 80px 80px 75px auto",gap:"5px",background:"#0b1220",padding:"5px 10px",fontSize:"9.5px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.05em",minWidth:"460px"}}>
                      <span>Product</span><span style={{textAlign:"center"}}>Balance</span><span style={{textAlign:"center"}}>Dispatched</span><span style={{textAlign:"center"}}>Status</span><span style={{textAlign:"center"}}>{canDispatch?"Dispatch":""}</span>
                    </div>
                    {(order.items||[]).filter(i=>!i.stagedForTransport||i.status==="Dispatched").map((item,idx)=>{
                      const formKey=order.id+"__"+idx;
                      const df=dispatchForm[formKey]||{};
                      const bal=item.balanceQty||0;
                      const ic=STATUS_COLOR[item.status]||"#94a3b8";
                      return <div key={idx} style={{display:"grid",gridTemplateColumns:"2.5fr 80px 80px 75px auto",gap:"5px",padding:"6px 10px",borderTop:"1px solid #0f172a",alignItems:"center",background:item.status==="Dispatched"?"#052e1615":"transparent",minWidth:"460px"}}>
                        <div style={{fontSize:"12px",color:item.status==="Dispatched"?"#4ade80":"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={item.name}>{item.name}</div>
                        <div style={{textAlign:"center",fontSize:"12.5px",color:"#fcd34d",fontWeight:"700"}}>{bal}</div>
                        <div style={{textAlign:"center",fontSize:"12px",color:"#4ade80"}}>{item.dispatchedQty||0}</div>
                        <div style={{textAlign:"center"}}><span style={{background:ic+"20",border:`1px solid ${ic}40`,borderRadius:"99px",color:ic,fontSize:"9px",fontWeight:"700",padding:"2px 6px"}}>{item.status}</span></div>
                        <div style={{display:"flex",flexDirection:"column",gap:"2px",alignItems:"center"}}>
                          {canDispatch&&item.status!=="Dispatched"&&bal>0&&<>
                            <div style={{display:"flex",gap:"3px"}}>
                              <button onClick={()=>setDispatchForm(f=>({...f,[formKey]:{type:"full",qty:String(bal)}}))}
                                style={{background:df.type==="full"?"#052e16":"#0a0f1e",border:`1px solid ${df.type==="full"?"#166534":"#1e293b"}`,borderRadius:"4px",color:df.type==="full"?"#4ade80":"#475569",fontSize:"10px",fontWeight:"700",padding:"2px 7px",cursor:"pointer"}}>Full</button>
                              <button onClick={()=>setDispatchForm(f=>({...f,[formKey]:{type:"partial",qty:""}}))}
                                style={{background:df.type==="partial"?"#0a1a2e":"#0a0f1e",border:`1px solid ${df.type==="partial"?"#2563eb":"#1e293b"}`,borderRadius:"4px",color:df.type==="partial"?"#93c5fd":"#475569",fontSize:"10px",fontWeight:"700",padding:"2px 7px",cursor:"pointer"}}>Part</button>
                            </div>
                            {df.type==="partial"&&<input type="number" min="0.001" max={bal} step="0.001" value={df.qty||""} onChange={e=>setDispatchForm(f=>({...f,[formKey]:{...f[formKey],qty:e.target.value}}))} style={{...inp,width:"65px",padding:"2px 4px",fontSize:"11px",textAlign:"center"}} placeholder={"≤"+bal}/>}
                            {df.type&&<button onClick={()=>setDispatchForm(f=>{const n={...f};delete n[formKey];return n;})} style={{background:"none",border:"none",color:"#334155",fontSize:"10px",cursor:"pointer"}}>✕</button>}
                          </>}
                        </div>
                      </div>;
                    })}
                  </div>
                </div>)}

                {/* Confirm for entire customer */}
                {canDispatch&&Object.keys(dispatchForm).some(k=>group.orders.some(o=>k.startsWith(o.id+"__")))&&
                  <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",alignItems:"center",marginTop:"12px",paddingTop:"10px",borderTop:"1px solid #1e293b"}}>
                    <span style={{fontSize:"11.5px",color:"#475569"}}>{Object.keys(dispatchForm).filter(k=>group.orders.some(o=>k.startsWith(o.id+"__"))).length} item{Object.keys(dispatchForm).filter(k=>group.orders.some(o=>k.startsWith(o.id+"__"))).length!==1?"s":""} selected for {group.partyName}</span>
                    <button onClick={()=>confirmDispatch(group.orders)} disabled={saving}
                      style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"8px 18px",color:"#4ade80",fontWeight:"700",fontSize:"12.5px",cursor:"pointer"}}>{saving?"Saving…":"🚚 Confirm Dispatch"}</button>
                  </div>}
              </div>}
            </div>;
          })}
          </div>}   {/* end customer view */}
        </div>
    )}

    {/* ── TODAY'S DISPATCH LIST ── */}
    {subTab==="dispatch"&&<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px",flexWrap:"wrap",gap:"8px"}}>
        <div>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#22c55e"}}>🚚 Dispatch — {dispatchDateStr}</div>
          <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>{filteredToday.length} customer{filteredToday.length!==1?"s":""} · {totalTodayItems} item{totalTodayItems!==1?"s":""}{dispatchDeliveryFilter!=="All"?` · ${dispatchDeliveryFilter}`:""}{dispatchRouteFilter!=="All"?` · ${dispatchRouteFilter}`:""}</div>
          <div style={{display:"flex",gap:"4px",background:"#080d18",border:"1px solid #1e293b",borderRadius:"7px",padding:"3px",marginTop:"6px"}}>
            <button onClick={()=>setDispatchDateChoice("today")} style={{background:dispatchDateChoice==="today"?"#052e16":"transparent",border:"none",borderRadius:"5px",padding:"4px 12px",color:dispatchDateChoice==="today"?"#4ade80":"#475569",fontWeight:"700",fontSize:"11.5px",cursor:"pointer"}}>📅 Today ({todayStr.slice(5)})</button>
            <button onClick={()=>setDispatchDateChoice("tomorrow")} style={{background:dispatchDateChoice==="tomorrow"?"#1e3a5f":"transparent",border:"none",borderRadius:"5px",padding:"4px 12px",color:dispatchDateChoice==="tomorrow"?"#93c5fd":"#475569",fontWeight:"700",fontSize:"11.5px",cursor:"pointer"}}>📅 Tomorrow ({new Date(Date.now()+86400000).toISOString().slice(5,10)})</button>
          </div>
        </div>
        <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}}>
        {/* Print filter always visible regardless of filteredToday */}
        <div style={{display:"flex",alignItems:"center",gap:"4px",background:"#060d1a",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 6px"}}>
          <span style={{fontSize:"10px",color:"#475569",whiteSpace:"nowrap"}}>Print:</span>
          <select value={printRouteFilter} onChange={e=>setPrintRouteFilter(e.target.value)} style={{...sl,fontSize:"11px",padding:"2px 4px",minWidth:"140px"}}>
            <option value="All">All Orders</option>
            <option value="transport">🏢 Transport (incl. sequenced direct)</option>
            <option value="directonly">🚚 Direct Only (not in sequence)</option>
            <optgroup label="── By Direct Route ──">
              {[...new Set(todayDispatched.filter(g=>g.isDirect).map(g=>g.route).filter(Boolean))].sort().map(r=><option key={"d_"+r} value={"direct:"+r}>🚚 {r}</option>)}
            </optgroup>
          </select>
        </div>
      {filteredToday.length>0&&<>
        {filteredToday.some(g=>g.items.some(i=>!i.confirmed))&&canDispatch&&<button onClick={confirmAllDispatches} disabled={saving}
          style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"6px 12px",color:"#4ade80",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
          {saving?"…":"✓ Confirm All Dispatched"}
        </button>}
        <button onClick={()=>{
          let toPrint=filteredToday;
          let label="All Routes";
          if(printRouteFilter==="transport"){label="Transport + Sequenced Direct";}
          else if(printRouteFilter==="directonly"){label="Direct Only";}
          else if(printRouteFilter.startsWith("direct:")){label="Direct · "+printRouteFilter.slice(7);}
          const printDate=dispatchDateStr?new Date(dispatchDateStr+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
          const sorted=[...toPrint].sort(seqSortFn);
          printDispatchList(sorted,label,printDate,fgProducts);
        }} style={{background:"#0a1a2e",border:"1px solid #1e3a5f",borderRadius:"7px",padding:"6px 12px",color:"#93c5fd",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>🖨 Print</button>
      </>}
        </div>
      </div>

      {/* Carton summary */}
      {(()=>{
        let totalCartons=0,totalLoose=0;
        filteredToday.forEach(g=>g.items.forEach(i=>{
          const ct=calcCartons(i.name,i.qty);
          if(ct){totalCartons+=ct.cartons;totalLoose+=ct.loose;}
        }));
        return (totalCartons>0||totalLoose>0)&&<div style={{background:"#060d1a",border:"1px solid #7c3aed40",borderRadius:"8px",padding:"8px 14px",marginBottom:"10px",display:"flex",gap:"16px",flexWrap:"wrap",alignItems:"center"}}>
          <span style={{fontSize:"11.5px",color:"#64748b",fontWeight:"700"}}>Total:</span>
          {totalCartons>0&&<span style={{fontSize:"13px",fontWeight:"700",color:"#a78bfa"}}>{totalCartons} cartons</span>}
          {totalLoose>0&&<span style={{fontSize:"13px",fontWeight:"700",color:"#c4b5fd"}}>{totalLoose} loose tins</span>}
        </div>;
      })()}

      {filteredToday.length===0
        ?<div style={{textAlign:"center",padding:"50px",border:"2px dashed #1e293b",borderRadius:"10px",color:"#334155"}}>No dispatches recorded today{routeFilter!=="All"?` for ${routeFilter}`:""}</div>
        :<div>
          {filteredToday.map((group,gi)=>{
            const allConfirmed=group.items.every(i=>i.confirmed);
            const anyReversible=group.items.some(i=>i.canReverse);
            const pendingConfirm=group.items.filter(i=>!i.confirmed);
            const borderCol=allConfirmed?"#22c55e":"#f59e0b";
            return <div key={group.partyName} style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:`3px solid ${borderCol}`,borderRadius:"10px",marginBottom:"6px",overflow:"hidden",opacity:allConfirmed?0.85:1}}>
            <div style={{padding:"9px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"6px"}}>
              <div>
                <div style={{fontSize:"12.5px",fontWeight:"700",color:"#f1f5f9"}}>{gi+1}. {group.partyName}</div>
                <div style={{fontSize:"10.5px",color:"#475569",display:"flex",gap:"8px",marginTop:"1px"}}>
                  <span style={{color:group.isDirect?"#22c55e":"#93c5fd"}}>{group.isDirect?"🚚 Direct":"🏢 "+group.transport}</span>
                  <span>{group.route}</span>
                  {group.items[0]?.dispatchDate&&<span style={{color:"#fcd34d",fontWeight:"600"}}>📅 {group.items[0].dispatchDate}</span>}
                </div>
              </div>
              <div style={{display:"flex",gap:"5px",alignItems:"center",flexWrap:"wrap"}}>
                {allConfirmed
                  ?<span style={{fontSize:"10.5px",color:"#4ade80",background:"#052e16",border:"1px solid #166534",borderRadius:"99px",padding:"2px 9px"}}>✓ Delivered</span>
                  :<span style={{fontSize:"10.5px",color:"#fcd34d",background:"#1a0f00",border:"1px solid #92400e60",borderRadius:"99px",padding:"2px 8px"}}>{pendingConfirm.length} awaiting confirm</span>}
                {pendingConfirm.length>0&&canDispatch&&<button onClick={()=>finaliseDispatch(group.partyName,pendingConfirm)} disabled={confirmingDispatch===group.partyName}
                  style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",padding:"4px 9px",color:"#4ade80",fontWeight:"700",fontSize:"11px",cursor:"pointer",whiteSpace:"nowrap"}}>
                  {confirmingDispatch===group.partyName?"…":"✓ Dispatched"}
                </button>}
                {pendingConfirm.length>0&&canDispatch&&!group.isDirect&&<button onClick={()=>revertWholeOrder(group,true)} disabled={!!reverting}
                  style={{background:"#12083a",border:"1px solid #7c3aed",borderRadius:"6px",padding:"4px 9px",color:"#c4b5fd",fontWeight:"700",fontSize:"11px",cursor:"pointer",whiteSpace:"nowrap"}}>
                  📦 → Transport Prep
                </button>}
                {pendingConfirm.length>0&&canDispatch&&group.isDirect&&<button onClick={()=>revertWholeOrder(group,false)} disabled={!!reverting}
                  style={{background:"#1a0a00",border:"1px solid #92400e",borderRadius:"6px",padding:"4px 9px",color:"#fcd34d",fontWeight:"700",fontSize:"11px",cursor:"pointer",whiteSpace:"nowrap"}}>
                  ↩ All → Pending
                </button>}
                {anyReversible&&canDispatch&&<button onClick={()=>openReverseForm(group.partyName,group.items.filter(i=>i.canReverse))} disabled={confirmingDispatch===group.partyName+"_reverse"}
                  style={{background:"#2e0a0a",border:"1px solid #7f1d1d",borderRadius:"6px",padding:"4px 9px",color:"#f87171",fontWeight:"700",fontSize:"11px",cursor:"pointer",whiteSpace:"nowrap"}}>
                  ↩ Reverse (24h)
                </button>}
              </div>
            </div>
            <div style={{background:"#060d1a",borderTop:"1px solid #0f172a"}}>
              {group.items.map((item,ii)=>{
                return <div key={ii} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 12px",borderTop:ii===0?"none":"1px solid #0f172a",gap:"6px",opacity:item.confirmed?0.6:1}}>
                  <div style={{fontSize:"11.5px",color:item.confirmed?"#64748b":"#e2e8f0",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</div>
                  <div style={{display:"flex",gap:"5px",alignItems:"center",flexShrink:0}}>
                    <span style={{fontSize:"12.5px",fontWeight:"700",color:item.confirmed?"#475569":"#4ade80"}}>{item.qty}</span>
                    {(()=>{const ct=calcCartons(item.name,item.qty);return ct&&(ct.cartons>0||ct.loose>0)?<span style={{fontSize:"10px",color:"#a78bfa",background:"#12083a",border:"1px solid #7c3aed30",borderRadius:"4px",padding:"1px 5px"}}>{ct.cartons>0?ct.cartons+" ctn":""}{ct.loose>0?(ct.cartons>0?" + ":"")+ct.loose+" loose":""}</span>:null;})()}
                    {item.confirmed&&<span style={{fontSize:"9px",color:"#4ade80",background:"#052e16",borderRadius:"3px",padding:"1px 5px"}}>✓</span>}
                    <span style={{fontSize:"9.5px",color:"#334155"}}>{item.voucherNo}</span>
                  </div>
                  {canDispatch&&!item.confirmed&&(()=>{
                    const rKey=item.orderId+"__"+item.name;
                    const isReverting=reverting===rKey;
                    const showInput=revertForm[rKey]!==undefined;
                    return showInput
                      ?<div style={{display:"flex",gap:"4px",alignItems:"center",flexShrink:0}}>
                          <input type="number" min="0.001" max={item.qty} step="0.001" value={revertForm[rKey]} onChange={e=>setRevertForm(f=>({...f,[rKey]:e.target.value}))}
                            style={{...inp,width:"65px",padding:"3px 5px",fontSize:"11px",textAlign:"center"}} placeholder={`max ${item.qty}`} autoFocus/>
                          <button onClick={()=>revertDispatch(item.orderId,item.name,revertForm[rKey],item.qty)} disabled={isReverting}
                            style={{background:"#052e16",border:"1px solid #166534",borderRadius:"4px",color:"#4ade80",fontSize:"10.5px",fontWeight:"700",padding:"3px 8px",cursor:"pointer",whiteSpace:"nowrap"}}>
                            {isReverting?"…":"↩ Move"}
                          </button>
                          <button onClick={()=>setRevertForm(f=>{const n={...f};delete n[rKey];return n;})}
                            style={{background:"none",border:"1px solid #334155",borderRadius:"4px",color:"#475569",fontSize:"10.5px",padding:"3px 6px",cursor:"pointer"}}>✕</button>
                        </div>
                      :<div style={{display:"flex",gap:"4px",flexShrink:0}}>
                          {!group.isDirect&&<button onClick={()=>revertDispatch(item.orderId,item.name,String(item.qty),item.qty,true)}
                            style={{background:"#12083a",border:"1px solid #7c3aed",borderRadius:"5px",color:"#c4b5fd",fontSize:"10.5px",fontWeight:"700",padding:"2px 7px",cursor:"pointer",whiteSpace:"nowrap"}}>
                            📦 Prep
                          </button>}
                          <button onClick={()=>setRevertForm(f=>({...f,[rKey]:String(item.qty)}))}
                            style={{background:"#1a0a00",border:"1px solid #92400e",borderRadius:"5px",color:"#fcd34d",fontSize:"10.5px",fontWeight:"700",padding:"2px 7px",cursor:"pointer",flexShrink:0,whiteSpace:"nowrap"}}>
                            ↩
                          </button>
                        </div>;
                  })()}
                </div>;
              })}
            </div>
          </div>;
          })}
        </div>}
    </div>}

    {/* ── PARTIAL REVERSE MODAL ── */}
    {reverseForm&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.78)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#0b1220",border:"1px solid #7f1d1d",borderRadius:"14px",padding:"20px",width:"min(500px,96vw)",maxHeight:"90vh",overflowY:"auto"}}>
