}

function TrialCard({trial,index,onDelete,onUpdate,isAdmin,sysUnits,onAddUnit}){
  const ING_UNITS_EFF=sysUnits&&sysUnits.length?sysUnits:[...ING_UNITS,...BATCH_UNITS.filter(u=>!ING_UNITS.includes(u))];
  const [open,setOpen]=useState(false);
  const [editing,setEditing]=useState(false);
  const [showRF,setShowRF]=useState(false);
  const [showOU,setShowOU]=useState(false);
  const [newOutcome,setNewOutcome]=useState(trial.outcome);
  const [saving,setSaving]=useState(false);
  const blankR={date:today(),testedBy:"",testsPerformed:"",results:"",recommendation:"Pass",remarks:""};
  const [rForm,setRForm]=useState(blankR);

  // Edit form state — pre-filled from trial
  const blankIng=()=>({id:newId(),material:"",quantity:"",unit:"kg",notes:""});
  const [editForm,setEditForm]=useState({
    trialName:trial.trialName||"",date:trial.date||today(),triedBy:trial.triedBy||"",
    outcome:trial.outcome||"Under Evaluation",
    ingredients:trial.ingredients?.length?trial.ingredients:[blankIng()],
    process:trial.process||"",propertiesTested:trial.propertiesTested||"",
    observations:trial.observations||"",nextSteps:trial.nextSteps||""
  });

  const reports=trial.testReports||[];
  const displayOutcome=editing?editForm.outcome:(trial.outcome||"Under Evaluation");
  const oc=OUTCOME_COLORS[displayOutcome]||"#94a3b8";
  const isEval=trial.outcome==="Under Evaluation";

  const saveEdit=async()=>{
    setSaving(true);
    await onUpdate({...trial,...editForm,ingredients:editForm.ingredients.filter(r=>r.material.trim())});
    setEditing(false);setSaving(false);
  };

  const updIng=(idx,field,val)=>setEditForm(f=>({...f,ingredients:f.ingredients.map((r,i)=>i===idx?{...r,[field]:val}:r)}));
  const addIng=()=>setEditForm(f=>({...f,ingredients:[...f.ingredients,blankIng()]}));
  const remIng=(idx)=>setEditForm(f=>({...f,ingredients:f.ingredients.filter((_,i)=>i!==idx)}));

  const addReport=async()=>{
    if(!rForm.results.trim()&&!rForm.testsPerformed.trim())return;
    setSaving(true);
    const nr={...rForm,id:newId()};
    await onUpdate({...trial,testReports:[...reports,nr]});
    setRForm(blankR);setShowRF(false);
    setNewOutcome(REC_TO_OUTCOME[nr.recommendation]||trial.outcome);
    setShowOU(true);setSaving(false);
  };

  const applyOutcome=async()=>{
    setSaving(true);
    await onUpdate({...trial,outcome:newOutcome});
    setShowOU(false);setSaving(false);
  };

  return <div style={{border:`1px solid ${editing?"#3b82f680":isEval?"#7c3aed40":"#1e293b"}`,borderRadius:"12px",overflow:"hidden",marginBottom:"10px"}}>
    <div onClick={()=>!editing&&setOpen(o=>!o)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 18px",cursor:editing?"default":"pointer",background:open||editing?"#0b1626":"#0b1220",transition:"background 0.15s"}}>
      <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
        <div style={{background:"#1e293b",borderRadius:"8px",padding:"5px 10px",fontSize:"11px",fontWeight:"700",color:"#64748b",flexShrink:0}}>Trial {index+1}</div>
        <div>
          <div style={{fontSize:"13.5px",fontWeight:"600",color:"#e2e8f0"}}>{trial.trialName||`Trial ${index+1}`}</div>
          <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>{trial.date}{trial.triedBy?` · ${trial.triedBy}`:""} · {trial.ingredients?.length||0} ingredients{reports.length>0?` · 📋 ${reports.length} report${reports.length!==1?"s":""}`:""}</div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
        {isEval&&!editing&&<span style={{fontSize:"10px",fontWeight:"700",color:"#a855f7",background:"#a855f718",border:"1px solid #a855f730",padding:"2px 8px",borderRadius:"99px",whiteSpace:"nowrap"}}>⏳ Evaluating</span>}
        <Bdg label={displayOutcome} color={oc}/>
        {onDelete&&!editing&&<button onClick={e=>{e.stopPropagation();setOpen(true);setEditing(true);}} style={{background:"#1e3a5f",border:"1px solid #2563eb40",borderRadius:"6px",color:"#93c5fd",cursor:"pointer",fontSize:"11.5px",fontWeight:"600",padding:"3px 10px"}}>✏️ Edit</button>}
        {onDelete&&!editing&&<button onClick={e=>{e.stopPropagation();onDelete(trial.id)}} style={{background:"none",border:"none",color:"#334155",fontSize:"14px",padding:"2px 4px"}}>🗑</button>}
        {!editing&&<span style={{color:"#334155",fontSize:"12px"}}>{open?"▲":"▼"}</span>}
      </div>
    </div>

    {/* ── EDIT MODE ── */}
    {editing&&<div style={{padding:"16px 18px",borderTop:"1px solid #2563eb40",background:"#060d1a"}}>
      <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"14px",display:"flex",alignItems:"center",gap:"8px"}}>
        ✏️ Editing Trial {index+1}
        <span style={{fontSize:"10px",fontWeight:"400",color:"#475569"}}>Changes apply after Save</span>
      </div>
      <Grid3>
        <Field label="Trial Name"><input style={inp} value={editForm.trialName} onChange={e=>setEditForm({...editForm,trialName:e.target.value})} placeholder={`Trial ${index+1}`}/></Field>
        <Field label="Date"><input type="date" style={inp} value={editForm.date} onChange={e=>setEditForm({...editForm,date:e.target.value})}/></Field>
        <Field label="Tried By"><input style={inp} value={editForm.triedBy} onChange={e=>setEditForm({...editForm,triedBy:e.target.value})}/></Field>
      </Grid3>
      <Field label="Outcome">
        <select style={sl} value={editForm.outcome} onChange={e=>setEditForm({...editForm,outcome:e.target.value})}>
          {TRIAL_OUTCOMES.map(o=><option key={o}>{o}</option>)}
        </select>
      </Field>
      {/* Ingredients */}
      <div style={{marginBottom:"12px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>Formulation / Ingredients</div>
        <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"6px"}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 80px 80px 2fr 28px",background:"#0b1220",padding:"7px 12px",gap:"6px"}}>
            {["Material / Ingredient","Qty","Unit","Notes",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
          </div>
          {editForm.ingredients.map((r,i)=>(
            <div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 80px 80px 2fr 28px",padding:"6px 12px",gap:"6px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
              <input style={sml} value={r.material} onChange={e=>updIng(i,"material",e.target.value)} placeholder="Material name"/>
              <input style={{...sml,textAlign:"center"}} type="number" value={r.quantity} onChange={e=>updIng(i,"quantity",e.target.value)} placeholder="0"/>
              <select style={{...sml,padding:"6px 4px"}} value={r.unit} onChange={e=>updIng(i,"unit",e.target.value)}>
                {ING_UNITS_EFF.map(u=><option key={u}>{u}</option>)}
              </select>
              <input style={sml} value={r.notes} onChange={e=>updIng(i,"notes",e.target.value)} placeholder="Notes"/>
              <button onClick={()=>remIng(i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
            </div>
          ))}
        </div>
        <button onClick={addIng} style={{background:"none",border:"1px dashed #1e293b",borderRadius:"6px",padding:"5px 12px",color:"#475569",cursor:"pointer",fontSize:"12px",width:"100%"}}>+ Add Row</button>
      </div>
      <Grid2>
        <Field label="Process / Mixing Method"><textarea style={{...ta,minHeight:"72px"}} value={editForm.process} onChange={e=>setEditForm({...editForm,process:e.target.value})}/></Field>
        <Field label="Properties Tested"><textarea style={{...ta,minHeight:"72px"}} value={editForm.propertiesTested} onChange={e=>setEditForm({...editForm,propertiesTested:e.target.value})}/></Field>
      </Grid2>
      <Grid2>
        <Field label="Observations / Results"><textarea style={{...ta,minHeight:"72px"}} value={editForm.observations} onChange={e=>setEditForm({...editForm,observations:e.target.value})}/></Field>
        <Field label="Next Steps"><textarea style={{...ta,minHeight:"72px"}} value={editForm.nextSteps} onChange={e=>setEditForm({...editForm,nextSteps:e.target.value})}/></Field>
      </Grid2>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"4px"}}>
        <Btn label="Cancel" onClick={()=>{setEditing(false);setEditForm({trialName:trial.trialName||"",date:trial.date||today(),triedBy:trial.triedBy||"",outcome:trial.outcome||"Under Evaluation",ingredients:trial.ingredients?.length?trial.ingredients:[blankIng()],process:trial.process||"",propertiesTested:trial.propertiesTested||"",observations:trial.observations||"",nextSteps:trial.nextSteps||""});}} outline color="#475569" small/>
        <Btn label={saving?"Saving…":"💾 Save Changes"} onClick={saveEdit} disabled={saving} color="#2563eb" small/>
      </div>
    </div>}

    {/* ── VIEW MODE ── */}
    {open&&!editing&&<div style={{padding:"16px 18px 20px",borderTop:"1px solid #1e293b",background:"#080d18"}}>
      {trial.ingredients?.length>0&&<div style={{marginBottom:"14px"}}>
        <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"8px"}}>Formulation</div>
        <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden"}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 80px 70px 2fr",background:"#0b1220",padding:"8px 14px",gap:"8px"}}>
            {["Material","Qty","Unit","Notes"].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
          </div>
          {trial.ingredients.map((r,i)=><div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 80px 70px 2fr",padding:"8px 14px",gap:"8px",borderTop:"1px solid #0f1929",background:i%2===0?"transparent":"#0a1422"}}>
            <div style={{fontSize:"13px",color:"#cbd5e1",fontWeight:"500"}}>{r.material||"—"}</div>
            <div style={{fontSize:"13px",color:"#94a3b8"}}>{r.quantity||"—"}</div>
            <div style={{fontSize:"13px",color:"#64748b"}}>{r.unit}</div>
            <div style={{fontSize:"12px",color:"#475569",fontStyle:"italic"}}>{r.notes||""}</div>
          </div>)}
        </div>
      </div>}
      {[["Process / Mixing Method",trial.process],["Properties Tested",trial.propertiesTested],["Observations / Results",trial.observations],["Next Steps",trial.nextSteps]].map(([label,val])=>val&&<div key={label} style={{marginBottom:"12px"}}>
        <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"5px"}}>{label}</div>
        <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"10px 13px",fontSize:"13px",color:"#94a3b8",lineHeight:1.65,whiteSpace:"pre-wrap"}}>{val}</div>
      </div>)}
      {/* Test Reports section */}
      <div style={{marginTop:"16px",borderTop:"1px solid #1e293b",paddingTop:"16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
          <span style={{fontSize:"11px",fontWeight:"700",color:isEval?"#a855f7":"#475569",textTransform:"uppercase",letterSpacing:"0.09em"}}>📋 Test Reports ({reports.length})</span>
          <button onClick={()=>{setShowRF(v=>!v);setShowOU(false);}} style={{background:isEval?"#3b0764":"#1e293b",border:`1px solid ${isEval?"#7c3aed":"#334155"}`,borderRadius:"7px",padding:"5px 12px",color:isEval?"#c4b5fd":"#64748b",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>
            {showRF?"▲ Cancel":"+ Add Test Report"}</button>
        </div>
        {reports.map((r,i)=><TestReportCard key={r.id} report={r} num={i+1} onDelete={async(id)=>await onUpdate({...trial,testReports:reports.filter(r=>r.id!==id)})}/>)}
        {reports.length===0&&!showRF&&<div style={{textAlign:"center",padding:"12px",border:"1px dashed #1e293b",borderRadius:"8px",marginBottom:"8px"}}>
          <div style={{fontSize:"12px",color:"#334155"}}>{isEval?"⏳ Add a test report to evaluate this trial.":"No test reports yet."}</div>
        </div>}
        {showRF&&<div style={{background:"#0a0f1e",border:"1px solid #7c3aed40",borderRadius:"10px",padding:"14px",marginBottom:"10px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#c4b5fd",marginBottom:"12px"}}>📋 New Test Report #{reports.length+1}</div>
          <Grid3>
            <Field label="Date"><input type="date" style={inp} value={rForm.date} onChange={e=>setRForm({...rForm,date:e.target.value})}/></Field>
            <Field label="Tested By"><input style={inp} value={rForm.testedBy} onChange={e=>setRForm({...rForm,testedBy:e.target.value})}/></Field>
            <Field label="Recommendation"><select style={{...sl,borderColor:(REC_COLORS[rForm.recommendation]||"#1e293b")+"60"}} value={rForm.recommendation} onChange={e=>setRForm({...rForm,recommendation:e.target.value})}>
              {Object.keys(REC_COLORS).map(r=><option key={r}>{r}</option>)}</select></Field>
          </Grid3>
          <Grid2>
            <Field label="Tests Performed"><textarea style={{...ta,minHeight:"70px"}} value={rForm.testsPerformed} onChange={e=>setRForm({...rForm,testsPerformed:e.target.value})} placeholder="Viscosity, pH, Gloss..."/></Field>
            <Field label="Results / Values *"><textarea style={{...ta,minHeight:"70px"}} value={rForm.results} onChange={e=>setRForm({...rForm,results:e.target.value})} placeholder="Measured values, pass/fail vs spec..."/></Field>
          </Grid2>
          <Field label="Remarks"><textarea style={{...ta,minHeight:"50px"}} value={rForm.remarks} onChange={e=>setRForm({...rForm,remarks:e.target.value})}/></Field>
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
            <Btn label="Cancel" onClick={()=>setShowRF(false)} outline color="#475569" small/>
            <Btn label={saving?"Saving…":"Save Report"} onClick={addReport} disabled={saving} color="#7c3aed" small/>
          </div>
        </div>}
        {showOU&&<div style={{background:"#0c1a2e",border:"1px solid #2563eb60",borderRadius:"10px",padding:"14px",marginTop:"6px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"6px"}}>🔄 Update Trial Outcome</div>
          <div style={{fontSize:"12.5px",color:"#475569",marginBottom:"10px"}}>Suggested: <strong style={{color:OUTCOME_COLORS[newOutcome]||"#93c5fd"}}>{newOutcome}</strong></div>
          <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
            <select style={{...sl,flex:1,minWidth:"180px"}} value={newOutcome} onChange={e=>setNewOutcome(e.target.value)}>{TRIAL_OUTCOMES.map(o=><option key={o}>{o}</option>)}</select>
            <Btn label={saving?"Saving…":"✓ Update"} onClick={applyOutcome} disabled={saving} color="#2563eb" small/>
            <Btn label="Keep as is" onClick={()=>setShowOU(false)} outline color="#475569" small/>
          </div>
        </div>}
      </div>
    </div>}
  </div>;
}

function ProjectWorkspace({project,isAdmin,showToast,sysUnits,sysRmCats,onAddRmCat,onAddUnit}){
  const [live,setLive]=useState(project);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [editNotes,setEditNotes]=useState(false);
  const [editObj,setEditObj]=useState(false);
  const [draft,setDraft]=useState({objective:project.objective||"",formulationBase:project.formulationBase||"",notes:project.notes||""});
  const [savingN,setSavingN]=useState(false);
  const blank={trialName:"",date:today(),triedBy:"",outcome:"Under Evaluation",ingredients:[{id:"1",material:"",quantity:"",unit:"g",notes:""}],process:"",propertiesTested:"",observations:"",nextSteps:"",testReports:[]};
  const [form,setForm]=useState(blank);
  const accent=PAINT_ACCENT[live.paintType]||"#cbd5e1";
  const sc=STATUS_COLORS[live.status]||"#94a3b8";
  const trials=live.trials||[];

  useEffect(()=>{
    const unsub=C("rd_projects").doc(project.id).onSnapshot(snap=>{
      if(snap.exists)setLive({id:snap.id,...snap.data()});
    });
    return unsub;
  },[project.id]);

  const saveNotes=async()=>{
    setSavingN(true);
    try{await C("rd_projects").doc(project.id).update({objective:draft.objective,formulationBase:draft.formulationBase,notes:draft.notes});setEditNotes(false);setEditObj(false);showToast("Updated ✓");}catch(e){showToast("Error","error");}
    setSavingN(false);
  };

  const saveTrial=async()=>{
    if(!form.observations.trim()&&!form.ingredients.some(r=>r.material.trim()))return showToast("Add ingredients or observations","error");
    if(saving)return;setSaving(true);
    try{await C("rd_projects").doc(project.id).update({trials:[...trials,{...form,id:newId()}]});setForm(blank);setShowForm(false);showToast("Trial saved ✓");}catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const deleteTrial=async(id)=>{
    if(!isAdmin){showToast("Admin only","error");return;}
    if(!confirm("Delete trial?"))return;
    await C("rd_projects").doc(project.id).update({trials:trials.filter(t=>t.id!==id)});
  };

  const updateTrial=async(updated)=>{
    await C("rd_projects").doc(project.id).update({trials:trials.map(t=>t.id===updated.id?updated:t)});
  };

  const approved=trials.find(t=>t.outcome==="Approved as Final");

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px",gap:"8px"}}>
      <div>
        <div style={{fontSize:"22px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>{live.projectName}</div>
        <div style={{fontSize:"12px",color:"#64748b",marginTop:"3px"}}>#{live.projectCode} · Created {live.dateCreated}</div>
      </div>
      <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
        {!isAdmin&&<Bdg label="👁 View only" color="#475569" small/>}
        <Bdg label={live.status} color={sc}/>
      </div>
    </div>
    <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"16px"}}>
      {[["🎨",live.paintType,accent],["🏗",live.application||null,"#64748b"],["👤",live.assignedTo||null,"#64748b"],["🗓",live.targetDate||null,"#64748b"]].map(([icon,val,color])=>val&&<span key={icon} style={{fontSize:"12px",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"5px 12px",color}}>{icon} {val}</span>)}
    </div>
    {/* Objective */}
    <div style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:`3px solid ${accent}`,borderRadius:"8px",padding:"12px 14px",marginBottom:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}}>
        <span style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em"}}>Objective</span>
        {isAdmin&&!editObj&&<button onClick={()=>{setEditObj(true);setDraft(d=>({...d,objective:live.objective||""}))}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 10px",color:"#475569",fontSize:"11px",cursor:"pointer"}}>✏️ Edit</button>}
      </div>
      {editObj?<div><textarea style={{...ta,minHeight:"70px",marginBottom:"8px"}} value={draft.objective} onChange={e=>setDraft(d=>({...d,objective:e.target.value}))}/>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setEditObj(false)} outline color="#475569" small/>
          <Btn label={savingN?"Saving…":"Save"} onClick={saveNotes} disabled={savingN} color="#3b82f6" small/>
        </div>
      </div>:<div style={{fontSize:"13.5px",color:"#94a3b8",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{live.objective||<span style={{color:"#334155",fontStyle:"italic"}}>No objective set.{isAdmin?" Click Edit to add.":""}</span>}</div>}
    </div>
    {approved&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"10px",padding:"12px 16px",marginBottom:"16px",display:"flex",alignItems:"center",gap:"10px"}}>
      <span style={{fontSize:"18px"}}>✅</span>
      <div><div style={{fontSize:"12px",fontWeight:"700",color:"#22c55e"}}>Approved Final Formulation</div>
      <div style={{fontSize:"12px",color:"#16a34a"}}>{approved.trialName||"A trial"} approved.</div></div>
    </div>}
    <SectionHead title={`Formulation Trials (${trials.length})`} action={
      <button onClick={()=>setShowForm(v=>!v)} style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"8px",padding:"6px 14px",color:"#93c5fd",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
        {showForm?"▲ Cancel":"+ Log New Trial"}</button>}/>
    {showForm&&<div style={{border:"1px solid #2563eb",borderRadius:"12px",padding:"20px",background:"#060d1a",marginBottom:"14px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"14px"}}>⚗️ Trial #{trials.length+1}</div>
      <Grid4>
        <Field label="Trial Name"><input style={inp} value={form.trialName} onChange={e=>setForm({...form,trialName:e.target.value})} placeholder="e.g. Low-VOC batch v1"/></Field>
        <Field label="Date"><input type="date" style={inp} value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        <Field label="Tried By"><input style={inp} value={form.triedBy} onChange={e=>setForm({...form,triedBy:e.target.value})}/></Field>
        <Field label="Outcome"><select style={sl} value={form.outcome} onChange={e=>setForm({...form,outcome:e.target.value})}>{TRIAL_OUTCOMES.map(o=><option key={o}>{o}</option>)}</select></Field>
      </Grid4>
      <Field label="Formulation — Ingredients"><IngredientTable rows={form.ingredients} onChange={rows=>setForm({...form,ingredients:rows})}/></Field>
      <Grid2>
        <Field label="Process / Mixing Method"><textarea style={{...ta,minHeight:"70px"}} value={form.process} onChange={e=>setForm({...form,process:e.target.value})} placeholder="Mixing sequence, temperature, RPM..."/></Field>
        <Field label="Properties Tested"><textarea style={{...ta,minHeight:"70px"}} value={form.propertiesTested} onChange={e=>setForm({...form,propertiesTested:e.target.value})} placeholder="Viscosity, pH, Gloss..."/></Field>
      </Grid2>
      <Field label="Observations *"><textarea style={{...ta,minHeight:"70px"}} value={form.observations} onChange={e=>setForm({...form,observations:e.target.value})} placeholder="What happened? Values, appearance, issues..."/></Field>
      <Field label="Next Steps"><textarea style={{...ta,minHeight:"50px"}} value={form.nextSteps} onChange={e=>setForm({...form,nextSteps:e.target.value})}/></Field>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowForm(false)} outline color="#475569" small/>
        <Btn label={saving?"Saving…":"Save Trial"} onClick={saveTrial} disabled={saving} color="#2563eb" small/>
      </div>
    </div>}
    {trials.length===0&&!showForm?<div style={{textAlign:"center",padding:"24px",border:"1px dashed #1e293b",borderRadius:"10px",marginBottom:"14px"}}>
      <div style={{fontSize:"26px",marginBottom:"6px"}}>⚗️</div>
      <div style={{fontSize:"13px",color:"#475569"}}>No trials yet.</div>
    </div>:trials.map((t,i)=><TrialCard key={t.id} trial={t} index={i} isAdmin={isAdmin} onDelete={isAdmin?deleteTrial:null} onUpdate={updateTrial} sysUnits={sysUnits} onAddUnit={onAddUnit}/>)}
    {/* Notes section */}
    <div style={{marginTop:"20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px",paddingBottom:"10px",borderBottom:"1px solid #1e293b"}}>
        <span style={{fontSize:"12px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.1em"}}>Formulation Base & Notes</span>
        {isAdmin&&!editNotes&&<button onClick={()=>{setEditNotes(true);setDraft(d=>({...d,formulationBase:live.formulationBase||"",notes:live.notes||""}))}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 10px",color:"#475569",fontSize:"11px",cursor:"pointer"}}>✏️ Edit</button>}
      </div>
      {editNotes?<div>
        <Field label="Formulation Base"><textarea style={ta} value={draft.formulationBase} onChange={e=>setDraft(d=>({...d,formulationBase:e.target.value}))}/></Field>
        <Field label="Notes"><textarea style={{...ta,minHeight:"56px"}} value={draft.notes} onChange={e=>setDraft(d=>({...d,notes:e.target.value}))}/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginBottom:"10px"}}>
          <Btn label="Cancel" onClick={()=>setEditNotes(false)} outline color="#475569" small/>
          <Btn label={savingN?"Saving…":"Save Changes"} onClick={saveNotes} disabled={savingN} color="#3b82f6" small/>
        </div>
      </div>:<>
        {[["Formulation Base",live.formulationBase],["Notes",live.notes]].map(([label,val])=><div key={label} style={{marginBottom:"10px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"4px"}}>{label}</div>
          <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"10px 13px",fontSize:"13px",color:val?"#94a3b8":"#334155",lineHeight:1.65,whiteSpace:"pre-wrap",fontStyle:val?"normal":"italic"}}>
            {val||(isAdmin?`No ${label.toLowerCase()} yet. Click Edit above.`:`No ${label.toLowerCase()} added yet.`)}
          </div>
        </div>)}
      </>}
    </div>
  </div>;
}

function ProjectCard({p,onClick,onDelete,onEdit,isAdmin}){
  const accent=PAINT_ACCENT[p.paintType]||"#cbd5e1";
  const sc=STATUS_COLORS[p.status]||"#94a3b8";
  const tc=(p.trials||[]).length;
  const hasFinal=(p.trials||[]).some(t=>t.outcome==="Approved as Final");
  return <div onClick={onClick} onMouseEnter={e=>e.currentTarget.style.background="#0f1f35"} onMouseLeave={e=>e.currentTarget.style.background="#0f172a"}
    style={{background:"#0f172a",border:"1px solid #1e293b",borderLeft:`3px solid ${accent}`,borderRadius:"12px",padding:"15px 20px",cursor:"pointer",transition:"background 0.15s",boxShadow:"0 2px 10px rgba(0,0,0,0.3)",marginBottom:"10px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}>
      <div style={{flex:1}}>
        <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9",marginBottom:"3px",fontFamily:"'DM Serif Display',serif"}}>{p.projectName}</div>
        <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"6px"}}>#{p.projectCode} · {p.paintType} · {p.application||"—"}</div>
      </div>
      <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
        <Bdg label={p.status} color={sc}/>
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onEdit(p)}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",color:"#475569",fontSize:"12px",padding:"2px 8px",cursor:"pointer"}}>✏️</button>}
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onDelete(p.id)}} style={{background:"none",border:"none",color:"#334155",fontSize:"15px",padding:"2px 4px",cursor:"pointer"}}>🗑</button>}
      </div>
    </div>
    <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:"11px",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"6px",padding:"2px 9px",color:tc>0?"#93c5fd":"#334155"}}>
        ⚗️ {tc} Trial{tc!==1?"s":""}{hasFinal&&<span style={{color:"#22c55e",marginLeft:"5px"}}>✓ Final</span>}
      </span>
      {p.assignedTo&&<span style={{fontSize:"11px",color:"#475569"}}>👤 {p.assignedTo}</span>}
    </div>
  </div>;
}

// ══ RM MODULE
function RMCard({r,onClick,onDelete,onEdit,isAdmin}){
  const rc=RESULT_COLORS[r.testResult]||"#94a3b8";
  const retestCount=(r.retests||[]).length;
  return <div onClick={onClick} onMouseEnter={e=>e.currentTarget.style.background="#0f1f35"} onMouseLeave={e=>e.currentTarget.style.background="#0f172a"}
    style={{background:"#0f172a",border:"1px solid #1e293b",borderLeft:`3px solid ${rc}`,borderRadius:"12px",padding:"15px 20px",cursor:"pointer",transition:"background 0.15s",boxShadow:"0 2px 10px rgba(0,0,0,0.3)",marginBottom:"10px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}>
      <div style={{flex:1}}>
        <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9",marginBottom:"3px",fontFamily:"'DM Serif Display',serif"}}>{r.materialName}</div>
        <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"6px"}}>{r.vendorName} · {r.category} · Batch: {r.batchNo||"—"}</div>
      </div>
      <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
        {r.testResult==="Retest Required"&&<Bdg label="⚠️ Retest" color="#f97316" small/>}
        <Bdg label={r.testResult} color={rc}/>
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onEdit(r)}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",color:"#475569",fontSize:"12px",padding:"2px 8px",cursor:"pointer"}}>✏️</button>}
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onDelete(r.id)}} style={{background:"none",border:"none",color:"#334155",fontSize:"15px",padding:"2px 4px",cursor:"pointer"}}>🗑</button>}
      </div>
    </div>
    <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
      {r.dateReceived&&<span style={{fontSize:"11px",color:"#475569"}}>📦 {r.dateReceived}</span>}
      {r.testedBy&&<span style={{fontSize:"11px",color:"#475569"}}>🔬 {r.testedBy}</span>}
      {retestCount>0&&<span style={{fontSize:"11px",color:"#f97316",background:"#f9731612",border:"1px solid #f9731625",borderRadius:"6px",padding:"2px 8px"}}>🔄 {retestCount} retest{retestCount!==1?"s":""}</span>}
    </div>
  </div>;
}

function RMDetailView({entry,showToast}){
  const [live,setLive]=useState(entry);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [showOU,setShowOU]=useState(false);
  const [newResult,setNewResult]=useState(entry.testResult);
  const blank={date:today(),testedBy:"",testsPerformed:"",results:"",newResult:"Pass",remarks:""};
  const [retestForm,setRetestForm]=useState(blank);

  useEffect(()=>{
    const unsub=C("rm_tests").doc(entry.id).onSnapshot(snap=>{
      if(snap.exists)setLive({id:snap.id,...snap.data()});
    });
    return unsub;
  },[entry.id]);

  const retests=live.retests||[];
  const rc=RESULT_COLORS[live.testResult]||"#94a3b8";
  const isRetest=live.testResult==="Retest Required";

  const saveRetest=async()=>{
    if(!retestForm.results.trim()&&!retestForm.testsPerformed.trim())return showToast("Add results or tests performed","error");
    if(saving)return;setSaving(true);
    try{
      const nr={...retestForm,id:newId()};
      await C("rm_tests").doc(entry.id).update({retests:[...retests,nr]});
      setRetestForm(blank);setShowForm(false);
      setNewResult(nr.newResult);setShowOU(true);showToast("Retest saved ✓");
    }catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const applyResult=async()=>{
    setSaving(true);
    try{await C("rm_tests").doc(entry.id).update({testResult:newResult});setShowOU(false);showToast("Status updated ✓");}catch(e){showToast("Error","error");}
    setSaving(false);
  };

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"14px",gap:"8px"}}>
      <div>
        <div style={{fontSize:"20px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>{live.materialName}</div>
        <div style={{fontSize:"12px",color:"#64748b"}}>{live.vendorName} · {live.category}</div>
      </div>
      <div style={{display:"flex",gap:"8px",alignItems:"center",flexShrink:0}}>
        {retests.length>0&&<Bdg label={`🔄 ${retests.length} Retest${retests.length!==1?"s":""}`} color="#f97316" small/>}
        <Bdg label={live.testResult} color={rc}/>
      </div>
    </div>
    {isRetest&&<div style={{background:"#431407",border:"1px solid #ea580c50",borderRadius:"10px",padding:"10px 14px",marginBottom:"12px",display:"flex",alignItems:"center",gap:"8px"}}>
      <span>⚠️</span><div><div style={{fontSize:"12px",fontWeight:"700",color:"#f97316"}}>Retest Required</div><div style={{fontSize:"11.5px",color:"#c2410c"}}>This sample needs retesting.</div></div>
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"12px"}}>
      {[["Batch No",live.batchNo],["Lot No",live.lotNo],["Quantity",live.quantityReceived],["Date Received",live.dateReceived],["Tested By",live.testedBy]].map(([l,v])=>v&&<div key={l} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"8px 12px"}}>
        <div style={{fontSize:"10px",color:"#475569",fontWeight:"600",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"2px"}}>{l}</div>
        <div style={{fontSize:"13px",color:"#94a3b8",fontWeight:"600"}}>{v}</div>
      </div>)}
    </div>
    <div style={{border:"1px solid #1e293b",borderRadius:"10px",marginBottom:"12px",overflow:"hidden"}}>
      <div style={{background:"#0b1220",padding:"9px 14px",fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",borderBottom:"1px solid #1e293b"}}>🧫 Original Test</div>
      <div style={{padding:"12px 14px"}}>
        {[["Tests Performed",live.testsPerformed],["Observations / Results",live.observations],["Remarks",live.remarks]].map(([l,v])=>v&&<div key={l} style={{marginBottom:"8px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"3px"}}>{l}</div>
          <div style={{fontSize:"13px",color:"#94a3b8",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{v}</div>
        </div>)}
      </div>
    </div>
    {/* Retests */}
    <div style={{borderTop:"1px solid #1e293b",paddingTop:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
        <span style={{fontSize:"11px",fontWeight:"700",color:isRetest?"#f97316":"#475569",textTransform:"uppercase",letterSpacing:"0.09em"}}>🔄 Retest History ({retests.length})</span>
        <button onClick={()=>{setShowForm(v=>!v);setShowOU(false);}} style={{background:isRetest?"#431407":"#1e293b",border:`1px solid ${isRetest?"#ea580c":"#334155"}`,borderRadius:"7px",padding:"5px 12px",color:isRetest?"#fb923c":"#64748b",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>
          {showForm?"▲ Cancel":"+ Add Retest"}</button>
      </div>
      {retests.length===0&&!showForm&&<div style={{textAlign:"center",padding:"12px",border:"1px dashed #1e293b",borderRadius:"8px",marginBottom:"8px"}}>
        <div style={{fontSize:"12px",color:"#334155"}}>{isRetest?"⏳ Awaiting retest.":"No retests."}</div>
      </div>}
      {retests.map((r,i)=>{
        const rrc=RESULT_COLORS[r.newResult]||"#94a3b8";
        return <div key={r.id} style={{display:"flex",gap:"10px",marginBottom:"10px"}}>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",flexShrink:0}}>
            <div style={{width:"26px",height:"26px",borderRadius:"50%",background:`${rrc}20`,border:`2px solid ${rrc}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",fontWeight:"700",color:rrc}}>{i+1}</div>
            {i<retests.length-1&&<div style={{width:"2px",flex:1,background:"#1e293b",marginTop:"4px"}}/>}
          </div>
          <div style={{flex:1,background:"#0b1220",border:"1px solid #1e293b",borderLeft:`3px solid ${rrc}`,borderRadius:"8px",padding:"10px 12px",marginBottom:"4px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6px"}}>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontSize:"11px",fontWeight:"700",color:"#475569",background:"#1e293b",padding:"2px 8px",borderRadius:"6px"}}>Retest #{i+1}</span>
                {r.date&&<span style={{fontSize:"11px",color:"#475569"}}>📅 {r.date}</span>}
                {r.testedBy&&<span style={{fontSize:"11px",color:"#475569"}}>🔬 {r.testedBy}</span>}
              </div>
              <div style={{display:"flex",gap:"5px",alignItems:"center",flexShrink:0}}>
                <Bdg label={r.newResult} color={rrc} small/>
                <button onClick={async()=>{if(confirm("Delete?"))await C("rm_tests").doc(entry.id).update({retests:retests.filter(x=>x.id!==r.id)});}} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"12px"}}>🗑</button>
              </div>
            </div>
            {[["Tests",r.testsPerformed],["Results",r.results],["Remarks",r.remarks]].map(([l,v])=>v&&<div key={l} style={{marginBottom:"4px"}}>
              <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"2px"}}>{l}</div>
              <div style={{fontSize:"12.5px",color:"#94a3b8",whiteSpace:"pre-wrap"}}>{v}</div>
            </div>)}
          </div>
        </div>;
      })}
      {showForm&&<div style={{background:"#0a0f1e",border:"1px solid #ea580c40",borderRadius:"10px",padding:"14px",marginBottom:"10px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#fb923c",marginBottom:"12px"}}>🔄 Retest #{retests.length+1}</div>
        <Grid3>
          <Field label="Date"><input type="date" style={inp} value={retestForm.date} onChange={e=>setRetestForm({...retestForm,date:e.target.value})}/></Field>
          <Field label="Tested By"><input style={inp} value={retestForm.testedBy} onChange={e=>setRetestForm({...retestForm,testedBy:e.target.value})}/></Field>
          <Field label="Result"><select style={{...sl,borderColor:(RESULT_COLORS[retestForm.newResult]||"#1e293b")+"60"}} value={retestForm.newResult} onChange={e=>setRetestForm({...retestForm,newResult:e.target.value})}>{TEST_RESULTS.map(r=><option key={r}>{r}</option>)}</select></Field>
        </Grid3>
        <Grid2>
          <Field label="Tests Performed"><textarea style={{...ta,minHeight:"70px"}} value={retestForm.testsPerformed} onChange={e=>setRetestForm({...retestForm,testsPerformed:e.target.value})}/></Field>
          <Field label="Results / Values *"><textarea style={{...ta,minHeight:"70px"}} value={retestForm.results} onChange={e=>setRetestForm({...retestForm,results:e.target.value})}/></Field>
        </Grid2>
        <Field label="Remarks"><textarea style={{...ta,minHeight:"50px"}} value={retestForm.remarks} onChange={e=>setRetestForm({...retestForm,remarks:e.target.value})}/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setShowForm(false)} outline color="#475569" small/>
          <Btn label={saving?"Saving…":"Save Retest"} onClick={saveRetest} disabled={saving} color="#ea580c" small/>
        </div>
      </div>}
      {showOU&&<div style={{background:"#0c1a2e",border:"1px solid #2563eb60",borderRadius:"10px",padding:"12px 14px",marginTop:"6px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"6px"}}>🔄 Update Overall Status</div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
          <select style={{...sl,flex:1,minWidth:"170px"}} value={newResult} onChange={e=>setNewResult(e.target.value)}>{TEST_RESULTS.map(r=><option key={r}>{r}</option>)}</select>
          <Btn label={saving?"Saving…":"✓ Update"} onClick={applyResult} disabled={saving} color="#2563eb" small/>
          <Btn label="Keep as is" onClick={()=>setShowOU(false)} outline color="#475569" small/>
        </div>
      </div>}
    </div>
  </div>;
}

// TESTIMONIALS MODULE

function TestimonialsTab({role,user,showToast}){
  const [testimonials,setTestimonials]=useState([]);

  useEffect(()=>{
    const unsub=C("testimonials").orderBy("_createdAt","desc").onSnapshot(snap=>{
      setTestimonials(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    },()=>setLoading(false));
    return unsub;

  const save=async()=>{

</style></head><body>
<div class="header">

</div>
<div class="quote">"${(t.testimonialText||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}"</div>
<div class="customer">${(t.customerName||"").replace(/&/g,"&amp;")}</div>
<div class="meta">${t.product?`Product: ${t.product}`:""} ${t.location?`&nbsp;·&nbsp; ${t.location}`:""} ${t.usedFor?`&nbsp;·&nbsp; ${t.usedFor}`:""}</div>
${imgs.length>0?`<div class="photos">${imgs.slice(0,4).map(i=>`<img src="${i.url}" alt="" onerror="this.style.display='none'"/>`).join("")}</div>`:""}
<div class="footer">Gujarat Colours &amp; Coatings Pvt Ltd &nbsp;·&nbsp; ${t.dateAdded}</div>
</body></html>`;
    const blob=new Blob([html],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");

    a.click();URL.revokeObjectURL(url);

  const ft=testimonials.filter(t=>{
    const q=normalize(search);
    const rs=filterRating==="All"||t.rating===filterRating;

          {t.attachments.filter(a=>a.type?.startsWith("image/")).slice(0,3).map((a,i)=><img key={i} src={a.url} alt="" style={{width:"60px",height:"50px",objectFit:"cover",borderRadius:"5px",border:"1px solid #1e293b"}}/>)}

      <Field label="Customer Testimonial *">
        <textarea style={{...ta,minHeight:"110px"}} value={form.testimonialText} onChange={e=>setForm({...form,testimonialText:e.target.value})} placeholder="What did the customer say about the product? Their experience, results, what they liked…"/>
      </Field>
      <div style={{marginBottom:"14px"}}>

        <span style={{fontSize:"20px",color:ratingColor(viewItem.rating),letterSpacing:"2px"}}>{stars(viewItem.rating)}</span>

      {(viewItem.attachments||[]).length>0&&<div style={{marginBottom:"12px"}}>

      <div style={{marginTop:"12px",display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="📥 Download Testimonial" onClick={()=>downloadTestimonial(viewItem)} color="#3b82f6" small/>

      </div>
    </Modal>}
  </div>;
}

function UsersTab({currentUser}){
  const [profiles,setProfiles]=useState({});  // uid/email -> {email, displayName}
  const [roles,setRoles]=useState({});         // email -> role
  const [editingRole,setEditingRole]=useState(null);
  const [editRoleVals,setEditRoleVals]=useState([]); // array of selected roles
  const [saving,setSaving]=useState(null);
  const [localToast,setLocalToast]=useState(null);
  const showLT=(msg,type="success")=>{setLocalToast({msg,type});setTimeout(()=>setLocalToast(null),3000);};

  const [createEmail,setCreateEmail]=useState("");
  const [createPassword,setCreatePassword]=useState("");
  const [createName,setCreateName]=useState("");
  const [createRole,setCreateRole]=useState("sales");
  const [creating,setCreating]=useState(false);
  const [createError,setCreateError]=useState("");
  const [createSuccess,setCreateSuccess]=useState("");
  const [editPassEmail,setEditPassEmail]=useState(null);
  const [savingPass,setSavingPass]=useState(false);

  useEffect(()=>{
    // Load profiles
    const unsub1=C("userProfiles").onSnapshot(snap=>{
      const p={};
      snap.docs.forEach(d=>{const dat=d.data();if(dat.email)p[dat.email]={...dat,uid:d.id};});
      setProfiles(p);
    });
    // Load roles — this is the source of truth for all users
    const unsub2=C("roles").onSnapshot(snap=>{
      const r={};snap.docs.forEach(d=>{
        const data=d.data();
        // Support both old {role:"x"} and new {roles:["x","y"]} formats
        r[d.id]=data.roles||(data.role?[data.role]:[]);
      });setRoles(r);
    });
    return()=>{unsub1();unsub2();};
  },[]);

  const createUser=async()=>{
    const isAdminRole=createRole==="admin";
    const DOMAIN="@gcc-hub.app";
    if(!createName.trim()&&!isAdminRole)return setCreateError("Name / Username is required.");
    if(!createPassword.trim())return setCreateError("Password is required.");
    if(createPassword.length<6)return setCreateError("Password must be at least 6 characters.");
    if(isAdminRole&&!createEmail.trim())return setCreateError("Admin accounts require a real email address (for password reset).");
    let finalEmail=createEmail.trim();
    if(!finalEmail){
      const username=createName.trim().toLowerCase().replace(/\s+/g,".").replace(/[^a-z0-9._]/g,"");
      finalEmail=username+DOMAIN;
    }
    setCreating(true);setCreateError("");setCreateSuccess("");
    try{
      const res=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${window._firebaseConfig.apiKey}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email:finalEmail,password:createPassword,returnSecureToken:false})
      });
      const data=await res.json();
      if(data.error)throw new Error(data.error.message);
      await C("roles").doc(finalEmail).set({roles:[createRole],role:createRole,assignedBy:currentUser.email,assignedAt:ts()},{merge:true});
      if(createName.trim()){
        await C("userProfiles").doc(data.localId||finalEmail).set({
          email:finalEmail,displayName:createName.trim(),
          isUsernameAccount:!createEmail.trim(),
          createdBy:currentUser.email,createdAt:ts()
        },{merge:true});
      }
      const loginInfo=createEmail.trim()?`Email: ${finalEmail}`:`Login email (auto): ${finalEmail}`;
      setCreateSuccess(`✅ Created: ${createName.trim()||finalEmail} — ${ROLE_LABELS[createRole]} | ${loginInfo}`);
      setCreateEmail("");setCreatePassword("");setCreateName("");setCreateRole("sales");
    }catch(e){
      const m=e.message;
      setCreateError(m==="EMAIL_EXISTS"?"This username/email already exists."
        :m.includes("WEAK_PASSWORD")?"Password must be 6+ characters.":m||"Error creating user.");
    }
    setCreating(false);
  };

  const saveRoleEdit=async(email)=>{
    if(!editRoleVals.length)return showLT("Select at least one role","error");
    setSaving(email);
    try{
      const prim=primaryRole(editRoleVals);
      await C("roles").doc(email).set({roles:editRoleVals,role:prim,assignedBy:currentUser.email,assignedAt:ts()},{merge:true});
      setEditingRole(null);showLT(`Roles updated ✓`);
    }catch(e){showLT("Error updating role","error");}
    setSaving(null);
  };

  const removeAccess=async(email)=>{
    if(!confirm(`Remove ${email}'s access? They will see "Access Pending" until re-assigned.`))return;
    try{await C("roles").doc(email).delete();showLT("Access removed ✓");}
    catch(e){showLT("Error","error");}
  };

  const sendReset=async(email)=>{
    setSavingPass(true);
    try{await auth.sendPasswordResetEmail(email);showLT(`Reset email sent to ${email} ✓`);setEditPassEmail(null);}
    catch(e){showLT("Error: "+e.message,"error");}
    setSavingPass(false);
  };

  const [newPassVal,setNewPassVal]=useState("");
  const [passError,setPassError]=useState("");

  const adminChangePass=async(email)=>{
    if(!newPassVal||newPassVal.length<6){setPassError("Password must be at least 6 characters");return;}
    setSavingPass(true);setPassError("");
    try{
      // Store new password in passwordResets collection — applied on next login for all account types
      await C("passwordResets").doc(email).set({
        newPassword:newPassVal,setBy:"admin",setAt:today(),email,_createdAt:ts()
      });
      showLT(`Password set ✓ — will apply when ${email.endsWith("@gcc-hub.app")?"user":"user"} next logs in`);
      setEditPassEmail(null);setNewPassVal("");
    }catch(e){setPassError(e.message||"Error");}
    setSavingPass(false);
  };

  // Merge roles + profiles into single list — roles is the master list
  const allEmails=[...new Set([...Object.keys(roles),...Object.keys(profiles)])].filter(Boolean).sort();

  return <div>
    <SectionHead title="User Management"/>

    {/* CREATE */}
    <div style={{background:"#0a1628",border:"1px solid #1e3a5f",borderRadius:"12px",padding:"18px",marginBottom:"20px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px"}}>
        <span style={{fontSize:"16px"}}>➕</span>
        <span style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",textTransform:"uppercase",letterSpacing:"0.09em"}}>Create New User Account</span>
      </div>
      {/* Role selector first so form adapts */}
      <Grid2>
        <Field label="Role *">
          <select style={sl} value={createRole} onChange={e=>setCreateRole(e.target.value)}>
            {["admin","issuer","qc","sales","store"].map(r=><option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
          </select>
        </Field>
        <Field label={createRole==="admin"?"Full Name (optional)":"Full Name / Username *"}>
          <input style={inp} value={createName} onChange={e=>setCreateName(e.target.value)}
            placeholder={createRole==="admin"?"e.g. Vijay Dagli":"e.g. Ramesh (used as login)"}/>
        </Field>
      </Grid2>
      {/* Email — required for admin, optional for others */}
      <div style={{background:createRole==="admin"?"#0a1010":"#0b1220",border:`1px solid ${createRole==="admin"?"#f59e0b30":"#1e293b"}`,borderRadius:"8px",padding:"12px 14px",marginBottom:"12px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:createRole==="admin"?"#f59e0b":"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>
          {createRole==="admin"?"🔑 Admin Email (required for password reset)":"📧 Email Address (optional — leave blank to auto-generate from name)"}
        </div>
        <input type="email" style={{...inp,borderColor:createRole==="admin"?"#f59e0b50":"#1e293b"}}
          value={createEmail} onChange={e=>setCreateEmail(e.target.value)}
          placeholder={createRole==="admin"?"admin@yourcompany.com (real email required)":"user@company.com (or leave blank)"}/>
        {createRole!=="admin"&&!createEmail&&createName&&<div style={{fontSize:"11px",color:"#475569",marginTop:"4px"}}>
          Login will be: <strong style={{color:"#64748b"}}>
            {createName.trim().toLowerCase().replace(/\s+/g,".").replace(/[^a-z0-9._]/g,"")}@gcc-hub.app
          </strong> — share this with the user
        </div>}
      </div>
      <Field label="Password *">
        <input type="password" style={inp} value={createPassword} onChange={e=>setCreatePassword(e.target.value)} placeholder="Min 6 characters"/>
      </Field>
      {createError&&<div style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"7px",padding:"9px 12px",color:"#fca5a5",fontSize:"12.5px",marginBottom:"10px"}}>❌ {createError}</div>}
      {createSuccess&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"9px 12px",color:"#86efac",fontSize:"12.5px",marginBottom:"10px"}}>{createSuccess}</div>}
      <div style={{display:"flex",justifyContent:"flex-end"}}>
        <Btn label={creating?"Creating…":"Create User Account"} onClick={createUser} disabled={creating} color="#3b82f6" small/>
      </div>
    </div>

    {/* USERS LIST */}
    <SectionHead title={`All Users (${allEmails.length})`}/>
    <InfoBox color="#f59e0b">All users with created accounts appear here. Use ✏️ to change a role, 🔑 to send a password reset email, ✕ to remove access.</InfoBox>

      ?<div style={{textAlign:"center",padding:"32px",color:"#334155",fontSize:"13px"}}>No users yet. Create one above.</div>

        const isHardAdmin=ADMIN_EMAILS.includes(email);
        const currentRoles=isHardAdmin?["admin"]:(roles[email]||[]);
        const currentRole=primaryRole(currentRoles)||"—";
        const rc=ROLE_COLORS[currentRole]||"#475569";
        const name=profiles[email]?.displayName||"";
        const isEditing=editingRole===email;

        return <div key={email} style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:"10px",padding:"13px 16px",marginBottom:"8px"}}>

            <div style={{flex:1}}>
              {name&&<div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9",marginBottom:"2px"}}>{name}</div>}
              <div style={{fontSize:name?"12px":"13.5px",fontWeight:name?"400":"600",color:name?"#64748b":"#e2e8f0",marginBottom:"4px"}}>{email}</div>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}}>
                {currentRoles.length>0
                  ?currentRoles.map(r=><Bdg key={r} label={ROLE_LABELS[r]||r} color={ROLE_COLORS[r]||"#475569"} small/>)
                  :<span style={{fontSize:"11px",color:"#ef4444",fontStyle:"italic"}}>No role assigned</span>}
                {isHardAdmin&&<span style={{fontSize:"10px",color:"#475569",fontStyle:"italic"}}>· hardcoded admin</span>}
              </div>
            </div>
            {!isHardAdmin&&<div style={{display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap",flexShrink:0}}>
              <button onClick={()=>{setEditingRole(isEditing?null:email);setEditRoleVals([...currentRoles]);}}
                style={{background:"#1e293b",border:"1px solid #334155",borderRadius:"6px",padding:"5px 10px",color:"#94a3b8",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>✏️ Roles</button>
              <button onClick={()=>setEditPassEmail(editPassEmail===email?null:email)}

              <button onClick={()=>removeAccess(email)}
                style={{background:"none",border:"1px solid #7f1d1d",borderRadius:"6px",padding:"5px 10px",color:"#ef4444",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>✕ Remove</button>

          {/* Multi-role checkbox edit */}
          {isEditing&&!isHardAdmin&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b"}}>

            <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"10px"}}>
              {["admin","issuer","qc","sales","store"].map(r=>{

                return <button key={r} onClick={toggle} style={{
                  background:checked?`${ROLE_COLORS[r]}25`:"none",
                  border:`2px solid ${checked?ROLE_COLORS[r]:"#334155"}`,
                  borderRadius:"8px",padding:"7px 14px",
                  color:checked?ROLE_COLORS[r]:"#475569",
                  fontSize:"12.5px",fontWeight:"700",cursor:"pointer",
                  display:"flex",alignItems:"center",gap:"6px"

                  <span style={{fontSize:"14px"}}>{checked?"☑":"☐"}</span>
                  {ROLE_LABELS[r]}

              })}
            </div>
            {editRoleVals.length>1&&<div style={{fontSize:"11px",color:"#64748b",marginBottom:"8px",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"6px",padding:"5px 10px"}}>
              Primary role (highest privilege): <strong style={{color:ROLE_COLORS[primaryRole(editRoleVals)]}}>{ROLE_LABELS[primaryRole(editRoleVals)]}</strong>
            </div>}
            <div style={{display:"flex",gap:"8px"}}>
              <Btn label={saving===email?"Saving…":"✓ Save Roles"} onClick={()=>saveRoleEdit(email)} disabled={saving===email} color="#22c55e" small/>
              <Btn label="Cancel" onClick={()=>setEditingRole(null)} outline color="#475569" small/>
            </div>
          </div>}

          {/* Password change */}
          {editPassEmail===email&&!isHardAdmin&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b",background:"#0a1628",borderRadius:"8px",padding:"12px"}}>
            <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"8px"}}>🔑 Set New Password — {name||email}</div>
            <div style={{fontSize:"12px",color:"#64748b",marginBottom:"8px"}}>
              Set a new password for this user. It will apply the next time they log in.
              {!email.endsWith("@gcc-hub.app")&&<span style={{color:"#f59e0b"}}> (Real email account)</span>}
            </div>
            <Field label="New Password (min 6 chars)">
              <input type="password" style={inp} value={newPassVal} onChange={e=>{setNewPassVal(e.target.value);setPassError("");}} placeholder="Enter new password"/>
            </Field>
            {passError&&<div style={{fontSize:"12px",color:"#ef4444",marginBottom:"6px"}}>{passError}</div>}
            <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
              <Btn label="Cancel" onClick={()=>{setEditPassEmail(null);setNewPassVal("");setPassError("");}} outline color="#475569" small/>
              <Btn label={savingPass?"Saving…":"✓ Set Password"} onClick={()=>adminChangePass(email)} disabled={savingPass} color="#f59e0b" small/>
            </div>
          </div>}
        </div>;
      })
    }

    {localToast&&<div style={{position:"fixed",bottom:"24px",left:"50%",transform:"translateX(-50%)",background:localToast.type==="error"?"#450a0a":"#052e16",border:`1px solid ${localToast.type==="error"?"#7f1d1d":"#166534"}`,borderRadius:"10px",padding:"10px 20px",color:"#f1f5f9",fontSize:"13px",fontWeight:"600",zIndex:4000,boxShadow:"0 8px 30px rgba(0,0,0,0.6)",animation:"fadeIn 0.2s ease",whiteSpace:"nowrap"}}>{localToast.msg}</div>}
  </div>;
}

// Searchable product selector component
const normalize = (s) => (s||"").toLowerCase().replace(/[\s\-_.()\/\\,&+*#@!?'"%]/g,"");

function ProductSearch({prods, value, onChange, disabled}){
  const [query,setQuery]=useState(value||"");
  const [open,setOpen]=useState(false);
  const ref=useRef(null);

  useEffect(()=>{ setQuery(value||""); },[value]);

  useEffect(()=>{
    const handler=(e)=>{ if(ref.current&&!ref.current.contains(e.target))setOpen(false); };
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[]);

  // Smart filter: ignores spaces, special chars, case
  const filtered=prods.filter(p=>{
    if(!query)return true;
    const nq=normalize(query);
    const nn=normalize(gpn(p));
    // Match if normalized name contains normalized query (contiguous or split)
    return nn.includes(nq)||
      // Also match initials: "IE" matches "Interior Emulsion"
      gpn(p).split(/\s+/).map(w=>w[0]||"").join("").toLowerCase().startsWith(nq);
  });

  const select=(p)=>{ setQuery(gpn(p)); setOpen(false); onChange(p); };
  const highlight=(text)=>{
    if(!query)return text;
    try{
      const re=new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`, "gi");
      const parts=text.split(re);
      return parts.map((part,i)=>re.test(part)?<mark key={i} style={{background:"#f59e0b30",color:"#f59e0b",borderRadius:"2px"}}>{part}</mark>:part);
    }catch{return text;}
  };

  return <div ref={ref} style={{position:"relative"}}>
    <div style={{position:"relative"}}>
      <input style={{...inp,paddingRight:"30px",cursor:disabled?"not-allowed":"text",opacity:disabled?0.5:1}}
        value={query} disabled={disabled}
        onChange={e=>{setQuery(e.target.value);setOpen(true);onChange(null);}}
        onFocus={()=>!disabled&&setOpen(true)}
        placeholder={disabled?"← select category first":"Type to search products…"}/>
      <span onClick={()=>!disabled&&setOpen(o=>!o)}
        style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",cursor:"pointer",color:"#475569",fontSize:"12px",pointerEvents:disabled?"none":"auto"}}>
        {open?"▲":"▼"}
      </span>
    </div>
    {open&&!disabled&&<div style={{position:"absolute",zIndex:500,top:"100%",left:0,right:0,background:"#0f172a",border:"1px solid #3b82f6",borderTop:"none",borderRadius:"0 0 8px 8px",maxHeight:"220px",overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}}>
      {query&&<div style={{padding:"6px 14px",fontSize:"11px",color:"#334155",borderBottom:"1px solid #1e293b",background:"#060d1a"}}>
        {filtered.length} result{filtered.length!==1?"s":""} — spaces & symbols ignored in search
      </div>}
      {filtered.length===0
        ?<div style={{padding:"12px 14px",fontSize:"12.5px",color:"#475569",fontStyle:"italic"}}>No products match — try fewer characters</div>
        :filtered.map(p=>{
          const n=gpn(p); const u=gpu(p);
          const isSelected=n===value;
          return <div key={n} onClick={()=>select(p)}
            style={{padding:"9px 14px",cursor:"pointer",fontSize:"13px",
              color:isSelected?"#22c55e":"#e2e8f0",
              background:isSelected?"#052e16":"transparent",
              borderTop:"1px solid #1e293b",
              display:"flex",justifyContent:"space-between",alignItems:"center"}}
            onMouseEnter={e=>e.currentTarget.style.background=isSelected?"#052e16":"#1e293b"}
            onMouseLeave={e=>e.currentTarget.style.background=isSelected?"#052e16":"transparent"}>
            <span>{highlight(n)}</span>
            <span style={{fontSize:"11px",color:isSelected?"#22c55e":"#475569",background:"#0b1220",padding:"1px 7px",borderRadius:"99px",border:"1px solid #1e293b",flexShrink:0,marginLeft:"8px"}}>{u}</span>
          </div>;
        })}
    </div>}
  </div>;
}

function CategoryProductSelect({category,setCategory,productName,setProductName,products,onUnitChange,catUnits}){
  const cats = Object.keys(products||DEFAULT_PRODUCTS).sort((a,b)=>a.localeCompare(b));
  const prods = [...((products||DEFAULT_PRODUCTS)[category] || [])].sort((a,b)=>gpn(a).localeCompare(gpn(b)));
  const units = catUnits||CATEGORY_UNITS;
  return <Grid2>
    <Field label="Category *">
      <select style={sl} value={category} onChange={e=>{
        setCategory(e.target.value);
        if(onUnitChange)onUnitChange(units[e.target.value]||CATEGORY_UNITS[e.target.value]||"kg");
      }}>
        <option value="">— Select Category —</option>
        {cats.map(c=><option key={c} value={c}>{c}</option>)}
      </select>
    </Field>
    <Field label="Product *">
      <ProductSearch prods={prods} value={productName} disabled={!category} onChange={p=>{
        if(p){
          setProductName(gpn(p));
          if(onUnitChange)onUnitChange(gpu(p));
        }else{
          setProductName("");
        }
      }}/>
    </Field>
  </Grid2>;
}

// OLD STOCK SECTION
// ══════════════════════════════════════════════════════════
function OldStockSection({role,user,showToast,products,catUnits}){
  const [stocks,setStocks]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [search,setSearch]=useState("");
  const [form,setForm]=useState({category:"",productName:"",qty:"",unit:"kg",batchRef:"",dateAdded:today(),addedBy:"",notes:""});

  useEffect(()=>{
    const unsub=C("old_stock").orderBy("_createdAt","desc").onSnapshot(s=>setStocks(s.docs.map(d=>({id:d.id,...d.data()}))),
      ()=>C("old_stock").onSnapshot(s=>setStocks(s.docs.map(d=>({id:d.id,...d.data()})))));
    return unsub;
  },[]);

  const saveStock=async()=>{
    if(!form.category||!form.productName||!form.qty)return showToast("Category, product and qty required","error");
    if(saving)return;setSaving(true);
    try{
      await C("old_stock").add({...form,addedBy:form.addedBy||user.email,status:"Available",_createdAt:ts()});
      setForm({category:"",productName:"",qty:"",unit:"kg",batchRef:"",dateAdded:today(),addedBy:"",notes:""});
      setShowForm(false);showToast("Old stock entry added ✓");
    }catch(e){showToast("Error saving","error");}
    setSaving(false);
  };

  const toggleStatus=async(id,current)=>{
    await C("old_stock").doc(id).update({status:current==="Available"?"Used":"Available"});
    showToast("Status updated ✓");
  };

  const deleteStock=async(id)=>{
    if(!confirm("Delete this entry?"))return;
    await C("old_stock").doc(id).delete();showToast("Deleted","error");
  };

  const filtered=stocks.filter(s=>{
    const q=search.toLowerCase();
    return !q||s.productName?.toLowerCase().includes(q)||s.category?.toLowerCase().includes(q)||s.batchRef?.toLowerCase().includes(q);
  });

  const available=filtered.filter(s=>s.status==="Available");
  const used=filtered.filter(s=>s.status!=="Available");
  const canEdit=role==="admin"||role==="issuer"||role==="qc";

  return <div style={{marginTop:"24px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"10px"}}>
      <div style={{display:"flex",gap:"8px",alignItems:"center",flex:1}}>
        <span style={{fontSize:"12px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.1em"}}>📦 Old / Rejected Material Register</span>
        <span style={{fontSize:"11px",background:"#f59e0b18",border:"1px solid #f59e0b30",borderRadius:"99px",padding:"2px 10px",color:"#f59e0b",fontWeight:"700"}}>{available.length} Available</span>
      </div>
      <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
        <input placeholder="Search stock…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:"180px",padding:"7px 10px",fontSize:"12px"}}/>
        {canEdit&&<Btn label="+ Add Old/Rejected Material" onClick={()=>setShowForm(v=>!v)} color="#f59e0b" small/>}
      </div>
    </div>

    {showForm&&<div style={{background:"#0a1010",border:"1px solid #f59e0b40",borderRadius:"10px",padding:"16px",marginBottom:"14px"}}>
      <div style={{fontSize:"12px",fontWeight:"700",color:"#f59e0b",marginBottom:"12px"}}>📦 Add Old/Rejected Material Entry</div>
      <CategoryProductSelect category={form.category} setCategory={cat=>{
        const unit=(catUnits?.[cat])||CATEGORY_UNITS[cat]||"kg";
        setForm({...form,category:cat,productName:"",unit});
      }} productName={form.productName} setProductName={pn=>setForm({...form,productName:pn})} products={products} catUnits={catUnits}/>
      <Grid2>
        <Field label="Quantity *"><input style={inp} value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} placeholder="e.g. 500"/></Field>
        <Field label="Unit">
          <div style={{...inp,background:"#060b16",cursor:"default",display:"flex",alignItems:"center",gap:"8px",color:form.unit?"#22c55e":"#475569",fontWeight:"600"}}>
            {form.unit||(form.category?(sysCatUnits?.[form.category]||CATEGORY_UNITS[form.category]||"kg"):"— select category first —")}
            {form.unit&&<span style={{fontSize:"10px",color:"#475569",fontWeight:"400"}}>(auto)</span>}
          </div>
        </Field>
        <Field label="Date Added"><input type="date" style={inp} value={form.dateAdded} onChange={e=>setForm({...form,dateAdded:e.target.value})}/></Field>
      </Grid2>
      <Grid2>
        <Field label="Original Batch Ref (if any)"><input style={inp} value={form.batchRef} onChange={e=>setForm({...form,batchRef:e.target.value})} placeholder="e.g. GCC-2501-005"/></Field>
        <Field label="Added By"><input style={inp} value={form.addedBy} onChange={e=>setForm({...form,addedBy:e.target.value})} placeholder={user.email}/></Field>
      </Grid2>
      <Field label="Notes"><textarea style={{...ta,minHeight:"50px"}} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Condition, reason for old stock..."/></Field>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowForm(false)} outline color="#475569" small/>
        <Btn label={saving?"Saving…":"Save Entry"} onClick={saveStock} disabled={saving} color="#f59e0b" small/>
      </div>
    </div>}

    {available.length===0&&used.length===0&&!showForm&&<div style={{textAlign:"center",padding:"24px",border:"1px dashed #1e293b",borderRadius:"8px",color:"#334155",fontSize:"13px"}}>No entries yet.{canEdit?" Click + Add Old/Rejected Material to log material.":""}</div>}

    {available.length>0&&<>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"8px"}}>Available ({available.length})</div>
      {available.map(s=><OldStockCard key={s.id} s={s} canEdit={canEdit} onToggle={toggleStatus} onDelete={deleteStock}/>)}
    </>}
    {used.length>0&&<>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"8px",marginTop:"12px"}}>Used / Consumed ({used.length})</div>
      {used.map(s=><OldStockCard key={s.id} s={s} canEdit={canEdit} onToggle={toggleStatus} onDelete={deleteStock}/>)}
    </>}
  </div>;
}

function OldStockCard({s,canEdit,onToggle,onDelete}){
  const isAvail=s.status==="Available";

    </div>
  </div>;
}
