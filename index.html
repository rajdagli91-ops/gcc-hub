function IngredientTable({rows,onChange}){
  const update=(i,f,v)=>onChange(rows.map((r,idx)=>idx===i?{...r,[f]:v}:r));
  return <div>
    <div style={{display:"grid",gridTemplateColumns:"2fr 80px 75px 2fr 24px",gap:"6px",marginBottom:"4px"}}>
      {["Material / Ingredient","Qty","Unit","Notes",""].map((h,i)=><div key={i} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",padding:"0 2px"}}>{h}</div>)}
    </div>
    {rows.map((r,i)=><div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 80px 75px 2fr 24px",gap:"6px",marginBottom:"6px"}}>
      <input style={sml} value={r.material} onChange={e=>update(i,"material",e.target.value)} placeholder="e.g. TiO2 R-902"/>
      <input style={sml} value={r.quantity} onChange={e=>update(i,"quantity",e.target.value)} placeholder="100"/>
      <select style={{...sml,padding:"6px 6px"}} value={r.unit} onChange={e=>update(i,"unit",e.target.value)}>{["kg","gms","mL","L"].map(u=><option key={u}>{u}</option>)}</select>
      <input style={sml} value={r.notes} onChange={e=>update(i,"notes",e.target.value)} placeholder="Optional"/>
      <button onClick={()=>onChange(rows.filter((_,idx)=>idx!==i))} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"15px",padding:0,alignSelf:"center"}}>×</button>
    </div>)}
    <button onClick={()=>onChange([...rows,{id:newId(),material:"",quantity:"",unit:"gms",notes:""}])} style={{marginTop:"6px",background:"none",border:"1px dashed #1e293b",borderRadius:"7px",padding:"7px 14px",color:"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600",width:"100%"}}>+ Add Ingredient Row</button>
  </div>;
}

function TestReportCard({report,num,onDelete,onUpdate,isAdmin,trial}){
  const rc=REC_COLORS[report.recommendation]||"#94a3b8";
  const [editing,setEditing]=useState(false);
  const [form,setForm]=useState({...report});
  const [saving,setSaving]=useState(false);

  const saveEdit=async()=>{
    setSaving(true);
    const updatedReports=(trial.testReports||[]).map(r=>r.id===report.id?{...form}:r);
    await onUpdate({...trial,testReports:updatedReports});
    setEditing(false);setSaving(false);
  };

  const rc2=REC_COLORS[form.recommendation]||"#94a3b8";
  const params=Object.keys(form.paramResults||{}).filter(k=>!k.endsWith("__pf"));

  return <div style={{background:"#0b1220",border:`1px solid ${editing?"#fcd34d60":"#1e293b"}`,borderLeft:`3px solid ${editing?rc2:rc}`,borderRadius:"8px",padding:"12px 14px",marginBottom:"8px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
        <span style={{fontSize:"11px",fontWeight:"700",color:"#475569",background:"#1e293b",padding:"2px 8px",borderRadius:"6px"}}>Report #{num}</span>
        {editing
          ?<><input type="date" style={{...inp,width:"130px",padding:"3px 6px",fontSize:"11.5px"}} value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/>
            <input style={{...inp,width:"130px",padding:"3px 6px",fontSize:"11.5px"}} value={form.testedBy} onChange={e=>setForm({...form,testedBy:e.target.value})} placeholder="Tested by…"/>
          </>
          :<><span style={{fontSize:"11px",color:"#475569"}}>📅 {report.date}</span>
            {report.testedBy&&<span style={{fontSize:"11px",color:"#475569"}}>🔬 {report.testedBy}</span>}
          </>}
      </div>
      <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
        {!editing&&<><span style={{fontSize:"10px",color:"#475569",fontWeight:"600"}}>Result:</span><Bdg label={report.recommendation} color={rc} small/></>}
        {isAdmin&&!editing&&<button onClick={()=>{setForm({...report});setEditing(true);}} style={{background:"#0f1d35",border:"1px solid #1e3a5f",borderRadius:"5px",color:"#fcd34d",fontSize:"11px",fontWeight:"700",padding:"2px 8px",cursor:"pointer"}}>✏️ Edit</button>}
        {!editing&&<button onClick={()=>onDelete(report.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"13px"}}>🗑</button>}
        {editing&&<><button onClick={saveEdit} disabled={saving} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"5px",color:"#4ade80",fontSize:"11px",fontWeight:"700",padding:"3px 10px",cursor:"pointer"}}>{saving?"…":"✓ Save"}</button>
          <button onClick={()=>setEditing(false)} style={{background:"none",border:"1px solid #334155",borderRadius:"5px",color:"#475569",fontSize:"11px",padding:"3px 8px",cursor:"pointer"}}>✕</button>
        </>}
      </div>
    </div>

    {/* Recommendation selector in edit mode */}
    {editing&&<div style={{marginBottom:"10px"}}>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"4px"}}>Overall Recommendation</div>
      <select style={{...sl,borderColor:rc2+"60"}} value={form.recommendation} onChange={e=>setForm({...form,recommendation:e.target.value})}>
        {Object.keys(REC_COLORS).map(r=><option key={r}>{r}</option>)}
      </select>
    </div>}

    {report.recommendation==="Sample Submitted to Customer"&&(report.customerName||report.salesman)&&<div style={{background:"#0c1a2e",border:"1px solid #06b6d440",borderRadius:"7px",padding:"8px 12px",marginBottom:"8px",display:"flex",gap:"16px",flexWrap:"wrap"}}>
      <span style={{fontSize:"12px",color:"#22d3ee"}}>📤 <strong>Customer:</strong> {report.customerName||"—"}</span>
      <span style={{fontSize:"12px",color:"#22d3ee"}}>👤 <strong>Submitted By:</strong> {report.salesman||"—"}</span>
    </div>}

    {/* QC parameter results — editable in edit mode */}
    {params.length>0&&<div style={{marginBottom:"8px"}}>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"4px"}}>QC Results</div>
      <div style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"7px",overflow:"hidden"}}>
        {editing
          ?<>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 110px",background:"#0b1220",padding:"5px 10px",fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",gap:"8px"}}>
              <span>Parameter</span><span>Result</span><span style={{textAlign:"center"}}>Pass/Fail</span>
            </div>
            {params.map((param,i)=><div key={param} style={{display:"grid",gridTemplateColumns:"1fr 1fr 110px",gap:"8px",padding:"5px 10px",borderTop:"1px solid #0f172a",alignItems:"center"}}>
              <div style={{fontSize:"12px",color:"#94a3b8"}}>{param}</div>
              <input style={{...inp,padding:"3px 6px",fontSize:"11.5px"}} value={(form.paramResults||{})[param]||""} onChange={e=>setForm(f=>({...f,paramResults:{...(f.paramResults||{}),[param]:e.target.value}}))}/>
              <select style={{...sl,padding:"3px 5px",fontSize:"11.5px"}} value={(form.paramResults||{})[param+"__pf"]||""} onChange={e=>setForm(f=>({...f,paramResults:{...(f.paramResults||{}),[param+"__pf"]:e.target.value}}))}>
                <option value="">—</option>
                <option value="Pass">✓ Pass</option>
                <option value="Fail">✗ Fail</option>
                <option value="Marginal">~ Marginal</option>
              </select>
            </div>)}
          </>
          :<>{params.map((param,i)=>{
            const val=(report.paramResults||{})[param];
            const pf=(report.paramResults||{})[param+"__pf"]||"";
            return <div key={param} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 10px",borderTop:i===0?"none":"1px solid #0f172a",background:i%2===0?"transparent":"#060d1a"}}>
              <span style={{fontSize:"12px",color:"#94a3b8"}}>{param}</span>
              <div style={{display:"flex",gap:"10px",alignItems:"center"}}>
                <span style={{fontSize:"12.5px",fontWeight:"600",color:"#e2e8f0"}}>{val||"—"}</span>
                {pf&&<span style={{fontSize:"11px",fontWeight:"700",color:pf==="Pass"?"#4ade80":pf==="Fail"?"#f87171":"#fcd34d",background:pf==="Pass"?"#052e16":pf==="Fail"?"#2e0a0a":"#1a0f00",border:`1px solid ${pf==="Pass"?"#166534":pf==="Fail"?"#7f1d1d":"#92400e"}`,borderRadius:"4px",padding:"1px 7px"}}>{pf}</span>}
              </div>
            </div>;
          })}</>}
      </div>
    </div>}

    {/* Legacy free-text results */}
    {(report.results||report.testsPerformed)&&!editing&&<div style={{marginBottom:"6px"}}>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"3px"}}>Results</div>
      <div style={{fontSize:"12.5px",color:"#94a3b8",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{report.results||report.testsPerformed}</div>
    </div>}

    {/* Remarks / notes */}
    {editing
      ?<div><div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"4px"}}>Additional Notes</div>
        <textarea style={{...ta,minHeight:"50px"}} value={form.remarks||""} onChange={e=>setForm({...form,remarks:e.target.value})} placeholder="Any extra observations…"/></div>
      :report.remarks&&<div style={{marginBottom:"6px"}}>
        <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"3px"}}>Notes</div>
        <div style={{fontSize:"12.5px",color:"#94a3b8",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{report.remarks}</div>
      </div>}
  </div>;
}

// ── Comparison sheet modal — select trials + QC params, then print ──
function CompareTrialsModal({trials,project,onCopyTrial}){
  const [open,setOpen]=useState(false);
  const [selected,setSelected]=useState(trials.map(t=>t.id));
  const toggleTrial=(id)=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const selectedTrials=trials.filter(t=>selected.includes(t.id));
  // Collect QC parameters from selected trials (union, preserving order)
  const qcParams=(()=>{const seen=new Set(),out=[];selectedTrials.forEach(t=>(t.qcParameters||[]).forEach(p=>{if(!seen.has(p)){seen.add(p);out.push(p);}}));return out.length?out:["Viscosity","Fineness","Specific Gravity","pH","Non-Volatile %","Drying Time (min)","Gloss (60°)","Adhesion","Flexibility","Appearance"];})();
  if(!open) return <button onClick={()=>setOpen(true)} style={{background:"#0a1a2e",border:"1px solid #2563eb",borderRadius:"7px",padding:"6px 14px",color:"#93c5fd",fontWeight:"700",fontSize:"12px",cursor:"pointer",marginBottom:"12px"}}>📊 Print Comparison Sheet ({trials.length} trials)</button>;
  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"14px",padding:"22px",width:"min(520px,96vw)",maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{fontSize:"15px",fontWeight:"700",color:"#93c5fd",marginBottom:"14px"}}>📊 Print Trial Comparison Sheet</div>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"8px"}}>Select Trials to Compare</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px",marginBottom:"14px"}}>
        {trials.map((t,i)=><label key={t.id} style={{display:"flex",alignItems:"center",gap:"8px",background:selected.includes(t.id)?"#0f1d35":"#080d18",border:`1px solid ${selected.includes(t.id)?"#3b82f6":"#1e293b"}`,borderRadius:"7px",padding:"8px 12px",cursor:"pointer"}}>
          <input type="checkbox" checked={selected.includes(t.id)} onChange={()=>toggleTrial(t.id)} style={{accentColor:"#3b82f6"}}/>
          <div>
            <div style={{fontSize:"12.5px",fontWeight:"700",color:selected.includes(t.id)?"#93c5fd":"#e2e8f0"}}>S{i+1} — {t.trialName||`Trial ${i+1}`}</div>
            <div style={{fontSize:"10px",color:"#475569"}}>{(t.ingredients||[]).filter(r=>r.material?.trim()).length} ingredients · {(t.qcParameters||[]).length} QC params</div>
          </div>
        </label>)}
      </div>
      {/* Show QC params that will be printed — read-only summary */}
      <div style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 12px",marginBottom:"14px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"6px"}}>QC Parameters in print ({qcParams.length}) — set on each trial</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:"4px"}}>
          {qcParams.map((p,i)=><span key={i} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"5px",padding:"2px 8px",fontSize:"11px",color:"#94a3b8"}}>{p}</span>)}
        </div>
        <div style={{fontSize:"10px",color:"#334155",marginTop:"6px"}}>To change these, edit the individual trial and update its QC Parameters list</div>
      </div>
      {selectedTrials.length<2&&<div style={{fontSize:"11.5px",color:"#f59e0b",marginBottom:"10px"}}>⚠ Select at least 2 trials to compare</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setOpen(false)} outline color="#475569" small/>
        <Btn label={`🖨 Print (${selectedTrials.length} samples)`} onClick={()=>{printTrialComparison(selectedTrials,project,qcParams);setOpen(false);}} disabled={selectedTrials.length<2} color="#3b82f6" small/>
      </div>
    </div>
  </div>;
}

function TrialCard({trial,index,onDelete,onUpdate,onCopy,isAdmin,sysUnits,onAddUnit,project,allProfiles={},showToast}){
  const ING_UNITS_EFF=sysUnits&&sysUnits.length?sysUnits:[...ING_UNITS,...BATCH_UNITS.filter(u=>!ING_UNITS.includes(u))];
  const [open,setOpen]=useState(false);
  const [editing,setEditing]=useState(false);
  const [showRF,setShowRF]=useState(false);
  const [showOU,setShowOU]=useState(false);
  const [newOutcome,setNewOutcome]=useState(trial.outcome);
  const [saving,setSaving]=useState(false);
  const blankR={date:today(),testedBy:"",paramResults:{},recommendation:"Pass",remarks:"",customerName:"",salesman:""};
  const [rForm,setRForm]=useState(blankR);

  // Edit form state — pre-filled from trial
  const blankIng=()=>({id:newId(),material:"",quantity:"",unit:"gms",notes:""});
  const [editForm,setEditForm]=useState({
    trialName:trial.trialName||"",date:trial.date||today(),triedBy:trial.triedBy||"",
    outcome:trial.outcome||"Under Evaluation",
    ingredients:trial.ingredients?.length?trial.ingredients:[blankIng()],
    process:trial.process||"",propertiesTested:trial.propertiesTested||"",
    observations:trial.observations||"",nextSteps:trial.nextSteps||"",
    processSteps:trial.processSteps?.length?trial.processSteps:[{id:newId(),text:""}],
    assignedTo:trial.assignedTo||"",
    qcParameters:trial.qcParameters?.length?trial.qcParameters:["Viscosity","Fineness","Specific Gravity","pH","Non-Volatile %","Drying Time (min)","Gloss (60°)","Adhesion","Flexibility","Appearance"]
  });

  const reports=trial.testReports||[];
  const displayOutcome=editing?editForm.outcome:(trial.outcome||"Under Evaluation");
  const oc=OUTCOME_COLORS[displayOutcome]||"#94a3b8";
  const isEval=trial.outcome==="Under Evaluation";

  const saveEdit=async()=>{
    setSaving(true);
    await onUpdate({...trial,...editForm,ingredients:editForm.ingredients.filter(r=>r.material.trim())});
    setEditing(false);setSaving(false);
  };

  const updIng=(idx,field,val)=>setEditForm(f=>({...f,ingredients:f.ingredients.map((r,i)=>i===idx?{...r,[field]:val}:r)}));
  const addIng=()=>setEditForm(f=>({...f,ingredients:[...f.ingredients,blankIng()]}));
  const remIng=(idx)=>setEditForm(f=>({...f,ingredients:f.ingredients.filter((_,i)=>i!==idx)}));

  const addReport=async()=>{
    const hasAnyResult=Object.values(rForm.paramResults||{}).some(r=>r&&r.trim())||rForm.remarks.trim();
    if(!hasAnyResult)return showToast("Enter at least one result or remark","error");
    setSaving(true);
    const nr={...rForm,id:newId()};
    await onUpdate({...trial,testReports:[...reports,nr]});
    setRForm(blankR);setShowRF(false);
    showToast("Test report saved ✓ — update trial outcome when ready");
    setSaving(false);
  };

  const applyOutcome=async()=>{
    setSaving(true);
    await onUpdate({...trial,outcome:newOutcome});
    setShowOU(false);setSaving(false);
  };

  return <div style={{border:`1px solid ${editing?"#3b82f680":isEval?"#7c3aed40":"#1e293b"}`,borderRadius:"12px",overflow:"hidden",marginBottom:"10px"}}>
    <div onClick={()=>!editing&&setOpen(o=>!o)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 18px",cursor:editing?"default":"pointer",background:open||editing?"#0b1626":"#0b1220",transition:"background 0.15s"}}>
      <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
        <div style={{background:"#1e293b",borderRadius:"8px",padding:"5px 10px",fontSize:"11px",fontWeight:"700",color:"#64748b",flexShrink:0}}>Trial {index+1}</div>
        <div>
          <div style={{fontSize:"13.5px",fontWeight:"600",color:"#e2e8f0"}}>{trial.trialName||`Trial ${index+1}`}</div>
          <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>{trial.date}{trial.triedBy?` · ${trial.triedBy}`:""} · {trial.ingredients?.length||0} ingredients{reports.length>0?` · 📋 ${reports.length} report${reports.length!==1?"s":""}`:""}</div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
        {trial.assignedTo&&!editing&&<span style={{fontSize:"10px",fontWeight:"700",color:"#fbbf24",background:"#fbbf2418",border:"1px solid #fbbf2430",padding:"2px 8px",borderRadius:"99px",whiteSpace:"nowrap"}}>👤 {allProfiles[trial.assignedTo]?.displayName||trial.assignedTo.split("@")[0]}</span>}
        {isEval&&!editing&&<span style={{fontSize:"10px",fontWeight:"700",color:"#a855f7",background:"#a855f718",border:"1px solid #a855f730",padding:"2px 8px",borderRadius:"99px",whiteSpace:"nowrap"}}>⏳ Evaluating</span>}
        {isAdmin&&!editing
          ?<select value={displayOutcome} onClick={e=>e.stopPropagation()}
              onChange={async e=>{e.stopPropagation();await onUpdate({...trial,outcome:e.target.value});}}
              style={{background:(OUTCOME_COLORS[displayOutcome]||"#94a3b8")+"22",border:`1px solid ${OUTCOME_COLORS[displayOutcome]||"#94a3b8"}50`,borderRadius:"99px",color:OUTCOME_COLORS[displayOutcome]||"#94a3b8",fontSize:"10px",fontWeight:"700",padding:"2px 10px",cursor:"pointer",outline:"none",appearance:"auto"}}>

        {!editing&&<span style={{color:"#334155",fontSize:"12px"}}>{open?"▲":"▼"}</span>}

          </div>)}
        </div>
      </div>}
      {[["Process / Mixing Method",trial.process],["Properties Tested",trial.propertiesTested],["Test to be Performed",trial.observations],["Next Steps",trial.nextSteps]].map(([label,val])=>val&&<div key={label} style={{marginBottom:"12px"}}>
        <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"5px"}}>{label}</div>
        <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"10px 13px",fontSize:"13px",color:"#94a3b8",lineHeight:1.65,whiteSpace:"pre-wrap"}}>{val}</div>
      </div>)}
      {/* Test Reports section */}
      <div style={{marginTop:"16px",borderTop:"1px solid #1e293b",paddingTop:"16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
          <span style={{fontSize:"11px",fontWeight:"700",color:isEval?"#a855f7":"#475569",textTransform:"uppercase",letterSpacing:"0.09em"}}>📋 Test Reports ({reports.length})</span>
          <button onClick={()=>{setShowRF(v=>!v);setShowOU(false);}} style={{background:isEval?"#3b0764":"#1e293b",border:`1px solid ${isEval?"#7c3aed":"#334155"}`,borderRadius:"7px",padding:"5px 12px",color:isEval?"#c4b5fd":"#64748b",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>
            {showRF?"▲ Cancel":"+ Add Test Report"}</button>
        </div>
        {reports.map((r,i)=><TestReportCard key={r.id} report={r} num={i+1} isAdmin={isAdmin} trial={trial} onUpdate={onUpdate} onDelete={async(id)=>await onUpdate({...trial,testReports:reports.filter(r=>r.id!==id)})}/>)}
        {reports.length===0&&!showRF&&<div style={{textAlign:"center",padding:"12px",border:"1px dashed #1e293b",borderRadius:"8px",marginBottom:"8px"}}>
          <div style={{fontSize:"12px",color:"#334155"}}>{isEval?"⏳ Add a test report to evaluate this trial.":"No test reports yet."}</div>
        </div>}
        {showRF&&<div style={{background:"#0a0f1e",border:"1px solid #7c3aed40",borderRadius:"10px",padding:"14px",marginBottom:"10px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#c4b5fd",marginBottom:"12px"}}>📋 New Test Report #{reports.length+1}</div>
          <Grid2>
            <Field label="Date"><input type="date" style={inp} value={rForm.date} onChange={e=>setRForm({...rForm,date:e.target.value})}/></Field>
            <Field label="Tested By"><input style={inp} value={rForm.testedBy} onChange={e=>setRForm({...rForm,testedBy:e.target.value})}/></Field>
          </Grid2>
          {(()=>{
            const params=trial.qcParameters||[];
            return <div style={{marginBottom:"12px"}}>
              <div style={{fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"8px"}}>
                QC Parameters — Enter Results
                {params.length===0&&<span style={{color:"#334155",fontWeight:"400",textTransform:"none",marginLeft:"8px"}}>(no parameters set — edit trial to add them)</span>}
              </div>
              {params.length>0&&<div style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden"}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 120px",background:"#0b1220",padding:"6px 12px",fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.07em",gap:"8px"}}>
                  <span>Parameter</span><span>Result / Value</span><span style={{textAlign:"center"}}>Pass / Fail</span>
                </div>
                {params.map((p,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr 120px",gap:"8px",padding:"6px 12px",borderTop:"1px solid #0f172a",alignItems:"center",background:i%2===0?"transparent":"#060d1a"}}>
                  <div style={{fontSize:"12.5px",color:"#e2e8f0"}}>{p}</div>
                  <input style={{...inp,padding:"4px 8px",fontSize:"12px"}} value={(rForm.paramResults||{})[p]||""} onChange={e=>setRForm(f=>({...f,paramResults:{...(f.paramResults||{}),[p]:e.target.value}}))} placeholder="Enter measured value…"/>
                  <select style={{...sl,padding:"4px 6px",fontSize:"12px"}} value={(rForm.paramResults||{})[p+"__pf"]||""} onChange={e=>setRForm(f=>({...f,paramResults:{...(f.paramResults||{}),[p+"__pf"]:e.target.value}}))}>
                    <option value="">—</option><option value="Pass">✓ Pass</option><option value="Fail">✗ Fail</option><option value="Marginal">~ Marginal</option>
                  </select>
                </div>)}
              </div>}
              <Field label="Additional notes (optional)"><textarea style={{...ta,minHeight:"50px",marginTop:"8px"}} value={rForm.remarks} onChange={e=>setRForm({...rForm,remarks:e.target.value})} placeholder="Any extra observations not covered by the parameters above…"/></Field>
            </div>;
          })()}
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
            <Btn label="Cancel" onClick={()=>setShowRF(false)} outline color="#475569" small/>
            <Btn label={saving?"Saving…":"Save Report"} onClick={addReport} disabled={saving} color="#7c3aed" small/>
          </div>
        </div>}
      </div>
    </div>}
  </div>;
}

function ProjectWorkspace({project,isAdmin,showToast,sysUnits,sysRmCats,onAddRmCat,onAddUnit,allProfiles={},allRoles={},user}){
  const [live,setLive]=useState(project);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [editNotes,setEditNotes]=useState(false);
  const [editObj,setEditObj]=useState(false);
  const [draft,setDraft]=useState({objective:project.objective||"",formulationBase:project.formulationBase||"",notes:project.notes||""});
  const [savingN,setSavingN]=useState(false);
  const blank={trialName:"",date:today(),triedBy:"",outcome:"Under Evaluation",ingredients:[{id:"1",material:"",quantity:"",unit:"gms",notes:""}],process:"",processSteps:[{id:newId(),text:""}],propertiesTested:"",observations:"",nextSteps:"",testReports:[],assignedTo:"",qcParameters:["Viscosity","Fineness","Specific Gravity","pH","Non-Volatile %","Drying Time (min)","Gloss (60°)","Adhesion","Flexibility","Appearance"]};
  const [form,setForm]=useState(blank);
  const accent=PAINT_ACCENT[live.paintType]||"#cbd5e1";
  const sc=STATUS_COLORS[live.status]||"#94a3b8";
  const trials=live.trials||[];
  // QC users for assignment dropdown
  const qcUsers=Object.keys(allRoles).filter(email=>(allRoles[email]||[]).includes("qc"));

  useEffect(()=>{
    const unsub=C("rd_projects").doc(project.id).onSnapshot(snap=>{
      if(snap.exists)setLive({id:snap.id,...snap.data()});
    });
    return unsub;
  },[project.id]);

  const saveNotes=async()=>{
    setSavingN(true);
    try{await C("rd_projects").doc(project.id).update({objective:draft.objective,formulationBase:draft.formulationBase,notes:draft.notes});setEditNotes(false);setEditObj(false);showToast("Updated ✓");}catch(e){showToast("Error","error");}
    setSavingN(false);
  };

  const copyTrial=async(trial)=>{
    const copy={...trial,id:newId(),trialName:(trial.trialName||"Trial")+" (Copy)",date:today(),testReports:[]};
    await C("rd_projects").doc(project.id).update({trials:[...trials,copy]});
    showToast(`Copied "${trial.trialName||"trial"}" — rename and edit the copy ✓`);
  };

  const saveTrial=async()=>{
    if(!form.observations.trim()&&!form.ingredients.some(r=>r.material.trim()))return showToast("Add ingredients or observations","error");
    if(saving)return;setSaving(true);
    try{
      const newTrial={...form,processSteps:form.processSteps.filter(s=>s.text.trim()),id:newId()};
      await C("rd_projects").doc(project.id).update({trials:[...trials,newTrial]});
      // Notify assigned QC user(s)
      if(form.assignedTo){
        const recipients=form.assignedTo==="__all_qc__"?qcUsers:[form.assignedTo];
        await Promise.all(recipients.filter(r=>r&&r!==user?.email).map(email=>
          C("notifications").add({
            assignedTo:email,
            title:"🧪 New trial to follow: "+(form.trialName||"Untitled Trial"),
            message:"Project: "+(live.name||live.productName||"")+" · Assigned by "+(allProfiles[user?.email]?.displayName||user?.email||"Admin")+". Open R&D & QC → this project to view formulation, steps & print sheet.",
            type:"trial_assigned",read:false,_createdAt:ts()
          })
        ));
        showToast("Trial saved & QC notified ✓");
      }else{
        showToast("Trial saved ✓");
      }
      setForm(blank);setShowForm(false);
    }catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const deleteTrial=async(id)=>{
    if(!isAdmin){showToast("Admin only","error");return;}
    if(!confirm("Delete trial?"))return;
    await C("rd_projects").doc(project.id).update({trials:trials.filter(t=>t.id!==id)});
  };

  const updateTrial=async(updated)=>{
    await C("rd_projects").doc(project.id).update({trials:trials.map(t=>t.id===updated.id?updated:t)});
  };

  const approved=trials.find(t=>t.outcome==="Approved as Final");

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px",gap:"8px"}}>
      <div>
        <div style={{fontSize:"22px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>{live.projectName}</div>
        <div style={{fontSize:"12px",color:"#64748b",marginTop:"3px"}}>#{live.projectCode} · Created {live.dateCreated}</div>
      </div>
      <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
        {!isAdmin&&<Bdg label="👁 View only" color="#475569" small/>}
        <Bdg label={live.status} color={sc}/>
      </div>
    </div>
    <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"16px"}}>
      {[["🎨",live.paintType,accent],["🏗",live.application||null,"#64748b"],["👤",live.assignedTo||null,"#64748b"],["🗓",live.targetDate||null,"#64748b"]].map(([icon,val,color])=>val&&<span key={icon} style={{fontSize:"12px",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"5px 12px",color}}>{icon} {val}</span>)}
    </div>
    {/* Objective */}
    <div style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:`3px solid ${accent}`,borderRadius:"8px",padding:"12px 14px",marginBottom:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}}>
        <span style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em"}}>Objective</span>
        {isAdmin&&!editObj&&<button onClick={()=>{setEditObj(true);setDraft(d=>({...d,objective:live.objective||""}))}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 10px",color:"#475569",fontSize:"11px",cursor:"pointer"}}>✏️ Edit</button>}
      </div>
      {editObj?<div><textarea style={{...ta,minHeight:"70px",marginBottom:"8px"}} value={draft.objective} onChange={e=>setDraft(d=>({...d,objective:e.target.value}))}/>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setEditObj(false)} outline color="#475569" small/>
          <Btn label={savingN?"Saving…":"Save"} onClick={saveNotes} disabled={savingN} color="#3b82f6" small/>
        </div>
      </div>:<div style={{fontSize:"13.5px",color:"#94a3b8",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{live.objective||<span style={{color:"#334155",fontStyle:"italic"}}>No objective set.{isAdmin?" Click Edit to add.":""}</span>}</div>}
    </div>
    {approved&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"10px",padding:"12px 16px",marginBottom:"16px",display:"flex",alignItems:"center",gap:"10px"}}>
      <span style={{fontSize:"18px"}}>✅</span>
      <div><div style={{fontSize:"12px",fontWeight:"700",color:"#22c55e"}}>Approved Final Formulation</div>
      <div style={{fontSize:"12px",color:"#16a34a"}}>{approved.trialName||"A trial"} approved.</div></div>
    </div>}
    <SectionHead title={`Formulation Trials (${trials.length})`} action={
      <button onClick={()=>setShowForm(v=>!v)} style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"8px",padding:"6px 14px",color:"#93c5fd",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
        {showForm?"▲ Cancel":"+ Log New Trial"}</button>}/>
    {showForm&&<div style={{border:"1px solid #2563eb",borderRadius:"12px",padding:"20px",background:"#060d1a",marginBottom:"14px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"14px"}}>⚗️ Trial #{trials.length+1}</div>
      <Grid3>
        <Field label="Trial Name"><input style={inp} value={form.trialName} onChange={e=>setForm({...form,trialName:e.target.value})} placeholder="e.g. Low-VOC batch v1"/></Field>
        <Field label="Date"><input type="date" style={inp} value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        <Field label="Tried By"><input style={inp} value={form.triedBy} onChange={e=>setForm({...form,triedBy:e.target.value})}/></Field>
      </Grid3>
      <Field label="Formulation — Ingredients"><IngredientTable rows={form.ingredients} onChange={rows=>setForm({...form,ingredients:rows})}/></Field>
      <Field label="Assign To (QC) — notifies on save">
        <select style={sl} value={form.assignedTo} onChange={e=>setForm({...form,assignedTo:e.target.value})}>
          <option value="">— Not assigned (no notification) —</option>
          {qcUsers.length>1&&<option value="__all_qc__">📢 All QC users</option>}
          {qcUsers.map(email=><option key={email} value={email}>{allProfiles[email]?.displayName||email}</option>)}
        </select>
      </Field>
      {/* Process Steps — numbered, sequential instructions for QC to follow */}
      <div style={{marginBottom:"12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em"}}>Process Steps (sequential instructions)</div>
          <button onClick={()=>setForm(f=>({...f,processSteps:[...f.processSteps,{id:newId(),text:""}]}))} style={{background:"none",border:"1px dashed #1e3a5f",borderRadius:"6px",padding:"4px 12px",color:"#93c5fd",cursor:"pointer",fontSize:"11.5px",fontWeight:"600"}}>+ Add Step</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
          {form.processSteps.map((s,i)=><div key={s.id} style={{display:"flex",gap:"8px",alignItems:"flex-start"}}>
            <div style={{width:"24px",height:"24px",borderRadius:"50%",background:"#1e293b",color:"#93c5fd",fontSize:"11px",fontWeight:"700",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:"6px"}}>{i+1}</div>
            <textarea style={{...ta,minHeight:"36px",flex:1}} value={s.text} onChange={e=>setForm(f=>({...f,processSteps:f.processSteps.map(x=>x.id===s.id?{...x,text:e.target.value}:x)}))} placeholder={`Step ${i+1} instruction…`}/>
            <button onClick={()=>setForm(f=>({...f,processSteps:f.processSteps.length>1?f.processSteps.filter(x=>x.id!==s.id):f.processSteps}))} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"15px",padding:"6px 2px"}}>×</button>
          </div>)}
        </div>
      </div>
      <Grid2>
        <Field label="Process / Mixing Method"><textarea style={{...ta,minHeight:"70px"}} value={form.process} onChange={e=>setForm({...form,process:e.target.value})} placeholder="Mixing sequence, temperature, RPM..."/></Field>
        <Field label="Test to be Performed (notes)"><textarea style={{...ta,minHeight:"70px"}} value={form.observations} onChange={e=>setForm({...form,observations:e.target.value})} placeholder="Any additional test instructions for QC..."/></Field>
      </Grid2>
      {/* QC Parameters — structured list, used in comparison print */}
      <div style={{marginBottom:"12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em"}}>QC Parameters to Test</div>
          <span style={{fontSize:"10px",color:"#334155"}}>These appear in the comparison print sheet</span>
        </div>
        <div style={{background:"#080d18",border:"1px solid #1e293b",borderRadius:"8px",padding:"8px",marginBottom:"6px",maxHeight:"150px",overflowY:"auto"}}>
          {(form.qcParameters||[]).map((p,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"3px 6px",borderBottom:"1px solid #0f172a",fontSize:"12px",color:"#e2e8f0"}}>
            <span>{i+1}. {p}</span>
            <button onClick={()=>setForm(f=>({...f,qcParameters:f.qcParameters.filter((_,xi)=>xi!==i)}))} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:"14px",padding:"0 4px",lineHeight:1}}>×</button>
          </div>)}
          {(form.qcParameters||[]).length===0&&<div style={{color:"#334155",fontSize:"11px",fontStyle:"italic",padding:"4px 6px"}}>No parameters yet</div>}
        </div>
        <div style={{display:"flex",gap:"6px"}}>
          <input id="qc-param-add" style={{...inp,flex:1,fontSize:"12px"}} placeholder="e.g. Impact Resistance, Colour match..." onKeyDown={e=>{if(e.key==="Enter"){const v=e.target.value.trim();if(v){setForm(f=>({...f,qcParameters:[...(f.qcParameters||[]),v]}));e.target.value="";}}}}/>
          <button onClick={()=>{const el=document.getElementById("qc-param-add");const v=el.value.trim();if(v){setForm(f=>({...f,qcParameters:[...(f.qcParameters||[]),v]}));el.value="";}}} style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"6px",padding:"6px 12px",color:"#93c5fd",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>+ Add</button>
        </div>
      </div>
      <Field label="Next Steps"><textarea style={{...ta,minHeight:"50px"}} value={form.nextSteps} onChange={e=>setForm({...form,nextSteps:e.target.value})}/></Field>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowForm(false)} outline color="#475569" small/>
        <Btn label={saving?"Saving…":"Save Trial"} onClick={saveTrial} disabled={saving} color="#2563eb" small/>
      </div>
    </div>}
    {trials.length===0&&!showForm?<div style={{textAlign:"center",padding:"24px",border:"1px dashed #1e293b",borderRadius:"10px",marginBottom:"14px"}}>
      <div style={{fontSize:"26px",marginBottom:"6px"}}>⚗️</div>
      <div style={{fontSize:"13px",color:"#475569"}}>No trials yet.</div>
    </div>:<>
      {trials.length>=2&&<CompareTrialsModal trials={trials} project={live}/>}
      {trials.map((t,i)=><TrialCard key={t.id} trial={t} index={i} isAdmin={isAdmin} onDelete={isAdmin?deleteTrial:null} onUpdate={updateTrial} onCopy={copyTrial} sysUnits={sysUnits} onAddUnit={onAddUnit} project={live} allProfiles={allProfiles} showToast={showToast}/>)}
    </>}
    {/* Notes section */}
    <div style={{marginTop:"20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px",paddingBottom:"10px",borderBottom:"1px solid #1e293b"}}>
        <span style={{fontSize:"12px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.1em"}}>Formulation Base & Notes</span>
        {isAdmin&&!editNotes&&<button onClick={()=>{setEditNotes(true);setDraft(d=>({...d,formulationBase:live.formulationBase||"",notes:live.notes||""}))}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 10px",color:"#475569",fontSize:"11px",cursor:"pointer"}}>✏️ Edit</button>}
      </div>
      {editNotes?<div>
        <Field label="Formulation Base"><textarea style={ta} value={draft.formulationBase} onChange={e=>setDraft(d=>({...d,formulationBase:e.target.value}))}/></Field>
        <Field label="Notes"><textarea style={{...ta,minHeight:"56px"}} value={draft.notes} onChange={e=>setDraft(d=>({...d,notes:e.target.value}))}/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginBottom:"10px"}}>
          <Btn label="Cancel" onClick={()=>setEditNotes(false)} outline color="#475569" small/>
          <Btn label={savingN?"Saving…":"Save Changes"} onClick={saveNotes} disabled={savingN} color="#3b82f6" small/>
        </div>
      </div>:<>
        {[["Formulation Base",live.formulationBase],["Notes",live.notes]].map(([label,val])=><div key={label} style={{marginBottom:"10px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"4px"}}>{label}</div>
          <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"10px 13px",fontSize:"13px",color:val?"#94a3b8":"#334155",lineHeight:1.65,whiteSpace:"pre-wrap",fontStyle:val?"normal":"italic"}}>
            {val||(isAdmin?`No ${label.toLowerCase()} yet. Click Edit above.`:`No ${label.toLowerCase()} added yet.`)}
          </div>
        </div>)}
      </>}
    </div>
  </div>;
}

function ProjectCard({p,onClick,onDelete,onEdit,isAdmin}){
  const accent=PAINT_ACCENT[p.paintType]||"#cbd5e1";
  const sc=STATUS_COLORS[p.status]||"#94a3b8";
  const tc=(p.trials||[]).length;
  const hasFinal=(p.trials||[]).some(t=>t.outcome==="Approved as Final");
  return <div onClick={onClick} onMouseEnter={e=>e.currentTarget.style.background="#0f1f35"} onMouseLeave={e=>e.currentTarget.style.background="#0f172a"}
    style={{background:"#0f172a",border:"1px solid #1e293b",borderLeft:`3px solid ${accent}`,borderRadius:"12px",padding:"15px 20px",cursor:"pointer",transition:"background 0.15s",boxShadow:"0 2px 10px rgba(0,0,0,0.3)",marginBottom:"10px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}>
      <div style={{flex:1}}>
        <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9",marginBottom:"3px",fontFamily:"'DM Serif Display',serif"}}>{p.projectName}</div>
        <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"6px"}}>#{p.projectCode} · {p.paintType} · {p.application||"—"}</div>
      </div>
      <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
        <Bdg label={p.status} color={sc}/>
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onEdit(p)}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",color:"#475569",fontSize:"12px",padding:"2px 8px",cursor:"pointer"}}>✏️</button>}
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onDelete(p.id)}} style={{background:"none",border:"none",color:"#334155",fontSize:"15px",padding:"2px 4px",cursor:"pointer"}}>🗑</button>}
      </div>
    </div>
    <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:"11px",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"6px",padding:"2px 9px",color:tc>0?"#93c5fd":"#334155"}}>
        ⚗️ {tc} Trial{tc!==1?"s":""}{hasFinal&&<span style={{color:"#22c55e",marginLeft:"5px"}}>✓ Final</span>}
      </span>
      {p.assignedTo&&<span style={{fontSize:"11px",color:"#475569"}}>👤 {p.assignedTo}</span>}
    </div>
  </div>;
}

// ══ RM MODULE
function RMCard({r,onClick,onDelete,onEdit,isAdmin,allProfiles={}}){
  const rc=RESULT_COLORS[r.testResult]||"#94a3b8";
  const retestCount=(r.retests||[]).length;
  const awaitingTest=!r.testsPerformed&&!r.observations;
  return <div onClick={onClick} onMouseEnter={e=>e.currentTarget.style.background="#0f1f35"} onMouseLeave={e=>e.currentTarget.style.background="#0f172a"}
    style={{background:"#0f172a",border:"1px solid #1e293b",borderLeft:`3px solid ${rc}`,borderRadius:"12px",padding:"15px 20px",cursor:"pointer",transition:"background 0.15s",boxShadow:"0 2px 10px rgba(0,0,0,0.3)",marginBottom:"10px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}>
      <div style={{flex:1}}>
        <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9",marginBottom:"3px",fontFamily:"'DM Serif Display',serif"}}>{r.materialName}</div>
        <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"6px"}}>{r.vendorName} · {r.category} · Batch: {r.batchNo||"—"}</div>
      </div>
      <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
        {r.testResult==="Retest Required"&&<Bdg label="⚠️ Retest" color="#f97316" small/>}
        {awaitingTest&&r.testResult==="Pending"&&<Bdg label="⏳ Awaiting QC" color="#a855f7" small/>}
        <Bdg label={r.testResult} color={rc}/>
        <button onClick={e=>{e.stopPropagation();printRMTestSheet(r);}} style={{background:"#052e16",border:"1px solid #16653440",borderRadius:"6px",color:"#4ade80",cursor:"pointer",fontSize:"11.5px",fontWeight:"600",padding:"3px 10px"}}>🖨 Print</button>
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onEdit(r)}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",color:"#475569",fontSize:"12px",padding:"2px 8px",cursor:"pointer"}}>✏️</button>}
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onDelete(r.id)}} style={{background:"none",border:"none",color:"#334155",fontSize:"15px",padding:"2px 4px",cursor:"pointer"}}>🗑</button>}
      </div>
    </div>
    {r.specsToTest&&<div style={{fontSize:"11.5px",color:"#94a3b8",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"6px",padding:"6px 10px",marginBottom:"8px",fontStyle:"italic"}}>📋 {r.specsToTest}</div>}
    <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
      {r.dateReceived&&<span style={{fontSize:"11px",color:"#475569"}}>📦 {r.dateReceived}</span>}
      {r.testedBy&&<span style={{fontSize:"11px",color:"#475569"}}>🔬 {r.testedBy}</span>}
      {r.assignedTo&&<span style={{fontSize:"10px",fontWeight:"700",color:"#fbbf24",background:"#fbbf2418",border:"1px solid #fbbf2430",padding:"2px 8px",borderRadius:"99px"}}>👤 {allProfiles[r.assignedTo]?.displayName||r.assignedTo.split("@")[0]}</span>}
      {retestCount>0&&<span style={{fontSize:"11px",color:"#f97316",background:"#f9731612",border:"1px solid #f9731625",borderRadius:"6px",padding:"2px 8px"}}>🔄 {retestCount} retest{retestCount!==1?"s":""}</span>}
    </div>
  </div>;
}

function RMDetailView({entry,showToast,allProfiles={}}){
  const [live,setLive]=useState(entry);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [showOU,setShowOU]=useState(false);
  const [newResult,setNewResult]=useState(entry.testResult);
  const blank={date:today(),testedBy:"",testsPerformed:"",results:"",newResult:"Pass",remarks:""};
  const [retestForm,setRetestForm]=useState(blank);
  // Initial test result form — used when this entry was created as a "to test" request
  // (no original test logged yet), so QC can fill in the FIRST result, not a retest.
  const blankInitial={date:today(),testedBy:"",testsPerformed:"",observations:"",testResult:"Pass",remarks:""};
  const [initialForm,setInitialForm]=useState(blankInitial);
  const [showInitialForm,setShowInitialForm]=useState(false);

  useEffect(()=>{
    const unsub=C("rm_tests").doc(entry.id).onSnapshot(snap=>{
      if(snap.exists)setLive({id:snap.id,...snap.data()});
    });
    return unsub;
  },[entry.id]);

  const retests=live.retests||[];
  const rc=RESULT_COLORS[live.testResult]||"#94a3b8";
  const isRetest=live.testResult==="Retest Required";
  const hasOriginalTest=!!(live.testsPerformed||live.observations);

  const saveInitialTest=async()=>{
    if(!initialForm.testsPerformed.trim()&&!initialForm.observations.trim())return showToast("Add tests performed or observations","error");
    if(saving)return;setSaving(true);
    try{
      await C("rm_tests").doc(entry.id).update({
        dateReceived:live.dateReceived||initialForm.date,
        testedBy:initialForm.testedBy,testsPerformed:initialForm.testsPerformed,
        observations:initialForm.observations,testResult:initialForm.testResult,remarks:initialForm.remarks
      });
      setShowInitialForm(false);showToast("Test result logged ✓");
    }catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const saveRetest=async()=>{
    if(!retestForm.results.trim()&&!retestForm.testsPerformed.trim())return showToast("Add results or tests performed","error");
    if(saving)return;setSaving(true);
    try{
      const nr={...retestForm,id:newId()};
      await C("rm_tests").doc(entry.id).update({retests:[...retests,nr]});
      setRetestForm(blank);setShowForm(false);
      setNewResult(nr.newResult);setShowOU(true);showToast("Retest saved ✓");
    }catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const applyResult=async()=>{
    setSaving(true);
    try{await C("rm_tests").doc(entry.id).update({testResult:newResult});setShowOU(false);showToast("Status updated ✓");}catch(e){showToast("Error","error");}
    setSaving(false);
  };

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"14px",gap:"8px"}}>
      <div>
        <div style={{fontSize:"20px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>{live.materialName}</div>
        <div style={{fontSize:"12px",color:"#64748b"}}>{live.vendorName} · {live.category}</div>
      </div>
      <div style={{display:"flex",gap:"8px",alignItems:"center",flexShrink:0}}>
        {retests.length>0&&<Bdg label={`🔄 ${retests.length} Retest${retests.length!==1?"s":""}`} color="#f97316" small/>}
        <Bdg label={live.testResult} color={rc}/>
        <button onClick={()=>printRMTestSheet(live)} style={{background:"#052e16",border:"1px solid #16653440",borderRadius:"6px",color:"#4ade80",cursor:"pointer",fontSize:"11.5px",fontWeight:"600",padding:"4px 10px"}}>🖨 Print</button>
      </div>
    </div>
    {live.assignedTo&&<div style={{marginBottom:"10px"}}><span style={{fontSize:"11px",fontWeight:"700",color:"#fbbf24",background:"#fbbf2418",border:"1px solid #fbbf2430",padding:"3px 10px",borderRadius:"99px"}}>👤 Assigned to {allProfiles[live.assignedTo]?.displayName||live.assignedTo.split("@")[0]}</span></div>}
    {live.specsToTest&&<div style={{background:"#0c1a2e",border:"1px solid #2563eb40",borderRadius:"10px",padding:"10px 14px",marginBottom:"12px"}}>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#93c5fd",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"4px"}}>📋 Specification — What to Test</div>
      <div style={{fontSize:"13px",color:"#cbd5e1",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{live.specsToTest}</div>
    </div>}
    {isRetest&&<div style={{background:"#431407",border:"1px solid #ea580c50",borderRadius:"10px",padding:"10px 14px",marginBottom:"12px",display:"flex",alignItems:"center",gap:"8px"}}>
      <span>⚠️</span><div><div style={{fontSize:"12px",fontWeight:"700",color:"#f97316"}}>Retest Required</div><div style={{fontSize:"11.5px",color:"#c2410c"}}>This sample needs retesting.</div></div>
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"12px"}}>
      {[["Batch No",live.batchNo],["Lot No",live.lotNo],["Quantity",live.quantityReceived],["Date Received",live.dateReceived],["Tested By",live.testedBy]].map(([l,v])=>v&&<div key={l} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"8px 12px"}}>
        <div style={{fontSize:"10px",color:"#475569",fontWeight:"600",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"2px"}}>{l}</div>
        <div style={{fontSize:"13px",color:"#94a3b8",fontWeight:"600"}}>{v}</div>
      </div>)}
    </div>
    {hasOriginalTest&&<div style={{border:"1px solid #1e293b",borderRadius:"10px",marginBottom:"12px",overflow:"hidden"}}>
      <div style={{background:"#0b1220",padding:"9px 14px",fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",borderBottom:"1px solid #1e293b"}}>🧫 Original Test</div>
      <div style={{padding:"12px 14px"}}>
        {[["Tests Performed",live.testsPerformed],["Observations / Results",live.observations],["Remarks",live.remarks]].map(([l,v])=>v&&<div key={l} style={{marginBottom:"8px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"3px"}}>{l}</div>
          <div style={{fontSize:"13px",color:"#94a3b8",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{v}</div>
        </div>)}
      </div>
    </div>}
    {!hasOriginalTest&&<div style={{border:"1px solid #7c3aed40",borderRadius:"10px",marginBottom:"12px",overflow:"hidden",background:"#0a0f1e"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px"}}>
        <span style={{fontSize:"11px",fontWeight:"700",color:"#a855f7",textTransform:"uppercase",letterSpacing:"0.09em"}}>⏳ Awaiting Test Result</span>
        <button onClick={()=>setShowInitialForm(v=>!v)} style={{background:"#3b0764",border:"1px solid #7c3aed",borderRadius:"7px",padding:"5px 12px",color:"#c4b5fd",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>
          {showInitialForm?"▲ Cancel":"+ Log Test Result"}</button>
      </div>
      {!showInitialForm&&<div style={{padding:"0 14px 12px",fontSize:"12px",color:"#475569"}}>No test result logged yet. Print the sheet above, perform the test, then click "+ Log Test Result" to record findings.</div>}
      {showInitialForm&&<div style={{padding:"0 14px 14px"}}>
        <Grid3>
          <Field label="Date"><input type="date" style={inp} value={initialForm.date} onChange={e=>setInitialForm({...initialForm,date:e.target.value})}/></Field>
          <Field label="Tested By"><input style={inp} value={initialForm.testedBy} onChange={e=>setInitialForm({...initialForm,testedBy:e.target.value})}/></Field>
          <Field label="Result"><select style={{...sl,borderColor:(RESULT_COLORS[initialForm.testResult]||"#1e293b")+"60"}} value={initialForm.testResult} onChange={e=>setInitialForm({...initialForm,testResult:e.target.value})}>{TEST_RESULTS.map(r=><option key={r}>{r}</option>)}</select></Field>
        </Grid3>
        <Grid2>
          <Field label="Tests Performed"><textarea style={{...ta,minHeight:"70px"}} value={initialForm.testsPerformed} onChange={e=>setInitialForm({...initialForm,testsPerformed:e.target.value})}/></Field>
          <Field label="Observations / Results"><textarea style={{...ta,minHeight:"70px"}} value={initialForm.observations} onChange={e=>setInitialForm({...initialForm,observations:e.target.value})}/></Field>
        </Grid2>
        <Field label="Remarks"><textarea style={{...ta,minHeight:"50px"}} value={initialForm.remarks} onChange={e=>setInitialForm({...initialForm,remarks:e.target.value})}/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setShowInitialForm(false)} outline color="#475569" small/>
          <Btn label={saving?"Saving…":"Save Result"} onClick={saveInitialTest} disabled={saving} color="#7c3aed" small/>
        </div>
      </div>}
    </div>}
    {/* Retests */}
    <div style={{borderTop:"1px solid #1e293b",paddingTop:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
        <span style={{fontSize:"11px",fontWeight:"700",color:isRetest?"#f97316":"#475569",textTransform:"uppercase",letterSpacing:"0.09em"}}>🔄 Retest History ({retests.length})</span>
        <button onClick={()=>{setShowForm(v=>!v);setShowOU(false);}} style={{background:isRetest?"#431407":"#1e293b",border:`1px solid ${isRetest?"#ea580c":"#334155"}`,borderRadius:"7px",padding:"5px 12px",color:isRetest?"#fb923c":"#64748b",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>
          {showForm?"▲ Cancel":"+ Add Retest"}</button>
      </div>
      {retests.length===0&&!showForm&&<div style={{textAlign:"center",padding:"12px",border:"1px dashed #1e293b",borderRadius:"8px",marginBottom:"8px"}}>
        <div style={{fontSize:"12px",color:"#334155"}}>{isRetest?"⏳ Awaiting retest.":"No retests."}</div>
      </div>}
      {retests.map((r,i)=>{
        const rrc=RESULT_COLORS[r.newResult]||"#94a3b8";
        return <div key={r.id} style={{display:"flex",gap:"10px",marginBottom:"10px"}}>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",flexShrink:0}}>
            <div style={{width:"26px",height:"26px",borderRadius:"50%",background:`${rrc}20`,border:`2px solid ${rrc}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",fontWeight:"700",color:rrc}}>{i+1}</div>
            {i<retests.length-1&&<div style={{width:"2px",flex:1,background:"#1e293b",marginTop:"4px"}}/>}
          </div>
          <div style={{flex:1,background:"#0b1220",border:"1px solid #1e293b",borderLeft:`3px solid ${rrc}`,borderRadius:"8px",padding:"10px 12px",marginBottom:"4px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6px"}}>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontSize:"11px",fontWeight:"700",color:"#475569",background:"#1e293b",padding:"2px 8px",borderRadius:"6px"}}>Retest #{i+1}</span>
                {r.date&&<span style={{fontSize:"11px",color:"#475569"}}>📅 {r.date}</span>}
                {r.testedBy&&<span style={{fontSize:"11px",color:"#475569"}}>🔬 {r.testedBy}</span>}
              </div>
              <div style={{display:"flex",gap:"5px",alignItems:"center",flexShrink:0}}>
                <Bdg label={r.newResult} color={rrc} small/>
                <button onClick={async()=>{if(confirm("Delete?"))await C("rm_tests").doc(entry.id).update({retests:retests.filter(x=>x.id!==r.id)});}} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"12px"}}>🗑</button>
              </div>
            </div>
            {[["Tests",r.testsPerformed],["Results",r.results],["Remarks",r.remarks]].map(([l,v])=>v&&<div key={l} style={{marginBottom:"4px"}}>
              <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"2px"}}>{l}</div>
              <div style={{fontSize:"12.5px",color:"#94a3b8",whiteSpace:"pre-wrap"}}>{v}</div>
            </div>)}
          </div>
        </div>;
      })}
      {showForm&&<div style={{background:"#0a0f1e",border:"1px solid #ea580c40",borderRadius:"10px",padding:"14px",marginBottom:"10px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#fb923c",marginBottom:"12px"}}>🔄 Retest #{retests.length+1}</div>
        <Grid3>
          <Field label="Date"><input type="date" style={inp} value={retestForm.date} onChange={e=>setRetestForm({...retestForm,date:e.target.value})}/></Field>
          <Field label="Tested By"><input style={inp} value={retestForm.testedBy} onChange={e=>setRetestForm({...retestForm,testedBy:e.target.value})}/></Field>
          <Field label="Result"><select style={{...sl,borderColor:(RESULT_COLORS[retestForm.newResult]||"#1e293b")+"60"}} value={retestForm.newResult} onChange={e=>setRetestForm({...retestForm,newResult:e.target.value})}>{TEST_RESULTS.map(r=><option key={r}>{r}</option>)}</select></Field>
        </Grid3>
        <Grid2>
          <Field label="Tests Performed"><textarea style={{...ta,minHeight:"70px"}} value={retestForm.testsPerformed} onChange={e=>setRetestForm({...retestForm,testsPerformed:e.target.value})}/></Field>
          <Field label="Results / Values *"><textarea style={{...ta,minHeight:"70px"}} value={retestForm.results} onChange={e=>setRetestForm({...retestForm,results:e.target.value})}/></Field>
        </Grid2>
        <Field label="Remarks"><textarea style={{...ta,minHeight:"50px"}} value={retestForm.remarks} onChange={e=>setRetestForm({...retestForm,remarks:e.target.value})}/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setShowForm(false)} outline color="#475569" small/>
          <Btn label={saving?"Saving…":"Save Retest"} onClick={saveRetest} disabled={saving} color="#ea580c" small/>
        </div>
      </div>}
      {showOU&&<div style={{background:"#0c1a2e",border:"1px solid #2563eb60",borderRadius:"10px",padding:"12px 14px",marginTop:"6px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"6px"}}>🔄 Update Overall Status</div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
          <select style={{...sl,flex:1,minWidth:"170px"}} value={newResult} onChange={e=>setNewResult(e.target.value)}>{TEST_RESULTS.map(r=><option key={r}>{r}</option>)}</select>
          <Btn label={saving?"Saving…":"✓ Update"} onClick={applyResult} disabled={saving} color="#2563eb" small/>
          <Btn label="Keep as is" onClick={()=>setShowOU(false)} outline color="#475569" small/>
        </div>
      </div>}
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════════
// DASHBOARD TAB
// ══════════════════════════════════════════════════════════
function DashboardTab({role,roles,hp,user,onNavigate}){
  const [counts,setCounts]=useState({batches:0,activeBatches:0,openComplaints:0,rdProjects:0,rmTests:0,qcPending:0,openEnquiries:0,newEnquiries:0});
  const [myTasks,setMyTasks]=useState([]);
  const canSeeEnquiries=roles?.includes("admin")||hp?.("enquiries_create")||hp?.("enquiries_view_all")||hp?.("enquiries_update");
  const canViewAllEnquiries=roles?.includes("admin")||hp?.("enquiries_view_all");
  useEffect(()=>{
    const u=C("tasks").where("assignedTo","==",user.email).where("status","==","pending")
      .onSnapshot(s=>{
        const sorted=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b._createdAt?.seconds-a._createdAt?.seconds);
        setMyTasks(sorted);
      },()=>{});
    return u;
  },[user?.email]);
  useEffect(()=>{
    // For sales: only count their own open complaints
    const complaintsQuery=role==="sales"&&user?.email
      ?C("complaints").where("status","in",["Open","Under Review"]).where("addedBy","==",user.email)
      :C("complaints").where("status","in",["Open","Under Review"]);
    Promise.all([
      C("batches").get(),
      // Active = packing NOT yet done (Packed = fully finished)
      C("batches").where("status","in",["Issued","In Production","QC Pending","QC Pass","QC Fail"]).get(),
      C("batches").where("status","==","QC Pending").get(),
      complaintsQuery.get(),
      // R&D active = Ongoing or Pending Approval only (exclude Completed, Cancelled, On Hold)
      C("rd_projects").where("status","in",["Ongoing","Pending Approval"]).get(),
      C("rm_tests").get(),
    ]).then(([b,ab,qc,oc,rd,rm])=>setCounts(c=>({...c,batches:b.size,activeBatches:ab.size,qcPending:qc.size,openComplaints:oc.size,rdProjects:rd.size,rmTests:rm.size})));
  },[role,user?.email]);
  useEffect(()=>{
    if(!canSeeEnquiries)return;
    const openStatuses=["New","Samples to be Shared","Price List Shared","Already Buying from Our Customer"];
    const eq=canViewAllEnquiries
      ? C("enquiries").where("status","in",openStatuses)
      : C("enquiries").where("assignedTo","==",user?.email||"__none__");
    const unsub=eq.onSnapshot(s=>{
      const docs=s.docs.map(d=>d.data());
      const open=canViewAllEnquiries?docs.length:docs.filter(d=>openStatuses.includes(d.status)).length;
      const fresh=docs.filter(d=>d.status==="New").length;
      setCounts(c=>({...c,openEnquiries:open,newEnquiries:fresh}));
    },()=>{});
    return unsub;
  },[canSeeEnquiries,canViewAllEnquiries,user?.email]);

  const tiles=[
    {label:"Active Batches",val:counts.activeBatches,color:"#3b82f6",icon:"📦",tab:"batches",hint:"Batches pending packing (not yet Packed)",roles:["admin","issuer","qc"]},
    {label:"QC Pending",val:counts.qcPending,color:"#a855f7",icon:"🔬",tab:"batches",hint:"View batches awaiting QC",roles:["admin","qc"]},
    {label:role==="sales"?"My Open Complaints":"Open Complaints",val:counts.openComplaints,color:"#ef4444",icon:"⚠️",tab:"complaints",hint:"Go to Complaints",roles:["admin","issuer","qc","sales"]},
    {label:"R&D Active",val:counts.rdProjects,color:"#22c55e",icon:"🧪",tab:"rd",hint:"Ongoing R&D projects (excludes Completed/Cancelled)",roles:["admin","qc"]},
    {label:"RM Tests",val:counts.rmTests,color:"#f59e0b",icon:"🧫",tab:"rd",hint:"Go to R&D & QC",roles:["admin","qc"]},
    {label:"Total Batches",val:counts.batches,color:"#64748b",icon:"📋",tab:"batches",hint:"View all batches",roles:["admin","issuer"]},
    ...(canSeeEnquiries?[
      {label:role==="sales"&&!canViewAllEnquiries?"My Open Enquiries":"Open Enquiries",val:counts.openEnquiries,color:"#06b6d4",icon:"📞",tab:"enquiries",hint:"Go to Enquiries",roles:["admin","sales","ho"]},
      ...(canViewAllEnquiries?[{label:"New (Unactioned) Enquiries",val:counts.newEnquiries,color:"#ec4899",icon:"🆕",tab:"enquiries",hint:"Enquiries with no status update yet",roles:["admin","sales","ho"]}]:[])
    ]:[]),
  ].filter(t=>t.roles.includes(role));

  return <div>
    <div style={{marginBottom:"24px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#3b82f6",letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:"4px"}}>Welcome back</div>
      <h2 style={{fontSize:"22px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>Operations <span style={{fontStyle:"italic",color:"#3b82f6"}}>Overview</span></h2>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:"12px"}}>
      {tiles.map(t=>{
        const clickable=onNavigate&&t.tab;
        return <div key={t.label} onClick={clickable?()=>onNavigate(t.tab):undefined}
          title={t.hint}
          onMouseEnter={e=>{if(clickable){e.currentTarget.style.background="#111827";e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 6px 20px ${t.color}30`;}}}
          onMouseLeave={e=>{if(clickable){e.currentTarget.style.background="#0f172a";e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="0 2px 10px rgba(0,0,0,0.3)";}}}
          style={{background:"#0f172a",border:`1px solid ${t.color}40`,borderTop:`3px solid ${t.color}`,borderRadius:"12px",padding:"16px 18px",boxShadow:"0 2px 10px rgba(0,0,0,0.3)",cursor:clickable?"pointer":"default",transition:"all 0.15s",position:"relative"}}>
          <div style={{fontSize:"24px",marginBottom:"8px"}}>{t.icon}</div>
          <div style={{fontSize:"28px",fontWeight:"700",color:t.color,marginBottom:"4px"}}>{t.val}</div>
          <div style={{fontSize:"12px",color:"#475569",fontWeight:"600"}}>{t.label}</div>
          {clickable&&<div style={{position:"absolute",bottom:"8px",right:"10px",fontSize:"10px",color:t.color,opacity:0.6}}>→</div>}
        </div>;
      })}
    </div>
    {/* My pending tasks */}
    <div style={{marginTop:"20px",background:"#0f172a",border:`1px solid ${myTasks.length?"#1e3a5f":"#1e293b"}`,borderRadius:"12px",padding:"16px 18px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.1em"}}>
          📋 My Pending Tasks {myTasks.length>0&&<span style={{background:"#ef4444",color:"#fff",borderRadius:"99px",fontSize:"10px",padding:"1px 7px",marginLeft:"6px"}}>{myTasks.length}</span>}
        </div>
        {onNavigate&&<button onClick={()=>onNavigate("tasks")} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 10px",color:"#64748b",fontSize:"11px",cursor:"pointer"}}>View All →</button>}
      </div>
      {myTasks.length===0
        ?<div style={{fontSize:"12px",color:"#334155",fontStyle:"italic"}}>No pending tasks — you're all caught up ✓</div>
        :myTasks.slice(0,5).map(task=>{
          const isOverdue=task.dueDate&&task.dueDate<today();
          const PRIORITY_COLORS={High:"#ef4444",Normal:"#3b82f6",Low:"#22c55e"};
          return <div key={task.id} style={{display:"flex",gap:"10px",alignItems:"flex-start",padding:"8px 10px",background:"#080d18",borderRadius:"8px",marginBottom:"5px",border:`1px solid ${isOverdue?"#7f1d1d":"#1e293b"}`}}>
            <span style={{fontSize:"14px",marginTop:"1px"}}>📌</span>
            <div style={{flex:1}}>
              <div style={{fontSize:"13px",fontWeight:"600",color:"#e2e8f0"}}>{task.title}</div>
              <div style={{fontSize:"11px",color:"#475569",display:"flex",gap:"8px",flexWrap:"wrap",marginTop:"2px"}}>
                <span>By: {task.assignedBy}</span>
                {task.dueDate&&<span style={{color:isOverdue?"#ef4444":"#64748b"}}>⏰ {task.dueDate}{isOverdue?" (Overdue!)":""}</span>}
                <Bdg label={task.priority||"Normal"} color={PRIORITY_COLORS[task.priority||"Normal"]} small/>
              </div>
            </div>
          </div>;
        })}
      {myTasks.length>5&&<div style={{fontSize:"11px",color:"#475569",textAlign:"center",marginTop:"6px"}}>+{myTasks.length-5} more — <button onClick={()=>onNavigate&&onNavigate("tasks")} style={{background:"none",border:"none",color:"#3b82f6",cursor:"pointer",fontSize:"11px"}}>view all</button></div>}
    </div>
    <div style={{marginTop:"20px",background:"#0f172a",border:"1px solid #1e293b",borderRadius:"12px",padding:"16px 18px"}}>
      <div style={{fontSize:"12px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:"10px"}}>Your Access Level</div>
      <div style={{display:"flex",gap:"10px",flexWrap:"wrap"}}>
        {[
          {r:"admin",desc:"Full access: Create, view, edit, delete all modules. Manage user roles."},
          {r:"issuer",desc:"Issue & track batches. View complaints."},
          {r:"qc",desc:"Enter production, QC, packing details. Full R&D & RM test access. Respond to complaints."},
          {r:"sales",desc:"Add complaints. View and respond after QC has investigated."},
        ].filter(x=>x.r===role).map(x=><div key={x.r} style={{background:`${ROLE_COLORS[x.r]}12`,border:`1px solid ${ROLE_COLORS[x.r]}30`,borderRadius:"8px",padding:"10px 14px",flex:1}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:ROLE_COLORS[x.r],marginBottom:"4px"}}>{ROLE_LABELS[x.r]}</div>
          <div style={{fontSize:"12.5px",color:"#64748b",lineHeight:1.5}}>{x.desc}</div>
        </div>)}
      </div>
    </div>
  </div>;
}

// USERS TAB (Admin only)
