// USERS TAB (Admin only)
// ══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════
// TESTIMONIALS MODULE
// ══════════════════════════════════════════════════════════
function TestimonialsTab({role,user,showToast}){
  const [testimonials,setTestimonials]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showAdd,setShowAdd]=useState(false);
  const [saving,setSaving]=useState(false);
  const [viewItem,setViewItem]=useState(null);
  const [search,setSearch]=useState("");
  const [filterRating,setFilterRating]=useState("All");
  const blank={customerName:"",location:"",product:"",rating:"5",testimonialText:"",usedFor:"",attachments:[]};
  const [form,setForm]=useState({...blank});
  const [formFiles,setFormFiles]=useState([]);
  const isAdmin=role==="admin";

  useEffect(()=>{
    const unsub=C("testimonials").orderBy("_createdAt","desc").onSnapshot(snap=>{
      setTestimonials(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    },()=>setLoading(false));
    return unsub;
  },[]);

  const save=async()=>{
    if(!form.customerName.trim()||!form.testimonialText.trim())return showToast("Customer name and testimonial required","error");
    setSaving(true);
    try{
      await C("testimonials").add({...form,attachments:formFiles,addedBy:user.email,dateAdded:today(),_createdAt:ts()});
      setForm({...blank});setFormFiles([]);setShowAdd(false);showToast("Testimonial added ✓");
    }catch(e){showToast("Error: "+e.message,"error");}
    setSaving(false);
  };

  const del=async(id)=>{if(!confirm("Delete this testimonial?"))return;await C("testimonials").doc(id).delete();showToast("Deleted","error");};

  const downloadTestimonial=(t)=>{
    const ratingStars="★".repeat(parseInt(t.rating)||5)+"☆".repeat(5-(parseInt(t.rating)||5));
    const imgs=(t.attachments||[]).filter(a=>a.type?.startsWith("image/"));
    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Testimonial — ${t.customerName}</title>
<style>
  body{font-family:Georgia,serif;max-width:700px;margin:40px auto;padding:24px;color:#1a1a1a;background:#fff;}
  .header{text-align:center;border-bottom:2px solid #1a1a1a;padding-bottom:16px;margin-bottom:20px;}
  .company{font-size:11pt;text-transform:uppercase;letter-spacing:2px;color:#555;}
  .stars{font-size:24pt;color:#f59e0b;letter-spacing:4px;margin:8px 0;}
  .quote{font-size:15pt;line-height:1.7;font-style:italic;color:#222;border-left:4px solid #f59e0b;padding-left:20px;margin:20px 0;}
  .customer{font-size:13pt;font-weight:bold;}
  .meta{font-size:10pt;color:#666;margin-top:4px;}
  .photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
  .photos img{width:200px;height:150px;object-fit:cover;border-radius:6px;border:1px solid #ddd;}
  .footer{border-top:1px solid #ccc;padding-top:10px;margin-top:20px;font-size:9pt;color:#999;text-align:center;}
  @media print{body{margin:20px;} @page{margin:15mm;size:A4 portrait;}}
</style></head><body>
<div class="header">
  <div class="company">Gujarat Colours &amp; Coatings Pvt Ltd</div>
  <div class="stars">${ratingStars}</div>
</div>
<div class="quote">"${(t.testimonialText||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}"</div>
<div class="customer">${(t.customerName||"").replace(/&/g,"&amp;")}</div>
<div class="meta">${t.product?`Product: ${t.product}`:""} ${t.location?`&nbsp;·&nbsp; ${t.location}`:""} ${t.usedFor?`&nbsp;·&nbsp; ${t.usedFor}`:""}</div>
${imgs.length>0?`<div class="photos">${imgs.slice(0,4).map(i=>`<img src="${i.url}" alt="" onerror="this.style.display='none'"/>`).join("")}</div>`:""}
<div class="footer">Gujarat Colours &amp; Coatings Pvt Ltd &nbsp;·&nbsp; ${t.dateAdded}</div>
</body></html>`;
    const blob=new Blob([html],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`Testimonial_${(t.customerName||"customer").replace(/\s/g,"_")}.html`;
    a.click();URL.revokeObjectURL(url);
    showToast("Testimonial downloaded — open in browser and Print → Save as PDF ✓");
  };
  const ratingColor=(n)=>parseInt(n)>=4?"#f59e0b":parseInt(n)===3?"#64748b":"#ef4444";

  const ft=testimonials.filter(t=>{
    const q=normalize(search);
    const rs=filterRating==="All"||t.rating===filterRating;
    const ms=!q||normalize(t.customerName||"").includes(q)||normalize(t.product||"").includes(q)||normalize(t.testimonialText||"").includes(q);
    return rs&&ms;
  });

  return <div>
    <SectionHead title="⭐ Customer Testimonials"/>
    {/* Actions & filters */}
    <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginBottom:"14px"}}>
      <input placeholder="Search customer, product…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:"200px",padding:"7px 10px",fontSize:"12.5px"}}/>
      <select value={filterRating} onChange={e=>setFilterRating(e.target.value)} style={{...sl,width:"110px",padding:"7px 6px",fontSize:"12px"}}>
        <option value="All">All Ratings</option>
        {["5","4","3","2","1"].map(r=><option key={r} value={r}>{"★".repeat(parseInt(r))} ({r}/5)</option>)}
      </select>
      <span style={{fontSize:"11px",color:"#334155",marginLeft:"4px"}}>{ft.length} testimonial{ft.length!==1?"s":""}</span>
      <div style={{marginLeft:"auto"}}>
        <Btn label="+ Add Testimonial" onClick={()=>setShowAdd(true)} color="#f59e0b"/>
      </div>
    </div>

    {loading&&<div style={{textAlign:"center",padding:"40px",color:"#475569"}}>Loading…</div>}
    {!loading&&ft.length===0&&<div style={{textAlign:"center",padding:"50px 0"}}>
      <div style={{fontSize:"40px",marginBottom:"10px"}}>⭐</div>
      <div style={{fontSize:"13px",color:"#475569"}}>No testimonials yet. Add your first customer testimonial!</div>
    </div>}

    {/* Testimonial grid */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:"14px"}}>
      {ft.map(t=><div key={t.id} onClick={()=>setViewItem(t)}
        style={{background:"#0f172a",border:"1px solid #1e293b",borderLeft:`3px solid ${ratingColor(t.rating)}`,borderRadius:"12px",padding:"16px",cursor:"pointer",transition:"background 0.15s"}}
        onMouseEnter={e=>e.currentTarget.style.background="#0f1f35"} onMouseLeave={e=>e.currentTarget.style.background="#0f172a"}>
        {/* Rating */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
          <span style={{fontSize:"15px",color:ratingColor(t.rating),letterSpacing:"2px"}}>{stars(t.rating)}</span>
          <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
            {(t.attachments||[]).length>0&&<span style={{fontSize:"11px",color:"#475569"}}>📎 {t.attachments.length}</span>}
            <button onClick={e=>{e.stopPropagation();downloadTestimonial(t);}} title="Download" style={{background:"none",border:"none",color:"#3b82f6",cursor:"pointer",fontSize:"13px"}}>📥</button>
            {isAdmin&&<button onClick={e=>{e.stopPropagation();del(t.id)}} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"13px"}}>🗑</button>}
          </div>
        </div>
        {/* Testimonial text */}
        <div style={{fontSize:"13px",color:"#cbd5e1",lineHeight:1.6,marginBottom:"10px",fontStyle:"italic",display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden"}}>
          "{t.testimonialText}"
        </div>
        {/* Customer info */}
        <div style={{borderTop:"1px solid #1e293b",paddingTop:"8px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:"#e2e8f0"}}>{t.customerName}</div>
          <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>
            {t.product&&<span>{t.product}</span>}{t.location&&<span> · {t.location}</span>}
          </div>
          <div style={{fontSize:"10.5px",color:"#334155",marginTop:"3px"}}>Added: {t.dateAdded} by {t.addedBy}</div>
        </div>
        {/* Thumbnail preview */}
        {(t.attachments||[]).filter(a=>a.type?.startsWith("image/")).length>0&&<div style={{display:"flex",gap:"6px",marginTop:"8px",flexWrap:"wrap"}}>
          {t.attachments.filter(a=>a.type?.startsWith("image/")).slice(0,3).map((a,i)=><img key={i} src={a.url} alt="" style={{width:"60px",height:"50px",objectFit:"cover",borderRadius:"5px",border:"1px solid #1e293b"}}/>)}
        </div>}
      </div>)}
    </div>

    {/* Add Testimonial Modal */}
    <Modal open={showAdd} onClose={()=>{setShowAdd(false);setForm({...blank});setFormFiles([]);}} title="Add Customer Testimonial">
      <Grid2>
        <Field label="Customer Name *"><input style={inp} value={form.customerName} onChange={e=>setForm({...form,customerName:e.target.value})} placeholder="e.g. Ravi Sharma"/></Field>
        <Field label="Location / City"><input style={inp} value={form.location} onChange={e=>setForm({...form,location:e.target.value})} placeholder="e.g. Ahmedabad"/></Field>
      </Grid2>
      <Grid2>
        <Field label="Product Used"><input style={inp} value={form.product} onChange={e=>setForm({...form,product:e.target.value})} placeholder="e.g. Interior Emulsion White"/></Field>
        <Field label="Rating">
          <select style={sl} value={form.rating} onChange={e=>setForm({...form,rating:e.target.value})}>
            {["5","4","3","2","1"].map(r=><option key={r} value={r}>{"★".repeat(parseInt(r))} — {r}/5</option>)}
          </select>
        </Field>
      </Grid2>
      <Field label="Used For / Application"><input style={inp} value={form.usedFor} onChange={e=>setForm({...form,usedFor:e.target.value})} placeholder="e.g. Living room walls, 1500 sq.ft"/></Field>
      <Field label="Customer Testimonial *">
        <textarea style={{...ta,minHeight:"110px"}} value={form.testimonialText} onChange={e=>setForm({...form,testimonialText:e.target.value})} placeholder="What did the customer say about the product? Their experience, results, what they liked…"/>
      </Field>
      <div style={{marginBottom:"14px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>📸 Add Customer Photos / Videos</div>
        <FileAttachment folder={`testimonials/${form.customerName.replace(/\s/g,"_")||"customer"}`} existingFiles={formFiles} onFilesChange={setFormFiles} maxFiles={8}/>
        <div style={{fontSize:"10.5px",color:"#334155",marginTop:"4px"}}>Add photos/videos of the project, customer's space, or the customer using the product (max 8)</div>
      </div>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>{setShowAdd(false);setForm({...blank});setFormFiles([]);}} outline color="#475569"/>
        <Btn label={saving?"Saving…":"✓ Save Testimonial"} onClick={save} disabled={saving} color="#f59e0b"/>
      </div>
    </Modal>

    {/* View Testimonial Modal */}
    {viewItem&&<Modal wide open={!!viewItem} onClose={()=>setViewItem(null)} title="Customer Testimonial">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px"}}>
        <div>
          <div style={{fontSize:"20px",fontWeight:"700",color:"#e2e8f0"}}>{viewItem.customerName}</div>
          <div style={{fontSize:"12px",color:"#64748b"}}>{viewItem.product}{viewItem.location?` · ${viewItem.location}`:""}{viewItem.usedFor?` · ${viewItem.usedFor}`:""}</div>
        </div>
        <span style={{fontSize:"20px",color:ratingColor(viewItem.rating),letterSpacing:"2px"}}>{stars(viewItem.rating)}</span>
      </div>
      <div style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:"3px solid #f59e0b",borderRadius:"8px",padding:"16px",marginBottom:"14px"}}>
        <div style={{fontSize:"15px",color:"#cbd5e1",lineHeight:1.7,fontStyle:"italic"}}>"{viewItem.testimonialText}"</div>
      </div>
      {(viewItem.attachments||[]).length>0&&<div style={{marginBottom:"12px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>📸 Photos & Videos</div>
        <FileAttachment folder="" existingFiles={viewItem.attachments||[]} onFilesChange={()=>{}} readOnly={true}/>
      </div>}
      <div style={{fontSize:"11px",color:"#334155"}}>Added by {viewItem.addedBy} on {viewItem.dateAdded}</div>
      <div style={{marginTop:"12px",display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="📥 Download Testimonial" onClick={()=>downloadTestimonial(viewItem)} color="#3b82f6" small/>
        {isAdmin&&<Btn label="🗑 Delete" onClick={()=>{del(viewItem.id);setViewItem(null);}} color="#ef4444" outline small/>}
      </div>
    </Modal>}
  </div>;
}

function UsersTab({currentUser}){
  const [profiles,setProfiles]=useState({});  // uid/email -> {email, displayName}
  const [roles,setRoles]=useState({});         // email -> roles array
  const [userPerms,setUserPerms]=useState({}); // email -> permissions array
  const [editingRole,setEditingRole]=useState(null);
  const [editRoleVals,setEditRoleVals]=useState([]);
  const [editPerms,setEditPerms]=useState([]);
  const [saving,setSaving]=useState(null);
  const [localToast,setLocalToast]=useState(null);
  const showLT=(msg,type="success")=>{setLocalToast({msg,type});setTimeout(()=>setLocalToast(null),3000);};

  const [createEmail,setCreateEmail]=useState("");
  const [createPassword,setCreatePassword]=useState("");
  const [createName,setCreateName]=useState("");
  const [createRole,setCreateRole]=useState("sales");
  const [creating,setCreating]=useState(false);
  const [createError,setCreateError]=useState("");
  const [createSuccess,setCreateSuccess]=useState("");
  const [editPassEmail,setEditPassEmail]=useState(null);
  const [savingPass,setSavingPass]=useState(false);

  useEffect(()=>{
    // Load profiles
    const unsub1=C("userProfiles").onSnapshot(snap=>{
      const p={};
      snap.docs.forEach(d=>{const dat=d.data();if(dat.email)p[dat.email]={...dat,uid:d.id};});
      setProfiles(p);
    });
    // Load roles — this is the source of truth for all users
    const unsub2=C("roles").onSnapshot(snap=>{
      const r={};const p={};snap.docs.forEach(d=>{
        const data=d.data();
        r[d.id]=data.roles||(data.role?[data.role]:[]);
        p[d.id]=data.permissions||[];
      });setRoles(r);setUserPerms(p);
    });
    return()=>{unsub1();unsub2();};
  },[]);

  const createUser=async()=>{
    const isAdminRole=createRole==="admin";
    const DOMAIN="@gcc-hub.app";
    if(!createName.trim()&&!isAdminRole)return setCreateError("Name / Username is required.");
    if(!createPassword.trim())return setCreateError("Password is required.");
    if(createPassword.length<6)return setCreateError("Password must be at least 6 characters.");
    if(isAdminRole&&!createEmail.trim())return setCreateError("Admin accounts require a real email address (for password reset).");
    let finalEmail=createEmail.trim();
    if(!finalEmail){
      const username=createName.trim().toLowerCase().replace(/\s+/g,".").replace(/[^a-z0-9._]/g,"");
      finalEmail=username+DOMAIN;
    }
    setCreating(true);setCreateError("");setCreateSuccess("");
    try{
      const res=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${window._firebaseConfig.apiKey}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email:finalEmail,password:createPassword,returnSecureToken:false})
      });
      const data=await res.json();
      if(data.error)throw new Error(data.error.message);
      await C("roles").doc(finalEmail).set({roles:[createRole],role:createRole,assignedBy:currentUser.email,assignedAt:ts()},{merge:true});
      if(createName.trim()){
        await C("userProfiles").doc(data.localId||finalEmail).set({
          email:finalEmail,displayName:createName.trim(),
          isUsernameAccount:!createEmail.trim(),
          createdBy:currentUser.email,createdAt:ts()
        },{merge:true});
      }
      const loginInfo=createEmail.trim()?`Email: ${finalEmail}`:`Login email (auto): ${finalEmail}`;
      setCreateSuccess(`✅ Created: ${createName.trim()||finalEmail} — ${ROLE_LABELS[createRole]} | ${loginInfo}`);
      setCreateEmail("");setCreatePassword("");setCreateName("");setCreateRole("sales");
    }catch(e){
      const m=e.message;
      setCreateError(m==="EMAIL_EXISTS"?"This username/email already exists."
        :m.includes("WEAK_PASSWORD")?"Password must be 6+ characters.":m||"Error creating user.");
    }
    setCreating(false);
  };

  const saveRoleEdit=async(email)=>{
    if(!editPerms.length&&!editRoleVals.length)return showLT("Select at least one permission","error");
    setSaving(email);
    try{
      const prim=editRoleVals.length?primaryRole(editRoleVals):"store";
      await C("roles").doc(email).set({roles:editRoleVals,role:prim,permissions:editPerms,assignedBy:currentUser.email,assignedAt:ts()},{merge:true});
      setEditingRole(null);showLT("Permissions saved ✓");
    }catch(e){showLT("Error: "+e.message,"error");}
    setSaving(null);
  };

  const removeAccess=async(email)=>{
    if(!confirm(`Completely remove ${email}?\n\nThis will:\n• Delete their role and profile\n• Block them from logging in\n• Remove all their account data\n\nThis cannot be undone.`))return;
    try{
      const uid=profiles[email]?.uid;
      // 1. Delete role
      await C("roles").doc(email).delete().catch(()=>{});
      // 2. Delete userProfile
      if(uid)await C("userProfiles").doc(uid).delete().catch(()=>{});
      // 3. Delete any pending password reset
      await C("passwordResets").doc(email).delete().catch(()=>{});
      // 4. Add to bannedUsers so login is blocked at app level
      await C("bannedUsers").doc(email).set({email,removedBy:currentUser.email,removedAt:ts()});
      // Note: Firebase Auth account deletion requires Firebase Admin SDK (server-side).
      // The bannedUsers block prevents app access even if the Auth account still exists.
      showLT(`${email} removed ✓`);
    }catch(e){showLT("Error: "+e.message,"error");}
  };

  const sendReset=async(email)=>{
    setSavingPass(true);
    try{await auth.sendPasswordResetEmail(email);showLT(`Reset email sent to ${email} ✓`);setEditPassEmail(null);}
    catch(e){showLT("Error: "+e.message,"error");}
    setSavingPass(false);
  };

  const [newPassVal,setNewPassVal]=useState("");
  const [passError,setPassError]=useState("");

  const adminChangePass=async(email)=>{
    if(!newPassVal||newPassVal.length<6){setPassError("Password must be at least 6 characters");return;}
    setSavingPass(true);setPassError("");
    const isFakeEmail=email.endsWith("@gcc-hub.app")||email.endsWith("@gcc.app");
    try{
      if(!isFakeEmail){
        // Real email — use Firebase's own password reset email (most reliable)
        await auth.sendPasswordResetEmail(email);
        showLT("Password reset email sent to "+email+" ✓");
        setEditPassEmail(null);setNewPassVal("");
      }else{
        // Fake/internal email — store in Firestore, applied on next login
        await C("passwordResets").doc(email).set({
          newPassword:newPassVal,setBy:currentUser.email,setAt:today(),email,_createdAt:ts()
        });
        showLT("New password saved ✓ — will apply when user next logs in");
        setEditPassEmail(null);setNewPassVal("");
      }
    }catch(e){setPassError(e.message||"Error setting password");}
    setSavingPass(false);
  };

  // Merge roles + profiles into single list — roles is the master list
  const allEmails=[...new Set([...Object.keys(roles),...Object.keys(profiles)])].filter(Boolean).sort();

  return <div>
    <SectionHead title="User Management"/>

    {/* CREATE */}
    <div style={{background:"#0a1628",border:"1px solid #1e3a5f",borderRadius:"12px",padding:"18px",marginBottom:"20px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px"}}>
        <span style={{fontSize:"16px"}}>➕</span>
        <span style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",textTransform:"uppercase",letterSpacing:"0.09em"}}>Create New User Account</span>
      </div>
      {/* Role selector first so form adapts */}
      <Grid2>
        <Field label="Role *">
          <select style={sl} value={createRole} onChange={e=>setCreateRole(e.target.value)}>
            {["admin","issuer","qc","sales","store"].map(r=><option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
          </select>
        </Field>
        <Field label={createRole==="admin"?"Full Name (optional)":"Full Name / Username *"}>
          <input style={inp} value={createName} onChange={e=>setCreateName(e.target.value)}
            placeholder={createRole==="admin"?"e.g. Vijay Dagli":"e.g. Ramesh (used as login)"}/>
        </Field>
      </Grid2>
      {/* Email — required for admin, optional for others */}
      <div style={{background:createRole==="admin"?"#0a1010":"#0b1220",border:`1px solid ${createRole==="admin"?"#f59e0b30":"#1e293b"}`,borderRadius:"8px",padding:"12px 14px",marginBottom:"12px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:createRole==="admin"?"#f59e0b":"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"6px"}}>
          {createRole==="admin"?"🔑 Admin Email (required for password reset)":"📧 Email Address (optional — leave blank to auto-generate from name)"}
        </div>
        <input type="email" style={{...inp,borderColor:createRole==="admin"?"#f59e0b50":"#1e293b"}}
          value={createEmail} onChange={e=>setCreateEmail(e.target.value)}
          placeholder={createRole==="admin"?"admin@yourcompany.com (real email required)":"user@company.com (or leave blank)"}/>
        {createRole!=="admin"&&!createEmail&&createName&&<div style={{fontSize:"11px",color:"#475569",marginTop:"4px"}}>
          Login will be: <strong style={{color:"#64748b"}}>
            {createName.trim().toLowerCase().replace(/\s+/g,".").replace(/[^a-z0-9._]/g,"")}@gcc-hub.app
          </strong> — share this with the user
        </div>}
      </div>
      <Field label="Password *">
        <input type="password" style={inp} value={createPassword} onChange={e=>setCreatePassword(e.target.value)} placeholder="Min 6 characters"/>
      </Field>
      {createError&&<div style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"7px",padding:"9px 12px",color:"#fca5a5",fontSize:"12.5px",marginBottom:"10px"}}>❌ {createError}</div>}
      {createSuccess&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"9px 12px",color:"#86efac",fontSize:"12.5px",marginBottom:"10px"}}>{createSuccess}</div>}
      <div style={{display:"flex",justifyContent:"flex-end"}}>
        <Btn label={creating?"Creating…":"Create User Account"} onClick={createUser} disabled={creating} color="#3b82f6" small/>
      </div>
    </div>

    {/* USERS LIST */}
    <SectionHead title={`All Users (${allEmails.length})`}/>
    <InfoBox color="#f59e0b">All users with created accounts appear here. Use ✏️ to change a role, 🔑 to send a password reset email, ✕ to remove access.</InfoBox>

    {allEmails.length===0
      ?<div style={{textAlign:"center",padding:"32px",color:"#334155",fontSize:"13px"}}>No users yet. Create one above.</div>
      :allEmails.map(email=>{
        const isHardAdmin=ADMIN_EMAILS.includes(email);
        const currentRoles=isHardAdmin?["admin"]:(roles[email]||[]);
        const currentPerms=isHardAdmin?[]:userPerms[email]||[];
        const currentRole=primaryRole(currentRoles)||"—";
        const rc=ROLE_COLORS[currentRole]||"#475569";
        const name=profiles[email]?.displayName||"";
        const isEditing=editingRole===email;

        return <div key={email} style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:"10px",padding:"13px 16px",marginBottom:"8px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"10px",flexWrap:"wrap"}}>
            <div style={{flex:1}}>
              {name&&<div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9",marginBottom:"2px"}}>{name}</div>}
              <div style={{fontSize:name?"12px":"13.5px",fontWeight:name?"400":"600",color:name?"#64748b":"#e2e8f0",marginBottom:"4px"}}>{email}</div>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}}>
                {isHardAdmin
                  ?<Bdg label="🔑 Admin" color="#3b82f6" small/>
                  :currentPerms.length>0
                    ?<span style={{fontSize:"11px",color:"#3b82f6",background:"#0f1d35",border:"1px solid #2563eb40",borderRadius:"6px",padding:"2px 8px",fontWeight:"600"}}>🔐 Custom ({currentPerms.length} permissions)</span>
                    :currentRoles.length>0
                      ?currentRoles.map(r=><Bdg key={r} label={ROLE_LABELS[r]||r} color={ROLE_COLORS[r]||"#475569"} small/>)
                      :<span style={{fontSize:"11px",color:"#ef4444",fontStyle:"italic"}}>No permissions assigned</span>}
                {isHardAdmin&&<span style={{fontSize:"10px",color:"#475569",fontStyle:"italic"}}>· hardcoded admin</span>}
              </div>
            </div>
            {!isHardAdmin&&<div style={{display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap",flexShrink:0}}>
              <button onClick={()=>{setEditingRole(isEditing?null:email);setEditRoleVals([...currentRoles]);setEditPerms([...currentPerms]);}}
                style={{background:"#1e293b",border:"1px solid #334155",borderRadius:"6px",padding:"5px 10px",color:"#94a3b8",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>🔐 Permissions</button>
              <button onClick={()=>setEditPassEmail(editPassEmail===email?null:email)}
                style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"6px",padding:"5px 10px",color:"#93c5fd",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>🔑 Reset PW</button>
              <button onClick={()=>removeAccess(email)}
                style={{background:"none",border:"1px solid #7f1d1d",borderRadius:"6px",padding:"5px 10px",color:"#ef4444",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>✕ Remove</button>
            </div>}
          </div>

          {/* Permission matrix editor */}
          {isEditing&&!isHardAdmin&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b"}}>
            <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"10px"}}>🔐 Set Permissions for {name||email}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}}>
              {PERMISSION_GROUPS.map(group=><div key={group.key} style={{background:"#060d1a",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 12px"}}>
                <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",marginBottom:"7px"}}>{group.label}</div>
                {group.perms.map(p=>{
                  const checked=editPerms.includes(p.k);
                  return <label key={p.k} style={{display:"flex",alignItems:"center",gap:"7px",marginBottom:"4px",cursor:"pointer"}}>
                    <input type="checkbox" checked={checked} onChange={e=>setEditPerms(checked?editPerms.filter(x=>x!==p.k):[...editPerms,p.k])} style={{cursor:"pointer",width:"14px",height:"14px",accentColor:"#3b82f6"}}/>
                    <span style={{fontSize:"12px",color:checked?"#e2e8f0":"#475569"}}>{p.l}</span>
                  </label>;
                })}
              </div>)}
            </div>
            {/* Quick presets — prominent at top */}
            <div style={{marginBottom:"12px",background:"#0b1220",border:"1px solid #1e3a5f",borderRadius:"8px",padding:"10px 12px"}}>
              <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>⚡ Quick Presets — click to apply</div>
              <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
                {[
                  {label:"📦 Issuer",color:"#f59e0b",perms:["batches_view","batches_issue","bom_view","bom_edit","complaints_view_all","tasks_own","stock_view","stock_consume","settings_products","calc_tools","shade_approve"]},
                  {label:"🔬 QC",color:"#22c55e",perms:["batches_view","batches_qc","rd_view","rd_edit","calc_tools","shade_submit","complaints_view_all","complaints_respond","tasks_own","settings_advanced"]},
                  {label:"💼 Sales",color:"#a855f7",perms:["complaints_add","complaints_view_all","tasks_own","testimonials"]},
                  {label:"🏪 Store",color:"#38bdf8",perms:["stock_view","stock_consume","tasks_own"]},
                  {label:"🧪 QC + R&D",color:"#34d399",perms:["batches_view","batches_qc","rd_view","rd_edit","calc_tools","shade_submit","complaints_view_all","complaints_respond","tasks_own","settings_advanced"]},
                  {label:"Clear All",color:"#475569",perms:[]},
                ].map(preset=>{
                  const isActive=preset.perms.length>0&&preset.perms.every(p=>editPerms.includes(p))&&editPerms.length===preset.perms.length;
                  return <button key={preset.label} onClick={()=>setEditPerms(preset.perms)} style={{
                    background:isActive?`${preset.color}20`:"#060d1a",
                    border:`1px solid ${isActive?preset.color:"#334155"}`,
                    borderRadius:"8px",padding:"6px 14px",
                    color:isActive?preset.color:"#64748b",
                    cursor:"pointer",fontSize:"12px",fontWeight:"700",
                    transition:"all 0.15s"
                  }}>{preset.label}</button>;
                })}
              </div>
              {editPerms.length>0&&<div style={{fontSize:"11px",color:"#64748b",marginTop:"8px"}}>
                ✓ {editPerms.length} permission{editPerms.length!==1?"s":""} selected
              </div>}
            </div>
            <div style={{display:"flex",gap:"8px"}}>
              <Btn label={saving===email?"Saving…":"✓ Save Permissions"} onClick={()=>saveRoleEdit(email)} disabled={saving===email} color="#3b82f6" small/>
              <Btn label="Cancel" onClick={()=>setEditingRole(null)} outline color="#475569" small/>
            </div>
          </div>}

          {/* Password change */}
          {editPassEmail===email&&!isHardAdmin&&<div style={{marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #1e293b",background:"#0a1628",borderRadius:"8px",padding:"12px"}}>
            <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"8px"}}>🔑 Reset Password — {name||email}</div>
            {!email.endsWith("@gcc-hub.app")&&!email.endsWith("@gcc.app")
              ?<div style={{background:"#0f2d0f",border:"1px solid #166534",borderRadius:"6px",padding:"8px 12px",marginBottom:"10px",fontSize:"12px",color:"#86efac"}}>
                📧 Real email account — clicking "Send Reset Email" will send a password reset link directly to <strong>{email}</strong>. No password entry needed.
              </div>
              :<div style={{background:"#1a1400",border:"1px solid #f59e0b40",borderRadius:"6px",padding:"8px 12px",marginBottom:"10px",fontSize:"12px",color:"#fcd34d"}}>
                🔒 Internal account — enter a new password below. The user must log out and log back in with their <strong>current password once</strong>, then the system will automatically apply the new password.
              </div>}
            {(!email.endsWith("@gcc-hub.app")&&!email.endsWith("@gcc.app"))
              ?<div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
                <Btn label="Cancel" onClick={()=>{setEditPassEmail(null);setNewPassVal("");setPassError("");}} outline color="#475569" small/>
                <Btn label={savingPass?"Sending…":"📧 Send Reset Email"} onClick={()=>adminChangePass(email)} disabled={savingPass} color="#22c55e" small/>
              </div>
              :<>
                <Field label="New Password (min 6 chars)">
                  <input type="password" style={inp} value={newPassVal} onChange={e=>{setNewPassVal(e.target.value);setPassError("");}} placeholder="Enter new password"/>
                </Field>
                {passError&&<div style={{fontSize:"12px",color:"#ef4444",marginBottom:"6px"}}>{passError}</div>}
                <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"8px"}}>
                  <Btn label="Cancel" onClick={()=>{setEditPassEmail(null);setNewPassVal("");setPassError("");}} outline color="#475569" small/>
                  <Btn label={savingPass?"Saving…":"✓ Set Password"} onClick={()=>adminChangePass(email)} disabled={savingPass} color="#f59e0b" small/>
                </div>
              </>}
          </div>}
        </div>;
      })
    }

    {localToast&&<div style={{position:"fixed",bottom:"24px",left:"50%",transform:"translateX(-50%)",background:localToast.type==="error"?"#450a0a":"#052e16",border:`1px solid ${localToast.type==="error"?"#7f1d1d":"#166534"}`,borderRadius:"10px",padding:"10px 20px",color:"#f1f5f9",fontSize:"13px",fontWeight:"600",zIndex:4000,boxShadow:"0 8px 30px rgba(0,0,0,0.6)",animation:"fadeIn 0.2s ease",whiteSpace:"nowrap"}}>{localToast.msg}</div>}
  </div>;
}

// Searchable product selector component
const normalize = (s) => (s||"").toLowerCase().replace(/[\s\-_.()\/\\,&+*#@!?'"%]/g,"");

function ProductSearch({prods, value, onChange, disabled}){
  const [query,setQuery]=useState(value||"");
  const [open,setOpen]=useState(false);
  const ref=useRef(null);

  useEffect(()=>{ setQuery(value||""); },[value]);

  useEffect(()=>{
    const handler=(e)=>{ if(ref.current&&!ref.current.contains(e.target))setOpen(false); };
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[]);

  // Smart filter: ignores spaces, special chars, case
  const filtered=prods.filter(p=>{
    if(!query)return true;
    const nq=normalize(query);
    const nn=normalize(gpn(p));
    // Match if normalized name contains normalized query (contiguous or split)
    return nn.includes(nq)||
      // Also match initials: "IE" matches "Interior Emulsion"
      gpn(p).split(/\s+/).map(w=>w[0]||"").join("").toLowerCase().startsWith(nq);
  });

  const select=(p)=>{ setQuery(gpn(p)); setOpen(false); onChange(p); };
  const highlight=(text)=>{
    if(!query)return text;
    try{
      const re=new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`, "gi");
      const parts=text.split(re);
      return parts.map((part,i)=>re.test(part)?<mark key={i} style={{background:"#f59e0b30",color:"#f59e0b",borderRadius:"2px"}}>{part}</mark>:part);
    }catch{return text;}
  };

  return <div ref={ref} style={{position:"relative"}}>
    <div style={{position:"relative"}}>
      <input style={{...inp,paddingRight:"30px",cursor:disabled?"not-allowed":"text",opacity:disabled?0.5:1}}
        value={query} disabled={disabled}
        onChange={e=>{setQuery(e.target.value);setOpen(true);onChange(null);}}
        onFocus={()=>!disabled&&setOpen(true)}
        placeholder={disabled?"← select category first":"Type to search products…"}/>
      <span onClick={()=>!disabled&&setOpen(o=>!o)}
        style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",cursor:"pointer",color:"#475569",fontSize:"12px",pointerEvents:disabled?"none":"auto"}}>
        {open?"▲":"▼"}
      </span>
    </div>
    {open&&!disabled&&<div style={{position:"absolute",zIndex:500,top:"100%",left:0,right:0,background:"#0f172a",border:"1px solid #3b82f6",borderTop:"none",borderRadius:"0 0 8px 8px",maxHeight:"220px",overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}}>
      {query&&<div style={{padding:"6px 14px",fontSize:"11px",color:"#334155",borderBottom:"1px solid #1e293b",background:"#060d1a"}}>
        {filtered.length} result{filtered.length!==1?"s":""} — spaces & symbols ignored in search
      </div>}
      {filtered.length===0
        ?<div style={{padding:"12px 14px",fontSize:"12.5px",color:"#475569",fontStyle:"italic"}}>No products match — try fewer characters</div>
        :filtered.map(p=>{
          const n=gpn(p); const u=gpu(p);
          const isSelected=n===value;
          return <div key={n} onClick={()=>select(p)}
            style={{padding:"9px 14px",cursor:"pointer",fontSize:"13px",
              color:isSelected?"#22c55e":"#e2e8f0",
              background:isSelected?"#052e16":"transparent",
              borderTop:"1px solid #1e293b",
              display:"flex",justifyContent:"space-between",alignItems:"center"}}
            onMouseEnter={e=>e.currentTarget.style.background=isSelected?"#052e16":"#1e293b"}
            onMouseLeave={e=>e.currentTarget.style.background=isSelected?"#052e16":"transparent"}>
            <span>{highlight(n)}</span>
            <span style={{fontSize:"11px",color:isSelected?"#22c55e":"#475569",background:"#0b1220",padding:"1px 7px",borderRadius:"99px",border:"1px solid #1e293b",flexShrink:0,marginLeft:"8px"}}>{u}</span>
          </div>;
        })}
    </div>}
  </div>;
}

function CategoryProductSelect({category,setCategory,productName,setProductName,products,onUnitChange,catUnits}){
  const cats = Object.keys(products||DEFAULT_PRODUCTS).sort((a,b)=>a.localeCompare(b));
  const prods = [...((products||DEFAULT_PRODUCTS)[category] || [])].sort((a,b)=>gpn(a).localeCompare(gpn(b)));
  const units = catUnits||CATEGORY_UNITS;
  return <Grid2>
    <Field label="Category *">
      <select style={sl} value={category} onChange={e=>{
        setCategory(e.target.value);
        if(onUnitChange)onUnitChange(units[e.target.value]||CATEGORY_UNITS[e.target.value]||"kg");
      }}>
        <option value="">— Select Category —</option>
        {cats.map(c=><option key={c} value={c}>{c}</option>)}
      </select>
    </Field>
    <Field label="Product *">
      <ProductSearch prods={prods} value={productName} disabled={!category} onChange={p=>{
        if(p){
          setProductName(gpn(p));
          if(onUnitChange)onUnitChange(gpu(p));
        }else{
          setProductName("");
        }
      }}/>
    </Field>
  </Grid2>;
}

// OLD STOCK SECTION
// ══════════════════════════════════════════════════════════
function OldStockSection({role,user,showToast,products,catUnits}){
  const [stocks,setStocks]=useState([]);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [search,setSearch]=useState("");
  const [form,setForm]=useState({category:"",productName:"",qty:"",unit:"kg",batchRef:"",dateAdded:today(),addedBy:"",notes:""});

  useEffect(()=>{
    const unsub=C("old_stock").orderBy("_createdAt","desc").onSnapshot(s=>setStocks(s.docs.map(d=>({id:d.id,...d.data()}))),
      ()=>C("old_stock").onSnapshot(s=>setStocks(s.docs.map(d=>({id:d.id,...d.data()})))));
    return unsub;
  },[]);

  const saveStock=async()=>{
    if(!form.category||!form.productName||!form.qty)return showToast("Category, product and qty required","error");
    if(saving)return;setSaving(true);
    try{
      await C("old_stock").add({...form,addedBy:form.addedBy||user.email,status:"Available",_createdAt:ts()});
      setForm({category:"",productName:"",qty:"",unit:"kg",batchRef:"",dateAdded:today(),addedBy:"",notes:""});
      setShowForm(false);showToast("Old stock entry added ✓");
    }catch(e){showToast("Error saving","error");}
    setSaving(false);
  };

  const toggleStatus=async(id,current)=>{
    await C("old_stock").doc(id).update({status:current==="Available"?"Used":"Available"});
    showToast("Status updated ✓");
  };

  const deleteStock=async(id)=>{
    if(!confirm("Delete this entry?"))return;
    await C("old_stock").doc(id).delete();showToast("Deleted","error");
  };

  const filtered=stocks.filter(s=>{
    const q=search.toLowerCase();
    return !q||s.productName?.toLowerCase().includes(q)||s.category?.toLowerCase().includes(q)||s.batchRef?.toLowerCase().includes(q);
  });

  const available=filtered.filter(s=>s.status==="Available");
  const used=filtered.filter(s=>s.status!=="Available");
  const canEdit=role==="admin"||role==="issuer"||role==="qc";

  return <div style={{marginTop:"24px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"10px"}}>
      <div style={{display:"flex",gap:"8px",alignItems:"center",flex:1}}>
        <span style={{fontSize:"12px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.1em"}}>📦 Old / Rejected Material Register</span>
        <span style={{fontSize:"11px",background:"#f59e0b18",border:"1px solid #f59e0b30",borderRadius:"99px",padding:"2px 10px",color:"#f59e0b",fontWeight:"700"}}>{available.length} Available</span>
      </div>
      <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
        <input placeholder="Search stock…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:"180px",padding:"7px 10px",fontSize:"12px"}}/>
        {canEdit&&<Btn label="+ Add Old/Rejected Material" onClick={()=>setShowForm(v=>!v)} color="#f59e0b" small/>}
      </div>
    </div>

    {showForm&&<div style={{background:"#0a1010",border:"1px solid #f59e0b40",borderRadius:"10px",padding:"16px",marginBottom:"14px"}}>
      <div style={{fontSize:"12px",fontWeight:"700",color:"#f59e0b",marginBottom:"12px"}}>📦 Add Old/Rejected Material Entry</div>
      <CategoryProductSelect category={form.category} setCategory={cat=>{
        const unit=(catUnits?.[cat])||CATEGORY_UNITS[cat]||"kg";
        setForm({...form,category:cat,productName:"",unit});
      }} productName={form.productName} setProductName={pn=>setForm({...form,productName:pn})} products={products} catUnits={catUnits}/>
      <Grid2>
        <Field label="Quantity *"><input style={inp} value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} placeholder="e.g. 500"/></Field>
        <Field label="Unit">
          <div style={{...inp,background:"#060b16",cursor:"default",display:"flex",alignItems:"center",gap:"8px",color:form.unit?"#22c55e":"#475569",fontWeight:"600"}}>
            {form.unit||(form.category?(sysCatUnits?.[form.category]||CATEGORY_UNITS[form.category]||"kg"):"— select category first —")}
            {form.unit&&<span style={{fontSize:"10px",color:"#475569",fontWeight:"400"}}>(auto)</span>}
          </div>
        </Field>
        <Field label="Date Added"><input type="date" style={inp} value={form.dateAdded} onChange={e=>setForm({...form,dateAdded:e.target.value})}/></Field>
      </Grid2>
      <Grid2>
        <Field label="Original Batch Ref (if any)"><input style={inp} value={form.batchRef} onChange={e=>setForm({...form,batchRef:e.target.value})} placeholder="e.g. GCC-2501-005"/></Field>
        <Field label="Added By"><input style={inp} value={form.addedBy} onChange={e=>setForm({...form,addedBy:e.target.value})} placeholder={user.email}/></Field>
      </Grid2>
      <Field label="Notes"><textarea style={{...ta,minHeight:"50px"}} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Condition, reason for old stock..."/></Field>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowForm(false)} outline color="#475569" small/>
        <Btn label={saving?"Saving…":"Save Entry"} onClick={saveStock} disabled={saving} color="#f59e0b" small/>
      </div>
    </div>}

    {available.length===0&&used.length===0&&!showForm&&<div style={{textAlign:"center",padding:"24px",border:"1px dashed #1e293b",borderRadius:"8px",color:"#334155",fontSize:"13px"}}>No entries yet.{canEdit?" Click + Add Old/Rejected Material to log material.":""}</div>}

    {available.length>0&&<>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"8px"}}>Available ({available.length})</div>
      {available.map(s=><OldStockCard key={s.id} s={s} canEdit={canEdit} onToggle={toggleStatus} onDelete={deleteStock}/>)}
    </>}
    {used.length>0&&<>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"8px",marginTop:"12px"}}>Used / Consumed ({used.length})</div>
      {used.map(s=><OldStockCard key={s.id} s={s} canEdit={canEdit} onToggle={toggleStatus} onDelete={deleteStock}/>)}
    </>}
  </div>;
}

function OldStockCard({s,canEdit,onToggle,onDelete}){
  const isAvail=s.status==="Available";
  return <div style={{background:"#0f172a",border:`1px solid ${isAvail?"#f59e0b30":"#1e293b"}`,borderLeft:`3px solid ${isAvail?"#f59e0b":"#334155"}`,borderRadius:"10px",padding:"12px 16px",marginBottom:"8px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}}>
    <div style={{flex:1}}>
      <div style={{fontSize:"13.5px",fontWeight:"600",color:"#f1f5f9"}}>{s.productName}</div>
      <div style={{fontSize:"11.5px",color:"#64748b",marginTop:"2px"}}>{s.category} · <strong style={{color:isAvail?"#f59e0b":"#475569"}}>{s.qty} {s.unit}</strong>{s.batchRef&&` · Ref: ${s.batchRef}`}</div>
      {s.notes&&<div style={{fontSize:"11.5px",color:"#475569",marginTop:"2px",fontStyle:"italic"}}>{s.notes}</div>}
    </div>
    <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
      <span style={{fontSize:"11px",fontWeight:"700",color:isAvail?"#f59e0b":"#64748b",background:isAvail?"#f59e0b18":"#1e293b",padding:"2px 9px",borderRadius:"99px",border:`1px solid ${isAvail?"#f59e0b30":"#334155"}`}}>{s.status||"Available"}</span>
      {canEdit&&<button onClick={()=>onToggle(s.id,s.status||"Available")} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 8px",color:"#475569",fontSize:"11px",cursor:"pointer"}}>{isAvail?"Mark Used":"Restore"}</button>}
      {canEdit&&<button onClick={()=>onDelete(s.id)} style={{background:"none",border:"none",color:"#334155",fontSize:"14px",cursor:"pointer"}}>🗑</button>}
    </div>
  </div>;
}
