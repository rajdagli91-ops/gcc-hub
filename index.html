function Field({label,children}){

function Grid3({children,gap="10px"}){return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap}}>{children}</div>;}
function Grid4({children,gap="10px"}){return <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap}}>{children}</div>;}

function SectionHead({title,action}){

    <span style={{fontSize:"12px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.1em"}}>{title}</span>

function Bdg({label,color,small}){

function Modal({open,onClose,title,wide,children}){
  if(!open)return null;
  return <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,zIndex:1000,background:"rgba(4,8,16,0.92)",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"20px 16px",overflowY:"auto"}}>

        <span style={{fontSize:"16px",fontWeight:"700",color:"#f1f5f9",fontFamily:"'DM Serif Display',serif"}}>{title}</span>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#64748b",fontSize:"22px",lineHeight:1,padding:"0 4px"}}>×</button>
      </div>
      <div style={{padding:"20px 28px 28px",maxHeight:"82vh",overflowY:"auto"}}>{children}</div>
    </div>
  </div>;
}

function Btn({label,onClick,color="#3b82f6",disabled,small,outline}){
  const bg=outline?"none":color;
  const c=outline?color:"#fff";
  const br=outline?`1px solid ${color}`:"none";
  const p=small?"6px 14px":"9px 20px";
  const fs=small?"12px":"13px";
  return <button onClick={onClick} disabled={disabled} style={{background:bg,border:br,borderRadius:"8px",padding:p,color:c,fontWeight:"700",fontSize:fs,opacity:disabled?0.6:1,cursor:disabled?"not-allowed":"pointer",transition:"filter 0.15s",whiteSpace:"nowrap"}}
    onMouseEnter={e=>!disabled&&(e.currentTarget.style.filter="brightness(1.1)")}
    onMouseLeave={e=>e.currentTarget.style.filter="none"}>{label}</button>;
}

function InfoBox({children,color="#3b82f6"}){
  return <div style={{background:`${color}10`,border:`1px solid ${color}30`,borderRadius:"8px",padding:"10px 14px",fontSize:"12.5px",color:"#94a3b8",marginBottom:"14px",lineHeight:1.6}}>{children}</div>;
}

// StageBox must be defined at top level (not inside BatchWorkspace) to avoid React hook errors
function StageBox({icon,title,done,active,children,editForm,editLabel,onEdit,onSave,saveLabel,editStage,setEditStage,saving}){
  const [open,setOpen]=useState(!!active||!!done);
  return <div style={{border:`1px solid ${active?"#2563eb":done?"#166534":"#1e293b"}`,borderRadius:"10px",marginBottom:"10px",overflow:"hidden"}}>
    <div onClick={()=>setOpen(o=>!o)} style={{display:"flex",alignItems:"center",gap:"10px",padding:"12px 16px",cursor:"pointer",background:done?"#052e16":active?"#0a1626":"#0b1220"}}>
      <span style={{fontSize:"16px"}}>{done?"✅":active?"🔄":"⏸"}</span>
      <span style={{flex:1,fontSize:"13px",fontWeight:"700",color:done?"#22c55e":active?"#93c5fd":"#475569"}}>{icon} {title}</span>
      <span style={{color:"#334155",fontSize:"12px"}}>{open?"▲":"▼"}</span>
    </div>
    {open&&<div style={{padding:"14px 16px",borderTop:`1px solid ${active?"#1e3a5f":"#1e293b"}`,background:"#080d18"}}>
      {children}
      {active&&editForm&&editStage!==title&&onEdit&&<div style={{marginTop:"10px"}}><Btn label={editLabel||"Fill Details"} onClick={onEdit} color="#2563eb" small/></div>}
      {editStage===title&&editForm&&<div style={{marginTop:"12px",padding:"14px",background:"#060d1a",border:"1px solid #2563eb30",borderRadius:"8px"}}>
        {editForm}
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"12px"}}>
          <Btn label="Cancel" onClick={()=>setEditStage(null)} outline color="#475569" small/>
          <Btn label={saving?"Saving…":saveLabel||"Save"} onClick={onSave} disabled={saving} color="#2563eb" small/>
        </div>
      </div>}
    </div>}
  </div>;
}

// Financial year helper — April 1 = new FY. Returns 2-digit year ending (e.g. 26 for FY 2025-26)
const getFY=()=>{const d=new Date();const y=d.getFullYear()%100;return d.getMonth()>=3?y+1:y;};
const getFYLabel=(fy)=>`${String(fy-1).padStart(2,"0")}-${String(fy).padStart(2,"0")}`;

function BatchCard({b,onClick,onDelete,role}){
  const sc=BS_COL[b.status]||"#94a3b8";
  return <div onClick={onClick} onMouseEnter={e=>e.currentTarget.style.background="#0f1f35"} onMouseLeave={e=>e.currentTarget.style.background="#080e1a"}
    style={{background:"#080e1a",border:"1px solid #1e293b",borderLeft:`3px solid ${sc}`,borderRadius:"8px",padding:"8px 14px",cursor:"pointer",transition:"background 0.1s",display:"grid",gridTemplateColumns:"70px 1fr 1fr auto auto",gap:"8px",alignItems:"center",marginBottom:"4px"}}>
    <div style={{fontSize:"13px",fontWeight:"700",color:"#f1f5f9",fontFamily:"monospace"}}>{b.batchNo}</div>
    <div style={{minWidth:0}}>
      <div style={{fontSize:"12.5px",fontWeight:"600",color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{b.productName}{b.shade?` · ${b.shade}`:""}</div>
      <div style={{fontSize:"10.5px",color:"#475569"}}>{b.category||""}</div>
    </div>
    <div style={{fontSize:"11px",color:"#64748b"}}>{b.batchSize} {b.unit} · {b.dateIssued}</div>
    <Bdg label={b.status} color={sc}/>
    {(role==="admin")&&<button onClick={e=>{e.stopPropagation();onDelete(b.id)}} style={{background:"none",border:"none",color:"#334155",fontSize:"14px",padding:"2px 4px"}}>🗑</button>}
  </div>;
}

function BatchWorkspace({batch,role,onClose,showToast,qcParams,packSizes}){
  const [live,setLive]=useState(batch);
  const [editStage,setEditStage]=useState(null);
  const [saving,setSaving]=useState(false);
  const [availOldStock,setAvailOldStock]=useState([]);
  const [allOldStock,setAllOldStock]=useState([]);
  const [showOtherStock,setShowOtherStock]=useState(false);
  const [selectedOldStock,setSelectedOldStock]=useState([]);
  const [prodForm,setProdForm]=useState({startDate:today(),completionDate:"",actualQty:"",oldStockUsed:"",producedBy:"",notes:""});
  const [qcForm,setQcForm]=useState({other:"",result:"Pass",qcDate:today(),qcBy:"",remarks:""});
  const [packForm,setPackForm]=useState({sizes:[],packingDate:today(),packedBy:"",labelChecked:"Yes",remarks:""});

  // Auto-fill QC By and Packed By with current user's name on mount
  useEffect(()=>{
    const name=live.issuedBy||"";
    db.collection("userProfiles").where("email","==",role==="admin"||role==="qc"?batch.issuedBy||"":"").get().catch(()=>{});
    // Get current user profile for auto-fill
    const uid=window._auth?.currentUser?.uid;
    if(uid){
      db.collection("userProfiles").doc(uid).get().then(snap=>{
        const displayName=snap.exists?(snap.data().displayName||snap.data().email||""):"";
        if(displayName){
          setQcForm(f=>({...f,qcBy:f.qcBy||displayName}));
          setPackForm(f=>({...f,packedBy:f.packedBy||displayName}));
        }
      }).catch(()=>{});
    }
  },[]);

  const resolvedPackSizes=(()=>{
    let list;
    if(!packSizes)list=DEFAULT_PACK_SIZES_BY_CAT[live.category]||DEFAULT_PACK_SIZES;
    else if(Array.isArray(packSizes))list=packSizes;
    else list=packSizes[live.category]||packSizes._default||DEFAULT_PACK_SIZES;
    // Normalize: each item is either a string (old) or {size,qty} (new)
    return list.map(p=>gps(p));
  })();

  useEffect(()=>{
    // Pre-fill qty from the configured pack size qty
    const sizes=resolvedPackSizes.map(p=>{const ps=gps(p);return {size:ps.size,qty:ps.qty||"",pcs:""};});
    setPackForm(f=>({...f,sizes}));
  },[live.category,JSON.stringify(resolvedPackSizes)]);

  useEffect(()=>{
    const unsub=C("batches").doc(batch.id).onSnapshot(snap=>{if(snap.exists)setLive({id:snap.id,...snap.data()});});
    return unsub;
  },[batch.id]);

  useEffect(()=>{
    if(!live.productName)return;
    C("old_stock").where("status","==","Available").where("productName","==",live.productName).get()
      .then(snap=>setAvailOldStock(snap.docs.map(d=>({id:d.id,...d.data()}))))
      .catch(()=>C("old_stock").where("status","==","Available").get()
        .then(snap=>setAvailOldStock(snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.productName===live.productName))));
    C("old_stock").where("status","==","Available").get()
      .then(snap=>setAllOldStock(snap.docs.map(d=>({id:d.id,...d.data()})))).catch(()=>{});
  },[live.productName]);

  const save=async(data,nextStatus,extraOps)=>{
    setSaving(true);
    try{
      await C("batches").doc(batch.id).update({...data,status:nextStatus});
      // Auto-add to Old/Rejected Material when QC Fails
      if(nextStatus==="QC Fail"){
        const qty=live.production?.actualQty||live.batchSize;
        const remarks=data.qc?.remarks||"QC Failed";
        await C("old_stock").add({
          productName:live.productName,category:live.category||"",
          unit:live.unit,qty:String(qty),
          status:"Available",batchRef:live.batchNo,
          notes:`Auto-added: QC Fail · ${remarks}`,
          dateAdded:today(),addedBy:"System",_createdAt:ts()
        });
        showToast("QC Fail — batch auto-added to Old/Rejected Material ✓");
      }else{
        showToast("Saved ✓");
      }
      if(extraOps)await Promise.all(extraOps);
      setEditStage(null);
    }catch(e){showToast("Error saving","error");}
    setSaving(false);
  };

  const cat=live.category||"Other";
  const rawParams=(qcParams||DEFAULT_QC_PARAMS)[cat]||DEFAULT_QC_PARAMS["Other"]||[];
  const params=rawParams.map(gp);

  const checkParam=(p,val)=>{
    const v=parseFloat(val);
    if(isNaN(v)||(!p.min&&!p.max))return null;
    if(p.min&&v<parseFloat(p.min))return false;
    if(p.max&&v>parseFloat(p.max))return false;
    return true;
  };
  const autoResult=()=>{
    const withRange=params.filter(p=>p.min||p.max);
    if(!withRange.length)return null;
    return withRange.every(p=>{const r=checkParam(p,qcForm[p.name]);return r===null||r===true;})?"Pass":"Fail";
  };

  const sc=BS_COL[live.status]||"#94a3b8";
  const canQC=role==="admin"||role==="qc";
  const stageIndex=["Issued","In Production","QC Pending","QC Pass","Packed"].indexOf(live.status);
  const sb={editStage,setEditStage,saving};

  const PrintQCReport=()=><div className="print-report">
    <div style={{borderBottom:"2px solid #000",paddingBottom:"3px",marginBottom:"5px",display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
      <div>
        <div className="pr-co">Gujarat Colours &amp; Coatings Pvt Ltd</div>
        <div className="pr-title">QC Test Report | {live.batchNo} | {live.qc?.qcDate||today()}</div>
      </div>
      <div className={live.qc?.result==="Pass"?"pr-pass pr-result":"pr-fail pr-result"}>{live.qc?.result||"—"}</div>
    </div>
    <table className="pr-info" style={{marginBottom:"4px",width:"100%"}}><tbody>
      <tr><td>Product</td><td>{live.productName}</td><td>Category</td><td>{live.category||"—"}</td></tr>
      <tr><td>Batch Size</td><td>{live.batchSize} {live.unit}</td><td>Shade</td><td>{live.shade||"—"}</td></tr>
      <tr><td>QC By</td><td>{live.qc?.qcBy||"—"}</td><td>Date</td><td>{live.qc?.qcDate||"—"}</td></tr>
    </tbody></table>
    <div className="pr-section-title">Test Parameters</div>
    <table><thead><tr><th>Parameter</th><th>Unit</th><th>Min</th><th>Max</th><th>Value</th><th>Result</th></tr></thead>
    <tbody>
      {params.map(p=>{const val=live.qc?.[p.name]||"—";const r=live.qc?.[p.name]?checkParam(p,live.qc[p.name]):null;
        return <tr key={p.name}><td>{p.name}</td><td>{p.unit||"—"}</td><td>{p.min||"—"}</td><td>{p.max||"—"}</td>
          <td><strong>{val}</strong></td>
          <td className={r===true?"pr-pass":r===false?"pr-fail":""}>{r===true?"✓":r===false?"✗":"—"}</td></tr>;
      })}
    </tbody></table>
    {(live.qc?.remarks||live.qc?.other)&&<div style={{marginTop:"3px",fontSize:"8pt"}}>
      {live.qc?.remarks&&<span><strong>Remarks:</strong> {live.qc.remarks}&nbsp;&nbsp;</span>}
      {live.qc?.other&&<span><strong>Other:</strong> {live.qc.other}</span>}
    </div>}
    <div style={{marginTop:"6px",display:"flex",justifyContent:"space-between",borderTop:"1px solid #999",paddingTop:"3px",fontSize:"8pt"}}>
      <span>QC Sign: _______________________</span>
      <span>Date: {live.qc?.qcDate||"____________"}</span>
    </div>
  </div>;

  const PrintPackReport=()=><div className="print-report" style={{borderLeft:"1px dashed #aaa"}}>
    <div style={{borderBottom:"2px solid #000",paddingBottom:"3px",marginBottom:"5px",display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
      <div>
        <div className="pr-co">Gujarat Colours &amp; Coatings Pvt Ltd</div>
        <div className="pr-title">Packing Report | {live.batchNo} | {live.packing?.packingDate||today()}</div>
      </div>
      <div style={{fontSize:"9pt",fontWeight:"bold"}}>{live.packing?.totalQty} {live.unit}</div>
    </div>
    <table className="pr-info" style={{marginBottom:"4px",width:"100%"}}><tbody>
      <tr><td>Product</td><td>{live.productName}</td><td>Shade</td><td>{live.shade||"—"}</td></tr>
      <tr><td>Batch Size</td><td>{live.batchSize} {live.unit}</td><td>Label</td><td>{live.packing?.labelChecked||"—"}</td></tr>
      <tr><td>Packed By</td><td>{live.packing?.packedBy||"—"}</td><td>Date</td><td>{live.packing?.packingDate||"—"}</td></tr>
    </tbody></table>
    <div className="pr-section-title">Packing Details</div>
    <table><thead><tr><th>Pack Size</th><th>Packs</th><th>Qty/Pack</th><th>Total</th></tr></thead>
    <tbody>
      {(live.packing?.sizes||[]).filter(s=>parseInt(s.pcs)>0).map(s=>{const lt=((parseFloat(s.qty)||0)*(parseInt(s.pcs)||0));
        return <tr key={s.size}><td>{s.size}</td><td><strong>{s.pcs}</strong></td><td>{s.qty} {live.unit}</td><td><strong>{lt.toFixed(1)} {live.unit}</strong></td></tr>;
      })}
      <tr><td colSpan="3" style={{textAlign:"right",fontWeight:"bold"}}>Total Packed</td><td style={{fontWeight:"bold"}}>{live.packing?.totalQty} {live.unit}</td></tr>
    </tbody></table>
    {live.packing?.remarks&&<div style={{marginTop:"3px",fontSize:"8pt"}}><strong>Remarks:</strong> {live.packing.remarks}</div>}
    <div style={{marginTop:"6px",display:"flex",justifyContent:"space-between",borderTop:"1px solid #999",paddingTop:"3px",fontSize:"8pt"}}>
      <span>Packed By: _______________________</span>
      <span>QC Sign: _______________________</span>
    </div>
  </div>;

  return <div>
    <PrintQCReport/><PrintPackReport/>
    <div className="no-print">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px",gap:"8px"}}>
      <div>
        <div style={{fontSize:"22px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>{live.batchNo}</div>
        <div style={{fontSize:"12px",color:"#64748b",marginTop:"3px"}}>{live.category?`${live.category} · `:""}{live.productName}{live.shade?` — ${live.shade}`:""} · {live.batchSize} {live.unit}</div>
      </div>
      <Bdg label={live.status} color={sc}/>
    </div>

    <StageBox {...sb} icon="📋" title="Issue Details" done={true} active={false}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
        {[["Product",live.productName],["Shade/Color",live.shade||"—"],["Batch Size",`${live.batchSize} ${live.unit}`],["Date Issued",live.dateIssued],["Issued By",live.issuedBy],["Old/Rejected Used",live.oldStockUsed||"—"]].map(([l,v])=><div key={l} style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"8px 12px"}}>
          <div style={{fontSize:"10px",color:"#334155",fontWeight:"600",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"2px"}}>{l}</div>
          <div style={{fontSize:"13px",color:"#94a3b8",fontWeight:"500"}}>{v||"—"}</div>
        </div>)}
      </div>
    </StageBox>

    <StageBox {...sb} icon="🏭" title="Production Details" done={stageIndex>=1&&!!live.production?.completionDate} active={live.status==="Issued"||live.status==="In Production"}
      editLabel="Enter Production Details" onEdit={canQC?()=>setEditStage("Production Details"):null}
      editForm={<div>
        <Grid2>
          <Field label="Start Date"><input type="date" style={inp} value={prodForm.startDate} onChange={e=>setProdForm({...prodForm,startDate:e.target.value})}/></Field>
          <Field label="Completion Date"><input type="date" style={inp} value={prodForm.completionDate} onChange={e=>setProdForm({...prodForm,completionDate:e.target.value})}/></Field>
        </Grid2>
        <Grid2>
          <Field label={`Actual Qty (${live.unit})`}><input style={inp} value={prodForm.actualQty} onChange={e=>setProdForm({...prodForm,actualQty:e.target.value})}/></Field>
          <Field label="Produced By"><input style={inp} value={prodForm.producedBy} onChange={e=>setProdForm({...prodForm,producedBy:e.target.value})}/></Field>
        </Grid2>

        {/* ── SAME PRODUCT OLD/REJECTED STOCK ── */}
        <div style={{marginBottom:"14px"}}>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>📦 Old/Rejected Material Used — Same Product</div>
          {availOldStock.length===0
            ?<div style={{fontSize:"12px",color:"#334155",fontStyle:"italic",padding:"6px 0"}}>No available stock for {live.productName||"this product"}.</div>
            :<div style={{border:"1px solid #f59e0b30",borderRadius:"8px",background:"#0a1010",padding:"10px 12px",display:"flex",flexDirection:"column",gap:"8px"}}>
              {availOldStock.map(s=>{
                const sel=selectedOldStock.find(x=>x.id===s.id);
                const isSel=!!sel;
                return <div key={s.id} style={{padding:"8px",borderRadius:"6px",background:isSel?"#422006":"transparent",border:`1px solid ${isSel?"#f59e0b30":"transparent"}`}}>
                  <label style={{display:"flex",alignItems:"flex-start",gap:"10px",cursor:"pointer"}}>
                    <input type="checkbox" checked={isSel} onChange={e=>{
                      if(e.target.checked)setSelectedOldStock(p=>[...p,{...s,usedQty:s.qty}]);
                      else setSelectedOldStock(p=>p.filter(x=>x.id!==s.id));
                    }} style={{width:"16px",height:"16px",cursor:"pointer",marginTop:"2px",flexShrink:0}}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:"13px",fontWeight:"600",color:"#f1f5f9"}}>{s.productName}</div>
                      <div style={{fontSize:"11px",color:"#64748b"}}>Available: {s.qty} {s.unit}{s.batchRef?` · Ref: ${s.batchRef}`:""}{s.notes?` · ${s.notes}`:""}</div>
                    </div>
                  </label>
                  {isSel&&<div style={{marginTop:"8px",marginLeft:"26px",display:"flex",alignItems:"center",gap:"8px"}}>
                    <span style={{fontSize:"11px",color:"#f59e0b",fontWeight:"600",flexShrink:0}}>Qty to use:</span>
                    <input type="number" min="0.1" max={parseFloat(s.qty)||9999} step="0.1"
                      style={{...sml,width:"100px",borderColor:"#f59e0b50"}}
                      value={sel.usedQty}
                      onChange={e=>setSelectedOldStock(p=>p.map(x=>x.id===s.id?{...x,usedQty:e.target.value}:x))}/>
                    <span style={{fontSize:"11px",color:"#64748b"}}>{s.unit} (max {s.qty})</span>
                    {parseFloat(sel.usedQty)<parseFloat(s.qty)&&<span style={{fontSize:"10px",color:"#22c55e",background:"#052e16",padding:"2px 7px",borderRadius:"99px",border:"1px solid #166534"}}>Partial</span>}
                  </div>}
                </div>;
              })}
            </div>
          }
        </div>

        {/* ── OTHER MATERIAL (different products) ── */}
        <div style={{marginBottom:"14px"}}>
          <button onClick={()=>setShowOtherStock(v=>!v)} style={{background:"none",border:"1px dashed #334155",borderRadius:"7px",padding:"7px 14px",color:"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600",width:"100%",textAlign:"left"}}>
            {showOtherStock?"▲ Hide":"▼ + Add Material from Other Products (optional)"}
          </button>
          {showOtherStock&&<div style={{border:"1px solid #334155",borderRadius:"8px",background:"#0a1010",padding:"10px 12px",marginTop:"8px",display:"flex",flexDirection:"column",gap:"8px",maxHeight:"240px",overflowY:"auto"}}>
            {allOldStock.filter(s=>s.productName!==live.productName).length===0
              ?<div style={{fontSize:"12px",color:"#334155",fontStyle:"italic"}}>No other old/rejected material available.</div>
              :allOldStock.filter(s=>s.productName!==live.productName).map(s=>{
                const sel=selectedOldStock.find(x=>x.id===s.id);
                const isSel=!!sel;
                return <div key={s.id} style={{padding:"8px",borderRadius:"6px",background:isSel?"#0c2340":"transparent",border:`1px solid ${isSel?"#2563eb30":"transparent"}`}}>
                  <label style={{display:"flex",alignItems:"flex-start",gap:"10px",cursor:"pointer"}}>
                    <input type="checkbox" checked={isSel} onChange={e=>{
                      if(e.target.checked)setSelectedOldStock(p=>[...p,{...s,usedQty:s.qty}]);
                      else setSelectedOldStock(p=>p.filter(x=>x.id!==s.id));
                    }} style={{width:"16px",height:"16px",cursor:"pointer",marginTop:"2px",flexShrink:0}}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:"13px",fontWeight:"600",color:"#e2e8f0"}}>{s.productName}</div>
                      <div style={{fontSize:"11px",color:"#64748b"}}>{s.category} · Available: {s.qty} {s.unit}{s.batchRef?` · Ref: ${s.batchRef}`:""}</div>
                    </div>
                  </label>
                  {isSel&&<div style={{marginTop:"8px",marginLeft:"26px",display:"flex",alignItems:"center",gap:"8px"}}>
                    <span style={{fontSize:"11px",color:"#93c5fd",fontWeight:"600",flexShrink:0}}>Qty to use:</span>
                    <input type="number" min="0.1" max={parseFloat(s.qty)||9999} step="0.1"
                      style={{...sml,width:"100px",borderColor:"#2563eb50"}}
                      value={sel.usedQty}
                      onChange={e=>setSelectedOldStock(p=>p.map(x=>x.id===s.id?{...x,usedQty:e.target.value}:x))}/>
                    <span style={{fontSize:"11px",color:"#64748b"}}>{s.unit}</span>
                  </div>}
                </div>;
              })
            }
          </div>}
        </div>

        {selectedOldStock.length>0&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"8px 12px",marginBottom:"10px",fontSize:"12px",color:"#22c55e"}}>
          ✓ {selectedOldStock.length} item{selectedOldStock.length!==1?"s":""} selected · Total: {selectedOldStock.map(x=>`${x.usedQty} ${x.unit} ${x.productName}`).join(", ")}
        </div>}

        <Field label="Production Notes"><textarea style={{...ta,minHeight:"56px"}} value={prodForm.notes} onChange={e=>setProdForm({...prodForm,notes:e.target.value})} placeholder="Any production notes..."/></Field>
      </div>}
      saveLabel="Save & Mark QC Pending"
      onSave={()=>{
        const desc=selectedOldStock.length>0?selectedOldStock.map(s=>`${s.usedQty||s.qty} ${s.unit} ${s.productName}`).join(", "):prodForm.notes;
        // For partial use: update qty remaining or mark as Used
        const markUsed=selectedOldStock.map(s=>{
          const used=parseFloat(s.usedQty)||parseFloat(s.qty);
          const avail=parseFloat(s.qty)||0;
          const remaining=avail-used;
          if(remaining<=0.01){
            return C("old_stock").doc(s.id).update({status:"Used",usedInBatch:live.batchNo,usedDate:today()});
          }else{
            return C("old_stock").doc(s.id).update({qty:remaining.toFixed(2),usedInBatch:live.batchNo,lastUsedDate:today(),notes:`${s.notes||""} | Partial: ${used} used in ${live.batchNo}`.trim()});
          }
        });
        save({production:{...prodForm,oldStockUsed:desc,selectedOldStockIds:selectedOldStock.map(s=>s.id)}},"QC Pending",markUsed);
      }}>
      {live.production?<div style={{fontSize:"13px",color:"#94a3b8"}}>
        Produced: <strong style={{color:"#e2e8f0"}}>{live.production.actualQty} {live.unit}</strong> · Completed: {live.production.completionDate} · By: {live.production.producedBy}
        {live.production.oldStockUsed&&<div style={{fontSize:"12px",color:"#f59e0b",marginTop:"3px"}}>📦 Old stock used: {live.production.oldStockUsed}</div>}
        {live.production.notes&&<div style={{marginTop:"4px",fontStyle:"italic",fontSize:"12px"}}>{live.production.notes}</div>}
      </div>:<div style={{fontSize:"12px",color:"#334155",fontStyle:"italic"}}>No production details yet.</div>}
    </StageBox>

    <StageBox {...sb} icon="🔬" title="QC Testing" done={live.status==="QC Pass"||live.status==="QC Fail"||live.status==="Packed"} active={live.status==="QC Pending"}
      editLabel="Enter QC Results" onEdit={canQC&&live.status==="QC Pending"?()=>setEditStage("QC Testing"):null}
      editForm={<div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px"}}>
          {params.map(p=>{
            const val=qcForm[p.name]||"";
            const r=val?checkParam(p,val):null;
            const bc=r===true?"#22c55e":r===false?"#ef4444":"#1e293b";
            const hint=(p.min||p.max)?`${p.min||"—"} – ${p.max||"—"}`:"";
            return <div key={p.name} style={{marginBottom:"4px"}}>
              <label style={{display:"block",fontSize:"11px",fontWeight:"600",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"4px"}}>
                {p.name}
                {p.unit&&<span style={{fontSize:"9px",fontWeight:"700",color:"#a855f7",background:"#a855f718",padding:"1px 6px",borderRadius:"4px",border:"1px solid #a855f730",marginLeft:"5px",textTransform:"none",letterSpacing:0}}>{p.unit}</span>}
                {hint&&<span style={{fontSize:"9px",color:"#475569",fontWeight:"400",marginLeft:"5px",textTransform:"none",letterSpacing:0}}>({hint})</span>}
              </label>
              <div style={{position:"relative"}}>
                <input style={{...inp,borderColor:bc,paddingRight:r!==null?"32px":p.unit?"50px":"12px"}} value={val} onChange={e=>setQcForm({...qcForm,[p.name]:e.target.value})} placeholder={p.unit?`Enter ${p.unit}`:"Enter value"}/>
                {p.unit&&!r&&<span style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",fontSize:"11px",color:"#a855f7",pointerEvents:"none"}}>{p.unit}</span>}
                {r!==null&&<span style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",fontSize:"14px",pointerEvents:"none"}}>{r?"✅":"❌"}</span>}
              </div>
            </div>;
          })}
        </div>
        {autoResult()!==null&&<div style={{background:autoResult()==="Pass"?"#052e16":"#450a0a",border:`1px solid ${autoResult()==="Pass"?"#166534":"#991b1b"}`,borderRadius:"8px",padding:"8px 12px",marginTop:"8px",marginBottom:"10px",fontSize:"12.5px",fontWeight:"600",color:autoResult()==="Pass"?"#22c55e":"#ef4444"}}>
          🔬 Auto result: <strong>{autoResult()}</strong> — you can override below
        </div>}
        <Field label="Other Parameters / Notes"><textarea style={{...ta,minHeight:"50px"}} value={qcForm.other||""} onChange={e=>setQcForm({...qcForm,other:e.target.value})} placeholder="Any additional observations..."/></Field>
        <Grid3>
          <Field label="Overall Result"><select style={{...sl,borderColor:qcForm.result==="Pass"?"#22c55e":"#ef4444"}} value={qcForm.result} onChange={e=>setQcForm({...qcForm,result:e.target.value})}><option>Pass</option><option>Fail</option></select></Field>
          <Field label="QC Date"><input type="date" style={inp} value={qcForm.qcDate} onChange={e=>setQcForm({...qcForm,qcDate:e.target.value})}/></Field>
          <Field label="QC By"><input style={inp} value={qcForm.qcBy} onChange={e=>setQcForm({...qcForm,qcBy:e.target.value})}/></Field>
        </Grid3>
        <Field label="Remarks"><textarea style={{...ta,minHeight:"50px"}} value={qcForm.remarks||""} onChange={e=>setQcForm({...qcForm,remarks:e.target.value})}/></Field>
      </div>}
      saveLabel={qcForm.result==="Pass"?"Save — QC Pass ✓":"Save — QC Fail ✗"}
      onSave={()=>save({qc:qcForm},qcForm.result==="Pass"?"QC Pass":"QC Fail")}>
      {live.qc?<div>
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"8px"}}>
          {params.map(p=>{const val=live.qc[p.name];if(!val)return null;const r=checkParam(p,val);
            return <span key={p.name} style={{fontSize:"11.5px",background:"#0b1220",border:`1px solid ${r===true?"#166534":r===false?"#991b1b":"#1e293b"}`,borderRadius:"6px",padding:"3px 9px",color:"#94a3b8"}}>
              {p.name}: <strong style={{color:"#e2e8f0"}}>{val}</strong>{r!==null&&<span style={{marginLeft:"4px"}}>{r?"✅":"❌"}</span>}
            </span>;
          })}
        </div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
          <Bdg label={`Result: ${live.qc.result}`} color={live.qc.result==="Pass"?"#22c55e":"#ef4444"}/>
          <span style={{fontSize:"11.5px",color:"#475569"}}>By {live.qc.qcBy} on {live.qc.qcDate}</span>
          <Btn label="🖨 Print QC Report" onClick={()=>window.print()} outline color="#a855f7" small/>
        </div>
        {live.qc.remarks&&<div style={{marginTop:"5px",fontSize:"12px",color:"#475569",fontStyle:"italic"}}>{live.qc.remarks}</div>}
      </div>:<div style={{fontSize:"12px",color:"#334155",fontStyle:"italic"}}>QC not started yet.</div>}
    </StageBox>

    <StageBox {...sb} icon="📦" title="Packing Details" done={live.status==="Packed"} active={live.status==="QC Pass"}
      editLabel="Enter Packing Details" onEdit={canQC&&live.status==="QC Pass"?()=>setEditStage("Packing Details"):null}
      editForm={(()=>{
        const updSz=(idx,fld,v)=>{const sizes=packForm.sizes.map((s,i)=>i===idx?{...s,[fld]:v}:s);setPackForm({...packForm,sizes});};
        const totalQty=packForm.sizes.reduce((sum,s)=>sum+((parseFloat(s.qty)||0)*(parseInt(s.pcs)||0)),0);
        return <div>
          {!packForm.sizes.some(s=>s.qty&&s.qty!=="0")&&<div style={{background:"#422006",border:"1px solid #f59e0b40",borderRadius:"8px",padding:"9px 14px",marginBottom:"10px",fontSize:"12px",color:"#f59e0b"}}>
            ⚙️ Qty/Pack not configured yet. Go to <strong>Settings → 📦 Pack Sizes</strong> to set it once — it will auto-fill here every time.
          </div>}
          <div style={{marginBottom:"14px"}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>Pack Sizes & Quantities</div>
            <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden"}}>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1.2fr 1.5fr",background:"#0b1220",padding:"8px 12px",gap:"8px"}}>
                {["Pack Size","Qty/Pack","No. of Packs","Total"].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
              </div>
              {packForm.sizes.map((row,i)=>{const lt=((parseFloat(row.qty)||0)*(parseInt(row.pcs)||0));
                const hasQty=row.qty&&row.qty!=="0"&&row.qty!=="";
                return <div key={row.size} style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1.2fr 1.5fr",padding:"7px 12px",gap:"8px",borderTop:"1px solid #1e293b",background:i%2===0?"#080d18":"#0b1220",alignItems:"center"}}>
                  <div style={{fontSize:"12.5px",color:"#e2e8f0",fontWeight:"500"}}>{row.size}</div>
                  {/* Qty/Pack: locked green if pre-configured, editable orange if not */}
                  {hasQty
                    ?<div title="Pre-configured in Settings" style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",padding:"6px 8px",color:"#22c55e",fontWeight:"700",textAlign:"center",fontSize:"13px",cursor:"default"}}>
                      {row.qty}
                    </div>
                    :<input style={{...sml,textAlign:"center",borderColor:"#f59e0b50",color:"#f59e0b"}} type="number" min="0" step="0.1"
                      value={row.qty} onChange={e=>updSz(i,"qty",e.target.value)} placeholder="qty"/>
                  }
                  <input style={{...sml,textAlign:"center"}} type="number" min="0" value={row.pcs} onChange={e=>updSz(i,"pcs",e.target.value)} placeholder="0"/>
                  <div style={{fontSize:"12px",color:lt>0?"#22c55e":"#334155",fontWeight:"600"}}>{lt>0?`${lt.toFixed(1)} ${live.unit||""}`:"-"}</div>
                </div>;
              })}
              <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1.2fr 1.5fr",padding:"8px 12px",gap:"8px",borderTop:"2px solid #1e3a5f",background:"#060d1a"}}>
                <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",gridColumn:"1/4"}}>Total Packed</div>
                <div style={{fontSize:"13px",fontWeight:"700",color:"#22c55e"}}>{totalQty>0?`${totalQty.toFixed(1)} ${live.unit||""}`:"-"}</div>
              </div>
            </div>
          </div>
          <Grid3>
            <Field label="Packing Date"><input type="date" style={inp} value={packForm.packingDate} onChange={e=>setPackForm({...packForm,packingDate:e.target.value})}/></Field>
            <Field label="Packed By"><input style={inp} value={packForm.packedBy} onChange={e=>setPackForm({...packForm,packedBy:e.target.value})} placeholder="Packer name"/></Field>
            <Field label="Label Checked"><select style={sl} value={packForm.labelChecked} onChange={e=>setPackForm({...packForm,labelChecked:e.target.value})}><option>Yes</option><option>No</option><option>N/A</option></select></Field>
          </Grid3>
          <Field label="Remarks"><input style={inp} value={packForm.remarks} onChange={e=>setPackForm({...packForm,remarks:e.target.value})} placeholder="Any notes on packing"/></Field>
        </div>;
      })()}
      saveLabel="Save & Mark Packed"
      onSave={()=>{const totalQty=packForm.sizes.reduce((sum,s)=>sum+((parseFloat(s.qty)||0)*(parseInt(s.pcs)||0)),0);save({packing:{...packForm,totalQty:totalQty.toFixed(1)}},"Packed");}}>
      {live.packing?<div>
        {live.packing.sizes?.filter(s=>parseInt(s.pcs)>0).length>0&&<div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"8px"}}>
          {live.packing.sizes.filter(s=>parseInt(s.pcs)>0).map(s=><span key={s.size} style={{fontSize:"11.5px",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 9px",color:"#94a3b8"}}>{s.size}: <strong style={{color:"#e2e8f0"}}>{s.pcs} packs</strong></span>)}
        </div>}
        <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
          {live.packing.totalQty&&<span style={{fontSize:"12px",fontWeight:"700",color:"#22c55e"}}>Total: {live.packing.totalQty} {live.unit}</span>}
          <span style={{fontSize:"11.5px",color:"#475569"}}>Packed: {live.packing.packingDate} · By: {live.packing.packedBy}</span>
          {live.packing.labelChecked&&<Bdg label={`Label: ${live.packing.labelChecked}`} color={live.packing.labelChecked==="Yes"?"#22c55e":"#f59e0b"} small/>}
          <Btn label="🖨 Print Packing Report" onClick={()=>window.print()} outline color="#38bdf8" small/>
        </div>
        {live.packing.remarks&&<div style={{marginTop:"5px",fontSize:"12px",color:"#475569",fontStyle:"italic"}}>{live.packing.remarks}</div>}
      </div>:<div style={{fontSize:"12px",color:"#334155",fontStyle:"italic"}}>Packing not started yet.</div>}
    </StageBox>

    </div>
  </div>;
}

function ComplaintCard({c,onClick,onDelete,role}){
  const sc=CS_COL[c.status]||"#94a3b8";
  return <div onClick={onClick} onMouseEnter={e=>e.currentTarget.style.background="#0f1f35"} onMouseLeave={e=>e.currentTarget.style.background="#0f172a"}
    style={{background:"#0f172a",border:"1px solid #1e293b",borderLeft:`3px solid ${sc}`,borderRadius:"12px",padding:"15px 20px",cursor:"pointer",transition:"background 0.15s",boxShadow:"0 2px 10px rgba(0,0,0,0.3)",marginBottom:"10px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}>
      <div style={{flex:1}}>
        <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9",marginBottom:"3px",fontFamily:"'DM Serif Display',serif"}}>{c.customerName}</div>
        <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"6px"}}>{c.productName} · Batch: {c.batchNo||"—"} · {c.monthYear||"—"}</div>
        <div style={{fontSize:"12.5px",color:"#94a3b8",lineHeight:1.5,maxHeight:"36px",overflow:"hidden"}}>{c.complaint}</div>
      </div>
      <div style={{display:"flex",gap:"6px",alignItems:"flex-start",flexShrink:0,flexDirection:"column",alignItems:"flex-end"}}>
        <Bdg label={c.status} color={sc}/>
        {(role==="admin")&&<button onClick={e=>{e.stopPropagation();onDelete(c.id)}} style={{background:"none",border:"none",color:"#334155",fontSize:"14px",padding:"2px"}}>🗑</button>}
      </div>
    </div>
    <div style={{display:"flex",gap:"10px",flexWrap:"wrap",marginTop:"4px"}}>
      {c.invoiceNo&&<span style={{fontSize:"11px",color:"#475569"}}>🧾 {c.invoiceNo}</span>}
      {c.addedBy&&<span style={{fontSize:"11px",color:"#475569"}}>👤 {c.addedBy}</span>}
    </div>
  </div>;
}

function ComplaintWorkspace({complaint,role,showToast}){
  const [live,setLive]=useState(complaint);
  const [editStage,setEditStage]=useState(null);
  const [saving,setSaving]=useState(false);
  const [qcResp,setQcResp]=useState({findings:"",action:"",responseDate:today(),respondedBy:""});
  const [salesResp,setSalesResp]=useState({feedback:"",resolved:"Yes",responseDate:today(),respondedBy:""});
  const [newStatus,setNewStatus]=useState(complaint.status);

  useEffect(()=>{
    const unsub=C("complaints").doc(complaint.id).onSnapshot(snap=>{
      if(snap.exists)setLive({id:snap.id,...snap.data()});
    });
    return unsub;
  },[complaint.id]);

  const saveQC=async()=>{
    setSaving(true);
    try{
      await C("complaints").doc(complaint.id).update({qcResponse:qcResp,status:"QC Responded"});
      setEditStage(null);showToast("QC response saved ✓");
    }catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const saveSales=async()=>{
    setSaving(true);
    try{
      const ns=salesResp.resolved==="Yes"?"Resolved":"Closed";
      await C("complaints").doc(complaint.id).update({salesResponse:salesResp,status:ns});
      setEditStage(null);showToast("Response saved ✓");
    }catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const saveStatus=async()=>{
    setSaving(true);
    try{
      await C("complaints").doc(complaint.id).update({status:newStatus});
      showToast("Status updated ✓");
    }catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const sc=CS_COL[live.status]||"#94a3b8";
  const canQC=role==="admin"||role==="qc";
  const canSales=role==="admin"||role==="sales";
  const qcHasResponded=!!live.qcResponse?.findings||!!live.qcResponse?.action;

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px",gap:"8px"}}>
      <div>
        <div style={{fontSize:"20px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>{live.customerName}</div>
        <div style={{fontSize:"12px",color:"#64748b",marginTop:"3px"}}>{live.productName} · Added by {live.addedBy}</div>
      </div>
      <Bdg label={live.status} color={sc}/>
    </div>

    {/* Complaint details */}
    <div style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:"3px solid #ef4444",borderRadius:"8px",padding:"14px 16px",marginBottom:"14px"}}>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"8px"}}>📋 Complaint Details</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"10px"}}>
        {[["Product",live.productName],["Batch No",live.batchNo||"—"],["Month/Year",live.monthYear||"—"],["Invoice No",live.invoiceNo||"—"],["Material Available",live.materialAvailable||"—"],["Complaint By",live.addedBy]].map(([l,v])=><div key={l} style={{background:"#060b16",border:"1px solid #1e293b",borderRadius:"6px",padding:"7px 10px"}}>
          <div style={{fontSize:"10px",color:"#334155",fontWeight:"600",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"2px"}}>{l}</div>
          <div style={{fontSize:"12.5px",color:"#94a3b8"}}>{v}</div>
        </div>)}
      </div>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"5px"}}>Complaint Description</div>
      <div style={{fontSize:"13.5px",color:"#cbd5e1",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{live.complaint}</div>
    </div>

    {/* QC Response */}
    <div style={{border:`1px solid ${qcHasResponded?"#166534":canQC?"#2563eb30":"#1e293b"}`,borderRadius:"10px",marginBottom:"12px",overflow:"hidden"}}>
      <div style={{padding:"12px 16px",background:qcHasResponded?"#052e16":canQC?"#060d1a":"#0b1220",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:"13px",fontWeight:"700",color:qcHasResponded?"#22c55e":canQC?"#93c5fd":"#475569"}}>🔬 QC Response</span>
        {canQC&&!qcHasResponded&&editStage!=="qc"&&<Btn label="Add QC Response" onClick={()=>setEditStage("qc")} color="#2563eb" small/>}
      </div>
      {qcHasResponded?<div style={{padding:"14px 16px",background:"#080d18"}}>
        {[["Findings",live.qcResponse?.findings],["Action Taken",live.qcResponse?.action],["Responded By",live.qcResponse?.respondedBy],["Date",live.qcResponse?.responseDate]].filter(([,v])=>v).map(([l,v])=><div key={l} style={{marginBottom:"8px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"3px"}}>{l}</div>
          <div style={{fontSize:"13px",color:"#94a3b8",whiteSpace:"pre-wrap"}}>{v}</div>
        </div>)}
      </div>:editStage==="qc"?<div style={{padding:"14px 16px",background:"#080d18"}}>
        <Field label="Findings / Investigation"><textarea style={{...ta,minHeight:"80px"}} value={qcResp.findings} onChange={e=>setQcResp({...qcResp,findings:e.target.value})}/></Field>
        <Field label="Action Taken / Recommendation"><textarea style={{...ta,minHeight:"80px"}} value={qcResp.action} onChange={e=>setQcResp({...qcResp,action:e.target.value})}/></Field>
        <Grid2>
          <Field label="Response Date"><input type="date" style={inp} value={qcResp.responseDate} onChange={e=>setQcResp({...qcResp,responseDate:e.target.value})}/></Field>
          <Field label="Responded By"><input style={inp} value={qcResp.respondedBy} onChange={e=>setQcResp({...qcResp,respondedBy:e.target.value})}/></Field>
        </Grid2>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setEditStage(null)} outline color="#475569" small/>
          <Btn label={saving?"Saving…":"Submit QC Response"} onClick={saveQC} disabled={saving} color="#22c55e" small/>
        </div>
      </div>:<div style={{padding:"12px 16px",background:"#080d18",fontSize:"12px",color:"#334155",fontStyle:"italic"}}>Awaiting QC investigation and response.</div>}
    </div>

    {/* Sales Response */}
    {(qcHasResponded||(role==="admin"))&&<div style={{border:`1px solid ${live.salesResponse?"#166534":"#1e293b"}`,borderRadius:"10px",marginBottom:"12px",overflow:"hidden"}}>
      <div style={{padding:"12px 16px",background:live.salesResponse?"#052e16":"#0b1220",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:"13px",fontWeight:"700",color:live.salesResponse?"#22c55e":"#475569"}}>💼 Sales / Customer Response</span>
        {canSales&&!live.salesResponse&&editStage!=="sales"&&qcHasResponded&&<Btn label="Add Response" onClick={()=>setEditStage("sales")} color="#a855f7" small/>}
      </div>
      {live.salesResponse?<div style={{padding:"14px 16px",background:"#080d18"}}>
        {[["Customer Feedback",live.salesResponse?.feedback],["Resolved",live.salesResponse?.resolved],["Response Date",live.salesResponse?.responseDate],["By",live.salesResponse?.respondedBy]].filter(([,v])=>v).map(([l,v])=><div key={l} style={{marginBottom:"8px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"3px"}}>{l}</div>
          <div style={{fontSize:"13px",color:"#94a3b8"}}>{v}</div>
        </div>)}
      </div>:editStage==="sales"?<div style={{padding:"14px 16px",background:"#080d18"}}>
        <Field label="Customer Feedback"><textarea style={{...ta,minHeight:"80px"}} value={salesResp.feedback} onChange={e=>setSalesResp({...salesResp,feedback:e.target.value})}/></Field>
        <Grid3>
          <Field label="Is Resolved?"><select style={sl} value={salesResp.resolved} onChange={e=>setSalesResp({...salesResp,resolved:e.target.value})}><option>Yes</option><option>No — needs more action</option></select></Field>
          <Field label="Response Date"><input type="date" style={inp} value={salesResp.responseDate} onChange={e=>setSalesResp({...salesResp,responseDate:e.target.value})}/></Field>
          <Field label="Responded By"><input style={inp} value={salesResp.respondedBy} onChange={e=>setSalesResp({...salesResp,respondedBy:e.target.value})}/></Field>
        </Grid3>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setEditStage(null)} outline color="#475569" small/>
          <Btn label={saving?"Saving…":"Submit Response"} onClick={saveSales} disabled={saving} color="#a855f7" small/>
        </div>
      </div>:<div style={{padding:"12px 16px",background:"#080d18",fontSize:"12px",color:"#334155",fontStyle:"italic"}}>Awaiting customer feedback from sales team.</div>}
    </div>}

    {/* Admin status override */}
    {role==="admin"&&<div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"12px 14px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"8px"}}>🔑 Admin — Override Status</div>
      <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
        <select style={{...sl,flex:1}} value={newStatus} onChange={e=>setNewStatus(e.target.value)}>{COMPLAINT_STATUS.map(s=><option key={s}>{s}</option>)}</select>
        <Btn label={saving?"Saving…":"Update"} onClick={saveStatus} disabled={saving} color="#f59e0b" small/>
      </div>
    </div>}
  </div>;
}

function IngredientTable({rows,onChange}){
  const update=(i,f,v)=>onChange(rows.map((r,idx)=>idx===i?{...r,[f]:v}:r));
  return <div>
    <div style={{display:"grid",gridTemplateColumns:"2fr 80px 75px 2fr 24px",gap:"6px",marginBottom:"4px"}}>
      {["Material / Ingredient","Qty","Unit","Notes",""].map((h,i)=><div key={i} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",padding:"0 2px"}}>{h}</div>)}
    </div>
    {rows.map((r,i)=><div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 80px 75px 2fr 24px",gap:"6px",marginBottom:"6px"}}>
      <input style={sml} value={r.material} onChange={e=>update(i,"material",e.target.value)} placeholder="e.g. TiO2 R-902"/>
      <input style={sml} value={r.quantity} onChange={e=>update(i,"quantity",e.target.value)} placeholder="100"/>
      <select style={{...sml,padding:"6px 6px"}} value={r.unit} onChange={e=>update(i,"unit",e.target.value)}>{ING_UNITS.map(u=><option key={u}>{u}</option>)}</select>
      <input style={sml} value={r.notes} onChange={e=>update(i,"notes",e.target.value)} placeholder="Optional"/>
      <button onClick={()=>onChange(rows.filter((_,idx)=>idx!==i))} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"15px",padding:0,alignSelf:"center"}}>×</button>
    </div>)}
    <button onClick={()=>onChange([...rows,{id:newId(),material:"",quantity:"",unit:"g",notes:""}])} style={{marginTop:"6px",background:"none",border:"1px dashed #1e293b",borderRadius:"7px",padding:"7px 14px",color:"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600",width:"100%"}}>+ Add Ingredient Row</button>
  </div>;
}

function TestReportCard({report,num,onDelete}){
  const rc=REC_COLORS[report.recommendation]||"#94a3b8";
  return <div style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:`3px solid ${rc}`,borderRadius:"8px",padding:"12px 14px",marginBottom:"8px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
        <span style={{fontSize:"11px",fontWeight:"700",color:"#475569",background:"#1e293b",padding:"2px 8px",borderRadius:"6px"}}>Report #{num}</span>
        {report.date&&<span style={{fontSize:"11px",color:"#475569"}}>📅 {report.date}</span>}
        {report.testedBy&&<span style={{fontSize:"11px",color:"#475569"}}>🔬 {report.testedBy}</span>}
      </div>
      <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
        <Bdg label={report.recommendation} color={rc} small/>
        <button onClick={()=>onDelete(report.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"13px"}}>🗑</button>
      </div>

      <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"3px"}}>{label}</div>
      <div style={{fontSize:"12.5px",color:"#94a3b8",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{val}</div>
    </div>)}

}

function TrialCard({trial,index,onDelete,onUpdate,isAdmin}){
  const [open,setOpen]=useState(false);
  const [editing,setEditing]=useState(false);
  const [showRF,setShowRF]=useState(false);
  const [showOU,setShowOU]=useState(false);
  const [newOutcome,setNewOutcome]=useState(trial.outcome);
  const [saving,setSaving]=useState(false);
  const blankR={date:today(),testedBy:"",testsPerformed:"",results:"",recommendation:"Pass",remarks:""};
  const [rForm,setRForm]=useState(blankR);

  // Edit form state — pre-filled from trial
  const blankIng=()=>({id:newId(),material:"",quantity:"",unit:"kg",notes:""});
  const [editForm,setEditForm]=useState({
    trialName:trial.trialName||"",date:trial.date||today(),triedBy:trial.triedBy||"",
    outcome:trial.outcome||"Under Evaluation",
    ingredients:trial.ingredients?.length?trial.ingredients:[blankIng()],
    process:trial.process||"",propertiesTested:trial.propertiesTested||"",
    observations:trial.observations||"",nextSteps:trial.nextSteps||""
  });

  const reports=trial.testReports||[];
  const oc=OUTCOME_COLORS[trial.outcome]||"#94a3b8";
  const isEval=trial.outcome==="Under Evaluation";

  const saveEdit=async()=>{
    setSaving(true);
    await onUpdate({...trial,...editForm,ingredients:editForm.ingredients.filter(r=>r.material.trim())});
    setEditing(false);setSaving(false);
  };

  const updIng=(idx,field,val)=>setEditForm(f=>({...f,ingredients:f.ingredients.map((r,i)=>i===idx?{...r,[field]:val}:r)}));
  const addIng=()=>setEditForm(f=>({...f,ingredients:[...f.ingredients,blankIng()]}));
  const remIng=(idx)=>setEditForm(f=>({...f,ingredients:f.ingredients.filter((_,i)=>i!==idx)}));

  const addReport=async()=>{
    if(!rForm.results.trim()&&!rForm.testsPerformed.trim())return;
    setSaving(true);
    const nr={...rForm,id:newId()};
    await onUpdate({...trial,testReports:[...reports,nr]});
    setRForm(blankR);setShowRF(false);
    setNewOutcome(REC_TO_OUTCOME[nr.recommendation]||trial.outcome);
    setShowOU(true);setSaving(false);
  };

  const applyOutcome=async()=>{
    setSaving(true);
    await onUpdate({...trial,outcome:newOutcome});
    setShowOU(false);setSaving(false);
  };

  return <div style={{border:`1px solid ${editing?"#3b82f680":isEval?"#7c3aed40":"#1e293b"}`,borderRadius:"12px",overflow:"hidden",marginBottom:"10px"}}>
    <div onClick={()=>!editing&&setOpen(o=>!o)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 18px",cursor:editing?"default":"pointer",background:open||editing?"#0b1626":"#0b1220",transition:"background 0.15s"}}>
      <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
        <div style={{background:"#1e293b",borderRadius:"8px",padding:"5px 10px",fontSize:"11px",fontWeight:"700",color:"#64748b",flexShrink:0}}>Trial {index+1}</div>
        <div>
          <div style={{fontSize:"13.5px",fontWeight:"600",color:"#e2e8f0"}}>{trial.trialName||`Trial ${index+1}`}</div>
          <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>{trial.date}{trial.triedBy?` · ${trial.triedBy}`:""} · {trial.ingredients?.length||0} ingredients{reports.length>0?` · 📋 ${reports.length} report${reports.length!==1?"s":""}`:""}</div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
        {isEval&&!editing&&<span style={{fontSize:"10px",fontWeight:"700",color:"#a855f7",background:"#a855f718",border:"1px solid #a855f730",padding:"2px 8px",borderRadius:"99px",whiteSpace:"nowrap"}}>⏳ Evaluating</span>}
        <Bdg label={trial.outcome||"—"} color={oc}/>
        {onDelete&&!editing&&<button onClick={e=>{e.stopPropagation();setOpen(true);setEditing(true);}} style={{background:"#1e3a5f",border:"1px solid #2563eb40",borderRadius:"6px",color:"#93c5fd",cursor:"pointer",fontSize:"11.5px",fontWeight:"600",padding:"3px 10px"}}>✏️ Edit</button>}
        {onDelete&&!editing&&<button onClick={e=>{e.stopPropagation();onDelete(trial.id)}} style={{background:"none",border:"none",color:"#334155",fontSize:"14px",padding:"2px 4px"}}>🗑</button>}
        {!editing&&<span style={{color:"#334155",fontSize:"12px"}}>{open?"▲":"▼"}</span>}
      </div>
    </div>

    {/* ── EDIT MODE ── */}
    {editing&&<div style={{padding:"16px 18px",borderTop:"1px solid #2563eb40",background:"#060d1a"}}>
      <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"14px",display:"flex",alignItems:"center",gap:"8px"}}>
        ✏️ Editing Trial {index+1}
        <span style={{fontSize:"10px",fontWeight:"400",color:"#475569"}}>Changes apply after Save</span>
      </div>
      <Grid3>
        <Field label="Trial Name"><input style={inp} value={editForm.trialName} onChange={e=>setEditForm({...editForm,trialName:e.target.value})} placeholder={`Trial ${index+1}`}/></Field>
        <Field label="Date"><input type="date" style={inp} value={editForm.date} onChange={e=>setEditForm({...editForm,date:e.target.value})}/></Field>
        <Field label="Tried By"><input style={inp} value={editForm.triedBy} onChange={e=>setEditForm({...editForm,triedBy:e.target.value})}/></Field>
      </Grid3>
      <Field label="Outcome">
        <select style={sl} value={editForm.outcome} onChange={e=>setEditForm({...editForm,outcome:e.target.value})}>
          {TRIAL_OUTCOMES.map(o=><option key={o}>{o}</option>)}
        </select>
      </Field>
      {/* Ingredients */}
      <div style={{marginBottom:"12px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>Formulation / Ingredients</div>
        <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",marginBottom:"6px"}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 80px 80px 2fr 28px",background:"#0b1220",padding:"7px 12px",gap:"6px"}}>
            {["Material / Ingredient","Qty","Unit","Notes",""].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
          </div>
          {editForm.ingredients.map((r,i)=>(
            <div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 80px 80px 2fr 28px",padding:"6px 12px",gap:"6px",borderTop:"1px solid #1e293b",alignItems:"center"}}>
              <input style={sml} value={r.material} onChange={e=>updIng(i,"material",e.target.value)} placeholder="Material name"/>
              <input style={{...sml,textAlign:"center"}} type="number" value={r.quantity} onChange={e=>updIng(i,"quantity",e.target.value)} placeholder="0"/>
              <select style={{...sml,padding:"6px 4px"}} value={r.unit} onChange={e=>updIng(i,"unit",e.target.value)}>
                {ING_UNITS.map(u=><option key={u}>{u}</option>)}
              </select>
              <input style={sml} value={r.notes} onChange={e=>updIng(i,"notes",e.target.value)} placeholder="Notes"/>
              <button onClick={()=>remIng(i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:0}}>×</button>
            </div>
          ))}
        </div>
        <button onClick={addIng} style={{background:"none",border:"1px dashed #1e293b",borderRadius:"6px",padding:"5px 12px",color:"#475569",cursor:"pointer",fontSize:"12px",width:"100%"}}>+ Add Row</button>
      </div>
      <Grid2>
        <Field label="Process / Mixing Method"><textarea style={{...ta,minHeight:"72px"}} value={editForm.process} onChange={e=>setEditForm({...editForm,process:e.target.value})}/></Field>
        <Field label="Properties Tested"><textarea style={{...ta,minHeight:"72px"}} value={editForm.propertiesTested} onChange={e=>setEditForm({...editForm,propertiesTested:e.target.value})}/></Field>
      </Grid2>
      <Grid2>
        <Field label="Observations / Results"><textarea style={{...ta,minHeight:"72px"}} value={editForm.observations} onChange={e=>setEditForm({...editForm,observations:e.target.value})}/></Field>
        <Field label="Next Steps"><textarea style={{...ta,minHeight:"72px"}} value={editForm.nextSteps} onChange={e=>setEditForm({...editForm,nextSteps:e.target.value})}/></Field>
      </Grid2>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"4px"}}>
        <Btn label="Cancel" onClick={()=>{setEditing(false);setEditForm({trialName:trial.trialName||"",date:trial.date||today(),triedBy:trial.triedBy||"",outcome:trial.outcome||"Under Evaluation",ingredients:trial.ingredients?.length?trial.ingredients:[blankIng()],process:trial.process||"",propertiesTested:trial.propertiesTested||"",observations:trial.observations||"",nextSteps:trial.nextSteps||""});}} outline color="#475569" small/>
        <Btn label={saving?"Saving…":"💾 Save Changes"} onClick={saveEdit} disabled={saving} color="#2563eb" small/>
      </div>
    </div>}

    {/* ── VIEW MODE ── */}
    {open&&!editing&&<div style={{padding:"16px 18px 20px",borderTop:"1px solid #1e293b",background:"#080d18"}}>
      {trial.ingredients?.length>0&&<div style={{marginBottom:"14px"}}>
        <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"8px"}}>Formulation</div>
        <div style={{border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden"}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 80px 70px 2fr",background:"#0b1220",padding:"8px 14px",gap:"8px"}}>
            {["Material","Qty","Unit","Notes"].map(h=><div key={h} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</div>)}
          </div>
          {trial.ingredients.map((r,i)=><div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 80px 70px 2fr",padding:"8px 14px",gap:"8px",borderTop:"1px solid #0f1929",background:i%2===0?"transparent":"#0a1422"}}>
            <div style={{fontSize:"13px",color:"#cbd5e1",fontWeight:"500"}}>{r.material||"—"}</div>
            <div style={{fontSize:"13px",color:"#94a3b8"}}>{r.quantity||"—"}</div>
            <div style={{fontSize:"13px",color:"#64748b"}}>{r.unit}</div>
            <div style={{fontSize:"12px",color:"#475569",fontStyle:"italic"}}>{r.notes||""}</div>
          </div>)}
        </div>
      </div>}
      {[["Process / Mixing Method",trial.process],["Properties Tested",trial.propertiesTested],["Observations / Results",trial.observations],["Next Steps",trial.nextSteps]].map(([label,val])=>val&&<div key={label} style={{marginBottom:"12px"}}>
        <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"5px"}}>{label}</div>
        <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"10px 13px",fontSize:"13px",color:"#94a3b8",lineHeight:1.65,whiteSpace:"pre-wrap"}}>{val}</div>
      </div>)}
      {/* Test Reports section */}
      <div style={{marginTop:"16px",borderTop:"1px solid #1e293b",paddingTop:"16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
          <span style={{fontSize:"11px",fontWeight:"700",color:isEval?"#a855f7":"#475569",textTransform:"uppercase",letterSpacing:"0.09em"}}>📋 Test Reports ({reports.length})</span>
          <button onClick={()=>{setShowRF(v=>!v);setShowOU(false);}} style={{background:isEval?"#3b0764":"#1e293b",border:`1px solid ${isEval?"#7c3aed":"#334155"}`,borderRadius:"7px",padding:"5px 12px",color:isEval?"#c4b5fd":"#64748b",fontSize:"11.5px",fontWeight:"700",cursor:"pointer"}}>
            {showRF?"▲ Cancel":"+ Add Test Report"}</button>
        </div>
        {reports.map((r,i)=><TestReportCard key={r.id} report={r} num={i+1} onDelete={async(id)=>await onUpdate({...trial,testReports:reports.filter(r=>r.id!==id)})}/>)}
        {reports.length===0&&!showRF&&<div style={{textAlign:"center",padding:"12px",border:"1px dashed #1e293b",borderRadius:"8px",marginBottom:"8px"}}>
          <div style={{fontSize:"12px",color:"#334155"}}>{isEval?"⏳ Add a test report to evaluate this trial.":"No test reports yet."}</div>
        </div>}
        {showRF&&<div style={{background:"#0a0f1e",border:"1px solid #7c3aed40",borderRadius:"10px",padding:"14px",marginBottom:"10px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#c4b5fd",marginBottom:"12px"}}>📋 New Test Report #{reports.length+1}</div>
          <Grid3>
            <Field label="Date"><input type="date" style={inp} value={rForm.date} onChange={e=>setRForm({...rForm,date:e.target.value})}/></Field>
            <Field label="Tested By"><input style={inp} value={rForm.testedBy} onChange={e=>setRForm({...rForm,testedBy:e.target.value})}/></Field>
            <Field label="Recommendation"><select style={{...sl,borderColor:(REC_COLORS[rForm.recommendation]||"#1e293b")+"60"}} value={rForm.recommendation} onChange={e=>setRForm({...rForm,recommendation:e.target.value})}>
              {Object.keys(REC_COLORS).map(r=><option key={r}>{r}</option>)}</select></Field>
          </Grid3>
          <Grid2>
            <Field label="Tests Performed"><textarea style={{...ta,minHeight:"70px"}} value={rForm.testsPerformed} onChange={e=>setRForm({...rForm,testsPerformed:e.target.value})} placeholder="Viscosity, pH, Gloss..."/></Field>
            <Field label="Results / Values *"><textarea style={{...ta,minHeight:"70px"}} value={rForm.results} onChange={e=>setRForm({...rForm,results:e.target.value})} placeholder="Measured values, pass/fail vs spec..."/></Field>
          </Grid2>
          <Field label="Remarks"><textarea style={{...ta,minHeight:"50px"}} value={rForm.remarks} onChange={e=>setRForm({...rForm,remarks:e.target.value})}/></Field>
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
            <Btn label="Cancel" onClick={()=>setShowRF(false)} outline color="#475569" small/>
            <Btn label={saving?"Saving…":"Save Report"} onClick={addReport} disabled={saving} color="#7c3aed" small/>
          </div>
        </div>}
        {showOU&&<div style={{background:"#0c1a2e",border:"1px solid #2563eb60",borderRadius:"10px",padding:"14px",marginTop:"6px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#93c5fd",marginBottom:"6px"}}>🔄 Update Trial Outcome</div>
          <div style={{fontSize:"12.5px",color:"#475569",marginBottom:"10px"}}>Suggested: <strong style={{color:OUTCOME_COLORS[newOutcome]||"#93c5fd"}}>{newOutcome}</strong></div>
          <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
            <select style={{...sl,flex:1,minWidth:"180px"}} value={newOutcome} onChange={e=>setNewOutcome(e.target.value)}>{TRIAL_OUTCOMES.map(o=><option key={o}>{o}</option>)}</select>
            <Btn label={saving?"Saving…":"✓ Update"} onClick={applyOutcome} disabled={saving} color="#2563eb" small/>
            <Btn label="Keep as is" onClick={()=>setShowOU(false)} outline color="#475569" small/>
          </div>
        </div>}
      </div>
    </div>}
  </div>;
}

function ProjectWorkspace({project,isAdmin,showToast}){
  const [live,setLive]=useState(project);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [editNotes,setEditNotes]=useState(false);
  const [editObj,setEditObj]=useState(false);
  const [draft,setDraft]=useState({objective:project.objective||"",formulationBase:project.formulationBase||"",notes:project.notes||""});
  const [savingN,setSavingN]=useState(false);
  const blank={trialName:"",date:today(),triedBy:"",outcome:"Under Evaluation",ingredients:[{id:"1",material:"",quantity:"",unit:"g",notes:""}],process:"",propertiesTested:"",observations:"",nextSteps:"",testReports:[]};
  const [form,setForm]=useState(blank);
  const accent=PAINT_ACCENT[live.paintType]||"#cbd5e1";
  const sc=STATUS_COLORS[live.status]||"#94a3b8";
  const trials=live.trials||[];

  useEffect(()=>{
    const unsub=C("rd_projects").doc(project.id).onSnapshot(snap=>{
      if(snap.exists)setLive({id:snap.id,...snap.data()});
    });
    return unsub;
  },[project.id]);

  const saveNotes=async()=>{
    setSavingN(true);
    try{await C("rd_projects").doc(project.id).update({objective:draft.objective,formulationBase:draft.formulationBase,notes:draft.notes});setEditNotes(false);setEditObj(false);showToast("Updated ✓");}catch(e){showToast("Error","error");}
    setSavingN(false);
  };

  const saveTrial=async()=>{
    if(!form.observations.trim()&&!form.ingredients.some(r=>r.material.trim()))return showToast("Add ingredients or observations","error");
    if(saving)return;setSaving(true);
    try{await C("rd_projects").doc(project.id).update({trials:[...trials,{...form,id:newId()}]});setForm(blank);setShowForm(false);showToast("Trial saved ✓");}catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const deleteTrial=async(id)=>{
    if(!isAdmin){showToast("Admin only","error");return;}
    if(!confirm("Delete trial?"))return;
    await C("rd_projects").doc(project.id).update({trials:trials.filter(t=>t.id!==id)});
  };

  const updateTrial=async(updated)=>{
    await C("rd_projects").doc(project.id).update({trials:trials.map(t=>t.id===updated.id?updated:t)});
  };

  const approved=trials.find(t=>t.outcome==="Approved as Final");

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px",gap:"8px"}}>
      <div>
        <div style={{fontSize:"22px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>{live.projectName}</div>
        <div style={{fontSize:"12px",color:"#64748b",marginTop:"3px"}}>#{live.projectCode} · Created {live.dateCreated}</div>
      </div>
      <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
        {!isAdmin&&<Bdg label="👁 View only" color="#475569" small/>}
        <Bdg label={live.status} color={sc}/>
      </div>
    </div>
    <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"16px"}}>
      {[["🎨",live.paintType,accent],["🏗",live.application||null,"#64748b"],["👤",live.assignedTo||null,"#64748b"],["🗓",live.targetDate||null,"#64748b"]].map(([icon,val,color])=>val&&<span key={icon} style={{fontSize:"12px",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"5px 12px",color}}>{icon} {val}</span>)}
    </div>
    {/* Objective */}
    <div style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:`3px solid ${accent}`,borderRadius:"8px",padding:"12px 14px",marginBottom:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}}>
        <span style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em"}}>Objective</span>
        {isAdmin&&!editObj&&<button onClick={()=>{setEditObj(true);setDraft(d=>({...d,objective:live.objective||""}))}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 10px",color:"#475569",fontSize:"11px",cursor:"pointer"}}>✏️ Edit</button>}
      </div>
      {editObj?<div><textarea style={{...ta,minHeight:"70px",marginBottom:"8px"}} value={draft.objective} onChange={e=>setDraft(d=>({...d,objective:e.target.value}))}/>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setEditObj(false)} outline color="#475569" small/>
          <Btn label={savingN?"Saving…":"Save"} onClick={saveNotes} disabled={savingN} color="#3b82f6" small/>
        </div>
      </div>:<div style={{fontSize:"13.5px",color:"#94a3b8",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{live.objective||<span style={{color:"#334155",fontStyle:"italic"}}>No objective set.{isAdmin?" Click Edit to add.":""}</span>}</div>}
    </div>
    {approved&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"10px",padding:"12px 16px",marginBottom:"16px",display:"flex",alignItems:"center",gap:"10px"}}>
      <span style={{fontSize:"18px"}}>✅</span>
      <div><div style={{fontSize:"12px",fontWeight:"700",color:"#22c55e"}}>Approved Final Formulation</div>
      <div style={{fontSize:"12px",color:"#16a34a"}}>{approved.trialName||"A trial"} approved.</div></div>
    </div>}
    <SectionHead title={`Formulation Trials (${trials.length})`} action={
      <button onClick={()=>setShowForm(v=>!v)} style={{background:"#1e3a5f",border:"1px solid #2563eb",borderRadius:"8px",padding:"6px 14px",color:"#93c5fd",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
        {showForm?"▲ Cancel":"+ Log New Trial"}</button>}/>
    {showForm&&<div style={{border:"1px solid #2563eb",borderRadius:"12px",padding:"20px",background:"#060d1a",marginBottom:"14px"}}>
      <div style={{fontSize:"13px",fontWeight:"700",color:"#93c5fd",marginBottom:"14px"}}>⚗️ Trial #{trials.length+1}</div>
      <Grid4>
        <Field label="Trial Name"><input style={inp} value={form.trialName} onChange={e=>setForm({...form,trialName:e.target.value})} placeholder="e.g. Low-VOC batch v1"/></Field>
        <Field label="Date"><input type="date" style={inp} value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        <Field label="Tried By"><input style={inp} value={form.triedBy} onChange={e=>setForm({...form,triedBy:e.target.value})}/></Field>
        <Field label="Outcome"><select style={sl} value={form.outcome} onChange={e=>setForm({...form,outcome:e.target.value})}>{TRIAL_OUTCOMES.map(o=><option key={o}>{o}</option>)}</select></Field>
      </Grid4>
      <Field label="Formulation — Ingredients"><IngredientTable rows={form.ingredients} onChange={rows=>setForm({...form,ingredients:rows})}/></Field>
      <Grid2>
        <Field label="Process / Mixing Method"><textarea style={{...ta,minHeight:"70px"}} value={form.process} onChange={e=>setForm({...form,process:e.target.value})} placeholder="Mixing sequence, temperature, RPM..."/></Field>
        <Field label="Properties Tested"><textarea style={{...ta,minHeight:"70px"}} value={form.propertiesTested} onChange={e=>setForm({...form,propertiesTested:e.target.value})} placeholder="Viscosity, pH, Gloss..."/></Field>
      </Grid2>
      <Field label="Observations *"><textarea style={{...ta,minHeight:"70px"}} value={form.observations} onChange={e=>setForm({...form,observations:e.target.value})} placeholder="What happened? Values, appearance, issues..."/></Field>
      <Field label="Next Steps"><textarea style={{...ta,minHeight:"50px"}} value={form.nextSteps} onChange={e=>setForm({...form,nextSteps:e.target.value})}/></Field>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <Btn label="Cancel" onClick={()=>setShowForm(false)} outline color="#475569" small/>
        <Btn label={saving?"Saving…":"Save Trial"} onClick={saveTrial} disabled={saving} color="#2563eb" small/>
      </div>
    </div>}
    {trials.length===0&&!showForm?<div style={{textAlign:"center",padding:"24px",border:"1px dashed #1e293b",borderRadius:"10px",marginBottom:"14px"}}>
      <div style={{fontSize:"26px",marginBottom:"6px"}}>⚗️</div>
      <div style={{fontSize:"13px",color:"#475569"}}>No trials yet.</div>
    </div>:trials.map((t,i)=><TrialCard key={t.id} trial={t} index={i} isAdmin={isAdmin} onDelete={isAdmin?deleteTrial:null} onUpdate={updateTrial}/>)}
    {/* Notes section */}
    <div style={{marginTop:"20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px",paddingBottom:"10px",borderBottom:"1px solid #1e293b"}}>
        <span style={{fontSize:"12px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.1em"}}>Formulation Base & Notes</span>
        {isAdmin&&!editNotes&&<button onClick={()=>{setEditNotes(true);setDraft(d=>({...d,formulationBase:live.formulationBase||"",notes:live.notes||""}))}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 10px",color:"#475569",fontSize:"11px",cursor:"pointer"}}>✏️ Edit</button>}
      </div>
      {editNotes?<div>
        <Field label="Formulation Base"><textarea style={ta} value={draft.formulationBase} onChange={e=>setDraft(d=>({...d,formulationBase:e.target.value}))}/></Field>
        <Field label="Notes"><textarea style={{...ta,minHeight:"56px"}} value={draft.notes} onChange={e=>setDraft(d=>({...d,notes:e.target.value}))}/></Field>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginBottom:"10px"}}>
          <Btn label="Cancel" onClick={()=>setEditNotes(false)} outline color="#475569" small/>
          <Btn label={savingN?"Saving…":"Save Changes"} onClick={saveNotes} disabled={savingN} color="#3b82f6" small/>
        </div>
      </div>:<>
        {[["Formulation Base",live.formulationBase],["Notes",live.notes]].map(([label,val])=><div key={label} style={{marginBottom:"10px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"4px"}}>{label}</div>
          <div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"7px",padding:"10px 13px",fontSize:"13px",color:val?"#94a3b8":"#334155",lineHeight:1.65,whiteSpace:"pre-wrap",fontStyle:val?"normal":"italic"}}>
            {val||(isAdmin?`No ${label.toLowerCase()} yet. Click Edit above.`:`No ${label.toLowerCase()} added yet.`)}
          </div>
        </div>)}
      </>}
    </div>
  </div>;
}

function ProjectCard({p,onClick,onDelete,onEdit,isAdmin}){
  const accent=PAINT_ACCENT[p.paintType]||"#cbd5e1";
  const sc=STATUS_COLORS[p.status]||"#94a3b8";
  const tc=(p.trials||[]).length;
  const hasFinal=(p.trials||[]).some(t=>t.outcome==="Approved as Final");
  return <div onClick={onClick} onMouseEnter={e=>e.currentTarget.style.background="#0f1f35"} onMouseLeave={e=>e.currentTarget.style.background="#0f172a"}
    style={{background:"#0f172a",border:"1px solid #1e293b",borderLeft:`3px solid ${accent}`,borderRadius:"12px",padding:"15px 20px",cursor:"pointer",transition:"background 0.15s",boxShadow:"0 2px 10px rgba(0,0,0,0.3)",marginBottom:"10px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}}>
      <div style={{flex:1}}>
        <div style={{fontSize:"14px",fontWeight:"700",color:"#f1f5f9",marginBottom:"3px",fontFamily:"'DM Serif Display',serif"}}>{p.projectName}</div>
        <div style={{fontSize:"11.5px",color:"#64748b",marginBottom:"6px"}}>#{p.projectCode} · {p.paintType} · {p.application||"—"}</div>
      </div>
      <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
        <Bdg label={p.status} color={sc}/>
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onEdit(p)}} style={{background:"none",border:"1px solid #1e293b",borderRadius:"6px",color:"#475569",fontSize:"12px",padding:"2px 8px",cursor:"pointer"}}>✏️</button>}
        {isAdmin&&<button onClick={e=>{e.stopPropagation();onDelete(p.id)}} style={{background:"none",border:"none",color:"#334155",fontSize:"15px",padding:"2px 4px",cursor:"pointer"}}>🗑</button>}
      </div>
    </div>
    <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:"11px",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"6px",padding:"2px 9px",color:tc>0?"#93c5fd":"#334155"}}>
        ⚗️ {tc} Trial{tc!==1?"s":""}{hasFinal&&<span style={{color:"#22c55e",marginLeft:"5px"}}>✓ Final</span>}
      </span>
      {p.assignedTo&&<span style={{fontSize:"11px",color:"#475569"}}>👤 {p.assignedTo}</span>}
    </div>
  </div>;
}
