// Print production sheet — opens in new window, auto-prints
function printProductionSheet(bom, batchSize, batchNo, millNo, fillingDate, chargingDate, packSizes, issueDate, extraConfig){
  const bs=parseFloat(batchSize)||parseFloat(bom.baseBatchSize)||100;
  const base=parseFloat(bom.baseBatchSize)||100;
  const factor=bs/base;
  let ingRows="";
  let rowNo=0;
  (bom.ingredients||[]).forEach(ing=>{
    if(ing.isProcess){
      ingRows+=`<tr style="background:#f0f0f0"><td colspan="6" style="padding:6px 6px;font-style:italic;font-weight:600;font-size:11px;border:1px solid #999">${ing.name||""}</td></tr>`;
    }else{
      rowNo++;
      const stdQty=parseFloat(ing.standardQty)||0;
      const currQty=(stdQty*factor).toFixed(3).replace(/\.?0+$/,"");
      const nameDisplay=ing.name+(ing.desc?` (${ing.desc})`:"");
      ingRows+=`<tr>
        <td style="border:1px solid #999;padding:7px 5px;text-align:center;font-size:11px">${rowNo}</td>
        <td style="border:1px solid #999;padding:7px 5px;font-size:11px">${nameDisplay}</td>
        <td style="border:1px solid #999;padding:7px 5px;text-align:center;font-size:11px">${stdQty||""}</td>
        <td style="border:1px solid #999;padding:7px 5px;text-align:center;font-size:11px">${currQty||""}</td>
        <td style="border:1px solid #999;padding:7px 5px;text-align:center;font-size:11px"></td>
        <td style="border:1px solid #999;padding:7px 5px;text-align:center;font-size:11px"></td>
      </tr>`;
    }
  });
  // Total row
  const totalStd=(bom.ingredients||[]).filter(i=>!i.isProcess).reduce((s,i)=>s+(parseFloat(i.standardQty)||0),0);
  const totalCurr=(totalStd*factor).toFixed(3).replace(/\.?0+$/,"");
  // Normalise qcTests — support both old {sd,tf,...} and new [{name,standard},...] formats
  const _qcRaw=bom.qcTests||{};

    ?_qcRaw
    :[
      {name:"SD (Drying)",standard:_qcRaw.sd||""},
      {name:"TF (Drying)",standard:_qcRaw.tf||""},
      {name:"HD (Drying)",standard:_qcRaw.hd||""},
      {name:"Colour",standard:_qcRaw.colour||""},
      {name:"Finish",standard:_qcRaw.finish||""},
      {name:"Viscosity",standard:_qcRaw.viscosity||""},
      {name:"Specific Gravity",standard:_qcRaw.sg||""},
      ...(_qcRaw.remarks?[{name:"Remarks",standard:_qcRaw.remarks}]:[])

      return typeof p==='string'?p:(p.size||p.label||String(p));

          <tr><td style="border:1px solid #999;padding:10px 5px"></td><td style="border:1px solid #999;padding:10px 5px"></td><td style="border:1px solid #999;padding:10px 5px"></td><td style="border:1px solid #999;padding:10px 5px"></td><td style="border:1px solid #999;padding:10px 5px"></td><td style="border:1px solid #999;padding:10px 5px"></td></tr>
          <tr><td style="border:1px solid #999;padding:10px 5px"></td><td style="border:1px solid #999;padding:10px 5px"></td><td style="border:1px solid #999;padding:10px 5px"></td><td style="border:1px solid #999;padding:10px 5px"></td><td style="border:1px solid #999;padding:10px 5px"></td><td style="border:1px solid #999;padding:10px 5px"></td></tr>
          <tr><td colspan="6" style="border:1px solid #999;padding:3px 5px;font-size:10px;font-style:italic;font-weight:600;background:#f5f5f5">EXTRA ADDITIONS</td></tr>
          ${(function(){
            var cfg=extraConfig||{};
            var rows='';
            var normalStyle='border:1px solid #999;padding:12px 5px;font-size:11px;font-style:italic';
            var highlightStyle='border:1px solid #999;padding:8px 5px;font-size:11px;font-style:italic;font-weight:700;background:#f0f0f0';
            var blankCells='<td style="border:1px solid #999;padding:12px 5px"></td><td style="border:1px solid #999;padding:12px 5px"></td>';
            var items=cfg.items||['Dhoyela','Extra Output','Dhoyela'];
            items.forEach(function(label){
              var isHighlight=label==='Extra Output'||label.toLowerCase().includes('extra output');
              var style=isHighlight?highlightStyle:normalStyle;
              rows+='<tr><td colspan="4" style="'+style+'">'+label+'</td>'+blankCells+'</tr>';
            });
            var blanks=cfg.blankRows!==undefined?cfg.blankRows:2;
            for(var i=0;i<blanks;i++) rows+='<tr><td colspan="4" style="'+normalStyle+'">&nbsp;</td>'+blankCells+'</tr>';
            return rows;
          })()}
        </tbody>

        <span style={{color:"#334155",fontSize:"12px"}}>{open?"▲":"▼"}</span>

      {children}
      {active&&editForm&&editStage!==title&&onEdit&&<div style={{marginTop:"10px"}}><Btn label={editLabel||"Fill Details"} onClick={onEdit} color="#2563eb" small/></div>}
      {editStage===title&&editForm&&<div style={{marginTop:"12px",padding:"14px",background:"#060d1a",border:"1px solid #f59e0b30",borderRadius:"8px"}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:"#f59e0b",marginBottom:"10px"}}>✏️ Editing {title} — changes save without affecting batch status</div>

function BatchWorkspace({batch,role,onClose,showToast,qcParams,packSizes}){
  const [live,setLive]=useState(batch);
  const [editStage,setEditStage]=useState(null);
  const [saving,setSaving]=useState(false);
  const [availOldStock,setAvailOldStock]=useState([]);
  const [allOldStock,setAllOldStock]=useState([]);
  const [showOtherStock,setShowOtherStock]=useState(false);
  const [selectedOldStock,setSelectedOldStock]=useState([]);
  const [prodForm,setProdForm]=useState({startDate:today(),completionDate:today(),actualQty:"",oldStockUsed:"",producedBy:"",notes:""});
  const [qcForm,setQcForm]=useState({other:"",result:"Pass",qcDate:today(),qcBy:"",remarks:""});
  const [packForm,setPackForm]=useState({sizes:[],packingDate:today(),packedBy:"",labelChecked:"Yes",remarks:""});

  // Auto-fill QC By and Packed By with current user's name on mount
  useEffect(()=>{
    const name=live.issuedBy||"";
    db.collection("userProfiles").where("email","==",role==="admin"||role==="qc"?batch.issuedBy||"":"").get().catch(()=>{});
    // Get current user profile for auto-fill
    const uid=window._auth?.currentUser?.uid;
    if(uid){
      db.collection("userProfiles").doc(uid).get().then(snap=>{
        const displayName=snap.exists?(snap.data().displayName||snap.data().email||""):"";
        if(displayName){
          setQcForm(f=>({...f,qcBy:f.qcBy||displayName}));
          setPackForm(f=>({...f,packedBy:f.packedBy||displayName}));
        }
      }).catch(()=>{});
    }
  },[]);

  const resolvedPackSizes=(()=>{
    let list;
    if(!packSizes)list=DEFAULT_PACK_SIZES_BY_CAT[live.category]||DEFAULT_PACK_SIZES;
    else if(Array.isArray(packSizes))list=packSizes;
    else list=packSizes[live.category]||packSizes._default||DEFAULT_PACK_SIZES;
    // Normalize: each item is either a string (old) or {size,qty} (new)
    return list.map(p=>gps(p));
  })();

  useEffect(()=>{
    // Pre-fill qty from the configured pack size qty
    const sizes=resolvedPackSizes.map(p=>{const ps=gps(p);return {size:ps.size,qty:ps.qty||"",pcs:""};});
    setPackForm(f=>({...f,sizes}));
  },[live.category,JSON.stringify(resolvedPackSizes)]);

  useEffect(()=>{
    const unsub=C("batches").doc(batch.id).onSnapshot(snap=>{if(snap.exists)setLive({id:snap.id,...snap.data()});});
    return unsub;
  },[batch.id]);

  useEffect(()=>{
    if(!live.productName)return;
    C("old_stock").where("status","==","Available").where("productName","==",live.productName).get()
      .then(snap=>setAvailOldStock(snap.docs.map(d=>({id:d.id,...d.data()}))))
      .catch(()=>C("old_stock").where("status","==","Available").get()
        .then(snap=>setAvailOldStock(snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.productName===live.productName))));
    C("old_stock").where("status","==","Available").get()
      .then(snap=>setAllOldStock(snap.docs.map(d=>({id:d.id,...d.data()})))).catch(()=>{});
  },[live.productName]);

  const save=async(data,nextStatus,extraOps)=>{
    setSaving(true);
    try{
      await C("batches").doc(batch.id).update({...data,status:nextStatus});
      // Auto-add to Old/Rejected Material when QC Fails
      if(nextStatus==="QC Fail"){
        const qty=live.production?.actualQty||live.batchSize;
        const remarks=data.qc?.remarks||"QC Failed";
        await C("old_stock").add({
          productName:live.productName,category:live.category||"",
          unit:live.unit,qty:String(qty),
          status:"Available",batchRef:live.batchNo,
          notes:`Auto-added: QC Fail · ${remarks}`,
          dateAdded:today(),addedBy:"System",_createdAt:ts()
        });
        showToast("QC Fail — batch auto-added to Old/Rejected Material ✓");
      }else{
        showToast("Saved ✓");
      }
      if(extraOps)await Promise.all(extraOps);
      setEditStage(null);
    }catch(e){showToast("Error saving","error");}
    setSaving(false);
  };

  const cat=live.category||"Other";
  const rawParams=(qcParams||DEFAULT_QC_PARAMS)[cat]||DEFAULT_QC_PARAMS["Other"]||[];
  const params=rawParams.map(gp);

  const checkParam=(p,val)=>{
    const v=parseFloat(val);
    if(isNaN(v)||(!p.min&&!p.max))return null;
    if(p.min&&v<parseFloat(p.min))return false;
    if(p.max&&v>parseFloat(p.max))return false;
    return true;
  };
  const autoResult=()=>{
    const withRange=params.filter(p=>p.min||p.max);
    if(!withRange.length)return null;
    return withRange.every(p=>{const r=checkParam(p,qcForm[p.name]);return r===null||r===true;})?"Pass":"Fail";
  };

  const sc=BS_COL[live.status]||"#94a3b8";
  const canQC=role==="admin"||role==="qc";
  const stageIndex=["Issued","In Production","QC Pending","QC Pass","Packed"].indexOf(live.status);
  const sb={editStage,setEditStage,saving};

  const PrintQCReport=()=><div className="print-report">
    <div style={{borderBottom:"2px solid #000",paddingBottom:"3px",marginBottom:"5px",display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
      <div>
        <div className="pr-co">Gujarat Colours &amp; Coatings Pvt Ltd</div>
        <div className="pr-title">QC Test Report | {live.batchNo} | {live.qc?.qcDate||today()}</div>
      </div>
      <div className={live.qc?.result==="Pass"?"pr-pass pr-result":"pr-fail pr-result"}>{live.qc?.result||"—"}</div>
    </div>
    <table className="pr-info" style={{marginBottom:"4px",width:"100%"}}><tbody>
      <tr><td>Product</td><td>{live.productName}</td><td>Category</td><td>{live.category||"—"}</td></tr>
      <tr><td>Batch Size</td><td>{live.batchSize} {live.unit}</td><td>Shade</td><td>{live.shade||"—"}</td></tr>
      <tr><td>QC By</td><td>{live.qc?.qcBy||"—"}</td><td>Date</td><td>{live.qc?.qcDate||"—"}</td></tr>
    </tbody></table>
    <div className="pr-section-title">Test Parameters</div>
    <table><thead><tr><th>Parameter</th><th>Unit</th><th>Min</th><th>Max</th><th>Value</th><th>Result</th></tr></thead>

  const PrintPackReport=()=><div className="print-report" style={{borderLeft:"1px dashed #aaa"}}>

      <tr><td>Product</td><td>{live.productName}</td><td>Shade</td><td>{live.shade||"—"}</td></tr>

    <StageBox {...sb} icon="🏭" title="Production Details" done={stageIndex>=1&&!!live.production?.completionDate} active={live.status==="Issued"||live.status==="In Production"}

            {showOtherStock?"▲ Hide":"▼ + Add Material from Other Products (optional)"}
          </button>
          {showOtherStock&&<div style={{border:"1px solid #334155",borderRadius:"8px",background:"#0a1010",padding:"10px 12px",marginTop:"8px",display:"flex",flexDirection:"column",gap:"8px",maxHeight:"240px",overflowY:"auto"}}>

                const sel=selectedOldStock.find(x=>x.id===s.id);
                const isSel=!!sel;
                return <div key={s.id} style={{padding:"8px",borderRadius:"6px",background:isSel?"#0c2340":"transparent",border:`1px solid ${isSel?"#2563eb30":"transparent"}`}}>

                    <input type="checkbox" checked={isSel} onChange={e=>{
                      if(e.target.checked)setSelectedOldStock(p=>[...p,{...s,usedQty:s.qty}]);

                    </div>
                  </label>
                  {isSel&&<div style={{marginTop:"8px",marginLeft:"26px",display:"flex",alignItems:"center",gap:"8px"}}>
                    <span style={{fontSize:"11px",color:"#93c5fd",fontWeight:"600",flexShrink:0}}>Qty to use:</span>
                    <input type="number" min="0.1" max={parseFloat(s.qty)||9999} step="0.1"
                      style={{...sml,width:"100px",borderColor:"#2563eb50"}}
                      value={sel.usedQty}
                      onChange={e=>setSelectedOldStock(p=>p.map(x=>x.id===s.id?{...x,usedQty:e.target.value}:x))}/>
                    <span style={{fontSize:"11px",color:"#64748b"}}>{s.unit}</span>
                  </div>}
                </div>;
              })
            }
          </div>}
        </div>

        {selectedOldStock.length>0&&<div style={{background:"#052e16",border:"1px solid #166534",borderRadius:"7px",padding:"8px 12px",marginBottom:"10px",fontSize:"12px",color:"#22c55e"}}>
          ✓ {selectedOldStock.length} item{selectedOldStock.length!==1?"s":""} selected · Total: {selectedOldStock.map(x=>`${x.usedQty} ${x.unit} ${x.productName}`).join(", ")}
        </div>}

        <Field label="Production Notes"><textarea style={{...ta,minHeight:"56px"}} value={prodForm.notes} onChange={e=>setProdForm({...prodForm,notes:e.target.value})} placeholder="Any production notes..."/></Field>

      saveLabel={live.status==="QC Pending"||live.status==="QC Pass"||live.status==="QC Fail"||live.status==="Packed"||live.status==="Dispatched"?"💾 Save Correction":"Save & Mark QC Pending"}
      onSave={()=>{
        const isCorrection=live.status!=="Issued"&&live.status!=="In Production";
        const desc=selectedOldStock.length>0?selectedOldStock.map(s=>`${s.usedQty||s.qty} ${s.unit} ${s.productName}`).join(", "):prodForm.notes;
        const markUsed=selectedOldStock.map(s=>{
          const used=parseFloat(s.usedQty)||parseFloat(s.qty);
          const avail=parseFloat(s.qty)||0;
          const remaining=avail-used;
          if(remaining<=0.01){
            return C("old_stock").doc(s.id).update({status:"Used",usedInBatch:live.batchNo,usedDate:today()});
          }else{
            return C("old_stock").doc(s.id).update({qty:remaining.toFixed(2),usedInBatch:live.batchNo,lastUsedDate:today(),notes:`${s.notes||""} | Partial: ${used} used in ${live.batchNo}`.trim()});
          }
        });
        save({production:{...prodForm,oldStockUsed:desc,selectedOldStockIds:selectedOldStock.map(s=>s.id)}},isCorrection?live.status:"QC Pending",markUsed);
      }}>
      {live.production?<div style={{fontSize:"13px",color:"#94a3b8"}}>
        Produced: <strong style={{color:"#e2e8f0"}}>{live.production.actualQty} {live.unit}</strong> · Completed: {live.production.completionDate} · By: {live.production.producedBy}
        {live.production.oldStockUsed&&<div style={{fontSize:"12px",color:"#f59e0b",marginTop:"3px"}}>📦 Old stock used: {live.production.oldStockUsed}</div>}

        ?qcForm.result==="Pass"?"💾 Save Correction — Pass ✓":"💾 Save Correction — Fail ✗"

        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px"}}>
          {params.map(p=>{
            const val=qcForm[p.name]||"";

            const bc=r===true?"#22c55e":r===false?"#ef4444":"#1e293b";
            const hint=(p.min||p.max)?`${p.min||"—"} – ${p.max||"—"}`:"";

              <label style={{display:"block",fontSize:"11px",fontWeight:"600",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"4px"}}>

              </label>
              <div style={{position:"relative"}}>
                <input style={{...inp,borderColor:bc,paddingRight:r!==null?"32px":p.unit?"50px":"12px"}} value={val} onChange={e=>setQcForm({...qcForm,[p.name]:e.target.value})} placeholder={p.unit?`Enter ${p.unit}`:"Enter value"}/>

                {r!==null&&<span style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",fontSize:"14px",pointerEvents:"none"}}>{r?"✅":"❌"}</span>}
              </div>
            </div>;

        <Field label="Remarks"><textarea style={{...ta,minHeight:"50px"}} value={qcForm.remarks||""} onChange={e=>setQcForm({...qcForm,remarks:e.target.value})}/></Field>
      </div>}

          {!packForm.sizes.some(s=>s.qty&&s.qty!=="0")&&<div style={{background:"#422006",border:"1px solid #f59e0b40",borderRadius:"8px",padding:"9px 14px",marginBottom:"10px",fontSize:"12px",color:"#f59e0b"}}>

                  <div style={{fontSize:"12.5px",color:"#e2e8f0",fontWeight:"500"}}>{row.size}</div>

                      {row.qty}

        </div>;
      })()}
      saveLabel="Save & Mark Packed"
      onSave={()=>{const totalQty=packForm.sizes.reduce((sum,s)=>sum+((parseFloat(s.qty)||0)*(parseInt(s.pcs)||0)),0);save({packing:{...packForm,totalQty:totalQty.toFixed(1)}},"Packed");}}>
      {live.packing?<div>
        {live.packing.sizes?.filter(s=>parseInt(s.pcs)>0).length>0&&<div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"8px"}}>
          {live.packing.sizes.filter(s=>parseInt(s.pcs)>0).map(s=><span key={s.size} style={{fontSize:"11.5px",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"6px",padding:"3px 9px",color:"#94a3b8"}}>{s.size}: <strong style={{color:"#e2e8f0"}}>{s.pcs} packs</strong></span>)}
        </div>}
        <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
          {live.packing.totalQty&&<span style={{fontSize:"12px",fontWeight:"700",color:"#22c55e"}}>Total: {live.packing.totalQty} {live.unit}</span>}
          <span style={{fontSize:"11.5px",color:"#475569"}}>Packed: {live.packing.packingDate} · By: {live.packing.packedBy}</span>
          {live.packing.labelChecked&&<Bdg label={`Label: ${live.packing.labelChecked}`} color={live.packing.labelChecked==="Yes"?"#22c55e":"#f59e0b"} small/>}
          <Btn label="🖨 Print Packing Report" onClick={()=>window.print()} outline color="#38bdf8" small/>
        </div>
        {live.packing.remarks&&<div style={{marginTop:"5px",fontSize:"12px",color:"#475569",fontStyle:"italic"}}>{live.packing.remarks}</div>}
      </div>:<div style={{fontSize:"12px",color:"#334155",fontStyle:"italic"}}>Packing not started yet.</div>}
    </StageBox>

    </div>
  </div>;
}

// FILE STORAGE — Base64 in Firestore (no Firebase Storage needed)
// Images compressed via Canvas to keep size small
// ══════════════════════════════════════════════════════════

const compressImage=async(file,maxPx=900,quality=0.72)=>{
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxPx/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale);
        const h=Math.round(img.height*scale);
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL("image/jpeg",quality);
        resolve(dataUrl);
      };
      img.onerror=reject;
      img.src=ev.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
};

const fileToBase64=async(file,userEmail)=>{
  let dataUrl;
  if(file.type.startsWith("image/")){
    dataUrl=await compressImage(file);
  }else if(file.type.startsWith("video/")){
    // Videos too large for Firestore — store metadata only, ask user to share via WhatsApp
    return {name:file.name,type:file.type,size:file.size,url:null,isVideoStub:true,uploadedBy:userEmail,uploadedAt:today(),note:"Video too large to store inline — share via WhatsApp/email separately"};
  }else{
    // PDF/other — store as base64 if small enough
    if(file.size>800000)throw new Error(`File "${file.name}" is too large (${(file.size/1024/1024).toFixed(1)}MB). Max 800KB for non-image files. For photos, any size is fine.`);
    dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file);});
  }
  const sizeKB=Math.round(dataUrl.length*0.75/1024);
  return {name:file.name,type:file.type,size:file.size,sizeKB,url:dataUrl,uploadedBy:userEmail,uploadedAt:today()};
};

function FileAttachment({folder,existingFiles=[],onFilesChange,readOnly=false,maxFiles=5}){
  const [uploading,setUploading]=useState(false);
  const [error,setError]=useState("");
  const user=auth.currentUser;
  const fileRef=useRef(null);

  const handleSelect=async(e)=>{
    const files=[...e.target.files];
    if(!files.length)return;
    if(existingFiles.length+files.length>maxFiles){setError(`Max ${maxFiles} files allowed`);return;}
    setUploading(true);setError("");
    try{
      const processed=await Promise.all(files.map(f=>fileToBase64(f,user?.email||"")));
      onFilesChange([...existingFiles,...processed]);
    }catch(err){setError(err.message||"Processing failed");}
    setUploading(false);
    e.target.value="";
  };

  const removeFile=(idx)=>{onFilesChange(existingFiles.filter((_,i)=>i!==idx));};

  return <div>
    {!readOnly&&existingFiles.length<maxFiles&&<div style={{marginBottom:"8px"}}>
      <input ref={fileRef} type="file" accept="image/*,.pdf" multiple onChange={handleSelect} style={{display:"none"}}/>
      <button onClick={()=>fileRef.current?.click()} disabled={uploading}
        style={{background:"none",border:"1px dashed #334155",borderRadius:"7px",padding:"7px 14px",color:uploading?"#334155":"#64748b",cursor:uploading?"not-allowed":"pointer",fontSize:"12px",fontWeight:"600",display:"flex",alignItems:"center",gap:"6px"}}>
        {uploading?"⏳ Processing…":"📎 Add Photo / PDF"}
        <span style={{fontSize:"10px",color:"#334155"}}>({existingFiles.length}/{maxFiles}) — images auto-compressed</span>
      </button>
      {error&&<div style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"7px",padding:"8px 12px",color:"#fca5a5",fontSize:"12px",marginTop:"6px"}}>❌ {error}</div>}
    </div>}
    {existingFiles.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:"8px",marginTop:"6px"}}>
      {existingFiles.map((f,i)=>{
        const isImg=f.type?.startsWith("image/");
        const isPDF=f.type==="application/pdf";
        const isVideoStub=f.isVideoStub;
        return <div key={i} style={{position:"relative",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",overflow:"hidden",maxWidth:"160px"}}>
          {isImg&&f.url&&<img src={f.url} alt={f.name} style={{width:"140px",height:"100px",objectFit:"cover",display:"block"}}/>}
          {isPDF&&f.url&&<a href={f.url} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:"6px",padding:"10px 12px",color:"#93c5fd",fontSize:"12px",textDecoration:"none"}}>📄 {f.name.length>18?f.name.slice(0,18)+"…":f.name}</a>}
          {isVideoStub&&<div style={{padding:"10px 12px",fontSize:"11px",color:"#f59e0b"}}>🎥 {f.name.length>16?f.name.slice(0,16)+"…":f.name}<br/><span style={{fontSize:"10px",color:"#475569"}}>Share separately</span></div>}
          <div style={{padding:"3px 8px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:"9px",color:"#334155"}}>{f.sizeKB?`${f.sizeKB}KB`:""}</span>
            {!readOnly&&<button onClick={()=>removeFile(i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"14px",padding:"0 2px",flexShrink:0}}>×</button>}
          </div>
        </div>;
      })}
    </div>}
  </div>;
}

function ComplaintWorkspace({complaint,role,showToast}){
  const [live,setLive]=useState(complaint);
  const [editStage,setEditStage]=useState(null);
  const [saving,setSaving]=useState(false);
  const [qcResp,setQcResp]=useState({findings:"",action:"",responseDate:today(),respondedBy:""});
  const [salesResp,setSalesResp]=useState({feedback:"",resolved:"Yes",responseDate:today(),respondedBy:""});
  const [newStatus,setNewStatus]=useState(complaint.status);

  useEffect(()=>{
    const unsub=C("complaints").doc(complaint.id).onSnapshot(snap=>{
      if(snap.exists)setLive({id:snap.id,...snap.data()});
    });
    return unsub;
  },[complaint.id]);

  // Normalise: support both old single-object and new array format
  const qcResponses=live.qcResponses||(live.qcResponse?[live.qcResponse]:[]);
  const salesResponses=live.salesResponses||(live.salesResponse?[live.salesResponse]:[]);
  const currentRound=live.currentRound||1;
  const latestQC=qcResponses[qcResponses.length-1];
  const latestSales=salesResponses[salesResponses.length-1];
  // QC can respond if complaint is Open/Under Review/Re-Opened and no QC response for this round yet
  const roundQC=qcResponses.filter(r=>(r.round||1)===currentRound);
  const roundQCDone=roundQC.length>0;
  // Sales can respond if QC responded this round
  const roundSales=salesResponses.filter(r=>(r.round||1)===currentRound);
  const roundSalesDone=roundSales.length>0;

  // Days helper
  const daysBetween=(d1,d2)=>{
    if(!d1||!d2)return null;
    const diff=(new Date(d2)-new Date(d1))/(1000*60*60*24);
    return Math.round(diff);
  };
  const complaintDate=live.dateCreated||live._createdAt?.toDate?.()?.toISOString?.()?.slice(0,10)||"—";

  const saveQC=async()=>{
    if(!qcResp.findings.trim()&&!qcResp.action.trim())return showToast("Enter findings or action","error");
    setSaving(true);
    try{
      const entry={...qcResp,round:currentRound,respondedDate:today()};
      const updated=[...qcResponses,entry];
      await C("complaints").doc(complaint.id).update({qcResponses:updated,qcResponse:entry,status:"QC Responded"});
      setQcResp({findings:"",action:"",responseDate:today(),respondedBy:""});
      setEditStage(null);showToast("QC response saved ✓");
    }catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const saveSales=async()=>{
    setSaving(true);
    try{
      const needsMore=salesResp.resolved.includes("more");
      const entry={...salesResp,round:currentRound,respondedDate:today()};
      const updated=[...salesResponses,entry];
      const ns=needsMore?"Open":salesResp.resolved==="Yes"?"Resolved":"Closed";
      const updateData={salesResponses:updated,salesResponse:entry,status:ns};
      if(needsMore){
        // Re-open for next round
        updateData.currentRound=(currentRound||1)+1;
        updateData.reopenedAt=today();
      }
      await C("complaints").doc(complaint.id).update(updateData);
      setSalesResp({feedback:"",resolved:"Yes",responseDate:today(),respondedBy:""});
      setEditStage(null);
      showToast(needsMore?"Complaint re-opened for Round "+(currentRound+1)+" ✓":"Response saved ✓");
    }catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const saveStatus=async()=>{
    setSaving(true);
    try{
      await C("complaints").doc(complaint.id).update({status:newStatus});
      showToast("Status updated ✓");
    }catch(e){showToast("Error","error");}
    setSaving(false);
  };

  const sc=CS_COL[live.status]||"#94a3b8";
  const canQC=role==="admin"||role==="qc";
  const canSales=role==="admin"||role==="sales";
  const isOpen=["Open","Under Review"].includes(live.status);
  const isReopened=currentRound>1&&isOpen;

  // Days stats
  const daysToFirstQC=qcResponses[0]?.responseDate?daysBetween(complaintDate,qcResponses[0].responseDate):null;
  const daysToLatestQC=latestQC?.responseDate?daysBetween(complaintDate,latestQC.responseDate):null;

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px",gap:"8px"}}>
      <div>
        <div style={{fontSize:"20px",fontWeight:"400",fontFamily:"'DM Serif Display',serif",color:"#f1f5f9"}}>{live.customerName}</div>
        <div style={{fontSize:"12px",color:"#64748b",marginTop:"3px"}}>{live.productName} · Added by {live.addedBy}</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"4px"}}>
        <Bdg label={live.status} color={sc}/>
        {isReopened&&<span style={{fontSize:"10px",fontWeight:"700",color:"#f59e0b",background:"#f59e0b18",border:"1px solid #f59e0b30",padding:"2px 8px",borderRadius:"99px"}}>🔄 Round {currentRound}</span>}
      </div>
    </div>

    {/* Complaint details with dates */}
    <div style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:"3px solid #ef4444",borderRadius:"8px",padding:"14px 16px",marginBottom:"14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
        <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em"}}>📋 Complaint Details</div>
        <div style={{display:"flex",gap:"12px",fontSize:"11px",color:"#475569"}}>
          <span>📅 Raised: <strong style={{color:"#e2e8f0"}}>{complaintDate}</strong></span>
          {daysToLatestQC!==null&&<span>⏱ Response in: <strong style={{color:daysToLatestQC<=3?"#22c55e":daysToLatestQC<=7?"#f59e0b":"#ef4444"}}>{daysToLatestQC} day{daysToLatestQC!==1?"s":""}</strong></span>}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"10px"}}>
        {[["Product",live.productName],["Batch No",live.batchNo||"—"],["Month/Year",live.monthYear||"—"],["Invoice No",live.invoiceNo||"—"],["Material Available",live.materialAvailable||"—"],["Complaint By",live.addedBy]].map(([l,v])=><div key={l} style={{background:"#060b16",border:"1px solid #1e293b",borderRadius:"6px",padding:"7px 10px"}}>
          <div style={{fontSize:"10px",color:"#334155",fontWeight:"600",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"2px"}}>{l}</div>
          <div style={{fontSize:"12.5px",color:"#94a3b8"}}>{v}</div>
        </div>)}
      </div>
      <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"5px"}}>Complaint Description</div>
      <div style={{fontSize:"13.5px",color:"#cbd5e1",lineHeight:1.6,whiteSpace:"pre-wrap",marginBottom:"10px"}}>{live.complaint}</div>
      {(live.attachments||[]).length>0&&<div>
        <div style={{fontSize:"10px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"6px"}}>📎 Attachments</div>
        <FileAttachment folder="" existingFiles={live.attachments||[]} onFilesChange={()=>{}} readOnly={true}/>
      </div>}
    </div>

    {/* Response history — show all rounds */}
    {currentRound>1&&<div style={{background:"#0b1220",border:"1px solid #f59e0b30",borderRadius:"8px",padding:"12px 14px",marginBottom:"12px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"10px"}}>🔄 Response History ({currentRound-1} previous round{currentRound-1!==1?"s":""})</div>
      {Array.from({length:currentRound-1},(_,i)=>i+1).map(r=>{
        const rqc=qcResponses.filter(x=>(x.round||1)===r);
        const rs=salesResponses.filter(x=>(x.round||1)===r);
        const daysR=rqc[0]?.responseDate?daysBetween(complaintDate,rqc[0].responseDate):null;
        return <div key={r} style={{marginBottom:"10px",paddingBottom:"10px",borderBottom:"1px solid #1e293b"}}>
          <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",marginBottom:"6px"}}>Round {r}</div>
          {rqc.map((q,i)=><div key={i} style={{background:"#052e16",border:"1px solid #166534",borderRadius:"6px",padding:"8px 12px",marginBottom:"5px",fontSize:"12px",color:"#86efac"}}>

          </div>)}
          {rs.map((s,i)=><div key={i} style={{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"6px",padding:"8px 12px",fontSize:"12px",color:"#fca5a5"}}>
            <strong>Customer:</strong> {s.feedback} <span style={{color:"#f59e0b",marginLeft:"6px"}}>[{s.resolved}]</span> {s.responseDate&&<span style={{color:"#475569",marginLeft:"6px"}}>{s.responseDate}</span>}
          </div>)}
        </div>;
      })}
    </div>}

    {/* Current round QC Response */}
    <div style={{border:`1px solid ${roundQCDone?"#166534":canQC?"#2563eb30":"#1e293b"}`,borderRadius:"10px",marginBottom:"12px",overflow:"hidden"}}>
      <div style={{padding:"12px 16px",background:roundQCDone?"#052e16":canQC?"#060d1a":"#0b1220",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:"13px",fontWeight:"700",color:roundQCDone?"#22c55e":canQC?"#93c5fd":"#475569"}}>
          🔬 QC Response {currentRound>1?`(Round ${currentRound})`:""}
        </span>
        {canQC&&!roundQCDone&&editStage!=="qc"&&<Btn label="Add QC Response" onClick={()=>setEditStage("qc")} color="#2563eb" small/>}
      </div>
      {roundQCDone?<div style={{padding:"14px 16px",background:"#080d18"}}>
        {roundQC.map((q,i)=><div key={i}>
          {[["Findings",q.findings],["Action Taken",q.action],["Responded By",q.respondedBy],["Response Date",q.responseDate]].filter(([,v])=>v).map(([l,v])=><div key={l} style={{marginBottom:"8px"}}>
            <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"3px"}}>{l}</div>
            <div style={{fontSize:"13px",color:"#94a3b8",whiteSpace:"pre-wrap"}}>{v}</div>
          </div>)}
          {q.responseDate&&complaintDate!=="—"&&<div style={{fontSize:"11px",color:"#475569",background:"#0b1220",border:"1px solid #1e293b",borderRadius:"6px",padding:"5px 10px",display:"inline-flex",gap:"6px",marginTop:"4px"}}>

          <Btn label="Cancel" onClick={()=>setEditStage(null)} outline color="#475569" small/>
          <Btn label={saving?"Saving…":"Submit QC Response"} onClick={saveQC} disabled={saving} color="#22c55e" small/>
        </div>
      </div>:<div style={{padding:"12px 16px",background:"#080d18",fontSize:"12px",color:"#334155",fontStyle:"italic"}}>Awaiting QC investigation and response.</div>}
    </div>

    {/* Customer Response */}
    {(roundQCDone||(role==="admin"))&&<div style={{border:`1px solid ${roundSalesDone?"#166534":"#1e293b"}`,borderRadius:"10px",marginBottom:"12px",overflow:"hidden"}}>

        <span style={{fontSize:"13px",fontWeight:"700",color:roundSalesDone?"#22c55e":"#475569"}}>
          💼 Customer Response {currentRound>1?`(Round ${currentRound})`:""}
        </span>
        {canSales&&!roundSalesDone&&editStage!=="sales"&&roundQCDone&&<Btn label="Add Customer Response" onClick={()=>setEditStage("sales")} color="#a855f7" small/>}
      </div>
      {roundSalesDone?<div style={{padding:"14px 16px",background:"#080d18"}}>
        {roundSales.map((s,i)=><div key={i}>
          {[["Customer Feedback",s.feedback],["Response",s.resolved],["Response Date",s.responseDate],["By",s.respondedBy]].filter(([,v])=>v).map(([l,v])=><div key={l} style={{marginBottom:"8px"}}>
            <div style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:"3px"}}>{l}</div>
            <div style={{fontSize:"13px",color:l==="Response"&&s.resolved.includes("more")?"#f59e0b":"#94a3b8"}}>{v}</div>
          </div>)}
          {s.resolved.includes("more")&&<InfoBox color="#f59e0b">⚠️ Complaint re-opened for Round {(s.round||1)+1} — QC team must respond again.</InfoBox>}
        </div>)}
      </div>:editStage==="sales"?<div style={{padding:"14px 16px",background:"#080d18"}}>
        <Field label="Customer Feedback / Comments"><textarea style={{...ta,minHeight:"80px"}} value={salesResp.feedback} onChange={e=>setSalesResp({...salesResp,feedback:e.target.value})}/></Field>
        <Grid3>
          <Field label="Customer Satisfied?">
            <select style={{...sl,borderColor:salesResp.resolved.includes("more")?"#f59e0b":"#1e293b"}} value={salesResp.resolved} onChange={e=>setSalesResp({...salesResp,resolved:e.target.value})}>
              <option value="Yes">✅ Yes — Resolved</option>
              <option value="No — needs more action">⚠️ No — Needs More Action</option>
              <option value="Closed without resolution">🔴 Closed without resolution</option>
            </select>
          </Field>
          <Field label="Response Date"><input type="date" style={inp} value={salesResp.responseDate} onChange={e=>setSalesResp({...salesResp,responseDate:e.target.value})}/></Field>
          <Field label="Responded By"><input style={inp} value={salesResp.respondedBy} onChange={e=>setSalesResp({...salesResp,respondedBy:e.target.value})}/></Field>
        </Grid3>
        {salesResp.resolved.includes("more")&&<InfoBox color="#f59e0b">⚠️ Selecting this will re-open the complaint and notify QC for a new response in Round {currentRound+1}.</InfoBox>}
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <Btn label="Cancel" onClick={()=>setEditStage(null)} outline color="#475569" small/>
          <Btn label={saving?"Saving…":salesResp.resolved.includes("more")?"Re-open & Escalate":"Submit Response"} onClick={saveSales} disabled={saving} color={salesResp.resolved.includes("more")?"#f59e0b":"#a855f7"} small/>
        </div>
      </div>:<div style={{padding:"12px 16px",background:"#080d18",fontSize:"12px",color:"#334155",fontStyle:"italic"}}>Awaiting customer feedback from sales team.</div>}
    </div>}

    {/* Admin status override */}
    {role==="admin"&&<div style={{background:"#0b1220",border:"1px solid #1e293b",borderRadius:"8px",padding:"12px 14px"}}>
      <div style={{fontSize:"11px",fontWeight:"700",color:"#475569",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"8px"}}>🔑 Admin — Override Status</div>
      <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
        <select style={{...sl,flex:1}} value={newStatus} onChange={e=>setNewStatus(e.target.value)}>{COMPLAINT_STATUS.map(s=><option key={s}>{s}</option>)}</select>
        <Btn label={saving?"Saving…":"Update"} onClick={saveStatus} disabled={saving} color="#f59e0b" small/>
      </div>
    </div>}
  </div>;
}

function IngredientTable({rows,onChange}){
  const update=(i,f,v)=>onChange(rows.map((r,idx)=>idx===i?{...r,[f]:v}:r));
  return <div>
    <div style={{display:"grid",gridTemplateColumns:"2fr 80px 75px 2fr 24px",gap:"6px",marginBottom:"4px"}}>
      {["Material / Ingredient","Qty","Unit","Notes",""].map((h,i)=><div key={i} style={{fontSize:"10px",fontWeight:"700",color:"#334155",textTransform:"uppercase",letterSpacing:"0.07em",padding:"0 2px"}}>{h}</div>)}
    </div>
    {rows.map((r,i)=><div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 80px 75px 2fr 24px",gap:"6px",marginBottom:"6px"}}>
      <input style={sml} value={r.material} onChange={e=>update(i,"material",e.target.value)} placeholder="e.g. TiO2 R-902"/>
      <input style={sml} value={r.quantity} onChange={e=>update(i,"quantity",e.target.value)} placeholder="100"/>
      <select style={{...sml,padding:"6px 6px"}} value={r.unit} onChange={e=>update(i,"unit",e.target.value)}>{ING_UNITS.map(u=><option key={u}>{u}</option>)}</select>
      <input style={sml} value={r.notes} onChange={e=>update(i,"notes",e.target.value)} placeholder="Optional"/>
      <button onClick={()=>onChange(rows.filter((_,idx)=>idx!==i))} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:"15px",padding:0,alignSelf:"center"}}>×</button>
    </div>)}
    <button onClick={()=>onChange([...rows,{id:newId(),material:"",quantity:"",unit:"g",notes:""}])} style={{marginTop:"6px",background:"none",border:"1px dashed #1e293b",borderRadius:"7px",padding:"7px 14px",color:"#475569",cursor:"pointer",fontSize:"12px",fontWeight:"600",width:"100%"}}>+ Add Ingredient Row</button>
  </div>;
}

function TestReportCard({report,num,onDelete}){

  return <div style={{background:"#0b1220",border:"1px solid #1e293b",borderLeft:`3px solid ${rc}`,borderRadius:"8px",padding:"12px 14px",marginBottom:"8px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
        <span style={{fontSize:"11px",fontWeight:"700",color:"#475569",background:"#1e293b",padding:"2px 8px",borderRadius:"6px"}}>Report #{num}</span>
        {report.date&&<span style={{fontSize:"11px",color:"#475569"}}>📅 {report.date}</span>}
        {report.testedBy&&<span style={{fontSize:"11px",color:"#475569"}}>🔬 {report.testedBy}</span>}
      </div>
      <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
        <span style={{fontSize:"10px",color:"#475569",fontWeight:"600"}}>Test Result:</span>

        <button onClick={()=>onDelete(report.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"13px"}}>🗑</button>
